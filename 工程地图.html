    dbg('text');
} catch (e) { dbg('draw-err:' + e.message); }

/* ---- 项目标注 ---- */
const info = new AMap.InfoWindow({ isCustom: true, offset: new AMap.Pixel(0, -30) });
window.closeIw = () => info.close();

const markers = {};
DATA.forEach(d => {
    const m = new AMap.Marker({
        position: [d.lon, d.lat],
        content: `<div class="dot" style="background:${townColor[d.town]};--glow:${townColor[d.town]}"><span>${d.id}</span></div>`,
        anchor: 'bottom-center',
        title: `${d.town} · ${d.name}`,
    });
    m.on('click', () => openInfo(d));
    map.add(m);
    markers[d.id] = m;
});
dbg('markers:' + DATA.length);
// 只对标注点 fitView(不能用 null, 否则会把界外遮罩大矩形也算进视野)
map.setFitView(Object.values(markers), false, [60, 60, 60, 60]);

function openInfo(d) {
    info.setContent(`
      <div class="iw-card">
        <div class="iw-close" onclick="closeIw()">✕</div>
        <div class="t">${d.name}</div>
        <div class="m">属地：${d.town} ｜ 序号：${d.id}</div>
        <div class="m">地址：${d.addr}</div>
        <div class="c">${d.lon.toFixed(6)}, ${d.lat.toFixed(6)} (GCJ02)</div>
      </div>`);
    info.open(map, [d.lon, d.lat]);
}

document.getElementById('total').textContent = DATA.length;
dbg('ready');
</script>
</body>
</html>
