<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // FOUC 修复：提前根据 URL 参数加 bs-theme class，避免浅色闪屏
        (function(){
            if (new URLSearchParams(location.search).get('theme') === 'bigscreen') {
                document.documentElement.classList.add('bs-theme');
            }
        })();
    </script>
    <title>房屋建筑档案 - 房屋安全管理</title>
    <link rel="stylesheet" href="./all.min.css">
    <script src="../js/third-party-data.js"></script>
    <script src="../js/house-arch-data.js"></script>
    <script>
        // =========================================================
        // 房屋建筑档案状态联动数据层（已接入 house-arch-data.js 统一数据层）
        // =========================================================

        function getUrlParam(key) {
            return new URLSearchParams(location.search).get(key) || '';
        }

        // 数据模式：'draft'（草稿，风险档案总览嵌入用，可编辑） / 'publish'（发布，房屋建筑档案入口，只读）
        // 兼容旧参数 readonly=1 → 视为 publish
        function getDataMode() {
            const m = getUrlParam('mode');
            if (m === 'draft' || m === 'publish') return m;
            if (getUrlParam('readonly') === '1') return 'publish';
            return 'publish'; // 默认发布区（只读）
        }
        const DATA_MODE = getDataMode();
        const IS_DRAFT_MODE = DATA_MODE === 'draft';

        // 只读模式：publish 模式下隐藏所有编辑入口
        (function applyReadonlyMode() {
            if (!IS_DRAFT_MODE) {
                const apply = function() {
                    document.body.classList.add('readonly-mode');
                    // 底部文案：“查看/编辑”→“查看”
                    document.querySelectorAll('.mode-label').forEach(function(el) { el.textContent = '查看'; });
                };
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', apply);
                } else {
                    // script 在 body 末尾，DOM 已 ready 但 renderContent 尚未执行，延迟到下一帧
                    setTimeout(apply, 0);
                }
            }
        })();

        // 草稿模式下显示同步按钮，绑定推送逻辑
        (function setupSyncButton() {
            if (!IS_DRAFT_MODE) return;
            const show = function() {
                const btn = document.getElementById('syncBtn');
                if (btn) btn.style.display = '';
            };
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', show);
            } else { show(); }
        })();

        // 同步草稿到发布区（房屋建筑档案）
        function syncToPublish() {
            const no = getCurrentHouseNo();
            if (typeof publishDraftRecord !== 'function') { alert('数据层未就绪'); return; }
            // 先把内存里最新的字段保存到草稿，再推送
            if (typeof saveCurrentHouseArch === 'function' && typeof currentHouseArch !== 'undefined') {
                saveCurrentHouseArch(currentHouseArch);
            }
            if (!confirm('确认将当前修改更新到房屋建筑档案？\n更新后房屋建筑档案将显示本记录的最新内容。')) return;
            const r = publishDraftRecord(no, 'user');
            if (r && r.ok) {
                alert('✅ 已更新到房屋建筑档案');
                // 通知外层列表刷新状态
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ action: 'draftSynced', no: no }, '*');
                }
            } else {
                alert('❌ 同步失败：' + (r && r.msg ? r.msg : '未知错误'));
            }
        }

        // 返回列表页：框架内则通知外层切回登记表列表，独立打开则后退
        // 携带来源类别参数，让列表页保持上次的农村/城镇TAB选中
        function goBackToList() {
            // 嵌入模式（草稿或只读）：来自风险档案总览嵌入层，通知外层关闭嵌入即可
            if (IS_DRAFT_MODE || getUrlParam('readonly') === '1') {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ action: 'closeDetailEmbed' }, '*');
                    return;
                }
            }
            const cat = getUrlParam('category') || (currentHouseArch && currentHouseArch.houseType) || '';
            const catQ = cat ? ('?category=' + encodeURIComponent(cat)) : '';
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ action: 'navigate', url: 'pages/hs-register.html' + catQ }, '*');
            } else {
                window.location.href = 'hs-register.html' + catQ;
            }
        }

        function getCurrentHouseNo() {
            const no = getUrlParam('no');
            if (no) return no;
            return getUrlParam('id') || 'NF-2025-00001';
        }

        // 兼容：house-arch-detail 原有局部函数优先调用统一数据层
        // 根据 DATA_MODE 选择读草稿区还是发布区
        function getCurrentHouseArch() {
            initHouseArchSeed();
            const no = getCurrentHouseNo();
            let rec;
            if (IS_DRAFT_MODE && typeof getDraftRecord === 'function') {
                rec = getDraftRecord(no); // 草稿区（无草稿自动回落到发布区）
            } else {
                rec = getHouseRecord(no); // 发布区
            }
            if (!rec) {
                rec = JSON.parse(JSON.stringify(DEFAULT_HOUSE_STATUS));
                rec.no = no;
                ensureHouseRecord(no);
            }
            ['manageRecords','projectRecords','qualityTrace','qualityChecks'].forEach(k => {
                if (!Array.isArray(rec[k])) rec[k] = [];
            });
            // 应急处置：应急事件记录（旧版预案/演练数据结构一次性迁移，2026-10-17）
            if (!Array.isArray(rec.emergencyEvents)) {
                const old = (rec.emergencyResponse && Array.isArray(rec.emergencyResponse.drillRecords)) ? rec.emergencyResponse.drillRecords : [];
                rec.emergencyEvents = old.map(d => ({
                    eventDate: d.drillDate || '',
                    eventName: d.drillContent || '',
                    eventType: '其他',
                    disposal: '',
                    handler: d.drillOrg || '',
                    remark: d.remark || ''
                }));
            }
            if (rec.emergencyEvents.length === 0) {
                rec.emergencyEvents.push({
                    eventDate: '2024-07-11',
                    eventName: '房屋安全隐患应急疏散演练',
                    eventType: '其他',
                    disposal: '疏散群众 13 人，隐患区域完成围挡封闭',
                    handler: '南桥镇应急管理办',
                    remark: '处置完成，达到预期效果'
                });
            }
            // 阶段性验收：在 projectRecords[0] 上挂默认字段（仅当缺失）
            if (!rec.projectRecords.length) rec.projectRecords.push({ id: 'PRJ-' + no + '-001' });
            const prj0 = rec.projectRecords[0];
            if (prj0.acceptMethod === undefined) prj0.acceptMethod = '现场验收';
            if (prj0.hasAppraisalAfter === undefined) prj0.hasAppraisalAfter = '是';
            if (prj0.thirdPartyResult === undefined) prj0.thirdPartyResult = '待复核';
            if (prj0.manager === undefined) prj0.manager = rec.responsiblePerson || '张伟';
            if (prj0.phone === undefined) prj0.phone = '13600001234';
            if (prj0.acceptRemark === undefined) prj0.acceptRemark = '按计划推进整治';
            if (prj0.reporter === undefined) prj0.reporter = rec.responsiblePerson || '李志强';
            if (prj0.acceptReportTime === undefined) prj0.acceptReportTime = '2024-09-30 10:00';
            if (!Array.isArray(prj0.rectifyPhotos)) prj0.rectifyPhotos = [];
            if (!Array.isArray(prj0.relatedFiles)) prj0.relatedFiles = [];
            // 验收销项：closeInfo 默认值
            if (!rec.closeInfo || typeof rec.closeInfo !== 'object') rec.closeInfo = {};
            const ci = rec.closeInfo;
            const isDoneDef = rec.governance === 'done';
            if (ci.closeMethod === undefined) ci.closeMethod = isDoneDef ? '工程整治销项' : '—';
            if (ci.hazardEliminated === undefined) ci.hazardEliminated = isDoneDef ? '是' : '—';
            if (ci.appraisalAfter === undefined) ci.appraisalAfter = (rec.appraisalReports || []).length ? '是' : '—';
            if (ci.thirdPartyResult === undefined) ci.thirdPartyResult = isDoneDef ? '复核合格' : '—';
            if (ci.contactName === undefined) ci.contactName = prj0.manager || rec.responsiblePerson || '王建国';
            if (ci.contactPhone === undefined) ci.contactPhone = prj0.phone || rec.managerPhone || '13956781234';
            if (ci.infoUpdated === undefined) ci.infoUpdated = '—';
            if (ci.remark === undefined) ci.remark = '已落实封控警示措施';
            if (ci.reporter === undefined) ci.reporter = prj0.reporter || rec.responsiblePerson || '王建国';
            if (ci.reportTime === undefined) ci.reportTime = rec.closeApplyTime || '2025-02-02';
            if (!Array.isArray(ci.completeCertFiles)) ci.completeCertFiles = [];
            if (!Array.isArray(ci.expertOpinionFiles)) ci.expertOpinionFiles = [];
            if (!Array.isArray(ci.afterPhotos)) ci.afterPhotos = [];
            if (!Array.isArray(ci.relatedFiles)) ci.relatedFiles = [];
            if (!Array.isArray(prj0.implementPhotos)) prj0.implementPhotos = [];
            if (!Array.isArray(prj0.completePhotos)) prj0.completePhotos = [];
            // 工程措施：projectRecords[0] 默认值（仅当缺失）
            if (prj0.taskNo === undefined) prj0.taskNo = 'NF-2025-00001';
            if (prj0.projectName === undefined) prj0.projectName = '基础加固';
            if (prj0.measureType === undefined) prj0.measureType = '基础加固';
            if (prj0.implementScope === undefined) prj0.implementScope = '整栋房屋';
            if (prj0.policyPath === undefined) prj0.policyPath = '区级修缮工程补贴';
            if (prj0.otherPolicyPath === undefined) prj0.otherPolicyPath = '—';
            if (prj0.planDetail === undefined) prj0.planDetail = '—';
            if (prj0.startDate === undefined) prj0.startDate = '2024-10-03';
            if (prj0.endDate === undefined) prj0.endDate = '—';
            if (prj0.company === undefined) prj0.company = '华建工程公司';
            if (prj0.manager === undefined) prj0.manager = '陈明华';
            if (prj0.phone === undefined) prj0.phone = '13600001234';
            if (prj0.budget === undefined) prj0.budget = '1.08';
            if (prj0.fundSource === undefined) prj0.fundSource = '区级修缮补贴60%+业主自筹40%';
            if (prj0.acceptConclusion === undefined) prj0.acceptConclusion = '—';
            if (prj0.acceptUnit === undefined) prj0.acceptUnit = '—';
            if (prj0.acceptChecker === undefined) prj0.acceptChecker = '—';
            if (prj0.acceptDate === undefined) prj0.acceptDate = '—';
            if (prj0.status === undefined) prj0.status = '进行中';
            if (prj0.remark === undefined) prj0.remark = '施工进行中，进度约50%';
            if (prj0.reporter === undefined) prj0.reporter = '陈明华';
            if (prj0.reportTime === undefined) prj0.reportTime = '2024-10-03 08:00';
            if (!Array.isArray(prj0.planFiles)) prj0.planFiles = [];
            if (!Array.isArray(prj0.designFiles)) prj0.designFiles = [];
            if (!Array.isArray(prj0.orgDesignFiles)) prj0.orgDesignFiles = [];
            if (!Array.isArray(prj0.safetyFiles)) prj0.safetyFiles = [];
            if (!Array.isArray(prj0.baseAcceptFiles)) prj0.baseAcceptFiles = [];
            if (!Array.isArray(prj0.mainAcceptFiles)) prj0.mainAcceptFiles = [];
            if (!Array.isArray(prj0.materialFiles)) prj0.materialFiles = [];
            if (!Array.isArray(prj0.completeReportFiles)) prj0.completeReportFiles = [];
            if (!Array.isArray(prj0.rectifyPhotos)) prj0.rectifyPhotos = [];
            // 农村专属页: 强制 houseType 为农村(路由/兜底以此为准, 不受表单房屋性质影响)
            rec.houseType = '农村自建房';
            // ===== 流程字段直接常驻根级（轮次模型已拆除）=====
            // 字段库初始化：仅当记录尚无字段库时才用当前模块值 dump（避免静态种子覆盖记录已保存的字段库）
            try { if (typeof dumpFieldsLibrary === 'function' && (!rec._fieldsLibrary || !rec._fieldsLibrary.basic_RURAL)) rec._fieldsLibrary = dumpFieldsLibrary(); } catch (e) {}
            // v2：风险记录自动派生 + 治理事件（幂等）
            try { syncRiskRecords(rec); } catch (e) {}
            try { ensureGovernanceEvents(rec); } catch (e) {}
            // 隐患台账迁移（幂等）：治理事件 → 隐患记录
            try { migrateToHazardLedger(rec); } catch (e) {}
            // 第二类治理链回补（幂等）：历史第二类风险记录补隐患+治理事件
            try { backfillSecondClassHazards(rec); } catch (e) {}
            // 一栋一策（幂等）：事件级措施/整治情况/计划 → 房屋级
            try { migrateGovernanceToHouseLevel(rec); } catch (e) {}
            // 阶段性整治计划（幂等）：housePlanRow → planRecords[]
            try { migratePlanToRecords(rec); } catch (e) {}
            // 安全鉴定/安全评估（幂等）：table_RURAL.assessment.rows[0] / evaluation.rows[0] → assessmentRecords[] / evaluationRecords[]
            try { migrateAssessmentToRecords(rec); } catch (e) {}
            // 隐患控制情况（幂等）：manageRecords[0] 单条 → controlRecords[] 多条
            try { migrateControlToRecords(rec); } catch (e) {}
            // 整治措施阶段化（幂等）：rectifySituation + 措施记录 → measureStages[]
            try { migrateMeasureToStages(rec); } catch (e) {}
            // 方案B：把当前治理事件 ev.data 展开到根级（治理 TAB 渲染读）
            try { __applyGovernanceEventView(rec); } catch (e) {}
            return rec;
        }

        // 字段库 → 根级字段映射（保存时同步）
        function syncLibToRootFields(record) {
            if (!record || !record._fieldsLibrary) return record;
            const lib = record._fieldsLibrary;
            const jbxx = lib.basic_RURAL?.jbxx || lib.basic_URBAN?.jbxx || [];
            function getVal(label) {
                const r = jbxx.find(row => row[0] === label);
                return r ? r[1] : undefined;
            }
            // 产权人 / 使用人信息 → owner
            const owner = getVal('产权人 / 使用人信息');
            if (owner !== undefined && owner !== '—') record.owner = owner;
            // 所在区域 → street（去掉"奉贤区"前缀）
            const area = getVal('所在区域');
            if (area !== undefined && area !== '—') {
                record.street = area.replace(/^奉贤区/, '');
            }
            // 房屋性质 → houseType
            const ht = getVal('房屋性质');
            if (ht !== undefined && ht !== '—') record.houseType = ht;
            // 路号信息 → address
            const addr = getVal('路号信息');
            if (addr !== undefined && addr !== '—') record.address = addr;
            return record;
        }

        function saveCurrentHouseArch(status) {
            const no = getCurrentHouseNo();
            // 同步字段库到根级字段
            status = syncLibToRootFields(status);
            // 方案B/B1：先把根级治理字段写回"当前"治理事件 ev.data
            // （必须在 syncRiskRecords/ensureGovernanceEvents 之前——它们可能新建事件改变 currentGovernanceEventId）
            // B1：writeback 前 dump 字段库，确保 ev.data._lib 捕获模块级最新编辑
            try { if (typeof dumpFieldsLibrary === 'function') status._fieldsLibrary = dumpFieldsLibrary(); } catch (e) {}
            try { __writeBackGovernanceEventView(status); } catch (e) {}
            // ===== 流程字段直接以根级为准（轮次模型已拆除）=====
            // v2：保存时同步派生风险记录 + 治理事件（幂等）
            try { syncRiskRecords(status); } catch (e) {}
            try { ensureGovernanceEvents(status); } catch (e) {}
            // 治理状态按隐患台账派生写回（有台账时以台账为准）
            try { const __gs = deriveGovernStatusFromHazards(status); if (__gs) status.governStatus = __gs; } catch (e) {}
            if (IS_DRAFT_MODE && typeof setDraftRecord === 'function') {
                setDraftRecord(no, status); // 草稿区
            } else {
                const all = getHouseArchStorage();
                all[no] = status;
                setHouseArchStorage(all); // 发布区
            }
        }

        function generateArchId(prefix) {
            const d = new Date();
            const pad = n => n < 10 ? '0' + n : n;
            const ts = d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '-' +
                       pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
            return prefix + '-' + ts + '-' + Math.floor(Math.random()*900 + 100);
        }

        /* ==================== 流程字段（轮次模型已拆除，直接常驻根级）====================
         * 发现类字段 inspectionRecords/patrolRecords/riskInfo/riskClassification/riskIdentification
         * 与字段库 survey_RURAL 均直接读写根级，不再有轮次快照。
         * 治理链字段由 governanceEvents 按第二类/第三类风险记录驱动（方案B；安全鉴定/评估由触发条件决定，非类别专属）。
         * ==================================================================== */

        // 深拷贝工具（undefined 安全）
        function __deepClone(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }

        // 2026-10-17 全局转义工具：用户输入拼接进 HTML/属性/onclick 前使用
        function escapeHtml(v) {
            return String(v === undefined || v === null ? '' : v)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        // 用于拼进单引号包裹的 JS 字符串实参（如 onclick="fn('...')"）：转义反斜杠、单双引号、换行、< 防脚本标签闭合
        function escapeJsStr(v) {
            return String(v === undefined || v === null ? '' : v)
                .replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"')
                .replace(/\r?\n/g, '\\n').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029')
                .replace(/</g, '\\x3c');
        }

        /* ==================== 风险发现→风险信息记录→治理事件（v2 模型）====================
         * 业务规则：
         * - 风险发现 = 排查登记(inspectionRecords) + 动态巡查(patrolRecords)，两条独立途径，各自多次
         * - 每次发现自动生成一条风险信息记录(riskRecords)，风险等级=当次结论（三类口径）
         * - 第二类/第三类结论触发治理链；安全鉴定/评估由触发条件决定（非类别专属）；治理数据按"治理事件"(governanceEvents)挂载
         * - 应急处置保留根级，独立多事件
         * ==================================================================== */

        // 结论三类枚举（排查/巡查统一）
        const RISK_CONCLUSION_ENUMS = ['未发现安全隐患(第一类)', '存在一定安全隐患(第二类)', '存在严重安全隐患(第三类)'];
        // 结论 → 风险等级
        function conclusionToLevel(c) {
            const s = String(c || '');
            if (s.indexOf('第一类') >= 0) return '第一类';
            if (s.indexOf('第二类') >= 0) return '第二类';
            if (s.indexOf('第三类') >= 0) return '第三类';
            // 兼容旧巡查结论口径
            if (s === '发现隐患' || s === '需整改') return '第二类';
            return '';
        }
        // 巡查结论归一化（旧值"正常/发现隐患/需整改"→ 三类口径）
        function normalizePatrolConclusion(r) {
            if (!r) return '';
            if (r.conclusion) return r.conclusion;
            const v = r.result || '';
            if (v === '正常') return '未发现安全隐患(第一类)';
            if (v === '发现隐患') return '存在一定安全隐患(第二类)';
            if (v === '需整改') return '存在严重安全隐患(第三类)';
            return v;
        }

        // 风险信息记录唯一编号
        function generateRiskRecordId() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return 'RR-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '-' + Math.floor(Math.random() * 900 + 100);
        }

        // 由"排查登记"记录派生风险信息记录字段
        function __riskRecordFromInspection(rec, r, roundNo) {
            return {
                id: generateRiskRecordId(),
                sourceType: '排查',
                sourceId: r.id || '',
                roundNo: roundNo || 0,
                date: (r.checkDate || r.inspectDate || r.reportTime || ''),
                person: r.checker || r.inspectPerson || '',
                org: r.town || r.checkOrg || '',
                conclusion: r.preliminaryJudge || r.checkResult || r.inspectResult || '',
                riskLevel: conclusionToLevel(r.preliminaryJudge || r.checkResult || r.inspectResult),
                hazardDesc: r.otherRisk || r.hazardDesc || '',
                location: r.location || '',
                photos: r.photos || '',
                createdAt: new Date().toISOString()
            };
        }
        // 由"动态巡查"记录派生风险信息记录字段
        function __riskRecordFromPatrol(rec, r, roundNo) {
            const conclusion = normalizePatrolConclusion(r);
            return {
                id: generateRiskRecordId(),
                sourceType: '巡查',
                sourceId: r.id || '',
                roundNo: roundNo || 0,
                date: (r.patrolDate || ''),
                person: r.patrolPerson || '',
                org: r.patrolOrg || '',
                conclusion: conclusion,
                riskLevel: conclusionToLevel(conclusion),
                hazardDesc: r.foundProblems || r.hazardDesc || '',
                location: r.patrolPointCoord || '',
                photos: r.photos || '',
                createdAt: new Date().toISOString()
            };
        }

        // 确保 rec.riskRecords[] 与发现记录同步（每次发现=1条风险记录，幂等）
        function syncRiskRecords(rec) {
            if (!rec) return;
            if (!Array.isArray(rec.riskRecords)) rec.riskRecords = [];
            const roundNo = 1; // 轮次模型已拆除，统一记为 1
            const seen = {};
            rec.riskRecords.forEach(function(rr) { if (rr.sourceType && rr.sourceId) seen[rr.sourceType + '|' + rr.sourceId] = true; });
            // 排查登记：无 id 的补 id
            (rec.inspectionRecords || []).forEach(function(r, i) {
                if (!r.id) r.id = 'INS-' + (rec.no || 'X') + '-' + String(i + 1).padStart(3, '0');
                if (!seen['排查|' + r.id]) {
                    rec.riskRecords.push(__riskRecordFromInspection(rec, r, roundNo));
                    seen['排查|' + r.id] = true;
                }
            });
            // 动态巡查：无 id 的补 id
            (rec.patrolRecords || []).forEach(function(r, i) {
                if (!r.id) r.id = 'PAT-' + (rec.no || 'X') + '-' + String(i + 1).padStart(2, '0');
                if (!seen['巡查|' + r.id]) {
                    rec.riskRecords.push(__riskRecordFromPatrol(rec, r, roundNo));
                    seen['巡查|' + r.id] = true;
                }
            });
        }

        // 治理事件：第二类/第三类风险记录生成（安全鉴定/评估由触发条件决定）
        function ensureGovernanceEvents(rec) {
            if (!rec) return;
            if (!Array.isArray(rec.governanceEvents)) rec.governanceEvents = [];
            const govRrs = (rec.riskRecords || []).filter(function(rr) { return rr.riskLevel === '第三类' || rr.riskLevel === '第二类'; });
            govRrs.forEach(function(rr) {
                const exists = rec.governanceEvents.some(function(ev) { return ev.riskRecordId === rr.id; });
                if (!exists) {
                    rec.governanceEvents.push({
                        eventId: 'GE-' + rr.id,
                        riskRecordId: rr.id,
                        roundNo: rr.roundNo || 0,
                        createdAt: new Date().toISOString(),
                        status: '待治理',
                        // 治理链数据（方案B：扁平结构，字段见 GOVERNANCE_EVENT_FIELDS；空表示尚未录入）
                        data: {}
                    });
                }
            });
            // 当前治理事件 id（默认最新一条）
            if (!rec.currentGovernanceEventId && rec.governanceEvents.length) {
                rec.currentGovernanceEventId = rec.governanceEvents[rec.governanceEvents.length - 1].eventId;
            }
        }

        // 第一类（未发现安全隐患）判定：
        //   有至少一条风险记录 + 无任何第二类/第三类在管记录 + 最新一条记录为第一类
        // 满足时：隐患台账/鉴定/评估/计划/措施/验收/销号 各模块入口保留，但页面显示"第一类无需治理"提示
        function isCurrentlyFirstClass(rec) {
            const rrs = (rec && rec.riskRecords) || [];
            if (!rrs.length) return false;
            const hasActive = rrs.some(function(rr) { return rr.riskLevel === '第二类' || rr.riskLevel === '第三类'; });
            if (hasActive) return false;
            const sorted = rrs.slice().sort(function(a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
            return sorted[0] && sorted[0].riskLevel === '第一类';
        }
        // 第一类提示语（统一口径）
        function firstClassHintHTML(itemTitle) {
            return '<div class="record-empty" style="padding:60px 20px;text-align:center;">' +
                '<i class="fas fa-check-circle" style="font-size:28px;color:#52c41a;display:block;margin-bottom:14px;"></i>' +
                '<b style="color:#52c41a;">第一类（未发现安全隐患）</b><br>' +
                '<span style="font-size:12px;color:#909399;">不入隐患台账、不做鉴定（经营性除外）、不整治、不销号；' +
                (itemTitle ? '无需进行「' + itemTitle + '」<br>' : '<br>') +
                '房屋状况可能变化，后续如排查出新隐患，相关流程自动启用</span>' +
            '</div>';
        }

        /* ==================== 隐患台账（hazard ledger）====================
         * 隐患是一等公民：挂房屋，不挂排查；每条隐患独立 ID/状态/动态流水。
         * 排查是跟踪动作：通过 linkedHazardIds 关联既有隐患，不再每次重建快照。
         * 治理事件挂 hazardId（不再挂 riskRecordId）。
         * ==================================================================== */

        // 隐患编号：HZ-{房屋编号}-{3位序号}
        function generateHazardId(rec, seq) {
            const no = (rec && rec.no) || 'X';
            return 'HZ-' + no + '-' + String(seq || 1).padStart(3, '0');
        }
        // 动态流水编号：DYN-{隐患编号}-{3位序号}
        function generateHazardDynId(hazardId, seq) {
            return 'DYN-' + hazardId + '-' + String(seq || 1).padStart(3, '0');
        }

        // 隐患状态枚举：未管控/管控中/整治中/已销号
        const HAZARD_STATUS = {
            UNCONTROLLED: '未管控',
            CONTROLLED: '管控中',
            RECTIFYING: '整治中',
            CLOSED: '已销号'
        };

        // 从旧数据迁移到隐患台账（幂等，版本化：_hazardLedgerVersion 低于当前版本时重跑补齐字段）
        // 规则：
        //   - 每个挂 riskRecordId 的治理事件 → 一条 hazardRecord（initialJudge=第三类）
        //   - ev.data.addDanger.types[] 每个类型 → 一条独立 hazardRecord
        //   - 为每条隐患生成"登记"动态流水
        //   - riskRecords[i].linkedHazardIds 回填
        // 版本历史：v1 初版；v2 补齐源记录全量字段（sourceSnapshot/责任人/证明材料等）
        const HAZARD_LEDGER_VERSION = 2;
        function migrateToHazardLedger(rec) {
            if (!rec) return;
            const curVer = rec._hazardLedgerVersion || (rec._hazardLedgerMigrated ? 1 : 0);
            if (curVer >= HAZARD_LEDGER_VERSION) return; // 已是最新
            // 低于当前版本：清掉旧迁移产物重跑（治理事件 hazardId 关联一并重置）
            if (curVer > 0) {
                rec.hazardRecords = [];
                rec.hazardDynamics = [];
                (rec.governanceEvents || []).forEach(function(ev){ delete ev.hazardId; });
                (rec.riskRecords || []).forEach(function(rr){ delete rr.linkedHazardIds; delete rr.newHazardIds; });
            }
            if (!Array.isArray(rec.hazardRecords)) rec.hazardRecords = [];
            if (!Array.isArray(rec.hazardDynamics)) rec.hazardDynamics = [];

            const events = rec.governanceEvents || [];
            const riskRecords = rec.riskRecords || [];
            const inspections = rec.inspectionRecords || [];
            const patrols = rec.patrolRecords || [];
            let seq = rec.hazardRecords.length;

            // 辅助：根据 rr.sourceId 找到排查/巡查记录
            function findSourceRecord(rr) {
                if (!rr || !rr.sourceId) return null;
                const pool = rr.sourceType === '巡查' ? patrols : inspections;
                return pool.find(function(x){ return x.id === rr.sourceId; }) || null;
            }

            events.forEach(function(ev) {
                const rr = riskRecords.find(function(r){ return r.id === ev.riskRecordId; });
                if (!rr) return;
                const src = findSourceRecord(rr) || {};
                const addDanger = (ev.data && ev.data.addDanger) || {};
                const types = Array.isArray(addDanger.types) && addDanger.types.length
                    ? addDanger.types
                    : [rr.hazardDesc || '安全隐患']; // 无明细类型时兜底一条

                const linkedIds = [];
                types.forEach(function(type) {
                    seq += 1;
                    const hid = generateHazardId(rec, seq);
                    linkedIds.push(hid);
                    const photosByType = (addDanger.photosByType && addDanger.photosByType[type]) || '';
                    const photosArr = (typeof photosByType === 'string' ? photosByType.split('\n') : (Array.isArray(photosByType) ? photosByType : [])).filter(Boolean);
                    // 源记录全量字段快照（排查/巡查字段名不一，统一收进 sourceSnapshot，不丢字段）
                    const snapshot = __deepClone(src);
                    const hz = {
                        id: hid,
                        houseNo: rec.no || '',
                        createdAt: rr.date || rr.createdAt || src.checkDate || src.patrolDate || '',
                        createdBy: rr.person || src.checker || src.patrolPerson || '',
                        sourceType: rr.sourceType || '排查',
                        sourceId: rr.sourceId || '',
                        // ===== 隐患主体字段 =====
                        hazardType: type,
                        hazardTypeOther: (type === '其他安全问题' ? (addDanger.typesOther || '') : ''),
                        location: src.damagePart || src.damageLocation || '',
                        description: rr.hazardDesc || src.otherRisk || src.foundProblem || src.hazardDesc || '',
                        photos: photosArr,
                        initialJudge: rr.riskLevel || '第三类',
                        currentLevel: rr.riskLevel || '第三类',
                        currentStatus: (ev.data && ev.data.closeStatus === '已通过') ? HAZARD_STATUS.CLOSED : HAZARD_STATUS.RECTIFYING,
                        controlMeasure: '',
                        controlUpdatedAt: '',
                        closedAt: (ev.data && ev.data.closeStatus === '已通过') ? (ev.data.closeAuditTime || '') : '',
                        closeAuditId: '',
                        // ===== 源记录上下文（不丢字段：结构状况/堆载/鉴定安排/责任人等）=====
                        structureStatus: src.structureStatus || '',        // 结构状况
                        overload: src.overload || '',                      // 增加堆载
                        checkConclusion: src.checkConclusion || src.conclusion || '', // 排查结论原文
                        preliminaryJudge: src.preliminaryJudge || src.preliminary || '', // 初步判定
                        coordinates: src.location || '',                   // 坐标（非损伤部位）
                        preAppraisal: src.preAppraisal || '',              // 是否整治前鉴定
                        noAppraisalReason: src.noAppraisalReason || '',    // 未鉴定原因
                        proofFiles: (typeof src.proofFiles === 'string' ? src.proofFiles.split('\n') : (src.proofFiles || [])).filter(Boolean), // 证明材料
                        remark: src.remark || '',                          // 备注
                        dutyPerson: src.dutyPerson || '', dutyPhone: src.dutyPhone || '',     // 安全责任人
                        ownerName: src.ownerName || '', ownerPhone: src.ownerPhone || '',     // 产权人
                        safetyName: src.safetyName || '', safetyPhone: src.safetyPhone || '', // 安全监管责任人
                        checkOrg: src.checkOrg || src.patrolOrg || '',     // 排查/巡查单位
                        town: src.town || '',                              // 街镇
                        reporter: src.reporter || '', reportTime: src.reportTime || '', // 填报
                        sourceSnapshot: snapshot,                          // 源记录完整快照（兜底）
                        taskFlows: [],                                     // 任务索引（2026-10-19 三层档案改造新增）
                        _legacyEventId: ev.eventId // 迁移期保留旧事件引用
                    };
                    rec.hazardRecords.push(hz);
                    // 治理事件改挂 hazardId（保留 riskRecordId 作兼容）
                    ev.hazardId = hid;
                    // 登记动态流水
                    rec.hazardDynamics.push({
                        id: generateHazardDynId(hid, 1),
                        hazardId: hid,
                        actionType: '登记',
                        actionTime: hz.createdAt,
                        operator: hz.createdBy,
                        org: hz.checkOrg || hz.town || '',
                        content: hz.description || ('登记隐患：' + type),
                        conclusion: hz.preliminaryJudge || '确认安全隐患',
                        levelAfter: hz.initialJudge,
                        photos: photosArr.slice(),
                        sourceType: hz.sourceType,
                        sourceId: hz.sourceId
                    });
                });
                // 回填 riskRecord 的关联隐患（linkedHazardIds 旧字段保留 + hazardLinks 结构化关联）
                if (linkedIds.length) {
                    rr.linkedHazardIds = (rr.linkedHazardIds || []).concat(linkedIds);
                    rr.newHazardIds = (rr.newHazardIds || []).concat(linkedIds);
                    rr.hazardLinks = rr.hazardLinks || [];
                    linkedIds.forEach(function(hid) {
                        if (!rr.hazardLinks.some(function(l){ return l.hazardId === hid; })) {
                            rr.hazardLinks.push({ hazardId: hid, role: '登记', dynamicId: generateHazardDynId(hid, 1) });
                        }
                    });
                }
            });

            // D：治理事件轮次锚点回填（同 rr 下第几条隐患 → 第几轮）
            const rrSeen = {};
            events.forEach(function(ev) {
                if (!ev.hazardId) return;
                const key = ev.riskRecordId || '';
                rrSeen[key] = (rrSeen[key] || 0) + 1;
                if (ev.hazardRoundNo === undefined) ev.hazardRoundNo = rrSeen[key];
            });

            rec._hazardLedgerMigrated = true;
            rec._hazardLedgerVersion = HAZARD_LEDGER_VERSION;
        }

        // 治理链回补用：按 rr.sourceId 找排查/巡查源记录（与迁移内 findSourceRecord 口径一致）
        function __findHazardSourceRecord(rec, rr) {
            if (!rr || !rr.sourceId) return null;
            const pool = rr.sourceType === '巡查' ? (rec.patrolRecords || []) : (rec.inspectionRecords || []);
            return pool.find(function(x){ return x.id === rr.sourceId; }) || null;
        }

        /* ===== 第二类治理链回补（幂等，只增不删；2026-10-14 新规）=====
         * 历史第二类风险记录不生成隐患/治理事件；新规要求第二、三类均进入治理链（安全鉴定/评估由触发条件决定）。
         * 对尚无隐患关联的第二类风险记录：补一条隐患（初判第二类）+「登记」动态 + 治理事件 + hazardLinks 关联；
         * 同部位（非空）+同类型+未销号已存在时，转写「复查」动态，不新建（与登记查重口径一致）。
         */
        function backfillSecondClassHazards(rec) {
            if (!rec) return;
            if (!Array.isArray(rec.hazardRecords)) rec.hazardRecords = [];
            if (!Array.isArray(rec.hazardDynamics)) rec.hazardDynamics = [];
            let seq = rec.hazardRecords.length;
            (rec.riskRecords || []).forEach(function(rr) {
                if (!rr || rr.riskLevel !== '第二类') return;
                if (getHazardLinks(rr).length) return; // 已有关联隐患
                if ((rec.governanceEvents || []).some(function(e){ return e.riskRecordId === rr.id && e.hazardId; })) return;
                const src = __findHazardSourceRecord(rec, rr) || {};
                const type = rr.hazardDesc || '安全隐患';
                const loc = src.damagePart || src.damageLocation || '';
                const actTime = rr.date || rr.createdAt || src.checkDate || src.patrolDate || '';
                const operator = rr.person || src.checker || src.patrolPerson || '';
                const org = src.checkOrg || src.patrolOrg || (src.town ? src.town + '人民政府' : '') || src.town || '';
                // 查重：同部位（非空）+同类型+未销号 → 复查跟踪
                const dup = loc ? rec.hazardRecords.find(function(h){
                    return h.currentStatus !== HAZARD_STATUS.CLOSED && (h.location || '') === loc && (h.hazardType || '') === type;
                }) : null;
                if (dup) {
                    const dynSeq0 = rec.hazardDynamics.filter(function(d){ return d.hazardId === dup.id; }).length + 1;
                    rec.hazardDynamics.push({
                        id: generateHazardDynId(dup.id, dynSeq0),
                        hazardId: dup.id,
                        actionType: '复查',
                        actionTime: actTime,
                        operator: operator,
                        org: org,
                        content: '[第二类回补转复查] ' + (rr.hazardDesc || type),
                        conclusion: '该部位已有在管隐患，转为复查跟踪',
                        levelAfter: dup.currentLevel || '第二类',
                        photos: [],
                        sourceType: rr.sourceType || '排查',
                        sourceId: rr.sourceId || ''
                    });
                    rr.linkedHazardIds = rr.linkedHazardIds || [];
                    if (rr.linkedHazardIds.indexOf(dup.id) === -1) rr.linkedHazardIds.push(dup.id);
                    rr.hazardLinks = rr.hazardLinks || [];
                    if (!rr.hazardLinks.some(function(l){ return l.hazardId === dup.id; })) {
                        rr.hazardLinks.push({ hazardId: dup.id, role: '复查', dynamicId: generateHazardDynId(dup.id, dynSeq0) });
                    }
                    return;
                }
                seq += 1;
                const hid = generateHazardId(rec, seq);
                const hz = {
                    id: hid,
                    houseNo: rec.no || '',
                    createdAt: actTime,
                    createdBy: operator,
                    sourceType: rr.sourceType || '排查',
                    sourceId: rr.sourceId || '',
                    // ===== 隐患主体字段 =====
                    hazardType: type,
                    hazardTypeOther: '',
                    location: loc,
                    description: rr.hazardDesc || src.otherRisk || src.foundProblem || '',
                    photos: [],
                    initialJudge: '第二类',
                    currentLevel: '第二类',
                    currentStatus: HAZARD_STATUS.RECTIFYING,
                    controlMeasure: '',
                    controlUpdatedAt: '',
                    closedAt: '',
                    closeAuditId: '',
                    // ===== 源记录上下文（不丢字段，与迁移口径一致）=====
                    structureStatus: src.structureStatus || '',
                    overload: src.overload || '',
                    checkConclusion: src.checkConclusion || src.conclusion || src.result || '',
                    preliminaryJudge: src.preliminaryJudge || src.preliminary || '',
                    coordinates: src.location || '',
                    preAppraisal: src.preAppraisal || '',
                    noAppraisalReason: src.noAppraisalReason || '',
                    proofFiles: (typeof src.proofFiles === 'string' ? src.proofFiles.split('\n') : (src.proofFiles || [])).filter(Boolean),
                    remark: src.remark || '',
                    dutyPerson: src.dutyPerson || '', dutyPhone: src.dutyPhone || '',
                    ownerName: src.ownerName || '', ownerPhone: src.ownerPhone || '',
                    safetyName: src.safetyName || '', safetyPhone: src.safetyPhone || '',
                    checkOrg: src.checkOrg || src.patrolOrg || '',
                    town: src.town || '',
                    reporter: src.reporter || '', reportTime: src.reportTime || '',
                    sourceSnapshot: __deepClone(src),
                    taskFlows: []  // 任务索引（2026-10-19 三层档案改造新增）
                };
                rec.hazardRecords.push(hz);
                // 领养/创建治理事件（ensureGovernanceEvents 可能已生成 rr 级空事件）
                __adoptOrCreateGovernanceEvent(rec, rr, hid, new Date().toISOString());
                // 「登记」动态流水
                rec.hazardDynamics.push({
                    id: generateHazardDynId(hid, 1),
                    hazardId: hid,
                    actionType: '登记',
                    actionTime: actTime,
                    operator: operator,
                    org: org,
                    content: hz.description || ('登记隐患：' + type),
                    conclusion: hz.preliminaryJudge || '初判第二类',
                    levelAfter: '第二类',
                    photos: [],
                    sourceType: hz.sourceType,
                    sourceId: hz.sourceId
                });
                // 回填风险记录关联（旧字段双写 + hazardLinks 结构化）
                rr.linkedHazardIds = (rr.linkedHazardIds || []).concat([hid]);
                rr.newHazardIds = (rr.newHazardIds || []).concat([hid]);
                rr.hazardLinks = rr.hazardLinks || [];
                if (!rr.hazardLinks.some(function(l){ return l.hazardId === hid; })) {
                    rr.hazardLinks.push({ hazardId: hid, role: '登记', dynamicId: generateHazardDynId(hid, 1) });
                }
            });
        }

        // 读取 rr 的隐患关联（兼容新旧结构：hazardLinks 优先；缺项从 linkedHazardIds 补「登记」角色）
        function getHazardLinks(rr) {
            if (!rr) return [];
            const links = Array.isArray(rr.hazardLinks) && rr.hazardLinks.length ? rr.hazardLinks.slice() : [];
            (rr.linkedHazardIds || []).forEach(function(hid){
                if (!links.some(function(l){ return l.hazardId === hid; })) links.push({ hazardId: hid, role: '登记', dynamicId: '' });
            });
            return links;
        }

        /* ===== P3：排查/巡查表单「登记隐患」写入 =====
         * 在排查登记/动态巡查保存时调用：
         *   - newHazards[]：每条形似 { hazardType, hazardTypeOther, location, description, photos[], initialJudge }
         *     → 生成 hazardRecord（全字段 + sourceSnapshot 兜底）+「登记」动态；第二类/第三类自动挂治理事件
         *   - reviews[]：每条形似 { hazardId, conclusion, levelAfter, content }
         *     → 对既有隐患追加「复查」动态，按需调整 currentLevel（允许调低）
         * 旧字段一律保留不删（源记录照旧、rr 照旧，仅追加关联）。
         */
        // D：计算隐患轮次号（同一 rr 触发的第几条隐患 = 第几轮）
        function __hazardRoundNo(rec, rr) {
            if (!rr) return 1;
            return (rec.governanceEvents || []).filter(function(e){ return e.riskRecordId === rr.id && e.hazardId; }).length + 1;
        }

        function __adoptOrCreateGovernanceEvent(rec, rr, hid, createdAt) {
            if (!Array.isArray(rec.governanceEvents)) rec.governanceEvents = [];
            // 优先领养 ensureGovernanceEvents 生成的 rr 级空事件（无 hazardId），避免孤儿事件
            let ev = null;
            if (rr) {
                ev = rec.governanceEvents.find(function(e){ return e.riskRecordId === rr.id && !e.hazardId; }) || null;
            }
            if (ev) { ev.hazardId = hid; if (ev.hazardRoundNo === undefined) ev.hazardRoundNo = __hazardRoundNo(rec, rr) - 1 || 1; return ev; }
            ev = {
                eventId: 'GE-' + hid,
                hazardId: hid,
                riskRecordId: rr ? rr.id : '',
                roundNo: 1,
                hazardRoundNo: __hazardRoundNo(rec, rr),
                createdAt: createdAt || new Date().toISOString(),
                status: '待治理',
                data: {}
            };
            rec.governanceEvents.push(ev);
            return ev;
        }

        function registerDiscoveryHazards(rec, sourceType, srcRecord, newHazards, reviews) {
            if (!rec || !srcRecord || !srcRecord.id) return;
            if (!Array.isArray(rec.hazardRecords)) rec.hazardRecords = [];
            if (!Array.isArray(rec.hazardDynamics)) rec.hazardDynamics = [];
            try { syncRiskRecords(rec); } catch (e) {}
            const rr = (rec.riskRecords || []).find(function(r){ return r.sourceType === sourceType && r.sourceId === srcRecord.id; }) || null;
            const actTime = srcRecord.checkDate || srcRecord.patrolDate || srcRecord.reportTime || '';
            const operator = srcRecord.checker || srcRecord.patrolPerson || srcRecord.reporter || '';
            const org = srcRecord.checkOrg || srcRecord.patrolOrg || (srcRecord.town ? srcRecord.town + '人民政府' : '') || srcRecord.town || '';
            let seq = rec.hazardRecords.length;

            (Array.isArray(newHazards) ? newHazards : []).forEach(function(nh) {
                if (!nh || !nh.hazardType) return;
                // B：一处一条查重——同部位（部位需非空）+同类型+未销号 → 不新建，转为复查跟踪
                const dup = nh.location ? rec.hazardRecords.find(function(h){
                    return h.currentStatus !== HAZARD_STATUS.CLOSED &&
                        (h.location || '') === (nh.location || '') &&
                        (h.hazardType || '') === (nh.hazardType || '');
                }) : null;
                if (dup) {
                    const dynSeq0 = rec.hazardDynamics.filter(function(d){ return d.hazardId === dup.id; }).length + 1;
                    rec.hazardDynamics.push({
                        id: generateHazardDynId(dup.id, dynSeq0),
                        hazardId: dup.id,
                        actionType: '复查',
                        actionTime: actTime,
                        operator: operator,
                        org: org,
                        content: '[重复登记转复查] ' + (nh.description || nh.hazardType),
                        conclusion: '该部位已有在管隐患，转为复查跟踪',
                        levelAfter: dup.currentLevel || nh.initialJudge || '',
                        photos: (Array.isArray(nh.photos) ? nh.photos : []).filter(Boolean),
                        sourceType: sourceType,
                        sourceId: srcRecord.id
                    });
                    if (rr) {
                        rr.linkedHazardIds = rr.linkedHazardIds || [];
                        if (rr.linkedHazardIds.indexOf(dup.id) === -1) rr.linkedHazardIds.push(dup.id);
                        rr.hazardLinks = rr.hazardLinks || [];
                        if (!rr.hazardLinks.some(function(l){ return l.hazardId === dup.id; })) {
                            rr.hazardLinks.push({ hazardId: dup.id, role: '复查', dynamicId: generateHazardDynId(dup.id, dynSeq0) });
                        }
                    }
                    return; // 不新建
                }
                seq += 1;
                const hid = generateHazardId(rec, seq);
                const photosArr = (Array.isArray(nh.photos) ? nh.photos : []).filter(Boolean);
                const snapshot = __deepClone(srcRecord);
                const hz = {
                    id: hid,
                    houseNo: rec.no || '',
                    createdAt: actTime,
                    createdBy: operator,
                    sourceType: sourceType,
                    sourceId: srcRecord.id,
                    // ===== 隐患主体字段 =====
                    hazardType: nh.hazardType,
                    hazardTypeOther: (nh.hazardType === '其他安全问题' ? (nh.hazardTypeOther || '') : ''),
                    location: nh.location || '',
                    description: nh.description || nh.hazardType,
                    photos: photosArr,
                    initialJudge: nh.initialJudge || '第三类',
                    currentLevel: nh.initialJudge || '第三类',
                    currentStatus: HAZARD_STATUS.UNCONTROLLED,
                    controlMeasure: '',
                    controlUpdatedAt: '',
                    closedAt: '',
                    closeAuditId: '',
                    // ===== 源记录上下文（不丢字段，与迁移口径一致）=====
                    structureStatus: srcRecord.structureStatus || '',
                    overload: srcRecord.overload || '',
                    checkConclusion: srcRecord.checkConclusion || srcRecord.conclusion || srcRecord.result || '',
                    preliminaryJudge: srcRecord.preliminaryJudge || srcRecord.preliminary || '',
                    coordinates: srcRecord.location || srcRecord.patrolPointCoord || '',
                    preAppraisal: srcRecord.preAppraisal || '',
                    noAppraisalReason: srcRecord.noAppraisalReason || '',
                    proofFiles: (typeof srcRecord.proofFiles === 'string' ? srcRecord.proofFiles.split('\n') : (srcRecord.proofFiles || [])).filter(Boolean),
                    remark: srcRecord.remark || '',
                    dutyPerson: srcRecord.dutyPerson || '', dutyPhone: srcRecord.dutyPhone || '',
                    ownerName: srcRecord.ownerName || '', ownerPhone: srcRecord.ownerPhone || '',
                    safetyName: srcRecord.safetyName || '', safetyPhone: srcRecord.safetyPhone || '',
                    checkOrg: srcRecord.checkOrg || srcRecord.patrolOrg || '',
                    town: srcRecord.town || '',
                    reporter: srcRecord.reporter || '', reportTime: srcRecord.reportTime || '',
                    sourceSnapshot: snapshot
                };
                rec.hazardRecords.push(hz);
                // 第二类/第三类隐患 → 领养/创建治理事件（单轮治理链；安全鉴定/评估由触发条件决定）
                if (hz.initialJudge === '第三类' || hz.initialJudge === '第二类') {
                    __adoptOrCreateGovernanceEvent(rec, rr, hid, new Date().toISOString());
                }
                // 「登记」动态流水
                rec.hazardDynamics.push({
                    id: generateHazardDynId(hid, 1),
                    hazardId: hid,
                    actionType: '登记',
                    actionTime: actTime,
                    operator: operator,
                    org: org,
                    content: hz.description || ('登记隐患：' + hz.hazardType),
                    conclusion: hz.preliminaryJudge || ('初判' + hz.initialJudge),
                    levelAfter: hz.initialJudge,
                    photos: photosArr.slice(),
                    sourceType: sourceType,
                    sourceId: srcRecord.id
                });
                // 回填风险记录关联（旧字段双写 + hazardLinks 结构化）
                if (rr) {
                    rr.linkedHazardIds = (rr.linkedHazardIds || []).concat([hid]);
                    rr.newHazardIds = (rr.newHazardIds || []).concat([hid]);
                    rr.hazardLinks = rr.hazardLinks || [];
                    if (!rr.hazardLinks.some(function(l){ return l.hazardId === hid; })) {
                        rr.hazardLinks.push({ hazardId: hid, role: '登记', dynamicId: generateHazardDynId(hid, 1) });
                    }
                }
            });

            (Array.isArray(reviews) ? reviews : []).forEach(function(ri) {
                if (!ri || !ri.hazardId) return;
                const hz = rec.hazardRecords.find(function(h){ return h.id === ri.hazardId; });
                if (!hz) return;
                const dynSeq = rec.hazardDynamics.filter(function(d){ return d.hazardId === ri.hazardId; }).length + 1;
                rec.hazardDynamics.push({
                    id: generateHazardDynId(ri.hazardId, dynSeq),
                    hazardId: ri.hazardId,
                    actionType: '复查',
                    actionTime: actTime,
                    operator: operator,
                    org: org,
                    content: ri.content || ('复查隐患：' + (hz.hazardType || '')),
                    conclusion: ri.conclusion || '',
                    levelAfter: ri.levelAfter || hz.currentLevel || '',
                    photos: [],
                    sourceType: sourceType,
                    sourceId: srcRecord.id
                });
                // 等级调整（允许调低，第一类视为隐患消除前的观察结论，不自动销号）
                if (ri.levelAfter && ri.levelAfter !== hz.currentLevel) hz.currentLevel = ri.levelAfter;
                // 复查关联回填（旧字段去重 + hazardLinks 结构化）
                if (rr) {
                    rr.linkedHazardIds = rr.linkedHazardIds || [];
                    if (rr.linkedHazardIds.indexOf(ri.hazardId) === -1) rr.linkedHazardIds.push(ri.hazardId);
                    rr.hazardLinks = rr.hazardLinks || [];
                    if (!rr.hazardLinks.some(function(l){ return l.hazardId === ri.hazardId; })) {
                        rr.hazardLinks.push({ hazardId: ri.hazardId, role: '复查', dynamicId: generateHazardDynId(ri.hazardId, dynSeq) });
                    }
                }
            });
        }

        /* ===== C：隐患独立销号（单一入口，治理链验收与台账直销共用）=====
         * payload: { auditor, auditTime, opinion, files, source }
         * 幂等：已销号则跳过；销号后写「销号」动态 + 回填 closedAt；
         * 若有关联治理事件，事件状态同步「已治理」。
         */
        function closeHazard(rec, hazardId, payload) {
            if (!rec) return false;
            const hz = (rec.hazardRecords || []).find(function(h){ return h.id === hazardId; });
            if (!hz || hz.currentStatus === HAZARD_STATUS.CLOSED) return false;
            payload = payload || {};
            const auditTime = payload.auditTime || formatDateTime(new Date());
            hz.currentStatus = HAZARD_STATUS.CLOSED;
            hz.closedAt = auditTime;
            hz.closeAuditId = payload.auditId || hz.closeAuditId || '';
            const dynSeq = (rec.hazardDynamics || []).filter(function(d){ return d.hazardId === hazardId; }).length + 1;
            rec.hazardDynamics = rec.hazardDynamics || [];
            rec.hazardDynamics.push({
                id: generateHazardDynId(hazardId, dynSeq),
                hazardId: hazardId,
                actionType: '销号',
                actionTime: auditTime,
                operator: payload.auditor || '',
                org: payload.org || '',
                content: payload.opinion || '隐患验收通过，予以销号',
                conclusion: '验收销号',
                levelAfter: hz.currentLevel || '',
                photos: (Array.isArray(payload.files) ? payload.files : (payload.files ? [payload.files] : [])).filter(Boolean),
                sourceType: payload.source || '销号',
                sourceId: payload.auditId || ''
            });
            // 关联治理事件同步办结
            const ev = (rec.governanceEvents || []).find(function(e){ return e.hazardId === hazardId; });
            if (ev && ev.status !== '已治理') ev.status = '已治理';
            return true;
        }

        // 取当前生效的治理事件
        function getCurrentGovernanceEvent(rec) {
            if (!rec) return null;
            ensureGovernanceEvents(rec);
            const id = rec.currentGovernanceEventId;
            const ev = (rec.governanceEvents || []).find(function(e) { return e.eventId === id; });
            if (ev) return ev;
            return (rec.governanceEvents || [])[rec.governanceEvents.length - 1] || null;
        }
        // 治理链是否应显示（存在第二类/第三类风险记录的治理事件）
        function hasGovernanceAccess(rec) {
            if (!rec) return false;
            ensureGovernanceEvents(rec);
            return (rec.governanceEvents || []).length > 0;
        }

        // 治理事件是否需要安全鉴定：安全鉴定（A/B/C/D级）给处置背书，由触发条件决定，非第三类专属
        // 安全鉴定/安全评估对所有类别隐患均开放（用户决定是否填报）
        function govNeedAppraisal(s, ev) {
            return true; // 统一开放，不再按隐患类别限制
        }
        // 治理链子 TAB（安全鉴定/安全评估/整治计划为房屋级操作，置于侧栏一级入口；链内仅 measure/control/accept/close）
        function govTabsForEvent(s, ev) {
            return RISK_GOV_TABS;
        }

        // 治理链表格某节点是否已有实质填报内容（安全鉴定/安全评估互斥判断用）
        function __govTableHasData(key) {
            const node = getTableData()[key];
            const row = node && node.rows && node.rows[0];
            if (!row) return false;
            return row.some(function(v){ return v && v !== '—' && v !== '-'; });
        }

        /* ==================== 治理事件视图存取层（方案B）====================
         * 每个治理事件拥有独立的治理链数据（鉴定/计划/措施/动态/验收/销号）。
         * 存储：ev.data 是该事件的唯一真实数据源。
         * 视图：getCurrentHouseArch() 把当前事件 ev.data 展开到根级供现有渲染代码读取；
         *      saveCurrentHouseArch() 把根级对应字段写回当前事件 ev.data。
         * 切换事件：switchGovernanceEvent() 先回写旧事件 → 改 id → 应用新事件 → 持久化 → 重渲染。
         * ==================================================================== */
        // 事件内独立字段（不含跨事件汇总字段：governStatus/governance/risk 等）
        // 【一栋一策规则】rectifySituation/manageRecords/projectRecords 已提升为房屋级（不再按事件隔离）：
        //   - 隐患↔措施 = 多对多（措施挂 hazardIds[]）；房屋↔计划 = 1:1（housePlanRow）；计划↔措施 = 1:N
        const GOVERNANCE_EVENT_FIELDS = [
            'appraisalReports', 'planMonitorTime',
            'addDanger', 'acceptAuditRecords',
            'closeInfo', 'closeHistoryRecords', 'closeAuditRecords', 'archiveRecords',
            'closeStatus', 'closeApplyTime', 'closeAuditTime', 'closeAuditor',
            'closeAuditOpinion', 'closeRejectReason', 'isRemovedFromFocus'
        ];

        // 方案B1：事件级字段库键——治理链 TAB 的表格/措施字段库也按治理事件隔离
        // （渲染层直接读模块级 tableData_RURAL/measureData_RURAL，仅靠根级字段代理无法隔离 UI）
        const GOVERNANCE_EVENT_LIB_KEYS = ['table_RURAL', 'measure_RURAL'];

        // 空白事件字段库：保留结构（columns/title/列定义），清空数据行——新事件不应看到旧事件的填报内容
        function __blankEventTableLib() {
            let t = {};
            try { t = __deepClone(tableData_RURAL); } catch (e) { t = {}; }
            Object.keys(t).forEach(k => {
                const n = t[k];
                if (!n || typeof n !== 'object') return;
                if (Array.isArray(n.rows)) n.rows = [];
                if (Array.isArray(n.auditList)) n.auditList = [];
            });
            return t;
        }
        function __blankEventMeasureLib() {
            let m = {};
            try { m = __deepClone(measureData_RURAL); } catch (e) { m = {}; }
            if (m.manage) {
                if (Array.isArray(m.manage.baseValues)) m.manage.baseValues = m.manage.baseValues.map(() => '');
                if (m.manage.extraFields) Object.keys(m.manage.extraFields).forEach(tp => {
                    const grp = m.manage.extraFields[tp];
                    if (grp && typeof grp === 'object') Object.keys(grp).forEach(f => { grp[f] = ''; });
                });
                if (m.manage.reminder) { m.manage.reminder.enabled = false; m.manage.reminder.phone = ''; }
                if (m.manage.changeFlow) { m.manage.changeFlow.current = null; m.manage.changeFlow.records = []; }
            }
            if (m.project) {
                if (Array.isArray(m.project.rows)) m.project.rows = [];
                m.project.orgId = ''; m.project.orgName = '';
                if (m.project.orgInfo) Object.keys(m.project.orgInfo).forEach(f => { if (typeof m.project.orgInfo[f] === 'string') m.project.orgInfo[f] = ''; });
                ['planFiles','designFiles','orgDesignFiles','safetyFiles','baseAcceptFiles','mainAcceptFiles','materialFiles','completeReportFiles','implementPhotos','completePhotos','rectifyPhotos','timeline'].forEach(k => { if (Array.isArray(m.project[k])) m.project[k] = []; });
                m.project.isMajorProject = false;
                if (m.project.expertOpinion) {
                    Object.keys(m.project.expertOpinion).forEach(f => { if (typeof m.project.expertOpinion[f] === 'string') m.project.expertOpinion[f] = ''; });
                    if (Array.isArray(m.project.expertOpinion.files)) m.project.expertOpinion.files = [];
                }
            }
            return m;
        }
        function __blankEventLibKey(k) {
            return k === 'measure_RURAL' ? __blankEventMeasureLib() : __blankEventTableLib();
        }

        // 存量事件首次隔离：用 ev.data.appraisalReports[0] 回填安全鉴定表行，保持 UI 连续性
        function __seedAssessmentRowFromEvent(tableLib, evData) {
            const a = evData && Array.isArray(evData.appraisalReports) && evData.appraisalReports[0];
            if (!a) return;
            const node = tableLib && tableLib.assessment;
            if (!node || !Array.isArray(node.columns) || !node.columns.length) return;
            if (Array.isArray(node.rows) && node.rows.length) return; // 已有数据不覆盖
            const fieldMap = {
                '鉴定机构名称': a.orgName || '',
                '统一社会信用代码': a.orgCode || '',
                '鉴定时间': a.appraisalDate || '',
                '鉴定负责人': a.appraiser || '',
                '鉴定结论': a.conclusion || a.level || '',
                '阶段性标识': a.phaseTag || '',
                '鉴定报告': a.reportFiles || '',
                '备注': a.remark || '',
                '填报人': a.reporter || '',
                '填报时间': a.reportTime || ''
            };
            const row = node.columns.map(c => fieldMap[c] !== undefined ? fieldMap[c] : '');
            if (row.some(v => v)) node.rows = [row];
        }

        // 把当前事件 ev.data 展开到根级（供治理 TAB 渲染读）
        function __applyGovernanceEventView(rec) {
            if (!rec) return rec;
            const ev = getCurrentGovernanceEvent(rec);
            if (!ev) return rec;
            if (!ev.data || typeof ev.data !== 'object') ev.data = {};
            GOVERNANCE_EVENT_FIELDS.forEach(k => {
                if (ev.data[k] !== undefined) rec[k] = __deepClone(ev.data[k]);
                else {
                    // 事件内未设置该字段：给合理默认（避免现有代码读到 undefined）
                    if (k === 'appraisalReports' || k === 'manageRecords' || k === 'projectRecords' ||
                        k === 'acceptAuditRecords' || k === 'closeHistoryRecords' || k === 'closeAuditRecords' ||
                        k === 'archiveRecords') rec[k] = [];
                    else if (k === 'rectifySituation' || k === 'addDanger' || k === 'closeInfo') rec[k] = {};
                    else if (k === 'closeStatus') rec[k] = '未申请';
                    else delete rec[k];
                }
            });
            // 方案B1：事件级字段库视图——table_RURAL/measure_RURAL 也按事件展开
            if (!rec._fieldsLibrary || typeof rec._fieldsLibrary !== 'object') rec._fieldsLibrary = {};
            if (!ev.data._lib || typeof ev.data._lib !== 'object') ev.data._lib = {};
            GOVERNANCE_EVENT_LIB_KEYS.forEach(k => {
                if (ev.data._lib[k] !== undefined) {
                    rec._fieldsLibrary[k] = __deepClone(ev.data._lib[k]);
                } else {
                    const blank = __blankEventLibKey(k);
                    if (k === 'table_RURAL') { try { __seedAssessmentRowFromEvent(blank, ev.data); } catch (e) {} }
                    rec._fieldsLibrary[k] = blank;
                    ev.data._lib[k] = __deepClone(blank); // 立即固化，保证事件数据自包含
                }
            });
            // 渲染层直接读模块级字段库变量 → 同步过去（merge 语义，空白结构整表替换旧行）
            try {
                const part = {};
                GOVERNANCE_EVENT_LIB_KEYS.forEach(k => { if (rec._fieldsLibrary[k]) part[k] = rec._fieldsLibrary[k]; });
                if (typeof restoreFieldsLibrary === 'function' && Object.keys(part).length) restoreFieldsLibrary(part);
            } catch (e) {}
            // 【一栋一策】plan 行始终以房屋级 housePlanRow 为准（覆盖事件 lib 中的旧拷贝）
            try {
                if (typeof tableData_RURAL !== 'undefined' && tableData_RURAL.plan && Array.isArray(rec.housePlanRow) &&
                    rec.housePlanRow.some(function(v){ return v && v !== '—' && v !== '-'; })) {
                    tableData_RURAL.plan.rows = [__deepClone(rec.housePlanRow)];
                    if (rec._fieldsLibrary.table_RURAL && rec._fieldsLibrary.table_RURAL.plan) {
                        rec._fieldsLibrary.table_RURAL.plan.rows = [__deepClone(rec.housePlanRow)];
                    }
                }
            } catch (e) {}
            return rec;
        }

        /* ==================== 一栋一策：事件级 → 房屋级迁移（幂等）====================
         * 规则：隐患↔措施 多对多（措施挂 hazardIds[]）；房屋↔计划 1:1（housePlanRow）。
         * 迁移内容：
         *   - 各事件 ev.data.manageRecords/projectRecords → 合并到根级（按 id 去重），回填 hazardIds=[事件隐患]
         *   - 各事件 ev.data.rectifySituation → 最新非空一份提升到根级
         *   - 各事件 ev.data._lib.table_RURAL.plan.rows[0] → 最新非空一份提升为 rec.housePlanRow
         * ==================================================================== */
        function migrateGovernanceToHouseLevel(rec) {
            if (!rec || (rec._govHouseLevelVersion || 0) >= 1) return;
            const events = rec.governanceEvents || [];
            rec.manageRecords = Array.isArray(rec.manageRecords) ? rec.manageRecords : [];
            rec.projectRecords = Array.isArray(rec.projectRecords) ? rec.projectRecords : [];
            let migrateSeq = 0;
            const mergeList = function(rootList, evList, hazardId) {
                (Array.isArray(evList) ? evList : []).forEach(function(item) {
                    if (!item || typeof item !== 'object') return;
                    let target = item.id ? rootList.find(function(r){ return r.id === item.id; }) : null;
                    if (!target) {
                        target = __deepClone(item);
                        if (!target.id) target.id = 'MIG-' + Date.now().toString(36) + (++migrateSeq);
                        rootList.push(target);
                    }
                    if (hazardId) {
                        if (!Array.isArray(target.hazardIds)) target.hazardIds = [];
                        if (target.hazardIds.indexOf(hazardId) === -1) target.hazardIds.push(hazardId);
                    }
                });
            };
            let latestSituation = null, latestPlanRow = null;
            events.forEach(function(ev) {
                const d = ev.data || {};
                mergeList(rec.manageRecords, d.manageRecords, ev.hazardId);
                mergeList(rec.projectRecords, d.projectRecords, ev.hazardId);
                if (d.rectifySituation && Object.keys(d.rectifySituation).some(function(k){ return d.rectifySituation[k]; })) {
                    latestSituation = __deepClone(d.rectifySituation);
                }
                const planRow = d._lib && d._lib.table_RURAL && d._lib.table_RURAL.plan &&
                    d._lib.table_RURAL.plan.rows && d._lib.table_RURAL.plan.rows[0];
                if (Array.isArray(planRow) && planRow.some(function(v){ return v && v !== '—' && v !== '-'; })) {
                    latestPlanRow = __deepClone(planRow);
                }
                delete d.manageRecords;
                delete d.projectRecords;
                delete d.rectifySituation;
            });
            if (latestSituation && (!rec.rectifySituation || !Object.keys(rec.rectifySituation).length)) {
                rec.rectifySituation = latestSituation;
            }
            if (latestPlanRow && !Array.isArray(rec.housePlanRow)) rec.housePlanRow = latestPlanRow;
            rec._govHouseLevelVersion = 1;
        }

        // 【阶段性整治计划】旧单条 housePlanRow 迁移为 planRecords 多条结构（独立函数，幂等，每次启动调用）
        // 结构：planRecords = [{ id, rows:[13字段], reporter, reportTime, status:'进行中'|'已完成' }, ...]
        function migratePlanToRecords(rec) {
            if (!rec) return;
            rec.planRecords = Array.isArray(rec.planRecords) ? rec.planRecords : [];
            if (!rec.planRecords.length && Array.isArray(rec.housePlanRow) &&
                rec.housePlanRow.some(function(v){ return v && v !== '—' && v !== '-'; })) {
                rec.planRecords.push({
                    id: 'PLAN-' + (rec.houseNo || rec.no || 'X') + '-01',
                    rows: __deepClone(rec.housePlanRow),
                    reporter: rec.housePlanRow[11] || '',
                    reportTime: rec.housePlanRow[12] || '',
                    status: '进行中',
                    remark: rec.housePlanRow[10] || ''
                });
            }
        }

        // 【安全鉴定/安全评估多条记录】旧单条 table_RURAL.assessment.rows[0] / evaluation.rows[0] 迁移为多条（幂等，每次启动调用）
        // 结构：assessmentRecords / evaluationRecords = [{ id, rows:[10列], reporter, reportTime, createdAt }, ...]
        // 一次完整记录结束 → 保存即锁定（禁编辑/删除），只能新增
        function migrateAssessmentToRecords(rec) {
            if (!rec) return;
            rec.assessmentRecords = Array.isArray(rec.assessmentRecords) ? rec.assessmentRecords : [];
            rec.evaluationRecords = Array.isArray(rec.evaluationRecords) ? rec.evaluationRecords : [];
            // 数据源：草稿 _fieldsLibrary 优先；无则回退到内存 tableData_RURAL（含静态默认假数据）
            function pickRows(kind) {
                const draftLib = rec._fieldsLibrary && rec._fieldsLibrary.table_RURAL;
                const draftRows = draftLib && draftLib[kind] && draftLib[kind].rows;

        .org-card-list { display: flex; flex-direction: column; gap: 10px; max-height: 360px; overflow-y: auto; }
        .org-card-item { padding: 12px 14px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: all 0.15s; background: #fff; }
        .org-card-item:hover { border-color: var(--primary); background: var(--primary-light); }
        .org-card-item.selected { border-color: var(--primary); background: #e8f0fe; }
        .org-card-name { font-size: 14px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .org-card-meta { font-size: 12px; color: var(--text-secondary); display: flex; flex-wrap: wrap; gap: 10px; }
        .org-card-meta span { display: inline-flex; align-items: center; gap: 4px; }
        .org-card-score { color: var(--primary); font-weight: 600; }
        .org-card-empty { text-align: center; color: var(--text-secondary); padding: 24px; font-size: 13px; }
        .org-qual-panel { border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; background: #fafbfc; margin-top: 12px; }
        .org-qual-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; color: var(--primary); }
        .org-qual-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 12px; font-size: 12px; }
        .org-qual-grid .org-qual-label { color: var(--text-secondary); }
        .org-qual-grid .org-qual-value { color: var(--text-primary); font-weight: 500; }

        /* 施工过程时间轴 */
        .construction-timeline { position: relative; margin-top: 18px; padding-left: 24px; }
        .construction-timeline::before { content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
        .ct-node { position: relative; padding-bottom: 18px; }
        .ct-node:last-child { padding-bottom: 0; }
        .ct-node-dot { position: absolute; left: -20px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--primary); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--primary-light); }
        .ct-node-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .ct-node-date { font-size: 12px; color: #fff; background: var(--primary); padding: 2px 8px; border-radius: 10px; }
        .ct-node-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .ct-node-body { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-left: 2px; }
        .ct-node-body .photo-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .ct-node-body .photo-grid img { width: 64px; height: 64px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; }
        .ct-node-empty { color: var(--text-secondary); font-size: 13px; padding: 12px 0; }

        /* 专家评审区 */
        .expert-opinion-panel { border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; background: #fff; margin-top: 12px; }
        .expert-opinion-title { font-size: 13px; font-weight: 600; color: var(--major); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .expert-select-row { display: flex; gap: 8px; align-items: stretch; }
        .expert-select-row .form-input { flex: 1; }
        .expert-select-btn { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid var(--primary); border-radius: 4px; background: var(--primary); color: #fff; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .expert-select-btn:hover { background: var(--primary-dark); }

        .project-file-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
        .project-file-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #fafbfc; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; color: var(--text-primary); }
        .project-file-item i { color: var(--primary); }
        .project-file-remove { margin-left: auto; width: 20px; height: 20px; border: none; background: transparent; color: var(--danger); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
        .project-file-remove:hover { background: #fce8e6; }

        .map-picker-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10001; justify-content: center; align-items: flex-start; padding: 40px 16px; overflow-y: auto; }
        .map-picker-overlay.open { display: flex; }
        .map-picker-box { background: #fff; border: 1px solid var(--border); border-radius: 8px; width: 92%; max-width: 900px; box-shadow: 0 12px 40px rgba(0,0,0,0.2); display: flex; flex-direction: column; overflow: hidden; max-height: calc(100vh - 80px); }
        .map-picker-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; background: #fafbfc; }
        .map-picker-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .map-picker-body { padding: 16px 20px; flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 420px; }
        #locationMap { width: 100%; flex: 1; min-height: 360px; border-radius: 4px; border: 1px solid var(--border); }
        .map-picker-coord { display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--text-secondary); }
        .map-picker-coord input { width: 140px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; }
        .map-picker-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-shrink: 0; background: #fafbfc; }
    </style>
</head>

        // 从 localStorage 读取所有城镇房屋，解析 address 为 {road, hao, dong} 列表（用于路号信息搜索面板）
        function getAllHouseAddrList() {
            try {
                const raw = localStorage.getItem('urbanHouseArchData');
                if (!raw) return [];
                const data = JSON.parse(raw);
                const houses = Object.values(data);
                const list = [];
                const seen = new Set();
                houses.forEach(function(h) {
                    const addr = (h.address || '').trim();
                    if (!addr) return;
                    // 解析 "上海市奉贤区南桥镇张翁庙村3号" → road="奉贤区南桥镇张翁庙村", hao="3", dong=""
                    let s = addr.replace(/^上海市/, '').replace(/^奉贤区/, '奉贤区');
                    // 尝试提取 号
                    const m = s.match(/^(.+?)(\d+(?:号|室))?$/);
                    let road = s, hao = '', dong = '';
                    if (m) {
                        road = m[1] || s;
                        hao = (m[2] || '').replace(/号$/, '');
                    }
                    // 尝试从 road 里提取 幢/栋
                    const m2 = road.match(/^(.+?)(\d+幢|\d+栋)(.*)$/);
                    if (m2) {
                        road = m2[1] + (m2[3] || '');
                        dong = m2[2];
                    }
                    const key = road + '|' + hao + '|' + dong;
                    if (seen.has(key)) return;
                    seen.add(key);
                    list.push({ road: road, hao: hao, dong: dong });
                });
                return list;
            } catch (e) {
                return [];
            }
