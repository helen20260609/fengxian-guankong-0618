        // 通用字段/记录列表帮助函数（全局，供基础信息、风险信息记录等模块复用）
        // labelCls: label 超过 10 字时自动加 info-label-long（缩小字体防换行）
        function kv(label, value, emptyLabel, ruralOnly) {
            const v = value || '';
            const isEmpty = v === '' || v === null || v === undefined;
            const cls = isEmpty ? 'empty' : (ruralOnly ? 'rural-only' : '');
            const labelCls = (label && label.length > 10) ? ' info-label-long' : '';
            return '<div class="info-item"><div class="info-label' + labelCls + '" title="' + (label || '').replace(/"/g, '&quot;') + '">' + label + '</div><div class="info-value ' + cls + '">' + (isEmpty ? (emptyLabel || '—') : v) + '</div></div>';
        }
        // ===== 通用分页组件 =====
        const pagerState = {}; // {key: {page, size}}
        function pagerGet(key) {
            if (!pagerState[key]) pagerState[key] = { page: 1, size: 10 };
            return pagerState[key];
        }
        function paginateSlice(key, items) {
            const st = pagerGet(key);
            const pages = Math.max(Math.ceil(items.length / st.size), 1);
            if (st.page > pages) st.page = pages;
            if (st.page < 1) st.page = 1;
            const start = (st.page - 1) * st.size;
            return items.slice(start, start + st.size);
        }
        function goPagerPage(key, p) { pagerGet(key).page = p; renderContent(); }
        function setPagerSize(key, size) { const st = pagerGet(key); st.size = parseInt(size, 10) || 10; st.page = 1; renderContent(); }
        function jumpPagerPage(key, val) { const p = parseInt(val, 10); if (!isNaN(p) && p >= 1) pagerGet(key).page = p; renderContent(); }
        function renderPagerBar(key, total) {
            const st = pagerGet(key);
            const pages = Math.max(Math.ceil(total / st.size), 1);
            if (st.page > pages) st.page = pages;
            if (pages <= 1) return ''; // 仅一页时不显示分页条
            let nums = [];
            if (pages <= 7) { for (let i = 1; i <= pages; i++) nums.push(i); }
            else {
                nums.push(1);
                const lo = Math.max(2, st.page - 1), hi = Math.min(pages - 1, st.page + 1);
                if (lo > 2) nums.push('…');
                for (let i = lo; i <= hi; i++) nums.push(i);
                if (hi < pages - 1) nums.push('…');
                nums.push(pages);
            }
            const numsHtml = nums.map(function(n) {
                if (n === '…') return '<span class="pager-ellipsis">…</span>';
                return '<button class="pager-btn' + (n === st.page ? ' active' : '') + '" onclick="goPagerPage(\'' + key + '\',' + n + ')">' + n + '</button>';
            }).join('');
            return '<div class="pager-bar">' +
                '<span class="pager-total">共 ' + total + ' 条</span>' +
                '<select class="pager-size" onchange="setPagerSize(\'' + key + '\', this.value)">' +
                    [10, 20, 50].map(function(n){ return '<option value="' + n + '"' + (st.size === n ? ' selected' : '') + '>' + n + ' 条/页</option>'; }).join('') +
                '</select>' +
                '<button class="pager-btn" ' + (st.page <= 1 ? 'disabled' : '') + ' onclick="goPagerPage(\'' + key + '\',' + (st.page - 1) + ')"><i class="fas fa-angle-left"></i></button>' +
                numsHtml +
                '<button class="pager-btn" ' + (st.page >= pages ? 'disabled' : '') + ' onclick="goPagerPage(\'' + key + '\',' + (st.page + 1) + ')"><i class="fas fa-angle-right"></i></button>' +
                '<span class="pager-jump">前往 <input type="text" class="pager-jump-input" value="' + st.page + '" onkeydown="if(event.keyCode===13){jumpPagerPage(\'' + key + '\',this.value);}"> 页</span>' +
            '</div>';
        }

        function recordListTable(columns, rows, moduleKey, activeIndex, options) {
            options = options || {};
            if (!rows || rows.length === 0) return '<div class="record-empty">暂无记录</div>';
            const showCrud = options.showCrud; // {edit: fn, delete: fn}
            const showCrudDeleteFilter = typeof options.showCrudDeleteFilter === 'function' ? options.showCrudDeleteFilter : null;
            // 分页：超过一页容量（10条）时启用，data-index 保持全局下标
            const pagerKey = 'rlt_' + moduleKey;
            let pageRows = rows, rowOffset = 0, pagerHtml = '';
            if (options.pager !== false && rows.length > 10) {
                const st = pagerGet(pagerKey);
                const pages = Math.ceil(rows.length / st.size);
                if (st.page > pages) st.page = pages;
                // 仅在选中行变化时自动翻到所在页（手动翻页不被拉回）
                if (typeof activeIndex === 'number' && activeIndex >= 0 && activeIndex < rows.length && st.lastActive !== activeIndex) {
                    st.lastActive = activeIndex;
                    st.page = Math.floor(activeIndex / st.size) + 1;
                }
                rowOffset = (st.page - 1) * st.size;
                pageRows = rows.slice(rowOffset, rowOffset + st.size);
                pagerHtml = renderPagerBar(pagerKey, rows.length);
            }
            const head = '<thead><tr>' + columns.map(c => '<th>' + (c.title || c) + '</th>').join('') + (options.showAction || showCrud ? '<th>操作</th>' : '') + '</tr></thead>';
            const body = pageRows.map(function(row, idx) {
                const globalIdx = rowOffset + idx;
                const isActive = globalIdx === activeIndex;
                const cells = row.map(function(cell, cIdx) {
                    const col = columns[cIdx] || {};
                    const val = (cell === undefined || cell === '' || cell === null) ? '—' : cell;
                    if (col.tag) return '<td><span class="tag ' + (col.tagClass ? col.tagClass(val) : 'info') + '">' + val + '</span></td>';
                    return '<td>' + val + '</td>';
                }).join('');
                let actionCell = '';
                if (showCrud) {
                    // showCrud.edit/delete 是函数调用前缀，如 "openCrudModal('measureProject'"，这里补全参数
                    const record = options.records ? options.records[globalIdx] : null;
                    const allowDelete = !showCrudDeleteFilter || showCrudDeleteFilter(record, globalIdx);
                    actionCell = '<td class="actions">' +
                        '<a class="view-link" href="javascript:void(0)" onclick="' + showCrud.edit + ',' + globalIdx + ')">编辑</a>' +
                        (allowDelete ? '<a class="view-link" href="javascript:void(0)" onclick="' + showCrud.delete + ',' + globalIdx + ')" style="color:var(--danger);">删除</a>' : '') +
                    '</td>';
                } else if (options.showAction) {
                    actionCell = '<td class="actions"><a class="view-link" href="javascript:void(0);">查看</a></td>';
                }
                return '<tr class="record-list-row ' + (isActive ? 'active' : '') + '" data-module="' + moduleKey + '" data-index="' + globalIdx + '">' + cells + actionCell + '</tr>';
            }).join('');
            return '<div class="table-scroll"><table class="record-list">' + head + '<tbody>' + body + '</tbody></table></div>' + pagerHtml;
        }
        function recordListWrapper(title, listHtml, options) {
            options = options || {};
            // showAdd 已是完整调用串（含参数），此处直接拼接触发，不再追加 ()
            const addBtn = options.showAdd ? '<button class="bottom-btn" style="padding:4px 12px;font-size:12px;" onclick="' + options.showAdd + '"><i class="fas fa-plus"></i> 新增记录</button>' : '';
            return '<div class="record-section-title" style="display:flex;justify-content:space-between;align-items:center;"><span><i class="fas ' + (options.icon || 'fa-list') + '"></i> ' + title + '</span>' + addBtn + '</div>' + listHtml;
        }

                    recordViewState[module] = index;
                    renderContent();
                });
            });
            // 风险信息记录：行点击进详情 + chip筛选 + 返回列表
            document.querySelectorAll('.risk-record-row[data-risk-key]').forEach(function(el){
                el.addEventListener('click', function(){
                    currentRiskRecordKey = this.dataset.riskKey;
                    renderContent();
                });
            });
            document.querySelectorAll('.hazard-filter-chip[data-risk-filter]').forEach(function(el){
                el.addEventListener('click', function(){
                    window.riskStatusFilter = this.dataset.riskFilter;
                    pagerGet('riskList').page = 1; // 筛选变化回第一页
                    renderContent();
                });
            });
            const riskBack = document.querySelector('.risk-back-link');
            if (riskBack) riskBack.addEventListener('click', function(){ currentRiskRecordKey = null; renderContent(); });
        }

        // =========================================================
        // 整治措施新版式：历史记录折叠卡片 + 内嵌填报表单
        // =========================================================
        // 历史记录头部一行：状态点 + 类型 + 时间范围 + 名称 + [历史] 展开钮
        // ===== 整治措施（阶段化）渲染 =====
        // 单条措施完成判定：管理看 isDone，工程看 status
        function isMeasureDoneRecord(kind, r) {
            return kind === 'manage'
                ? (r.isDone === true || r.isDone === '已完成' || r.isDone === '是')
                : (r.status === '已完成' || r.status === '是');
        }
        // 单条措施的结束时间（管理=实际/计划结束时间，工程=结束时间）
        function getRecordEndTime(kind, r) {
            return kind === 'manage'
                ? (r.actualEndTime || r.planEndTime || '')
                : (r.endDate || '');
        }
        // 「历史」判定：措施是否完成（是）且带结束时间；历史记录只读，不允许编辑/删除
        function isMeasureHistoryRecord(kind, r) {
            return isMeasureDoneRecord(kind, r) && !!getRecordEndTime(kind, r);
        }
        // 阶段下的措施清单（扁平数组按 stageId 过滤）
        function getStageMeasures(st) {
            const s = currentHouseArch || {};
            const mg = (Array.isArray(s.manageRecords) ? s.manageRecords : []).filter(function(m){ return m.stageId === st.id; });
            const pj = (Array.isArray(s.projectRecords) ? s.projectRecords : []).filter(function(p){ return p.stageId === st.id; });
            return { manage: mg, project: pj };
        }
        // 阶段完成判定（已整治）：整治情况.是否完成整治=是，且阶段内所有措施均为「历史」（完成=是且有结束时间）
        function isStageDone(st) {
            const sm = getStageMeasures(st);
            const sitDone = !!(st.situation && st.situation.completed === '是');
            return sitDone
                && sm.manage.every(function(m){ return isMeasureHistoryRecord('manage', m); })
                && sm.project.every(function(p){ return isMeasureHistoryRecord('project', p); });
        }
        // 阶段时间范围与措施名称汇总（卡片头显示用）
        function getStageRangeAndNames(st, sm) {
            const starts = [], ends = [], names = [];
            sm.manage.forEach(function(m){
                if (m.startTime) starts.push(m.startTime);
                if (m.actualEndTime || m.planEndTime) ends.push(m.actualEndTime || m.planEndTime);
                if (m.measureDesc || m.measureType) names.push(m.measureDesc || m.measureType);
            });
            sm.project.forEach(function(p){
                if (p.startDate) starts.push(p.startDate);
                if (p.endDate) ends.push(p.endDate);
                if (p.projectName) names.push(p.projectName);
            });
            starts.sort(); ends.sort();
            const range = (starts[0] || '—') + ' ~ ' + (ends.length ? ends[ends.length - 1] : (starts[0] ? '至今' : '—'));
            return { range: range, names: names.join('、') };
        }
        // 单条措施的时间范围与措施名（记录卡片头显示用）
        function getRecordRangeAndName(kind, r) {
            const start = kind === 'manage' ? (r.startTime || '') : (r.startDate || '');
            const end = kind === 'manage' ? (r.actualEndTime || r.planEndTime || '') : (r.endDate || '');
            const name = kind === 'manage' ? (r.measureType || r.measureDesc || '—') : (r.projectName || '—');
            return { range: (start || '—') + ' ~ ' + (end || (start ? '至今' : '—')), name: name };
        }

        // 管理措施详情网格（查看态）
        function renderManageDetailGrid(r) {
            const kvM = (label, value, green, fullWidth) => {
                const v = (value === undefined || value === null || value === '' || value === '—') ? '—' : value;
                return '<div class="info-item' + (fullWidth ? ' full-width' : '') + '"><div class="info-label">' + label + '</div><div class="info-value ' + (green ? 'rural-only' : (v === '—' ? 'empty' : '')) + '">' + v + '</div></div>';
            };
            const photoRowM = (label, value) => {
                const raw = (value || '').trim();
                const urls = raw ? raw.split(',').map(x => x.trim()).filter(u => u && u !== '—' && u !== '-') : [];
                const photoHtml = urls.length
                    ? '<div class="info-value photo-value" style="display:flex;flex-wrap:wrap;gap:12px;">' + urls.map(u => '<img src="' + escapeHtml(u) + '" alt="照片" onclick="viewPhotoOnline(\'' + escapeJsStr(u) + '\')" style="width:320px;height:240px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer;">').join('') + '</div>'
                    : '<div class="info-value empty">—</div>';
                return '<div class="info-item full-width" style="flex-wrap:wrap;">' +
                    '<div style="width:100%;color:#d93025;font-size:12px;margin-bottom:2px;">需使用移动端现场实地拍摄照片，带地址时间水印！</div>' +
                    '<div class="info-label">' + label + '</div>' + photoHtml + '</div>';
            };
            return '<div class="info-grid info-grid-2col">' +
                kvM('管理措施', r.measureDesc, false, true) +
                kvM('开始时间', r.startTime) +
                kvM('结束时间', r.actualEndTime || r.planEndTime) +
                kvM('负责人信息', r.dutyPerson) +
                kvM('联系电话', r.phone) +
                photoRowM('管理措施实施照片', r.implementPhotos) +
                photoRowM('管理措施完成照片（最少上传两张照片）', r.completePhotos) +
                kvM('措施是否完成', isMeasureDoneRecord('manage', r) ? '是' : '否') +
                kvM('备注', r.remark, false, true) +
                kvM('填报人', r.reporter) +
                kvM('填报时间', r.reportTime) +
            '</div>';
        }

        // 工程措施详情网格（查看态）
        function renderProjectDetailGrid(r) {
            const kvN = (label, value, fullWidth) => '<div class="info-item' + (fullWidth ? ' full-width' : '') + '"><div class="info-label">' + label + '</div><div class="info-value' + ((value === undefined || value === null || value === '' || value === '—') ? ' empty' : '') + '">' + ((value === undefined || value === null || value === '') ? '—' : value) + '</div></div>';
            const photoField = (label, arr) => '<div class="info-item full-width" style="flex-wrap:wrap;">' +
                '<div style="width:100%;color:#d93025;font-size:12px;margin-bottom:2px;">需使用移动端现场实地拍摄照片，带地址时间水印！</div>' +
                '<div class="info-label">' + label + '</div>' +
                renderPhotoValue(arr, label) +
            '</div>';
            return '<div class="info-grid info-grid-2col">' +
                kvN('工程措施', r.projectName, true) +
                kvN('实施拟采用的政策路径', r.policyPath) +
                kvN('其他实施拟采用政策路径', r.otherPolicyPath) +
                kvN('细化工程措施方案', r.planDetail, true) +
                kvN('开始时间', r.startDate) +
                kvN('结束时间', r.endDate) +
                kvN('负责人信息', r.manager) +
                kvN('联系电话', r.phone) +
                photoField('工程措施实施照片', r.implementPhotos) +
                photoField('工程措施完成照片', r.completePhotos) +
                kvN('措施是否完成', isMeasureDoneRecord('project', r) ? '是' : '否') +
                kvN('备注', r.remark) +
                kvN('填报人', r.reporter) +
                kvN('填报时间', r.reportTime) +
            '</div>';
        }

        // 阶段折叠卡片：头（已整治/整治中 + 第N阶段 + 时间范围 + 措施汇总），体（整治情况 + 管理措施×N + 工程措施×N）
        function renderMeasureStageCard(st, idx, total) {
            const sm = getStageMeasures(st);
            const done = isStageDone(st);
            const statusText = done ? '已整治' : '整治中';
            const statusColor = done ? 'var(--safe)' : 'var(--major, #fa8c16)';
            const rn = getStageRangeAndNames(st, sm);
            // ===== 块1：整治情况 =====
            const sit = st.situation || {};
            const sitMeasures = Array.isArray(sit.measures) ? sit.measures : [];
            const sitMeasuresText = sitMeasures.length
                ? sitMeasures.map(function(m){ return (m === '其他' && sit.measuresOther) ? ('其他（' + sit.measuresOther + '）') : m; }).join('、')
                : '—';
            const sitCompletedHtml = sit.completed === '是'
                ? '<span class="status-badge safe">是</span>'
                : (sit.completed === '否' ? '<span class="status-badge warning">否</span>' : '—');
            const situationHtml = '<div class="info-section-title" style="display:flex;justify-content:space-between;align-items:center;">' +
                    '<span><i class="fas fa-clipboard-check"></i> 整治情况</span>' +
                    '<button class="bottom-btn" style="padding:4px 12px;font-size:12px;" onclick="event.stopPropagation();openRectifySituationEditModal(\'' + st.id + '\')"><i class="fas fa-edit"></i> 编辑</button>' +
                '</div>' +
                '<div class="info-grid info-grid-2col">' +
                    '<div class="info-item full-width"><div class="info-label">整治措施</div><div class="info-value' + (sitMeasuresText === '—' ? ' empty' : '') + '">' + sitMeasuresText + '</div></div>' +
                    '<div class="info-item"><div class="info-label">是否完成整治</div><div class="info-value">' + sitCompletedHtml + '</div></div>' +
                '</div>';
            // ===== 块2/3：管理措施 / 工程措施（各可多条）=====
            const measureBlock = function(kind, list) {
                const isManage = kind === 'manage';
                const title = isManage ? '管理措施' : '工程措施';
                const icon = isManage ? 'fa-shield-alt' : 'fa-hammer';
                const flatList = isManage ? (currentHouseArch.manageRecords || []) : (currentHouseArch.projectRecords || []);
                const itemsHtml = list.length
                    ? list.map(function(r, ri) {
                        const flatIdx = flatList.indexOf(r);
                        // 就地编辑：本条处于编辑态 → body 用编辑表单替换详情网格
                        const isEditingThis = (measureFormState && measureFormState.mode === 'edit'
                            && measureFormState.kind === kind && measureFormState.idx === flatIdx);
                        const grid = isEditingThis
                            ? renderMeasureFormHtml(kind, 'edit', flatIdx)
                            : (isManage ? renderManageDetailGrid(r) : renderProjectDetailGrid(r));
                        const recDone = isMeasureDoneRecord(kind, r);
                        const recHistory = isMeasureHistoryRecord(kind, r);
                        // 开合显示：已完成（是）→ 默认折叠；未完成 → 默认展开；编辑态强制展开
                        const recOpen = !recDone || isEditingThis;
                        const recStatusText = recDone ? '措施已完成整治' : '措施整治中';
                        const recStatusColor = recDone ? 'var(--safe)' : 'var(--major, #fa8c16)';
                        const rr = getRecordRangeAndName(kind, r);
                        // 「历史」按钮：仅历史记录（完成=是且有结束时间）显示
                        const historyBtn = recHistory
                            ? '<button class="mh-toggle" onclick="event.stopPropagation();toggleMeasureHistory(\'rec-' + kind + '\',' + flatIdx + ')">历史</button>'
                            : '';
                        // 历史记录只读 / 编辑态：不显示 编辑/删除 操作栏（编辑态用表单自带的取消/保存）
                        const actionBar = (recHistory || isEditingThis)
                            ? ''
                            : '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);">' +
                                '<button class="bottom-btn" style="padding:4px 12px;font-size:12px;" onclick="event.stopPropagation();openMeasureEditForm(\'' + kind + '\',' + flatIdx + ')"><i class="fas fa-edit"></i> 编辑</button>' +
                                '<button class="bottom-btn" style="padding:4px 12px;font-size:12px;border-color:var(--danger);color:var(--danger);" onclick="event.stopPropagation();deleteMeasureRecord(\'' + kind + '\',' + flatIdx + ')"><i class="fas fa-trash-alt"></i> 删除</button>' +
                              '</div>';
                        return '<div class="measure-history-card' + (recOpen ? ' open' : '') + '" id="mhCard-rec-' + kind + '-' + flatIdx + '">' +
                            '<div class="measure-history-head" onclick="toggleMeasureHistory(\'rec-' + kind + '\',' + flatIdx + ')">' +
                                '<i class="fas ' + (recDone ? 'fa-check-circle' : 'fa-circle') + ' mh-status" style="font-size:' + (recDone ? '13px' : '8px') + ';color:' + recStatusColor + ';"></i>' +
                                '<span style="font-size:13px;color:' + recStatusColor + ';font-weight:500;">' + recStatusText + '</span>' +
                                '<span style="font-size:13px;color:var(--text-secondary);flex-shrink:0;">' + title + '</span>' +
                                '<span class="mh-range">' + rr.range + '</span>' +
                                '<span class="mh-name">' + rr.name + '</span>' +
                                historyBtn +
                                '<i class="fas fa-chevron-right mh-caret"></i>' +
                            '</div>' +
                            '<div class="measure-history-body">' + grid + actionBar + '</div>' +
                        '</div>';
                    }).join('')
                    : '<div class="record-empty" style="padding:16px;">暂无' + title + '记录</div>';
                return '<div class="info-section-title" style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;">' +
                        '<span><i class="fas ' + icon + '"></i> ' + title + '（' + list.length + '）</span>' +
                        '<button class="bottom-btn" style="padding:4px 12px;font-size:12px;" onclick="event.stopPropagation();openMeasureForm(\'' + kind + '\',\'' + st.id + '\')"><i class="fas fa-plus"></i> 新增' + title + '</button>' +
                    '</div>' + itemsHtml;
            };
            // 内嵌填报表单：仅「新增」挂在阶段卡底部；「编辑」已就地内嵌进对应记录卡 body
            const formHtml = (measureFormState && measureFormState.mode === 'new' && measureFormState.stageId === st.id)
                ? renderMeasureFormHtml(measureFormState.kind, measureFormState.mode, measureFormState.idx)
                : '';
            // 最新一个阶段默认展开；含活动表单的阶段强制展开
            const cardOpen = (idx === total - 1) || (measureFormState && measureFormState.stageId === st.id);
            // 「历史」按钮：仅当阶段下全部措施均为历史（完成=是且有结束时间）时显示
            const allRecs = sm.manage.concat(sm.project);
            const stageAllHistory = allRecs.length > 0 && allRecs.every(function(r, i){
                return isMeasureHistoryRecord(i < sm.manage.length ? 'manage' : 'project', r);
            });
            const stageHistoryBtn = stageAllHistory
                ? '<button class="mh-toggle" onclick="event.stopPropagation();toggleMeasureHistory(\'stage\',' + idx + ')">历史</button>'
                : '';
            // 含历史记录（任一措施完成=是且有结束时间）→ 不允许删除阶段
            const stageHasHistory = allRecs.some(function(r, i){
                return isMeasureHistoryRecord(i < sm.manage.length ? 'manage' : 'project', r);
            });
            const deleteStageBtn = stageHasHistory
                ? ''
                : '<button class="bottom-btn" style="padding:4px 12px;font-size:12px;border-color:var(--danger);color:var(--danger);" onclick="event.stopPropagation();deleteMeasureStage(' + idx + ')"><i class="fas fa-trash-alt"></i> 删除阶段</button>';
            return '<div class="measure-history-card' + (cardOpen ? ' open' : '') + '" id="mhCard-stage-' + idx + '">' +
                '<div class="measure-history-head" onclick="toggleMeasureHistory(\'stage\',' + idx + ')">' +
                    '<i class="fas fa-circle mh-status" style="font-size:8px;color:' + statusColor + ';"></i>' +
                    '<span style="font-size:13px;color:' + statusColor + ';font-weight:500;">' + statusText + '</span>' +
                    '<span class="mh-range">' + rn.range + '</span>' +
                    '<span class="mh-name">' + (rn.names || '—') + '</span>' +
                    stageHistoryBtn +
                    '<i class="fas fa-chevron-right mh-caret"></i>' +
                '</div>' +
                '<div class="measure-history-body">' +
                    situationHtml +
                    measureBlock('manage', sm.manage) +
                    measureBlock('project', sm.project) +
                    formHtml +
                    (deleteStageBtn
                        ? '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">' + deleteStageBtn + '</div>'
                        : '') +
                '</div>' +
            '</div>';
        }

        // 内嵌填报表单（编辑/新增共用；scope='edit'|'new'，editIdx=-1 表示新增）
        function renderMeasureFormHtml(kind, scope, editIdx) {
            const s = currentHouseArch;
            const isManage = kind === 'manage';
            const list = isManage ? (s.manageRecords || []) : (s.projectRecords || []);
            const rec = (scope === 'edit' && editIdx >= 0) ? (list[editIdx] || {}) : {};
            const WATER_HINT = '需使用移动端现场实地拍摄照片，带地址时间水印！';
            const esc = (v) => String(v === undefined || v === null ? '' : v).replace(/"/g, '&quot;');
            const greenLabel = (label, hint) => '<label class="form-label">' + label + (hint ? '<span style="color:#d93025;font-size:12px;margin-left:8px;font-weight:400;">' + hint + '</span>' : '') + '</label>';
            const normalLabel = (label, hint) => '<label class="form-label">' + label + (hint ? '<span style="color:#d93025;font-size:12px;margin-left:8px;font-weight:400;">' + hint + '</span>' : '') + '</label>';
            const dataKey = (f) => 'data-' + scope + '-field="' + f + '"';
            const inputText = (label, f, val, green) =>
                '<div class="form-item">' + (green ? greenLabel(label) : normalLabel(label)) +
                '<input class="form-input" type="text" ' + dataKey(f) + ' value="' + esc(val) + '"></div>';
            const inputDate = (label, f, val, green) =>
                '<div class="form-item">' + (green ? greenLabel(label) : normalLabel(label)) +
                '<input class="form-input" type="date" ' + dataKey(f) + ' value="' + esc(normalizeDateValue(val)) + '"></div>';
            // 填报时间/提交时间/审核时间/更新时间：只读展示，保存时系统自动记录
            const inputReadonlyTime = (label, f, val) =>
                '<div class="form-item"><label class="form-label">' + label + ' <span style="font-weight:normal;color:var(--gray);font-size:12px;">（保存时自动记录）</span></label>' +
                '<input class="form-input" type="text" ' + dataKey(f) + ' value="' + esc(val) + '" readonly style="background:#f5f6f8;color:#888;cursor:not-allowed;"></div>';
            const inputTextarea = (label, f, val, green, hint) =>
                '<div class="form-item form-item-full">' + (green ? greenLabel(label, hint) : normalLabel(label, hint)) +
                '<textarea class="form-input" rows="2" ' + dataKey(f) + '>' + esc(val) + '</textarea></div>';
            const inputSelect = (label, f, val, opts, green) => {
                const optsHtml = opts.map(o => {
                    const v = (typeof o === 'object') ? o.value : o;
                    const t = (typeof o === 'object') ? o.label : o;
                    return '<option value="' + v + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + t + '</option>';
                }).join('');
                return '<div class="form-item">' + (green ? greenLabel(label) : normalLabel(label)) +
                    '<select class="form-input" ' + dataKey(f) + '>' + optsHtml + '</select></div>';
            };
            // 是/否 单选（radio），选中值同步到隐藏 input
            const inputRadioYN = (label, f, val, green) => {
                const curVal = String(val === true || val === '是' || val === '已完成' ? '是' : (val === false || val === '否' || val === '' ? '否' : val));
                const radioName = 'measure-' + scope + '-' + f + '-radio';
                const radioHtml = ['是', '否'].map(function(o) {
                    const checked = (curVal === o) ? ' checked' : '';
                    return '<label style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;font-weight:normal;">' +
                        '<input type="radio" name="' + radioName + '" class="measure-yn-radio" data-target="' + f + '" value="' + o + '"' + checked + ' style="cursor:pointer;">' +
                        '<span>' + o + '</span>' +
                        '</label>';
                }).join('');
                return '<div class="form-item">' + (green ? greenLabel(label) : normalLabel(label)) +
                    '<div class="radio-group" style="display:flex;gap:20px;align-items:center;padding:8px 0;">' + radioHtml + '</div>' +
                    '<input type="hidden" class="form-input measure-yn-hidden" ' + dataKey(f) + ' value="' + esc(curVal) + '">' +
                    '</div>';
            };
            const inputPhoto = (label, f, val, green, hint, accept) => {
                const raw = Array.isArray(val) ? val.join(',') : String(val || '');
                const acceptAttr = accept || 'image/*';
                return '<div class="form-item form-item-full">' + (green ? greenLabel(label, hint) : normalLabel(label, hint)) +
                    '<div class="file-upload-wrap">' +
                        '<input class="form-input file-url-input" type="hidden" ' + dataKey(f) + ' data-photo-type="' + (acceptAttr === 'image/*' ? 'image' : 'file') + '" value="' + esc(raw) + '">' +
                        '<input class="file-upload-input" type="file" accept="' + acceptAttr + '" multiple onchange="handleMeasureFormUpload(this)">' +
                        '<div class="file-upload-dropzone"><i class="fas fa-cloud-upload-alt"></i> 点击或拖拽上传' + (acceptAttr === 'image/*' ? '图片' : '附件') + '</div>' +
                    '</div></div>';
            };
            // 管理措施：下拉枚举，选中值直接作为 measureDesc（「其他」即选「其他」，无附加输入框）
            const MEASURE_TYPE_OPTIONS = ['停止使用', '停止经营', '封控警示', '人员撤离', '搭设防护措施', '持续监控', '其他'];
            const inputManageDesc = (val) => {
                const cur = String(val || '').trim();
                // 旧数据若为非枚举的自由文本，归入「其他」
                const selVal = (!!cur && MEASURE_TYPE_OPTIONS.indexOf(cur) < 0) ? '其他' : cur;
                const optsHtml = ['<option value="">请选择管理措施</option>'].concat(
                    MEASURE_TYPE_OPTIONS.map(function(o){ return '<option value="' + o + '"' + (selVal === o ? ' selected' : '') + '>' + o + '</option>'; })
                ).join('');
                return '<div class="form-item form-item-full"><label class="form-label">管理措施</label>' +
                    '<select class="form-input" ' + dataKey('measureDesc') + '>' + optsHtml + '</select>' +
                    '</div>';
            };
            // 工程措施：下拉枚举（含「空」字面选项），旧自由文本归「其他」
            const PROJECT_TYPE_OPTIONS = ['拆除重建', '维修加固', '拆除灭失', '其他', '空'];
            const inputProjectName = (val) => {
                const cur = String(val || '').trim();
                const selVal = (!!cur && PROJECT_TYPE_OPTIONS.indexOf(cur) < 0) ? '其他' : cur;
                const optsHtml = ['<option value="">请选择工程措施</option>'].concat(
                    PROJECT_TYPE_OPTIONS.map(function(o){ return '<option value="' + o + '"' + (selVal === o ? ' selected' : '') + '>' + o + '</option>'; })
                ).join('');
                return '<div class="form-item form-item-full"><label class="form-label">工程措施</label>' +
                    '<select class="form-input" ' + dataKey('projectName') + '>' + optsHtml + '</select>' +
                    '</div>';
            };
            let fieldsHtml = '';
            if (isManage) {
                fieldsHtml =
                    inputManageDesc(rec.measureDesc) +
                    inputDate('开始时间', 'startTime', rec.startTime, true) +
                    inputDate('结束时间', 'actualEndTime', rec.actualEndTime || rec.planEndTime) +
                    inputText('负责人信息', 'dutyPerson', rec.dutyPerson, true) +
                    inputText('联系电话', 'phone', rec.phone, true) +
                    inputPhoto('管理措施实施照片', 'implementPhotos', rec.implementPhotos, false, WATER_HINT) +
                    inputPhoto('管理措施完成照片（最少上传两张照片）', 'completePhotos', rec.completePhotos, false, WATER_HINT) +
                    inputRadioYN('措施是否完成', 'isDone', (rec.isDone === true || rec.isDone === '已完成' || rec.isDone === '是') ? '是' : '否') +
                    inputTextarea('备注', 'remark', rec.remark, false) +
                    inputText('填报人', 'reporter', rec.reporter) +
                    inputReadonlyTime('填报时间', 'reportTime', rec.reportTime);
            } else {
                fieldsHtml =
                    inputProjectName(rec.projectName) +
                    inputText('实施拟采用的政策路径', 'policyPath', rec.policyPath) +
                    inputText('其他实施拟采用政策路径', 'otherPolicyPath', rec.otherPolicyPath) +
                    inputTextarea('细化工程措施方案', 'planDetail', rec.planDetail, true) +
                    inputPhoto('细化工程措施方案附件', 'planFiles', rec.planFiles, false, '', '*') +
                    inputDate('开始时间', 'startDate', rec.startDate, true) +
                    inputDate('结束时间', 'endDate', rec.endDate) +
                    inputText('负责人信息', 'manager', rec.manager, true) +
                    inputText('联系电话', 'phone', rec.phone, true) +
                    inputPhoto('工程措施实施照片', 'implementPhotos', rec.implementPhotos, false, WATER_HINT) +
                    inputPhoto('工程措施完成照片', 'completePhotos', rec.completePhotos, false, WATER_HINT) +
                    inputRadioYN('措施是否完成', 'status', (rec.status === '已完成' || rec.status === '是') ? '是' : '否') +
                    inputTextarea('备注', 'remark', rec.remark, false) +
                    inputText('填报人', 'reporter', rec.reporter) +
                    inputReadonlyTime('填报时间', 'reportTime', rec.reportTime);
            }
            const cancelAction = (scope === 'edit')
                ? 'cancelMeasureForm(\'' + kind + '\')'
                : 'cancelMeasureForm(\'' + kind + '\')';
            const saveAction = 'saveMeasureForm(\'' + kind + '\',' + (scope === 'edit' ? editIdx : -1) + ')';
            const titleText = (scope === 'edit') ? '编辑记录' : '新增填报';
            // 阶段定位标记
            let stageTag = '';
            try {
                const st = (currentHouseArch.measureStages || []).find(function(x){ return measureFormState && x.id === measureFormState.stageId; });
                if (st) stageTag = '<span style="font-size:12px;font-weight:normal;color:#909399;margin-left:8px;">第' + st.no + '阶段</span>';
            } catch (e) {}
            // 编辑态就地嵌在记录卡 body 内 → 去掉多余 margin-top；新增态挂在阶段卡底部 → 保留 margin-top
            const blockMargin = (scope === 'edit') ? 'margin-top:0;' : 'margin-top:14px;';
            return '<div class="measure-form-block" style="border:1px solid var(--border);border-radius:8px;padding:16px 18px;' + blockMargin + 'background:#fff;">' +
                '<div class="info-section-title" style="margin-bottom:14px;"><i class="fas fa-edit"></i> ' + (isManage ? '管理措施' : '工程措施') + titleText + stageTag + '</div>' +
                '<div class="form-grid">' + fieldsHtml + '</div>' +
                '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">' +
                    '<button class="bottom-btn" onclick="' + cancelAction + '"><i class="fas fa-times"></i> 取消</button>' +
                    '<button class="bottom-btn primary" onclick="' + saveAction + '"><i class="fas fa-save"></i> 保存</button>' +
                '</div>' +
            '</div>';
        }

        // 整治措施纯内容（阶段化：阶段折叠卡列表 + 新增阶段按钮），不含卡片壳/bottom-bar，供 renderMeasureContent 与风险详情内嵌复用
        function renderMeasureStageListBody() {
            const s = currentHouseArch;
            try { migrateMeasureToStages(s); } catch (e) {}
            const stages = Array.isArray(s.measureStages) ? s.measureStages : [];
            const cardsHtml = stages.length
                ? stages.map(function(st, idx){ return renderMeasureStageCard(st, idx, stages.length); }).join('')
                : '<div class="record-empty">暂无整治阶段记录，点击右上角「新增阶段」开始填报</div>';
            const addBtnHtml = '<button class="bottom-btn" style="padding:4px 12px;font-size:12px;" onclick="addMeasureStage()"><i class="fas fa-plus"></i> 新增阶段</button>';
            return '<div class="record-section-title" style="display:flex;justify-content:space-between;align-items:center;">' +
                '<span><i class="fas fa-tools"></i> 阶段性整治措施</span>' +
                addBtnHtml +
            '</div>' +
            cardsHtml;
        }

        function renderMeasureContent() {
            // v2：治理链门禁——第二类/第三类风险可进入整治措施
            const __s = currentHouseArch;
            ensureGovernanceEvents(__s);
            const __evs = __s.governanceEvents || [];
            // 第一类（未发现安全隐患）：入口保留但显示"无需治理"提示
            if (isCurrentlyFirstClass(__s)) {
                return '<div class="content-card">' +
                    '<div class="content-card-header"><div class="content-card-title"><i class="fas fa-tools"></i> 整治措施</div></div>' +
                    '<div class="content-body">' + firstClassHintHTML('整治措施') + '</div>' +
                '</div>';
            }
            if (!__evs.length) {
                return '<div class="content-card">' +
                    '<div class="content-card-header"><div class="content-card-title"><i class="fas fa-tools"></i> 整治措施</div></div>' +
                    '<div class="content-body"><div class="record-empty" style="padding:60px 20px;text-align:center;">' +
                        '<i class="fas fa-lock" style="font-size:28px;color:#c0c4cc;display:block;margin-bottom:14px;"></i>' +
                        '第二类/第三类风险需进入治理流程<br><span style="font-size:12px;color:#909399;">当前房屋暂无第二类/第三类结论的风险记录，无需进行整治措施</span>' +
                    '</div></div>' +
                '</div>';
            }
            const item = getSidebarItems().find(i => i.key === 'measure') || { title: '整治措施', icon: 'fa-tools' };
            // 阶段化：单一阶段列表（一个阶段 = 整治情况 + 管理措施×N + 工程措施×N）
            const mainBodyHtml = renderMeasureStageListBody();

            return '<div class="content-card">' +
                '<div class="content-card-header">' +
                    '<div class="content-card-title"><i class="fas ' + item.icon + '" style="width:16px;text-align:center;"></i> ' + item.title + '</div>' +
                '</div>' +
                '<div class="content-body">' +
                    mainBodyHtml +
                '</div>' +
            '</div>' +
            '<div class="bottom-bar">' +
                '<div class="bottom-info">' +
                    '<i class="fas fa-info-circle" style="color:var(--primary);"></i>' +
                    '当前节点：<span class="bottom-node">' + item.title + '</span> | <i class="far fa-eye"></i> <span class="mode-label">查看/编辑</span>' +
                '</div>' +
                '<div class="bottom-actions">' +
                '</div>' +
            '</div>';
        }

        // =========================================================
        // 整治措施新版式：内嵌填报表单状态与操作
        // =========================================================
        // 表单状态：null=收起；{kind:'manage'|'project', mode:'new'|'edit', idx:记录索引(edit 时有效), stageId:所属阶段}
        let measureFormState = null;

        // 历史记录折叠卡片展开/收起
        function toggleMeasureHistory(kind, idx) {
            const card = document.getElementById('mhCard-' + kind + '-' + idx);
            if (card) card.classList.toggle('open');
        }

        // 打开新增填报表单（归属指定阶段）
        function openMeasureForm(kind, stageId) {
            measureFormState = {
                kind: kind, mode: 'new', idx: -1,
                stageId: stageId || (((currentHouseArch.measureStages || [])[0]) || {}).id || ''
            };
            renderContent();
        }

        // 打开编辑表单（阶段归属随记录）
        function openMeasureEditForm(kind, idx) {
            const s = currentHouseArch;
            const list = (kind === 'manage') ? (s.manageRecords || []) : (s.projectRecords || []);
            const rec = list[idx] || {};
            // 历史记录（完成=是且有结束时间）只读，不允许编辑
            if (isMeasureHistoryRecord(kind, rec)) {
                alert('该措施已完成整治（含结束时间），已成历史，不允许再编辑。');
                return;
            }
            measureFormState = {
                kind: kind, mode: 'edit', idx: idx,
                stageId: rec.stageId || (((s.measureStages || [])[0]) || {}).id || ''
            };
            renderContent();
        }

        // 取消（收起表单）
        function cancelMeasureForm(kind) {
            measureFormState = null;
            renderContent();
        }

        // 删除一条措施记录
        function deleteMeasureRecord(kind, idx) {
            const s = currentHouseArch;
            const list = (kind === 'manage') ? (s.manageRecords || []) : (s.projectRecords || []);
            const rec = list[idx] || {};
            // 历史记录（完成=是且有结束时间）只读，不允许删除
            if (isMeasureHistoryRecord(kind, rec)) {
                alert('该措施已完成整治（含结束时间），已成历史，不允许删除。');
                return;
            }
            if (!confirm('确定删除这条记录吗？')) return;
            list.splice(idx, 1);
            if (kind === 'manage') s.manageRecords = list; else s.projectRecords = list;
            delete s._syncedAt;
            saveCurrentHouseArch(s);
            if (measureFormState && measureFormState.kind === kind) measureFormState = null;
            renderContent();
        }

        // 新增一个整治阶段（一个阶段 = 整治情况 + 管理措施×N + 工程措施×N）
        function addMeasureStage() {
            const s = currentHouseArch;
            if (!Array.isArray(s.measureStages)) s.measureStages = [];
            const n = s.measureStages.length + 1;
            s.measureStages.push({
                id: 'MST-' + (s.no || 'X') + '-' + String(n).padStart(3, '0'),
                no: n,
                situation: { measures: [], measuresOther: '', completed: '' },
                createdAt: (typeof formatDateTime === 'function') ? formatDateTime(new Date()) : ''
            });
            delete s._syncedAt;
            saveCurrentHouseArch(s);
            renderContent();
        }

        // 删除一个整治阶段（连同其下归属的措施记录）
        function deleteMeasureStage(idx) {
            const s = currentHouseArch;
            const st = (s.measureStages || [])[idx];
            if (!st) return;
            const sm = getStageMeasures(st);
            // 含历史记录（任一措施完成=是且有结束时间）→ 拦截
            const allRecs = sm.manage.concat(sm.project);
            const hasHistory = allRecs.some(function(r, i){
                return isMeasureHistoryRecord(i < sm.manage.length ? 'manage' : 'project', r);
            });
            if (hasHistory) {
                alert('该阶段含已完成整治（含结束时间）的历史记录，不允许删除阶段。');
                return;
            }
            if (!confirm('确定删除「第' + st.no + '阶段」吗？其下 ' + (sm.manage.length + sm.project.length) + ' 条措施记录将一并删除。')) return;
            s.manageRecords = (s.manageRecords || []).filter(function(m){ return m.stageId !== st.id; });
            s.projectRecords = (s.projectRecords || []).filter(function(p){ return p.stageId !== st.id; });
            s.measureStages.splice(idx, 1);
            // 至少保留一个空阶段
            if (!s.measureStages.length) {
                s.measureStages.push({ id: 'MST-' + (s.no || 'X') + '-001', no: 1, situation: { measures: [], measuresOther: '', completed: '' }, createdAt: '' });
            }
            // 重编号
            s.measureStages.forEach(function(x, i){ x.no = i + 1; });
            // 旧读口同步：rectifySituation = 最后一个阶段的整治情况
            const last = s.measureStages[s.measureStages.length - 1];
            s.rectifySituation = JSON.parse(JSON.stringify(last.situation || { measures: [], measuresOther: '', completed: '' }));
            delete s._syncedAt;
            saveCurrentHouseArch(s);
            if (measureFormState && measureFormState.stageId === st.id) measureFormState = null;
            renderContent();
        }

        // 保存表单
        function saveMeasureForm(kind, editIdx) {
            const s = currentHouseArch;
            const isManage = kind === 'manage';
            if (isManage && !Array.isArray(s.manageRecords)) s.manageRecords = [];
            if (!isManage && !Array.isArray(s.projectRecords)) s.projectRecords = [];
            const list = isManage ? s.manageRecords : s.projectRecords;
            const scope = (editIdx >= 0) ? 'edit' : 'new';
            // 收集字段
            const vals = {};
            document.querySelectorAll('[data-' + scope + '-field]').forEach(function(el) {
                vals[el.getAttribute('data-' + scope + '-field')] = el.value;
            });
            let rec;
            if (editIdx >= 0 && list[editIdx]) {
                rec = list[editIdx];
            } else {
                rec = {};
                const now = new Date();
                const pad = n => String(n).padStart(2, '0');
                const ts = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
                rec.reportTime = ts;
                rec.reporter = (s.responsiblePerson || s.owner || '').toString();
                if (isManage) {
                    rec.id = 'MGR-' + (s.no || 'X') + '-' + String(list.length + 1).padStart(3, '0');
                } else {
                    rec.id = 'PRJ-' + (s.no || 'X') + '-' + String(list.length + 1).padStart(3, '0');
                }
                // 新记录归属当前表单所在阶段
                rec.stageId = (measureFormState && measureFormState.stageId) || (((s.measureStages || [])[0]) || {}).id || '';
            }
            if (isManage) {
                rec.measureDesc = vals['measureDesc'] || '';
                rec.startTime = vals['startTime'] || '';
                rec.actualEndTime = vals['actualEndTime'] || '';
                rec.dutyPerson = vals['dutyPerson'] || '';
                rec.phone = vals['phone'] || '';
                rec.implementPhotos = vals['implementPhotos'] || '';
                rec.completePhotos = vals['completePhotos'] || '';
                rec.isDone = (vals['isDone'] === '是' || vals['isDone'] === '已完成');
                rec.remark = vals['remark'] || '';
                rec.reporter = vals['reporter'] || rec.reporter || '';
                // 填报时间：系统自动记录本次保存时间
                rec.reportTime = formatDateTime(new Date());
            } else {
                rec.projectName = vals['projectName'] || '';
                rec.policyPath = vals['policyPath'] || '';
                rec.otherPolicyPath = vals['otherPolicyPath'] || '';
                rec.planDetail = vals['planDetail'] || '';
                rec.planFiles = (vals['planFiles'] || '').split(',').map(t => t.trim()).filter(Boolean);
                rec.startDate = vals['startDate'] || '';
                rec.endDate = vals['endDate'] || '';
                rec.manager = vals['manager'] || '';
                rec.phone = vals['phone'] || '';
                rec.implementPhotos = (vals['implementPhotos'] || '').split(',').map(t => t.trim()).filter(Boolean);
                rec.completePhotos = (vals['completePhotos'] || '').split(',').map(t => t.trim()).filter(Boolean);
                rec.status = vals['status'] || '否';
                rec.remark = vals['remark'] || '';
                rec.reporter = vals['reporter'] || rec.reporter || '';
                // 填报时间：系统自动记录本次保存时间
                rec.reportTime = formatDateTime(new Date());
            }
            if (editIdx >= 0) {
                list[editIdx] = rec;
            } else {
                list.push(rec);
            }
            delete s._syncedAt;
            saveCurrentHouseArch(s);
            measureFormState = null;
            renderContent();
        }

        // 内嵌表单照片/附件上传（与 handleMeasurePhotoUpload 逻辑一致，适配 data-*-field 输入框）
        function handleMeasureFormUpload(input) {
            const wrap = input.parentElement;
            const files = Array.from(input.files || []);
            if (!files.length) return;
            const urlInput = wrap.querySelector('.file-url-input');
            const isImageOnly = urlInput && urlInput.getAttribute('data-photo-type') === 'image';
            if (isImageOnly) {
                const invalid = files.find(f => !f.type.startsWith('image/'));
                if (invalid) { alert('请上传图片文件'); return; }
            }
            const existing = (urlInput.value || '').split(',').map(s => s.trim()).filter(Boolean);
            const readers = files.map(file => new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => resolve({ url: e.target.result, name: file.name, size: file.size, type: file.type });
                reader.readAsDataURL(file);
            }));
            Promise.all(readers).then(results => {
                // 缓存文件名/大小，用于显示与下载
                if (!window.__measureFileMeta) window.__measureFileMeta = {};
                results.forEach(r => { window.__measureFileMeta[r.url] = { name: r.name, size: r.size, type: r.type }; });
                const allUrls = existing.concat(results.map(r => r.url)).filter((v, i, a) => a.indexOf(v) === i);
                urlInput.value = allUrls.join(',');
                urlInput.dispatchEvent(new Event('input'));
                renderMeasureFileList(wrap, allUrls);
            });
        }

        function renderMeasureFileList(wrap, urls) {
            let list = wrap.querySelector('.measure-file-list');
            if (!list) {
                list = document.createElement('div');
                list.className = 'measure-file-list';
                list.style.cssText = 'display:flex;flex-direction:column;gap:6px;margin-top:8px;';
                wrap.appendChild(list);
            }
            if (!urls || !urls.length) { list.innerHTML = ''; return; }
            const meta = window.__measureFileMeta || {};
            list.innerHTML = urls.map((u, idx) => {
                const m = meta[u] || {};
                const isImg = u.startsWith('data:image') || /\.(jpg|jpeg|png|gif|bmp|webp)$/i.test(u);
                const isPdf = u.startsWith('data:application/pdf') || /\.pdf$/i.test(u);
                const icon = isImg ? 'fa-image' : (isPdf ? 'fa-file-pdf' : 'fa-file');
                const name = m.name || (isImg ? '图片 ' + (idx + 1) : '附件 ' + (idx + 1));
                const sizeStr = m.size ? formatFileSize(m.size) : '';
                const thumb = isImg
                    ? '<img src="' + escapeHtml(u) + '" style="width:40px;height:40px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:pointer;flex-shrink:0;" onclick="viewPhotoOnline(\'' + escapeJsStr(u) + '\')">'
                    : '<div style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:#f5f6f7;border-radius:4px;border:1px solid var(--border);color:var(--text-secondary);flex-shrink:0;"><i class="fas ' + icon + '" style="font-size:18px;"></i></div>';
                return '<div class="measure-file-item" data-idx="' + idx + '" style="display:flex;align-items:center;gap:10px;padding:6px 8px;background:#f9fafb;border:1px solid var(--border);border-radius:4px;">' +
                    thumb +
                    '<div style="flex:1;min-width:0;">' +
                        '<div style="font-size:13px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + escapeHtml(name) + '">' + escapeHtml(name) + '</div>' +
                        (sizeStr ? '<div style="font-size:11px;color:var(--text-secondary);">' + sizeStr + '</div>' : '') +
                    '</div>' +
                    '<button type="button" class="measure-file-btn" title="预览" onclick="previewMeasureFile(' + idx + ', this)" style="background:none;border:none;color:var(--primary);cursor:pointer;padding:4px 6px;font-size:13px;"><i class="fas fa-eye"></i></button>' +
                    '<button type="button" class="measure-file-btn" title="下载" onclick="downloadMeasureFile(' + idx + ', this)" style="background:none;border:none;color:var(--primary);cursor:pointer;padding:4px 6px;font-size:13px;"><i class="fas fa-download"></i></button>' +
                    '<button type="button" class="measure-file-btn" title="删除" onclick="removeMeasureFile(' + idx + ', this)" style="background:none;border:none;color:#d93025;cursor:pointer;padding:4px 6px;font-size:13px;"><i class="fas fa-times"></i></button>' +
                '</div>';
            }).join('');
        }

        function getMeasureFileListFromWrap(wrap) {
            const urlInput = wrap.querySelector('.file-url-input');
            return (urlInput && urlInput.value || '').split(',').map(s => s.trim()).filter(Boolean);
        }

        function previewMeasureFile(idx, btn) {
            const wrap = btn.closest('.file-upload-wrap');
            const urls = getMeasureFileListFromWrap(wrap);
            const url = urls[idx];
            if (!url) return;
            if (url.startsWith('data:image')) {
                viewPhotoOnline(url);
            } else if (url.startsWith('data:')) {
                const w = window.open();
                if (w) { w.document.write('<iframe src="' + escapeHtml(url) + '" style="width:100%;height:100%;border:0;"></iframe>'); }
            } else {
                window.open(url, '_blank');
            }
        }

        function downloadMeasureFile(idx, btn) {
            const wrap = btn.closest('.file-upload-wrap');
            const urls = getMeasureFileListFromWrap(wrap);
            const url = urls[idx];
            if (!url) return;
            const meta = (window.__measureFileMeta || {})[url] || {};
            const ext = (function() {
                if (url.startsWith('data:')) {
                    const m = url.match(/^data:([^;]+)/);
                    if (m) {
                        const mime = m[1];
                        if (mime.indexOf('image/png') === 0) return '.png';
                        if (mime.indexOf('image/jpeg') === 0 || mime.indexOf('image/jpg') === 0) return '.jpg';
                        if (mime.indexOf('image/gif') === 0) return '.gif';
                        if (mime.indexOf('image/webp') === 0) return '.webp';
                        if (mime.indexOf('application/pdf') === 0) return '.pdf';
                    }
                    return '';
                }
                const dotIdx = url.lastIndexOf('.');
                return dotIdx > -1 ? url.substring(dotIdx) : '';
            })();
            const a = document.createElement('a');
            a.href = url;
            a.download = meta.name || ('文件' + (idx + 1) + ext);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function removeMeasureFile(idx, btn) {
            if (!confirm('确认删除该文件？')) return;
            const wrap = btn.closest('.file-upload-wrap');
            const urlInput = wrap.querySelector('.file-url-input');
            const urls = getMeasureFileListFromWrap(wrap);
            urls.splice(idx, 1);
            urlInput.value = urls.join(',');
            urlInput.dispatchEvent(new Event('input'));
            renderMeasureFileList(wrap, urls);
        }

        // formatFileSize 统一定义见文件后部（约12690行），此处不再重复声明

        function bindMeasureUploadDropzones(rootEl) {
            const root = rootEl || document;
            root.querySelectorAll('.measure-form-block .file-upload-wrap, #crudEditForm .file-upload-wrap').forEach(wrap => {
                const input = wrap.querySelector('.file-upload-input');
                const dropzone = wrap.querySelector('.file-upload-dropzone');
                const urlInput = wrap.querySelector('.file-url-input');
                // 初始化已有文件列表
                if (urlInput && urlInput.value) {
                    const urls = (urlInput.value || '').split(',').map(s => s.trim()).filter(Boolean);
                    if (urls.length) renderMeasureFileList(wrap, urls);
                }
                if (!input || !dropzone) return;
                if (dropzone.dataset.bound === '1') return;
                dropzone.dataset.bound = '1';
                dropzone.addEventListener('click', () => input.click());
                ['dragenter', 'dragover'].forEach(ev => dropzone.addEventListener(ev, (e) => { e.preventDefault(); e.stopPropagation(); dropzone.classList.add('dragover'); }));
                ['dragleave', 'drop'].forEach(ev => dropzone.addEventListener(ev, (e) => { e.preventDefault(); e.stopPropagation(); dropzone.classList.remove('dragover'); }));
                dropzone.addEventListener('drop', (e) => {
                    const files = e.dataTransfer && e.dataTransfer.files;
                    if (files && files.length) {
                        try { input.files = files; } catch (err) { /* 部分浏览器不允许 */ }
                        handleMeasureFormUpload(input);
                    }
                });
            });
        }

        function renderPatrolBody() {
            const s = currentHouseArch;
            // 动态巡查仅一个二级 TAB（巡查情况），不再单独渲染 subTabsRow；房屋用途现场情况已并入每条巡查记录
            const subTabsRow = '';
            let list = s.patrolRecords || [];
            list = list.slice().sort((a, b) => (b.patrolDate || '').localeCompare(a.patrolDate || ''));
            const activeIndex = Math.min(recordViewState.patrol || 0, Math.max(list.length - 1, 0));
            recordViewState.patrol = activeIndex;
            const listHtml = recordListTable(
                ['巡查时间', '巡查单位', '巡查人员', '初步判定/巡查结论', { title: '状态', tag: true, tagClass: v => v === '最新' ? 'primary' : 'info' }],
                list.map(function(r, i) {
                    const status = i === 0 ? '最新' : '历史';
                    return [r.patrolDate || '—', r.patrolOrg || '—', r.patrolPerson || '—', normalizePatrolConclusion(r) || '—', status];
                }),
                'patrol',
                activeIndex,
                { showCrud: { edit: 'openCrudModal(\'patrol\'', delete: 'deleteCrudRecord(\'patrol\'' }, records: list,
                  showCrudDeleteFilter: function(record, globalIdx) { return globalIdx === 0; } }
            );
            const r = list[activeIndex] || {};
            // 新增字段以绿色显示
            const kvP = function(label, value) {
                const v = (value === undefined || value === null) ? '' : String(value);
                const isEmpty = v === '' || v === '—';
                const cls = isEmpty ? 'empty' : 'rural-only';
                return '<div class="info-item"><div class="info-label">' + label + '</div><div class="info-value ' + cls + '">' + (isEmpty ? '—' : v) + '</div></div>';
            };
            const grid = [
                kvP('巡查时间', r.patrolDate),
                kvP('巡查点位坐标', r.patrolPointCoord),
                kvP('巡查单位', r.patrolOrg),
                kvP('巡查人员', r.patrolPerson),
                kvP('问题描述', r.foundProblems || '无'),
                kvP('初步判定/巡查结论', normalizePatrolConclusion(r)),
                kvP('处置建议', r.suggestion)
            ].join('');
            // 现场照片
            const isImageUrl = (v) => v && v !== '—' && v !== '-' && (v.startsWith('data:image') || v.startsWith('http') || v.endsWith('.jpg') || v.endsWith('.jpeg') || v.endsWith('.png') || v.endsWith('.gif'));
            const photoUrls = (r.photos || '').split(',').map(s => s.trim()).filter(isImageUrl);
            const photoHtml = photoUrls.length
                ? '<div class="info-value photo-value photo-grid">' + photoUrls.map(u => '<img src="' + escapeHtml(u) + '" alt="现场照片" onclick="viewPhotoOnline(\'' + escapeJsStr(u) + '\')" style="width:72px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:pointer;">').join('') + '</div>'
                : '<div class="info-value empty">—</div>';
            const photoItem = '<div class="info-item full-width"><div class="info-label">现场照片</div>' + photoHtml + '</div>';
            // 记录级「房屋用途现场情况」区块（填报人/填报时间继承当次巡查）
            const su = (r && r.sceneUsage) || {};
            const suGrid = '<div class="record-detail-header" style="margin-top:16px;"><div class="title">房屋用途现场情况</div></div>' +
                '<div class="info-grid info-grid-2col">' +
                    kvP('当前使用情况', su.usageStatus) +
                    kvP('当前房屋用途', su.houseUsage) +
                '</div>';
            return subTabsRow +
                recordListWrapper('动态巡查记录列表', listHtml, { icon: 'fa-walking', showAdd: 'addCrudRecord(\'patrol\')' }) +
                '<div class="record-detail-header">' +
                    '<div class="title">巡查详情（' + (activeIndex + 1) + ' / ' + list.length + '）</div>' +
                '</div>' +
                '<div class="info-grid info-grid-2col">' + grid + photoItem + '</div>' +
                suGrid +
                renderRecordAddDanger(r, '巡查') +
                renderDiscoveryLinkedHazards(s, '巡查', r.id);
        }

        function renderAuditRows(list, showSeq) {
            if (!list || list.length === 0) return '<tr><td colspan="10" style="text-align:center;color:var(--text-secondary);">暂无数据</td></tr>';
            return list.map((item, idx) => {
                const reportVal = item.report || '';
                const hasFile = reportVal && (reportVal.startsWith('data:') || reportVal.startsWith('http'));
                const linked = (item.recordNames && item.recordNames.length)
                    ? item.recordNames.join('、')
                    : ((item.recordIndexes && item.recordIndexes.length)
                        ? item.recordIndexes.map(i => '第' + (i + 1) + '条').join('、')
                        : '—');
                return '<tr>' +
                    (showSeq ? '<td>' + (item.seq || (idx + 1)) + '</td>' : '') +
                    '<td>' + (item.submitter || '-') + '</td>' +
                    '<td>' + (item.submitTime || '-') + '</td>' +
                    '<td>' + (item.auditTime || '-') + '</td>' +
                    '<td>' + (item.auditor || '-') + '</td>' +
                    '<td>' + (item.conclusion || '-') + '</td>' +
                    '<td style="text-align:left;max-width:200px;">' + linked + '</td>' +
                    '<td>' + (hasFile ? '<button class="photo-btn" onclick="viewPhotoOnline(\'' + escapeJsStr(reportVal.split(',')[0].trim()) + '\')">查看报告</button>' : (reportVal || '—')) + '</td>' +
                    '<td>' + (item.remark || '-') + '</td>' +
                    '<td class="actions"><a class="op-btn edit" href="javascript:void(0)" onclick="openCloseAuditEditModal(' + idx + ')"><i class="fas fa-edit"></i> 编辑</a><a class="op-btn danger" href="javascript:void(0)" onclick="deleteCloseAudit(' + idx + ')"><i class="fas fa-trash-alt"></i> 删除</a></td>' +
                    '</tr>';
            }).join('');
        }

            try { backfillSecondClassHazards(s); } catch (e) {} // 第二类回补兜底

            const shown = hazards;

            const rows = pagedHazards.map(function(h) {
                const photos = (Array.isArray(h.photos) ? h.photos : (h.photos ? String(h.photos).split(/[\n,]/).map(function(t){ return t.trim(); }).filter(Boolean) : [])).filter(function(u){
                    return /^data:image\//.test(u) || /^https?:\/\//.test(u) || /\.(jpe?g|png|gif|bmp|webp|svg)(\?|$)/i.test(u);
                });

                    }).join('') + '</div>'
                    : '<span style="color:#c0c4cc;">—</span>';
                return '<tr>' +
                    '<td>' + (h.hazardType || '—') + (h.hazardTypeOther ? '<span style="color:#909399;font-size:11px;">（' + h.hazardTypeOther + '）</span>' : '') + '</td>' +

                el.addEventListener('click', function(){ currentMeasureSubTab = this.dataset.key; renderContent(); });
            });

        // HTML 转义（2026-10-19 三层档案改造新增）
        function esc(str) {

            } else if (key === 'risk') {
                // v2：风险信息记录由风险发现自动派生，不再手工编辑（在风险发现处增删改）
                html += '<button class="bottom-btn" onclick="jumpToDiscoverySource(\'survey\',\'\')"><i class="fas fa-search"></i> 前往风险发现</button>';
            } else if (key === 'plan') {
                html += '<button class="bottom-btn primary" onclick="openPlanEditModal(-1)"><i class="fas fa-plus"></i> 新增填报</button>';
            } else if (key === 'assessment' || key === 'evaluation') {
                // 鉴定/评估：记录卡片头部已含新增填报按钮，底栏不再重复
            } else if (key === 'emergency') {
                // 应急处置：记录列表已含新增/编辑/删除，底栏不再重复
            } else if (key === 'accept') {
                // 阶段性验收：填报卡片列表已含编辑/新增按钮，此处不再显示底部按钮
            } else if (key === 'control') {
                // 隐患动态：addDanger 已搬到排查/巡查记录级编辑，dynamic 由来源记录派生，无可编辑按钮
            } else {
                html += '<button class="bottom-btn primary" onclick="openCommonEditModal(\'' + key + '\')"><i class="fas fa-edit"></i> 编辑' + item.title + '</button>';
            }
            html += '</div>' +
            '</div>';
            return html;
        }

        // ===== 任务记录（2026-10-20 重构：以风险信息记录为核心，一次排查/巡查=一条任务） =====
        function renderTaskFlowContent(s) {
            const tasks = [];
            const houseNo = s.no || '';

            // 1. 农村自建房排查（2022年）—— surveyData_RURAL.survey1 字段库（历史记录）
            const sd = getSurveyData().survey1;
            if (sd && sd.rows && sd.rows.length) {
                const r = sd.rows[0] || [];
                tasks.push({
                    taskType: '2022年自建房排查',
                    taskName: '农村自建房安全隐患排查（2022年）',
                    joinedAt: r[0] || '',
                    result: r[8] || '',
                    sourceModule: 'survey1',
                    sourceId: houseNo + '-survey1',
                    sourceType: '排查',
                    sourceRecordId: ''
                });
            }

            // 2. 风险信息记录（riskRecords）→ 一次排查/巡查 = 一条任务
            (Array.isArray(s.riskRecords) ? s.riskRecords : []).forEach(function(rr) {
                tasks.push({
                    taskType: rr.sourceType === '巡查' ? '常态化监测' : '风险排查',
                    taskName: rr.sourceType === '巡查' ? '农村房屋安全动态巡查' : '农村房屋安全隐患排查',
                    joinedAt: rr.date || '',
                    result: rr.conclusion || rr.riskLevel || '',
                    sourceModule: rr.sourceType === '巡查' ? 'patrol' : 'inspection',
                    sourceId: rr.sourceId || rr.id || '',
                    sourceType: rr.sourceType || '排查',
                    sourceRecordId: rr.id || ''
                });
            });

            // 按时间倒序排列
            tasks.sort(function(a, b){ return String(b.joinedAt || '').localeCompare(String(a.joinedAt || '')); });

            if (!tasks.length) {
                return '<div class="record-empty" style="padding:60px 20px;text-align:center;">' +
                    '<i class="fas fa-inbox" style="font-size:28px;color:#c0c4cc;display:block;margin-bottom:14px;"></i>' +
                    '暂无任务记录<br><span style="font-size:12px;color:#909399;">当前房屋暂无排查/巡查任务记录</span>' +
                '</div>';
            }

            // 格式化时间：ISO时间戳 → YYYY-MM-DD HH:mm
            function fmtTime(t) {
                if (!t) return '—';
                const s = String(t);
                if (s.indexOf('T') >= 0) {
                    const d = new Date(s);
                    if (isNaN(d.getTime())) return s.slice(0, 10);
                    const y = d.getFullYear();
                    const m = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    const h = String(d.getHours()).padStart(2, '0');
                    const min = String(d.getMinutes()).padStart(2, '0');
                    return y + '-' + m + '-' + day + ' ' + h + ':' + min;
                }
                return s;
            }

            // 任务来源模块 → 跳转目标tab映射
            function getTaskJumpTarget(t) {
                const map = {
                    'survey1':   { tab: 'survey',    subTab: 'survey1',  label: '排查情况' },
                    'inspection':{ tab: 'discovery', subTab: 'survey',   label: '风险发现-排查' },
                    'patrol':    { tab: 'discovery', subTab: 'patrol',   label: '风险发现-巡查' },
                    'hazard':    { tab: 'hazard',    subTab: '',         label: '隐患台账' },
                    'governance':{ tab: 'hazard',    subTab: '',         label: '隐患台账' },
                    'risk':      { tab: 'risk',      subTab: '',         label: '风险信息记录' }
                };
                return map[t.sourceModule] || { tab: 'taskFlow', subTab: '', label: '任务记录' };
            }

            // 生成跳转链接（模拟跳转，带返回参数）
            function buildTaskLink(t) {
                const target = getTaskJumpTarget(t);
                const no = getCurrentHouseNo();
                const params = [];
                params.push('no=' + encodeURIComponent(no));
                params.push('tab=' + encodeURIComponent(target.tab));
                if (target.subTab) params.push('subTab=' + encodeURIComponent(target.subTab));
                if (t.sourceId) params.push('sourceId=' + encodeURIComponent(t.sourceId));
                params.push('from=taskFlow');
                return 'house-arch-detail-rural.html?' + params.join('&');
            }

            const rows = tasks.map(function(t, i) {
                const link = buildTaskLink(t);
                const taskNameHtml = '<a href="' + link + '" style="color:var(--primary);text-decoration:none;" onmouseover="this.style.textDecoration=\'underline\'" onmouseout="this.style.textDecoration=\'none\'">' + esc(t.taskName) + '</a>';
                // 隐患类型：排查/巡查发现的隐患描述，无隐患显示"—"
                const hazardTypeHtml = t.result && t.result !== '未发现安全隐患(第一类)'
                    ? '<td>' + esc(t.result) + '</td>'
                    : '<td style="color:#909399;text-align:center;">—</td>';
                // 判断：统一为三类口径（第一类/第二类/第三类）
                const judge = conclusionToLevel(t.result) || '';
                const judgeHtml = judge
                    ? '<td><span class="tag ' + (judge === '第三类' ? 'danger' : (judge === '第二类' ? 'warning' : 'info')) + '">' + esc(judge) + '</span></td>'
                    : '<td style="color:#909399;text-align:center;">—</td>';
                // 整治状态：从关联隐患实时派生（通过 riskRecord.linkedHazardIds 找隐患）
                let governStatus = '—';
                if (t.sourceRecordId) {
                    const rr = (s.riskRecords || []).find(function(r){ return r.id === t.sourceRecordId; });
                    const linkedHzIds = (rr && Array.isArray(rr.linkedHazardIds)) ? rr.linkedHazardIds : [];
                    if (linkedHzIds.length) {
                        const linkedHzs = (s.hazardRecords || []).filter(function(h){ return linkedHzIds.indexOf(h.id) !== -1; });
                        if (linkedHzs.length) {
                            if (linkedHzs.every(function(h){ return h.currentStatus === '已销号'; })) governStatus = '已整治';
                            else if (linkedHzs.some(function(h){ return h.currentStatus === '整治中' || h.currentStatus === '管控中'; })) governStatus = '整治中';
                            else governStatus = '未整治';
                        }
                    }
                }
                const governHtml = governStatus === '—'
                    ? '<td style="color:#909399;text-align:center;">—</td>'
                    : '<td><span class="tag ' + (governBadgeClass[governStatus] || 'info') + '">' + esc(governStatus) + '</span></td>';
                return '<tr>' +
                    '<td style="text-align:center;">' + (i + 1) + '</td>' +
                    '<td>' + esc(fmtTime(t.joinedAt)) + '</td>' +
                    '<td>' + taskNameHtml + '<br><span style="font-size:12px;color:#909399;">' + esc(t.taskType) + '</span></td>' +
                    hazardTypeHtml +
                    judgeHtml +
                    governHtml +
                '</tr>';
            }).join('');

            return '<div class="table-wrap"><table class="arch-table">' +
                '<thead><tr><th style="width:50px;text-align:center;">序号</th><th>任务日期</th><th>任务名称</th><th>隐患类型</th><th>判断</th><th>整治状态</th></tr></thead>' +
                '<tbody>' + rows + '</tbody></table></div>' +
                '<div style="margin-top:12px;padding:10px 14px;background:#f5f7fa;border:1px solid var(--border);border-radius:4px;font-size:12px;color:#909399;">' +
                    '<i class="fas fa-info-circle"></i> 点击任务名称可跳转到对应模块查看详情，返回时回到任务记录' +
                '</div>';
        }

        // ===== 留痕记录（changeLog 展示，2026-10-19 三层档案改造） =====
        function renderChangeLogContent(s) {
            const logs = s.changeLog || [];
            if (!logs.length) {
                return '<div class="record-empty" style="padding:60px 20px;text-align:center;">' +
                    '<i class="fas fa-history" style="font-size:28px;color:#c0c4cc;display:block;margin-bottom:14px;"></i>' +
                    '暂无留痕记录<br><span style="font-size:12px;color:#909399;">静态数据（房屋概况/宅基地/结构/使用）尚未发生修改</span>' +
                '</div>';
            }
            // 按时间倒序
            const sorted = logs.slice().sort(function(a, b){ return (b.changedAt || '').localeCompare(a.changedAt || ''); });
            const rows = sorted.map(function(log) {
                const srcMap = { manual: '手动编辑', import: '批量导入', task: '任务同步' };
                return '<tr>' +
                    '<td>' + esc(log.changedAt || '') + '</td>' +
                    '<td>' + esc(log.fieldLabel || log.fieldPath) + '</td>' +
                    '<td style="max-width:200px;word-break:break-all;">' + esc(log.oldValue || '(空)') + '</td>' +
                    '<td style="max-width:200px;word-break:break-all;">' + esc(log.newValue || '(空)') + '</td>' +
                    '<td>' + esc(log.changedBy || '') + '</td>' +
                    '<td><span class="tag">' + esc(srcMap[log.source] || log.source || '') + '</span></td>' +
                '</tr>';
            }).join('');
            return '<div class="table-wrap"><table class="arch-table">' +
                '<thead><tr><th>修改时间</th><th>修改字段</th><th>改前值</th><th>改后值</th><th>操作人</th><th>来源</th></tr></thead>' +
                '<tbody>' + rows + '</tbody></table></div>';
        }

        // 治理链/通用表格的纯内容渲染（不含 content-card 壳 / 事件切换器 / bottom-bar）
        // 供 renderTableContent 与「风险信息详情内嵌治理子tab」复用
        function renderGovernanceBody(key, s) {
            // measure：阶段化单一列表（整治情况 + 管理/工程措施均按阶段分组）
            if (key === 'measure') {
                return renderMeasureStageListBody();
            }
            if (key === 'control') return renderControlTable(s);
            if (key === 'accept') return renderAcceptTable(s);
            if (key === 'close') return renderCloseTable(s);
            if (key === 'plan') return renderPlanContent(s);
            if (key === 'assessment') return renderAssessmentContent(s);
            if (key === 'evaluation') return renderEvaluationContent(s);
            const data = getTableData()[key];
            if (!data) return '';
            let columns = data.columns;
            let values = data.rows[0] || [];
            // 安全鉴定：查看面板隐藏"隐患动态整治状态"列（保留原数据以兼容历史存档）
            if (key === 'assessment') {
                const keepIdx = columns.map((c, i) => c === '隐患动态整治状态' ? -1 : i).filter(i => i >= 0);
                columns = keepIdx.map(i => columns[i]);
                values = keepIdx.map(i => values[i]);
            }
            const fwFields = (key === 'assessment') ? ['鉴定报告', '备注'] : (key === 'evaluation' ? ['评估报告', '备注'] : []);
            // 2026-10-17：去除鉴定/评估互斥限制，用户按实际情况自由填报
            return '<div class="info-grid info-grid-2col">' + renderKeyValueGrid(columns, values, fwFields) + '</div>';
        }

        function renderKeyValueGrid(columns, values, fullWidthFields) {
            const fwFields = fullWidthFields || [];
            return columns.map((c, i) => {
                const isPhoto = c && c.includes('照片');
                const isAttach = c === '鉴定报告' || c === '评估报告';
                const isFullWidth = isPhoto || fwFields.includes(c);
                const val = values[i] || '';
                const isImageUrl = (v) => v && v !== '—' && v !== '-' && (v.startsWith('data:image') || v.startsWith('http') || v.endsWith('.jpg') || v.endsWith('.jpeg') || v.endsWith('.png') || v.endsWith('.gif'));
                let valueHtml = '';
                if (isPhoto && val) {
                    const urls = val.split(',').map(s => s.trim()).filter(isImageUrl);
                    valueHtml = urls.length
                        ? '<div class="info-value photo-value photo-grid">' + urls.map(u => '<img src="' + escapeHtml(u) + '" alt="照片" onclick="viewPhotoOnline(\'' + escapeJsStr(u) + '\')" style="width:72px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:pointer;">').join('') + '</div>'
                        : '<div class="info-value empty">—</div>';
                } else if (isAttach && val && val !== '—' && val !== '-') {
                    const files = projectFilesFromString(val);
                    valueHtml = files.length
                        ? '<div class="info-value attach-list">' + files.map(f => {
                            const isImage = f.url && (f.url.startsWith('data:image') || (f.url.startsWith('http') && /\.(jpg|jpeg|png|gif|bmp|webp)$/i.test(f.url)));
                            const icon = isImage ? 'fa-image' : 'fa-file';
                            const clickAttr = isImage ? ' onclick="viewPhotoOnline(\'' + escapeJsStr(f.url) + '\')" style="cursor:pointer;color:var(--primary);"' : ' style="color:var(--text-primary);"';
                            return '<div style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;margin:2px 6px 2px 0;background:#f5f7fa;border:1px solid var(--border);border-radius:4px;font-size:13px;">' +
                                '<i class="fas ' + icon + '" style="color:var(--primary);"></i>' +
                                '<span' + clickAttr + '>' + (f.name || '附件') + '</span>' +
                                (f.size ? '<span style="color:#999;font-size:12px;">(' + f.size + ')</span>' : '') +
                                '</div>';
                        }).join('') + '</div>'
                        : '<div class="info-value empty">—</div>';
                } else {
                    valueHtml = '<div class="info-value ' + (val ? '' : 'empty') + '">' + (val || '--') + '</div>';
                }
                return '<div class="info-item ' + (isFullWidth ? 'full-width' : '') + '">' +
                    '<div class="info-label">' + c + '</div>' + valueHtml +
                '</div>';
            }).join('');
        }

        // ===== 安全鉴定/安全评估：多条记录（增删改查，2026-10-17 去锁定） =====
        // 数据结构：s.assessmentRecords / s.evaluationRecords = [{ id, rows:[10列], reporter, reportTime, createdAt }, ...]
        // 每条记录可编辑/删除；新增通过「新增填报」追加
        function __renderAppraisalRecordCards(kind, s) {
            const isAssess = (kind === 'assessment');
            const title = isAssess ? '安全鉴定' : '安全评估';
