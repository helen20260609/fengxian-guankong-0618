            const records = isAssess
                ? (Array.isArray(s.assessmentRecords) ? s.assessmentRecords : [])
                : (Array.isArray(s.evaluationRecords) ? s.evaluationRecords : []);
            const libData = getTableData()[kind];
            const libColumns = (libData && libData.columns) || [];
            // 查看时隐藏「隐患动态整治状态」列（仅 assessment 历史遗留）
            let columns = libColumns;
            let keepIdx = columns.map((_, i) => i);
            if (isAssess) {
                keepIdx = columns.map((c, i) => c === '隐患动态整治状态' ? -1 : i).filter(i => i >= 0);
                columns = keepIdx.map(i => columns[i]);
            }
            const fwFields = isAssess ? ['鉴定报告', '备注'] : ['评估报告', '备注'];
            // 2026-10-17：去除鉴定/评估互斥提示，用户按实际情况自由填报
            // 顶部：标题 + 新增填报按钮
            const headerHtml = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:10px 14px;background:#f5f7fa;border:1px solid var(--border);border-radius:4px;">' +
                '<span style="font-size:13px;color:#606266;"><i class="fas fa-list-ol" style="color:var(--primary);margin-right:6px;"></i>' + title + '记录</span>' +
                '<button class="bottom-btn primary" style="padding:6px 14px;font-size:13px;" onclick="openAppraisalEditModal(\'' + kind + '\')"><i class="fas fa-plus"></i> 新增填报</button>' +
            '</div>';
            if (!records.length) {
                return headerHtml +
                    '<div class="record-empty" style="padding:40px 20px;text-align:center;border:1px dashed var(--border);border-radius:6px;background:#fafbfc;">' +
                        '<i class="fas fa-clipboard-check" style="font-size:28px;color:#c0c4cc;display:block;margin-bottom:14px;"></i>' +
                        '暂无' + title + '记录<br><span style="font-size:12px;color:#909399;">点击右上角「新增填报」填写' + title + '</span>' +
                    '</div>';
            }
            // 卡片列表（新记录在前，按 reportTime 倒序）；每条可编辑/删除（2026-10-17 去锁定）
            const sorted = records.slice().sort(function(a, b){
                return String(b.reportTime || '').localeCompare(String(a.reportTime || ''));
            });
            const cardsHtml = sorted.map(function(rec){
                const idx = records.indexOf(rec);
                const row = rec.rows || [];
                // 查看时同样按 keepIdx 过滤（兼容 assessment 的隐藏列）
                const viewRow = isAssess ? keepIdx.map(i => row[i]) : row;
                const org = row[0] || '—';
                const time = row[2] || '—';
                const conclusion = row[4] || '—';
                const reporter = rec.reporter || row[8] || '—';
                const reportTime = rec.reportTime || row[9] || '—';
                const timeLabel = isAssess ? '鉴定时间' : '评估时间';
                const body = '<div class="info-grid info-grid-2col">' + renderKeyValueGrid(columns, viewRow, fwFields) + '</div>';
                return '<div class="measure-history-card" id="appraisalCard-' + kind + '-' + idx + '" style="margin-bottom:12px;border:1px solid var(--border);border-radius:6px;background:#fff;">' +
                    '<div class="measure-history-head" onclick="toggleAppraisalCard(\'' + kind + '\',' + idx + ')" style="display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;background:#fafbfc;border-bottom:1px solid var(--border);">' +
                        '<i class="fas fa-circle" style="font-size:8px;color:var(--safe);"></i>' +
                        '<span style="font-size:13px;color:var(--safe);font-weight:500;">已完成</span>' +
                        '<span style="font-size:13px;color:#303133;flex:1;">' + org + ' · ' + conclusion + '</span>' +
                        '<span style="font-size:12px;color:#909399;">' + timeLabel + ' ' + time + '</span>' +
                        '<span style="font-size:12px;color:#909399;">填报 ' + reporter + ' · ' + reportTime + '</span>' +
                        '<button class="mh-toggle" onclick="event.stopPropagation();openAppraisalEditModal(\'' + kind + '\',' + idx + ')" style="padding:2px 10px;font-size:12px;border:1px solid var(--primary);color:var(--primary);background:#fff;border-radius:3px;cursor:pointer;">编辑</button>' +
                        '<button class="mh-toggle" onclick="event.stopPropagation();deleteAppraisalRecord(\'' + kind + '\',' + idx + ')" style="padding:2px 10px;font-size:12px;border:1px solid #f56c6c;color:#f56c6c;background:#fff;border-radius:3px;cursor:pointer;">删除</button>' +
                        '<button class="mh-toggle" onclick="event.stopPropagation();toggleAppraisalCard(\'' + kind + '\',' + idx + ')" style="padding:2px 10px;font-size:12px;border:1px solid var(--border);background:#fff;border-radius:3px;cursor:pointer;">详情</button>' +
                        '<i class="fas fa-chevron-right mh-caret" style="color:#909399;font-size:12px;"></i>' +
                    '</div>' +
                    '<div class="measure-history-body" id="appraisalCardBody-' + kind + '-' + idx + '" style="display:none;padding:14px 16px;">' +
                        body +
                    '</div>' +
                '</div>';
            }).join('');
            return headerHtml + cardsHtml;
        }

        // 删除鉴定/评估记录（2026-10-17 增删改查放开）
        function deleteAppraisalRecord(kind, idx) {
            const isAssess = (kind === 'assessment');
            const title = isAssess ? '安全鉴定' : '安全评估';
            const s = currentHouseArch;
            const arrKey = isAssess ? 'assessmentRecords' : 'evaluationRecords';
            const records = s[arrKey] || [];
            if (idx < 0 || idx >= records.length) return;
            if (!confirm('确认删除该' + title + '记录？删除后不可恢复。')) return;
            records.splice(idx, 1);
            // 同步最新一条到字段库 rows[0]（兼容旧读口）
            const libData = getTableData()[kind];
            const sorted = records.slice().sort(function(a, b){
                return String(b.reportTime || '').localeCompare(String(a.reportTime || ''));
            });
            if (!libData.rows) libData.rows = [];
            libData.rows = sorted.length ? [__deepClone(sorted[0].rows || [])] : [[]];
            s._fieldsLibrary = dumpFieldsLibrary();
            delete s._syncedAt;
            saveCurrentHouseArch(s);
            renderSidebar();
            renderContent();
        }

        function renderAssessmentContent(s) { return __renderAppraisalRecordCards('assessment', s); }
        function renderEvaluationContent(s) { return __renderAppraisalRecordCards('evaluation', s); }

        // 折叠/展开鉴定/评估卡片
        function toggleAppraisalCard(kind, idx) {
            const body = document.getElementById('appraisalCardBody-' + kind + '-' + idx);
            const card = document.getElementById('appraisalCard-' + kind + '-' + idx);
            if (!body) return;
            const open = body.style.display !== 'none';
            body.style.display = open ? 'none' : 'block';
            if (card) card.classList.toggle('open', !open);
        }

        // 整治计划：完全匹配截图布局（2列 + 3组照片）
        function renderPlanContent(s) {
            // 【阶段性整治计划】多条记录结构（2026-10-15 重构）：
            //   s.planRecords = [{ id, rows:[13字段], reporter, reportTime, status, remark }, ...]
            //   每次填报是一条独立记录；完成后可新增下一条；历史记录折叠卡片渲染
            const records = Array.isArray(s.planRecords) ? s.planRecords : [];
            // 旧结构兜底：无 planRecords 但有 housePlanRow 时（migratePlanToRecords 未跑），临时按单条渲染
            const fallbackRow = (!records.length && Array.isArray(s.housePlanRow)) ? [ { id:'LEGACY', rows: s.housePlanRow, reporter: s.housePlanRow[11]||'', reportTime: s.housePlanRow[12]||'', status:'进行中', remark: s.housePlanRow[10]||'' } ] : [];
            const list = records.length ? records : fallbackRow;
            // 渲染单条记录的详情体（原单条渲染逻辑封装）
            function renderPlanDetailHtml(row) {
                const getV = (i) => row[i] || '';
                // 本地键值渲染（绿色新增字段）
                function kvP(label, value, green) {
                    const v = (value === undefined || value === null) ? '' : String(value);
                    const isEmpty = v === '' || v === '—' || v === '-';
                    const cls = isEmpty ? 'empty' : (green ? 'rural-only' : '');
                    return '<div class="info-item"><div class="info-label">' + label + '</div><div class="info-value ' + cls + '">' + (isEmpty ? '—' : v) + '</div></div>';
                }
                // 整行单字段（label 140px + value 自适应）
                function kvFull(label, value, green, required) {
                    const v = (value === undefined || value === null) ? '' : String(value);
                    const isEmpty = v === '' || v === '—' || v === '-';
                    const cls = isEmpty ? 'empty' : (green ? 'rural-only' : '');
                    const starHtml = required ? '<span style="color:#dc3545;">*</span>' : '';
                    return '<div class="info-item full-width" style="display:flex;flex-direction:row;align-items:center;gap:12px;">' +
                        '<div class="info-label" style="width:140px;flex-shrink:0;text-align:left;">' + starHtml + label + '</div>' +
                        '<div class="info-value ' + cls + '" style="flex:1;">' + (isEmpty ? '—' : v) + '</div>' +
                    '</div>';
                }
                // 附件整行渲染（带绿色对勾 + 黄色提示文字 + 必填星号）
                function attachmentFullRow(label, value, hint, required) {
                    const v = (value === undefined || value === null) ? '' : String(value);
                    const isEmpty = v === '' || v === '—' || v === '-';
                    const starHtml = required ? '<span style="color:#dc3545;">*</span>' : '';
                    let content = '';
                    if (isEmpty) {
                        content = '<div class="info-value empty" style="flex:1;">—</div>';
                    } else {
                        const fileName = v.split('/').pop().split('\\').pop() || v;
                        const displayName = fileName.includes('.') ? fileName : fileName + '.pdf';
                        content = '<div class="info-value" style="flex:1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
                            '<a href="' + v + '" target="_blank" style="color:#5b7fa6;text-decoration:none;display:inline-flex;align-items:center;gap:6px;">' +
                                '<i class="fas fa-file-pdf" style="color:#e6a23c;"></i>' + displayName +
                            '</a>' +
                            '<i class="fas fa-check-circle" style="color:#52c41a;"></i>' +
                            (hint ? '<span style="color:#e6a23c;font-size:13px;line-height:1.5;"><i class="fas fa-exclamation-circle"></i> ' + hint + '</span>' : '') +
                        '</div>';
                    }
                    return '<div class="info-item full-width" style="margin-top:12px;display:flex;flex-direction:row;align-items:center;gap:12px;">' +
                        '<div class="info-label" style="width:140px;flex-shrink:0;text-align:left;display:flex;align-items:center;justify-content:flex-start;height:100%;min-height:32px;">' + starHtml + label + '</div>' +
                        content +
                    '</div>';
                }
                // 渲染照片网格（full-width）- 标签上下居中显示 + 必填星号
                function photoRow(label, value, fallback, required) {
                    const starHtml = required ? '<span style="color:#dc3545;">*</span>' : '';
                    let urls = [];
                    if (value && value !== '—' && value !== '-') {
                        urls = value.split(',').map(s => s.trim()).filter(u => u.startsWith('data:image') || u.startsWith('http'));
                    }
                    if (!urls.length && fallback && fallback.length) urls = fallback;
                    const inner = urls.length
                        ? '<div class="info-value photo-value photo-grid" style="display:flex;align-items:center;gap:12px;flex:1;">' + urls.map(u => '<img src="' + escapeHtml(u) + '" alt="' + escapeHtml(label) + '" onclick="viewPhotoOnline(\'' + escapeJsStr(u) + '\')" style="width:200px;height:150px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:pointer;">').join('') + '</div>'
                        : '<div class="info-value empty" style="flex:1;">—</div>';
                    return '<div class="info-item full-width" style="margin-top:12px;display:flex;flex-direction:row;align-items:center;gap:12px;"><div class="info-label" style="width:140px;flex-shrink:0;text-align:left;display:flex;align-items:center;justify-content:flex-start;height:150px;">' + starHtml + label + '</div>' + inner + '</div>';
                }

                const hintPromise = '产权人或使用权人（无主的，村委会代理）承诺同意硬围挡房屋不再进入使用，启用前需先解危。';
                const hintPlan = '包括无法整治原因、动态监测安排（主体、频次等）以及后续处置计划（是否已断水断电断气、后续有无工程整治计划等），并盖区、街镇印章。';

                // 第 1-2 行：双列
                const grid2col =
                    kvP('计划开始时间', getV(0)) + kvP('计划完成时间', getV(1)) +
                    kvP('负责人信息', getV(2)) + kvP('联系电话', getV(3));
                // 整治方案（整行附件）
                const planAttachment = attachmentFullRow('整治方案', getV(4));
                // 备注（整行）
                const remarkRow = kvFull('备注', getV(10));
                // 最后一行：填报人 + 填报时间 双列
                const grid2colLast =
                    kvP('填报人', getV(11)) + kvP('填报时间', getV(12));

                return '<div class="info-grid info-grid-2col">' + grid2col + '</div>' +
                    '<div class="info-grid info-grid-2col" style="grid-template-columns:1fr;margin-top:0;">' +
                        planAttachment +
                        kvFull('是否采取硬隔离', getV(5), false, true) +
                        photoRow('长期管控照片', getV(7), [mockPlanPhotoSvg('长期管控照片 1 · 管控区域', '#5b7fa6'), mockPlanPhotoSvg('长期管控照片 2 · 警示标识', '#8a6d4b')], true) +
                        attachmentFullRow('告知承诺书', getV(8), hintPromise, true) +
                        attachmentFullRow('书面计划', getV(9), hintPlan, true) +
                        remarkRow +
                    '</div>' +
                    '<div class="info-grid info-grid-2col" style="margin-top:12px;">' + grid2colLast + '</div>';
            }

            // ===== 多条记录渲染 =====
            // 顶部：标题 + 新增填报按钮
            const headerHtml = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:10px 14px;background:#f5f7fa;border:1px solid var(--border);border-radius:4px;">' +
                '<span style="font-size:13px;color:#606266;"><i class="fas fa-list-ol" style="color:var(--primary);margin-right:6px;"></i>整治计划记录</span>' +
                '<button class="bottom-btn primary" style="padding:6px 14px;font-size:13px;" onclick="openPlanEditModal(-1)"><i class="fas fa-plus"></i> 新增填报</button>' +
            '</div>';
            if (!list.length) {
                return headerHtml +
                    '<div class="record-empty" style="padding:40px 20px;text-align:center;border:1px dashed var(--border);border-radius:6px;background:#fafbfc;">' +
                        '<i class="fas fa-calendar-alt" style="font-size:28px;color:#c0c4cc;display:block;margin-bottom:14px;"></i>' +
                        '暂无整治计划记录<br><span style="font-size:12px;color:#909399;">点击右上角「新增填报」填写第一阶段整治计划</span>' +
                    '</div>';
            }
            // 卡片列表（新记录在前，按 reportTime 倒序）
            const sorted = list.slice().sort(function(a, b){
                return String(b.reportTime || '').localeCompare(String(a.reportTime || ''));
            });
            const cardsHtml = sorted.map(function(rec){
                const idx = list.indexOf(rec); // 原数组索引（编辑/删除用）
                const row = rec.rows || [];
                const statusText = (rec.status === '已完成') ? '已完成' : '进行中';
                const statusColor = (rec.status === '已完成') ? 'var(--safe)' : '#fa8c16';
                const range = (row[0] || '—') + ' ~ ' + (row[1] || '—');
                const person = row[2] || '—';
                const reporter = rec.reporter || row[11] || '—';
                const reportTime = rec.reportTime || row[12] || '—';
                return '<div class="measure-history-card" id="planCard-' + idx + '" style="margin-bottom:12px;border:1px solid var(--border);border-radius:6px;background:#fff;">' +
                    '<div class="measure-history-head" onclick="togglePlanCard(' + idx + ')" style="display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;background:#fafbfc;border-bottom:1px solid var(--border);">' +
                        '<i class="fas fa-circle" style="font-size:8px;color:' + statusColor + ';"></i>' +
                        '<span style="font-size:13px;color:' + statusColor + ';font-weight:500;">' + statusText + '</span>' +
                        '<span style="font-size:13px;color:#303133;flex:1;">计划周期 ' + range + '</span>' +
                        '<span style="font-size:12px;color:#909399;">负责人 ' + person + '</span>' +
                        '<span style="font-size:12px;color:#909399;">填报 ' + reporter + ' · ' + reportTime + '</span>' +
                        '<button class="mh-toggle" onclick="event.stopPropagation();togglePlanCard(' + idx + ')" style="padding:2px 10px;font-size:12px;border:1px solid var(--border);background:#fff;border-radius:3px;cursor:pointer;">详情</button>' +
                        '<i class="fas fa-chevron-right mh-caret" style="color:#909399;font-size:12px;"></i>' +
                    '</div>' +
                    '<div class="measure-history-body" id="planCardBody-' + idx + '" style="display:none;padding:14px 16px;">' +
                        renderPlanDetailHtml(row) +
                        '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">' +
                            '<button class="bottom-btn" style="padding:4px 12px;font-size:12px;" onclick="event.stopPropagation();openPlanEditModal(' + idx + ')"><i class="fas fa-edit"></i> 编辑</button>' +
                            '<button class="bottom-btn" style="padding:4px 12px;font-size:12px;border-color:var(--danger);color:var(--danger);" onclick="event.stopPropagation();deletePlanRecord(' + idx + ')"><i class="fas fa-trash-alt"></i> 删除</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
            return headerHtml + cardsHtml;
        }

        // 折叠/展开整治计划卡片
        function togglePlanCard(idx) {
            const body = document.getElementById('planCardBody-' + idx);
            const card = document.getElementById('planCard-' + idx);
            if (!body) return;
            const open = body.style.display !== 'none';
            body.style.display = open ? 'none' : 'block';
            if (card) card.classList.toggle('open', !open);
        }

        // 删除某条整治计划记录
        function deletePlanRecord(idx) {
            const s = currentHouseArch;
            if (!Array.isArray(s.planRecords) || idx < 0 || idx >= s.planRecords.length) return;
            if (!confirm('确认删除本条整治计划记录？删除后不可恢复。')) return;
            s.planRecords.splice(idx, 1);
            // 同步最新一条到 housePlanRow（兼容旧读口）
            const sortedRecs = s.planRecords.slice().sort(function(a, b){
                return String(b.reportTime || '').localeCompare(String(a.reportTime || ''));
            });
            if (sortedRecs.length) {
                s.housePlanRow = __deepClone(sortedRecs[0].rows || []);
            } else {
                delete s.housePlanRow;
            }
            // 同步字段库
            try {
                const lib = getTableData();
                if (lib.plan) lib.plan.rows = sortedRecs.length ? [__deepClone(sortedRecs[0].rows || [])] : [[]];
            } catch (e) {}
            s._fieldsLibrary = dumpFieldsLibrary();
            delete s._syncedAt;
            saveCurrentHouseArch(s);
            renderSidebar();
            renderContent();
        }

        // 风险记录状态推导（P4 新语义，按隐患闭环推导）：
        //   无隐患 = 本次排查/巡查未登记任何隐患（第一类）
        //   未闭环 = 关联隐患中存在未销号的
        //   已闭环 = 关联隐患全部已销号
        // 旧口径（治理事件措施完成度）废弃，但旧数据字段一律保留不删。
        function __riskRecordStatus(s, rr) {
            if (!s || !rr) return { text: '—', cls: 'info' };
            let hzIds = Array.isArray(rr.linkedHazardIds) ? rr.linkedHazardIds.slice() : [];
            // 兜底：按来源字段匹配（迁移前数据/关联缺失时不误判）
            (s.hazardRecords || []).forEach(function(h){
                if (h.sourceType === rr.sourceType && h.sourceId === rr.sourceId && hzIds.indexOf(h.id) === -1) hzIds.push(h.id);
            });
            if (!hzIds.length) return { text: '无隐患', cls: 'info' };
            const hasOpen = hzIds.some(function(id){
                const hz = (s.hazardRecords || []).find(function(h){ return h.id === id; });
                return hz && hz.currentStatus !== HAZARD_STATUS.CLOSED;
            });
            return hasOpen ? { text: '未闭环', cls: 'warning' } : { text: '已闭环', cls: 'safe' };
        }

        function renderRiskContent(s) {
            // v2：风险信息记录由"风险发现"自动派生（riskRecords），风险等级=当次结论，只读
            const records = (s.riskRecords || []).slice().sort(function(a, b){ return String(b.date || '').localeCompare(String(a.date || '')); });

            function kvR(label, value) {
                const v = (value === undefined || value === null) ? '' : String(value);
                const isEmpty = v === '' || v === '—';
                const cls = isEmpty ? 'empty' : 'rural-only';
                return '<div class="info-item"><div class="info-label">' + label + '</div><div class="info-value ' + cls + '">' + (isEmpty ? '—' : v) + '</div></div>';
            }

            // ===== 列表态 =====
            if (!currentRiskRecordKey) {
                if (!records.length) {
                    return '<div style="padding:60px 20px;text-align:center;color:#909399;">' +
                        '<i class="fas fa-clipboard-list" style="font-size:36px;color:#c0c4cc;margin-bottom:12px;display:block;"></i>' +
                        '暂无风险信息记录<br><span style="font-size:12px;">风险信息记录由「风险发现」自动派生</span></div>';
                }
                // 状态筛选chip
                const filter = window.riskStatusFilter || 'all';
                const cntAll = records.length;
                const cntOpen = records.filter(function(it){ return __riskRecordStatus(s, it).text === '未闭环'; }).length;
                const cntClosed = records.filter(function(it){ return __riskRecordStatus(s, it).text === '已闭环'; }).length;
                const cntNone = records.filter(function(it){ return __riskRecordStatus(s, it).text === '无隐患'; }).length;
                const filtered = records.filter(function(it){
                    const st = __riskRecordStatus(s, it).text;
                    if (filter === 'open') return st === '未闭环';
                    if (filter === 'closed') return st === '已闭环';
                    if (filter === 'none') return st === '无隐患';
                    return true;
                });
                const paged = paginateSlice('riskList', filtered);
                const chips = [
                    { key: 'all', label: '全部', count: cntAll },
                    { key: 'open', label: '未闭环', count: cntOpen },
                    { key: 'closed', label: '已闭环', count: cntClosed },
                    { key: 'none', label: '无隐患', count: cntNone }
                ];
                const chipsHtml = chips.map(function(c){
                    return '<span class="hazard-filter-chip' + (filter === c.key ? ' active' : '') + '" data-risk-filter="' + c.key + '">' + c.label + '(' + c.count + ')</span>';
                }).join('');
                const rows = paged.map(function(it){
                    const st = __riskRecordStatus(s, it);
                    return '<tr class="record-row risk-record-row" data-risk-key="' + riskRecordKeyOf(it) + '" style="cursor:pointer;">' +
                        '<td>' + (it.sourceType === '巡查' ? '动态巡查' : '排查登记') + '</td>' +
                        '<td>' + (String(it.date || '').slice(0, 10) || '—') + '</td>' +
                        '<td>' + (it.person || '—') + '</td>' +
                        '<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + (it.conclusion || '') + '">' + (it.conclusion || '—') + '</td>' +
                        '<td><span class="tag ' + (it.riskLevel === '第三类' ? 'danger' : (it.riskLevel === '第二类' ? 'warning' : 'info')) + '">' + (it.riskLevel || '—') + '</span></td>' +
                        '<td><span class="tag ' + st.cls + '">' + st.text + '</span></td>' +
                        '<td class="actions"><a class="view-link" href="javascript:void(0)">查看</a></td>' +
                    '</tr>';
                }).join('');
                return '<div class="info-section-title"><i class="fas fa-clipboard-list"></i> 风险信息记录（由风险发现自动派生）</div>' +
                    '<div style="margin-bottom:12px;">' + chipsHtml + '</div>' +
                    '<table class="data-table record-table"><thead><tr>' +
                        '<th style="width:80px;">来源</th><th style="width:90px;">发现日期</th><th style="width:70px;">发现人</th>' +
                        '<th>结论</th><th style="width:70px;">风险等级</th><th style="width:70px;">状态</th><th style="width:50px;">操作</th>' +
                    '</tr></thead><tbody>' + rows + '</tbody></table>' +
                    renderPagerBar('riskList', filtered.length);
            }

            // ===== 详情态 =====
            const r = records.find(function(it){ return riskRecordKeyOf(it) === currentRiskRecordKey; });
            if (!r) { currentRiskRecordKey = null; return renderRiskContent(s); }
            const srcLabel = r.sourceType === '巡查' ? '动态巡查' : '排查登记';
            const srcTab = r.sourceType === '巡查' ? 'patrol' : 'survey';
            const st = __riskRecordStatus(s, r);
            const photoUrls = (r.photos || '').split(',').map(function(u){ return u.trim(); }).filter(function(u){
                return u && (u.startsWith('data:image') || u.startsWith('http') || u.endsWith('.jpg') || u.endsWith('.jpeg') || u.endsWith('.png') || u.endsWith('.gif'));
            });
            const photoHtml = photoUrls.length
                ? '<div class="info-value photo-value photo-grid">' + photoUrls.map(function(u) {
                    return '<img src="' + escapeHtml(u) + '" alt="现场照片" onclick="viewPhotoOnline(\'' + escapeJsStr(u) + '\')" style="width:72px;height:72px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:pointer;">';
                  }).join('') + '</div>'
                : '<div class="info-value empty">—</div>';
            const activeIndex = records.findIndex(function(it){ return riskRecordKeyOf(it) === currentRiskRecordKey; });
            return '<div class="record-detail-header">' +
                    '<div class="title">' +
                        '<a href="javascript:void(0)" class="risk-back-link" style="color:var(--primary);margin-right:10px;" title="返回列表"><i class="fas fa-arrow-left"></i></a>' +
                        '风险信息详情（' + (activeIndex + 1) + ' / ' + records.length + '）' +
                        ' <span class="tag ' + st.cls + '" style="margin-left:8px;">' + st.text + '</span>' +
                    '</div>' +
                    '<div class="meta">' +
                        '<a class="view-link" href="javascript:void(0)" onclick="jumpToDiscoverySource(\'' + escapeJsStr(srcTab) + '\',\'' + escapeJsStr(r.sourceId || '') + '\')"><i class="fas fa-external-link-alt"></i> 查看来源（' + srcLabel + '）</a>' +
                    '</div>' +
                '</div>' +
                '<div class="info-grid info-grid-2col">' +
                    kvR('来源', srcLabel) + kvR('发现日期', r.date) +
                    kvR('发现人', r.person) + kvR('排查/巡查单位', r.org) +
                    kvR('结论', r.conclusion) + kvR('风险等级', r.riskLevel) +
                    kvR('隐患描述', r.hazardDesc) +
                    '<div class="info-item full-width" style="grid-column:1 / -1;"><div class="info-label">现场照片</div>' + photoHtml + '</div>' +
                '</div>' +
                renderRiskLinkedHazards(s, r);
        }

        // 风险信息详情底部：本次排查关联的隐患清单（替代原内嵌治理链——治理链已迁至隐患台账）
        function renderRiskLinkedHazards(s, r) {
            if (!r) return '';
            const hzIds = (r.linkedHazardIds || []);
            // 第一类=无隐患，过滤存量数据（2026-10-17）
            const hazards = (s.hazardRecords || []).filter(function(h){ return hzIds.indexOf(h.id) !== -1 && h.initialJudge !== '第一类'; });
            if (!hazards.length) {
                // 第一类/第二类无隐患
                return '<div style="margin-top:18px;border-top:1px solid var(--border);padding-top:16px;">' +
                    '<div class="info-section-title"><i class="fas fa-list-ul"></i> 关联隐患</div>' +
                    '<div style="padding:16px;text-align:center;color:#909399;font-size:13px;">本次' + (r.sourceType || '排查') + '未登记隐患</div>' +
                '</div>';
            }
            const rows = hazards.map(function(h){
                const photos = (Array.isArray(h.photos) ? h.photos : (h.photos ? String(h.photos).split(/[\n,]/).map(function(t){ return t.trim(); }).filter(Boolean) : [])).filter(function(u){
                    return /^data:image\//.test(u) || /^https?:\/\//.test(u) || /\.(jpe?g|png|gif|bmp|webp|svg)(\?|$)/i.test(u);
                });
                const thumbs = photos.length
                    ? '<div style="display:flex;gap:6px;flex-wrap:wrap;">' + photos.map(function(u){
                        return '<img src="' + escapeHtml(u) + '" alt="隐患照片" onclick="event.stopPropagation();viewPhotoOnline(\'' + escapeJsStr(u) + '\')" style="width:64px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:zoom-in;">';
                    }).join('') + '</div>'
                    : '<span style="color:#c0c4cc;">—</span>';
                return '<tr>' +
                    '<td>' + (h.hazardType || '—') + (h.hazardTypeOther ? '<span style="color:#909399;font-size:11px;">（' + h.hazardTypeOther + '）</span>' : '') + '</td>' +
                    '<td>' + thumbs + '</td>' +
                    '<td><span class="tag ' + (h.initialJudge === '第三类' ? 'danger' : (h.initialJudge === '第二类' ? 'warning' : 'info')) + '">' + (h.initialJudge || '—') + '</span></td>' +
                '</tr>';
            }).join('');
            return '<div style="margin-top:18px;border-top:1px solid var(--border);padding-top:16px;">' +
                '<div class="info-section-title"><i class="fas fa-list-ul"></i> 关联隐患（' + hazards.length + '）<span style="font-size:12px;font-weight:normal;color:#909399;margin-left:8px;">治理链路已移至「隐患台账」</span></div>' +
                '<table class="data-table"><thead><tr>' +
                    '<th>隐患类型</th><th>现场照片</th><th style="width:80px;">排查判断</th>' +
                '</tr></thead><tbody>' + rows + '</tbody></table>' +
            '</div>';
        }

        // 原型：风险信息详情内嵌治理链路子tab（仅第三类记录显示）——已迁至隐患台账，保留函数防外部引用
        // 选中子tab即选中对应治理事件 → currentGovEventId 由该风险记录推导，复用 renderTableContent 的 B1 隔离数据
        // 治理底栏编辑按钮（按模块/状态输出），供 renderTableContent 与风险详情内嵌复用
        function governanceBottomActions(key, item) {
            const s = currentHouseArch;
            if (key === 'close') {
                let btns = '';
                if (s.closeStatus === '未申请' || s.closeStatus === '已驳回') {
                    btns += '<button class="bottom-btn primary" onclick="openCloseApplyModal()"><i class="fas fa-paper-plane"></i> 提交销号申请</button>';
                }
                if (s.closeStatus === '待审核' || s.closeStatus === '审核中') {
                    btns += '<button class="bottom-btn" style="border-color:var(--safe);color:var(--safe);" onclick="openCloseAuditModal(true)"><i class="fas fa-check"></i> 通过</button>' +
                        '<button class="bottom-btn" style="border-color:var(--danger);color:var(--danger);" onclick="openCloseAuditModal(false)"><i class="fas fa-times"></i> 驳回</button>';
                }
                btns += '<button class="bottom-btn" onclick="openCommonEditModal(\'close\')"><i class="fas fa-edit"></i> 编辑验收销项</button>';
                return btns;
            }
            if (key === 'plan') {
                return '<button class="bottom-btn primary" onclick="openPlanEditModal(-1)"><i class="fas fa-plus"></i> 新增填报</button>';
            }
            if (key === 'measure') {
                // 阶段化：编辑/新增/删除动作均在阶段卡片内
                return '';
            }
            if (key === 'accept') {
                return ''; // 卡片内已有编辑/新增/批量审核
            }
            if (key === 'control') {
                // addDanger 已搬到排查/巡查记录级编辑，dynamic 由来源记录派生，无可编辑按钮
                return '';
            }
            // assessment 等通用
            return '<button class="bottom-btn primary" onclick="openCommonEditModal(\'' + key + '\')"><i class="fas fa-edit"></i> 编辑' + item.title + '</button>';
        }

        // 【已废弃 P5】治理链已迁至「隐患台账」详情第4TAB（renderHazardLedgerContent → governance 分支）。
        // 本函数不再被引用，保留仅为兼容历史外链；内部读取的治理事件字段（ev.data.*）全部保留不删。
        function renderRiskGovernanceTabs(s, r) {
            if (!r || r.riskLevel !== '第三类') return '';
            // 该风险记录对应的治理事件
            const ev = (s.governanceEvents || []).find(function(e){ return e.riskRecordId === r.id; });
            // 让治理TAB渲染时锁定到本事件（不走下拉切换器）
            if (ev && window.currentGovEventId !== ev.eventId) {
                try { switchGovernanceEvent(ev.eventId); } catch (e) { window.currentGovEventId = ev.eventId; }
            }
            const tabsHtml = RISK_GOV_TABS.map(function(t){
                const active = currentRiskSubTab === t.key ? 'active' : '';
                return '<div class="content-tab ' + active + '" data-scope="risk" data-key="' + t.key + '"><i class="fas ' + t.icon + '"></i> ' + t.title + '</div>';
            }).join('');
            const statusTag = ev ? ('<span class="tag ' + (ev.status === '已治理' ? 'safe' : 'warning') + '" style="margin-left:10px;">' + (ev.status || '待治理') + '</span>') : '';
            let govBody = '';
            try {
                govBody = renderGovernanceBody(currentRiskSubTab, s);
            } catch (e) {
                govBody = '<div class="record-empty" style="padding:30px;">治理内容渲染失败：' + (e && e.message) + '</div>';
            }
            const curTab = RISK_GOV_TABS.find(function(t){ return t.key === currentRiskSubTab; }) || RISK_GOV_TABS[0];
            const govActions = governanceBottomActions(currentRiskSubTab, curTab);
            const govBar = '<div class="bottom-bar" style="margin-top:14px;">' +
                '<div class="bottom-info">' +
                    '<i class="fas fa-info-circle" style="color:var(--primary);"></i>' +
                    '治理节点：<span class="bottom-node">' + curTab.title + '</span> | <i class="far fa-eye"></i> <span class="mode-label">查看/编辑</span>' +
                '</div>' +
                '<div class="bottom-actions">' + govActions + '</div>' +
            '</div>';
            return '<div style="margin-top:18px;">' +
                '<div class="info-section-title" style="border-top:1px solid var(--border);padding-top:16px;"><i class="fas fa-stream"></i> 治理链路' + statusTag + '</div>' +
                '<div class="content-tabs">' + tabsHtml + '</div>' +
                '<div class="risk-gov-body" style="padding-top:14px;">' + govBody + '</div>' +
                govBar +
            '</div>';
        }

        // 跳转到风险发现来源记录
        function jumpToDiscoverySource(tab, sourceId) {
            currentSidebar = 'discovery';
            currentDiscoveryTab = (tab === 'patrol') ? 'patrol' : 'survey';
            // 定位到对应记录
            try {
                const s = currentHouseArch;
                if (tab === 'patrol') {
                    const list = (s.patrolRecords || []).slice().sort(function(a,b){ return String(b.patrolDate || '').localeCompare(String(a.patrolDate || '')); });
                    const idx = list.findIndex(function(x){ return x.id === sourceId; });
                    if (idx >= 0) recordViewState.patrol = idx;
                } else {
                    const list = (s.inspectionRecords || []).slice().sort(function(a,b){ return String(b.checkDate || b.reportTime || '').localeCompare(String(a.checkDate || a.reportTime || '')); });
                    const idx = list.findIndex(function(x){ return x.id === sourceId; });
                    if (idx >= 0) recordViewState.inspection = idx;
                    currentSurveySubTab = 'survey1';
                }
                // 兜底：旧草稿/入口若把 currentSurveySubTab 指向已移除的 survey2，归位到排查情况
                if (getSurveySubTabs().every(function(t){ return t.key !== currentSurveySubTab; })) currentSurveySubTab = 'survey1';
            } catch (e) {}
            renderSidebar();
            renderContent();
        }

        // 风险发现详情底部：本次排查/巡查 登记/复查 的隐患清单（详情页已移除，行不跳转；照片缩略图可直接放大）
        function renderDiscoveryLinkedHazards(s, sourceType, sourceId) {
            if (!s || !sourceId) return '';
            const rr = (s.riskRecords || []).find(function(r){ return r.sourceType === sourceType && r.sourceId === sourceId; });
            let hzIds = (rr && Array.isArray(rr.linkedHazardIds)) ? rr.linkedHazardIds.slice() : [];
            // 兜底：按来源字段直接匹配（rr 尚未生成/关联缺失时不漏显）
            (s.hazardRecords || []).forEach(function(h){
                if (h.sourceType === sourceType && h.sourceId === sourceId && hzIds.indexOf(h.id) === -1) hzIds.push(h.id);
            });
            // 第一类=无隐患，过滤存量数据（2026-10-17）
            const hazards = (s.hazardRecords || []).filter(function(h){ return hzIds.indexOf(h.id) !== -1 && h.initialJudge !== '第一类'; });
            if (!hazards.length) return '';
            const rows = hazards.map(function(h){
                const photos = (Array.isArray(h.photos) ? h.photos : (h.photos ? String(h.photos).split(/[\n,]/).map(function(t){ return t.trim(); }).filter(Boolean) : [])).filter(function(u){
                    return /^data:image\//.test(u) || /^https?:\/\//.test(u) || /\.(jpe?g|png|gif|bmp|webp|svg)(\?|$)/i.test(u);
                });
                const thumbs = photos.length
                    ? '<div style="display:flex;gap:6px;flex-wrap:wrap;">' + photos.map(function(u){
                        return '<img src="' + escapeHtml(u) + '" alt="隐患照片" onclick="event.stopPropagation();viewPhotoOnline(\'' + escapeJsStr(u) + '\')" style="width:64px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:zoom-in;">';
                    }).join('') + '</div>'
                    : '<span style="color:#c0c4cc;">—</span>';
                return '<tr>' +
                    '<td>' + (h.hazardType || '—') + (h.hazardTypeOther ? '<span style="color:#909399;font-size:11px;">（' + h.hazardTypeOther + '）</span>' : '') + '</td>' +
                    '<td>' + thumbs + '</td>' +
                    '<td><span class="tag ' + (h.initialJudge === '第三类' ? 'danger' : (h.initialJudge === '第二类' ? 'warning' : 'info')) + '">' + (h.initialJudge || '—') + '</span></td>' +
                '</tr>';
            }).join('');
            return '<div style="margin-top:18px;border-top:1px solid var(--border);padding-top:16px;">' +
                '<div class="info-section-title"><i class="fas fa-list-ul"></i> 本次' + (sourceType === '巡查' ? '巡查' : '排查') + '登记/复查的隐患（' + hazards.length + '）' +
                    '<span style="font-weight:normal;color:#909399;font-size:12px;margin-left:8px;">台账跟踪见「隐患台账」</span></div>' +
                '<table class="data-table record-table"><thead><tr>' +
                    '<th>隐患类型</th><th style="width:200px;">现场照片</th><th style="width:80px;">排查判断</th>' +
                '</tr></thead><tbody>' + rows + '</tbody></table>' +
            '</div>';
        }

        // 隐患动态：仅保留「隐患动态记录」（addDanger 已搬到排查/巡查记录级编辑，2026-10-15）
        // 「隐患控制情况」已提为侧栏一级TAB（controlSituation，与整治措施同级），治理链路内不再展示
        function renderControlTable(s) {
            // 残留状态归位（quality/history 已并入一级TAB「最新质检信息」；situation 已提为一级TAB；addDanger 已搬到排查/巡查）
            if (currentControlSubTab !== 'dynamic') currentControlSubTab = 'dynamic';
            return renderControlDynamic(s);
        }

        // tab0 新增隐患
        const ADD_DANGER_TYPES = ['场地周边安全风险', '房屋整体沉降倾斜', '房屋塌陷变形', '使用不当隐患', '墙体开裂变形', '楼面开裂变形', '梁柱开裂变形', '楼梯损伤变形', '阳台开裂变形', '其他安全问题'];
        // 2026-10-17：移除「第一类」——第一类即无隐患，不应作为隐患登记选项
        const ADD_DANGER_JUDGES = ['第三类', '第二类'];

        function getAddDanger() {
            const s = currentHouseArch || {};
            if (!s.addDanger || typeof s.addDanger !== 'object') {
                s.addDanger = { types: [], typesOther: '', photosByType: {}, judge: '' };
            }
            if (!Array.isArray(s.addDanger.types)) s.addDanger.types = [];
            if (!s.addDanger.photosByType || typeof s.addDanger.photosByType !== 'object') s.addDanger.photosByType = {};
            // 旧字段 photos 兼容：若存在字符串则迁移到第一个勾选类型
            if (typeof s.addDanger.photos === 'string' && s.addDanger.photos && s.addDanger.types.length) {
                const first = s.addDanger.types[0];
                if (!s.addDanger.photosByType[first]) s.addDanger.photosByType[first] = s.addDanger.photos;
                delete s.addDanger.photos;
            }
            return s.addDanger;
        }

        function getAddDangerPhotos(type) {
            const ad = getAddDanger();
            const v = ad.photosByType[type];
            if (!v) return [];
            if (Array.isArray(v)) return v.filter(Boolean);
            if (typeof v === 'string') return v.split('\n').filter(Boolean);
            return [];
        }

        function setAddDangerPhotos(type, arr) {
            const ad = getAddDanger();
            ad.photosByType[type] = (arr || []).filter(Boolean).join('\n');
        }

        function renderControlAddDanger(s) {
            const ad = getAddDanger();
            const types = ad.types || [];
            // 排查判断值带红色 * 前缀（与截图一致）
            const judgeHtml = '<div class="info-item" style="grid-column:1 / -1;">' +
                '<div class="info-label"><span style="color:#dc3545;">*</span>排查判断</div>' +
                '<div class="info-value">' + (ad.judge || '—') + '</div>' +
            '</div>';
            // 隐患类型：勾选项每行一组照片（按类型独立存取）；未勾选任何时仅显示一行提示
            let typesHtml = '';
            if (!types.length) {
                typesHtml = '<div class="info-item" style="grid-column:1 / -1;">' +
                    '<div class="info-label">隐患类型</div>' +
                    '<div class="info-value empty">暂未新增隐患</div>' +
                '</div>';
            } else {
                typesHtml = types.map(t => {
                    const label = (t === '其他安全问题' && ad.typesOther) ? (t + '（' + ad.typesOther + '）') : t;
                    const photos = getAddDangerPhotos(t);
                    const photoHtml = photos.length
                        ? '<div style="display:flex;flex-wrap:wrap;gap:10px;">' + photos.map(u =>
                            '<img src="' + escapeHtml(u) + '" onclick="viewPhotoOnline(\'' + escapeJsStr(u) + '\')" style="width:120px;height:90px;object-fit:cover;border-radius:4px;cursor:pointer;border:1px solid var(--border);">'
                          ).join('') + '</div>'
                        : '<div class="info-value empty">暂未上传照片</div>';
                    return '<div class="info-item" style="grid-column:1 / -1;align-items:flex-start;">' +
                        '<div class="info-label">' + label + '</div>' +
                        '<div class="info-value">' + photoHtml + '</div>' +
                    '</div>';
                }).join('');
            }
            return '<div class="record-detail-header"><div class="title">新增隐患</div></div>' +
                '<div class="info-grid" style="grid-template-columns:1fr;">' + typesHtml + judgeHtml + '</div>';
        }

        // ===== 记录级新增隐患（挂在每条 排查/巡查 记录上，2026-10-15 从房屋级 addDanger 搬移）=====
        // 结构：record.addDanger = { types: [], typesOther: '', photosByType: {type: 'url\nurl'}, judge: '第一类|第二类|第三类' }
        // 读取兜底：record 无 addDanger 时返回 null（查看态不渲染该区块，避免干扰历史数据）
        function getRecordAddDanger(rec) {
            if (!rec || typeof rec !== 'object') return null;
            const ad = rec.addDanger;
            if (!ad || typeof ad !== 'object') return null;
            if (!Array.isArray(ad.types)) ad.types = [];
            if (!ad.photosByType || typeof ad.photosByType !== 'object') ad.photosByType = {};
            return ad;
        }
        function getRecordAddDangerPhotos(ad, type) {
            if (!ad || !ad.photosByType) return [];
            const v = ad.photosByType[type];
            if (!v) return [];
            if (Array.isArray(v)) return v.filter(Boolean);
            if (typeof v === 'string') return v.split('\n').filter(Boolean);
            return [];
        }
        // 查看态：仅当该记录已填写 addDanger（有类型勾选或判断）时才渲染区块
        function renderRecordAddDanger(rec, sourceLabel) {
            const ad = getRecordAddDanger(rec);
            if (!ad) return '';
            const hasContent = (ad.types && ad.types.length) || ad.judge;
            if (!hasContent) return '';
            const types = ad.types || [];
            const judgeHtml = '<div class="info-item" style="grid-column:1 / -1;">' +
                '<div class="info-label"><span style="color:#dc3545;">*</span>' + (sourceLabel || '排查') + '判断</div>' +
                '<div class="info-value">' + (ad.judge || '—') + '</div>' +
            '</div>';
            let typesHtml = '';
            if (!types.length) {
                typesHtml = '<div class="info-item" style="grid-column:1 / -1;">' +
                    '<div class="info-label">隐患类型</div>' +
                    '<div class="info-value empty">暂未新增隐患</div>' +
                '</div>';
            } else {
                typesHtml = types.map(function(t) {
                    const label = (t === '其他安全问题' && ad.typesOther) ? (t + '（' + ad.typesOther + '）') : t;
                    const photos = getRecordAddDangerPhotos(ad, t);
                    const photoHtml = photos.length
                        ? '<div style="display:flex;flex-wrap:wrap;gap:10px;">' + photos.map(function(u) {
                            return '<img src="' + escapeHtml(u) + '" onclick="viewPhotoOnline(\'' + escapeJsStr(u) + '\')" style="width:120px;height:90px;object-fit:cover;border-radius:4px;cursor:pointer;border:1px solid var(--border);">';
                          }).join('') + '</div>'
                        : '<div class="info-value empty">暂未上传照片</div>';
                    return '<div class="info-item" style="grid-column:1 / -1;align-items:flex-start;">' +
                        '<div class="info-label">' + label + '</div>' +
                        '<div class="info-value">' + photoHtml + '</div>' +
                    '</div>';
                }).join('');
            }
            return '<div class="record-detail-header" style="margin-top:16px;"><div class="title">本次' + (sourceLabel || '排查') + '新增隐患</div></div>' +
                '<div class="info-grid" style="grid-template-columns:1fr;">' + typesHtml + judgeHtml + '</div>';
        }

        // tab1 隐患控制情况（多条记录，2026-10-15 重构）
        // 结构：s.controlRecords = [{ id, riskControlled, remark, reporter, reportTime }, ...]
        // 每次填报为独立一条；最新一条（按填报时间）由 __syncControlLegacy 同步回 manageRecords[0] 兼容旧读口
        function renderControlSituation(s) {
            const records = Array.isArray(s.controlRecords) ? s.controlRecords : null;
            // 旧结构兜底：controlRecords 不存在（迁移未跑）时，临时按单条渲染 manageRecords[0]
            let list = records;
            if (!records) {
                const mgmt = (s.manageRecords || [])[0] || {};
                const prj = (s.projectRecords || [])[0] || {};
                if (mgmt.riskControlled !== undefined || mgmt.remark || mgmt.reportTime) {
                    list = [{
                        id: 'LEGACY',
                        riskControlled: mgmt.riskControlled !== undefined ? !!mgmt.riskControlled : (s.governance === 'done' || s.closeStatus === '已通过'),
                        remark: mgmt.remark || '',
                        reporter: mgmt.reporter || prj.reporter || s.responsiblePerson || '',
                        reportTime: mgmt.reportTime || prj.reportTime || ''
                    }];
                } else {
                    list = [];
                }
            }
            // 顶部：标题 + 新增填报按钮
            const headerHtml = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:10px 14px;background:#f5f7fa;border:1px solid var(--border);border-radius:4px;">' +
                '<span style="font-size:13px;color:#606266;"><i class="fas fa-list-ol" style="color:var(--primary);margin-right:6px;"></i>隐患控制情况记录</span>' +
                '<button class="bottom-btn primary" style="padding:6px 14px;font-size:13px;" onclick="openControlEditModal(-1)"><i class="fas fa-plus"></i> 新增填报</button>' +
            '</div>';
            if (!list.length) {
                return headerHtml +
                    '<div class="record-empty" style="padding:40px 20px;text-align:center;border:1px dashed var(--border);border-radius:6px;background:#fafbfc;">' +
                        '<i class="fas fa-shield-alt" style="font-size:28px;color:#c0c4cc;display:block;margin-bottom:14px;"></i>' +
                        '暂无隐患控制情况记录<br><span style="font-size:12px;color:#909399;">点击右上角「新增填报」填写本次控制情况</span>' +
                    '</div>';
            }
            // 卡片列表（新记录在前，按 reportTime 倒序）
            const sorted = list.slice().sort(function(a, b){
                return String(b.reportTime || '').localeCompare(String(a.reportTime || ''));
            });
            const cardsHtml = sorted.map(function(rec, si){
                const idx = list.indexOf(rec); // 原数组索引（编辑/删除用）
                const controlled = !!rec.riskControlled;
                const statusColor = controlled ? 'var(--safe)' : '#fa8c16';
                const statusText = controlled ? '已控制' : '未控制';
                const remarkPreview = String(rec.remark || '—').replace(/</g, '&lt;');
                return '<div class="measure-history-card" id="ctrlCard-' + idx + '" style="margin-bottom:12px;border:1px solid var(--border);border-radius:6px;background:#fff;">' +
                    '<div class="measure-history-head" onclick="toggleControlCard(' + idx + ')" style="display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;background:#fafbfc;border-bottom:1px solid var(--border);">' +
                        '<i class="fas fa-circle" style="font-size:8px;color:' + statusColor + ';"></i>' +
                        '<span style="font-size:13px;color:' + statusColor + ';font-weight:500;">' + statusText + '</span>' +
                        (si === 0 ? '<span class="tag info" style="font-size:11px;padding:0 6px;">最新</span>' : '') +
                        '<span style="font-size:13px;color:#303133;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + remarkPreview.replace(/"/g, '&quot;') + '">' + remarkPreview + '</span>' +
                        '<span style="font-size:12px;color:#909399;flex-shrink:0;">填报 ' + String(rec.reporter || '—').replace(/</g, '&lt;') + ' · ' + (rec.reportTime || '—') + '</span>' +
                        '<button class="mh-toggle" onclick="event.stopPropagation();toggleControlCard(' + idx + ')" style="padding:2px 10px;font-size:12px;border:1px solid var(--border);background:#fff;border-radius:3px;cursor:pointer;">详情</button>' +
                        '<i class="fas fa-chevron-right mh-caret" style="color:#909399;font-size:12px;"></i>' +
                    '</div>' +
                    '<div class="measure-history-body" id="ctrlCardBody-' + idx + '" style="display:none;padding:14px 16px;">' +
                        renderControlDetailHtml(rec) +
                        '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">' +
                            '<button class="bottom-btn" style="padding:4px 12px;font-size:12px;" onclick="event.stopPropagation();openControlEditModal(' + idx + ')"><i class="fas fa-edit"></i> 编辑</button>' +
                            '<button class="bottom-btn" style="padding:4px 12px;font-size:12px;border-color:var(--danger);color:var(--danger);" onclick="event.stopPropagation();deleteControlRecord(' + idx + ')"><i class="fas fa-trash-alt"></i> 删除</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
            return headerHtml + cardsHtml;
        }

        // 单条控制记录详情体（绿色值风格与原单条渲染一致）
        function renderControlDetailHtml(rec) {
            const esc = v => String(v === undefined || v === null || v === '' ? '—' : v).replace(/</g, '&lt;');
            const kvGreen = (label, value, rawHtml) => '<div class="info-item">' +
                '<div class="info-label">' + label + '</div>' +
                '<div class="info-value" style="color:var(--safe);font-weight:500;">' + (rawHtml ? value : esc(value)) + '</div>' +
            '</div>';
            const kvGreenFull = (label, value, rawHtml) => '<div class="info-item" style="grid-column:1/-1;">' +
                '<div class="info-label">' + label + '</div>' +
                '<div class="info-value" style="color:var(--safe);font-weight:500;">' + (rawHtml ? value : esc(value)) + '</div>' +
            '</div>';
            return '<div class="info-grid info-grid-2col" style="margin-top:0;">' +
                kvGreenFull('安全隐患是否得到控制', rec.riskControlled ? '<span class="status-badge safe">安全隐患已得到控制</span>' : '<span class="status-badge warning">安全隐患没有得到控制</span>', true) +
                kvGreenFull('备注', rec.remark) +
                kvGreen('填报人', rec.reporter) +
                kvGreen('填报时间', rec.reportTime) +
            '</div>';
        }

        // 折叠/展开控制情况卡片
        function toggleControlCard(idx) {
            const body = document.getElementById('ctrlCardBody-' + idx);
            const card = document.getElementById('ctrlCard-' + idx);
            if (!body) return;
            const open = body.style.display !== 'none';
            body.style.display = open ? 'none' : 'block';
            if (card) card.classList.toggle('open', !open);
        }

        // 删除某条控制情况记录（最新一条删除后由次新记录接管旧读口）
        function deleteControlRecord(idx) {
            const s = currentHouseArch;
            if (!Array.isArray(s.controlRecords) || idx < 0 || idx >= s.controlRecords.length) return;
            if (!confirm('确认删除本条隐患控制情况记录？删除后不可恢复。')) return;
            s.controlRecords.splice(idx, 1);
            __syncControlLegacy(s);
            saveCurrentHouseArch(s);
            renderContent();
        }

        // tab2 隐患动态记录
        function renderControlDynamic(s) {
            const idx = parseInt(String(s.no || '0').replace(/\D/g, '') || '0', 10);
            const ins = (s.riskIdentification || [])[0] || (s.inspectionRecords || [])[0] || {};
            const patrol = (s.patrolRecords || [])[0] || {};
            const mgmt = (s.manageRecords || [])[0] || {};
            const riskText = getRiskDisplayLabel(s.riskLevel) || '—';
            const persons = ['王建国', '陈明华', '周敏', '张建军'];
            const records = [];

            records.push({
                id: 'DYN-' + (s.no || 'NF') + '-001',
                judge: '确认安全隐患',
                reason: ins.hazardDesc || ('排查发现房屋存在安全隐患，风险等级：' + riskText),
                reporter: ins.reporter || ins.checker || ins.identifyPerson || s.responsiblePerson || '—',
                reportTime: ins.reportTime || ins.checkDate || ins.identifyDate || '—'
            });

            records.push({
                id: 'DYN-' + (s.no || 'NF') + '-002',
                judge: '新增隐患',
                reason: patrol.foundProblems || '巡查发现隐患部位有发展趋势',
                reporter: patrol.patrolPerson || persons[(idx + 1) % persons.length],
                reportTime: patrol.patrolDate || '—'
            });

            const doneLike = s.governance === 'done' || (s.manageRecords || []).some(m => m.riskControlled);
            records.push({
                id: 'DYN-' + (s.no || 'NF') + '-003',
                judge: doneLike ? '隐患已控制' : '隐患未控制',
                reason: mgmt.remark || ('落实' + (mgmt.measureType || '管控') + '措施'),
                reporter: mgmt.reporter || mgmt.dutyPerson || persons[(idx + 2) % persons.length],
                reportTime: mgmt.reportTime || mgmt.startTime || '—'
            });

            const rows = records.map(r => '<tr>' +
                '<td>' + r.judge + '</td><td style="text-align:left;">' + r.reason + '</td>' +
                '<td>' + r.reporter + '</td><td>' + r.reportTime + '</td></tr>').join('');
            return '<div class="record-detail-header"><div class="title">隐患动态记录（' + records.length + '）</div></div>' +
                '<div class="table-wrap"><table class="arch-table"><thead><tr><th>隐患判定情况</th><th>新增隐患原因</th><th>填报人</th><th>填报时间</th></tr></thead>' +
                '<tbody>' + rows + '</tbody></table></div>';
        }

        // ===== 质检 ↔ 整改 ↔ 隐患动态 一一对应（1:1:1，2026-10-16 重构）=====
        // 整改回应：优先取质检记录内嵌 rectify 对象；兜底取 manageRecords/projectRecords 中显式 qualityId 关联的记录
        function collectRectifyRecords(s) {
            const rows = [];
            (s.qualityChecks || []).forEach(function(q){
                if (q.rectify) {
                    rows.push({
                        qualityId: q.id,
                        person: q.rectify.person || '—',
                        selfConfirm: q.rectify.done ? '已自查确认' : '自查中',
                        remark: q.rectify.remark || '—',
                        time: q.rectify.time || '—',
                        done: !!q.rectify.done
                    });
                }
            });
            // 兜底：manageRecords/projectRecords 里显式带 qualityId 的（历史数据兼容）
            (s.manageRecords || []).forEach(function(m){
                if (!m.qualityId) return;
                rows.push({
                    qualityId: m.qualityId,
                    person: m.dutyPerson || m.manager || m.reporter || '—',
                    selfConfirm: m.isDone ? '已自查确认' : '自查中',
                    remark: m.remark || m.measureDesc || '—',
                    time: m.actualEndTime || m.reportTime || m.startTime || '—',
                    done: m.isDone
                });
            });
            (s.projectRecords || []).forEach(function(p){
                if (!p.qualityId) return;
                rows.push({
                    qualityId: p.qualityId,
                    person: p.manager || p.checker || p.reporter || '—',
                    selfConfirm: p.isDone ? '已自查确认' : '自查中',
                    remark: p.remark || (p.projectName ? p.projectName + (p.isDone ? '已完成' : '进行中') : '—'),
                    time: p.endDate || p.reportTime || p.startDate || '—',
                    done: p.isDone
                });
            });
            return rows;
        }

        // 渲染单条整改回应（绑定 qualityId，编辑时定位到对应质检记录的内嵌 rectify）
        function renderRectifyPairSection(r, qualityId) {
            const kvH = (label, value, rawHtml) => '<div class="info-item">' +
                '<div class="info-label">' + label + '</div>' +
                '<div class="info-value">' + (rawHtml ? value : (value || '—')) + '</div></div>';
            const grid =
                kvH('整改员', r.person) +
                kvH('自查确认', '<span class="status-badge ' + (r.done ? 'safe' : 'warning') + '">' + r.selfConfirm + '</span>', true) +
                kvH('整改时间', r.time) +
                kvH('备注', r.remark);
            return '<div class="rectify-pair" style="margin-top:14px;border-left:3px solid var(--primary);padding-left:14px;">' +
                '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">' +
                    '<span class="tag info">整改回应</span>' +
                    '<span style="font-size:12px;color:var(--text-secondary);">质检提问题 → 整改给回应</span>' +
                    '<a href="javascript:void(0)" class="op-btn outline rectify-edit" data-quality-id="' + qualityId + '" style="margin-left:auto;"><i class="fas fa-edit"></i>编辑（整改员）</a>' +
                '</div>' +
                '<div class="info-grid info-grid-2col">' + grid + '</div>' +
            '</div>';
        }

        // 渲染单条隐患动态（质检详情内嵌，绑定 qualityId；空态显示「+ 填报隐患动态」）
        function renderDynPairSection(d, qualityId) {
            if (!d) {
                return '<div class="rectify-pair" style="margin-top:14px;border-left:3px solid var(--border);padding-left:14px;">' +
                    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span class="tag">隐患动态</span>' +
                    '<span style="font-size:12px;color:var(--text-secondary);">整改回应后 → 填报隐患动态</span>' +
                    '<a href="javascript:void(0)" class="op-btn outline dyn-edit" data-quality-id="' + qualityId + '" style="margin-left:auto;"><i class="fas fa-plus"></i>填报隐患动态</a></div>' +
                    '<div class="record-empty" style="padding:14px;">该轮质检暂无对应的隐患动态记录</div></div>';
            }
            const kvH = (label, value, rawHtml) => '<div class="info-item">' +
                '<div class="info-label">' + label + '</div>' +
                '<div class="info-value">' + (rawHtml ? value : (value || '—')) + '</div></div>';
            const grid =
                kvH('隐患判定情况', d.judge) +
                kvH('填报人', d.reporter) +
                kvH('新增隐患原因 / 情况说明', d.reason) +
                kvH('填报时间', d.reportTime);
            return '<div class="rectify-pair" style="margin-top:14px;border-left:3px solid var(--primary);padding-left:14px;">' +
                '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">' +
                    '<span class="tag info">隐患动态</span>' +
                    '<span style="font-size:12px;color:var(--text-secondary);">整改回应后 → 填报隐患动态</span>' +
                    '<a href="javascript:void(0)" class="op-btn outline dyn-edit" data-quality-id="' + qualityId + '" style="margin-left:auto;"><i class="fas fa-edit"></i>编辑（填报人）</a>' +
                '</div>' +
                '<div class="info-grid info-grid-2col">' + grid + '</div>' +
            '</div>';
        }

        // 兼容旧调用：历史整改信息区块（现仅作为 renderControlHistory 的兜底，主入口已并入质检配对）
        function renderQualityHistorySection(s) {
            const rows = collectRectifyRecords(s);
            if (!rows.length) return '';
            const body = rows.map((r, i) => '<tr>' +
                '<td>' + (i + 1) + '</td><td>' + r.person + '</td>' +
                '<td><span class="status-badge ' + (r.done ? 'safe' : 'warning') + '">' + r.selfConfirm + '</span></td>' +
                '<td style="text-align:left;">' + r.remark + '</td><td>' + r.time + '</td></tr>').join('');
            return '<div class="record-detail-header" style="margin-top:18px;border-top:1px solid var(--border);padding-top:16px;">' +
                '<div class="title">历史整改信息</div>' +
                '<div class="meta">质检提问题 → 整改给回应（共 ' + rows.length + ' 条整改记录）</div></div>' +
                '<div class="table-wrap" style="margin-top:14px;"><table class="arch-table"><thead><tr><th>序号</th><th>整改员</th><th>自查确认</th><th>备注</th><th>整改时间</th></tr></thead>' +
                '<tbody>' + body + '</tbody></table></div>';
        }

        // 隐患动态记录区块（1:1:1 结构：每条质检记录对应一条隐患动态）
        // 数据存于 s.qualityChecks[i].dyn（嵌入对象，不再是独立数组）
        function renderHazardDynamicSection(s) {
            const qList = (s.qualityChecks || []).slice().sort(function(a, b){ return String(b.checkDate || '').localeCompare(String(a.checkDate || '')); });
            const rows = qList.map(function(q, i){
                const d = q.dyn || {};
                return '<tr>' +
                    '<td style="text-align:center;">' + (i + 1) + '</td>' +
                    '<td>' + (q.checkDate || '—') + '</td>' +
                    '<td>' + (d.judge || '—') + '</td>' +
                    '<td style="text-align:left;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + (d.reason || '') + '">' + (d.reason || '—') + '</td>' +
                    '<td>' + (d.reporter || '—') + '</td>' +
                    '<td>' + (d.reportTime || '—') + '</td>' +
                '</tr>';
            }).join('');
            return '<div style="margin-top:18px;border-top:1px solid var(--border);padding-top:16px;">' +
                '<div class="record-detail-header">' +
                    '<div class="title">隐患动态记录（' + qList.length + '）</div>' +
                    '<div class="meta" style="font-size:12px;color:var(--text-secondary);">每条质检对应一条隐患动态（1:1:1）· 填报/编辑请进入质检详情</div>' +
                '</div>' +
                (qList.length
                    ? '<div class="table-wrap" style="margin-top:10px;"><table class="arch-table"><thead><tr>' +
                      '<th style="width:50px;text-align:center;">序号</th>' +
                      '<th style="width:96px;">质检时间</th>' +
                      '<th>隐患判定情况</th><th>新增隐患原因</th><th>填报人</th><th>填报时间</th>' +
                      '</tr></thead><tbody>' + rows + '</tbody></table></div>'
                    : '<div class="record-empty"><i class="fas fa-inbox" style="font-size:32px;color:#ddd;margin-bottom:8px;"></i><div>暂无质检记录</div><div style="font-size:12px;color:#909399;margin-top:4px;">新增质检记录后可编辑对应隐患动态</div></div>') +
            '</div>';
        }

        // ===== 隐患动态记录 编辑（绑定 qualityId，1:1:1 结构）=====
        // 判定情况枚举与房屋风险等级三类一致（2026-10-16）
        const DYN_JUDGE_OPTIONS = ['未发现安全隐患(第一类)', '存在一定安全隐患(第二类)', '存在严重安全隐患(第三类)'];

        function openDynEditModal(qualityId) {
            const s = currentHouseArch;
            const q = (s.qualityChecks || []).find(function(x){ return x.id === qualityId; });
            if (!q) return;
            window.__dynEditQualityId = qualityId;
            const d = q.dyn || {};
            const judge = d.judge !== undefined ? d.judge : DYN_JUDGE_OPTIONS[1];
            const reason = d.reason !== undefined ? d.reason : '';
            const reporter = d.reporter !== undefined ? d.reporter : (s.responsiblePerson || '');
            const reportTime = d.reportTime || '';
            const labelStyle = 'style="color:var(--safe);"';
            const html = '<div class="form-grid">' +
                '<div class="form-item">' +
                    '<label class="form-label" ' + labelStyle + '>隐患判定情况</label>' +
                    '<select class="form-input" data-dkey="judge">' +
                        DYN_JUDGE_OPTIONS.map(function(o){ return '<option value="' + o + '"' + (o === judge ? ' selected' : '') + '>' + o + '</option>'; }).join('') +
                    '</select>' +
                '</div>' +
                '<div class="form-item">' +
                    '<label class="form-label" ' + labelStyle + '>填报人</label>' +
                    '<input class="form-input" data-dkey="reporter" type="text" value="' + String(reporter).replace(/"/g, '&quot;') + '">' +
                '</div>' +
                '<div class="form-item form-item-full">' +
                    '<label class="form-label" ' + labelStyle + '>新增隐患原因 / 情况说明</label>' +
                    '<textarea class="form-input" data-dkey="reason" rows="3" style="resize:vertical;" placeholder="如：巡查发现承重墙新出现斜向裂缝">' + String(reason).replace(/</g, '&lt;') + '</textarea>' +
                '</div>' +
                '<div class="form-item">' +
                    '<label class="form-label" ' + labelStyle + '>填报时间&nbsp;<span style="color:var(--text-secondary);font-weight:normal;font-size:12px;">（保存时自动记录）</span></label>' +
                    '<input class="form-input" type="text" value="' + String(reportTime).replace(/"/g, '&quot;') + '" readonly disabled style="background:#f5f7fa;color:var(--text-secondary);cursor:not-allowed;">' +
                '</div>' +
            '</div>';
            document.getElementById('dynEditForm').innerHTML = html;
            document.getElementById('dynEditTitle').innerHTML = '<i class="fas fa-edit"></i> 编辑隐患动态记录';
            document.getElementById('dynEditModal').classList.add('open');
        }

        function closeDynEditModal() {
            document.getElementById('dynEditModal').classList.remove('open');
        }

        function saveDynEdit() {
            const s = currentHouseArch;
            const qualityId = window.__dynEditQualityId;
            const q = (s.qualityChecks || []).find(function(x){ return x.id === qualityId; });
            if (!q) return;
            const getV = function(k){
                const el = document.querySelector('#dynEditForm [data-dkey="' + k + '"]');
                return el ? el.value.trim() : '';
            };
            if (!getV('reason')) { alert('请填写「新增隐患原因 / 情况说明」'); return; }
            q.dyn = {
                judge: getV('judge'),
                reason: getV('reason'),
                reporter: getV('reporter'),
                reportTime: formatDateTime(new Date())
            };
            saveCurrentHouseArch(s);
            closeDynEditModal();
            renderContent();
        }

        // tab3 最新质检信息（抽查模式：列表 + 详情；底部合并展示隐患动态记录）
        function renderControlQuality(s) {
            const list = (s.qualityChecks || []).slice().sort((a, b) => (b.checkDate || '').localeCompare(a.checkDate || ''));
            const rectifies = collectRectifyRecords(s);
            // 1:1:1 配对：质检 i ↔ 整改 rectify[i] ↔ 隐患动态 dyn[i]（均按 qualityId 精确匹配）
            const pairOf = (q) => rectifies.find(r => r.qualityId === q.id) || null;

            // 详情视图
            if (currentQualityId) {
                const q = list.find(x => x.id === currentQualityId);
                if (!q) { currentQualityId = null; return renderControlQuality(s); }
                const pair = pairOf(q);
                const kvGreen = (label, value, rawHtml) => '<div class="info-item">' +
                    '<div class="info-label">' + label + '</div>' +
                    '<div class="info-value" style="color:var(--safe);font-weight:500;">' + (rawHtml ? value : (value || '—')) + '</div>' +
                '</div>';
                const grid = [
                    kvGreen('质检员', q.inspector || '—'),
                    kvGreen('质检结论', q.result || '—'),
                    kvGreen('质检来源', q.source || '—'),
                    kvGreen('核查结论', q.checkConclusion || '—'),
                    kvGreen('是否真的实施了工程措施进行整治', q.hasEngineeringMeasure ? '是' : '否'),
                    kvGreen('安全隐患没有彻底消除', q.notEliminated ? '<span class="status-badge warning">是</span>' : '<span class="status-badge safe">否</span>', true),
                    kvGreen('安全隐患没有彻底消除细类', q.notEliminated ? (q.notEliminatedSub || '—') : '—'),
                    kvGreen('质检批注', q.remark || '—'),
                    kvGreen('质检时间', q.checkDate || '—')
                ].join('');
                const pairHtml = pair
                    ? renderRectifyPairSection(pair, q.id)
                    : '<div class="rectify-pair" style="margin-top:14px;border-left:3px solid var(--border);padding-left:14px;">' +
                      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span class="tag">整改回应</span>' +
                      '<a href="javascript:void(0)" class="op-btn outline rectify-edit" data-quality-id="' + q.id + '" style="margin-left:auto;"><i class="fas fa-plus"></i>填报整改回应</a></div>' +
                      '<div class="record-empty" style="padding:14px;">该轮质检暂无对应的整改回应记录</div></div>';
                const dynHtml = renderDynPairSection(q.dyn || null, q.id);
                return '<div class="record-detail-header">' +
                    '<div class="title"><a href="javascript:void(0)" class="quality-back" style="color:#409eff;margin-right:8px;"><i class="fas fa-arrow-left"></i></a>质检详情' +
                        '<a href="javascript:void(0)" class="op-btn outline quality-edit" data-quality-id="' + q.id + '" style="margin-left:12px;vertical-align:2px;"><i class="fas fa-edit"></i>编辑</a>' +
                    '</div>' +
                '</div>' +
                '<div class="info-grid info-grid-2col">' + grid + '</div>' +
                pairHtml +
                dynHtml;
            }

            // 列表视图
            if (!list.length) {
                return '<div class="record-detail-header"><div class="title">最新质检信息</div>' +
                    '<button class="bottom-btn" style="padding:4px 12px;font-size:12px;" onclick="addQualityRecord()"><i class="fas fa-plus"></i> 新增质检</button></div>' +
                    '<div class="record-empty"><i class="fas fa-inbox" style="font-size:32px;color:#ddd;margin-bottom:8px;"></i><div>暂无质检抽查记录</div><div style="font-size:12px;color:#909399;margin-top:4px;">质检属于抽查项目，不是每次都必须进行</div></div>' +
                    renderHazardDynamicSection(s);
            }

        // tab4 历史整改信息（已并入「最新质检信息」同屏展示，此处复用同一渲染逻辑）

        // 阶段性验收：复刻 rural-house-detail 布局

                ).join('') + '</div>';

            // 渲染单条填报卡片（与验收销项 renderCloseHistoryCard 对齐）
            const renderAcceptHistoryCard = (r, idx) => {

                const statusText = r.audited ? '已审核' : '待审核';
                const kv = (label, value, fullWidth) => {

                    kv('经专业第三方复核判定', r.thirdPartyResult, true) +
                    kv('姓名', r.manager) +
                    kv('联系电话', r.phone) +
                    photoItem('整治后照片', r.rectifyPhotos) +
                    photoItem('相关资料', r.relatedFiles) +
                    kv('备注', r.acceptRemark, true) +
                    kv('填报人', r.reporter) +
                    kv('填报时间', r.acceptReportTime) +

                        '<button class="bottom-btn" style="padding:4px 12px;font-size:12px;border-color:var(--danger);color:var(--danger);" onclick="event.stopPropagation();deleteAcceptHistoryRecord(' + idx + ')"><i class="fas fa-trash-alt"></i> 删除</button>' +

                                '<input type="checkbox" disabled style="width:15px;height:15px;cursor:not-allowed;">' +
                              '</label>'
                            : '<label style="display:flex;align-items:center;margin-right:2px;" title="勾选后可批量审核" onclick="event.stopPropagation();">' +
                                '<input type="checkbox" class="accept-audit-check" data-idx="' + idx + '" onchange="updateAcceptBatchAuditBar()" style="width:15px;height:15px;cursor:pointer;">' +
                              '</label>') +
                        '<i class="fas fa-circle mh-status" style="font-size:8px;color:' + statusColor + ';"></i>' +
                        '<span style="font-size:13px;color:' + statusColor + ';font-weight:500;">' + statusText + '</span>' +
                        (r.audited ? '<span class="status-badge safe" style="margin-left:2px;">已审核</span>' : '') +
                        '<span class="mh-range">' + (r.acceptReportTime || '—') + '</span>' +
                        '<span class="mh-name">' + (r.acceptMethod || '—') + '</span>' +
                        '<button class="mh-toggle" onclick="event.stopPropagation();toggleAcceptHistory(' + idx + ')">历史</button>' +
                        '<i class="fas fa-chevron-right mh-caret"></i>' +
                    '</div>' +
                    '<div class="measure-history-body">' + detailHtml + actionBar + '</div>' +
