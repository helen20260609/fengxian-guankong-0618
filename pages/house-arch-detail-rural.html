        function saveSurveyEdit() {
            const data = getSurveyData()[surveyEditModalSubTab];
            const inputs = document.querySelectorAll('#surveyEditModalForm .form-input, #surveyEditModalForm .form-select');
            const row = data.rows[0];
            inputs.forEach(input => {
                const idx = input.dataset.idx;
                // 跳过非字段库输入（如记录级 sceneUsage 用 data-field 而非 data-idx）
                if (idx === undefined) return;
                if (idx.startsWith('extra_')) {
                    // extraRows 字段：idx = extra_rIdx_cIdx
                    const parts = idx.split('_');
                    const rIdx = parseInt(parts[1], 10);
                    const cIdx = parseInt(parts[2], 10);
                    if (data.extraRows && data.extraRows[rIdx] && data.extraRows[rIdx][cIdx]) {
                        data.extraRows[rIdx][cIdx].value = input.value;
                    }
                } else {
                    const colIdx = parseInt(idx, 10);
                    if (row && row[colIdx] !== undefined) {
                        row[colIdx] = input.value;
                    }
                }
            });
            // 更新时间由系统自动记录为本次保存时间
            const utIdx = data.columns.indexOf('更新时间');
            if (utIdx !== -1 && row) {
                const now = new Date();
                const pad = function(n){ return n < 10 ? '0' + n : '' + n; };
                row[utIdx] = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
            }
            // 填报时间：系统自动记录本次保存时间
            const rtIdx = data.columns.indexOf('填报时间');
            if (rtIdx !== -1 && row) {
                row[rtIdx] = formatDateTime(new Date());
            }
            currentSurveySubTab = surveyEditModalSubTab;
            // v2：survey1（排查登记）编辑保存后，把字段库行同步回当前激活的 inspectionRecords 记录
            try {
                if (surveyEditModalSubTab === 'survey1' && Array.isArray(currentHouseArch.inspectionRecords) && currentHouseArch.inspectionRecords.length) {
                    const cols = data.columns || [];
                    const rowVals = (data.rows && data.rows[0]) || [];
                    const get = function(label){ const i = cols.indexOf(label); return i !== -1 ? (rowVals[i] || '') : ''; };
                    // 排序后索引
                    const sorted = currentHouseArch.inspectionRecords.slice().sort(function(a,b){
                        return String(b.checkDate || b.reportTime || '').localeCompare(String(a.checkDate || a.reportTime || ''));
                    });
                    const actIdx = Math.min(recordViewState.inspection || 0, Math.max(sorted.length - 1, 0));
                    const rec = sorted[actIdx];
                    if (rec) {
                        rec.checkDate = get('排查时间') || rec.checkDate;
                        rec.town = (get('排查单位') || '').replace(/人民政府$/, '') || rec.town;
                        rec.checker = get('排查人员') || rec.checker;
                        rec.structureStatus = (function(){ const v = get('结构状况'); return (v === '无变形损伤' || v === '有变形损伤') ? v : rec.structureStatus; })();
                        rec.damagePart = get('损伤具体部位') || rec.damagePart;
                        rec.overload = get('增加堆载（二层及以上堆放大量重物）') || rec.overload;
                        rec.otherRisk = get('其他使用安全隐患') || rec.otherRisk;
                        rec.preliminaryJudge = get('初步判定/排查结论') || rec.preliminaryJudge;
                        rec.location = get('位置标注') || rec.location;
                        rec.dutyPerson = get('房屋安全责任人') || rec.dutyPerson;
                        rec.dutyPhone = get('联系方式') || rec.dutyPhone;
                        rec.preAppraisal = get('安全鉴定：是否整治前鉴定') || rec.preAppraisal;
                        rec.noAppraisalReason = get('未进行鉴定房屋原因') || rec.noAppraisalReason;
                        rec.remark = (function(){
                            if (!data.extraRows) return rec.remark;
                            for (let r = 0; r < data.extraRows.length; r++) {
                                const xrow = data.extraRows[r] || [];
                                for (let c = 0; c < xrow.length; c++) {
                                    if (xrow[c] && (xrow[c].label === '排查备注/隐患描述' || xrow[c].label === '排查备注')) return xrow[c].value || rec.remark;
                                }
                            }
                            return rec.remark;
                        })();
                        rec.photos = (function(){
                            if (!data.extraRows) return rec.photos;
                            for (let r = 0; r < data.extraRows.length; r++) {
                                const row = data.extraRows[r] || [];
                                for (let c = 0; c < row.length; c++) {
                                    if (row[c] && row[c].label === '排查照片') return row[c].value || rec.photos;
                                }
                            }
                            return rec.photos;
                        })();
                        // 记录级「房屋用途现场情况」（sceneUsage）
                        try {
                            const suStatusInput = document.querySelector('#surveyEditModalForm .survey-scene-input[data-field="usageStatus"]');
                            const suUsageInput = document.querySelector('#surveyEditModalForm .survey-scene-input[data-field="houseUsage"]');
                            if (suStatusInput || suUsageInput) {
                                if (!rec.sceneUsage || typeof rec.sceneUsage !== 'object') rec.sceneUsage = {};
                                if (suStatusInput) rec.sceneUsage.usageStatus = suStatusInput.value;
                                if (suUsageInput) rec.sceneUsage.houseUsage = suUsageInput.value;
                            }
                        } catch (e) {}
                        // 同步风险记录中对应条目（结论可能变了）
                        try { syncRiskRecords(currentHouseArch); } catch (e) {}
                        try { ensureGovernanceEvents(currentHouseArch); } catch (e) {}
                        // 记录级「新增隐患」：保存时转换为隐患台账记录（一处一条查重由 registerDiscoveryHazards 处理），
                        // 写入成功后清除源记录上的 addDanger（隐患统一由 hazardRecords 跟踪，源记录不重复持有）
                        try {
                            if (rec.addDanger) {
                                const ad = rec.addDanger;
                                const hasTypes = Array.isArray(ad.types) && ad.types.length > 0;
                                const hasJudge = !!ad.judge;
                                const hasOther = !!(ad.typesOther && String(ad.typesOther).trim());
                                const hasPhotos = ad.photosByType && Object.keys(ad.photosByType).some(function(k) {
                                    const v = ad.photosByType[k];
                                    return (Array.isArray(v) && v.length) || (typeof v === 'string' && v.trim());
                                });
                                if (hasTypes) {
                                    let registered = false;
                                    try {
                                        const getPhotosArr = function(t) {
                                            const v = ad.photosByType && ad.photosByType[t];
                                            if (!v) return [];
                                            if (Array.isArray(v)) return v.filter(Boolean);
                                            return String(v).split('\n').filter(Boolean);
                                        };
                                        const newHazards = ad.types.map(function(t) {
                                            const otherText = (t === '其他安全问题' && hasOther) ? String(ad.typesOther).trim() : '';
                                            return {
                                                hazardType: t,
                                                hazardTypeOther: otherText,
                                                location: rec.damagePart || '',
                                                description: otherText || t,
                                                photos: getPhotosArr(t),
                                                initialJudge: ad.judge || '第三类'
                                            };
                                        });
                                        registerDiscoveryHazards(currentHouseArch, '排查', rec, newHazards, []);
                                        registered = true;
                                    } catch (e) { console.warn('addDanger 写入隐患台账失败', e); }
                                    if (registered) delete rec.addDanger;
                                } else {
                                    delete rec.addDanger;
                                }
                            }
                        } catch (e) { console.warn('登记隐患写入失败', e); }
                    }
                }
            } catch (e) {}
            // 字段库改动持久化到草稿
            currentHouseArch._fieldsLibrary = dumpFieldsLibrary();
            delete currentHouseArch._syncedAt; // 编辑后标记为未同步
            saveCurrentHouseArch(currentHouseArch);
            closeSurveyEditModal();
            renderSidebar();
            renderContent();
        }

        function handlePatrolPhotoUpload(input) {
            const wrap = input.parentElement;
            const files = Array.from(input.files || []);
            if (!files.length) return;
            const invalid = files.find(f => !f.type.startsWith('image/'));
            if (invalid) { alert('请上传图片文件'); return; }
            const urlInput = wrap.querySelector('.file-url-input');
            const existing = urlInput.value.split(',').map(s => s.trim()).filter(Boolean);
            const readers = files.map(file => new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => resolve({ url: e.target.result, name: file.name, size: file.size, type: file.type });
                reader.readAsDataURL(file);
            }));
            Promise.all(readers).then(results => {
                if (!window.__measureFileMeta) window.__measureFileMeta = {};
                results.forEach(r => { window.__measureFileMeta[r.url] = { name: r.name, size: r.size, type: r.type }; });
                const all = existing.concat(results.map(r => r.url)).filter((v, i, a) => a.indexOf(v) === i);
                urlInput.value = all.join(',');
                urlInput.dispatchEvent(new Event('input'));
                renderMeasureFileList(wrap, all);
            });

        function bindPlanPhotoDropzones() {
            document.querySelectorAll('#planEditForm .file-upload-wrap').forEach(wrap => {
                const input = wrap.querySelector('.file-upload-input');
                const dropzone = wrap.querySelector('.file-upload-dropzone');
                if (!input || !dropzone) return;
                dropzone.addEventListener('click', () => input.click());
                ['dragenter', 'dragover'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('dragover'); }));
                ['dragleave', 'drop'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('dragover'); }));
                dropzone.addEventListener('drop', e => {
                    const files = e.dataTransfer.files;
                    if (files.length > 0) { input.files = files; handlePlanPhotoUpload(input); }
                });
            });
        }

        function handlePlanPhotoUpload(input) {
            const wrap = input.parentElement;
            const files = Array.from(input.files || []);
            if (!files.length) return;
            const urlInput = wrap.querySelector('.file-url-input');
            const isImageOnly = urlInput && urlInput.getAttribute('data-photo-type') === 'image';
            if (isImageOnly) {
                const invalid = files.find(f => !f.type.startsWith('image/'));
                if (invalid) { alert('请上传图片文件'); return; }
            }
            const existing = urlInput.value.split(',').map(s => s.trim()).filter(Boolean);
            const readers = files.map(file => new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => resolve({ url: e.target.result, name: file.name, size: file.size, type: file.type });
                reader.readAsDataURL(file);
            }));
            Promise.all(readers).then(results => {
                if (!window.__measureFileMeta) window.__measureFileMeta = {};
                results.forEach(r => { window.__measureFileMeta[r.url] = { name: r.name, size: r.size, type: r.type }; });
                const all = existing.concat(results.map(r => r.url)).filter((v, i, a) => a.indexOf(v) === i);
                urlInput.value = all.join(',');
                urlInput.dispatchEvent(new Event('input'));
                renderMeasureFileList(wrap, all);
            });
        }

            const arrKey = isAssess ? 'assessmentRecords' : 'evaluationRecords';
            if (!Array.isArray(s[arrKey])) s[arrKey] = [];
            const reporterIdx = libColumns.indexOf('填报人');
            if (__appraisalEditIdx >= 0 && __appraisalEditIdx < s[arrKey].length) {
                // 编辑：替换原记录（保留 id/createdAt）
                const old = s[arrKey][__appraisalEditIdx];

                    reportTime: reportTimeIdx !== -1 ? (row[reportTimeIdx] || '') : '',

        function normalizeDateValue(val) {
            if (!val || val === '—' || val === '-') return '';
            const s = String(val).trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
            const d = new Date(s);
            if (isNaN(d.getTime())) return '';
            const pad = n => n < 10 ? '0' + n : n;
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }

        function formatDateTime(d) {
            const pad = n => n < 10 ? '0' + n : n;
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function bindCommonPhotoDropzones() {
            document.querySelectorAll('#commonEditForm .file-upload-wrap').forEach(wrap => {
                const input = wrap.querySelector('.file-upload-input');
                const dropzone = wrap.querySelector('.file-upload-dropzone');
                const isAttach = wrap.dataset.attachField === 'assessment-report';
                const uploadFn = isAttach ? handleCommonFileUpload : handleCommonPhotoUpload;
                dropzone.addEventListener('click', () => input.click());
                ['dragenter', 'dragover'].forEach(event => {
                    dropzone.addEventListener(event, (e) => {
                        e.preventDefault();
                        dropzone.classList.add('dragover');
                    });
                });
                ['dragleave', 'drop'].forEach(event => {
                    dropzone.addEventListener(event, (e) => {
                        e.preventDefault();
                        dropzone.classList.remove('dragover');
                    });
                });
                dropzone.addEventListener('drop', (e) => {
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        input.files = files;
                        uploadFn(input);
                    }
                });
                // 初始渲染文件列表
                {
                    const urlInput = wrap.querySelector('.file-url-input');
                    if (urlInput && urlInput.value) {
                        if (isAttach) {
                            const files = projectFilesFromString(urlInput.value || '');
                            renderCommonFileList(wrap, files);
                        } else {
                            const urls = (urlInput.value || '').split(',').map(s => s.trim()).filter(Boolean);
                            if (urls.length) renderMeasureFileList(wrap, urls);
                        }
                    }
                }
            });
        }

        function handleCommonPhotoUpload(input) {
            const wrap = input.parentElement;
            const files = Array.from(input.files || []);
            if (files.length === 0) return;
            const invalid = files.find(f => !f.type.startsWith('image/'));
            if (invalid) {
                alert('请上传图片文件');
                return;
            }
            const urlInput = wrap.querySelector('.file-url-input');
            const existingUrls = urlInput.value.split(',').map(s => s.trim()).filter(Boolean);
            const readers = files.map(file => {
                return new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => resolve({ url: e.target.result, name: file.name, size: file.size, type: file.type });
                    reader.readAsDataURL(file);
                });
            });
            Promise.all(readers).then(results => {
                if (!window.__measureFileMeta) window.__measureFileMeta = {};
                results.forEach(r => { window.__measureFileMeta[r.url] = { name: r.name, size: r.size, type: r.type }; });
                const allUrls = existingUrls.concat(results.map(r => r.url)).filter((v, i, a) => a.indexOf(v) === i);
                urlInput.value = allUrls.join(',');
                urlInput.dispatchEvent(new Event('input'));
                renderMeasureFileList(wrap, allUrls);
            });
        }

        // 通用附件上传（用于"鉴定报告"等字段，支持图片/PDF）
        async function handleCommonFileUpload(input) {
            const files = Array.from(input.files || []);
            if (files.length === 0) return;
            const { valid, invalid } = validateFiles(files, 'imagePdf');
            if (invalid.length > 0) {
                alert('以下文件格式不允许：\n' + invalid.join('\n') + '\n\n允许上传：图片、PDF 文件。');
                return;
            }
            const wrap = input.closest('.file-upload-wrap');
            const urlInput = wrap.querySelector('.file-url-input');
            const current = projectFilesFromString(urlInput.value || '');
            const newFiles = [];
            for (const file of valid) {
                if (file.type.startsWith('image/')) {
                    try {
                        const url = await fileToDataUrl(file);
                        newFiles.push({ name: file.name, url: url, type: file.type, size: formatFileSize(file.size), uploadTime: formatDateTime(new Date()) });
                    } catch (e) { /* ignore */ }
                } else {
                    // 非图片文件仅存文件名，避免 dataURL 撑爆 localStorage
                    newFiles.push({ name: file.name, url: file.name, type: file.type, size: formatFileSize(file.size), uploadTime: formatDateTime(new Date()) });
                }
            }
            const all = current.concat(newFiles);
            urlInput.value = projectFilesToString(all);
            urlInput.dispatchEvent(new Event('input'));
            renderCommonFileList(wrap, all);
        }

        function parseCoord(str) {
            if (!str || str === '—' || str === '-') return null;
            const parts = str.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
            if (parts.length >= 2) return { lng: parts[0], lat: parts[1] };
            return null;
        }

        function initLocationMap() {
            loadLeaflet(() => {
                if (locationMap) {
                    setTimeout(() => { locationMap.invalidateSize(); }, 100);
                    return;
                }
                const defaultCenter = [30.920, 121.500];
                locationMap = L.map('locationMap').setView(defaultCenter, 13);
                L.tileLayer('https://map.geoq.cn/arcgis/rest/services/ChinaOnlineStreetPurplishBlue/MapServer/tile/{z}/{y}/{x}', { attribution: '© GeoQ', maxZoom: 18 }).addTo(locationMap);
                locationMap.on('click', function(e) {
                    setLocationMapMarker(e.latlng.lat, e.latlng.lng);
                });
            });
        }

        function setLocationMapMarker(lat, lng) {
            if (!locationMap) return;
            document.getElementById('mapPickerLat').value = lat.toFixed(6);
            document.getElementById('mapPickerLng').value = lng.toFixed(6);
            if (locationMapMarker) locationMap.removeLayer(locationMapMarker);
            locationMapMarker = L.marker([lat, lng]).addTo(locationMap);
            locationMap.setView([lat, lng], locationMap.getZoom() || 16);
        }

                    setTimeout(trySetMarker, 100);
                    return;
                }
                locationMap.invalidateSize();
                if (coord) {
                    setLocationMapMarker(coord.lat, coord.lng);
                } else {
                    document.getElementById('mapPickerLat').value = '';
                    document.getElementById('mapPickerLng').value = '';
                    if (locationMapMarker) locationMap.removeLayer(locationMapMarker);
                    locationMapMarker = null;
                }

        const ALLOWED_FILE_TYPES = [
            { ext: '.jpg', mime: 'image/jpeg' }, { ext: '.jpeg', mime: 'image/jpeg' },
            { ext: '.png', mime: 'image/png' }, { ext: '.gif', mime: 'image/gif' },
            { ext: '.bmp', mime: 'image/bmp' }, { ext: '.webp', mime: 'image/webp' },
            { ext: '.pdf', mime: 'application/pdf' },
            { ext: '.doc', mime: 'application/msword' }, { ext: '.docx', mime: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' },
            { ext: '.xls', mime: 'application/vnd.ms-excel' }, { ext: '.xlsx', mime: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' },
            { ext: '.dwg', mime: 'application/acad' }, { ext: '.dxf', mime: 'image/vnd.dxf' },
            { ext: '.zip', mime: 'application/zip' }, { ext: '.rar', mime: 'application/x-rar-compressed' }
        ];

        const ALLOWED_IMAGE_TYPES = ALLOWED_FILE_TYPES.filter(t => t.mime.startsWith('image/'));
        const ALLOWED_IMAGE_PDF_TYPES = ALLOWED_FILE_TYPES.filter(t => t.mime.startsWith('image/') || t.ext === '.pdf');

        let currentOrgSelectFor = null; // 'project'
        let selectedOrgId = '';
        let selectedExpertId = '';
        let editingTimelineNodeId = '';

        function getFileExtension(name) {
            if (!name) return '';
            const idx = name.lastIndexOf('.');
            return idx >= 0 ? name.slice(idx).toLowerCase() : '';
        }

        function isAllowedFile(file) {
            const ext = getFileExtension(file.name);
            return ALLOWED_FILE_TYPES.some(t => t.ext === ext);
        }

        function isAllowedImage(file) {
            const ext = getFileExtension(file.name);
            return ALLOWED_IMAGE_TYPES.some(t => t.ext === ext) || file.type.startsWith('image/');
        }

        function isAllowedImageOrPdf(file) {
            const ext = getFileExtension(file.name);
            return ALLOWED_IMAGE_PDF_TYPES.some(t => t.ext === ext) || file.type.startsWith('image/') || file.type === 'application/pdf';
        }

        function formatFileSize(bytes) {
            if (!bytes || bytes < 0) return '-';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function fileToDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = e => reject(e);
                reader.readAsDataURL(file);
            });
        }

        function validateFiles(files, mode) {
            const invalid = [];
            const valid = [];
            Array.from(files).forEach(f => {
                let ok = false;
                if (mode === 'image' || mode === true) ok = isAllowedImage(f);
                else if (mode === 'imagePdf') ok = isAllowedImageOrPdf(f);
                else ok = isAllowedFile(f);
                if (ok) {
                    valid.push(f);
                } else {
                    invalid.push(f.name);
                }
            });
            return { valid, invalid };
        }

        function projectFilesToString(files) {
            return files.map(f => f.url).filter(Boolean).join(',');
        }

        function projectFilesFromString(str) {
            if (!str || str === '—' || str === '-') return [];
            return str.split(',').map(s => s.trim()).filter(Boolean).map(url => ({
                name: url.split('/').pop() || url,
                url: url,
                type: getFileExtension(url),
                size: '', uploadTime: ''
            }));
        }

        // 通用批量文件上传（用于工程措施编辑表单）
        async function handleProjectFileUpload(input, fieldKey, acceptImages) {
            const files = Array.from(input.files || []);
            if (files.length === 0) return;
            const { valid, invalid } = validateFiles(files, acceptImages);
            if (invalid.length > 0) {
                alert('以下文件格式不允许：\n' + invalid.join('\n') + '\n\n允许上传：图片、PDF、Word、Excel、CAD、ZIP、RAR 等文件。');
                return;
            }
            const wrap = input.closest('.file-upload-wrap');
            const urlInput = wrap.querySelector('.file-url-input');
            const current = projectFilesFromString(urlInput.value || '');
            const newFiles = [];
            for (const file of valid) {
                if (acceptImages || file.type.startsWith('image/')) {
                    try {
                        const url = await fileToDataUrl(file);
                        newFiles.push({ name: file.name, url: url, type: file.type, size: formatFileSize(file.size), uploadTime: formatDateTime(new Date()) });
                    } catch (e) { /* ignore */ }
                } else {
                    newFiles.push({ name: file.name, url: file.name, type: file.type, size: formatFileSize(file.size), uploadTime: formatDateTime(new Date()) });
                }
            }
            const all = current.concat(newFiles);
            urlInput.value = projectFilesToString(all);
            urlInput.dispatchEvent(new Event('input'));
            renderProjectFileList(wrap, all, fieldKey, acceptImages);
        }

        function renderProjectFileList(wrap, files, fieldKey, acceptImages) {
            let list = wrap.querySelector('.project-file-list');
            if (!list) {
                list = document.createElement('div');
                list.className = 'project-file-list';
                wrap.appendChild(list);
            }
            if (!files || files.length === 0) {
                list.innerHTML = '';
                return;
            }
            list.innerHTML = '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px;">已上传 ' + files.length + ' 个文件</div>' + files.map((f, idx) => {
                const isImage = f.url && (f.url.startsWith('data:image') || f.url.startsWith('http') && /\.(jpg|jpeg|png|gif|bmp|webp)$/i.test(f.url));
                const icon = isImage ? 'fa-image' : 'fa-file';
                const preview = isImage ? ' onclick="viewPhotoOnline(\'' + escapeJsStr(f.url) + '\')" style="cursor:pointer;color:var(--primary);"' : ' style="color:var(--text-secondary);"';
                return '<div class="project-file-item">' +
                    '<i class="fas ' + icon + '"></i> ' +
                    '<span' + preview + '>' + escapeHtml(f.name || '附件') + ' <span style="color:#999;">(' + (f.size || '-') + ')</span></span>' +
                    '<button type="button" class="project-file-remove" onclick="removeProjectFile(this, \'' + fieldKey + '\', ' + idx + ')" title="删除"><i class="fas fa-times"></i></button>' +
                    '</div>';
            }).join('');
        }

        function removeProjectFile(btn, fieldKey, idx) {
            const wrap = btn.closest('.file-upload-wrap');
            const urlInput = wrap.querySelector('.file-url-input');

        async function handleTimelineNodePhotoUpload(input) {
            const files = Array.from(input.files || []);
            if (files.length === 0) return;
            const { valid, invalid } = validateFiles(files, true);
            if (invalid.length > 0) {
                alert('以下文件格式不允许：\n' + invalid.join('\n') + '\n\n仅允许上传图片。');
                return;
            }
            const urlInput = document.getElementById('timelineNodePhotos');
            const wrap = input.closest('.file-upload-wrap');
            const existing = urlInput.value.split(',').map(s => s.trim()).filter(Boolean);
            for (const file of valid) {
                try {
                    const url = await fileToDataUrl(file);
                    existing.push(url);
                    if (!window.__measureFileMeta) window.__measureFileMeta = {};
                    window.__measureFileMeta[url] = { name: file.name, size: file.size, type: file.type };
                } catch (e) { /* ignore */ }
            }
            const all = existing.filter((v, i, a) => a.indexOf(v) === i);
            urlInput.value = all.join(',');
            renderMeasureFileList(wrap, all);
        }

        async function handleTimelineNodeFileUpload(input) {
            const files = Array.from(input.files || []);
            if (files.length === 0) return;
            const { valid, invalid } = validateFiles(files, false);
            if (invalid.length > 0) {
                alert('以下文件格式不允许：\n' + invalid.join('\n') + '\n\n允许上传：图片、PDF、Word、Excel、CAD、ZIP、RAR 等文件。');
                return;
            }
            const urlInput = document.getElementById('timelineNodeAcceptFiles');
            const wrap = input.closest('.file-upload-wrap');
            const existing = urlInput.value.split(',').map(s => s.trim()).filter(Boolean);
            for (const file of valid) {
                if (file.type.startsWith('image/')) {
                    try {
                        const url = await fileToDataUrl(file);
                        existing.push(url);
                        if (!window.__measureFileMeta) window.__measureFileMeta = {};
                        window.__measureFileMeta[url] = { name: file.name, size: file.size, type: file.type };
                    } catch (e) { /* ignore */ }
                } else {
                    existing.push(file.name);
                    if (!window.__measureFileMeta) window.__measureFileMeta = {};
                    window.__measureFileMeta[file.name] = { name: file.name, size: file.size, type: file.type };
                }
            }
            const all = existing.filter((v, i, a) => a.indexOf(v) === i);
            urlInput.value = all.join(',');
            renderMeasureFileList(wrap, all);
        }

        function saveProjectTimelineNode() {
            const title = document.getElementById('timelineNodeTitle').value.trim();
            if (!title) {
                alert('请填写节点标题。');
                return;
            }
            const nodeDate = document.getElementById('timelineNodeDate').value;
            if (!nodeDate) {
                alert('请填写节点日期。');
                return;
            }
            const timeline = getMeasureData().project.timeline || [];
            const node = {
                nodeId: editingTimelineNodeId || ('NODE-' + Date.now() + '-' + Math.floor(Math.random() * 900 + 100)),
                title: title,
                nodeDate: nodeDate,
                description: document.getElementById('timelineNodeDesc').value.trim(),
                photos: document.getElementById('timelineNodePhotos').value.split(',').map(s => s.trim()).filter(Boolean),
                acceptRecord: {
                    conclusion: document.getElementById('timelineNodeAcceptConclusion').value,
                    checker: document.getElementById('timelineNodeAcceptChecker').value.trim(),
                    checkDate: document.getElementById('timelineNodeAcceptDate').value,
                    files: document.getElementById('timelineNodeAcceptFiles').value.split(',').map(s => s.trim()).filter(Boolean)
                }
            };
            const idx = timeline.findIndex(n => n.nodeId === editingTimelineNodeId);
            if (idx >= 0) timeline[idx] = node;
            else timeline.push(node);
            // 按日期排序
            timeline.sort((a, b) => a.nodeDate.localeCompare(b.nodeDate));
            getMeasureData().project.timeline = timeline;
            closeProjectTimelineNodeModal();
        }

        // =========================================================
        // 验收销号：申请与审核流程
        // =========================================================
        let closeAuditMode = true; // true = 通过, false = 驳回

        function openCloseApplyModal() {
            document.getElementById('closeApplyApplicant').value = currentHouseArch.managerName || '李志强';
            document.getElementById('closeApplyTime').value = formatDateTime(new Date()).split(' ')[0];
            document.getElementById('closeApplyRemark').value = '';
            document.getElementById('closeApplyFiles').value = '';
            const wrap = document.getElementById('closeApplyFilesWrap');
            // 清空文件列表
            const existList = wrap.querySelector('.measure-file-list');
            if (existList) existList.remove();
            document.getElementById('closeApplyModal').classList.add('open');
        }

        function closeCloseApplyModal() {
            document.getElementById('closeApplyModal').classList.remove('open');
        }

        async function handleCloseApplyPhotoUpload(input) {
            const files = Array.from(input.files || []);
            if (files.length === 0) return;
            const invalid = files.find(f => !f.type.startsWith('image/'));
            if (invalid) {
                alert('请上传图片文件');
                return;
            }
            const wrap = input.parentElement;
            const urlInput = wrap.querySelector('.file-url-input');
            const existingUrls = urlInput.value.split(',').map(s => s.trim()).filter(Boolean);
            const readers = files.map(file => {
                return new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = e => resolve({ url: e.target.result, name: file.name, size: file.size, type: file.type });
                    reader.readAsDataURL(file);
                });
            });
            Promise.all(readers).then(results => {
                if (!window.__measureFileMeta) window.__measureFileMeta = {};
                results.forEach(r => { window.__measureFileMeta[r.url] = { name: r.name, size: r.size, type: r.type }; });
                const allUrls = existingUrls.concat(results.map(r => r.url)).filter((v, i, a) => a.indexOf(v) === i);
                urlInput.value = allUrls.join(',');
                urlInput.dispatchEvent(new Event('input'));
                renderMeasureFileList(wrap, allUrls);
            });
        }

        function submitCloseApply() {
            const applicant = document.getElementById('closeApplyApplicant').value.trim() || '李志强';
            const applyTime = document.getElementById('closeApplyTime').value.trim() || formatDateTime(new Date());
            const remark = document.getElementById('closeApplyRemark').value.trim();
            const files = document.getElementById('closeApplyFiles').value.trim();
            // 材料完整性校验：至少要求整改后照片、验收报告、检测报告之一
            if (!files) {
                alert('请至少上传整改后照片、验收报告或检测报告等证明材料。');
                return;
            }
            if (!remark) {
                alert('请填写销号说明。');
                return;
            }
            const s = currentHouseArch;
            s.closeStatus = '待审核';
            s.closeApplyTime = applyTime;
            s.closeAuditTime = '';
            s.closeAuditor = '';
            s.closeAuditOpinion = '';
            s.closeRejectReason = '';
            s.governStatus = '已整治';
            s.risk = s.risk === 'safe' ? 'safe' : (RISK_LABEL_MAP_INV[s.riskLevel] || s.risk || 'warning');
            s.riskLevel = s.risk === 'safe' ? '第一类' : RISK_LABEL_MAP[s.risk] || s.riskLevel;
            saveCurrentHouseArch(s);
            // 同步到审核列表
            const closeData = getTableData().close;
            closeData.auditList = closeData.auditList || [];
            closeData.auditList.push({
                submitter: applicant,
                submitTime: applyTime,
                auditTime: '',
                auditor: '',
                conclusion: '待审核',
                report: files,
                remark: remark
            });
            // 若审核列表已被人工维护（closeAuditRecords 优先展示），同步追加，避免申请记录不可见
            if (Array.isArray(s.closeAuditRecords) && s.closeAuditRecords.length) {
                s.closeAuditRecords.push({
                    submitter: applicant, submitTime: applyTime, auditTime: '', auditor: '',
                    conclusion: '待审核', report: files, remark: remark
                });
                saveCurrentHouseArch(s);
            }
            // 同步至独立销号申请清单
            const applies = getCloseApplyStorage();
            const existing = applies.find(a => a.no === getCurrentHouseNo());
            if (existing) {
                existing.closeStatus = '待审核';
                existing.applicant = applicant;
                existing.applyTime = applyTime;
                existing.auditor = '';
                existing.auditTime = '';
                existing.auditOpinion = '';
                existing.rejectReason = '';
                existing.files = files;
            } else {
                applies.push({
                    id: generateCloseApplyId('CLOSE'),
                    no: getCurrentHouseNo(),
                    name: s.name || '—',
                    street: s.street || '—',
                    riskLevel: s.riskLevel || '—',
                    governStatus: s.governStatus || '—',
                    closeStatus: '待审核',
                    applicant: applicant,
                    applyTime: applyTime,
                    auditor: '',
                    auditTime: '',
                    auditOpinion: '',
                    rejectReason: '',
                    files: files
                });
            }
            setCloseApplyStorage(applies);
            archiveCloseRecord({
                archId: generateArchId('ARC'),
                type: '销号申请',
                closeTime: applyTime,
                closePerson: applicant,
                closeResult: '待审核',
                closeRemark: remark,
                files: files,
                saveTime: formatDateTime(new Date()),
                source: '验收销项-申请'
            });
            closeCloseApplyModal();
            renderSidebar();
            renderContent();
            alert('销号申请已提交，等待审核。');
        }

        function openCloseAuditModal(pass) {
            closeAuditMode = pass;
            document.getElementById('closeAuditTitle').innerHTML = pass ? '<i class="fas fa-check"></i> 通过销号申请' : '<i class="fas fa-times"></i> 驳回销号申请';
            document.getElementById('closeAuditConclusion').value = pass ? '通过' : '驳回';
            document.getElementById('closeAuditAuditor').value = '王建国';
            document.getElementById('closeAuditOpinionInput').value = '';
            document.getElementById('closeRejectReasonInput').value = '';
            document.getElementById('closeRejectReasonWrap').style.display = pass ? 'none' : 'block';
            document.getElementById('closeAuditModal').classList.add('open');
        }

        function closeCloseAuditModal() {
            document.getElementById('closeAuditModal').classList.remove('open');
        }

        function submitCloseAudit() {
            const conclusion = document.getElementById('closeAuditConclusion').value;
            const auditor = document.getElementById('closeAuditAuditor').value.trim() || '王建国';
            const opinion = document.getElementById('closeAuditOpinionInput').value.trim();
            const rejectReason = document.getElementById('closeRejectReasonInput').value.trim();
            if (!opinion) {
                alert('请填写审核意见。');
                return;
            }
            if (conclusion === '驳回' && !rejectReason) {
                alert('请填写驳回原因 / 整改要求。');
                return;
            }
            const s = currentHouseArch;
            const auditTime = formatDateTime(new Date());
            s.closeStatus = conclusion === '通过' ? '已通过' : '已驳回';
            s.closeAuditTime = auditTime;
            s.closeAuditor = auditor;
            s.closeAuditOpinion = opinion;
            s.closeRejectReason = rejectReason;
            if (conclusion === '通过') {
                s.governStatus = '已整治';
                s.riskLevel = '无风险';
                s.risk = 'safe';
                s.isRemovedFromFocus = true;
                // C：隐患独立销号（单一入口）——当前治理事件关联的隐患走 closeHazard，写销号动态+同步事件
                try {
                    const curEv = (s.governanceEvents || []).find(function(e){ return e.eventId === (window.currentGovEventId || s.currentGovernanceEventId); });
                    if (curEv && curEv.hazardId) {
                        closeHazard(s, curEv.hazardId, { auditor: auditor, auditTime: auditTime, opinion: opinion || '验收销项审核通过', source: '验收销项', auditId: curEv.eventId });
                    }
                } catch (e) { console.warn('隐患销号同步失败', e); }
            } else {
                s.risk = s.risk === 'safe' ? 'safe' : (RISK_LABEL_MAP_INV[s.riskLevel] || s.risk || 'warning');
                s.riskLevel = s.risk === 'safe' ? '第一类' : RISK_LABEL_MAP[s.risk] || s.riskLevel;
            }
            saveCurrentHouseArch(s);
            // 同步审核列表最后一条
            const closeData = getTableData().close;
            closeData.auditList = closeData.auditList || [];
            const last = closeData.auditList[closeData.auditList.length - 1];
            if (last) {
                last.auditTime = auditTime;
                last.auditor = auditor;
                last.conclusion = conclusion;
                last.remark = (opinion ? '审核意见：' + opinion : '') + (rejectReason ? '；驳回原因：' + rejectReason : '');
            }
            // 同步人工维护的审核列表（若存在，页面上优先展示它）
            if (Array.isArray(s.closeAuditRecords) && s.closeAuditRecords.length) {
                const last2 = s.closeAuditRecords[s.closeAuditRecords.length - 1];
                if (last2) {
                    last2.auditTime = auditTime;
                    last2.auditor = auditor;
                    last2.conclusion = conclusion;
                    last2.remark = (opinion ? '审核意见：' + opinion : '') + (rejectReason ? '；驳回原因：' + rejectReason : '');
                }
                saveCurrentHouseArch(s);
            }
            // 同步至独立销号申请清单
            const applies = getCloseApplyStorage();
            const existing = applies.find(a => a.no === getCurrentHouseNo());
            if (existing) {
                existing.closeStatus = conclusion === '通过' ? '已通过' : '已驳回';
                existing.auditor = auditor;
                existing.auditTime = auditTime;
                existing.auditOpinion = opinion;
                existing.rejectReason = conclusion === '驳回' ? rejectReason : '';
                if (conclusion === '通过') {
                    existing.governStatus = '已整治';
                    existing.risk = 'safe';
                    existing.riskLevel = '无风险';
                } else {
                    existing.risk = s.risk;
                    existing.riskLevel = s.riskLevel;
                }
            }
            setCloseApplyStorage(applies);
            archiveCloseRecord({
                archId: generateArchId('ARC'),
                type: '销号审核',
                closeTime: auditTime,
                closePerson: auditor,
                closeResult: conclusion === '通过' ? '已通过' : '已驳回',
                closeRemark: opinion + (rejectReason ? '；' + rejectReason : ''),
                saveTime: auditTime,
                source: '验收销项-审核'
            });
            closeCloseAuditModal();
            renderSidebar();
            renderContent();
            if (conclusion === '通过') {
                alert('销号审核已通过：房屋风险状态已更新为“已销号”，风险等级调整为“无风险”，并已退出重点监控名单。');
            } else {
                alert('销号申请已驳回：已记录驳回原因和整改要求，请申请人补充材料后重新提交。');
            }
        }

        document.getElementById('closeAuditConclusion').addEventListener('change', function() {
            document.getElementById('closeRejectReasonWrap').style.display = this.value === '驳回' ? 'block' : 'none';
        });

        document.getElementById('closeApplyModal').addEventListener('click', function(e) {
            if (e.target === this) closeCloseApplyModal();
        });

        document.getElementById('closeAuditModal').addEventListener('click', function(e) {
            if (e.target === this) closeCloseAuditModal();
        });

        // 原型演示：启动时先从服务端拉取最新档案（发布区+草稿区），再渲染
        function bootstrapRender() {
            syncHouseArchFromStatus();
            renderSidebar();
            renderContent();
        }
        if (typeof syncRuralHouseArchFromServer === 'function') {
            syncRuralHouseArchFromServer().then(bootstrapRender).catch(bootstrapRender);
        } else {
            bootstrapRender();
        }
    </script>
</body>
</html>
