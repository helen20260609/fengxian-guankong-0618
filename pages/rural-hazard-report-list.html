<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>农村自建房 - 专项风险隐患上报</title>
<link rel="stylesheet" href="./all.min.css">
<style>
:root {
    --primary: #1a73e8; --primary-dark: #1557b0; --primary-light: #e8f0fe;
    --secondary: #0097a7; --danger: #d93025; --warning: #e65100; --success: #1e8e3e;
    --bg-dark: #f0f2f5; --bg-card: #ffffff; --bg-hover: #e8eaed;
    --text-primary: #202124; --text-secondary: #5f6368; --border: #dadce0;
    --shadow: rgba(0,0,0,0.08); --input-bg: #ffffff; --input-border: #dadce0;
}
:root[data-theme="dark"] {
    --primary: #1e6fdb; --primary-dark: #1557b0; --primary-light: #e8f1fd;
    --secondary: #00b4d8; --danger: #ef4444; --warning: #f59e0b; --success: #10b981;
    --bg-dark: #0a1628; --bg-card: #112240; --bg-hover: #1a2f4a;
    --text-primary: #e2e8f0; --text-secondary: #94a3b8; --border: #1e3a5f;
    --shadow: rgba(0,0,0,0.3); --input-bg: rgba(255,255,255,0.05); --input-border: #1e3a5f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif; background: var(--bg-dark); color: var(--text-primary); font-size: 14px; min-height: 100vh; }

.page-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; background: var(--bg-card); padding: 18px 28px; border-bottom: 1px solid var(--border); }
.page-head h2 { font-size: 19px; display: flex; align-items: center; gap: 10px; }
.page-head h2 .fa-solid { color: var(--primary); }
.page-head .desc { margin-top: 6px; color: var(--text-secondary); font-size: 13px; }
.container { padding: 20px 28px; }
.inspector-box { display: flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; font-size: 13px; }
.inspector-box i { color: var(--primary); }
.inspector-box select { height: 30px; padding: 0 8px; border: 1px solid var(--input-border); border-radius: 6px; background: var(--input-bg); color: var(--text-primary); font-size: 13px; outline: none; }

/* KPI */
.kpi-wrapper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.kpi-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--kc, var(--primary)); }
.kpi-label { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.kpi-label i { color: var(--kc, var(--primary)); }
.kpi-value { font-size: 28px; font-weight: 700; margin-top: 8px; color: var(--kc, var(--text-primary)); }
.kpi-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* Tabs */
.status-tabs { display: flex; gap: 4px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 8px; margin-bottom: 16px; overflow-x: auto; }
.tab-item { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--text-secondary); cursor: pointer; white-space: nowrap; transition: all 0.2s; border: none; background: transparent; }
.tab-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.tab-item.active { background: var(--primary); color: #fff; }
.tab-count { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 11px; font-weight: 600; background: rgba(0,0,0,0.06); }
.tab-item.active .tab-count { background: rgba(255,255,255,0.2); }

/* Filter */
.filter-bar { display: flex; align-items: flex-end; gap: 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-item { display: flex; flex-direction: column; gap: 6px; }
.filter-item label { font-size: 12px; color: var(--text-secondary); }
.filter-select, .filter-input { height: 34px; padding: 0 10px; border: 1px solid var(--input-border); border-radius: 6px; background: var(--input-bg); color: var(--text-primary); font-size: 13px; outline: none; }
.filter-select:focus, .filter-input:focus { border-color: var(--primary); }
.btn { height: 34px; padding: 0 16px; border-radius: 6px; border: none; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-default { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
.btn-default:hover { background: var(--bg-hover); }

/* Table */
.table-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.table-wrapper { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { background: var(--bg-hover); padding: 11px 12px; text-align: left; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
.data-table td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.data-table tbody tr:hover { background: var(--bg-hover); }
.task-name { font-weight: 600; color: var(--text-primary); }
.task-no { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.type-tag { display: inline-flex; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; background: var(--primary-light); color: var(--primary); white-space: nowrap; }
.status-tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.status-tag.processing { background: rgba(26,115,232,0.12); color: var(--primary); }
.status-tag.pending { background: rgba(95,99,104,0.12); color: var(--text-secondary); }
.status-tag.pending-audit { background: rgba(230,81,0,0.12); color: var(--warning); }
.status-tag.completed { background: rgba(30,142,62,0.12); color: var(--success); }
.status-tag.rejected { background: rgba(217,48,37,0.12); color: var(--danger); }
.hz-badge { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
.hz-badge.red { color: var(--danger); }
.hz-badge.yellow { color: var(--warning); }
.hz-badge.zero { color: var(--text-secondary); font-weight: 400; }
.progress-wrap { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.progress-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--bg-hover); overflow: hidden; }
.progress-bar i { display: block; height: 100%; border-radius: 3px; background: var(--primary); transition: width 0.3s; }
.progress-txt { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.action-link { color: var(--primary); cursor: pointer; font-size: 13px; font-weight: 600; background: none; border: none; padding: 4px 6px; }
.action-link:hover { text-decoration: underline; }
.empty-state { padding: 60px 20px; text-align: center; color: var(--text-secondary); font-size: 13px; }
.empty-state i { font-size: 36px; margin-bottom: 10px; opacity: 0.4; }

.pagination-bar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); }
.page-info { font-size: 12px; color: var(--text-secondary); margin-right: auto; }
.page-btn { min-width: 30px; height: 30px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-card); color: var(--text-primary); cursor: pointer; font-size: 13px; }
.page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
</style>
</head>
<body>

<div class="page-head">
    <div>
        <h2><i class="fa-solid fa-file-pen"></i>自建房专项风险隐患上报</h2>
        <div class="desc">排查员工作台：查看本人负责的排查任务，在线录入房屋信息与风险排查情况，上报数据实时同步至预警中心与自建房风险档案</div>
    </div>
    <div class="inspector-box">
        <i class="fa-solid fa-user-hard-hat"></i>
        <span style="color:var(--text-secondary);">当前排查员</span>
        <select id="inspector-select"></select>
    </div>
</div>
<div class="container">

<!-- KPI -->
<div class="kpi-wrapper">
    <div class="kpi-card" style="--kc:var(--primary);">
        <div class="kpi-label"><i class="fa-solid fa-list-check"></i>我的任务</div>
        <div class="kpi-value" id="kpi-tasks">0</div>
        <div class="kpi-sub">分配给我的排查任务</div>
    </div>
    <div class="kpi-card" style="--kc:var(--warning);">
        <div class="kpi-label"><i class="fa-solid fa-house-circle-exclamation"></i>待上报房屋</div>
        <div class="kpi-value" id="kpi-todo">0</div>
        <div class="kpi-sub">尚未完成填报的房屋</div>
    </div>
    <div class="kpi-card" style="--kc:var(--success);">
        <div class="kpi-label"><i class="fa-solid fa-cloud-arrow-up"></i>已上报房屋</div>
        <div class="kpi-value" id="kpi-done">0</div>
        <div class="kpi-sub">已完成排查填报</div>
    </div>
    <div class="kpi-card" style="--kc:var(--danger);">
        <div class="kpi-label"><i class="fa-solid fa-triangle-exclamation"></i>发现隐患</div>
        <div class="kpi-value" id="kpi-hazards">0</div>
        <div class="kpi-sub">红/黄级隐患累计</div>
    </div>
</div>

<!-- Tabs -->
<div class="status-tabs" id="status-tabs">
    <button class="tab-item active" data-tab="all">全部 <span class="tab-count" id="cnt-all">0</span></button>
    <button class="tab-item" data-tab="processing">进行中 <span class="tab-count" id="cnt-processing">0</span></button>
    <button class="tab-item" data-tab="pending-audit">待审核 <span class="tab-count" id="cnt-pending-audit">0</span></button>
    <button class="tab-item" data-tab="completed">已完成 <span class="tab-count" id="cnt-completed">0</span></button>
</div>

<!-- Filter -->
<div class="filter-bar">
    <div class="filter-item">
        <label>镇/街道</label>
        <select class="filter-select" id="filter-town"><option value="">全部</option></select>
    </div>
    <div class="filter-item">
        <label>任务类型</label>
        <select class="filter-select" id="filter-type">
            <option value="">全部</option>
            <option value="routine">日常巡查</option>
            <option value="special">专项巡查</option>
            <option value="temporary">临时任务</option>
            <option value="review">复查任务</option>
        </select>
    </div>
    <div class="filter-item" style="flex:1;min-width:200px;">
        <label>关键字</label>
        <input type="text" class="filter-input" id="filter-keyword" placeholder="任务名称 / 编号 / 行政村">
    </div>
    <button class="btn btn-primary" id="btn-search"><i class="fa-solid fa-search"></i> 查询</button>
    <button class="btn btn-default" id="btn-reset"><i class="fa-solid fa-undo"></i> 重置</button>
</div>

<!-- Table -->
<div class="table-card">
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>任务名称</th>
                    <th>任务类型</th>
                    <th>镇/街道/行政村</th>
                    <th>排查员</th>
                    <th>上报进度</th>
                    <th>发现隐患</th>
                    <th>任务状态</th>
                    <th>截止时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="task-table-body"></tbody>
        </table>
    </div>
    <div class="pagination-bar">
        <span class="page-info" id="page-info">共 0 条，每页 10 条</span>
        <button class="page-btn" id="page-prev"><i class="fa-solid fa-chevron-left"></i></button>
        <span id="page-numbers"></span>
        <button class="page-btn" id="page-next"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
</div>
    </div>

    <script src="../js/house-arch-data.js"></script>
    <script src="rural-audit-seed.js"></script>
<script>
(function() {
    const PAGE_SIZE = 10;
    const INSPECTOR_KEY = 'rural-report-inspector';
    let allTasks = [];
    let filtered = [];
    let currentTab = 'all';
    let currentPage = 1;
    let currentInspector = '';

    // ===== 数据加载 =====
    function loadTasks() {
        let tasks = [];
        try { tasks = JSON.parse(localStorage.getItem('patrolTasks') || '[]'); } catch (e) { tasks = []; }
        return tasks;
    }

    // 房屋清单口径与审核页一致：优先 selectedProjects
    function taskHouses(t) {
        if (Array.isArray(t.selectedProjects) && t.selectedProjects.length) return t.selectedProjects;
        return [];
    }
    function taskTotal(t) {
        const h = taskHouses(t);
        return h.length || t.total || t.houseCount || (t.houseNos || []).length || 0;
    }
    function taskInspected(t) {
        const h = taskHouses(t);
        if (h.length) return h.filter(x => x.status === 'inspected').length;
        return t.inspected || 0;
    }
    function taskHazards(t) {
        const h = taskHouses(t);
        if (h.length) {
            let n = 0;
            h.forEach(x => (x.checkItems || []).forEach(it => { if (it.level === 'red' || it.level === 'yellow') n++; }));
            return n;
        }
        return t.hiddenCount || 0;
    }
    // 状态口径：被退回的任务回到"进行中"，需重新填报后再次提交审核
    function taskStatus(t) {
        if (t.status === 'pending-audit') return 'pending-audit';
        if (t.status === 'completed') return 'completed';
        return 'processing';
    }
    function statusTag(t) {
        const st = taskStatus(t);
        if (st === 'pending-audit') return '<span class="status-tag pending-audit">待审核</span>';
        if (st === 'completed') {
            if (t.auditResult && t.auditResult.result === '通过') return '<span class="status-tag completed">审核通过</span>';
            return '<span class="status-tag completed">已完成</span>';
        }
        if (t.auditResult && t.auditResult.result === '驳回') return '<span class="status-tag rejected">已退回·待整改</span>';
        return '<span class="status-tag processing">进行中</span>';
    }

    // ===== 排查员（模拟登录） =====
    function initInspector() {
        const persons = [...new Set(allTasks.map(t => t.person).filter(Boolean))];
        const sel = document.getElementById('inspector-select');
        sel.innerHTML = persons.map(p => `<option value="${p}">${p}</option>`).join('');
        const saved = localStorage.getItem(INSPECTOR_KEY);
        currentInspector = (saved && persons.includes(saved)) ? saved : (persons[0] || '');
        sel.value = currentInspector;
        sel.addEventListener('change', () => {
            currentInspector = sel.value;
            localStorage.setItem(INSPECTOR_KEY, currentInspector);
            currentPage = 1;
            applyFilters();
        });
    }

    // ===== KPI / Tabs =====
    function myTasks() { return allTasks.filter(t => !currentInspector || t.person === currentInspector); }
    function updateKpi() {
        const mine = myTasks();
        document.getElementById('kpi-tasks').textContent = mine.length;
        document.getElementById('kpi-todo').textContent = mine.reduce((s, t) => s + Math.max(taskTotal(t) - taskInspected(t), 0), 0);
        document.getElementById('kpi-done').textContent = mine.reduce((s, t) => s + taskInspected(t), 0);
        document.getElementById('kpi-hazards').textContent = mine.reduce((s, t) => s + taskHazards(t), 0);
    }
    function updateTabs() {
        const mine = myTasks();
        document.getElementById('cnt-all').textContent = mine.length;
        document.getElementById('cnt-processing').textContent = mine.filter(t => taskStatus(t) === 'processing').length;
        document.getElementById('cnt-pending-audit').textContent = mine.filter(t => taskStatus(t) === 'pending-audit').length;
        document.getElementById('cnt-completed').textContent = mine.filter(t => taskStatus(t) === 'completed').length;
    }

    // ===== 筛选 =====
    function applyFilters() {
        const town = document.getElementById('filter-town').value;
        const type = document.getElementById('filter-type').value;
        const kw = document.getElementById('filter-keyword').value.trim();
        filtered = myTasks().filter(t => {
            if (currentTab !== 'all' && taskStatus(t) !== currentTab) return false;
            if (town && t.town !== town) return false;
            if (type && t.type !== type) return false;
            if (kw && !((t.name || '').includes(kw) || (t.no || '').includes(kw) || (t.village || '').includes(kw))) return false;
            return true;
        });
        filtered.sort((a, b) => (b.startDate || '').localeCompare(a.startDate || ''));
        updateKpi();
        updateTabs();
        renderTable();
    }

    // ===== 渲染 =====
    function hazardCell(t) {
        const n = taskHazards(t);
        if (!n) return '<span class="hz-badge zero">0</span>';
        const h = taskHouses(t);
        let red = 0;
        h.forEach(x => (x.checkItems || []).forEach(it => { if (it.level === 'red') red++; }));
        const cls = red > 0 ? 'red' : 'yellow';
        return `<span class="hz-badge ${cls}"><i class="fa-solid fa-triangle-exclamation"></i>${n} 条</span>`;
    }
    function renderTable() {
        const tbody = document.getElementById('task-table-body');
        const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        const rows = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
        if (!rows.length) {
            tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><i class="fa-solid fa-inbox"></i><div>暂无符合条件的排查任务</div></div></td></tr>`;
        } else {
            tbody.innerHTML = rows.map(t => {
                const total = taskTotal(t), done = taskInspected(t);
                const pct = total ? Math.round(done / total * 100) : 0;
                const st = taskStatus(t);
                const actionable = st === 'processing';
                const btnText = actionable ? '进入填报' : '查看';
                return `<tr>
                    <td><div class="task-name">${t.name || '-'}</div><div class="task-no">${t.no || ''}</div></td>
                    <td><span class="type-tag">${t.typeLabel || '-'}</span></td>
                    <td>${t.town || '-'}${t.village ? ' / ' + t.village : ''}</td>
                    <td>${t.person || '-'}</td>
                    <td><div class="progress-wrap"><div class="progress-bar"><i style="width:${pct}%"></i></div><span class="progress-txt">${done}/${total}</span></div></td>
                    <td>${hazardCell(t)}</td>
                    <td>${statusTag(t)}</td>
                    <td>${t.endDate || '-'}</td>
                    <td><button class="action-link" data-id="${t.id}">${btnText}</button></td>
                </tr>`;
            }).join('');
            tbody.querySelectorAll('.action-link').forEach(b => {
                b.addEventListener('click', () => {
                    window.location.href = 'rural-risk-task-detail.html?id=' + b.dataset.id + '&from=report';
                });
            });
        }
        renderPagination(totalPages);
    }
    function renderPagination(totalPages) {
        document.getElementById('page-info').textContent = `共 ${filtered.length} 条，每页 ${PAGE_SIZE} 条`;
        const pn = document.getElementById('page-numbers');
        let html = '';
        for (let i = 1; i <= totalPages; i++) html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
        pn.innerHTML = html;
        pn.querySelectorAll('.page-btn').forEach(b => b.addEventListener('click', () => { currentPage = Number(b.dataset.page); renderTable(); }));
        document.getElementById('page-prev').disabled = currentPage <= 1;
        document.getElementById('page-next').disabled = currentPage >= totalPages;
    }

    // ===== 事件 =====
    function initFilters() {
        const towns = [...new Set(allTasks.map(t => t.town).filter(Boolean))];
        const townSel = document.getElementById('filter-town');
        towns.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; townSel.appendChild(o); });
        document.getElementById('btn-search').addEventListener('click', () => { currentPage = 1; applyFilters(); });
        document.getElementById('btn-reset').addEventListener('click', () => {
            townSel.value = ''; document.getElementById('filter-type').value = ''; document.getElementById('filter-keyword').value = '';
            currentPage = 1; applyFilters();
        });
        document.getElementById('filter-keyword').addEventListener('keydown', e => { if (e.key === 'Enter') { currentPage = 1; applyFilters(); } });
        document.getElementById('status-tabs').addEventListener('click', e => {
            const btn = e.target.closest('.tab-item');
            if (!btn) return;
            document.querySelectorAll('#status-tabs .tab-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentTab = btn.dataset.tab;
            currentPage = 1;
            applyFilters();
        });
        document.getElementById('page-prev').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderTable(); } });
        document.getElementById('page-next').addEventListener('click', () => { currentPage++; renderTable(); });
    }

    // ===== 初始化 =====
    allTasks = loadTasks();
    initInspector();
    initFilters();
    applyFilters();
})();
</script>
</body>
</html>
