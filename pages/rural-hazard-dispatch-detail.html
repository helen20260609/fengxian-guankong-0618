<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>农村自建房 - 任务包分发详情</title>
<link rel="stylesheet" href="./all.min.css">
<link rel="stylesheet" href="./ui-modal.css">
<style>
:root {
    --primary: #1a73e8; --primary-dark: #1557b0; --success: #188038; --warning: #e37400; --danger: #d93025;
    --bg-page: #f1f3f4; --bg-card: #ffffff; --text-main: #202124; --text-sub: #5f6368; --border: #e0e0e0;
}
[data-theme="dark"] {
    --bg-page: #121416; --bg-card: #1e2126; --text-main: #e8eaed; --text-sub: #9aa0a6; --border: #3c4043;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-page); color: var(--text-main); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; }
.page-head { background: var(--bg-card); padding: 16px 28px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.page-head h2 { font-size: 19px; display: flex; align-items: center; gap: 10px; }
.page-head h2 .fa-solid { color: var(--primary); }
.btn { height: 34px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.btn-primary:hover { background: var(--primary-dark); }
.btn.btn-lg { height: 42px; padding: 0 28px; font-size: 15px; }
.container { padding: 20px 28px; max-width: 1280px; margin: 0 auto; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 18px; overflow: hidden; }
.card-head { padding: 14px 20px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card-head .fa-solid { color: var(--primary); }
.card-body { padding: 18px 20px; }
.info-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.info-item .lbl { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
.info-item .val { font-size: 14px; font-weight: 600; }
.status-tag { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 12px; white-space: nowrap; }
.status-tag.pending { background: rgba(227,116,0,0.1); color: var(--warning); }
.status-tag.doing { background: rgba(26,115,232,0.1); color: var(--primary); }
.status-tag.done { background: rgba(24,128,56,0.1); color: var(--success); }
.status-tag.wait-accept { background: rgba(95,99,104,0.12); color: var(--text-sub); }
.dist-badge { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 10px; font-size: 12px; }
.dist-badge.red { background: rgba(217,48,37,0.1); color: var(--danger); }
.dist-badge.yellow { background: rgba(227,116,0,0.1); color: var(--warning); }
.form-row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
.form-item { display: flex; flex-direction: column; gap: 6px; }
.form-item label { font-size: 13px; color: var(--text-sub); }
.form-item label b { color: var(--danger); }
.radio-group { display: flex; gap: 14px; }
.radio-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 18px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; background: var(--bg-card); }
.radio-card.active { border-color: var(--primary); background: rgba(26,115,232,0.06); color: var(--primary); font-weight: 600; }
select, input[type="text"], input[type="date"], textarea { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 13px; background: var(--bg-card); color: var(--text-main); font-family: inherit; }
textarea { width: 100%; min-height: 72px; resize: vertical; }
.sub-table { width: 100%; border-collapse: collapse; }
.sub-table th { background: rgba(26,115,232,0.05); color: var(--text-sub); font-size: 12px; padding: 10px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
.sub-table td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
.sub-table select, .sub-table input { width: 100%; min-width: 96px; height: 32px; }
.sub-houses { color: var(--text-sub); font-size: 12px; line-height: 1.6; }
.dispatch-bar { position: sticky; bottom: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -2px 12px rgba(0,0,0,0.06); }
.dispatch-summary { color: var(--text-sub); font-size: 13px; }
.dispatch-summary b { color: var(--primary); }
.progress-big { height: 10px; border-radius: 5px; background: var(--border); overflow: hidden; margin: 10px 0 6px; }
.progress-big i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--success)); border-radius: 5px; }
.tree { padding: 4px 0; }
.tree-node { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.tree-node .node-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.tree-node.lvl-0 .node-icon { background: rgba(26,115,232,0.12); color: var(--primary); }
.tree-node.lvl-1 .node-icon { background: rgba(227,116,0,0.12); color: var(--warning); }
.tree-node.lvl-2 .node-icon { background: rgba(24,128,56,0.12); color: var(--success); }
.tree-node.lvl-1 { padding-left: 36px; position: relative; }
.tree-node.lvl-2 { padding-left: 72px; position: relative; }
.tree-node.lvl-1::before, .tree-node.lvl-2::before { content: ''; position: absolute; left: 14px; top: 0; bottom: 50%; width: 1px; background: var(--border); }
.tree-node .node-name { font-weight: 600; }
.tree-node .node-sub { color: var(--text-sub); font-size: 12px; }
.house-chip { display: inline-block; background: rgba(26,115,232,0.07); border-radius: 4px; padding: 1px 7px; margin: 1px 3px 1px 0; font-size: 12px; color: var(--text-main); }
</style>
</head>
<body>
<div class="page-head">
    <h2><i class="fa-solid fa-share-from-square"></i><span id="page-title">任务包分发</span></h2>
    <button class="btn" onclick="window.location.href='rural-hazard-dispatch-list.html'"><i class="fa-solid fa-arrow-left"></i>返回列表</button>
</div>
<div class="container">
    <!-- 任务包信息 -->
    <div class="card">
        <div class="card-head"><i class="fa-solid fa-box-open"></i>任务包信息</div>
        <div class="card-body">
            <div class="info-grid" id="pkg-info"></div>
        </div>
    </div>

    <!-- 未分发：下发设置 -->
    <div class="card" id="send-card">
        <div class="card-head"><i class="fa-solid fa-paper-plane"></i>一键下发设置</div>
        <div class="card-body">
            <div class="form-row">
                <div class="form-item">
                    <label><b>*</b> 接收单位层级</label>
                    <div class="radio-group" id="receiver-type">
                        <div class="radio-card active" data-v="town"><i class="fa-solid fa-building"></i>乡镇政府</div>
                        <div class="radio-card" data-v="village"><i class="fa-solid fa-house-chimney"></i>村委会</div>
                    </div>
                </div>
                <div class="form-item" style="min-width:240px;">
                    <label><b>*</b> 接收单位</label>
                    <select id="receiver-name" style="height:38px;"></select>
                </div>
            </div>
            <div class="form-item">
                <label><b>*</b> 总体处置要求</label>
                <textarea id="requirement" placeholder="填写本次隐患整治的总体要求，如处置原则、安全注意事项、总体时限等...">请接收单位按子任务分解组织整治：第三类（严重安全隐患）房屋立即采取人员撤离等管控措施，15日内确定整治方案；第二类（一定安全隐患）房屋30日内完成整治。整治过程注意施工安全，完成后及时提交验收。</textarea>
            </div>
        </div>
    </div>

    <!-- 未分发：任务分解 -->
    <div class="card" id="split-card">
        <div class="card-head"><i class="fa-solid fa-code-branch"></i>任务分解（子任务推送至具体责任人）</div>
        <div class="card-body">
            <div class="form-row">
                <div class="form-item">
                    <label>分解方式</label>
                    <div class="radio-group" id="split-mode">
                        <div class="radio-card active" data-v="owner"><i class="fa-solid fa-user"></i>按户主分解（每栋隐患房屋一个子任务）</div>
                        <div class="radio-card" data-v="area"><i class="fa-solid fa-layer-group"></i>按片区合并（同一片区房屋合并子任务）</div>
                    </div>
                </div>
            </div>
            <table class="sub-table">
                <thead>
                    <tr>
                        <th style="width:200px;">子任务名称</th>
                        <th>覆盖房屋</th>
                        <th style="width:110px;">责任人角色</th>
                        <th style="width:130px;">责任人</th>
                        <th style="width:150px;">处置方式</th>
                        <th style="width:140px;">完成时限</th>
                    </tr>
                </thead>
                <tbody id="sub-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- 已分发：跟踪视图 -->
    <div class="card" id="track-card" style="display:none;">
        <div class="card-head"><i class="fa-solid fa-route"></i>任务跟踪</div>
        <div class="card-body">
            <div class="info-grid" id="track-info" style="margin-bottom:18px;"></div>
            <div style="font-size:13px;color:var(--text-sub);">总体进度</div>
            <div class="progress-big"><i id="track-progress" style="width:0%"></i></div>
            <div style="font-size:12px;color:var(--text-sub);margin-bottom:16px;" id="track-progress-text"></div>
            <div style="font-size:13px;font-weight:600;margin-bottom:6px;">逐级下发情况</div>
            <div class="tree" id="track-tree"></div>
        </div>
    </div>
    <div class="card" id="sub-list-card" style="display:none;">
        <div class="card-head"><i class="fa-solid fa-list-check"></i>子任务清单</div>
        <div class="card-body" style="padding:0;">
            <table class="sub-table">
                <thead>
                    <tr>
                        <th>子任务名称</th>
                        <th>覆盖房屋</th>
                        <th>责任人</th>
                        <th>处置方式</th>
                        <th>完成时限</th>
                        <th>状态</th>
                        <th>最近更新</th>
                    </tr>
                </thead>
                <tbody id="track-tbody"></tbody>
            </table>
        </div>
    </div>

    <!-- 未分发：底部操作条 -->
    <div class="dispatch-bar" id="dispatch-bar">
        <div class="dispatch-summary" id="dispatch-summary"></div>
        <button class="btn btn-primary btn-lg" onclick="confirmDispatch()"><i class="fa-solid fa-paper-plane"></i>确认下发</button>
    </div>
</div>
<script src="./ui-modal.js"></script>
<script src="../js/house-arch-data.js"></script>
<script src="./rural-audit-seed.js"></script>
<script>
const HANDLE_METHODS = ['危房改造申请', '临时搬离', '简易加固', '专业加固', '拆除重建'];
const ROLE_NAMES = ['村支书', '网格员', '户主'];
const VILLAGE_STAFF = {
    '桃园村': { '村支书': '王卫国', '网格员': '张蕾' },
    '洪庙村': { '村支书': '陈永强', '网格员': '吴敏' }
};
let task = null;
let pkg = null;
let subTasks = [];   // 编辑态子任务
let receiverType = 'town';
let splitMode = 'owner';

function getParam(n) { return new URLSearchParams(location.search).get(n); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function todayPlus(days) {
    const d = new Date(); d.setDate(d.getDate() + days);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function nowStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
        + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function loadPackages() { try { return JSON.parse(localStorage.getItem('hazardDispatchPackages') || '{}'); } catch (e) { return {}; } }
function savePackages(p) { localStorage.setItem('hazardDispatchPackages', JSON.stringify(p)); }

// 入库隐患房屋：红/黄检查项 且未被审核排除
function dispatchHouses() {
    const excluded = task.excludedHouses || [];
    const src = (Array.isArray(task.selectedProjects) && task.selectedProjects.length) ? task.selectedProjects
        : (task.houseNos || []).map(no => getHouseRecord(no)).filter(Boolean);
    return src.filter(h => !excluded.includes(h.houseNo))
        .map(h => ({ house: h, hazards: (h.checkItems || []).filter(ci => ci.level === 'red' || ci.level === 'yellow') }))
        .filter(x => x.hazards.length > 0);
}
function areaOf(house) {
    const m = (house.address || '').match(new RegExp((task.village || '') + '([^0-9号]+)'));
    return m ? m[1] : (task.village || '默认片区');
}
function maxLevel(hazards) { return hazards.some(h => h.level === 'red') ? 'red' : 'yellow'; }

function buildSubTasks() {
    const items = dispatchHouses();
    subTasks = [];
    if (splitMode === 'owner') {
        items.forEach((x, i) => {
            const lv = maxLevel(x.hazards);
            subTasks.push({
                id: 'ST-' + task.id + '-' + (i + 1),
                name: (x.house.name || x.house.houseNo) + '隐患整治',
                houseNos: [x.house.houseNo],
                houseNames: [x.house.name || x.house.houseNo],
                ownerName: x.house.name || '',
                ownerPerson: x.house.owner || '',
                role: '户主',
                person: x.house.owner || '',
                method: lv === 'red' ? '专业加固' : '简易加固',
                deadline: todayPlus(lv === 'red' ? 15 : 30),
                status: '待接收'
            });
        });
    } else {
        const groups = {};
        items.forEach(x => {
            const a = areaOf(x.house);
            if (!groups[a]) groups[a] = [];
            groups[a].push(x);
        });
        Object.keys(groups).forEach((a, i) => {
            const list = groups[a];
            const lv = list.some(x => maxLevel(x.hazards) === 'red') ? 'red' : 'yellow';
            subTasks.push({
                id: 'ST-' + task.id + '-' + (i + 1),
                name: task.village + a + '片区隐患整治（' + list.length + '栋）',
                houseNos: list.map(x => x.house.houseNo),
                houseNames: list.map(x => x.house.name || x.house.houseNo),
                ownerName: a + '片区',
                ownerPerson: '',
                role: '网格员',
                person: (VILLAGE_STAFF[task.village] || {})['网格员'] || '',
                method: lv === 'red' ? '专业加固' : '简易加固',
                deadline: todayPlus(lv === 'red' ? 15 : 30),
                status: '待接收'
            });
        });
    }
    renderSubTable();
    renderSummary();
}

function renderSubTable() {
    const staff = VILLAGE_STAFF[task.village] || {};
    document.getElementById('sub-tbody').innerHTML = subTasks.map((s, i) => `<tr>
        <td><input type="text" value="${esc(s.name)}" onchange="subTasks[${i}].name=this.value;renderSummary();"></td>
        <td><div class="sub-houses">${s.houseNames.map(n => `<span class="house-chip">${esc(n)}</span>`).join('')}</div></td>
        <td><select onchange="subTasks[${i}].role=this.value;onRoleChange(${i});">
            ${ROLE_NAMES.map(r => `<option ${r === s.role ? 'selected' : ''}>${r}</option>`).join('')}
        </select></td>
        <td><input type="text" value="${esc(s.person)}" placeholder="责任人姓名" onchange="subTasks[${i}].person=this.value;"></td>
        <td><select onchange="subTasks[${i}].method=this.value;">
            ${HANDLE_METHODS.map(m => `<option ${m === s.method ? 'selected' : ''}>${m}</option>`).join('')}
        </select></td>
        <td><input type="date" value="${s.deadline}" onchange="subTasks[${i}].deadline=this.value;"></td>
    </tr>`).join('');
}
function onRoleChange(i) {
    const staff = VILLAGE_STAFF[task.village] || {};
    const s = subTasks[i];
    if (s.role === '户主') s.person = s.ownerPerson || '';
    else if (staff[s.role]) s.person = staff[s.role];
    renderSubTable();
}

function renderSummary() {
    const houses = subTasks.reduce((n, s) => n + s.houseNos.length, 0);
    document.getElementById('dispatch-summary').innerHTML =
        `本次将下发 <b>${subTasks.length}</b> 个子任务，覆盖 <b>${houses}</b> 栋隐患房屋；主任务发送至 <b>${esc(document.getElementById('receiver-name').value || '接收单位')}</b>，子任务同步推送至各责任人。`;
}

function renderReceiverOptions() {
    const sel = document.getElementById('receiver-name');
    sel.innerHTML = receiverType === 'town'
        ? `<option>${esc(task.town)}政府（${esc(task.town)}自建房整治专班）</option>`
        : `<option>${esc(task.village)}村民委员会</option>`;
    renderSummary();
}

async function confirmDispatch() {
    const receiver = document.getElementById('receiver-name').value;
    const req = document.getElementById('requirement').value.trim();
    if (!req) { alert('请填写总体处置要求'); return; }
    if (!subTasks.length) { alert('无可下发的隐患房屋子任务'); return; }
    const noPerson = subTasks.find(s => !s.person.trim());
    if (noPerson) { alert(`子任务「${noPerson.name}」未指定责任人`); return; }
    const houses = subTasks.reduce((n, s) => n + s.houseNos.length, 0);
    const msg = `分发确认：\n· 主任务发送至：${receiver}\n· 子任务 ${subTasks.length} 个（覆盖 ${houses} 栋隐患房屋），同步推送至各责任人\n· 总体处置要求已随任务包下发\n\n确定下发吗？`;
    const ok = await uiConfirm(msg, { title: '确认下发' });
    if (!ok) return;
    const all = loadPackages();
    all[task.id] = {
        taskId: task.id,
        receiverType,
        receiverName: receiver,
        requirement: req,
        dispatcher: '区房管局分发员',
        dispatchTime: nowStr(),
        subTasks: subTasks.map(s => ({ ...s, status: '待接收', updates: [{ time: nowStr(), text: '任务已下发至' + s.role + ' ' + s.person }] }))
    };
    savePackages(all);
    // 联动：隐患台账状态 → 处置中（子任务进入处置流转，等待责任人接收）
    syncHazardStatus('处置中');
    alert('下发成功：主任务已发送至 ' + receiver + '，' + subTasks.length + ' 个子任务已推送责任人');
    location.reload();
}

// 分发/处置/验收联动：更新档案中该任务已通过隐患的分发状态
function syncHazardStatus(flowStatus) {
    const arch = getAllHouseRecords();
    Object.keys(arch).forEach(no => {
        const rec = arch[no];
        if (!Array.isArray(rec.hazards)) return;
        let changed = false;
        rec.hazards.forEach(h => {
            if (h._taskId === String(task.id) && h.auditState === '已通过') { h.flowStatus = flowStatus; changed = true; }
        });
        if (changed) setHouseRecord(no, rec);
    });
}

function renderPkgInfo() {
    const items = dispatchHouses();
    const red = items.reduce((n, x) => n + x.hazards.filter(h => h.level === 'red').length, 0);
    const yellow = items.reduce((n, x) => n + x.hazards.filter(h => h.level === 'yellow').length, 0);
    const excluded = (task.excludedHouses || []).length;
    document.getElementById('pkg-info').innerHTML = `
        <div class="info-item"><div class="lbl">来源排查任务</div><div class="val">${esc(task.name)}</div></div>
        <div class="info-item"><div class="lbl">乡镇 / 行政村</div><div class="val">${esc(task.town)} / ${esc(task.village)}</div></div>
        <div class="info-item"><div class="lbl">审核结论</div><div class="val"><span class="status-tag done">审核通过</span></div></div>
        <div class="info-item"><div class="lbl">审核时间 / 审核人</div><div class="val" style="font-size:13px;">${esc(task.auditResult.time || '-')}<br>${esc(task.auditResult.auditor || '-')}</div></div>
        <div class="info-item"><div class="lbl">入库隐患</div><div class="val">
            ${red ? `<span class="dist-badge red">第三类 ${red}</span> ` : ''}${yellow ? `<span class="dist-badge yellow">第二类 ${yellow}</span>` : ''}
        </div></div>
        <div class="info-item"><div class="lbl">涉及隐患房屋</div><div class="val">${items.length} 栋</div></div>
        <div class="info-item"><div class="lbl">审核排除房屋</div><div class="val">${excluded} 栋</div></div>
        <div class="info-item"><div class="lbl">审核意见</div><div class="val" style="font-size:13px;font-weight:400;">${esc(task.auditResult.opinion || '无')}</div></div>`;
}

function renderTrack() {
    const p = pkg;
    document.getElementById('page-title').textContent = '任务跟踪 - ' + task.name;
    const subs = p.subTasks || [];
    const done = subs.filter(s => s.status === '已完成').length;
    const pct = subs.length ? Math.round(done / subs.length * 100) : 0;
    document.getElementById('track-info').innerHTML = `
        <div class="info-item"><div class="lbl">接收单位</div><div class="val">${esc(p.receiverName)}</div></div>
        <div class="info-item"><div class="lbl">下发人 / 时间</div><div class="val" style="font-size:13px;">${esc(p.dispatcher)}<br>${esc(p.dispatchTime)}</div></div>
        <div class="info-item"><div class="lbl">子任务进度</div><div class="val">${done} / ${subs.length} 完成</div></div>
        <div class="info-item"><div class="lbl">总体处置要求</div><div class="val" style="font-size:12px;font-weight:400;line-height:1.6;">${esc(p.requirement)}</div></div>`;
    document.getElementById('track-progress').style.width = pct + '%';
    document.getElementById('track-progress-text').textContent = `完成率 ${pct}%（${done}/${subs.length} 个子任务已完成验收）`;
    // 逐级树：主任务 → 接收单位 → 各责任人
    let tree = `
        <div class="tree-node lvl-0"><div class="node-icon"><i class="fa-solid fa-building-shield"></i></div>
            <div><span class="node-name">区房管局</span> <span class="node-sub">· 主任务下发（${esc(p.dispatchTime)}）</span></div></div>
        <div class="tree-node lvl-1"><div class="node-icon"><i class="fa-solid fa-building"></i></div>
            <div><span class="node-name">${esc(p.receiverName)}</span> <span class="node-sub">· 已接收，分解 ${subs.length} 个子任务</span></div></div>`;
    subs.forEach(s => {
        const stCls = { '待接收': 'wait-accept', '处置中': 'doing', '待验收': 'pending', '已完成': 'done' }[s.status] || 'wait-accept';
        tree += `<div class="tree-node lvl-2"><div class="node-icon"><i class="fa-solid fa-user"></i></div>
            <div><span class="node-name">${esc(s.person)}（${esc(s.role)}）</span> <span class="node-sub">· ${esc(s.name)} · ${esc(s.method)} · 时限 ${esc(s.deadline)}</span>
            <span class="status-tag ${stCls}" style="margin-left:8px;">${esc(s.status)}</span></div></div>`;
    });
    document.getElementById('track-tree').innerHTML = tree;
    document.getElementById('track-tbody').innerHTML = subs.map(s => {
        const stCls = { '待接收': 'wait-accept', '处置中': 'doing', '待验收': 'pending', '已完成': 'done' }[s.status] || 'wait-accept';
        const last = (s.updates && s.updates.length) ? s.updates[s.updates.length - 1] : null;
        return `<tr>
            <td style="font-weight:600;">${esc(s.name)}</td>
            <td><div class="sub-houses">${s.houseNames.map(n => `<span class="house-chip">${esc(n)}</span>`).join('')}</div></td>
            <td>${esc(s.person)}<div class="sub-houses">${esc(s.role)}</div></td>
            <td>${esc(s.method)}</td>
            <td>${esc(s.deadline)}</td>
            <td><span class="status-tag ${stCls}">${esc(s.status)}</span></td>
            <td class="sub-houses">${last ? esc(last.time) + '<br>' + esc(last.text) : '-'}</td>
        </tr>`;
    }).join('');
}

function init() {
    initHouseArchSeed();
    ensureAuditSeedTasks();
    const id = Number(getParam('id'));
    const all = JSON.parse(localStorage.getItem('patrolTasks') || '[]');
    task = all.find(t => t.id === id);
    if (!task) { alert('任务不存在'); history.back(); return; }
    pkg = loadPackages()[task.id];
    renderPkgInfo();
    if (pkg) {
        document.getElementById('send-card').style.display = 'none';
        document.getElementById('split-card').style.display = 'none';
        document.getElementById('dispatch-bar').style.display = 'none';
        document.getElementById('track-card').style.display = 'block';
        document.getElementById('sub-list-card').style.display = 'block';
        renderTrack();
    } else {
        document.getElementById('page-title').textContent = '一键下发 - ' + task.name;
        document.querySelectorAll('#receiver-type .radio-card').forEach(el => el.addEventListener('click', () => {
            document.querySelectorAll('#receiver-type .radio-card').forEach(x => x.classList.remove('active'));
            el.classList.add('active');
            receiverType = el.dataset.v;
            renderReceiverOptions();
        }));
        document.querySelectorAll('#split-mode .radio-card').forEach(el => el.addEventListener('click', () => {
            document.querySelectorAll('#split-mode .radio-card').forEach(x => x.classList.remove('active'));
            el.classList.add('active');
            splitMode = el.dataset.v;
            buildSubTasks();
        }));
        document.getElementById('receiver-name').addEventListener('change', renderSummary);
        document.getElementById('requirement').addEventListener('input', renderSummary);
        renderReceiverOptions();
        buildSubTasks();
    }
}
init();
</script>
</body>
</html>
