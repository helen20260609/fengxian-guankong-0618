<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排查详情 - 农房回头看</title>
<link rel="stylesheet" href="./all.min.css">
<link rel="stylesheet" href="./leaflet.css">
<style>
:root {
    --primary: #1a73e8; --primary-dark: #1557b0; --primary-light: #e8f0fe;
    --secondary: #0097a7; --danger: #d93025; --warning: #f9ab00; --success: #1e8e3e;
    --bg-dark: #f0f2f5; --bg-card: #ffffff; --bg-hover: #e8eaed;
    --text-primary: #202124; --text-secondary: #5f6368; --border: #dadce0;
    --shadow: rgba(0,0,0,0.08); --input-bg: #ffffff; --input-border: #dadce0;
}
:root[data-theme="dark"] {
    --primary: #1e6fdb; --primary-dark: #1557b0; --primary-light: #e8f1fd;
    --secondary: #00b4d8; --danger: #ef4444; --warning: #f59e0b; --success: #10b981;
    --bg-dark: #0a1628; --bg-card: #112240; --bg-hover: #1a2f4a;
    --text-primary: #e2e8f0; --text-secondary: #94a3b8; --border: #1e3a5f;
    --shadow: rgba(0,0,0,0.3); --input-bg: rgba(255,255,255,0.05); --input-border: #1e3a5f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif;
    background: var(--bg-dark); color: var(--text-primary); min-height: 100vh;
}

/* ===== 顶栏（吸顶） ===== */
.page-header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 14px 24px; background: var(--bg-card);
    border-bottom: 1px solid var(--border); box-shadow: 0 1px 3px var(--shadow);
}
.ph-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.btn-back {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg-card); color: var(--text-primary); font-size: 13px; cursor: pointer; transition: all .2s;
}
.btn-back:hover { background: var(--bg-hover); border-color: var(--primary); color: var(--primary); }
.page-title { font-size: 17px; font-weight: 700; white-space: nowrap; }
.page-title .no { color: var(--text-secondary); font-weight: 400; font-size: 13px; margin-left: 8px; }
.header-actions { display: flex; gap: 10px; }
.btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 18px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg-card); color: var(--text-primary);
    font-size: 13px; cursor: pointer; transition: all .2s;
}
.btn:hover { background: var(--bg-hover); border-color: var(--primary); color: var(--primary); }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); color: #fff; }
.btn[disabled] { opacity: .6; pointer-events: none; }
.loading { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== 主体：左侧锚点 + 右侧内容 ===== */
.page-body { display: flex; gap: 18px; width: 100%; padding: 18px 20px 40px; }
.side-nav {
    position: sticky; top: 76px; align-self: flex-start; flex: 0 0 168px;
    background: var(--bg-card); border-radius: 8px; padding: 10px;
    box-shadow: 0 1px 3px var(--shadow);
}
.side-nav .sn-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; border-radius: 6px; font-size: 13px; color: var(--text-secondary);
    cursor: pointer; transition: all .15s; user-select: none;
}
.side-nav .sn-item:hover { background: var(--bg-hover); color: var(--primary); }
.side-nav .sn-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.side-nav .sn-item .num {
    width: 18px; height: 18px; border-radius: 50%; background: var(--bg-hover);
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; flex: none;
}
.side-nav .sn-item.active .num { background: var(--primary); color: #fff; }
.detail-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }

/* ===== 内容卡片 ===== */
.card { background: var(--bg-card); border-radius: 8px; box-shadow: 0 1px 3px var(--shadow); scroll-margin-top: 76px; }
.card-head {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    font-size: 14px; font-weight: 600;
}
.card-head .cnum {
    width: 20px; height: 20px; border-radius: 50%; background: var(--primary); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex: none;
}
.card-body { padding: 18px; }
.card-body.collapsed { display: none; }
.card-head .collapse-toggle { margin-left: auto; color: var(--text-secondary); cursor: pointer; font-size: 13px; font-weight: 400; }

/* ===== 表单栅格：3 列，字段多时更紧凑 ===== */
.form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 16px; }
.form-grid .span2 { grid-column: span 2; }
.form-grid .full { grid-column: 1 / -1; }
.form-item label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.form-item input, .form-item select, .form-item textarea {
    width: 100%; padding: 7px 10px; border: 1px solid var(--input-border);
    border-radius: 4px; background: var(--input-bg); color: var(--text-primary);
    font-size: 13px; font-family: inherit; outline: none;
}
.form-item input:focus, .form-item select:focus, .form-item textarea:focus { border-color: var(--primary); }
.form-item textarea { resize: vertical; min-height: 60px; }
.form-item input[readonly] { background: var(--bg-hover); cursor: not-allowed; }

/* ===== 单选/多选 pill（与 H5 一致） ===== */
.radio-row, .checkbox-row { display: flex; flex-wrap: wrap; gap: 8px; }
.radio-pill, .checkbox-pill {
    padding: 6px 14px; border-radius: 16px; border: 1px solid var(--input-border);
    font-size: 12px; color: var(--text-secondary); background: var(--input-bg);
    cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 6px; min-height: 30px;
}
.radio-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.radio-pill.active.danger { background: #d93025; border-color: #d93025; color: #fff; }
.radio-pill.active.warning { background: var(--warning); border-color: var(--warning); color: #fff; }
.checkbox-pill::before { content: '\f0c8'; font-family: 'Font Awesome 6 Free'; font-weight: 400; font-size: 11px; }
.checkbox-pill.active { background: rgba(26,115,232,.1); color: var(--primary); border-color: var(--primary); }
.checkbox-pill.active::before { content: '\f14a'; font-weight: 900; }
.other-input { display: none; margin-top: 8px; }

/* ===== 隐患分项卡片（与 H5 一致） ===== */
.hazard-card { border: 1px solid var(--input-border); border-radius: 6px; padding: 12px; margin-bottom: 12px; background: var(--bg-card); }
.hazard-card .hc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed var(--input-border); }
.hazard-card .hc-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.hazard-card .hc-del { font-size: 12px; color: #d93025; cursor: pointer; padding: 3px 10px; border-radius: 4px; background: rgba(217,48,37,.08); }
.hazard-card .hc-del:hover { background: rgba(217,48,37,.16); }
.hazard-card .hz-row { margin-bottom: 10px; }
.hazard-card .hz-row:last-child { margin-bottom: 0; }
.hazard-card .hz-row label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.hazard-card .hz-row textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--input-border); border-radius: 4px; background: var(--input-bg); color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none; resize: vertical; min-height: 52px; }
.hazard-add { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border: 1px dashed var(--primary); border-radius: 6px; color: var(--primary); font-size: 12px; background: rgba(26,115,232,.04); cursor: pointer; user-select: none; }
.hazard-add:hover { background: rgba(26,115,232,.1); }

.not-found {
    max-width: 560px; margin: 80px auto; background: var(--bg-card); border-radius: 8px;
    padding: 40px; text-align: center; box-shadow: 0 1px 3px var(--shadow);
}
.not-found i { font-size: 40px; color: var(--text-secondary); margin-bottom: 12px; }
.not-found .t { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.not-found .d { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }

.toast {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
    padding: 9px 20px; border-radius: 6px; font-size: 13px; color: #fff; z-index: 999;
    background: rgba(32,33,36,.9); opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }
.toast.success { background: var(--success); }

/* ===== 现场打卡地图 ===== */
.ck-flex { display: flex; gap: 16px; align-items: stretch; }
.ck-info { flex: 1 1 50%; min-width: 0; }
.ck-map { width: 100%; height: 220px; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
.ck-map-legend { display: flex; gap: 18px; margin-top: 8px; font-size: 12px; color: var(--text-secondary); }
.ck-map-legend .lg-item { display: flex; align-items: center; gap: 6px; }
.ck-map-legend .lg-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.ck-map-legend .lg-house { background: #1a73e8; }
.ck-map-legend .lg-checkin { background: #188038; }
@media (max-width: 720px) { .ck-flex { flex-direction: column; } .ck-map { flex: 0 0 auto; width: 100%; } }
.ck-marker { position: relative; }
.ck-marker .ckm-pin { width: 28px; height: 28px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center; }
.ck-marker .ckm-pin i { transform: rotate(45deg); color: #fff; font-size: 12px; }
.ck-marker.ckm-house .ckm-pin { background: #1a73e8; }
.ck-marker.ckm-checkin .ckm-pin { background: #188038; }
.toast.error { background: var(--danger); }

@media (max-width: 900px) {
    .side-nav { display: none; }
    .form-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div class="page-header">
    <div class="ph-left">
        <button class="btn-back" id="btnBack"><i class="fa-solid fa-arrow-left"></i> 返回列表</button>
        <div class="page-title">排查详情<span class="no" id="headNo">—</span></div>
    </div>
    <div class="header-actions">
        <button class="btn" id="btnReset"><i class="fa-solid fa-rotate-left"></i> 重置</button>
        <button class="btn btn-primary" id="btnSave"><i class="fa-solid fa-floppy-disk"></i> 保存</button>
    </div>
</div>

<div class="page-body" id="pageBody" style="display:none">
    <div class="side-nav" id="sideNav"></div>
    <div class="detail-main" id="detailMain"></div>
</div>

<div class="not-found" id="notFound" style="display:none">
    <i class="fa-regular fa-folder-open"></i>
    <div class="t">未找到该记录</div>
    <div class="d" id="notFoundDesc">请检查链接参数是否正确</div>
    <button class="btn btn-primary" onclick="history.back()">返回</button>
</div>

<div class="toast" id="toast"></div>

<script src="./leaflet.js"></script>
<script>
(function() {
    'use strict';
    function $(id) { return document.getElementById(id); }
    function esc(s) {
        return String(s === null || s === undefined ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function toast(msg, type) {
        var t = $('toast');
        t.textContent = msg;
        t.className = 'toast show' + (type ? ' ' + type : '');
        setTimeout(function() { t.className = 'toast'; }, 2200);
    }
    function getParam(k) { return new URLSearchParams(location.search).get(k) || ''; }

    // 兼容旧参数：?town&village&houseNo=xxx → 归一化为 ?no=xxx（farm-review-edit/rectify 等旧回链仍在用）
    var houseNo = getParam('no') || getParam('houseNo');
    var isPending = getParam('tab') === 'pending';
    var apiList = isPending ? '/api/farm-review-pending' : '/api/farm-review-records';
    var apiSave = isPending ? '/api/farm-review-pending/' : '/api/farm-review-records/';

    var record = null;
    var TOWN_VILLAGES = {};

    var HAZARD_OPTS = [{ value: '一般', label: '一般' }, { value: '严重', label: '严重' }];
    var TEMP_CONTROL_OPTS = ['围挡封控', '人员疏散', '安全警示', '隔离防护', '其他'].map(function(s) { return { value: s, label: s }; });
    var RECTIFY_OPTS = ['修缮加固', '安全鉴定', '拆除违建', '停止经营性使用', '其他'].map(function(s) { return { value: s, label: s }; });
    var STATUS_OPTS = [{ value: 'draft', label: '草稿' }, { value: 'submitted', label: '已提交' }];

    // 会进 H5 answers 的字段（统一写入时这些 key 也要从 answers 里清掉，避免双份不一致）
    var H5_ANSWER_KEYS = ['hazardLevel', 'tempControlMeasures', 'ownerRectifyMeasures', 'checkFindTime', 'inspectorName'];

    // ================= 取值兜底：扁平 → answers → 空 =================
    function getVal(r, key) {
        if (r[key] !== undefined && r[key] !== null && r[key] !== '') return r[key];
        if (r.answers && r.answers[key] !== undefined && r.answers[key] !== null && r.answers[key] !== '') return r.answers[key];
        // 常见同名字段兜底
        if (key === 'inspector' && (r.inspectorName || r.inspectorSignature)) return r.inspectorName || r.inspectorSignature;
        return '';
    }

    // ================= 字段渲染 =================
    function inp(r, key, label, opts) {
        opts = opts || {};
        var v = getVal(r, key);
        var span = opts.full ? 'form-item full' : (opts.span2 ? 'form-item span2' : 'form-item');
        if (opts.textarea) {
            return '<div class="' + span + '"><label>' + label + '</label>' +
                '<textarea data-key="' + key + '"' + (opts.readonly ? ' readonly' : '') + '>' + esc(v) + '</textarea></div>';
        } else if (opts.select) {
            var optsHtml = opts.select.map(function(o) {
                var val = (typeof o === 'string') ? o : o.value;
                var text = (typeof o === 'string') ? o : (o.label !== undefined ? o.label : o.value);
                return '<option value="' + esc(val) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + esc(text) + '</option>';
            }).join('');
            return '<div class="' + span + '"><label>' + label + '</label>' +
                '<select data-key="' + key + '">' + optsHtml + '</select></div>';
        } else if (opts.radio) {
            var pills = opts.radio.map(function(o) {
                var colorCls = '';
                if (key === 'hazardLevel' && String(o.value) === String(v)) {
                    colorCls = (o.value === '严重') ? ' danger' : (o.value === '一般' ? ' warning' : '');
                }
                var act = (String(o.value) === String(v)) ? ' active' : '';
                return '<div class="radio-pill' + act + colorCls + '" data-value="' + esc(o.value) + '">' + esc(o.label) + '</div>';
            }).join('');
            return '<div class="' + span + '"><label>' + label + '</label>' +
                '<div class="radio-row" data-key="' + key + '">' + pills + '</div></div>';
        } else if (opts.checkbox) {
            var arr = Array.isArray(v) ? v : String(v || '').split(/[、,，]/).map(function(s) { return s.trim(); }).filter(Boolean);
            var pills2 = opts.checkbox.map(function(o) {
                var act = (arr.indexOf(o.value) > -1) ? ' active' : '';
                return '<div class="checkbox-pill' + act + (o.value === '其他' ? ' other' : '') + '" data-value="' + esc(o.value) + '">' + esc(o.label) + '</div>';
            }).join('');
            var otherKey = key + 'Other';
            var otherVal = (r[otherKey] !== undefined && r[otherKey] !== null) ? r[otherKey] : (r.answers && r.answers[otherKey] !== undefined ? r.answers[otherKey] : '');
            var showOther = arr.indexOf('其他') > -1;
            return '<div class="' + span + '"><label>' + label + '</label>' +
                '<div class="checkbox-row" data-key="' + key + '">' + pills2 + '</div>' +
                '<input type="text" class="other-input" data-other="' + key + '" data-key="' + otherKey + '" value="' + esc(otherVal) + '"' +
                ' placeholder="' + esc(opts.otherPlaceholder || '请输入其他内容') + '" style="display:' + (showOther ? 'block' : 'none') + ';"></div>';
        } else {
            var type = opts.dateType === 'month' ? 'month' : (opts.dateType === 'date' ? 'date' : 'text');
            return '<div class="' + span + '"><label>' + label + '</label>' +
                '<input type="' + type + '" data-key="' + key + '" value="' + esc(v) + '"' + (opts.readonly ? ' readonly' : '') + '></div>';
        }
    }

    function card(num, id, title, innerHtml) {
        return '<div class="card" id="' + id + '">' +
            '<div class="card-head"><span class="cnum">' + num + '</span>' + esc(title) +
            '<span class="collapse-toggle" data-collapse="' + id + '"><i class="fa-solid fa-chevron-up"></i></span></div>' +
            '<div class="card-body"><div class="form-grid">' + innerHtml + '</div></div></div>';
    }

    function buildForm(r) {
        var townOpts = [{ value: '', label: '—' }].concat(Object.keys(TOWN_VILLAGES).sort().map(function(t) { return { value: t, label: t }; }));
        var villageOpts = [{ value: '', label: '—' }].concat((TOWN_VILLAGES[r.town] || []).map(function(v2) { return { value: v2, label: v2 }; }));

        var basic = card(1, 'sec-basic', '基本信息',
            inp(r, 'houseNo', '唯一标识', { readonly: true }) +
            inp(r, 'town', '镇/街道', { select: townOpts }) +
            inp(r, 'village', '行政村', { select: villageOpts }) +
            inp(r, 'houseAddress', '宅基地位置门牌号', { full: true }) +
            inp(r, 'owner', '房屋产权人') +
            inp(r, 'phone', '联系电话'));

        var house = card(2, 'sec-house', '房屋信息',
            inp(r, 'houseUsage', '房屋用途') +
            inp(r, 'specificUsage', '具体用途') +
            inp(r, 'houseType', '房屋类型') +
            inp(r, 'floors', '房屋层数') +
            inp(r, 'area', '建筑面积 (㎡)') +
            inp(r, 'buildYear', '房屋建造年份'));

        var sections = [
            { id: 'sec-basic', title: '基本信息' },
            { id: 'sec-house', title: '房屋信息' }
        ];
        var html = basic + house;

        if (isPending) {
            html += card(3, 'sec-pre', '预判信息',
                inp(r, 'hazardLevel', '隐患等级', { radio: HAZARD_OPTS, full: true }) +
                inp(r, 'initialJudgment', '初步判定', { span2: true }) +
                inp(r, 'checkRemark', '备注/详细描述', { textarea: true, full: true }));
            sections.push({ id: 'sec-pre', title: '预判信息' });
        } else {
            html += card(3, 'sec-check', '排查问题清单',
                inp(r, 'checkFindTime', '排查发现时间', { dateType: 'month' }) +
                inp(r, 'inspectTime', '排查时间') +
                inp(r, 'inspector', '现场排查人员') +
                '<div class="form-item full"><label>排查发现具体结构安全问题（按隐患部位分项）</label><div id="pcHazardList"></div><div class="hazard-add" id="btnPcAddHazard"><i class="fa-solid fa-plus"></i> 添加隐患</div></div>' +
                inp(r, 'hazardLevel', '隐患等级（整户取最高等级）', { radio: HAZARD_OPTS, full: true }) +
                inp(r, 'tempControlMeasures', '现场落实临时管控措施', { checkbox: TEMP_CONTROL_OPTS, full: true, otherPlaceholder: '请输入其他临时管控措施' }) +
                inp(r, 'ownerRectifyMeasures', '需产权人落实整改措施', { checkbox: RECTIFY_OPTS, full: true, otherPlaceholder: '请输入其他整改措施' }) +
                inp(r, 'rectifyDeadline', '计划整改完成时限', { dateType: 'date' }) +
                inp(r, 'status', '状态', { select: STATUS_OPTS }) +
                inp(r, 'inspectResult', '初步判定', { span2: true }) +
                inp(r, 'checkRemark', '备注', { textarea: true, full: true }));
            sections.push({ id: 'sec-check', title: '排查问题清单' });

            // 现场打卡（只读，来自 H5 端 checkin 字段，PC 不可修改）
            html += card(4, 'sec-checkin', '现场打卡', buildCheckinReadonly(r));
            sections.push({ id: 'sec-checkin', title: '现场打卡' });
        }
        return { html: html, sections: sections };
    }

    // 现场打卡只读视图：经纬度/精度/打卡时间/定位方式/操作人
    // ================= 隐患分项管理（PC 端） =================
    var PC_HAZARD_PARTS = ['地基基础', '上部结构'];
    var PC_HAZARD_CUSTOM = '__custom__';
    var pcHazards = [];

    function initPcHazards(r) {
        if (Array.isArray(r.hazards) && r.hazards.length) {
            pcHazards = r.hazards.map(function(h) {
                var part = h.part || '';
                var isPreset = PC_HAZARD_PARTS.indexOf(part) > -1;
                return { part: part, partCustom: part ? !isPreset : false, description: h.description || '' };
            });
        } else if (r.structuralProblems && typeof r.structuralProblems === 'string') {
            // 老数据迁移：整段文本 → hazards[0]
            pcHazards = [{ part: '', partCustom: false, description: r.structuralProblems }];
        } else {
            pcHazards = [];
        }
        renderPcHazards();
    }

    function renderPcHazards() {
        var list = document.getElementById('pcHazardList');
        if (!list) return;
        list.innerHTML = '';
        pcHazards.forEach(function(h, idx) {
            var card = document.createElement('div');
            card.className = 'hazard-card';
            card.setAttribute('data-hidx', idx);
            var pillsHtml = PC_HAZARD_PARTS.map(function(p) {
                return '<div class="radio-pill' + (!h.partCustom && h.part === p ? ' active' : '') + '" data-value="' + esc(p) + '">' + esc(p) + '</div>';
            }).join('');
            pillsHtml += '<div class="radio-pill' + (h.partCustom ? ' active' : '') + '" data-value="' + PC_HAZARD_CUSTOM + '">自定义</div>';
            var customInput = '<input type="text" class="hz-part-custom" placeholder="请输入隐患部位" value="' + esc(h.partCustom ? (h.part || '') : '') + '" style="display:' + (h.partCustom ? 'block' : 'none') + ';margin-top:8px;width:100%;padding:7px 10px;border:1px solid var(--input-border);border-radius:4px;background:var(--input-bg);color:var(--text-primary);font-size:13px;font-family:inherit;outline:none;">';
            card.innerHTML =
                '<div class="hc-head">' +
                    '<span class="hc-title">隐患 #' + (idx + 1) + '</span>' +
                    '<span class="hc-del" data-del="' + idx + '">删除</span>' +
                '</div>' +
                '<div class="hz-row"><label>隐患部位</label>' +
                    '<div class="radio-row hz-part">' + pillsHtml + '</div>' +
                    customInput +
                '</div>' +
                '<div class="hz-row"><label>问题描述</label>' +
                    '<textarea class="hz-desc" rows="2" placeholder="请描述该隐患的具体情况">' + esc(h.description || '') + '</textarea>' +
                '</div>';
            list.appendChild(card);
        });
    }

    function bindPcHazards() {
        var list = document.getElementById('pcHazardList');
        if (!list) return;
        list.addEventListener('click', function(e) {
            var del = e.target.closest('[data-del]');
            if (del) {
                pcHazards.splice(parseInt(del.getAttribute('data-del'), 10), 1);
                renderPcHazards();
                return;
            }
            var pill = e.target.closest('.hz-part .radio-pill');
            if (pill) {
                var card = pill.closest('.hazard-card');
                var idx = parseInt(card.getAttribute('data-hidx'), 10);
                card.querySelectorAll('.hz-part .radio-pill').forEach(function(p) { p.classList.remove('active'); });
                pill.classList.add('active');
                var val = pill.getAttribute('data-value');
                var customInput = card.querySelector('.hz-part-custom');
                if (val === PC_HAZARD_CUSTOM) {
                    pcHazards[idx].partCustom = true;
                    pcHazards[idx].part = customInput.value.trim();
                    customInput.style.display = 'block';
                    customInput.focus();
                } else {
                    pcHazards[idx].partCustom = false;
                    pcHazards[idx].part = val;
                    customInput.style.display = 'none';
                    customInput.value = '';
                }
            }
        });
        list.addEventListener('input', function(e) {
            var card = e.target.closest('.hazard-card');
            if (!card) return;
            var idx = parseInt(card.getAttribute('data-hidx'), 10);
            if (e.target.classList.contains('hz-desc')) {
                pcHazards[idx].description = e.target.value;
            } else if (e.target.classList.contains('hz-part-custom')) {
                pcHazards[idx].part = e.target.value.trim();
            }
        });
        var addBtn = document.getElementById('btnPcAddHazard');
        if (addBtn) addBtn.addEventListener('click', function() {
            pcHazards.push({ part: '', partCustom: false, description: '' });
            renderPcHazards();
        });
    }

    function buildCheckinReadonly(r) {
        var ck = r.checkin;
        if (!ck || (ck.lat === undefined && ck.lng === undefined)) {
            return '<div class="form-item full"><div style="padding:14px;border:1px dashed var(--border);border-radius:8px;color:var(--text-secondary);font-size:13px;text-align:center;background:var(--bg-hover);"><i class="fa-solid fa-location-crosshairs" style="margin-right:6px;"></i>暂无现场打卡记录</div></div>';
        }
        function row(label, val, isLast) {
            return '<div style="display:flex;padding:8px 0;' + (isLast ? '' : 'border-bottom:1px solid var(--border);') + 'font-size:13px;">' +
                '<span style="width:110px;color:var(--text-secondary);flex-shrink:0;">' + label + '</span>' +
                '<span style="color:var(--text-primary);word-break:break-all;">' + esc(val === undefined || val === null || val === '' ? '—' : val) + '</span></div>';
        }
        var latlng = (ck.lat !== undefined && ck.lng !== undefined) ? (Number(ck.lat).toFixed(6) + ', ' + Number(ck.lng).toFixed(6)) : '—';
        var hasHouse = (typeof r.lat === 'number' && typeof r.lng === 'number');
        var badge = '<span style="display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:600;background:rgba(30,142,62,.12);color:var(--success);"><i class="fa-solid fa-circle-check" style="margin-right:4px;"></i>已打卡</span>';
        return '<div class="form-item full">' +
            '<div class="ck-flex">' +
            '<div class="ck-info">' +
            '<div style="border:1px solid var(--border);border-radius:8px;padding:6px 14px 4px;background:var(--bg-card);height:100%;box-sizing:border-box;">' +
            '<div style="display:flex;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:center;"><span style="width:110px;color:var(--text-secondary);flex-shrink:0;">打卡状态</span>' + badge + '</div>' +
            row('打卡坐标', latlng) +
            row('打卡时间', ck.time, true) +
            '</div>' +
            '</div>' +
            '<div style="flex:1 1 50%;min-width:0;">' +
            '<div class="ck-map" id="ckMap"></div>' +
            '<div class="ck-map-legend">' +
            (hasHouse ? '<div class="lg-item"><span class="lg-dot lg-house"></span>房屋图斑</div>' : '') +
            '<div class="lg-item"><span class="lg-dot lg-checkin"></span>现场打卡点</div>' +
            '</div>' +
            '</div>' +
            '</div>' +
            '</div>';
    }

    // ================= 交互绑定 =================
    function bindControls() {
        var main = $('detailMain');
        var townSel = main.querySelector('select[data-key="town"]');
        var villageSel = main.querySelector('select[data-key="village"]');
        if (townSel && villageSel) {
            townSel.addEventListener('change', function() {
                var curVal = villageSel.value;
                var villages = TOWN_VILLAGES[townSel.value] || [];
                villageSel.innerHTML = '<option value="">—</option>' + villages.map(function(v2) {
                    return '<option value="' + esc(v2) + '">' + esc(v2) + '</option>';
                }).join('');
                villageSel.value = (villages.indexOf(curVal) >= 0) ? curVal : '';
            });
        }
        main.querySelectorAll('.radio-row').forEach(function(row) {
            var isHazard = row.getAttribute('data-key') === 'hazardLevel';
            row.querySelectorAll('.radio-pill').forEach(function(pill) {
                pill.addEventListener('click', function() {
                    row.querySelectorAll('.radio-pill').forEach(function(p) { p.classList.remove('active', 'danger', 'warning'); });
                    this.classList.add('active');
                    if (isHazard) {
                        var v2 = this.getAttribute('data-value');
                        if (v2 === '严重') this.classList.add('danger');
                        else if (v2 === '一般') this.classList.add('warning');
                    }
                });
            });
        });
        main.querySelectorAll('.checkbox-row').forEach(function(row) {
            var key = row.getAttribute('data-key');
            var otherInput = main.querySelector('.other-input[data-other="' + key + '"]');
            row.querySelectorAll('.checkbox-pill').forEach(function(pill) {
                pill.addEventListener('click', function() {
                    this.classList.toggle('active');
                    if (otherInput) {
                        var otherOn = row.querySelector('.checkbox-pill[data-value="其他"]');
                        var show = otherOn && otherOn.classList.contains('active');
                        otherInput.style.display = show ? 'block' : 'none';
                        if (!show) otherInput.value = '';
                    }
                });
            });
        });
        main.querySelectorAll('[data-collapse]').forEach(function(t) {
            t.addEventListener('click', function() {
                var body = $(t.getAttribute('data-collapse')).querySelector('.card-body');
                body.classList.toggle('collapsed');
                t.innerHTML = body.classList.contains('collapsed') ? '<i class="fa-solid fa-chevron-down"></i>' : '<i class="fa-solid fa-chevron-up"></i>';
            });
        });
    }

    function buildSideNav(sections) {
        $('sideNav').innerHTML = sections.map(function(s, i) {
            return '<div class="sn-item' + (i === 0 ? ' active' : '') + '" data-target="' + s.id + '"><span class="num">' + (i + 1) + '</span>' + esc(s.title) + '</div>';
        }).join('');
        $('sideNav').querySelectorAll('.sn-item').forEach(function(item) {
            item.addEventListener('click', function() {
                $('sideNav').querySelectorAll('.sn-item').forEach(function(n) { n.classList.remove('active'); });
                this.classList.add('active');
                var target = $(this.getAttribute('data-target'));
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        });
    }

    // 收集扁平表单值
    function collectForm() {
        var data = {};
        $('detailMain').querySelectorAll('[data-key]').forEach(function(el) {
            if (el.classList.contains('radio-row')) {
                var act = el.querySelector('.radio-pill.active');
                data[el.dataset.key] = act ? act.getAttribute('data-value') : '';
            } else if (el.classList.contains('checkbox-row')) {
                var vals = [];
                el.querySelectorAll('.checkbox-pill.active').forEach(function(p) { vals.push(p.getAttribute('data-value')); });
                data[el.dataset.key] = vals;
            } else {
                data[el.dataset.key] = el.value;
            }
        });
        return data;
    }

    function render() {
        var built = buildForm(record);
        $('detailMain').innerHTML = built.html;
        buildSideNav(built.sections);
        bindControls();
        if (!isPending) { initPcHazards(record); bindPcHazards(); }
        initCheckinMap(record);
        $('headNo').textContent = ' · ' + record.houseNo + (isPending ? '（待排查任务）' : '');
    }

    // ================= 现场打卡只读地图 =================
    var ckMapInst = null;
    function createCkIcon(cls, icon) {
        return L.divIcon({
            className: '',
            html: '<div class="ck-marker ' + cls + '"><div class="ckm-pin"><i class="fa-solid ' + icon + '"></i></div></div>',
            iconSize: [28, 28],
            iconAnchor: [14, 28]
        });
    }
    function initCheckinMap(r) {
        var el = document.getElementById('ckMap');
        if (!el || typeof L === 'undefined') return;
        var ck = r.checkin;
        if (!ck || typeof ck.lat !== 'number' || typeof ck.lng !== 'number') return;
        if (ckMapInst) { ckMapInst.remove(); ckMapInst = null; }
        ckMapInst = L.map('ckMap', { zoomControl: true, attributionControl: false });
        L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            maxZoom: 19, subdomains: '1234'
        }).addTo(ckMapInst);
        var points = [];
        if (typeof r.lat === 'number' && typeof r.lng === 'number') {
            points.push([r.lat, r.lng]);
            L.marker([r.lat, r.lng], { icon: createCkIcon('ckm-house', 'fa-house') }).addTo(ckMapInst);
        }
        points.push([ck.lat, ck.lng]);
        L.marker([ck.lat, ck.lng], { icon: createCkIcon('ckm-checkin', 'fa-location-crosshairs') }).addTo(ckMapInst);
        if (points.length > 1) {
            ckMapInst.fitBounds(L.latLngBounds(points).pad(0.4));
        } else {
            ckMapInst.setView([ck.lat, ck.lng], 16);
        }
        setTimeout(function() { if (ckMapInst) ckMapInst.invalidateSize(); }, 60);
    }

    // ================= 统一写入：扁平 + 清理冗余 answers 键 =================
    function buildSavePayload(formData) {
        var payload = Object.assign({}, formData);
        // 把 inspector 同步到 H5 用的 inspectorName，保持两端一致
        if (payload.inspector !== undefined) payload.inspectorName = payload.inspector;
        // 隐患分项：PC 编辑结果写入 hazards，同时生成兼容的 structuralProblems 汇总文本
        if (!isPending) {
            payload.hazards = pcHazards;
            payload.structuralProblems = pcHazards.map(function(h, i) {
                var parts = [];
                if (h.part) parts.push('【' + h.part + '】');
                if (h.description) parts.push(h.description);
                return (i + 1) + '. ' + parts.join(' ');
            }).join('\n');
        }
        return payload;
    }
    function pruneAnswers(rec, formData) {
        if (!rec.answers) return;
        Object.keys(formData).forEach(function(k) {
            if (H5_ANSWER_KEYS.indexOf(k) > -1) delete rec.answers[k];
        });
    }

    function save() {
        var data = buildSavePayload(collectForm());
        var btn = $('btnSave');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span> 保存中...';
        fetch(apiSave + encodeURIComponent(record.houseNo), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(function(r) { return r.json(); }).then(function(res) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> 保存';
            if (res && res.success) {
                toast('保存成功', 'success');
                // 本地合并，保证重置回到最新已保存态
                record = Object.assign({}, record, data);
                pruneAnswers(record, data);
            } else {
                toast('保存失败: ' + (res && res.error || ''), 'error');
            }
        }).catch(function() {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> 保存';
            toast('保存失败', 'error');
        });
    }

    // ================= 初始化 =================
    function init() {
        if (!houseNo) {
            $('notFoundDesc').textContent = '缺少参数 no（唯一标识）';
            $('notFound').style.display = '';
            return;
        }
        Promise.all([
            fetch(apiList).then(function(r) { return r.ok ? r.json() : []; }),
            fetch('/api/farm-review-records/page?page=1&size=1').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; })
        ]).then(function(results) {
            var list = Array.isArray(results[0]) ? results[0] : [];
            if (results[1] && results[1].townVillages) TOWN_VILLAGES = results[1].townVillages;
            for (var i = 0; i < list.length; i++) {
                if (list[i] && list[i].houseNo === houseNo) { record = list[i]; break; }
            }
            if (!record) {
                $('notFoundDesc').textContent = '唯一标识「' + houseNo + '」在' + (isPending ? '待排查任务' : '排查结果') + '中不存在';
                $('notFound').style.display = '';
                return;
            }
            $('pageBody').style.display = '';
            render();
        }).catch(function() {
            $('notFoundDesc').textContent = '数据加载失败，请确认服务已启动';
            $('notFound').style.display = '';
        });
    }

    $('btnBack').addEventListener('click', function() {
        if (document.referrer && document.referrer.indexOf('farm-review') > -1) history.back();
        else location.href = './farm-review.html';
    });
    $('btnSave').addEventListener('click', save);
    $('btnReset').addEventListener('click', function() {
        if (confirm('放弃当前修改并恢复为已保存的内容？')) render();
    });

    init();
})();
</script>
</body>
