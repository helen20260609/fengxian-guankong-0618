<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城镇自建房 - 专项风险隐患分发</title>
<link rel="stylesheet" href="./all.min.css">
<link rel="stylesheet" href="./ui-modal.css">
<style>
:root {
    --primary: #1a73e8; --primary-dark: #1557b0; --success: #188038; --warning: #e37400; --danger: #d93025;
    --bg-page: #f1f3f4; --bg-card: #ffffff; --text-main: #202124; --text-sub: #5f6368; --border: #e0e0e0;
}
[data-theme="dark"] {
    --bg-page: #121416; --bg-card: #1e2126; --text-main: #e8eaed; --text-sub: #9aa0a6; --border: #3c4043;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-page); color: var(--text-main); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; }
.page-head { background: var(--bg-card); padding: 18px 28px; border-bottom: 1px solid var(--border); }
.page-head h2 { font-size: 19px; display: flex; align-items: center; gap: 10px; }
.page-head h2 .fa-solid { color: var(--primary); }
.page-head .desc { margin-top: 6px; color: var(--text-sub); font-size: 13px; }
.container { padding: 20px 28px; }
.kpi-wrapper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 18px; }
.kpi-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
.kpi-title { color: var(--text-sub); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.kpi-title .fa-solid { font-size: 15px; }
.kpi-num { font-size: 28px; font-weight: 700; margin-top: 8px; }
.kpi-sub { color: var(--text-sub); font-size: 12px; margin-top: 4px; }
.kpi-card.c-blue .kpi-title .fa-solid, .kpi-card.c-blue .kpi-num { color: var(--primary); }
.kpi-card.c-orange .kpi-title .fa-solid, .kpi-card.c-orange .kpi-num { color: var(--warning); }
.kpi-card.c-green .kpi-title .fa-solid, .kpi-card.c-green .kpi-num { color: var(--success); }
.kpi-card.c-red .kpi-title .fa-solid, .kpi-card.c-red .kpi-num { color: var(--danger); }
.panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.status-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 16px; }
.tab-item { border: none; background: none; padding: 14px 18px; font-size: 14px; color: var(--text-sub); cursor: pointer; border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 6px; }
.tab-item.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.tab-count { background: rgba(26,115,232,0.1); color: var(--primary); border-radius: 10px; padding: 1px 8px; font-size: 12px; }
.tab-item.active .tab-count { background: var(--primary); color: #fff; }
.filter-bar { display: flex; flex-wrap: wrap; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--border); align-items: flex-end; }
.filter-item { display: flex; flex-direction: column; gap: 5px; }
.filter-item label { font-size: 12px; color: var(--text-sub); }
.filter-item select, .filter-item input { height: 34px; border: 1px solid var(--border); border-radius: 6px; padding: 0 10px; font-size: 13px; background: var(--bg-card); color: var(--text-main); min-width: 150px; }
.btn { height: 34px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.btn-primary:hover { background: var(--primary-dark); }
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { background: rgba(26,115,232,0.05); color: var(--text-sub); font-weight: 600; font-size: 13px; padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table td { padding: 13px 14px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
.data-table tbody tr:hover { background: rgba(26,115,232,0.03); }
.task-name { font-weight: 600; color: var(--text-main); }
.task-no { color: var(--text-sub); font-size: 12px; margin-top: 2px; }
.dist-cell { display: flex; gap: 6px; flex-wrap: wrap; }
.dist-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 10px; font-size: 12px; }
.dist-badge.red { background: rgba(217,48,37,0.1); color: var(--danger); }
.dist-badge.yellow { background: rgba(227,116,0,0.1); color: var(--warning); }
.status-tag { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 12px; white-space: nowrap; }
.status-tag.pending { background: rgba(227,116,0,0.1); color: var(--warning); }
.status-tag.doing { background: rgba(26,115,232,0.1); color: var(--primary); }
.status-tag.done { background: rgba(24,128,56,0.1); color: var(--success); }
.action-link { border: none; background: none; color: var(--primary); cursor: pointer; font-size: 13px; padding: 2px 6px; }
.action-link:hover { text-decoration: underline; }
.action-link.send { color: var(--warning); font-weight: 600; }
.progress-wrap { display: flex; align-items: center; gap: 8px; }
.progress-bar { width: 90px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
.progress-bar i { display: block; height: 100%; background: var(--success); border-radius: 3px; }
.progress-text { font-size: 12px; color: var(--text-sub); white-space: nowrap; }
.pager { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 16px; color: var(--text-sub); font-size: 13px; }
.pager button { min-width: 30px; height: 30px; border: 1px solid var(--border); background: var(--bg-card); border-radius: 6px; cursor: pointer; color: var(--text-main); }
.pager button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.pager button:disabled { opacity: 0.45; cursor: not-allowed; }
.empty-tip { padding: 60px 0; text-align: center; color: var(--text-sub); }
.empty-tip .fa-solid { font-size: 40px; opacity: 0.3; display: block; margin-bottom: 12px; }
/* 视图切换（任务包列表 / 分级跟踪视图） */
.view-tabs { display: flex; gap: 10px; margin-bottom: 14px; }
.view-tab { border: 1px solid var(--border); background: var(--bg-card); padding: 10px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; color: var(--text-sub); display: flex; align-items: center; gap: 8px; }
.view-tab.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
/* 角色演示切换条 */
.role-bar { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.role-label { font-size: 13px; color: var(--text-sub); }
.role-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.role-btn { border: none; background: var(--bg-card); padding: 8px 18px; font-size: 13px; cursor: pointer; color: var(--text-main); }
.role-btn + .role-btn { border-left: 1px solid var(--border); }
.role-btn.active { background: var(--primary); color: #fff; }
.role-tip { font-size: 12px; color: var(--text-sub); }
.town-row { cursor: pointer; }
.village-row td { background: rgba(26,115,232,0.03); }
.village-row td:first-child { padding-left: 34px; }
.mini-tag { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 12px; margin-right: 4px; white-space: nowrap; }
.mini-tag.pending { background: rgba(227,116,0,0.1); color: var(--warning); }
.mini-tag.doing { background: rgba(26,115,232,0.1); color: var(--primary); }
.mini-tag.done { background: rgba(24,128,56,0.1); color: var(--success); }
</style>
</head>
<body>
<div class="page-head">
    <h2><i class="fa-solid fa-share-from-square"></i>自建房专项风险隐患分发</h2>
    <div class="desc">对已审核通过的排查任务进行逐级下发：任务包一键发送至镇/街道（政府）或村委会，并分解子任务至村支书、网格员、户主等具体责任人</div>
</div>
<div class="container">
    <div class="kpi-wrapper">
        <div class="kpi-card c-orange">
            <div class="kpi-title"><i class="fa-solid fa-inbox"></i>待分发任务包</div>
            <div class="kpi-num" id="kpi-pending">0</div>
            <div class="kpi-sub">审核通过待下发</div>
        </div>
        <div class="kpi-card c-blue">
            <div class="kpi-title"><i class="fa-solid fa-paper-plane"></i>已下发任务包</div>
            <div class="kpi-num" id="kpi-sent">0</div>
            <div class="kpi-sub">已发送至镇/街道/村委</div>
        </div>
        <div class="kpi-card c-red">
            <div class="kpi-title"><i class="fa-solid fa-triangle-exclamation"></i>待处置隐患房屋</div>
            <div class="kpi-num" id="kpi-houses">0</div>
            <div class="kpi-sub">已下发未完成的隐患房屋</div>
        </div>
        <div class="kpi-card c-green">
            <div class="kpi-title"><i class="fa-solid fa-circle-check"></i>子任务完成率</div>
            <div class="kpi-num" id="kpi-rate">0%</div>
            <div class="kpi-sub">全部子任务完成进度</div>
        </div>
    </div>
    <div class="view-tabs">
        <button class="view-tab active" data-view="list"><i class="fa-solid fa-list-check"></i>任务包列表</button>
        <button class="view-tab" data-view="track"><i class="fa-solid fa-route"></i>分级跟踪视图</button>
    </div>
    <div id="view-list">
    <div class="panel">
        <div class="status-tabs">
            <button class="tab-item active" data-tab="pending">待分发 <span class="tab-count" id="tab-pending">0</span></button>
            <button class="tab-item" data-tab="sent">已下发 <span class="tab-count" id="tab-sent">0</span></button>
            <button class="tab-item" data-tab="all">全部 <span class="tab-count" id="tab-all">0</span></button>
        </div>
        <div class="filter-bar">
            <div class="filter-item">
                <label>镇/街道</label>
                <select id="f-town"><option value="">全部</option></select>
            </div>
            <div class="filter-item">
                <label>任务名称</label>
                <input id="f-kw" placeholder="输入任务名称/编号关键字">
            </div>
            <button class="btn btn-primary" onclick="applyFilter()"><i class="fa-solid fa-search"></i>查询</button>
            <button class="btn" onclick="resetFilter()"><i class="fa-solid fa-rotate-left"></i>重置</button>
        </div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>任务名称</th>
                    <th>镇/街道/社区</th>
                    <th>覆盖村数</th>
                    <th>隐患房屋</th>
                    <th>风险等级分布</th>
                    <th>审核通过时间</th>
                    <th>分发状态</th>
                    <th>处置进度</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
        <div id="empty" class="empty-tip" style="display:none;">
            <i class="fa-solid fa-share-from-square"></i>
            暂无待分发的任务包（审核通过的排查任务将在此汇集）
        </div>
        <div class="pager" id="pager"></div>
    </div>
    </div>
    <div id="view-track" style="display:none;">
        <div class="panel">
            <div class="role-bar">
                <span class="role-label">演示视角</span>
                <div class="role-seg">
                    <button class="role-btn active" data-role="district">区房管局</button>
                    <button class="role-btn" data-role="town">镇/街道（政府）</button>
                    <button class="role-btn" data-role="village">村委会</button>
                </div>
                <span class="role-tip" id="role-tip"></span>
            </div>
            <div class="filter-bar" id="track-scope" style="display:none;">
                <div class="filter-item">
                    <label id="scope-label">镇/街道</label>
                    <select id="scope-select"></select>
                </div>
            </div>
            <div id="track-body"></div>
        </div>
    </div>
</div>
<script src="./ui-modal.js"></script>
<script src="../js/house-arch-data.js"></script>
<script src="./urban-audit-seed.js"></script>
<script>
const PAGE_SIZE = 10;
let tasks = [];        // 已审核通过的任务包
let packages = {};     // taskId -> 分发记录
let filtered = [];
let curTab = 'pending';
let curPage = 1;

function loadPackages() {
    try { packages = JSON.parse(localStorage.getItem('urbanHazardDispatchPackages') || '{}'); }
    catch (e) { packages = {}; }
}
function savePackages() { localStorage.setItem('urbanHazardDispatchPackages', JSON.stringify(packages)); }

function loadTasks() {
    const all = JSON.parse(localStorage.getItem('urbanPatrolTasks') || '[]');
    tasks = all.filter(t => t.status === 'completed' && t.auditResult && t.auditResult.result === '通过');
}

function taskHouses(t) {
    if (Array.isArray(t.selectedProjects) && t.selectedProjects.length) return t.selectedProjects;
    return (t.houseNos || []).map(no => getHouseRecord(no)).filter(Boolean);
}

// 入库隐患房屋：有红/黄检查项 且未被审核排除
function dispatchHouses(t) {
    const excluded = t.excludedHouses || [];
    return taskHouses(t).filter(h => !excluded.includes(h.houseNo))
        .map(h => {
            const items = (h.checkItems || []).filter(ci => ci.level === 'red' || ci.level === 'yellow');
            return { house: h, hazards: items };
        })
        .filter(x => x.hazards.length > 0);
}

function riskDist(t) {
    const d = { red: 0, yellow: 0 };
    dispatchHouses(t).forEach(x => x.hazards.forEach(ci => { if (d[ci.level] !== undefined) d[ci.level]++; }));
    return d;
}

function pkgStatus(t) {
    const p = packages[t.id];
    if (!p) return { key: 'pending', label: '待分发', cls: 'pending' };
    if (p.dispatchMode === 'package' && p.status === 'sent') return { key: 'wait-receive', label: '已下发待接收', cls: 'doing' };
    if (p.dispatchMode === 'package' && p.status === 'received') return { key: 'wait-decompose', label: '已接收待分解', cls: 'doing' };
    const subs = p.subTasks || [];
    const done = subs.filter(s => s.status === '已完成').length;
    if (subs.length && done === subs.length) return { key: 'done', label: '已完成', cls: 'done' };
    return { key: 'doing', label: '处置中', cls: 'doing', done, total: subs.length };
}

function tabOf(t) { return packages[t.id] ? 'sent' : 'pending'; }

function renderKPI() {
    const pending = tasks.filter(t => !packages[t.id]);
    const sent = tasks.filter(t => packages[t.id]);
    let pendingHouses = 0, subDone = 0, subTotal = 0;
    sent.forEach(t => {
        const p = packages[t.id];
        (p.subTasks || []).forEach(s => {
            subTotal++;
            if (s.status === '已完成') subDone++;
            else pendingHouses += (s.houseNos || []).length;
        });
    });
    document.getElementById('kpi-pending').textContent = pending.length;
    document.getElementById('kpi-sent').textContent = sent.length;
    document.getElementById('kpi-houses').textContent = pendingHouses;
    document.getElementById('kpi-rate').textContent = subTotal ? Math.round(subDone / subTotal * 100) + '%' : '0%';
    document.getElementById('tab-pending').textContent = pending.length;
    document.getElementById('tab-sent').textContent = sent.length;
    document.getElementById('tab-all').textContent = tasks.length;
}

function applyFilter() {
    const town = document.getElementById('f-town').value;
    const kw = document.getElementById('f-kw').value.trim();
    filtered = tasks.filter(t => {
        if (curTab !== 'all' && tabOf(t) !== curTab) return false;
        if (town && t.town !== town) return false;
        if (kw && !(t.name || '').includes(kw) && !(t.no || '').includes(kw)) return false;
        return true;
    });
    curPage = 1;
    renderTable();
}
function resetFilter() {
    document.getElementById('f-town').value = '';
    document.getElementById('f-kw').value = '';
    applyFilter();
}

function renderTable() {
    const tb = document.getElementById('tbody');
    const start = (curPage - 1) * PAGE_SIZE;
    const rows = filtered.slice(start, start + PAGE_SIZE);
    document.getElementById('empty').style.display = filtered.length ? 'none' : 'block';
    tb.innerHTML = rows.map(t => {
        const d = riskDist(t);
        const houses = dispatchHouses(t);
        const st = pkgStatus(t);
        const p = packages[t.id];
        const progress = p ? st.total ? Math.round((st.done || 0) / st.total * 100) : 0 : null;
        const auditTime = t.auditResult && t.auditResult.time ? t.auditResult.time : '-';
        return `<tr>
            <td><div class="task-name">${esc(t.name)}</div><div class="task-no">${esc(t.no || '')}</div></td>
            <td>${esc(t.town || '')} / ${esc(t.village || '')}</td>
            <td>1 个村</td>
            <td>${houses.length} 栋</td>
            <td><div class="dist-cell">
                ${d.red ? `<span class="dist-badge red">疑似危房 ${d.red}</span>` : ''}
                ${d.yellow ? `<span class="dist-badge yellow">疑似一般损坏房 ${d.yellow}</span>` : ''}
                ${!d.red && !d.yellow ? '<span style="color:var(--text-sub);">无入库隐患</span>' : ''}
            </div></td>
            <td>${auditTime}</td>
            <td><span class="status-tag ${st.cls}">${st.label}</span></td>
            <td>${p ? `<div class="progress-wrap"><div class="progress-bar"><i style="width:${progress}%"></i></div><span class="progress-text">${st.done || 0}/${st.total || 0} 子任务</span></div>` : '<span style="color:var(--text-sub);">-</span>'}</td>
            <td>${p
                ? `<button class="action-link${st.key === 'wait-receive' || st.key === 'wait-decompose' ? ' send' : ''}" onclick="goDetail(${t.id})">${st.key === 'wait-receive' ? '<i class="fa-solid fa-inbox"></i>前往接收' : st.key === 'wait-decompose' ? '<i class="fa-solid fa-code-branch"></i>前往分解' : '任务跟踪'}</button>`
                : `<button class="action-link send" onclick="goDetail(${t.id})"><i class="fa-solid fa-paper-plane"></i>一键下发</button>`}
            </td>
        </tr>`;
    }).join('');
    renderPager();
}

function renderPager() {
    const total = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    const pg = document.getElementById('pager');
    let html = `共 ${filtered.length} 条，每页 ${PAGE_SIZE} 条`;
    html += `<button ${curPage <= 1 ? 'disabled' : ''} onclick="goPage(${curPage - 1})"><i class="fa-solid fa-chevron-left"></i></button>`;
    for (let i = 1; i <= total; i++) html += `<button class="${i === curPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
    html += `<button ${curPage >= total ? 'disabled' : ''} onclick="goPage(${curPage + 1})"><i class="fa-solid fa-chevron-right"></i></button>`;
    pg.innerHTML = html;
}
function goPage(p) { curPage = p; renderTable(); }

// ================= 分级跟踪视图（区 / 镇/街道 / 村委） =================
let curView = 'list';
let curRole = 'district';
let scopeVal = '';
const expandedTowns = new Set();

function trackPkgs() {
    return Object.entries(packages)
        .map(([key, p]) => ({ p, t: tasks.find(x => String(x.id) === String(p.taskId || key)) }))
        .filter(x => x.t);
}
// 任务包覆盖房屋数：已分解按子任务累计，未分解按入库隐患房屋数
function pkgHouses(p, t) {
    const subs = p.subTasks || [];
    return subs.length ? subs.reduce((n, s) => n + (s.houseNos || []).length, 0) : dispatchHouses(t).length;
}
function subStats(subs) {
    const done = subs.filter(s => s.status === '已完成').length;
    return { done, total: subs.length };
}
function statusTags(subs) {
    const order = ['待接收', '处置中', '验收中', '已完成'];
    const cnt = {};
    subs.forEach(s => { cnt[s.status] = (cnt[s.status] || 0) + 1; });
    return order.filter(k => cnt[k]).map(k =>
        `<span class="mini-tag ${k === '已完成' ? 'done' : k === '待接收' ? 'pending' : 'doing'}">${k} ${cnt[k]}</span>`).join('');
}
function houseRiskLevel(h) {
    const items = (h && h.checkItems || []).filter(ci => ci.level === 'red' || ci.level === 'yellow');
    if (items.some(ci => ci.level === 'red')) return 'red';
    if (items.length) return 'yellow';
    return '';
}
function progressCell(done, total) {
    if (!total) return '<span style="color:var(--text-sub);">-</span>';
    const rate = Math.round(done / total * 100);
    return `<div class="progress-wrap"><div class="progress-bar"><i style="width:${rate}%"></i></div><span class="progress-text">${done}/${total} 子任务</span></div>`;
}
function groupMetrics(list) {
    const allSubs = list.flatMap(x => x.p.subTasks || []);
    const houses = list.reduce((n, x) => n + pkgHouses(x.p, x.t), 0);
    return { allSubs, houses, st: subStats(allSubs) };
}

function renderTrackView() {
    const tipMap = {
        district: '全区视角：按镇/街道汇总下发进度，点击镇/街道行可展开所辖各村',
        town: '镇/街道视角：查看所辖各村任务包的总体进度',
        village: '村委视角：查看每户隐患房屋的整治完成情况'
    };
    document.getElementById('role-tip').textContent = tipMap[curRole];
    const scope = document.getElementById('track-scope');
    if (curRole === 'district') {
        scope.style.display = 'none';
        renderDistrictView();
    } else if (curRole === 'town') {
        scope.style.display = 'flex';
        document.getElementById('scope-label').textContent = '镇/街道';
        const towns = [...new Set(trackPkgs().map(x => x.t.town).filter(Boolean))];
        const sel = document.getElementById('scope-select');
        sel.innerHTML = towns.map(t => `<option>${t}</option>`).join('');
        if (!towns.includes(scopeVal)) scopeVal = towns[0] || '';
        sel.value = scopeVal;
        renderTownView(scopeVal);
    } else {
        scope.style.display = 'flex';
        document.getElementById('scope-label').textContent = '社区';
        const villages = [...new Set(trackPkgs().map(x => x.t.village).filter(Boolean))];
        const sel = document.getElementById('scope-select');
        sel.innerHTML = villages.map(v => `<option>${v}</option>`).join('');
        if (!villages.includes(scopeVal)) scopeVal = villages[0] || '';
        sel.value = scopeVal;
        renderVillageView(scopeVal);
    }
}

function renderDistrictView() {
    const towns = {};
    trackPkgs().forEach(x => { const k = x.t.town || '-'; (towns[k] = towns[k] || []).push(x); });
    const names = Object.keys(towns);
    const body = document.getElementById('track-body');
    if (!names.length) {
        body.innerHTML = '<div class="empty-tip"><i class="fa-solid fa-route"></i>暂无已下发的任务包</div>';
        return;
    }
    let html = `<table class="data-table"><thead><tr>
        <th style="width:220px;">镇/街道 / 社区</th><th>任务包</th><th>隐患房屋</th><th>子任务完成</th><th>完成率</th><th>子任务状态分布</th>
        </tr></thead><tbody>`;
    names.forEach(tn => {
        const list = towns[tn];
        const m = groupMetrics(list);
        const open = expandedTowns.has(tn);
        html += `<tr class="town-row" onclick="toggleTown('${tn}')">
            <td><i class="fa-solid fa-chevron-${open ? 'down' : 'right'}" style="color:var(--text-sub);margin-right:6px;"></i><b>${esc(tn)}</b></td>
            <td>${list.length} 个</td><td>${m.houses} 栋</td>
            <td>${m.st.total ? m.st.done + ' / ' + m.st.total : '-'}</td>
            <td>${progressCell(m.st.done, m.st.total)}</td>
            <td>${statusTags(m.allSubs) || '<span style="color:var(--text-sub);">待分解</span>'}</td>
        </tr>`;
        if (open) {
            const byVillage = {};
            list.forEach(x => { const k = x.t.village || '-'; (byVillage[k] = byVillage[k] || []).push(x); });
            Object.keys(byVillage).forEach(vn => {
                const vm = groupMetrics(byVillage[vn]);
                html += `<tr class="village-row">
                    <td>${esc(vn)}</td>
                    <td>${byVillage[vn].length} 个</td><td>${vm.houses} 栋</td>
                    <td>${vm.st.total ? vm.st.done + ' / ' + vm.st.total : '-'}</td>
                    <td>${progressCell(vm.st.done, vm.st.total)}</td>
                    <td>${statusTags(vm.allSubs) || '<span style="color:var(--text-sub);">待分解</span>'}</td>
                </tr>`;
            });
        }
    });
    html += '</tbody></table>';
    body.innerHTML = html;
}

function renderTownView(town) {
    const rows = trackPkgs().filter(x => x.t.town === town);
    const byVillage = {};
    rows.forEach(x => { const k = x.t.village || '-'; (byVillage[k] = byVillage[k] || []).push(x); });
    const names = Object.keys(byVillage);
    const body = document.getElementById('track-body');
    if (!names.length) {
        body.innerHTML = '<div class="empty-tip"><i class="fa-solid fa-route"></i>该镇/街道暂无已下发的任务包</div>';
        return;
    }
    let html = `<table class="data-table"><thead><tr>
        <th>社区</th><th>任务包</th><th>隐患房屋</th><th>子任务完成</th><th>完成率</th><th>子任务状态分布</th>
        </tr></thead><tbody>`;
    names.forEach(vn => {
        const m = groupMetrics(byVillage[vn]);
        html += `<tr>
            <td><b>${esc(vn)}</b></td>
            <td>${byVillage[vn].length} 个</td><td>${m.houses} 栋</td>
            <td>${m.st.total ? m.st.done + ' / ' + m.st.total : '-'}</td>
            <td>${progressCell(m.st.done, m.st.total)}</td>
            <td>${statusTags(m.allSubs) || '<span style="color:var(--text-sub);">待分解</span>'}</td>
        </tr>`;
    });
    html += '</tbody></table>';
    body.innerHTML = html;
}

function renderVillageView(village) {
    const rows = trackPkgs().filter(x => x.t.village === village);
    const body = document.getElementById('track-body');
    let html = `<table class="data-table"><thead><tr>
        <th>房屋地址</th><th>户主</th><th>风险等级</th><th>所属子任务</th><th>责任人</th><th>处置方式</th><th>完成时限</th><th>状态</th>
        </tr></thead><tbody>`;
    let count = 0;
    rows.forEach(({ p, t }) => {
        const subs = p.subTasks || [];
        if (!subs.length) {
            count++;
            html += `<tr><td colspan="8" style="color:var(--text-sub);"><i class="fa-solid fa-box-open" style="margin-right:6px;"></i>任务包「${esc(t.name)}」已于 ${esc(p.dispatchTime || '-')} 下发至 ${esc(p.receiverName || '-')}，待接收单位分解到户</td></tr>`;
            return;
        }
        subs.forEach(s => {
            (s.houseNos || []).forEach((no, i) => {
                count++;
                const h = getHouseRecord(no) || {};
                // 风险等级优先取当前档案；已验收房屋档案风险已消除，回落到下发时任务快照
                let lv = houseRiskLevel(h);
                if (!lv) lv = houseRiskLevel((t.selectedProjects || []).find(x => x.houseNo === no));
                const owner = h.owner || (s.role === '户主' ? s.person : '') || '-';
                const addr = h.address || (s.houseNames || [])[i] || no;
                html += `<tr>
                    <td>${esc(addr)}</td>
                    <td>${esc(owner)}</td>
                    <td>${lv === 'red' ? '<span class="dist-badge red">疑似危房</span>' : lv === 'yellow' ? '<span class="dist-badge yellow">疑似一般损坏房</span>' : '-'}</td>
                    <td>${esc(s.name)}</td>
                    <td>${esc(s.person || '-')} <span style="color:var(--text-sub);font-size:12px;">${esc(s.role || '')}</span></td>
                    <td>${esc(s.method || '-')}</td>
                    <td>${esc(s.deadline || '-')}</td>
                    <td><span class="status-tag ${s.status === '已完成' ? 'done' : s.status === '待接收' ? 'pending' : 'doing'}">${esc(s.status || '-')}</span></td>
                </tr>`;
            });
        });
    });
    if (!count) html += `<tr><td colspan="8" style="text-align:center;color:var(--text-sub);padding:40px 0;">该村暂无已下发的任务包</td></tr>`;
    html += '</tbody></table>';
    body.innerHTML = html;
}

function toggleTown(tn) {
    if (expandedTowns.has(tn)) expandedTowns.delete(tn); else expandedTowns.add(tn);
    renderTrackView();
}

document.querySelectorAll('.view-tab').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.view-tab').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    curView = b.dataset.view;
    document.getElementById('view-list').style.display = curView === 'list' ? 'block' : 'none';
    document.getElementById('view-track').style.display = curView === 'track' ? 'block' : 'none';
    if (curView === 'track') { scopeVal = ''; renderTrackView(); }
}));
document.querySelectorAll('.role-btn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.role-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    curRole = b.dataset.role;
    scopeVal = '';
    renderTrackView();
}));
document.getElementById('scope-select').addEventListener('change', e => { scopeVal = e.target.value; renderTrackView(); });

function goDetail(id) { window.location.href = 'urban-hazard-dispatch-detail.html?id=' + id; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

document.querySelectorAll('.tab-item').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tab-item').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    curTab = b.dataset.tab;
    applyFilter();
}));

function init() {
    initHouseArchSeed();
    ensureAuditSeedTasks();
    loadPackages();
    loadTasks();
    const towns = [...new Set(tasks.map(t => t.town).filter(Boolean))];
    document.getElementById('f-town').innerHTML = '<option value="">全部</option>' + towns.map(t => `<option>${t}</option>`).join('');
    renderKPI();
    applyFilter();
}
init();
</script>
</body>
</html>
