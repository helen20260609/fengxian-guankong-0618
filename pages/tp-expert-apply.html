<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专家在线申请 - 第三方服务机构</title>
<link rel="stylesheet" href="./all.min.css">
<script src="../js/third-party-data.js"></script>
<script src="../js/tp-friendly-tip.js"></script>
<style>
:root {
    --primary: #1a73e8; --primary-dark: #1557b0; --primary-light: #e8f0fe;
    --secondary: #0097a7; --danger: #d93025; --warning: #e37400; --success: #1e8e3e;
    --bg-dark: #f0f2f5; --bg-card: #ffffff; --bg-hover: #e8eaed;
    --text-primary: #202124; --text-secondary: #5f6368; --border: #dadce0; --shadow: rgba(0,0,0,0.08);
    --input-bg: #ffffff; --input-border: #dadce0;
}
:root[data-theme="dark"] {
    --primary: #1e6fdb; --primary-dark: #1557b0; --primary-light: #e8f1fd;
    --secondary: #00b4d8; --danger: #ef4444; --warning: #f59e0b; --success: #10b981;
    --bg-dark: #0a1628; --bg-card: #112240; --bg-hover: #1a2f4a;
    --text-primary: #e2e8f0; --text-secondary: #94a3b8; --border: #1e3a5f; --shadow: rgba(0,0,0,0.3);
    --input-bg: rgba(255,255,255,0.05); --input-border: #1e3a5f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: var(--bg-dark); color: var(--text-primary); margin: 0; padding: 20px; }
.page-header { max-width: 900px; margin: 0 auto 20px; }
.page-title { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.page-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
.form-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; max-width: 900px; margin: 0 auto 20px; overflow: hidden; }
.form-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.form-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.form-body { padding: 20px; }
.form-section { margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.form-section:last-child { border-bottom: none; margin-bottom: 0; }
.form-section-title { font-size: 14px; font-weight: 600; color: var(--primary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 16px; }
.form-row:last-child { margin-bottom: 0; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group.full-width { grid-column: 1 / -1; }
.form-group label { font-size: 13px; color: var(--text-primary); font-weight: 500; }
.form-group label .required { color: var(--danger); margin-left: 2px; }
.form-group input, .form-group select, .form-group textarea {
    padding: 10px 12px; border: 1px solid var(--input-border); border-radius: 8px; background: var(--input-bg); color: var(--text-primary); font-size: 13px; outline: none; transition: border-color 0.2s; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
.form-group textarea { resize: vertical; min-height: 80px; }
.file-upload { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--input-border); border-radius: 8px; background: var(--input-bg); }
.file-upload input[type="file"] { display: none; }
.file-upload-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-card); color: var(--text-primary); font-size: 13px; cursor: pointer; transition: all 0.2s; }
.file-upload-btn:hover { border-color: var(--primary); color: var(--primary); }
.file-upload-text { font-size: 13px; color: var(--text-secondary); }
.form-hint { font-size: 12px; color: var(--text-secondary); }
.form-actions { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
.btn { padding: 10px 24px; border-radius: 6px; font-size: 14px; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-primary); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.step-bar { display: flex; align-items: center; justify-content: space-between; max-width: 700px; margin: 0 auto 24px; }
.step-item { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 13px; }
.step-dot { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-hover); display: flex; align-items: center; justify-content: center; font-weight: 600; }
.step-item.active .step-dot { background: var(--primary); color: #fff; }
.step-item.active { color: var(--primary); font-weight: 600; }
.success-card { text-align: center; padding: 40px 20px; display: none; }
.success-card.active { display: block; }
.success-icon { font-size: 56px; color: var(--success); margin-bottom: 16px; }
.success-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
.success-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
.success-meta { background: var(--bg-dark); border-radius: 8px; padding: 16px; display: inline-block; text-align: left; font-size: 13px; line-height: 1.8; }
</style>
</head>
<body>
<div class="page-header">
    <div class="page-title"><i class="fas fa-user-tie" style="color: var(--primary);"></i> 专家在线申请</div>
    <div class="page-subtitle">专家注册申请通过门户提交，请上传职称证书、业绩证明等附件，提交后进入审核流程，审核通过后专家信息入库。</div>
</div>

<div class="step-bar" id="stepBar">
    <div class="step-item active" data-step="1"><div class="step-dot">1</div><span>填写资料</span></div>
    <div class="step-item" data-step="2"><div class="step-dot">2</div><span>提交审核</span></div>
    <div class="step-item" data-step="3"><div class="step-dot">3</div><span>完成</span></div>
</div>

<div class="form-card" id="applyFormCard">
    <div class="form-header">
        <div class="form-title"><i class="fas fa-edit" style="color: var(--primary);"></i> 专家申请信息</div>
    </div>
    <div class="form-body">
        <div class="form-section">
            <div class="form-section-title"><i class="fas fa-user"></i> 基本信息</div>
            <div class="form-row">
                <div class="form-group"><label>姓名 <span class="required">*</span></label><input type="text" id="expertName" placeholder="请输入姓名"></div>
                <div class="form-group"><label>性别 <span class="required">*</span></label>
                    <select id="gender"><option value="">请选择</option><option>男</option><option>女</option></select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>出生日期</label><input type="date" id="birth"></div>
                <div class="form-group"><label>身份证号 <span class="required">*</span></label><input type="text" id="idCard" placeholder="请输入18位身份证号"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>联系电话 <span class="required">*</span></label><input type="text" id="phone" placeholder="请输入联系电话"></div>
                <div class="form-group"><label>电子邮箱</label><input type="email" id="email" placeholder="请输入电子邮箱"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>所在地区 <span class="required">*</span></label>
                    <select id="address">
                        <option value="">请选择所在地区</option>
                        <option>黄浦区</option><option>徐汇区</option><option>长宁区</option><option>静安区</option><option>普陀区</option>
                        <option>虹口区</option><option>杨浦区</option><option>闵行区</option><option>宝山区</option><option>嘉定区</option>
                        <option>浦东新区</option><option>金山区</option><option>松江区</option><option>青浦区</option><option>奉贤区</option><option>崇明区</option>
                    </select>
                </div>
                <div class="form-group"><label>工作单位</label><input type="text" id="workplace" placeholder="请输入工作单位，独立专家可填「独立」"></div>
            </div>
            <div class="form-row">
                <div class="form-group full-width"><label>可服务时间</label><input type="text" id="serviceTime" placeholder="如：工作日 9:00-17:00；应急随时响应"></div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-section-title"><i class="fas fa-certificate"></i> 职称信息</div>
            <div class="form-row">
                <div class="form-group"><label>职称 <span class="required">*</span></label>
                    <select id="title">
                        <option value="">请选择职称</option>
                        <option>教授级高工</option><option>高级工程师</option><option>工程师</option>
                        <option>研究员</option><option>注册结构师</option><option>助理工程师</option><option>其他</option>
                    </select>
                </div>
                <div class="form-group"><label>职称证书编号 <span class="required">*</span></label><input type="text" id="titleCertNo" placeholder="请输入职称证书编号"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>发证机构</label><input type="text" id="titleOrg" placeholder="如：住建部、上海市住建委"></div>
                <div class="form-group"><label>取得时间</label><input type="month" id="titleTime"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>从业年限（年）</label><input type="number" id="years" placeholder="请输入从业年限" min="0"></div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-section-title"><i class="fas fa-layer-group"></i> 专业信息</div>
            <div class="form-row">
                <div class="form-group"><label>专业领域 <span class="required">*</span></label>
                    <select id="domain">
                        <option value="">请选择专业领域</option>
                        <option>建筑工地</option><option>基坑</option><option>交通</option><option>玻璃幕墙</option>
                        <option>燃气</option><option>高空坠物</option><option>城镇自建房</option><option>农村自建房</option>
                    </select>
                </div>
                <div class="form-group"><label>研究方向</label><input type="text" id="direction" placeholder="如：基坑监测、房屋鉴定"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>行业专家组</label><input type="text" id="industryExpertGroup" placeholder="如：房屋安全鉴定专家组"></div>
                <div class="form-group"><label>所属机构</label>
                    <select id="orgId">
                        <option value="">独立专家（无所属机构）</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group full-width"><label>个人简介 / 主要业绩</label><textarea id="intro" rows="3" placeholder="请简要介绍从业经历、代表性项目业绩等"></textarea></div>
            </div>
        </div>

        <div class="form-section">
            <div class="form-section-title"><i class="fas fa-paperclip"></i> 附件上传</div>
            <div class="form-row">
                <div class="form-group full-width"><label>职称证书 <span class="required">*</span></label>
                    <div class="file-upload"><label class="file-upload-btn" for="titleCertFile">选择文件</label><input type="file" id="titleCertFile"><span class="file-upload-text" id="titleCertText">请上传职称证书扫描件（JPG/PNG/PDF）</span></div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group full-width"><label>业绩证明 <span class="required">*</span></label>
                    <div class="file-upload"><label class="file-upload-btn" for="achievementFile">选择文件</label><input type="file" id="achievementFile"><span class="file-upload-text" id="achievementText">请上传业绩证明材料（JPG/PNG/PDF）</span></div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group full-width"><label>其他材料</label>
                    <div class="file-upload"><label class="file-upload-btn" for="otherFile">选择文件</label><input type="file" id="otherFile"><span class="file-upload-text" id="otherText">其他证明材料（选填）</span></div>
                </div>
            </div>
            <div class="form-hint">提交的附件仅用于资格审核，审核通过后专家信息将进入专家库。</div>
        </div>

        <div class="form-actions">
            <button class="btn btn-outline" onclick="resetApplyForm()"><i class="fas fa-undo"></i> 重置</button>
            <button class="btn btn-primary" onclick="submitApply()"><i class="fas fa-paper-plane"></i> 提交审核</button>
        </div>
    </div>
</div>

<div class="form-card success-card" id="successCard">
    <div class="success-icon"><i class="fas fa-check-circle"></i></div>
    <div class="success-title">提交成功</div>
    <div class="success-desc">您的专家注册申请已提交，请使用以下信息查询审核进度。</div>
    <div class="success-meta" id="successMeta"></div>
    <div class="form-actions" style="border-top:none; justify-content:center;">
        <a href="#" id="progressLink" class="btn btn-primary" style="text-decoration:none;"><i class="fas fa-search"></i> 查询审核进度</a>
        <a href="tp-overview.html" class="btn btn-outline" style="text-decoration:none;"><i class="fas fa-arrow-left"></i> 返回机构名录</a>
    </div>
</div>

<script>
(function(){
    var s = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', s);
})();
window.addEventListener('message', function(e) {
    if (e.data && e.data.action === 'setTheme') { document.documentElement.setAttribute('data-theme', e.data.theme); localStorage.setItem('theme', e.data.theme); }
});

function bindFileUpload(inputId, textId, defaultText) {
    var input = document.getElementById(inputId);
    var text = document.getElementById(textId);
    if (!input || !text) return;
    input.addEventListener('change', function() { text.textContent = input.files.length ? input.files[0].name : defaultText; });
}
var DEFAULT_TITLE_CERT_TEXT = '请上传职称证书扫描件（JPG/PNG/PDF）';
var DEFAULT_ACHIEVE_TEXT = '请上传业绩证明材料（JPG/PNG/PDF）';
var DEFAULT_OTHER_TEXT = '其他证明材料（选填）';
bindFileUpload('titleCertFile', 'titleCertText', DEFAULT_TITLE_CERT_TEXT);
bindFileUpload('achievementFile', 'achievementText', DEFAULT_ACHIEVE_TEXT);
bindFileUpload('otherFile', 'otherText', DEFAULT_OTHER_TEXT);

// 加载机构列表供选择所属机构
(function initOrgOptions() {
    var sel = document.getElementById('orgId');
    if (!sel || typeof getAllOrgs !== 'function') return;
    getAllOrgs().forEach(function(o) {
        var opt = document.createElement('option');
        opt.value = o.orgId;
        opt.textContent = o.orgName;
        sel.appendChild(opt);
    });
})();

function getVal(id) { return document.getElementById(id).value.trim(); }
function pad(n) { return String(n).padStart(2, '0'); }
function nowStrLocal() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function getFileName(id) { var input = document.getElementById(id); return input && input.files.length ? input.files[0].name : ''; }

function submitApply() {
    var name = getVal('expertName');
    var gender = getVal('gender');
    var idCard = getVal('idCard');
    var phone = getVal('phone');
    var address = getVal('address');
    var title = getVal('title');
    var titleCertNo = getVal('titleCertNo');
    var domain = getVal('domain');
    var titleCertFile = getFileName('titleCertFile');
    var achievementFile = getFileName('achievementFile');

    if (!name || !gender || !idCard || !phone || !address || !title || !titleCertNo || !domain) {
        alert('请填写所有必填项');
        return;
    }
    if (!/^1\d{10}$/.test(phone)) {
        alert('请输入正确的11位手机号码');
        return;
    }
    if (!/^\d{17}[\dXx]$/.test(idCard)) {
        alert('请输入正确的18位身份证号');
        return;
    }
    if (!titleCertFile || !achievementFile) {
        alert('请上传职称证书和业绩证明附件');
        return;
    }

    var orgId = getVal('orgId');
    var orgName = '';
    if (orgId && typeof getOrgById === 'function') {
        var org = getOrgById(orgId);
        if (org) orgName = org.orgName;
    }
    var workplace = getVal('workplace') || orgName || '独立';

    var applicationId = 'EXA-' + new Date().getFullYear() + pad(new Date().getMonth()+1) + pad(new Date().getDate()) + '-' + String(Math.floor(Math.random() * 9000) + 1000);

    var application = {
        applicationId: applicationId,
        status: '待审核',
        submitTime: nowStrLocal(),
        basic: {
            name: name,
            gender: gender,
            birth: getVal('birth'),
            idCard: idCard,
            phone: phone,
            email: getVal('email'),
            address: address,
            workplace: workplace,
            serviceTime: getVal('serviceTime'),
            title: title,
            titleCertNo: titleCertNo,
            titleOrg: getVal('titleOrg'),
            titleTime: getVal('titleTime'),
            years: getVal('years'),
            domain: domain,
            direction: getVal('direction'),
            industryExpertGroup: getVal('industryExpertGroup'),
            orgId: orgId,
            intro: getVal('intro')
        },
        attachments: {
            titleCert: { name: titleCertFile },
            achievement: { name: achievementFile },
            other: { name: getFileName('otherFile') }
        },
        auditHistory: []
    };

    if (typeof submitExpertApplication === 'function') {
        try {
            submitExpertApplication(application);
        } catch (err) {
            alert(err.message || '提交失败');
            return;
        }
    } else {
        var data = JSON.parse(localStorage.getItem('thirdPartyData') || '{}');
        if (!data.expertApplications) data.expertApplications = [];
        data.expertApplications.push(application);
        localStorage.setItem('thirdPartyData', JSON.stringify(data));
    }

    document.getElementById('applyFormCard').style.display = 'none';
    document.getElementById('successCard').classList.add('active');
    document.querySelectorAll('.step-item').forEach(function(item) { item.classList.remove('active'); });
    document.querySelector('.step-item[data-step="3"]').classList.add('active');
    var progressUrl = 'tp-audit.html?tab=progress&expertName=' + encodeURIComponent(name) + '&idCard=' + encodeURIComponent(idCard);
    document.getElementById('progressLink').href = progressUrl;
    document.getElementById('successMeta').innerHTML =
        '<div><strong>申请编号：</strong>' + applicationId + '</div>' +
        '<div><strong>姓名：</strong>' + name + '</div>' +
        '<div><strong>身份证号：</strong>' + idCard + '</div>' +
        '<div><strong>提交时间：</strong>' + application.submitTime + '</div>' +
        '<div><strong>当前状态：</strong>待审核</div>' +
        '<div><a href="' + progressUrl + '" style="color:var(--primary);text-decoration:none;"><i class="fas fa-search"></i> 查询审核进度</a></div>';
}

function resetApplyForm() {
    showConfirm('确定要重置所有内容吗？', '已填写的信息和已选择的附件将被清空。', '重 置').then(function(ok) {
        if (!ok) return;
        document.querySelectorAll('#applyFormCard input, #applyFormCard select, #applyFormCard textarea').forEach(function(el) {
            if (el.tagName === 'SELECT' && !el.querySelector('option[value=""]')) { el.selectedIndex = 0; }
            else { el.value = ''; }
        });
        document.getElementById('titleCertText').textContent = DEFAULT_TITLE_CERT_TEXT;
        document.getElementById('achievementText').textContent = DEFAULT_ACHIEVE_TEXT;
        document.getElementById('otherText').textContent = DEFAULT_OTHER_TEXT;
    });
}
</script>
</body>
</html>
