<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农村自建房 - 全要素档案详情</title>
    <link rel="stylesheet" href="./all.min.css">
    <script src="../js/third-party-data.js"></script>
    <script src="../js/house-arch-data.js"></script>
    <style>
        :root {
            --primary: #1a73e8; --primary-dark: #1557b0; --primary-light: #e8f0fe;
            --danger: #d93025; --major: #f57c00; --warning: #f9ab00; --safe: #1e8e3e;
            --text-primary: #202124; --text-secondary: #5f6368; --border: #e8eaed;
            --bg-dark: #f5f7fa; --bg-card: #ffffff; --bg-hover: #f0f2f5;
            --shadow: rgba(0,0,0,0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif;
            background: var(--bg-dark); color: var(--text-primary); min-height: 100vh;
        }
        .page-wrapper { max-width: none; margin: 0 auto; padding: 16px; }

        /* 顶部 */
        .topbar {
            background: #fff; border-radius: 8px; padding: 12px 16px;
            box-shadow: 0 2px 8px var(--shadow); margin-bottom: 12px;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
        }
        .topbar-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .topbar-back {
            display: flex; align-items: center; gap: 4px; padding: 6px 12px;
            border: 1px solid var(--border); border-radius: 4px; background: #fff;
            color: var(--text-primary); font-size: 13px; cursor: pointer; text-decoration: none;
        }
        .topbar-back:hover { background: var(--bg-hover); }
        .topbar-title-wrap { display: flex; align-items: baseline; justify-content: space-between; flex: 1; gap: 16px; }
        .topbar-title { font-size: 16px; font-weight: 600; }
        .topbar-sub { font-size: 12px; color: var(--text-secondary); }
        .topbar-actions { display: flex; gap: 8px; align-items: center; }
        .topbar-btn {
            display: flex; align-items: center; gap: 4px; padding: 6px 12px;
            border-radius: 4px; font-size: 12px; cursor: pointer; border: 1px solid var(--border);
            background: #fff; color: var(--text-primary);
        }
        .topbar-btn:hover { background: var(--bg-hover); }

        /* 检索栏 */
        .filter-bar {
            background: #fff; border-radius: 8px; padding: 12px 16px;
            box-shadow: 0 2px 8px var(--shadow); margin-bottom: 12px;
            display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
        }
        .filter-bar label { font-size: 12px; color: var(--text-secondary); }
        .filter-select {
            padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px;
            font-size: 13px; min-width: 120px; background: #fff;
        }
        .filter-btn {
            padding: 6px 14px; border: none; border-radius: 4px; background: var(--primary); color: #fff; font-size: 13px; cursor: pointer;
        }
        /* 状态卡 */
        .status-panel {
            background: #fff; border-radius: 8px; padding: 16px 20px;
            box-shadow: 0 2px 8px var(--shadow); margin-bottom: 12px;
            display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        }
        .status-cell { display: flex; flex-direction: column; gap: 6px; min-width: 120px; }
        .status-cell.full { flex: 1; }
        .status-label { font-size: 12px; color: var(--text-secondary); }
        .status-value { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .status-badge {
            display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px;
            font-size: 12px; font-weight: 500; width: fit-content;
        }
        .status-badge.danger { background: #fce8e6; color: var(--danger); }
        .status-badge.major { background: #fff3e0; color: var(--major); }
        .status-badge.warning { background: #fff8e1; color: #f9a825; }
        .status-badge.safe { background: #e6f4ea; color: var(--safe); }
        .status-badge.info { background: var(--primary-light); color: var(--primary); }

        /* 主内容：左树右内容 */
        .main-body { display: flex; gap: 12px; align-items: flex-start; }
        .sidebar {
            width: 240px; flex-shrink: 0; background: #fff; border-radius: 8px;
            box-shadow: 0 2px 8px var(--shadow); overflow: hidden; position: sticky; top: 16px; align-self: flex-start;
        }
        .sidebar-header {
            padding: 14px 16px; font-size: 14px; font-weight: 600; color: var(--text-primary);
            border-bottom: 1px solid var(--border); background: #fafbfc;
        }
        .sidebar-menu { padding: 8px; }
        .sidebar-item {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            padding: 9px 12px; border-radius: 6px; cursor: pointer; transition: all 0.15s;
            margin-bottom: 3px; font-size: 13px; color: var(--text-primary);
        }
        .sidebar-item:hover { background: var(--primary-light); color: var(--primary); }
        .sidebar-item.active { background: var(--primary-light); color: var(--primary); font-weight: 500; }
        .sidebar-item-left { display: flex; align-items: center; gap: 8px; }
        .sidebar-item i { width: 16px; text-align: center; color: inherit; }
        .sidebar-tag {
            font-size: 10px; padding: 1px 6px; border-radius: 10px; white-space: nowrap;
            background: #f0f2f5; color: var(--text-secondary);
        }
        .sidebar-item.active .sidebar-tag { background: rgba(26,115,232,0.12); color: var(--primary); }
        .sidebar-divider { height: 1px; background: var(--border); margin: 6px 0; }
        /* rural 独有（house-arch 无）字段/模块：绿色叠加标注 */
        .rural-only, .info-value.rural-only { color: var(--safe) !important; font-weight: 600; }
        .sidebar-item.rural-only-item .sidebar-item-left { color: var(--safe); font-weight: 600; }
        .sidebar-item.rural-only-item .sidebar-tag { background: #e6f4ea; color: var(--safe); }
        .content-tab.rural-only-tab { color: var(--text-secondary); font-weight: 400; }

        .content-area { flex: 1; min-width: 0; }
        .content-card {
            background: #fff; border-radius: 8px; box-shadow: 0 2px 8px var(--shadow); overflow: hidden; margin-bottom: 12px;
        }
        .content-card-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 20px; border-bottom: 1px solid var(--border); background: #fafbfc;
        }
        .content-card-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
        .content-card-title i { color: var(--primary); }
        .content-body { padding: 18px 20px; }

        /* 标签页 */
        .content-tabs {
            display: flex; gap: 8px; padding: 12px 20px 0; border-bottom: 1px solid var(--border); background: #fff; flex-wrap: wrap;
        }
        .content-tab {
            display: flex; align-items: center; gap: 6px; padding: 8px 14px;
            font-size: 13px; color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
            border-radius: 6px 6px 0 0; border: 1px solid transparent; border-bottom: none; background: transparent;
            margin-bottom: -1px;
        }
        .content-tab:hover { color: var(--primary); background: var(--primary-light); }
        .content-tab.active { color: var(--primary); font-weight: 500; background: #fff; border-color: var(--border); border-bottom-color: #fff; }
        .content-tab-count {
            font-size: 11px; padding: 1px 7px; border-radius: 10px;
            background: #f0f2f5; color: var(--text-secondary); margin-left: 4px;
        }
        .content-tab.active .content-tab-count { background: var(--primary-light); color: var(--primary); }

        /* 信息网格 */
        .info-section-title { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; margin-bottom: 14px; color: var(--text-primary); }
        .info-section-title i { color: var(--primary); }
        .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 16px; }
        .info-grid-2col { grid-template-columns: repeat(2, 1fr); }
        .info-grid.info-grid-2col { grid-template-columns: repeat(2, 1fr); }
        .info-grid.info-grid-2col .info-item { display: flex; flex-direction: row; align-items: baseline; gap: 12px; }
        .info-grid.info-grid-2col .info-label { width: 140px; flex-shrink: 0; color: var(--text-secondary); font-size: 13px; }
        .info-grid.info-grid-2col .info-value { flex: 1; min-width: 0; font-size: 14px; color: var(--text-primary); font-weight: 500; }
        .info-grid.info-grid-2col .info-item.full-width { grid-column: 1 / -1; }
        .info-item { display: flex; flex-direction: column; gap: 4px; }
        .info-label { font-size: 12px; color: var(--text-secondary); }
        .info-value { font-size: 14px; color: var(--text-primary); font-weight: 500; line-height: 1.4; }
        .info-value.empty { color: #bdc1c6; font-weight: 400; }
        .info-grid-table .info-item { flex-direction: row; align-items: baseline; gap: 12px; }
        .info-grid-table .info-label { width: 140px; flex-shrink: 0; }
        .info-grid-table .info-value { flex: 1; min-width: 0; }
        .info-grid-table .info-item.full-width { grid-column: 1 / -1; }

        /* 表格 */
        .table-section-title { font-size: 14px; font-weight: 600; margin: 20px 0 12px; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
        .table-section-title::before { content: ''; display: inline-block; width: 3px; height: 14px; background: var(--primary); border-radius: 2px; }
        .arch-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .arch-table th, .arch-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
        .arch-table th { background: #fafbfc; color: var(--text-secondary); font-weight: 500; font-size: 12px; white-space: nowrap; }
        .arch-table td { color: var(--text-primary); }
        .arch-table tr:last-child td { border-bottom: none; }

        /* 照片网格 */
        .photo-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .photo-grid img { width: 96px; height: 72px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; }
        .photo-empty { color: var(--text-secondary); font-size: 13px; padding: 8px 0; }

        /* 时间轴 - 横向滚动 */
        .timeline-wrap { position: relative; margin-top: 8px; }
        .timeline { position: relative; display: flex; gap: 0; overflow-x: auto; padding: 8px 4px 10px; scrollbar-width: thin; }
        .timeline::-webkit-scrollbar { height: 6px; }
        .timeline::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .timeline::before { content: ''; position: absolute; left: 4px; top: 47px; height: 2px; width: calc(100% - 8px); background: var(--border); }
        .tl-node { position: relative; flex: 0 0 220px; padding: 64px 16px 0 0; }
        .tl-node::before { content: ''; position: absolute; left: 0; top: 42px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--primary-light); z-index: 1; }
        .tl-node:first-child::before { background: #fff; border-color: var(--primary); }
        .tl-date { position: absolute; top: 6px; left: 0; font-size: 12px; color: #fff; background: var(--primary); padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
        .tl-type-tag { display: inline-block; font-size: 11px; color: var(--primary); background: var(--primary-light); padding: 1px 8px; border-radius: 8px; margin-bottom: 4px; }
        .tl-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tl-body { font-size: 12px; color: var(--text-secondary); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .tl-scroll-hint { text-align: right; font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

        /* 照片查看器 */
        .photo-viewer-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 10000; justify-content: center; align-items: center;
        }
        .photo-viewer-overlay.open { display: flex; }
        .photo-viewer-box { position: relative; max-width: 90%; max-height: 90%; }
        .photo-viewer-box img { max-width: 100%; max-height: 90vh; border-radius: 4px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .photo-viewer-close { position: absolute; top: -40px; right: 0; width: 32px; height: 32px; border: none; border-radius: 50%; background: rgba(255,255,255,0.9); font-size: 20px; cursor: pointer; color: #333; }

        .table-scroll { width: 100%; overflow-x: auto; margin-bottom: 16px; }
        .table-scroll .record-list { margin-bottom: 0; }
        .record-list { width: 100%; border-collapse: collapse; font-size: 13px; }
        .record-list th, .record-list td { padding: 0 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; white-space: nowrap; box-sizing: border-box; }
        .record-list th { background: #fafbfc; color: var(--text-secondary); font-weight: 500; font-size: 12px; height: 40px; }
        .record-list td { height: 40px; }
        .record-list tr { cursor: pointer; transition: background 0.15s; }
        .record-list tr:hover { background: var(--bg-hover); }
        .record-list tr.active { background: var(--primary-light); }
        .record-list .actions { width: 1px; text-align: center; white-space: nowrap; vertical-align: middle; padding: 0; font-size: 12px; }
        .record-list .actions .view-link { display: block; color: var(--primary); cursor: pointer; font-size: 12px; line-height: 40px; height: 40px; padding: 0 12px; text-decoration: none; }
        .record-list .actions .view-link:hover { text-decoration: underline; }
        .record-list .actions .task-link { display: block; color: var(--success); cursor: pointer; font-size: 12px; line-height: 40px; height: 40px; padding: 0 12px; text-decoration: none; }
        .record-list .actions .task-link:hover { text-decoration: underline; }

        .record-list .tag { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 10px; font-size: 11px; line-height: 22px; height: 22px; vertical-align: middle; white-space: nowrap; }
        .record-list .tag.primary { background: var(--primary); color: #fff; font-weight: 600; box-shadow: 0 0 0 3px rgba(26,115,232,.15); }
        .record-list .tag.success { background: #e6f4ea; color: var(--safe); }
        .record-list .tag.warning { background: #fff8e1; color: #f9a825; }
        .record-list .tag.danger { background: #fce8e6; color: var(--danger); }
        .record-list .tag.info { background: #f0f2f5; color: var(--text-secondary); }
        .record-empty { color: var(--text-secondary); font-size: 13px; padding: 12px 0; }
        .record-section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .record-section-title span { font-size: 14px; font-weight: 600; }
        .record-add-btn {
            display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--primary);
            background: #fff; color: var(--primary); font-size: 12px; cursor: pointer;
        }
        .record-add-btn:hover { background: var(--primary-light); }
        .record-detail-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .record-detail-header .title { font-size: 14px; font-weight: 600; }
        .record-detail-header .meta { font-size: 12px; color: var(--text-secondary); }

        /* 通用编辑弹窗 */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
            z-index: 20000; justify-content: center; align-items: center; padding: 24px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #fff; border-radius: 10px; width: 720px; max-width: 100%;
            max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,0.25);
        }
        .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .modal-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .modal-close { border: none; background: none; font-size: 22px; cursor: pointer; color: var(--text-secondary); line-height: 1; }
        .modal-close:hover { color: var(--danger); }
        .modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); }
        .modal-btn { padding: 8px 18px; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .modal-btn:hover { background: var(--bg-hover); }
        .modal-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .modal-btn.primary:hover { background: var(--primary-dark, #1558b0); }
        /* 记录选择浮层 */
        .record-picker { width: 460px; }
        .record-picker-list { display: flex; flex-direction: column; gap: 8px; }
        .record-picker-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.15s; background: #fff; }
        .record-picker-item:hover { border-color: var(--primary); background: var(--primary-light); }
        .record-picker-item .rp-icon { width: 34px; height: 34px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
        .record-picker-item .rp-icon.mgmt { background: #e6f4ea; color: #188038; }
        .record-picker-item .rp-icon.prj { background: #fef7e0; color: #b06000; }
        .record-picker-item .rp-main { flex: 1; min-width: 0; }
        .record-picker-item .rp-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
        .record-picker-item .rp-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .record-picker-item .rp-arrow { color: var(--text-secondary); font-size: 12px; }
        .record-picker-group { font-size: 12px; color: var(--text-secondary); margin: 10px 0 2px; font-weight: 600; }
        .record-picker-group:first-child { margin-top: 0; }
        /* 编辑表单 */
        .edit-form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 16px; }
        .edit-form-item { display: flex; flex-direction: column; gap: 4px; }
        .edit-form-item.full-width { grid-column: 1 / -1; }
        .edit-form-label { font-size: 12px; color: var(--text-secondary); }
        .edit-form-label .req { color: var(--danger); margin-left: 2px; }
        .edit-form-item input[type="text"], .edit-form-item input[type="date"], .edit-form-item input[type="number"],
        .edit-form-item select, .edit-form-item textarea {
            padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
            font-family: inherit; color: var(--text-primary); background: #fff; box-sizing: border-box; width: 100%;
        }
        .edit-form-item textarea { min-height: 64px; resize: vertical; }
        .edit-form-item input:focus, .edit-form-item select:focus, .edit-form-item textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,115,232,0.12); }
        /* 编辑表单-文件/图片上传 */
        .edit-files-wrap { display:flex; flex-direction:column; gap:8px; }
        .edit-files-list { display:flex; flex-wrap:wrap; gap:8px; }
        .edit-file-thumb { position:relative; width:64px; height:64px; border:1px solid var(--border); border-radius:6px; overflow:hidden; background:#f5f5f5; flex:none; }
        .edit-file-thumb img { width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
        .edit-file-thumb .file-badge { display:flex; align-items:center; justify-content:center; width:100%; height:100%; font-size:24px; color:var(--text-secondary); cursor:pointer; }
        .edit-file-thumb .file-del { position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:rgba(0,0,0,0.55); color:#fff; border:none; font-size:11px; line-height:18px; text-align:center; cursor:pointer; padding:0; }
        .edit-file-thumb .file-del:hover { background:var(--danger); }
        .edit-file-add { display:inline-flex; align-items:center; justify-content:center; gap:4px; width:64px; height:64px; border:1px dashed var(--border); border-radius:6px; color:var(--text-secondary); font-size:12px; cursor:pointer; flex:none; background:#fafafa; flex-direction:column; }
        .edit-file-add:hover { border-color:var(--primary); color:var(--primary); background:var(--primary-light); }
        .edit-file-add i { font-size:18px; }
        /* 附件材料竖向 tab */
        .edit-files-tabs { border:1px solid var(--border); border-radius:8px; overflow:hidden; display:flex; align-items:stretch; }
        .edit-files-tabs-bar { display:flex; flex-direction:column; gap:2px; overflow-y:auto; max-height:420px; background:#f7f8fa; padding:8px 6px; border-right:1px solid var(--border); flex:none; width:118px; }
        .edit-files-tab { display:flex; align-items:center; justify-content:space-between; gap:6px; padding:8px 10px; font-size:12px; color:var(--text-secondary); cursor:pointer; border:1px solid transparent; border-right:none; border-radius:6px 0 0 6px; white-space:nowrap; background:transparent; }
        .edit-files-tab:hover { color:var(--primary); background:var(--primary-light); }
        .edit-files-tab.active { color:var(--primary); font-weight:600; background:#fff; border-color:var(--border); border-right-color:#fff; margin-right:-1px; }
        .edit-files-tab .cnt { min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:#e0e3e7; color:var(--text-secondary); font-size:10px; line-height:16px; text-align:center; flex:none; }
        .edit-files-tab.active .cnt { background:var(--primary); color:#fff; }
        .edit-files-tab .cnt.has { background:#e6f4ea; color:#188038; font-weight:600; }
        .edit-files-tab.active .cnt.has { background:#188038; color:#fff; }
        .edit-files-pane { padding:14px; display:none; flex:1; min-width:0; }
        .edit-files-pane.active { display:block; }
        .edit-files-pane .pane-label { font-size:12px; color:var(--text-secondary); margin-bottom:8px; }
        .card-edit-btn {
            display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 4px;
            border: 1px solid var(--primary); background: #fff; color: var(--primary); font-size: 12px; cursor: pointer;
        }
        .card-edit-btn:hover { background: var(--primary-light); }

        @media (max-width: 900px) {
            .main-body { flex-direction: column; }
            .sidebar { width: 100%; position: static; }
            .info-grid { grid-template-columns: repeat(2, 1fr); }
            .edit-form-grid { grid-template-columns: 1fr; }
            .modal-box { width: 100%; }
        }
        @media (max-width: 600px) {
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="photo-viewer-overlay" id="photoViewerOverlay" onclick="closePhotoViewer()">
        <div class="photo-viewer-box" onclick="event.stopPropagation()">
            <button class="photo-viewer-close" onclick="closePhotoViewer()">×</button>
            <img id="photoViewerImage" src="" alt="照片">
        </div>
    </div>

    <!-- 记录选择浮层 -->
    <div class="modal-overlay" id="recordPickerModal" onclick="if(event.target===this)closeRecordPicker()">
        <div class="modal-box record-picker">
            <div class="modal-header">
                <div class="modal-title"><i class="fas fa-list"></i> 选择要编辑的记录</div>
                <button class="modal-close" onclick="closeRecordPicker()">×</button>
            </div>
            <div class="modal-body"><div class="record-picker-list" id="recordPickerList"></div></div>
        </div>
    </div>

    <!-- 通用编辑弹窗 -->
    <div class="modal-overlay" id="editModal" onclick="if(event.target===this)closeEditModal()">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title"><i class="fas fa-edit"></i> <span id="editModalTitle">编辑</span></div>
                <button class="modal-close" onclick="closeEditModal()">×</button>
            </div>
            <div class="modal-body"><div class="edit-form-grid" id="editModalForm"></div></div>
            <div class="modal-footer">
                <button class="modal-btn" onclick="closeEditModal()">取消</button>
                <button class="modal-btn primary" onclick="saveEditModal()"><i class="fas fa-save"></i> 保存</button>
            </div>
        </div>
    </div>

    <div class="page-wrapper">
        <div class="topbar">
            <div class="topbar-left">
                <div class="topbar-title-wrap">
                    <div class="topbar-title" id="topbarTitle">农村自建房全要素档案</div>
                    <div class="topbar-sub" id="topbarSub">房屋编号：—</div>
                </div>
            </div>
        </div>

        <div class="status-panel" id="statusPanel"></div>

        <div class="main-body">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">档案模块</div>
                <div class="sidebar-menu" id="sidebarMenu"></div>
            </div>
            <div class="content-area" id="contentArea"></div>
        </div>
    </div>

    <script>
        // ---------------- URL 与数据 ----------------
        function getUrlParam(key) {
            return new URLSearchParams(location.search).get(key) || '';
        }
        function getCurrentHouseNo() {
            const no = getUrlParam('no');
            if (no) return no;
            return getUrlParam('id') || 'NF-2025-00001';
        }
        function getCurrentHouseArch() {
            initHouseArchSeed();
            const no = getCurrentHouseNo();
            // 未找到记录时直接入库并返回规范化后的记录，避免返回未补全字段的拷贝
            return getHouseRecord(no) || ensureHouseRecord(no);
        }

        // ---------------- HTML 转义 ----------------
        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function escapeAttr(s) {
            return escapeHtml(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // 侧边栏模块配置：key / icon / title / tag
        const sidebarModules = [
            { key: 'overview', icon: 'fa-id-card', title: '房屋概况' },
            { key: 'risk', icon: 'fa-exclamation-triangle', title: '风险信息记录', ruralOnly: true },
            { key: 'inspection', icon: 'fa-search', title: '排查信息' },
            { key: 'patrol', icon: 'fa-walking', title: '动态巡查', ruralOnly: true },
            { key: 'measure', icon: 'fa-tools', title: '隐患整治' },
            { key: 'control', icon: 'fa-shield-alt', title: '隐患动态' },
            { key: 'stageAccept', icon: 'fa-clipboard-check', title: '阶段性验收' },
            { key: 'close', icon: 'fa-check-circle', title: '验收销号' },
            { key: 'appraisal', icon: 'fa-clipboard-check', title: '安全鉴定' },
            { key: 'emergency', icon: 'fa-first-aid', title: '应急处置', ruralOnly: true },
            { key: 'archive', icon: 'fa-folder-open', title: '整治档案' }
        ];

        let currentModule = 'overview';
        let currentHouse = getCurrentHouseArch();
        let eventListenersBound = false;

        const overviewSubTabs = [
            { key: 'jbxx', title: '基本信息', icon: 'fa-id-card' },
            { key: 'zjd', title: '宅基地信息', icon: 'fa-map' },
            { key: 'jsqk', title: '建设情况', icon: 'fa-hard-hat' },
            { key: 'glqk', title: '管理情况', icon: 'fa-file-alt' },
            { key: 'designConstruction', title: '设计施工信息', icon: 'fa-hard-hat', ruralOnly: true },
            { key: 'structure', title: '结构信息', icon: 'fa-building', ruralOnly: true },
            { key: 'usage', title: '使用信息', icon: 'fa-home', ruralOnly: true }
        ];
        let currentOverviewSubTab = 'jbxx';

        // 排查记录子Tab配置（与 house-arch-detail.html 排查信息保持一致）
        const inspectionSubTabs = [
            { key: 'survey1', title: '排查情况', icon: 'fa-search' },
            { key: 'survey2', title: '建房现场安全自查情况', icon: 'fa-hard-hat' },
            { key: 'survey3', title: '房屋用途现场情况', icon: 'fa-home' }
        ];
        let currentInspectionSubTab = 'survey1';
        let currentMeasureSubTab = 'plan';
        let currentControlSubTab = 'situation';

        // 各多次记录模块当前选中的记录索引
        const recordViewState = {
            inspection: 0,
            appraisal: 0,
            risk: 0,
            patrol: 0,
            measure: 0,
            measureProject: 0,
            designConstruction: 0,
            archive: 0,
            emergency: 0,
            emergencyResponse: 0
        };

        function render() {
            renderStatusPanel();
            renderSidebar();
            renderContent();
        }

        function initPage() {
            renderTopbar();
            renderStatusPanel();
            renderSidebar();
            renderContent();
        }

        function renderTopbar() {
            const s = currentHouse;
            const title = '农村自建房档案';
            const sub = '房屋编号：' + (s.no || '—');
            document.getElementById('topbarTitle').textContent = title;
            document.getElementById('topbarSub').textContent = sub;
        }

        function renderStatusPanel() {
            const s = currentHouse;
            const riskClass = riskBadgeClass(s.riskLevel);
            const governClass = governBadgeClass(s.governStatus);
            document.getElementById('statusPanel').innerHTML =
                '<div class="status-cell"><div class="status-label">风险等级</div><div class="status-badge ' + riskClass + '">' + (getRiskDisplayText(s.riskLevel) || '—') + '</div></div>' +
                '<div class="status-cell"><div class="status-label">治理状态</div><div class="status-badge ' + governClass + '">' + (s.governStatus || '—') + '</div></div>' +
                '<div class="status-cell full"><div class="status-label">当前措施</div><div class="status-value">' + (s.currentMeasure || '—') + '</div></div>' +
                '<div class="status-cell"><div class="status-label">责任人</div><div class="status-value">' + (s.managerName || '—') + ' <span style="font-weight:400;color:var(--text-secondary);font-size:12px;">' + ((s.managerPhone || '').replace(/-/g, '')) + '</span></div></div>';
        }

        function riskBadgeClass(level) {
            const display = getRiskDisplayText(level);
            const map = {
                '第三类': 'danger',
                '第二类': 'warning',
                '第一类': 'info'
            };
            return map[display] || 'info';
        }

        function getRiskDisplayText(level) {
            const map = {
                '重大风险': '第三类',
                '重大隐患': '第三类',
                '较大风险': '第三类',
                '较大隐患': '第三类',
                '一般风险': '第二类',
                '一般隐患': '第二类',
                '低风险': '第一类',
                '安全': '第一类',
                '无风险': '第一类',
                '第三类': '第三类',
                '第二类': '第二类',
                '第一类': '第一类',
                '严重损坏房': '第三类',
                '疑似危房': '第三类',
                '一般损坏房': '第二类',
                '完好房(基本完好房)': '第一类',
                '完好房': '第一类'
            };
            return map[level] || level || '—';
        }

        function formatRiskBasisText(text) {
            if (!text) return '—';
            const map = {
                '重大隐患': '第三类',
                '较大隐患': '第三类',
                '一般隐患': '第二类',
                '重大风险': '第三类',
                '较大风险': '第三类',
                '一般风险': '第二类',
                '低风险': '第一类',
                '安全': '第一类',
                '无风险': '第一类'
            };
            let result = text;
            for (const old in map) {
                result = result.replace(new RegExp(old, 'g'), map[old]);
            }
            return result;
        }
        function governBadgeClass(status) {
            const map = { '待整治': 'info', '整治中': 'warning', '已整治': 'safe', '已治理': 'safe', '逾期未整治': 'danger' };
            return map[status] || 'info';
        }

        // ---------------- 侧边栏 ----------------
        function renderSidebar() {
            const menu = document.getElementById('sidebarMenu');
            const moduleParam = getUrlParam('module');
            if (moduleParam && sidebarModules.some(m => m.key === moduleParam)) {
                currentModule = moduleParam;
            } else if (moduleParam && overviewSubTabs.some(t => t.key === moduleParam)) {
                currentOverviewSubTab = moduleParam;
                currentModule = 'overview';
            }
            menu.innerHTML = sidebarModules.map(item => {
                const active = item.key === currentModule ? 'active' : '';
                const ruralCls = item.ruralOnly ? ' rural-only-item' : '';
                return '<div class="sidebar-item ' + active + ruralCls + '" data-key="' + item.key + '">' +
                    '<div class="sidebar-item-left"><i class="fas ' + item.icon + '"></i> ' + item.title + '</div>' +
                    '</div>';
            }).join('');
            menu.querySelectorAll('.sidebar-item').forEach(el => {
                el.addEventListener('click', function() {
                    currentModule = el.dataset.key;
                    renderSidebar();
                    renderContent();
                });
            });
        }

        // ---------------- 内容渲染 ----------------
        function renderContent() {
            const s = currentHouse;
            const area = document.getElementById('contentArea');
            let html = '';
            switch (currentModule) {
                case 'overview': html = renderOverview(s); break;
                case 'inspection': html = renderInspection(s); break;
                case 'appraisal': html = renderAppraisal(s); break;
                case 'risk': html = renderRisk(s); break;
                case 'patrol': html = renderPatrol(s); break;
                case 'measure': html = renderMeasure(s); break;
                case 'emergency': html = renderEmergency(s); break;
                case 'control': html = renderControl(s); break;
                case 'stageAccept': html = renderStageAccept(s); break;
                case 'close': html = renderClose(s); break;
                case 'archive': html = renderArchive(s); break;
                default: html = renderOverview(s);
            }
            area.innerHTML = html;
            if (!eventListenersBound) {
                bindContentAreaEvents();
                eventListenersBound = true;
            }
        }

        function bindContentAreaEvents() {
            const container = document.getElementById('contentArea');
            if (!container) return;
            container.addEventListener('click', function(e) {
                // 卡片编辑按钮
                const editBtn = e.target.closest('.card-edit-btn[data-edit-module]');
                if (editBtn) {
                    e.stopPropagation();
                    handleCardEdit(editBtn.dataset.editModule, editBtn.dataset.editTab || null);
                    return;
                }
                // 概览子 tab
                const overviewTab = e.target.closest('.content-tab[data-scope="overview"]');
                if (overviewTab) {
                    e.stopPropagation();
                    currentOverviewSubTab = overviewTab.dataset.key;
                    renderContent();
                    return;
                }
                // 排查子 tab
                const inspectionTab = e.target.closest('.content-tab[data-scope="inspection"]');
                if (inspectionTab) {
                    e.stopPropagation();
                    currentInspectionSubTab = inspectionTab.dataset.key;
                    renderContent();
                    return;
                }
                // 隐患整治子 tab
                const measureTab = e.target.closest('.content-tab[data-scope="measure"]');
                if (measureTab) {
                    e.stopPropagation();
                    currentMeasureSubTab = measureTab.dataset.key;
                    renderContent();
                    return;
                }
                // 隐患动态子 tab
                const controlTab = e.target.closest('.content-tab[data-scope="control"]');
                if (controlTab) {
                    e.stopPropagation();
                    currentControlSubTab = controlTab.dataset.key;
                    renderContent();
                    return;
                }
                // 记录列表行
                const row = e.target.closest('.record-list-row[data-module]');
                if (row) {
                    e.stopPropagation();
                    const module = row.dataset.module;
                    const index = parseInt(row.dataset.index, 10);
                    recordViewState[module] = index;
                    renderContent();
                }
            });
        }

        function card(title, icon, body, editModule) {
            const editBtn = editModule
                ? '<button class="card-edit-btn" data-edit-module="' + editModule + '"><i class="fas fa-edit"></i> 编辑</button>'
                : '';
            return '<div class="content-card">' +
                '<div class="content-card-header"><div class="content-card-title"><i class="fas ' + icon + '"></i> ' + title + '</div>' + editBtn + '</div>' +
                '<div class="content-body">' + body + '</div>' +
            '</div>';
        }

        function kv(label, value, emptyLabel, ruralOnly) {
            const v = value || '';
            const isEmpty = v === '' || v === null || v === undefined;
            const cls = isEmpty ? 'empty' : (ruralOnly ? 'rural-only' : '');
            return '<div class="info-item"><div class="info-label">' + label + '</div><div class="info-value ' + cls + '">' + (isEmpty ? (emptyLabel || '—') : v) + '</div></div>';
        }

        function renderOverview(s) {
            const tabsHtml = overviewSubTabs.map(tab => {
                const active = tab.key === currentOverviewSubTab ? 'active' : '';
                const ruralCls = tab.ruralOnly ? ' rural-only-tab' : '';
                return '<div class="content-tab ' + active + ruralCls + '" data-scope="overview" data-key="' + tab.key + '">' +
                    '<i class="fas ' + tab.icon + '"></i> ' + tab.title +
                    '</div>';
            }).join('');

            const ov = s.overview || {};
            // jbxx 字段与 house-arch 保持 20 字段一致（定义一致、取值来自真实数据层）
            // rural 独有字段用 kv() 第4参 ruralOnly=true 标绿
            const jbxx = [
                ['房屋编号', s.no || ov.houseNo || '—'],
                ['房屋性质', ov.houseType || s.houseType || '—'],
                ['所在区域', ov.belongTo || (s.street ? (s.street + (s.community || s.village ? ' · ' + (s.community || s.village) : '')) : '—')],
                ['路号信息', ov.address || s.address || '—'],
                ['不需要排查原因', ov.noCheckReason || '—'],
                ['产权人 / 使用人信息', ov.owner || s.owner || '—'],
                ['身份证号码', ov.idCard || '—'],
                ['房屋用途', ov.usage || '—'],
                ['是否同时自住', ov.isSelfLive || '—'],
                ['具体用途', ov.specificUsage || '—'],
                ['人员聚集场所周边', ov.crowdAround || '—'],
                ['其他人员密集场所周边', ov.otherCrowdAround || '—'],
                ['土地性质', ov.landNature || (s.homestead && s.homestead.landNature) || '—'],
                ['集体土地', ov.collectiveLand || (s.homestead && s.homestead.landNature) || '—'],
                ['所在区域（区域类型）', ov.areaType || '建制镇'],
                ['建筑层数', ov.floors || '—'],
                ['建筑面积 (m²)', ov.buildingArea || '—'],
                ['建成时间', ov.builtPeriod || '—'],
                ['具体年份', (ov.builtYear || s.year || '—') + (ov.builtYear || s.year ? '年' : '')],
                // ---- rural 独有字段（标绿）----
                ['户主联系方式', ov.phone || '—', true],
                ['家庭成员信息', s.familyMembers || '—', true]
            ];
            const zjd = [
                ['宅基地面积', s.homestead && s.homestead.area || '—'],
                ['审批情况', s.homestead && s.homestead.approvalStatus || '—'],
                ['权属证明', s.homestead && s.homestead.certNo || '—']
            ];
            const jsqk = [
                ['常住或使用人数超过 10 人', ov.over10People || '—'],
                ['设计方式', s.designConstruction && s.designConstruction.designMode || '—'],
                ['建造方式', s.designConstruction && s.designConstruction.buildMode || '—'],
                ['结构类型', ov.structureType || s.structure && s.structure.structureType || '—'],
                ['楼屋盖', s.structure && s.structure.roofType || '—'],
                ['是否改扩建', s.structure && s.structure.expansionStatus || '—'],
                ['是否装修', s.structure && s.structure.decorationStatus || '—']
            ];
            const glqk = [
                ['已取得的行政许可', ov.permit || '—'],
                ['违法建设和违法审批', ov.illegalBuild || '—']
            ];
            const d = s.designConstruction || {};
            const designConstructionRecords = s.designConstructionRecords || (s.designConstruction ? [s.designConstruction] : []);
            const st = s.structure || {};
            const structure = [
                ['结构形式', st.structureType || '—'],
                ['建筑层数', st.floors || '—'],
                ['建筑面积', st.buildingArea || '—'],
                ['屋盖类型', st.roofType || '—'],
                ['墙体材料', st.wallMaterial || '—'],
                ['楼盖材料', st.floorMaterial || '—'],
                ['基础形式', st.foundationType || '—'],
                ['抗震信息', st.seismicInfo || '—'],
                ['最大跨度', st.maxSpan || '—'],
                ['改扩建情况', st.expansionStatus || '—'],
                ['装修情况', st.decorationStatus || '—'],
                ['备注', st.remark || '—']
            ];
            const u = s.usage || {};
            const usage = [
                ['使用用途', u.usageType || '—'],
                ['是否自住', u.isSelfLive === true ? '是' : u.isSelfLive === false ? '否' : '—'],
                ['具体用途', u.specificUsage || '—'],
                ['居住人数', u.occupancy || '—'],
                ['人员聚集场所周边', u.crowdAround === true ? '是' : u.crowdAround === false ? '否' : '—'],
                ['其他人员密集场所周边', u.otherCrowdAround === true ? '是' : u.otherCrowdAround === false ? '否' : '—'],
                ['超10人使用', u.over10People === true ? '是' : u.over10People === false ? '否' : '—']
            ];
            if (u.historyChanges && u.historyChanges.length) {
                usage.push(['使用变更历史', '']);
                u.historyChanges.forEach(h => {
                    usage.push(['变更日期', h.changeDate || '—']);
                    usage.push(['变更类型', h.changeType || '—']);
                    usage.push(['变更内容', h.changeContent || '—']);
                    usage.push(['审批情况', h.approvalStatus || '—']);
                    usage.push(['备注', h.remark || '—']);
                });
            }

            // 设计施工信息：记录列表 + 详情（参考巡查检查模式）
            let designConstructionHtml = '';
            if (currentOverviewSubTab === 'designConstruction') {
                const activeIndex = recordViewState.designConstruction;
                const listHtml = recordListTable(
                    ['设计日期', '施工单位', '是否正规设计', '是否正规施工', '填报人'],
                    designConstructionRecords.map(r => [
                        r.designDate || '—',
                        r.constructionUnit || '—',
                        r.hasProfessionalDesign ? '是' : '否',
                        r.hasQualificationTeam ? '是' : '否',
                        r.reporter || '—'
                    ]),
                    'designConstruction',
                    activeIndex,
                    { showAction: true }
                );
                const r = designConstructionRecords[activeIndex] || designConstructionRecords[0] || {};
                const grid = [
                    kv('设计日期', r.designDate),
                    kv('施工单位', r.constructionUnit),
                    kv('是否正规设计', r.hasProfessionalDesign ? '是' : '否'),
                    kv('是否正规施工', r.hasQualificationTeam ? '是' : '否'),
                    kv('设计单位', r.designUnit),
                    kv('建造工匠', r.builder),
                    kv('建造年份', r.buildYear || (s.year || '—') + '年'),
                    kv('改建扩建记录', r.expansionRecord || (s.structure && s.structure.expansionStatus) || '—'),
                    kv('设计方式', r.designMode),
                    kv('建造方式', r.buildMode),
                    kv('备注', r.remark)
                ].join('');
                designConstructionHtml =
                    recordListWrapper('设计施工记录列表', listHtml, { icon: 'fa-hard-hat' }) +
                    '<div class="record-detail-header">' +
                        '<div class="title">设计施工详情（' + (designConstructionRecords.length ? (activeIndex + 1) + ' / ' + designConstructionRecords.length : '0 / 0') + '）</div>' +
                        '<div class="meta">设计日期：' + (r.designDate || '—') + ' | 填报人：' + (r.reporter || '—') + '</div>' +
                    '</div>' +
                    '<div class="info-grid info-grid-2col">' + grid + '</div>';
            }

            const dynamicOverview = { jbxx, zjd, jsqk, glqk, structure, usage };
            const rows = dynamicOverview[currentOverviewSubTab] || jbxx;
            const gridHtml = rows.map(r => {
                const ruralOnly = r[2] === true;
                return '<div class="info-item">' +
                    '<div class="info-label">' + r[0] + '</div>' +
                    '<div class="info-value ' + (r[1] ? '' : 'empty') + (ruralOnly && r[1] && r[1] !== '—' ? ' rural-only' : '') + '">' + (r[1] || '—') + '</div>' +
                    '</div>';
            }).join('');

            const editableTabs = { jbxx: '基本信息', zjd: '宅基地信息', jsqk: '建设情况', glqk: '管理情况', designConstruction: '设计施工信息', structure: '结构信息', usage: '使用信息' };
            const editBtn = editableTabs[currentOverviewSubTab]
                ? '<button class="card-edit-btn" data-edit-module="overview" data-edit-tab="' + currentOverviewSubTab + '"><i class="fas fa-edit"></i> 编辑</button>'
                : '';

            return '<div class="content-card">' +
                '<div class="content-card-header">' +
                    '<div class="content-card-title"><i class="fas fa-id-card"></i> 房屋概况</div>' + editBtn +

        // ---------------- 通用记录列表组件 ----------------
        function recordListTable(columns, rows, moduleKey, activeIndex, options) {
            options = options || {};
            if (!rows || rows.length === 0) {
                return '<div class="record-empty">暂无记录</div>';
            }
            const head = '<thead><tr>' + columns.map(c => '<th>' + (c.title || c) + '</th>').join('') + (options.showAction ? '<th>操作</th>' : '') + '</tr></thead>';
            const body = rows.map((row, idx) => {
                const isActive = idx === activeIndex;
                const record = options.records ? options.records[idx] : null;
                const cells = row.map((cell, cIdx) => {
                    const col = columns[cIdx] || {};
                    const val = cell === undefined || cell === '' || cell === null ? '—' : cell;
                    if (col.tag) {
                        return '<td><span class="tag ' + (col.tagClass ? col.tagClass(val) : 'info') + '">' + val + '</span></td>';
                    }
                    return '<td>' + val + '</td>';
                }).join('');
                let actionCell = '';
                if (options.showAction) {
                    if (record && record.taskId) {
                        actionCell = '<td class="actions"><a class="task-link" href="patrol-task-management.html?taskId=' + encodeURIComponent(record.taskId) + '" onclick="event.stopPropagation();" title="查看来源任务">来源任务</a></td>';
                    } else {
                        actionCell = '<td class="actions"><a class="view-link" href="javascript:void(0);">查看</a></td>';
                    }
                }
                return '<tr class="record-list-row ' + (isActive ? 'active' : '') + '" data-module="' + moduleKey + '" data-index="' + idx + '">' + cells + actionCell + '</tr>';
            }).join('');
            return '<div class="table-scroll"><table class="record-list">' + head + '<tbody>' + body + '</tbody></table></div>';
        }

        function recordListWrapper(title, listHtml, options) {
            options = options || {};
            return '<div class="record-section-title"><span><i class="fas ' + (options.icon || 'fa-list') + '"></i> ' + title + '</span>' +
                (options.addBtn ? '<button class="record-add-btn" onclick="' + options.addBtn.onclick + '"><i class="fas fa-plus"></i> ' + options.addBtn.text + '</button>' : '') +
                '</div>' + listHtml;
        }

        // 隐患动态
        function renderControl(s) {
            const tabsHtml = [
                { key: 'situation', title: '隐患控制情况', icon: 'fa-shield-alt' },
                { key: 'dynamic', title: '隐患动态记录', icon: 'fa-exchange-alt' },
                { key: 'quality', title: '最新质检信息', icon: 'fa-check-circle', ruralOnly: true },
                { key: 'history', title: '历史整改信息', icon: 'fa-history', ruralOnly: true }
            ].map(t => '<div class="content-tab ' + (currentControlSubTab === t.key ? 'active' : '') + (t.ruralOnly ? ' rural-only-tab' : '') + '" data-scope="control" data-key="' + t.key + '"><i class="fas ' + t.icon + '"></i> ' + t.title + '</div>').join('');

            let body = '';
            if (currentControlSubTab === 'dynamic') {
                body = renderControlDynamic(s);
            } else if (currentControlSubTab === 'quality') {
                body = renderControlQuality(s);
            } else if (currentControlSubTab === 'history') {
                body = renderControlHistory(s);
            } else {
                body = renderControlSituation(s);
            }
            // quality/history 由来源记录生成，不展示编辑入口
            const controlEditable = (currentControlSubTab === 'situation' || currentControlSubTab === 'dynamic') ? 'control' : null;
            return card('隐患动态', 'fa-shield-alt', '<div class="content-tabs" style="padding-left:0;padding-right:0;margin-bottom:14px;">' + tabsHtml + '</div>' + body, controlEditable);
        }

        // tab1 隐患控制情况
        function renderControlSituation(s) {
            const mgmt = s.manageRecords || [];
            const prj = s.projectRecords || [];
            const firstMgmt = mgmt[0] || {};
            const firstPrj = prj[0] || {};
            const controlId = 'CTRL-' + (s.no || 'NF') + '-001';
            const governanceLabel = { 'pending': '待整治', 'doing': '整治中', 'done': '已整治', 'overdue': '已逾期' }[s.governance] || (s.governStatus || '待整治');
            const isControlled = firstMgmt.riskControlled !== undefined ? firstMgmt.riskControlled :
                (s.governance === 'done' || s.closeStatus === '已通过');
            const reporter = firstMgmt.reporter || firstPrj.reporter || s.responsiblePerson || '—';
            const reportTime = firstMgmt.reportTime || firstPrj.reportTime || '';
            const grid = [
                kv('隐患动态整治状态', governanceLabel),
                kv('安全隐患是否得到控制', isControlled ? '<span class="status-badge safe">是</span>' : '<span class="status-badge warning">否</span>'),
                kv('备注', firstMgmt.remark || '持续管控中'),
                kv('填报人', reporter),
                kv('填报时间', reportTime || '—')
            ].join('');
            return '<div class="record-detail-header"><div class="title">隐患控制情况</div></div>' +
                '<div class="info-grid info-grid-2col">' + grid + '</div>';
        }

        // tab2 隐患动态记录
        function renderControlDynamic(s) {
            const idx = parseInt(String(s.no || '0').replace(/\D/g, '') || '0', 10);
            const ins = (s.inspectionRecords || [])[0] || {};
            const patrol = (s.patrolRecords || [])[0] || {};
            const mgmt = (s.manageRecords || [])[0] || {};
            const riskText = getRiskDisplayText(s.riskLevel) || '—';
            const records = [];

            records.push({
                id: 'DYN-' + (s.no || 'NF') + '-001',
                judge: '确认安全隐患',
                reason: ins.hazardDesc || ('排查发现房屋存在安全隐患，风险等级：' + riskText),
                reporter: ins.reporter || ins.checker || s.responsiblePerson || '—',
                reportTime: ins.reportTime || ins.checkDate || '—'
            });

            records.push({
                id: 'DYN-' + (s.no || 'NF') + '-002',
                judge: '新增隐患',
                reason: patrol.foundProblems || '巡查发现隐患部位有发展趋势',
                reporter: patrol.patrolPerson || RESPONSIBLE_PERSONS[(idx + 1) % RESPONSIBLE_PERSONS.length],
                reportTime: patrol.patrolDate || '—'
            });

            const doneLike = s.governance === 'done' || (s.manageRecords || []).some(m => m.riskControlled);
            records.push({
                id: 'DYN-' + (s.no || 'NF') + '-003',
                judge: doneLike ? '隐患已控制' : '隐患未控制',
                reason: mgmt.remark || ('落实' + (mgmt.measureType || '管控') + '措施'),
                reporter: mgmt.reporter || mgmt.dutyPerson || RESPONSIBLE_PERSONS[(idx + 2) % RESPONSIBLE_PERSONS.length],
                reportTime: mgmt.reportTime || mgmt.startTime || '—'
            });

            const rows = records.map(r => '<tr>' +
                '<td>' + r.judge + '</td><td style="text-align:left;">' + r.reason + '</td>' +
                '<td>' + r.reporter + '</td><td>' + r.reportTime + '</td></tr>').join('');
            return '<div class="record-detail-header"><div class="title">隐患动态记录（' + records.length + '）</div>' +
                '<div class="meta">房屋编号：' + (s.no || '—') + '</div></div>' +
                '<table class="arch-table"><thead><tr><th>隐患判定情况</th><th>新增隐患原因</th><th>填报人</th><th>填报时间</th></tr></thead>' +
                '<tbody>' + rows + '</tbody></table>';
        }

        // tab3 最新质检信息
        function renderControlQuality(s) {
            const patrol = (s.patrolRecords || []).slice().sort((a, b) => (b.patrolDate || '').localeCompare(a.patrolDate || ''));
            const latest = patrol[0] || {};
            const appraisal = (s.appraisalReports || [])[0] || {};
            const mgmt = s.manageRecords || [];
            const prj = s.projectRecords || [];
            const hasProject = prj.length > 0;
            const isControlled = mgmt.some(m => m.riskControlled) || s.governance === 'done';
            const notEliminated = !isControlled || latest.result === '发现隐患' || hasProject;
            const qualityConclusion = latest.result || formatAppraisalConclusion(appraisal.level || appraisal.conclusion) || '—';
            const checkConclusion = notEliminated
                ? '核查确认：安全隐患未彻底消除，需继续落实整治措施'
                : '核查确认：安全隐患已消除，整治措施到位';
            const subCategory = !hasProject
                ? '未实施工程措施'
                : (notEliminated ? '工程措施未完工/未验收' : '已实施工程措施但存在遗留问题');
            const qualityRemark = latest.remark || appraisal.remark || '管控措施有效，需持续关注隐患部位变化';
            const grid = [
                kv('历史质检员', latest.patrolPerson || appraisal.appraiser || '—'),
                kv('质检结论', qualityConclusion),
                kv('质检来源', latest.patrolType ? '巡查检查' : (appraisal.id ? '安全鉴定' : '—')),
                kv('核查结论', checkConclusion),
                kv('是否真的实施了工程措施进行整治', hasProject ? '是' : '否'),
                kv('安全隐患没有彻底消除', notEliminated ? '<span class="status-badge warning">是</span>' : '<span class="status-badge safe">否</span>'),
                kv('安全隐患没有彻底消除细类', notEliminated ? subCategory : '—'),
                kv('质检批注', qualityRemark),
                kv('质检时间', latest.patrolDate || appraisal.appraisalDate || '—')
            ].join('');
            const photoHtml = '<div class="info-item full-width"><div class="info-label">质检现场照片</div>' +
                renderPhotoValue(mockPhotoPair('质检现场照片 1', '质检现场照片 2', '#4b6d8a', '#8a7a4b'), '质检现场照片') + '</div>';
            return '<div class="record-detail-header"><div class="title">最新质检信息</div>' +
                '<div class="meta">房屋编号：' + (s.no || '—') + '</div></div>' +
                '<div class="info-grid info-grid-2col">' + grid + photoHtml + '</div>';
        }

        // tab4 历史整改信息
        function renderControlHistory(s) {
            const mgmt = s.manageRecords || [];
            const prj = s.projectRecords || [];
            const rows = [];
            mgmt.forEach((m, i) => rows.push({
                person: m.dutyPerson || m.manager || m.reporter || '—',
                selfConfirm: m.isDone ? '已自查确认' : '自查中',
                remark: m.remark || m.measureDesc || '—',
                time: m.actualEndTime || m.startTime || m.reportTime || '—',
                done: m.isDone
            }));
            prj.forEach((p, i) => rows.push({

        // ---------------- 通用编辑弹窗引擎 ----------------
        // 字段描述符: { key, label, type('text'|'date'|'number'|'textarea'|'select'), options[], full, get(), set(v) }
        let editModalContext = null; // { title, fields, onSave }

        function buildEditField(f) {
            const _raw = f.get ? f.get() : '';
            const val = (_raw === false || _raw === 0) ? _raw : (_raw || '');
            const esc = String(val).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
            const req = f.required ? '<span class="req">*</span>' : '';
            let input = '';
            if (f.type === 'textarea') {
                input = '<textarea data-edit-key="' + f.key + '" placeholder="' + (f.placeholder || '') + '">' + esc + '</textarea>';
            } else if (f.type === 'select') {
                // 若当前值不在 options 中，动态加入该值，避免保存时丢失原有数据
                let options = (f.options || []).slice();
                const rawVal = String(val);
                if (rawVal && !options.some(o => String(typeof o === 'object' ? o.value : o) === rawVal)) {
                    options.unshift(rawVal);
                }
                const opts = options.map(o => {
                    const ov = typeof o === 'object' ? o.value : o;
                    const ol = typeof o === 'object' ? o.label : o;
                    return '<option value="' + ov + '"' + (String(ov) === rawVal ? ' selected' : '') + '>' + ol + '</option>';
                }).join('');
                input = '<select data-edit-key="' + f.key + '">' + (f.allowEmpty !== false ? '<option value="">请选择</option>' : '') + opts + '</select>';
            } else if (f.type === 'number') {
                input = '<input type="number" data-edit-key="' + f.key + '" value="' + esc + '" placeholder="' + (f.placeholder || '') + '">';
            } else if (f.type === 'date') {
                input = '<input type="date" data-edit-key="' + f.key + '" value="' + esc + '">';
            } else if (f.type === 'files') {
                // 文件/图片上传：实时写入字段（不走 save 时 el.value 收集）
                input = '<div class="edit-files-wrap" data-edit-files-key="' + f.key + '">' +
                    '<div class="edit-files-list" id="editFiles_' + f.domId + '"></div>' +
                    '<input type="file" id="editFileInput_' + f.domId + '" style="display:none;" ' + (f.accept ? 'accept="' + f.accept + '"' : 'accept="image/*"') + ' multiple>' +
                    '</div>';
            } else {
                input = '<input type="text" data-edit-key="' + f.key + '" value="' + esc + '" placeholder="' + (f.placeholder || '') + '">';
            }
            return '<div class="edit-form-item' + (f.full ? ' full-width' : '') + '">' +
                '<div class="edit-form-label">' + f.label + req + '</div>' + input + '</div>';
        }

        function openEditModal(title, fields, onSave) {
            editModalContext = { title, fields, onSave };
            // 给 files 字段分配 domId，便于渲染/操作
            fields.forEach((f, i) => { if (f.type === 'files') f.domId = 'f' + i + '_' + Math.random().toString(36).slice(2, 7); });
            document.getElementById('editModalTitle').textContent = title;

            // files 字段 ≥3 时归组为横向 tab；否则平铺
            const filesFields = fields.filter(f => f.type === 'files');
            const useTabs = filesFields.length >= 3;
            let bodyHtml = '';
            if (useTabs) {
                const normalFields = fields.filter(f => f.type !== 'files');
                bodyHtml += normalFields.map(buildEditField).join('');
                // tab 条
                bodyHtml += '<div class="edit-form-item full-width"><div class="edit-form-label">附件材料</div>' +
                    '<div class="edit-files-tabs"><div class="edit-files-tabs-bar">' +
                    filesFields.map((f, i) =>
                        '<div class="edit-files-tab' + (i === 0 ? ' active' : '') + '" data-ftab="' + i + '">' +
                        (f.tabLabel || f.label) + '<span class="cnt" data-cnt="' + f.domId + '">0</span></div>').join('') +
                    '</div>' +
                    // 面板
                    filesFields.map((f, i) =>
                        '<div class="edit-files-pane' + (i === 0 ? ' active' : '') + '" data-fpane="' + i + '">' +
                        '<div class="pane-label">' + f.label + '</div>' +
                        '<div class="edit-files-wrap" data-edit-files-key="' + f.key + '">' +
                        '<div class="edit-files-list" id="editFiles_' + f.domId + '"></div>' +
                        '<input type="file" id="editFileInput_' + f.domId + '" style="display:none;" ' + (f.accept ? 'accept="' + f.accept + '"' : 'accept="image/*"') + ' multiple>' +
                        '</div></div>').join('') +
                    '</div></div>';
            } else {
                bodyHtml = fields.map(buildEditField).join('');
            }
            document.getElementById('editModalForm').innerHTML = bodyHtml;
            document.getElementById('editModal').classList.add('open');
            // 渲染 files 字段的已有文件 + 绑定上传
            fields.forEach(f => { if (f.type === 'files') initEditFilesField(f); });
            // 绑定 tab 切换 + 初始化角标
            if (useTabs) {
                const form = document.getElementById('editModalForm');
                form.querySelectorAll('.edit-files-tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        form.querySelectorAll('.edit-files-tab').forEach(t => t.classList.remove('active'));
                        form.querySelectorAll('.edit-files-pane').forEach(p => p.classList.remove('active'));
                        tab.classList.add('active');
                        const pane = form.querySelector('.edit-files-pane[data-fpane="' + tab.dataset.ftab + '"]');
                        if (pane) pane.classList.add('active');
                    });
                });
                filesFields.forEach(f => updateFilesTabCount(f));
            }
        }

        // 刷新 files 字段对应 tab 的数量角标
        function updateFilesTabCount(f) {
            const el = document.querySelector('[data-cnt="' + f.domId + '"]');
            if (!el) return;
            const n = (f.get && Array.isArray(f.get())) ? f.get().length : 0;
            el.textContent = n;
            el.classList.toggle('has', n > 0);
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('open');
            editModalContext = null;
        }

        function saveEditModal() {
            if (!editModalContext) return;
            const { fields, onSave } = editModalContext;
            // 校验必填
            for (const f of fields) {
                if (f.required) {
                    const el = document.querySelector('[data-edit-key="' + f.key + '"]');
                    if (!el || !el.value.trim()) { alert('请填写：' + f.label); el && el.focus(); return; }
                }
            }
            // 收集并写回
            fields.forEach(f => {
                if (f.type === 'files') return; // files 已实时写入，跳过 el.value 收集
                const el = document.querySelector('[data-edit-key="' + f.key + '"]');
                if (el && f.set) f.set(el.value);
            });
            // 持久化到统一数据层（写回单条记录）
            setHouseRecord(currentHouse.no || getCurrentHouseNo(), currentHouse);
            if (onSave) onSave();
            closeEditModal();
            // 重新渲染当前模块
            renderContent();
        }

        // 便捷: 构造字段描述符，path 形如 'overview.houseName'（支持嵌套，自动建中间对象）
        function makeField(s, path, label, type, opts) {
            opts = opts || {};
            const keys = path.split('.');
            function getter() {
                let o = s;
                for (const k of keys) { if (o == null) return ''; o = o[k]; }
                return o == null ? '' : o;
            }
            function setter(v) {
                // 若 options 里定义的是 boolean，则把表单字符串还原回 boolean
                if (opts.options && opts.options.some(o => typeof (o && o.value) === 'boolean')) {
                    if (v === 'true') v = true;
                    else if (v === 'false') v = false;
                }
                let o = s;
                for (let i = 0; i < keys.length - 1; i++) { if (o[keys[i]] == null || typeof o[keys[i]] !== 'object') o[keys[i]] = {}; o = o[keys[i]]; }
                o[keys[keys.length - 1]] = v;
            }
            return Object.assign({ key: path, label, type: type || 'text', get: getter, set: setter }, opts);
        }

        // ---------------- 编辑表单-文件/图片上传 ----------------
        // 判断 data-url 是否为图片（图片可缩略图预览，其余显示文件图标）
        function _editFileIsImage(u) { return typeof u === 'string' && /^data:image\//.test(u); }

        // 初始化一个 files 字段：渲染已有文件 + 绑定上传/删除
        function initEditFilesField(f) {
            const listEl = document.getElementById('editFiles_' + f.domId);
            const inputEl = document.getElementById('editFileInput_' + f.domId);
            if (!listEl || !inputEl) return;
            function currentList() { const v = f.get ? f.get() : []; return Array.isArray(v) ? v : []; }
            function persist(arr) {
                if (f.set) f.set(arr);
                // 立即落盘：文件改动实时持久化
                if (typeof setHouseRecord === 'function' && typeof currentHouse !== 'undefined' && currentHouse) {
                    setHouseRecord(currentHouse.no || getCurrentHouseNo(), currentHouse);
                }
                // 同步 tab 数量角标（若处于 tab 模式）
                if (typeof updateFilesTabCount === 'function') updateFilesTabCount(f);
            }
            function render() {
                const arr = currentList();
                listEl.innerHTML = arr.map((u, idx) => {
                    const inner = _editFileIsImage(u)
                        ? '<img src="' + u + '" alt="文件" data-idx="' + idx + '">'
                        : '<div class="file-badge" data-idx="' + idx + '" title="查看文件"><i class="fas fa-file-alt"></i></div>';
                    return '<div class="edit-file-thumb">' + inner +
                        '<button type="button" class="file-del" data-del="' + idx + '" title="删除">×</button></div>';
                }).join('') + '<div class="edit-file-add" id="editFileAdd_' + f.domId + '"><i class="fas fa-plus"></i><span>上传</span></div>';
                // 绑定预览
                listEl.querySelectorAll('img[data-idx], .file-badge[data-idx]').forEach(el => {
                    el.addEventListener('click', () => { const u = currentList()[+el.dataset.idx]; if (u) viewPhotoOnline(u); });
                });
                // 绑定删除
                listEl.querySelectorAll('.file-del[data-del]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const arr = currentList().slice();
                        arr.splice(+btn.dataset.del, 1);
                        persist(arr);
                        render();
                    });
                });
                // 绑定上传按钮
                const addBtn = document.getElementById('editFileAdd_' + f.domId);
                if (addBtn) addBtn.addEventListener('click', () => inputEl.click());
            }
            inputEl.addEventListener('change', () => {
                const files = Array.from(inputEl.files || []);
                if (!files.length) return;
                const arr = currentList().slice();
                let done = 0;
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        arr.push(e.target.result);
                        if (++done === files.length) { persist(arr); render(); }
                    };
                    reader.readAsDataURL(file);
                });
                inputEl.value = ''; // 允许重复选同一文件
            });
            render();
        }
