                makeField(s, 'closeStatus', '当前销号状态', 'select', { options: ['未申请', '待审核', '审核中', '已通过', '已驳回'] }),
                makeField(s, 'closeApplyTime', '申请时间', 'text'),
                makeField(s, 'closeAuditTime', '审核时间', 'text'),
                makeField(s, 'closeAuditor', '审核人', 'text'),
                makeField(s, 'closeAuditOpinion', '审核意见', 'textarea', { full: true }),
                makeField(s, 'closeInfo.closeMethod', '销项方式', 'text'),
                makeField(s, 'closeInfo.hazardEliminated', '已完成整治且安全隐患已消除', 'select', { options: ['是', '否'] }),
                makeField(s, 'closeInfo.thirdPartyResult', '经专业第三方复核判定', 'text'),
                makeField(s, 'closeInfo.contactName', '姓名', 'text'),
                makeField(s, 'closeInfo.contactPhone', '联系电话', 'text'),
                makeField(s, 'closeInfo.infoUpdated', '是否更新房屋信息', 'select', { options: ['是', '否'] }),
                makeField(s, 'closeInfo.remark', '备注', 'textarea', { full: true }),
                makeField(s, 'closeInfo.reporter', '填报人', 'text'),
                makeField(s, 'closeInfo.reportTime', '填报时间', 'text'),
                makeField(s, 'closeInfo.completeCertFiles', '完工证明', 'files', { full: true }),
                makeField(s, 'closeInfo.expertOpinionFiles', '专业认定意见材料', 'files', { full: true }),
                makeField(s, 'closeInfo.afterPhotos', '整治后照片', 'files', { full: true }),
                makeField(s, 'closeInfo.relatedFiles', '相关资料', 'files', { full: true })
            ];
            openEditModal('编辑验收销号', fields, null);
        }

        // 整治档案编辑：档案清单当前选中记录
        function openArchiveEdit(s) {
            const list = s.archiveRecords || [];
            if (!list.length) { alert('暂无归档记录可编辑'); return; }
            const idx = Math.min(recordViewState.archive || 0, list.length - 1);
            const rec = list[idx];
            const fields = [
                makeField(rec, 'archiveType', '档案类型', 'select', { options: ['整治方案', '实施记录', '验收材料', '鉴定报告', '巡查记录', '其他'] }),
                makeField(rec, 'archiveNo', '档案编号', 'text'),
                makeField(rec, 'archiveTime', '归档时间', 'text'),
                makeField(rec, 'archiveStatus', '状态', 'select', { options: ['待归档', '已归档', '已借阅', '已归档(纸质)'] }),
                makeField(rec, 'fileName', '文件名', 'text'),
                makeField(rec, 'uploader', '归档人', 'text')
            ];
            openEditModal('编辑整治档案（' + (idx + 1) + ' / ' + list.length + '）', fields, null);
        }

        // 房屋概况各子tab编辑配置（与展示字段严格对齐）
        function openOverviewEdit(s, tab) {
            const ov = () => s.overview || (s.overview = {});
            let title = '编辑', fields = [];
            if (tab === 'jbxx') {
                title = '编辑基本信息';
                fields = [
                    makeField(s, 'no', '房屋编号', 'text'),
                    makeField(s, 'overview.houseType', '房屋性质', 'select', { options: ['自建房', '非自建房', '其他'] }),
                    makeField(s, 'overview.belongTo', '所在区域', 'text'),
                    makeField(s, 'overview.address', '路号信息', 'text'),
                    makeField(s, 'overview.noCheckReason', '不需要排查原因', 'textarea', { full: true }),
                    makeField(s, 'overview.owner', '产权人 / 使用人信息', 'text'),
                    makeField(s, 'overview.idCard', '身份证号码', 'text'),
                    makeField(s, 'overview.usage', '房屋用途', 'select', { options: ['居住', '经营', '租住', '混合', '闲置', '其他'] }),
                    makeField(s, 'overview.isSelfLive', '是否同时自住', 'select', { options: ['是', '否'] }),
                    makeField(s, 'overview.specificUsage', '具体用途', 'text', { full: true }),
                    makeField(s, 'overview.crowdAround', '人员聚集场所周边', 'text'),
                    makeField(s, 'overview.otherCrowdAround', '其他人员密集场所周边', 'text'),
                    makeField(s, 'overview.landNature', '土地性质', 'select', { options: ['集体土地', '国有土地', '其他'] }),
                    makeField(s, 'overview.collectiveLand', '集体土地', 'text'),
                    makeField(s, 'overview.floors', '建筑层数', 'text'),
                    makeField(s, 'overview.buildingArea', '建筑面积 (m²)', 'text'),
                    makeField(s, 'overview.builtPeriod', '建成时间', 'select', { options: ['1980年前', '1980-1990', '1990-2000', '2000-2010', '2010-2020', '2020后'] }),
                    makeField(s, 'overview.builtYear', '具体年份', 'text'),
                    // ---- rural 独有字段（也可编辑）----
                    makeField(s, 'overview.phone', '户主联系方式', 'text'),
                    makeField(s, 'familyMembers', '家庭成员信息', 'textarea', { full: true })
                ];
            } else if (tab === 'zjd') {
                title = '编辑宅基地信息';
                fields = [
                    makeField(s, 'homestead.area', '宅基地面积', 'text'),
                    makeField(s, 'homestead.approvalStatus', '审批情况', 'select', { options: ['已审批', '未审批', '审批中'] }),
                    makeField(s, 'homestead.certNo', '权属证明', 'text')
                ];
            } else if (tab === 'jsqk') {
                title = '编辑建设情况';
                fields = [
                    makeField(s, 'overview.over10People', '常住或使用人数超过 10 人', 'select', { options: ['是', '否'] }),
                    makeField(s, 'designConstruction.designMode', '设计方式', 'select', { options: ['正规设计', '非正规设计', '无设计'] }),
                    makeField(s, 'designConstruction.buildMode', '建造方式', 'select', { options: ['有资质施工队', '乡村工匠', '自行建造'] }),
                    makeField(s, 'overview.structureType', '结构类型', 'select', { options: ['砖混', '框架', '砖木', '土木', '石结构', '其他'] }),
                    makeField(s, 'structure.roofType', '楼屋盖', 'text'),
                    makeField(s, 'structure.expansionStatus', '是否改扩建', 'select', { options: ['是', '否'] }),
                    makeField(s, 'structure.decorationStatus', '是否装修', 'select', { options: ['是', '否'] })
                ];
            } else if (tab === 'glqk') {
                title = '编辑管理情况';
                fields = [
                    makeField(s, 'overview.permit', '已取得的行政许可', 'text', { full: true }),
                    makeField(s, 'overview.illegalBuild', '违法建设和违法审批', 'textarea', { full: true })
                ];
            } else if (tab === 'designConstruction') {
                title = '编辑设计施工信息';
                const list = s.designConstructionRecords || (s.designConstruction ? [s.designConstruction] : []);
                if (!list.length) { alert('暂无设计施工记录可编辑'); return; }
                const idx = Math.min(recordViewState.designConstruction || 0, list.length - 1);
                const rec = list[idx] || list[0];
                fields = [
                    makeField(rec, 'designDate', '设计日期', 'date'),
                    makeField(rec, 'constructionUnit', '施工单位', 'text'),
                    makeField(rec, 'hasProfessionalDesign', '是否正规设计', 'select', { options: [{value:true,label:'是'},{value:false,label:'否'}] }),
                    makeField(rec, 'hasQualificationTeam', '是否正规施工', 'select', { options: [{value:true,label:'是'},{value:false,label:'否'}] }),
                    makeField(rec, 'designUnit', '设计单位', 'text'),
                    makeField(rec, 'builder', '建造工匠', 'text'),
                    makeField(rec, 'buildYear', '建造年份', 'text'),
                    makeField(rec, 'expansionRecord', '改建扩建记录', 'text'),
                    makeField(rec, 'designMode', '设计方式', 'text'),
                    makeField(rec, 'buildMode', '建造方式', 'text'),
                    makeField(rec, 'reporter', '填报人', 'text'),
                    makeField(rec, 'remark', '备注', 'textarea', { full: true })
                ];
            } else if (tab === 'structure') {
                title = '编辑结构信息';
                fields = [
                    makeField(s, 'structure.structureType', '结构形式', 'select', { options: ['砖混', '框架', '砖木', '土木', '石结构', '其他'] }),
                    makeField(s, 'structure.floors', '建筑层数', 'text'),
                    makeField(s, 'structure.buildingArea', '建筑面积', 'text'),
                    makeField(s, 'structure.roofType', '屋盖类型', 'text'),
                    makeField(s, 'structure.wallMaterial', '墙体材料', 'text'),
                    makeField(s, 'structure.floorMaterial', '楼盖材料', 'text'),
                    makeField(s, 'structure.foundationType', '基础形式', 'text'),
                    makeField(s, 'structure.seismicInfo', '抗震信息', 'text'),
                    makeField(s, 'structure.maxSpan', '最大跨度', 'text'),
                    makeField(s, 'structure.expansionStatus', '改扩建情况', 'select', { options: ['是', '否'] }),
                    makeField(s, 'structure.decorationStatus', '装修情况', 'select', { options: ['是', '否'] }),
                    makeField(s, 'structure.remark', '备注', 'textarea', { full: true })
                ];
            } else if (tab === 'usage') {
                title = '编辑使用信息';
                fields = [
                    makeField(s, 'usage.usageType', '使用用途', 'select', { options: ['居住', '经营', '租住', '混合', '闲置', '其他'] }),
                    makeField(s, 'usage.isSelfLive', '是否自住', 'select', { options: [{value:true,label:'是'},{value:false,label:'否'}] }),
                    makeField(s, 'usage.specificUsage', '具体用途', 'text', { full: true }),
                    makeField(s, 'usage.occupancy', '居住人数', 'text'),
                    makeField(s, 'usage.crowdAround', '人员聚集场所周边', 'select', { options: [{value:true,label:'是'},{value:false,label:'否'}] }),
                    makeField(s, 'usage.otherCrowdAround', '其他人员密集场所周边', 'select', { options: [{value:true,label:'是'},{value:false,label:'否'}] }),
                    makeField(s, 'usage.over10People', '超10人使用', 'select', { options: [{value:true,label:'是'},{value:false,label:'否'}] })
                ];
            }
            openEditModal(title, fields, null);
        }

        // ---------------- 跨页面数据同步 ----------------
        // 其他页面/标签页写入 houseArchData 后，本页自动感知并刷新。
        // 编辑弹窗打开时只刷新顶部状态条，避免覆盖正在填写的表单。
        window.addEventListener('storage', function (e) {
            if (e.key !== HOUSE_ARCH_KEY) return;
            const fresh = getHouseRecord(getCurrentHouseNo());
            if (!fresh) return;
            currentHouse = fresh;
            renderStatusPanel();
            const modalOpen = document.getElementById('editModal').classList.contains('open');
            if (!modalOpen) renderContent();
        });

        // 启动
        initPage();
    </script>
</body>
</html>
