<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>常态化监测 - 农村自建房</title>
<link rel="stylesheet" href="./all.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ===== Theme Variables ===== */
:root {
    --primary: #1a73e8; --primary-dark: #1557b0; --primary-light: #e8f0fe;
    --secondary: #0097a7; --danger: #d93025; --warning: #e65100; --success: #1e8e3e;
    --bg-dark: #f0f2f5; --bg-card: #ffffff; --bg-hover: #e8eaed;
    --text-primary: #202124; --text-secondary: #5f6368; --border: #dadce0;
    --shadow: rgba(0,0,0,0.08); --input-bg: #ffffff; --input-border: #dadce0;
}
:root[data-theme="dark"] {
    --primary: #1e6fdb; --primary-dark: #1557b0; --primary-light: #e8f1fd;
    --secondary: #00b4d8; --danger: #ef4444; --warning: #f59e0b; --success: #10b981;
    --bg-dark: #0a1628; --bg-card: #112240; --bg-hover: #1a2f4a;
    --text-primary: #e2e8f0; --text-secondary: #94a3b8; --border: #1e3a5f;
    --shadow: rgba(0,0,0,0.3); --input-bg: rgba(255,255,255,0.05); --input-border: #1e3a5f;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif;
    background: var(--bg-dark);
    color: var(--text-primary);
    padding: 20px;
    min-height: 100vh;
}

/* ===== Page Header ===== */
.page-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
}
.page-header .ph-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--primary);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
}
.page-header h1 { font-size: 20px; font-weight: 700; }
.page-header .ph-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* ===== Filter Section ===== */
.filter-section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px var(--shadow);
}
.filter-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    flex-wrap: wrap;
}
.filter-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    min-width: 120px;
    position: relative;
}
.filter-item label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
}
.filter-input,
.filter-select {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-primary);
    background: var(--input-bg);
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
    min-width: 90px;
}
.filter-input:focus,
.filter-select:focus { border-color: var(--primary); }
.filter-actions {
    display: flex;
    gap: 8px;
    align-items: flex-end;
}

/* ===== Buttons ===== */
.btn {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    transition: all 0.2s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: var(--bg-hover); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }

/* ===== Section Card ===== */
.section-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: visible;
    box-shadow: 0 1px 3px var(--shadow);
}
.section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 18px;
    background: var(--bg-hover);
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    font-weight: 700;
}
.section-header i { color: var(--primary); font-size: 14px; }
.section-body { padding: 0; }

/* ===== Table ===== */
.table-scroll-wrapper {
    overflow-x: auto;
    position: relative;
}
.table-scroll-wrapper::-webkit-scrollbar { height: 8px; }
.table-scroll-wrapper::-webkit-scrollbar-track { background: var(--bg-hover); border-radius: 4px; }
.table-scroll-wrapper::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.table-scroll-wrapper::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

.data-table {
    width: max-content;
    min-width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13px;
}
.data-table thead th {
    background: var(--bg-hover);
    padding: 12px 10px;
    text-align: left;
    font-weight: 600;
    color: var(--text-primary);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    position: sticky;
    top: 0;
    z-index: 10;
    font-size: 13px;
}
.data-table tbody td {
    padding: 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text-primary);
    vertical-align: middle;
    white-space: nowrap;
    background: var(--bg-card);
}
.data-table tbody tr:hover td { background: #f1f7fe; }
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table th:first-child,
.data-table td:first-child {
    position: sticky;
    left: 0;
    z-index: 20;
    min-width: 200px;
    max-width: 280px;
    background: var(--bg-hover);
    border-right: 1px solid var(--border);
}
.data-table td:first-child { background: var(--bg-card); }
.data-table tbody tr:hover td:first-child { background: #f1f7fe; }
.data-table th:first-child { z-index: 30; }
.data-table th:last-child,
.data-table td:last-child {
    position: sticky;
    right: 0;
    z-index: 20;
    background: var(--bg-hover);
    border-left: 1px solid var(--border);
}
.data-table td:last-child { background: var(--bg-card); }
.data-table tbody tr:hover td:last-child { background: #f1f7fe; }
.data-table th:last-child { z-index: 30; }

/* Urgency */
.urgency-high { color: var(--danger); font-weight: 600; }
.urgency-medium { color: #c78000; font-weight: 600; }
.urgency-low { color: var(--success); font-weight: 600; }

/* Actions */
.actions { display: flex; gap: 16px; align-items: center; }
.action-link {
    font-size: 13px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    transition: opacity 0.2s;
    color: var(--primary);
    text-decoration: none;
    font-family: inherit;
    line-height: 1.5;
}
.action-link:hover { opacity: 0.8; text-decoration: underline; }
.house-count-link { text-decoration: none; }
.house-count-link:hover { text-decoration: underline; }

/* Pagination */
.pagination {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-secondary);
}
.page-info { display: flex; align-items: center; gap: 8px; }
.page-btns { display: flex; gap: 4px; }
.page-btn {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-card);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
}
.page-btn:hover { background: var(--bg-hover); }
.page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.page-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Empty State */
.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    color: var(--text-secondary);
    gap: 12px;
}
.empty-state i { font-size: 48px; opacity: 0.3; }
.empty-state p { font-size: 14px; }

/* ===== Hidden rectify status cell ===== */
.rectify-cell { font-size: 13px; font-weight: 600; white-space: nowrap; }
.rectify-cell.none { color: #2e7d32; }
.rectify-cell.unfixed { color: var(--danger); }

/* ===== Modal ===== */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s;
}
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal {
    background: var(--bg-card);
    border-radius: 12px;
    width: 90%;
    max-width: 600px;
    max-height: 90vh;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    transform: translateY(-20px);
    transition: transform 0.3s;
}
.modal-overlay.active .modal { transform: translateY(0); }
.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
}
.modal-header h3 {
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
}
.modal-header h3 i { color: var(--primary); }
.modal-close {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}
.modal-close:hover { background: var(--bg-hover); color: var(--text-primary); }
.modal-body {
    padding: 20px;
    overflow-y: auto;
    max-height: calc(90vh - 130px);
}
.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 16px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
}

/* ===== 批量导入弹窗样式 ===== */
#importTabs {
    display: flex;
    gap: 8px;
    border-bottom: 2px solid var(--border);
    padding-bottom: 0;
}
#importTabs .content-tab {
    padding: 8px 18px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
}
#importTabs .content-tab:hover { color: var(--primary); }
#importTabs .content-tab.active {
    color: var(--primary);
    font-weight: 600;
    border-bottom-color: var(--primary);
}
.import-summary {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}
.import-stat {
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
}
.import-stat.new { background: #e6f4ea; color: #1e8e3e; }
.import-stat.update { background: #e8f0fe; color: #1a73e8; }
.import-stat.error { background: #fce8e6; color: #d93025; }
.import-preview-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}
.import-preview-table th, .import-preview-table td {
    border: 1px solid var(--border);
    padding: 6px 8px;
    text-align: left;
    white-space: nowrap;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
}
.import-preview-table th { background: #f1f3f4; font-weight: 600; position: sticky; top: 0; }
.import-preview-table tr.row-error td { background: #fce8e6; }
.import-preview-table tr.row-new td:first-child { border-left: 3px solid #1e8e3e; }
.import-preview-table tr.row-update td:first-child { border-left: 3px solid #1a73e8; }
.import-scroll { max-height: 260px; overflow: auto; border-radius: 8px; }

/* Toast 轻提示 */
.import-toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    padding: 10px 20px;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    z-index: 3000;
    opacity: 0;
    transition: all 0.25s;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    max-width: 80%;
}
.import-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.import-toast.info { background: #202124; }
.import-toast.success { background: #1e8e3e; }
.import-toast.error { background: #d93025; }
</style>
</head>
<body>

<!-- ========== Page Header ========== -->
<div class="page-header">
    <div class="ph-icon"><i class="fas fa-rotate-left"></i></div>
    <div>
        <h1>常态化监测</h1>
        <div class="ph-sub">农村自建房常态化监测排查记录 · 按村聚合展示 · 支持批量导入</div>
    </div>
</div>

<!-- ========== Filter Section ========== -->
<div class="filter-section">
    <div class="filter-row">
        <div class="filter-item" style="min-width:200px;flex:1.5;">
            <label>任务名称</label>
            <input type="text" class="filter-input" id="filterName" placeholder="请输入任务名称">
        </div>
        <div class="filter-item" style="min-width:160px;">
            <label>镇/街道</label>
            <select class="filter-select" id="filterUnit">
                <option value="">全部</option>
                <option value="南桥镇">南桥镇</option>
                <option value="奉城镇">奉城镇</option>
                <option value="庄行镇">庄行镇</option>
                <option value="金汇镇">金汇镇</option>
                <option value="青村镇">青村镇</option>
                <option value="柘林镇">柘林镇</option>
                <option value="四团镇">四团镇</option>
                <option value="海湾镇">海湾镇</option>
                <option value="西渡街道">西渡街道</option>
                <option value="奉浦街道">奉浦街道</option>
                <option value="海湾旅游区">海湾旅游区</option>
                <option value="头桥街道">头桥街道</option>
                <option value="金海街道">金海街道</option>
            </select>
        </div>
        <div class="filter-item" style="min-width:150px;">
            <label>村/居委</label>
            <input type="text" class="filter-input" id="filterVillage" placeholder="请输入村/居委">
        </div>
        <div class="filter-item" style="min-width:140px;">
            <label>排查人员</label>
            <input type="text" class="filter-input" id="filterPerson" placeholder="请输入排查人员">
        </div>
        <div class="filter-item" style="min-width:120px;">
            <label>紧急程度</label>
            <select class="filter-select" id="filterUrgency">
                <option value="">全部</option>
                <option value="高">高</option>
                <option value="中">中</option>
                <option value="低">低</option>
            </select>
        </div>
        <div class="filter-item" style="min-width:120px;">
            <label>发现隐患</label>
            <select class="filter-select" id="filterHidden">
                <option value="">全部</option>
                <option value="yes">有隐患</option>
                <option value="no">无隐患</option>
            </select>
        </div>
        <div class="filter-actions" style="margin-left:auto;">
            <button class="btn btn-primary" onclick="applyFilter()"><i class="fas fa-search"></i> 搜索</button>
            <button class="btn btn-secondary" onclick="resetFilter()"><i class="fas fa-undo"></i> 重置</button>
        </div>
    </div>
</div>

<!-- ========== 常态化监测 · 排查记录 ========== -->
<div class="section-card">
    <div class="section-header">
        <i class="fa-solid fa-rotate-left"></i>
        常态化监测 · 排查记录
        <div style="margin-left:auto;display:flex;align-items:center;gap:12px;">
            <span style="font-size:12px;color:var(--text-secondary);">按村聚合，点击查看该村所有户的排查记录</span>
            <button class="btn btn-primary" style="padding:6px 14px;font-size:13px;" onclick="openImportModal()"><i class="fas fa-file-import"></i> 批量导入</button>
        </div>
    </div>
    <div class="section-body">
        <div class="table-scroll-wrapper">
            <table class="data-table" id="taskTable" style="display: table;">
                <thead>
                    <tr>
                        <th>任务名称</th>
                        <th>紧急程度</th>
                        <th>排查户数</th>
                        <th>镇/街道</th>
                        <th>村/居委</th>
                        <th>排查人员</th>
                        <th>完成日期</th>
                        <th>发现隐患</th>
                        <th>PC补充</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody"></tbody>
            </table>
        </div>
        <div class="empty-state" id="emptyState" style="display:none;">
            <i class="fas fa-clipboard-list"></i>
            <p>暂无常态化监测排查记录</p>
        </div>
    </div>
    <div class="pagination" id="pagination"></div>
</div>

<!-- 批量导入弹窗（排查详情 / 隐患整治 两块） -->
<div class="modal-overlay" id="importModal">
    <div class="modal" style="max-width:760px;">
        <div class="modal-header">
            <h3><i class="fas fa-file-import"></i> 常态化监测 · 批量导入</h3>
            <button class="modal-close" onclick="closeImportModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <!-- 块切换 -->
            <div class="content-tabs" id="importTabs" style="margin-bottom:16px;">
                <div class="content-tab active" data-import-type="inspect" onclick="switchImportType('inspect')"><i class="fas fa-search"></i> 排查详情导入</div>
                <div class="content-tab" data-import-type="rectify" onclick="switchImportType('rectify')"><i class="fas fa-tools"></i> 隐患整治导入</div>
            </div>

            <!-- 上传区 -->
            <div style="border:1px dashed var(--border);border-radius:10px;padding:18px;text-align:center;background:#fafbfc;">
                <input type="file" id="importFileInput" accept=".xlsx,.xls" style="display:none;" onchange="handleImportFile(this)">
                <i class="fas fa-cloud-upload-alt" style="font-size:28px;color:var(--primary);"></i>
                <div style="margin:10px 0 14px;color:var(--text-secondary);font-size:13px;" id="importHint">请选择 Excel 文件（.xlsx / .xls），按模板列头填写，不含照片</div>
                <div style="display:flex;gap:10px;justify-content:center;">
                    <button class="btn btn-primary" onclick="document.getElementById('importFileInput').click()"><i class="fas fa-folder-open"></i> 选择文件</button>
                    <button class="btn" onclick="downloadImportTemplate()"><i class="fas fa-download"></i> 下载模板</button>
                </div>
            </div>

            <!-- 解析/校验结果与预览 -->
            <div id="importPreview" style="display:none;margin-top:16px;"></div>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeImportModal()">取消</button>
            <button class="btn btn-primary" id="importConfirmBtn" style="display:none;" onclick="confirmImport()"><i class="fas fa-check"></i> 确认导入</button>
        </div>
    </div>
</div>

<script src="../js/house-arch-data.js"></script>
<script>
// Theme sync
window.addEventListener('message', function(e) {
    if (e.data && e.data.action === 'setTheme') {
        document.documentElement.setAttribute('data-theme', e.data.theme);
    }
});

function getLocalDateString(d = new Date()) {
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

function getUrgencyColor(urgency) {
    if (urgency === 'high' || urgency === '高') return 'var(--danger)';
    if (urgency === 'medium' || urgency === '中') return 'var(--warning)';
    if (urgency === 'low' || urgency === '低') return 'var(--success)';
    return 'var(--text-secondary)';
}

function getUrgencyClass(urgency) {
    if (urgency === 'high' || urgency === '高') return 'urgency-high';
    if (urgency === 'medium' || urgency === '中') return 'urgency-medium';
    if (urgency === 'low' || urgency === '低') return 'urgency-low';
    return '';
}

// ==================== 常态化监测 · 服务端记录聚合成任务 ====================
const REVIEW2026_MIGRATE_KEY = 'review2026_migrated'; // localStorage 一次性迁移标记

let allTasks = [];          // 聚合后的全部任务（按村）
const PAGE_SIZE = 10;
let currentPage = 1;

function review2026Aggregate(records) {
    // records: submitted 的 review-2026 记录数组
    // 返回 [{town, village, houseNos[], hiddenCount, person, finishTime, records[]}]
    const map = {};
    records.filter(r => r && r.status === 'submitted').forEach(r => {
        const town = r.town || r.addressTown || '未知镇';
        const village = r.village || r.communityName || r.addressVillage || '未知村';
        const key = town + '|' + village;
        if (!map[key]) {
            map[key] = { town, village, houseNos: [], hiddenCount: 0, persons: {}, finishTime: '', records: [] };
        }
        const g = map[key];
        if (r.houseNo && g.houseNos.indexOf(r.houseNo) < 0) g.houseNos.push(r.houseNo);
        // 结论判定隐患
        const concl = (r.answers && (r.answers.conclusion || r.answers.result)) || '';
        if (/隐患|危险|C级|D级|需要整改|存在/.test(concl)) g.hiddenCount++;
        if (r.inspectorSignature) g.persons[r.inspectorSignature] = 1;
        if (r.submitTime && r.submitTime > g.finishTime) g.finishTime = r.submitTime;
        g.records.push(r);
    });
    return Object.values(map);
}

function review2026BuildTask(group) {
    const person = Object.keys(group.persons)[0] || '排查员';
    const finishDate = group.finishTime ? group.finishTime.slice(0, 10) : getLocalDateString();
    const total = group.houseNos.length;
    return {
        id: 'R2026-' + group.town + '-' + group.village,
        name: group.town + group.village + ' 常态化监测',
        urgency: group.hiddenCount > 0 ? 'high' : 'medium',
        urgencyLabel: group.hiddenCount > 0 ? '高' : '中',
        houseCount: total,
        town: group.town,
        village: group.village,
        person: person,
        finishTime: group.finishTime ? group.finishTime.replace('T', ' ').slice(0, 16) : finishDate,
        hiddenCount: group.hiddenCount,
        houseNos: group.houseNos,
        records: group.records
    };
}

function loadRecords() {
    fetch('/api/review-2026-records')
        .then(r => r.ok ? r.json() : [])
        .then(records => {
            if (!Array.isArray(records)) records = [];
            const groups = review2026Aggregate(records);
            allTasks = groups.map(review2026BuildTask);
            applyFilter(true);
        })
        .catch(() => {
            allTasks = [];
            applyFilter(true);
        });
}

// 一次性迁移 localStorage 存量到服务端
(function migrateLocalOnce() {
    if (localStorage.getItem(REVIEW2026_MIGRATE_KEY)) return;
    try {
        const local = JSON.parse(localStorage.getItem('review-2026-records') || '[]');
        if (Array.isArray(local) && local.length) {
            fetch('/api/review-2026-records', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(local)
            }).then(() => {
                localStorage.setItem(REVIEW2026_MIGRATE_KEY, '1');
                loadRecords();
            }).catch(() => {});
        } else {
            localStorage.setItem(REVIEW2026_MIGRATE_KEY, '1');
        }
    } catch (e) { localStorage.setItem(REVIEW2026_MIGRATE_KEY, '1'); }
})();

function getFilteredTasks() {
    const name = document.getElementById('filterName').value.toLowerCase();
    const town = document.getElementById('filterUnit').value;
    const village = document.getElementById('filterVillage').value.toLowerCase();
    const person = document.getElementById('filterPerson').value.toLowerCase();
    const urgency = document.getElementById('filterUrgency').value;
    const hidden = document.getElementById('filterHidden').value;
    return allTasks.filter(t => {
        const matchName = !name || (t.name || '').toLowerCase().includes(name);
        const matchTown = !town || t.town === town;
        const matchVillage = !village || (t.village || '').toLowerCase().includes(village);
        const matchPerson = !person || (t.person || '').toLowerCase().includes(person);
        const matchUrgency = !urgency || t.urgencyLabel === urgency;
        const matchHidden = !hidden || (hidden === 'yes' ? (t.hiddenCount || 0) > 0 : (t.hiddenCount || 0) === 0);
        return matchName && matchTown && matchVillage && matchPerson && matchUrgency && matchHidden;
    });
}

function applyFilter(keepPage) {
    if (!keepPage) currentPage = 1;
    renderTable(getFilteredTasks());
}

function resetFilter() {
    document.getElementById('filterName').value = '';
    document.getElementById('filterUnit').value = '';
    document.getElementById('filterVillage').value = '';
    document.getElementById('filterPerson').value = '';

function renderTable(data) {
    const tbody = document.getElementById('taskTableBody');
    const emptyState = document.getElementById('emptyState');
    const table = document.getElementById('taskTable');

    if (data.length === 0) {
        table.style.display = 'none';
        emptyState.style.display = 'flex';
        renderPagination(0);
        return;
    }

    table.style.display = 'table';
    emptyState.style.display = 'none';

    // 分页切片
    const totalPages = Math.ceil(data.length / PAGE_SIZE);
    currentPage = Math.min(Math.max(1, currentPage), totalPages);
    const pageStart = (currentPage - 1) * PAGE_SIZE;
    const pageData = data.slice(pageStart, pageStart + PAGE_SIZE);

    tbody.innerHTML = pageData.map(t => {
        const urgencyColor = getUrgencyColor(t.urgency || t.urgencyLabel);
        const urgencyClass = getUrgencyClass(t.urgency || t.urgencyLabel);
        const urgencyLabel = t.urgencyLabel || '中';
        const hasHidden = (t.hiddenCount || 0) > 0;
        const pcEdited = (t.records || []).some(r => r && r.editedByPC);
        return `
        <tr data-task-id="${t.id}">
            <td><strong>${t.name}</strong></td>
            <td><span class="${urgencyClass}" style="font-size:12px;font-weight:600;color:${urgencyColor};">${urgencyLabel}</span></td>
            <td><a class="house-count-link" href="javascript:void(0);" onclick='viewTask(${JSON.stringify(t.id)});event.stopPropagation();' title="查看该村排查记录"><span style="color:var(--primary);font-weight:600;">${t.houseCount || 0}</span> 户</a></td>
            <td><span style="font-size:12px;color:var(--text-secondary);">${t.town || '-'}</span></td>
            <td><span style="font-size:12px;color:var(--text-secondary);">${t.village || '-'}</span></td>
            <td><i class="fas fa-user" style="color:var(--text-secondary);margin-right:4px;font-size:11px;"></i>${t.person || '-'}</td>
            <td>${t.finishTime || '-'}</td>
            <td>${hasHidden ? `<span class="rectify-cell unfixed">${t.hiddenCount}处 · 有隐患</span>` : '<span class="rectify-cell none">无隐患</span>'}</td>
            <td>${pcEdited ? '<span class="edited-badge" style="display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:8px;background:#f9f0ff;color:#9254de;font-weight:600;"><i class="fas fa-pen"></i> 已补充</span>' : '<span style="color:var(--text-secondary);font-size:12px;">-</span>'}</td>
            <td>
                <div class="actions">
                    <button class="action-link view" onclick='viewTask(${JSON.stringify(t.id)})'>查看</button>
                </div>
            </td>
        </tr>`;
    }).join('');

    renderPagination(data.length);
}

function renderPagination(total) {
    const container = document.getElementById('pagination');
    if (total === 0) { container.innerHTML = ''; return; }
    const totalPages = Math.ceil(total / PAGE_SIZE);
    const current = Math.min(currentPage, totalPages);
    const start = (current - 1) * PAGE_SIZE + 1;
    const end = Math.min(current * PAGE_SIZE, total);

    const pages = [];
    if (totalPages <= 7) {
        for (let i = 1; i <= totalPages; i++) pages.push(i);
    } else {
        pages.push(1);
        if (current > 3) pages.push('...');
        for (let i = Math.max(2, current - 1); i <= Math.min(totalPages - 1, current + 1); i++) pages.push(i);
        if (current < totalPages - 2) pages.push('...');
        pages.push(totalPages);
    }

    container.innerHTML = `
        <div class="page-info">显示第 <strong>${start}</strong> 到 <strong>${end}</strong> 条，共 <strong>${total}</strong> 条</div>
        <div class="page-btns">
            <button class="page-btn" ${current === 1 ? 'disabled' : ''} onclick="goToPage(${current - 1})"><i class="fas fa-chevron-left"></i></button>
            ${pages.map(p => p === '...'
                ? '<button class="page-btn" disabled>…</button>'
                : `<button class="page-btn ${p === current ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`
            ).join('')}
            <button class="page-btn" ${current === totalPages ? 'disabled' : ''} onclick="goToPage(${current + 1})"><i class="fas fa-chevron-right"></i></button>
        </div>`;
}

function goToPage(page) {
    currentPage = page;
    renderTable(getFilteredTasks());
}

function viewTask(id) {
    const task = allTasks.find(t => t.id == id);

}

// 读取并解析文件
async function handleImportFile(input) {
    var file = input.files && input.files[0];
    if (!file) return;
    try {
        showToast('正在解析文件…', 'info');
        var buf = await file.arrayBuffer();
        var wb = XLSX.read(buf, { type: 'array' });
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false });
        if (!aoa || aoa.length < 2) {
            showToast('Excel 为空或没有数据行', 'error');
            return;
        }
        var headerRow = (aoa[0] || []).map(function (h) { return String(h).trim(); });
        var cols = getImportCols();
        // 列头 -> 列索引
        var colIndex = {};
        cols.forEach(function (c) {
            var idx = headerRow.indexOf(c.col);
            if (idx >= 0) colIndex[c.col] = idx;
        });
        if (colIndex['唯一标识'] === undefined) {
            showToast('未找到必填列「唯一标识」，请使用下载的模板', 'error');
            return;
        }
        // 拉取服务端全量用于判重
        var serverList = [];
        try {
            var resp = await fetch('/api/review-2026-records');
            if (resp.ok) serverList = await resp.json();
        } catch (e) { /* 离线也允许预览 */ }
        if (!Array.isArray(serverList)) serverList = [];
        importState.serverList = serverList;
        var existingByNo = {};
        serverList.forEach(function (r) { if (r && r.houseNo) existingByNo[r.houseNo] = r; });

        var rows = [];
        var seenInFile = {};
        for (var i = 1; i < aoa.length; i++) {
            var line = aoa[i];
            if (!line || line.every(function (v) { return String(v).trim() === ''; })) continue; // 跳过全空行
            var rowNo = i + 1; // Excel 行号(1-based，含表头)
            var parsed = parseImportRow(line, colIndex, cols, rowNo);
            var houseNo = parsed.data.houseNo;
            // 校验：必填
            if (!houseNo) {
                parsed.status = 'error'; parsed.error = '唯一标识为空';
            } else if (seenInFile[houseNo]) {
                parsed.status = 'error'; parsed.error = '文件内唯一标识重复（第' + seenInFile[houseNo] + '行）';
            } else if (importState.type === 'rectify' && !existingByNo[houseNo]) {
                parsed.status = 'error'; parsed.error = '记录不存在，无法导入整治（需先做排查导入）';
            } else {
                parsed.status = existingByNo[houseNo] ? 'update' : 'new';
                seenInFile[houseNo] = rowNo;
            }
            rows.push(parsed);
        }
        importState.rows = rows;
        renderImportPreview();
    } catch (err) {
        console.error('导入解析失败:', err);
        showToast('文件解析失败：' + (err.message || err), 'error');
    }
}

// 按列映射把一行 Excel 转成记录字段
function parseImportRow(line, colIndex, cols, rowNo) {
    var data = {};
    var previewPairs = [];
    cols.forEach(function (c) {
        var idx = colIndex[c.col];
        if (idx === undefined) return;
        var raw = line[idx];
        var val = (raw === undefined || raw === null) ? '' : String(raw).trim();
        if (c.key === 'houseNo') { data.houseNo = val; if (val) previewPairs.push(c.col + '=' + val); return; }
        if (val === '') return; // 空值不覆盖
        if (c.multi) {
            var arr = val.split(IMPORT_SPLIT_RE).map(function (s) { return s.trim(); }).filter(Boolean);
            setScopedValue(data, c, arr);
            previewPairs.push(c.col + '=' + arr.join('、'));
        } else {
            setScopedValue(data, c, val);
            previewPairs.push(c.col + '=' + val);
        }
    });
    return { data: data, status: 'new', error: '', rowNo: rowNo, preview: previewPairs.join('；') };
}
function setScopedValue(target, colDef, value) {
    if (colDef.scope === 'top') { target[colDef.key] = value; return; }
    if (!target[colDef.scope]) target[colDef.scope] = {};
    target[colDef.scope][colDef.key] = value;
}

// 预览渲染
function renderImportPreview() {
    var rows = importState.rows;
    var newCnt = rows.filter(function (r) { return r.status === 'new'; }).length;
    var updCnt = rows.filter(function (r) { return r.status === 'update'; }).length;
    var errCnt = rows.filter(function (r) { return r.status === 'error'; }).length;
    var box = document.getElementById('importPreview');
    var html = '<div class="import-summary">' +
        '<span class="import-stat new">新增 ' + newCnt + '</span>' +
        '<span class="import-stat update">更新 ' + updCnt + '</span>' +
        '<span class="import-stat error">失败 ' + errCnt + '</span>' +
        '<span style="margin-left:auto;font-size:12px;color:var(--text-secondary);align-self:center;">失败行不会被导入</span>' +
        '</div>';
    html += '<div class="import-scroll"><table class="import-preview-table"><thead><tr>' +
        '<th>行</th><th>结果</th><th>唯一标识</th><th>内容 / 失败原因</th></tr></thead><tbody>';
    rows.forEach(function (r) {
        var statusText = r.status === 'new' ? '新增' : (r.status === 'update' ? '更新' : '失败');
        var desc = r.status === 'error' ? ('<span style="color:#d93025;">' + escapeImportHtml(r.error) + '</span>') : escapeImportHtml(r.preview || '（仅编号，无其它字段）');
        html += '<tr class="row-' + r.status + '"><td>' + r.rowNo + '</td><td>' + statusText + '</td><td>' + escapeImportHtml(r.data.houseNo || '—') + '</td><td title="' + escapeImportHtml(r.preview || r.error || '') + '">' + desc + '</td></tr>';
    });
    html += '</tbody></table></div>';
    box.innerHTML = html;
    box.style.display = 'block';
    var valid = newCnt + updCnt;
    var btn = document.getElementById('importConfirmBtn');
    btn.style.display = valid > 0 ? '' : 'none';
    btn.textContent = '确认导入（' + valid + ' 条）';
    showToast('解析完成：新增 ' + newCnt + '，更新 ' + updCnt + '，失败 ' + errCnt, valid > 0 ? 'success' : 'error');
}
function escapeImportHtml(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
}

// 确认导入：合并 -> 全量 POST -> 刷新
async function confirmImport() {
    var validRows = importState.rows.filter(function (r) { return r.status === 'new' || r.status === 'update'; });
    if (validRows.length === 0) { showToast('没有可导入的数据', 'error'); return; }
    var btn = document.getElementById('importConfirmBtn');
    btn.disabled = true;
    try {
        showToast('正在写回服务端…', 'info');
        // 重新 GET 最新全量（防止预览期间他人改动）
        var serverList = [];
        var resp = await fetch('/api/review-2026-records');
        if (resp.ok) serverList = await resp.json();
        if (!Array.isArray(serverList)) serverList = [];
        var indexByNo = {};
        serverList.forEach(function (r, i) { if (r && r.houseNo) indexByNo[r.houseNo] = i; });
        var now = new Date().toLocaleString('zh-CN', { hour12: false });
        var isRectify = (importState.type === 'rectify');
        validRows.forEach(function (r) {
            var houseNo = r.data.houseNo;
            var idx = indexByNo[houseNo];
            if (isRectify) {
                if (idx === undefined) return; // 预览时已拦截，双保险
                var rec = serverList[idx];
                rec.rectify = rec.rectify || {};
                rec.rectify.appraisal = Object.assign({}, rec.rectify.appraisal, r.data.appraisal || {});
                rec.rectify.measures = Object.assign({}, rec.rectify.measures, r.data.measures || {});
                // 兜底：rectify 页渲染依赖这些数组字段，缺失会导致 .length 报错
                var m = rec.rectify.measures;
                if (!Array.isArray(m.controlTypes)) m.controlTypes = [];
                if (!Array.isArray(m.engineeringTypes)) m.engineeringTypes = [];
                if (!Array.isArray(m.controlPhotos)) m.controlPhotos = [];
                if (!Array.isArray(m.engineeringPhotos)) m.engineeringPhotos = [];
                rec.rectify.updateTime = now;
                rec.editedByPC = true;
                rec.editedTime = now;
            } else {
                if (idx === undefined) {
                    // 新建记录
                    var newRec = {
                        id: 'R2026-IMPORT-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
                        houseNo: houseNo,
                        town: r.data.town || '',
                        village: r.data.village || '',
                        status: 'submitted',
                        submitTime: now,
                        source: 'pc-import',
                        answers: Object.assign({}, r.data.answers || {}),
                        photos: {},
                        checkin: {},
                        editedByPC: true,
                        editedTime: now
                    };
                    serverList.unshift(newRec);
                    // 重建索引（unshift 后全部前移）
                    indexByNo = {};
                    serverList.forEach(function (x, i) { if (x && x.houseNo) indexByNo[x.houseNo] = i; });
                } else {
                    var rec2 = serverList[idx];
                    if (r.data.town) rec2.town = r.data.town;
                    if (r.data.village) rec2.village = r.data.village;
                    rec2.answers = Object.assign({}, rec2.answers, r.data.answers || {});
                    rec2.status = 'submitted';
                    if (!rec2.submitTime) rec2.submitTime = now;
                    rec2.editedByPC = true;
                    rec2.editedTime = now;
                }
            }
        });
        var post = await fetch('/api/review-2026-records', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(serverList)
        });
        if (!post.ok) throw new Error('写回失败 HTTP ' + post.status);

        // 同步到农房档案：排查导入写 inspectionRecords；整治导入写鉴定/整治记录（均按 srcKey 去重）
        try {
            if (typeof syncInspectRecordToHouse === 'function') {
                validRows.forEach(function (r) {
                    var idx = indexByNo[r.data.houseNo];
                    if (idx === undefined) return;
                    var rec = serverList[idx];
                    if (isRectify) {
                        if (typeof syncRectifyRecordToHouse === 'function') syncRectifyRecordToHouse(rec, '常态化监测');
                    } else {
                        syncInspectRecordToHouse(rec, '常态化监测');
                    }
                });
            }
        } catch (e) { console.warn('[导入] 档案同步失败', e); }

        showToast('导入完成：成功 ' + validRows.length + ' 条', 'success');
        closeImportModal();
        // 刷新列表
        loadRecords();
    } catch (err) {
        console.error('导入写回失败:', err);
        showToast('导入写回失败：' + (err.message || err), 'error');
    } finally {
        btn.disabled = false;
    }
}

// ==================== 初始化 ====================
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadRecords);
} else {
    loadRecords();
}
</script>
