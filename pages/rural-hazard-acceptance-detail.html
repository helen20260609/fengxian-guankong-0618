<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>整治验收 - 子任务详情</title>
<link rel="stylesheet" href="./all.min.css">
<link rel="stylesheet" href="./ui-modal.css">
<style>
:root {
    --primary: #1a73e8; --success: #188038; --warning: #e37400; --danger: #d93025;
    --bg-page: #f1f3f4; --bg-card: #ffffff; --text-main: #202124; --text-sub: #5f6368; --border: #e0e0e0;
}
[data-theme="dark"] {
    --bg-page: #121416; --bg-card: #1e2126; --text-main: #e8eaed; --text-sub: #9aa0a6; --border: #3c4043;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-page); color: var(--text-main); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; }
.top-bar { background: var(--bg-card); padding: 14px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
.btn-back { border: none; background: none; color: var(--primary); cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.top-bar h2 { font-size: 17px; }
.container { padding: 20px 28px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 22px; }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.card-title .fa-solid { color: var(--primary); }
.info-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 24px; }
.info-item .lbl { font-size: 12px; color: var(--text-sub); margin-bottom: 3px; }
.info-item .val { font-size: 14px; }
.status-tag { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 12px; }
.status-tag.wait-check { background: rgba(227,116,0,0.1); color: var(--warning); }
.status-tag.done { background: rgba(24,128,56,0.1); color: var(--success); }
.req-box { background: rgba(26,115,232,0.05); border-left: 3px solid var(--primary); border-radius: 0 8px 8px 0; padding: 12px 16px; line-height: 1.7; }
.house-card { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
.house-head { background: rgba(26,115,232,0.05); padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.house-head .name { font-weight: 700; font-size: 14px; }
.house-head .meta { color: var(--text-sub); }
.house-body { padding: 12px 16px; }
.risk-table { width: 100%; border-collapse: collapse; }
.risk-table th { text-align: left; font-size: 12px; color: var(--text-sub); padding: 8px 10px; border-bottom: 1px solid var(--border); font-weight: 600; }
.risk-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
.lv-tag { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 12px; }
.lv-red { background: rgba(217,48,37,0.1); color: var(--danger); }
.lv-yellow { background: rgba(227,116,0,0.1); color: var(--warning); }
.part-photo { width: 64px; height: 44px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); cursor: zoom-in; margin: 2px 4px 2px 0; }
.form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.form-row label { font-size: 13px; color: var(--text-sub); }
.form-row label .req { color: var(--danger); }
.form-row select, .form-row textarea, .form-row input { border: 1px solid var(--border); border-radius: 6px; padding: 9px 12px; font-size: 14px; font-family: inherit; background: var(--bg-card); color: var(--text-main); }
.form-row textarea { min-height: 90px; resize: vertical; }
.radio-row { display: flex; gap: 22px; align-items: center; }
.radio-item { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
.photo-wall { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.photo-item { width: 110px; position: relative; }
.photo-item img { width: 110px; height: 78px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: zoom-in; }
.photo-item .del { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--danger); color: #fff; border: none; cursor: pointer; font-size: 11px; line-height: 20px; }
.photo-add { width: 110px; height: 78px; border: 1px dashed var(--border); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-sub); cursor: pointer; font-size: 12px; }
.photo-add:hover { border-color: var(--primary); color: var(--primary); }
.action-bar { display: flex; gap: 12px; justify-content: flex-end; }
.btn { height: 38px; padding: 0 22px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn.btn-success { background: var(--success); border-color: var(--success); color: #fff; }
.btn.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.timeline { position: relative; padding-left: 20px; }
.timeline::before { content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.tl-item { position: relative; padding-bottom: 14px; }
.tl-item::before { content: ''; position: absolute; left: -19px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.tl-time { font-size: 12px; color: var(--text-sub); }
.tl-text { font-size: 13px; margin-top: 2px; }
.accept-banner { border-radius: 8px; padding: 14px 18px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
.accept-banner.pass { background: rgba(24,128,56,0.08); color: var(--success); border: 1px solid rgba(24,128,56,0.3); }
.preview-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 9999; cursor: zoom-out; }
.preview-mask img { max-width: 86vw; max-height: 86vh; border-radius: 8px; }
.toast-tip { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); background: rgba(32,33,36,0.92); color: #fff; padding: 10px 22px; border-radius: 8px; font-size: 14px; z-index: 10000; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast-tip.show { opacity: 1; }
.toast-tip.warn { background: rgba(217,48,37,0.92); }
</style>
</head>
<body>
<div class="top-bar">
    <button class="btn-back" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i>返回</button>
    <h2 id="page-title">整治验收 - 子任务详情</h2>
</div>
<div class="container">
    <div class="card">
        <div class="card-title"><i class="fa-solid fa-clipboard-list"></i>整治任务信息</div>
        <div class="info-grid">
            <div class="info-item"><div class="lbl">子任务名称</div><div class="val" id="s-name">-</div></div>
            <div class="info-item"><div class="lbl">责任人</div><div class="val" id="s-person">-</div></div>
            <div class="info-item"><div class="lbl">分发处置方式</div><div class="val" id="s-method">-</div></div>
            <div class="info-item"><div class="lbl">完成时限</div><div class="val" id="s-deadline">-</div></div>
            <div class="info-item"><div class="lbl">当前状态</div><div class="val" id="s-status">-</div></div>
            <div class="info-item"><div class="lbl">验收组织单位</div><div class="val" id="s-receiver">-</div></div>
            <div class="info-item"><div class="lbl">下发时间</div><div class="val" id="s-time">-</div></div>
            <div class="info-item"><div class="lbl">覆盖房屋</div><div class="val" id="s-count">-</div></div>
        </div>
        <div style="margin-top:14px;">
            <div class="lbl" style="font-size:12px;color:var(--text-sub);margin-bottom:6px;">总体处置要求</div>
            <div class="req-box" id="s-req">-</div>
        </div>
    </div>

    <div id="accept-banner" style="display:none;"></div>

    <div class="card">
        <div class="card-title"><i class="fa-solid fa-file-lines"></i>处置记录</div>
        <div class="info-grid" style="margin-bottom:14px;">
            <div class="info-item"><div class="lbl">实际处置方式</div><div class="val" id="r-method">-</div></div>
            <div class="info-item"><div class="lbl">提交验收时间</div><div class="val" id="r-time">-</div></div>
        </div>
        <div class="form-row">
            <label>处置情况说明</label>
            <div class="req-box" id="r-note">-</div>
        </div>
        <div class="form-row">
            <label>施工过程照片（<span id="r-count">0</span> 张）</label>
            <div class="photo-wall" id="r-photos"></div>
        </div>
    </div>

    <div class="card">
        <div class="card-title"><i class="fa-solid fa-house-chimney-crack"></i>房屋信息与风险部位</div>
        <div id="house-list"></div>
    </div>

    <div class="card" id="form-card" style="display:none;">
        <div class="card-title"><i class="fa-solid fa-clipboard-check"></i>竣工验收</div>
        <div class="form-row">
            <label>验收结论 <span class="req">*</span></label>
            <div class="radio-row">
                <label class="radio-item"><input type="radio" name="result" value="通过" checked> 通过（风险消除，归档整治档案）</label>
                <label class="radio-item"><input type="radio" name="result" value="不通过"> 不通过（退回责任人重新处置）</label>
            </div>
        </div>
        <div class="form-row">
            <label>验收记录 <span class="req">*</span></label>
            <textarea id="f-note" placeholder="请填写验收情况，如现场核验结果、整治质量评价、遗留问题等"></textarea>
        </div>
        <div class="form-row">
            <label>验收照片 <span class="req">*</span>（验收通过后自动归档至房屋整治档案）</label>
            <div class="photo-wall" id="photo-wall">
                <div class="photo-add" onclick="document.getElementById('f-photo').click()">
                    <i class="fa-solid fa-camera" style="font-size:20px;"></i>上传照片
                </div>
            </div>
            <input type="file" id="f-photo" accept="image/*" multiple style="display:none;">
        </div>
        <div class="action-bar">
            <button class="btn btn-success" onclick="submitAcceptance()"><i class="fa-solid fa-circle-check"></i>确认验收结论</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title"><i class="fa-solid fa-clock-rotate-left"></i>进度动态</div>
        <div class="timeline" id="timeline"></div>
    </div>
</div>

<div class="preview-mask" id="preview-mask" onclick="this.style.display='none'"><img id="preview-img"></div>

<script src="./ui-modal.js"></script>
<script src="../js/house-arch-data.js"></script>
<script src="./rural-audit-seed.js"></script>
<script>
const ST_META = { '待验收': { cls: 'wait-check' }, '已完成': { cls: 'done' }, '处置中': { cls: 'wait-check' } };
let task = null, pkg = null, sub = null;
let acceptPhotos = [];

function getParams() {
    const q = new URLSearchParams(location.search);
    return { tid: q.get('id'), sid: q.get('sub') };
}
function now() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function savePkg() {
    const pkgs = JSON.parse(localStorage.getItem('hazardDispatchPackages') || '{}');
    pkgs[task.id] = pkg;
    localStorage.setItem('hazardDispatchPackages', JSON.stringify(pkgs));
}
function pushUpdate(text) {
    sub.updates = sub.updates || [];
    sub.updates.push({ time: now(), text: text });
}
function syncHazardStatus(status) {
    if (typeof patchHouseRecord !== 'function') return;
    (sub.houseNos || []).forEach(no => {
        patchHouseRecord(no, rec => {
            (rec.hazards || []).forEach(h => { if (h.auditState === '已通过') h.flowStatus = status; });
        });
    });
}
function archiveHouse() {
    // 走数据层 patchHouseRecord：本地+服务端双写，且 closeStatus='已通过' 与 normalize 销号语义兼容
    // （normalize 会将 risk 置 safe、riskLevel 置第一类、governStatus 置已治理，并保留 originalRiskLevel 原始等级）
    if (typeof patchHouseRecord !== 'function') return;
    (sub.houseNos || []).forEach(no => {
        patchHouseRecord(no, rec => {
            (rec.hazards || []).forEach(h => { if (h.auditState === '已通过') h.flowStatus = '已整治'; });
            rec.closeStatus = '已通过';
            rec.rectifyStatus = '已完成';
            rec.rectifyArchive = {
                taskName: task.name, subName: sub.name, method: (sub.handleReport && sub.handleReport.method) || sub.method,
                handleNote: sub.handleReport ? sub.handleReport.note : '',
                processPhotos: sub.handleReport ? sub.handleReport.processPhotos || [] : [],
                acceptNote: sub.acceptance.note, acceptPhotos: sub.acceptance.photos || [],
                acceptOrg: sub.acceptance.org, archiveTime: sub.acceptance.time
            };
        });
    });
}

function renderHeader() {
    document.getElementById('s-name').textContent = sub.name;
    document.getElementById('s-person').textContent = sub.person + '（' + sub.role + '）';
    document.getElementById('s-method').textContent = sub.method;
    document.getElementById('s-deadline').textContent = sub.deadline || '-';
    document.getElementById('s-status').innerHTML = `<span class="status-tag ${(ST_META[sub.status] || {}).cls || ''}">${sub.status}</span>`;
    document.getElementById('s-receiver').textContent = pkg.receiverName;
    document.getElementById('s-time').textContent = pkg.dispatchTime || '-';
    document.getElementById('s-count').textContent = (sub.houseNos || []).length + ' 栋';
    document.getElementById('s-req').textContent = pkg.requirement || '无';
}
function renderReport() {
    const r = sub.handleReport || {};
    document.getElementById('r-method').textContent = r.method || sub.method;
    document.getElementById('r-time').textContent = r.submitTime || '-';
    document.getElementById('r-note').textContent = r.note || '无';
    document.getElementById('r-count').textContent = (r.processPhotos || []).length;
    document.getElementById('r-photos').innerHTML = (r.processPhotos || []).map(p => `
        <div class="photo-item"><img src="${p}" onclick="preview('${encodeURIComponent(p)}')"></div>
    `).join('') || '<span style="color:var(--text-sub);font-size:13px;">未上传</span>';
}
function renderHouses() {
    const arch = JSON.parse(localStorage.getItem('houseArchData') || '{}');
    const proj = (task.selectedProjects || []);
    document.getElementById('house-list').innerHTML = (sub.houseNos || []).map(no => {
        const a = arch[no] || {};
        const t = proj.find(p => String(p.houseNo || p.no) === String(no)) || {};
        const pick = (tv, av) => (tv !== undefined && tv !== null && tv !== '') ? tv : (typeof av === 'object' && av !== null ? (av.label || av.value || av.name || '-') : (av || '-'));
        const items = (t.checkItems || []).filter(c => c.level === 'red' || c.level === 'yellow');
        const rowsHtml = items.map(c => {
            const photos = (c.photos || []).map(p => `<img class="part-photo" src="${p}" onclick="preview('${encodeURIComponent(p)}')">`).join('');
            const desc = [c.content, c.risk ? '风险：' + c.risk + (c.accident ? '；可能事故：' + c.accident : '') : '', c.description ? '现场描述：' + c.description : ''].filter(Boolean).join('<br>');
            return `<tr>
                <td style="white-space:nowrap;">${esc(c.main || '')}${c.sub ? ' · ' + esc(c.sub) : ''}</td>
                <td><span class="lv-tag ${c.level === 'red' ? 'lv-red' : 'lv-yellow'}">${c.level === 'red' ? '第三类（严重）' : '第二类（一定）'}</span></td>
                <td>${desc || '-'}</td>
                <td>${photos || '-'}</td>
            </tr>`;
        }).join('');
        return `<div class="house-card">
            <div class="house-head">
                <span class="name">${esc(pick(t.owner, a.owner))}</span>
                <span class="meta"><i class="fa-solid fa-location-dot"></i>${esc(pick(t.address, a.address))}</span>
                <span class="meta">结构类型：${esc(pick(t.structure, a.structureType || a.structure))}</span>
                <span class="meta">建成时间：${esc(pick(t.year, a.builtYear || a.buildYear))}</span>
                <span class="meta">层数：${esc(pick(t.floors, a.floors))}层</span>
            </div>
            <div class="house-body">
                ${items.length ? `<table class="risk-table">
                    <thead><tr><th style="width:150px;">风险部位</th><th style="width:130px;">风险等级</th><th>风险描述</th><th style="width:90px;">现场照片</th></tr></thead>
                    <tbody>${rowsHtml}</tbody>
                </table>` : '<div style="color:var(--text-sub);padding:8px 0;">该房屋无红/黄风险检查项记录</div>'}
            </div>
        </div>`;
    }).join('');
}

function renderPhotoWall() {
    const wall = document.getElementById('photo-wall');
    wall.innerHTML = acceptPhotos.map((p, i) => `
        <div class="photo-item">
            <img src="${p}" onclick="preview('${encodeURIComponent(p)}')">
            <button class="del" onclick="delPhoto(${i})"><i class="fa-solid fa-xmark"></i></button>
        </div>`).join('') + `
        <div class="photo-add" onclick="document.getElementById('f-photo').click()">
            <i class="fa-solid fa-camera" style="font-size:20px;"></i>上传照片
        </div>`;
}
function delPhoto(i) { acceptPhotos.splice(i, 1); renderPhotoWall(); }
function preview(src) {
    document.getElementById('preview-img').src = decodeURIComponent(src);
    document.getElementById('preview-mask').style.display = 'flex';
}
document.getElementById('f-photo').addEventListener('change', function (e) {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    let done = 0;
    files.forEach(f => {
        const rd = new FileReader();
        rd.onload = () => {
            acceptPhotos.push(rd.result);
            if (++done === files.length) renderPhotoWall();
        };
        rd.readAsDataURL(f);
    });
    e.target.value = '';
});

async function submitAcceptance() {
    const result = document.querySelector('input[name="result"]:checked').value;
    const note = document.getElementById('f-note').value.trim();
    if (!note) { toast('请填写验收记录', 'warn'); return; }
    if (!acceptPhotos.length) { toast('请至少上传 1 张验收照片', 'warn'); return; }
    const ok = await uiConfirm(`确认验收结论为【${result}】？\n\n${result === '通过' ? '通过后将自动更新房屋风险等级与整治状态，并归档整治档案。' : '不通过将退回责任人重新处置。'}`, { title: '竣工验收' });
    if (!ok) return;
    sub.acceptance = { result: result, note: note, photos: acceptPhotos.slice(), time: now(), org: pkg.receiverName, person: '验收工作组' };
    if (result === '通过') {
        sub.status = '已完成';
        archiveHouse();
        pushUpdate(`${pkg.receiverName} 验收通过：${note}（房屋风险等级已更新，整治档案已归档）`);
    } else {
        sub.status = '处置中';
        syncHazardStatus('处置中');
        pushUpdate(`${pkg.receiverName} 验收不通过：${note}（已退回责任人重新处置）`);
    }
    savePkg();
    toast(result === '通过' ? '验收通过，整治档案已归档' : '已退回重新处置');
    setTimeout(() => { window.location.href = 'rural-hazard-acceptance-list.html'; }, 800);
}

function renderBanner() {
    const el = document.getElementById('accept-banner');
    if (sub.status !== '已完成' || !sub.acceptance) { el.style.display = 'none'; return; }
    const a = sub.acceptance;
    el.style.display = 'block';
    el.innerHTML = `<div class="accept-banner pass"><i class="fa-solid fa-circle-check"></i>验收通过 · ${esc(a.org)} · ${esc(a.time)} &nbsp;｜&nbsp; ${esc(a.note)} &nbsp;｜&nbsp; 房屋风险等级已更新为「已整治」，整治档案已归档</div>`;
}
function renderTimeline() {
    document.getElementById('timeline').innerHTML = (sub.updates || []).slice().reverse().map(u => `
        <div class="tl-item"><div class="tl-time">${esc(u.time)}</div><div class="tl-text">${esc(u.text)}</div></div>
    `).join('') || '<div style="color:var(--text-sub);">暂无动态</div>';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
let toastTimer = null;
function toast(msg, type) {
    let el = document.getElementById('toast-tip');
    if (!el) {
        el = document.createElement('div');
        el.id = 'toast-tip';
        el.className = 'toast-tip';
        document.body.appendChild(el);
    }
    el.textContent = msg;
    el.className = 'toast-tip show' + (type === 'warn' ? ' warn' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast-tip'; }, 2200);
}

function init() {
    initHouseArchSeed();
    ensureAuditSeedTasks();
    const { tid, sid } = getParams();
    const tasks = JSON.parse(localStorage.getItem('patrolTasks') || '[]');
    const pkgs = JSON.parse(localStorage.getItem('hazardDispatchPackages') || '{}');
    task = tasks.find(t => String(t.id) === String(tid));
    pkg = pkgs[tid];
    sub = pkg && (pkg.subTasks || []).find(s => s.id === sid);
    if (!task || !pkg || !sub) {
        document.querySelector('.container').innerHTML = '<div class="card" style="text-align:center;padding:60px;color:var(--text-sub);">未找到子任务，请从验收列表进入</div>';
        return;
    }
    document.getElementById('page-title').textContent = `整治验收 - ${sub.name}`;
    renderHeader();
    renderBanner();
    renderReport();
    renderHouses();
    document.getElementById('form-card').style.display = sub.status === '待验收' ? 'block' : 'none';
    renderPhotoWall();
    renderTimeline();
}
init();
</script>
