<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>房屋安全风险治理详情（城镇自建房）</title>
<link href="./all.min.css" rel="stylesheet"/>
<style>
:root{--primary:#1a73e8;--primary-dark:#1557b0;--primary-light:#e8f0fe;--danger:#d93025;--warning:#e37400;--success:#1e8e3e;--bg-dark:#f0f2f5;--bg-card:#fff;--text-primary:#202124;--text-secondary:#5f6368;--border:#dadce0;--shadow:rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',-apple-system,sans-serif;background:var(--bg-dark);color:var(--text-primary);padding:20px}
.page-card{background:var(--bg-card);border-radius:8px;box-shadow:0 1px 4px var(--shadow);overflow:hidden;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:#fafbfc}
.card-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-title i{color:var(--primary)}
.card-title .sub{font-size:12px;color:var(--text-secondary);font-weight:400}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--primary);text-decoration:none;font-size:13px;margin-bottom:12px}
.back-link:hover{text-decoration:underline}
/* 概要条 */
.summary-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding:6px 0}
.sum-item{padding:10px 16px;border-right:1px dashed var(--border)}
.sum-item:last-child{border-right:none}
.sum-label{font-size:12px;color:var(--text-secondary);margin-bottom:4px}
.sum-value{font-size:14px;font-weight:600}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;white-space:nowrap}
.tag-danger{background:#fce8e6;color:var(--danger)}.tag-warning{background:#fef7e0;color:var(--warning)}.tag-success{background:#e6f4ea;color:var(--success)}.tag-info{background:var(--primary-light);color:var(--primary)}.tag-grey{background:#f1f3f4;color:#5f6368}.tag-orange{background:#fde7d9;color:#b06000}
/* 隐患 */
.hazard-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:16px 20px}
.hazard-card{border:1px solid var(--border);border-left:4px solid var(--warning);border-radius:6px;padding:12px 14px}
.hazard-card.lv-danger{border-left-color:var(--danger)}
.hazard-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600;font-size:13px}
.hazard-desc{font-size:12px;color:var(--text-secondary);line-height:1.6}
/* 措施表 */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{background:#f8f9fa;padding:10px 12px;text-align:left;border-bottom:2px solid var(--border);color:var(--text-secondary);font-weight:600;white-space:nowrap}
.data-table td{padding:10px 12px;border-bottom:1px solid #f1f3f4;vertical-align:top}
.data-table tr:hover td{background:#f8fbff}
.block-body{padding:16px 20px}
.link{color:var(--primary);cursor:pointer}.link:hover{text-decoration:underline}
.btn{height:32px;padding:0 12px;border:none;border-radius:4px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:#fff;border:1px solid var(--primary);color:var(--primary)}.btn-outline:hover{background:var(--primary-light)}
.btn-danger-o{background:#fff;border:1px solid var(--danger);color:var(--danger)}.btn-danger-o:hover{background:#fce8e6}
.btn-xs{height:24px;padding:0 8px;font-size:12px;margin:1px 2px}
/* 详情展开 */
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 18px;background:#fafbfc;border-radius:6px;padding:12px 14px;font-size:12px}
.kv{display:flex;gap:6px;line-height:1.6}
.kv .k{color:var(--text-secondary);white-space:nowrap}
.kv .v{color:var(--text-primary);word-break:break-all}
.kv.full{grid-column:1/-1}
.photo-thumbs{display:flex;gap:6px;flex-wrap:wrap}
.photo-thumbs img{width:52px;height:40px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:pointer}
.change-log{margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.change-item{font-size:12px;padding:5px 0;color:var(--text-secondary);line-height:1.7}
/* 工程卡片 */
.eng-card{border:1px solid var(--border);border-radius:8px;margin-bottom:14px;overflow:hidden}
.eng-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fafbfc;border-bottom:1px solid var(--border);flex-wrap:wrap}
.eng-head .t{font-weight:600;font-size:14px}
.eng-head .ops{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.eng-body{padding:14px 16px}
.progress-bar{height:8px;background:#f1f3f4;border-radius:4px;overflow:hidden;width:180px}
.progress-fill{height:100%;background:var(--success)}
.contractor-info{background:var(--primary-light);border-radius:6px;padding:8px 12px;font-size:12px;line-height:1.8;margin-top:8px}
/* 节点时间轴 */
.node-flow{display:flex;gap:0;margin-top:12px}
.node-item{flex:1;text-align:center;position:relative;padding-top:26px}
.node-item::before{content:'';position:absolute;top:8px;left:0;right:0;height:2px;background:var(--border)}
.node-item:first-child::before{left:50%}
.node-item:last-child::before{right:50%}
.node-dot{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--border);z-index:1}
.node-item.done .node-dot{background:var(--success);border-color:var(--success)}
.node-item.done::before{background:var(--success)}
.node-name{font-size:13px;font-weight:600}
.node-meta{font-size:12px;color:var(--text-secondary);margin-top:3px;line-height:1.6}
/* 时间轴 */
.timeline{position:relative;padding:6px 0 6px 20px}
.timeline::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:8px 0 8px 14px;font-size:13px}
.tl-item::before{content:'';position:absolute;left:-19px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--primary)}
.tl-item.c-done::before{background:var(--success)}
.tl-item.c-warn::before{background:var(--warning)}
.tl-time{font-size:12px;color:var(--text-secondary)}
.tl-content{line-height:1.7}
/* 弹窗 */
.modal-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;justify-content:center;align-items:center}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:10px;width:680px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border);font-size:15px;font-weight:600}
.modal-close{cursor:pointer;color:var(--text-secondary);font-size:18px}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.form-row{display:flex;gap:14px;margin-bottom:14px}
.form-item{flex:1;display:flex;flex-direction:column;gap:6px}
.form-item label{font-size:13px;color:var(--text-secondary)}
.form-item label .req{color:var(--danger)}
.form-item input,.form-item select,.form-item textarea{height:34px;border:1px solid var(--border);border-radius:4px;padding:0 10px;font-size:13px;outline:none;font-family:inherit;width:100%}
.form-item textarea{height:auto;padding:8px 10px;resize:vertical}
.form-item input:focus,.form-item select:focus,.form-item textarea:focus{border-color:var(--primary)}
.upload-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.upload-box input[type=file]{font-size:12px}
.file-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.file-chip{background:#f1f3f4;border-radius:4px;padding:3px 8px;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.file-chip i{color:var(--text-secondary);cursor:pointer}
.hint{font-size:12px;color:var(--text-secondary);margin-top:4px;line-height:1.6}
.section-gap{margin-bottom:16px}
</style>
</head>
<body>

<a class="back-link" href="hs-govern-urban.html"><i class="fas fa-arrow-left"></i> 返回治理台账</a>

<!-- 房屋概要 -->
<div class="page-card">
  <div class="card-header">
    <div class="card-title"><i class="fas fa-house-chimney"></i> 房屋概要 <span class="sub" id="hNo"></span></div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div id="hTags"></div><span id="closeApplyEntry"></span></div>
  </div>
  <div class="summary-grid" id="summaryGrid"></div>
</div>

<!-- 块1 隐患信息 -->
<div class="page-card">
  <div class="card-header"><div class="card-title"><i class="fas fa-exclamation-triangle"></i> 隐患信息（排查上报）</div></div>
  <div class="hazard-list" id="hazardList"></div>
</div>

<!-- 块2 管理措施记录 6.1.2.23.1.1 -->
<div class="page-card">
  <div class="card-header">
    <div class="card-title"><i class="fas fa-shield-halved"></i> 管理措施记录 <span class="sub">停止使用 / 停止经营 / 封控警示 / 人员撤离 / 持续监控</span></div>
    <button class="btn btn-primary" onclick="openManageAdd()"><i class="fas fa-plus"></i> 新增管理措施</button>
  </div>
  <div class="block-body" style="overflow-x:auto">
    <table class="data-table">
      <thead><tr><th>措施类型</th><th>实施部位</th><th>开始时间</th><th>计划结束</th><th>责任单位 / 责任人</th><th>状态</th><th style="width:220px">操作</th></tr></thead>
      <tbody id="manageTbody"></tbody>
    </table>
  </div>
</div>

<!-- 块3 工程措施记录 6.1.2.23.1.2 -->
<div class="page-card">
  <div class="card-header">
    <div class="card-title"><i class="fas fa-hammer"></i> 工程措施记录 <span class="sub">拆除重建 / 维修加固 / 局部改造 / 防护设施增设</span></div>
    <button class="btn btn-primary" onclick="openEngAdd()"><i class="fas fa-plus"></i> 新增工程措施</button>
  </div>
  <div class="block-body" id="engList"></div>
</div>

<!-- 块4 治理过程时间轴 -->
<div class="page-card">
  <div class="card-header"><div class="card-title"><i class="fas fa-stream"></i> 治理过程时间轴</div></div>
  <div class="block-body"><div class="timeline" id="govTimeline"></div></div>
</div>

<!-- 新增管理措施弹窗 -->
<div class="modal-mask" id="manageAddModal">
  <div class="modal">
    <div class="modal-header"><span>新增管理措施</span><i class="fas fa-times modal-close" onclick="closeModal('manageAddModal')"></i></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-item"><label>措施类型 <span class="req">*</span></label><select id="maType" onchange="renderMaExtras()"></select></div>
        <div class="form-item"><label>实施部位</label><input id="maPart" placeholder="如：整栋房屋 / 一层东间"/></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label>开始时间 <span class="req">*</span></label><input type="date" id="maStart"/></div>
        <div class="form-item"><label>计划结束时间 <span class="req">*</span></label><input type="date" id="maEnd"/></div>
      </div>
      <div class="form-row" id="maExtras" style="display:none"></div>
      <div class="form-row">
        <div class="form-item"><label>实施要求</label><textarea id="maReq" rows="2" placeholder="如：立即对危险区域采取管控，设置围挡和警示标识"></textarea></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label>责任单位</label><input id="maUnit" placeholder="如：南桥镇城建中心"/></div>
        <div class="form-item"><label>责任人</label><input id="maPerson" placeholder="姓名"/></div>
        <div class="form-item"><label>联系电话</label><input id="maPhone" placeholder="手机"/></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label>落实照片（警戒线 / 警示标识 / 撤离确认等）</label>
          <div class="upload-box"><input type="file" id="maPhotos" accept="image/*" multiple onchange="onPhotosChange(this,'maPhotoList')"/></div>
          <div class="photo-thumbs" id="maPhotoList"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('manageAddModal')">取消</button>
      <button class="btn btn-primary" onclick="saveManageAdd()"><i class="fas fa-save"></i> 保存</button>
    </div>
  </div>
</div>

<!-- 措施结束弹窗 -->
<div class="modal-mask" id="manageFinishModal">
  <div class="modal">
    <div class="modal-header"><span>管理措施结束确认</span><i class="fas fa-times modal-close" onclick="closeModal('manageFinishModal')"></i></div>
    <div class="modal-body">
      <input type="hidden" id="mfId"/>
      <div class="form-row">
        <div class="form-item"><label>实际结束时间 <span class="req">*</span></label><input type="date" id="mfEnd"/></div>
        <div class="form-item" style="justify-content:flex-end"><label>&nbsp;</label><label style="font-size:13px;color:var(--text-primary)"><input type="checkbox" id="mfControlled" checked/> 风险已有效控制</label></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label>措施效果评估 <span class="req">*</span></label><textarea id="mfEval" rows="3" placeholder="如：风险已有效控制，无新增变形；后续纳入常规巡查"></textarea></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label>完成照片（最少两张）</label>
          <div class="upload-box"><input type="file" id="mfPhotos" accept="image/*" multiple onchange="onPhotosChange(this,'mfPhotoList')"/></div>
          <div class="photo-thumbs" id="mfPhotoList"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('manageFinishModal')">取消</button>
      <button class="btn btn-primary" onclick="saveManageFinish()"><i class="fas fa-check"></i> 确认结束</button>
    </div>
  </div>
</div>

<!-- 变更/延长申请弹窗 -->
<div class="modal-mask" id="manageChangeModal">
  <div class="modal">
    <div class="modal-header"><span>变更 / 延长申请</span><i class="fas fa-times modal-close" onclick="closeModal('manageChangeModal')"></i></div>
    <div class="modal-body">
      <input type="hidden" id="mcId"/>
      <div class="form-row">
        <div class="form-item"><label>原计划结束时间</label><input id="mcOldEnd" disabled/></div>
        <div class="form-item"><label>申请延长至 <span class="req">*</span></label><input type="date" id="mcNewEnd"/></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label>申请理由 <span class="req">*</span></label><textarea id="mcReason" rows="3" placeholder="如：施工进度调整 / 雨季无法施工 / 住户安置衔接中"></textarea></div>
      </div>
      <div class="hint">提交后进入「待审批」，审批通过后计划结束时间自动更新，变更履历留痕可追溯。</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('manageChangeModal')">取消</button>
      <button class="btn btn-primary" onclick="saveManageChange()"><i class="fas fa-paper-plane"></i> 提交申请</button>
    </div>
  </div>
</div>

<!-- 新增工程措施弹窗 -->
<div class="modal-mask" id="engAddModal">
  <div class="modal">
    <div class="modal-header"><span>新增工程措施</span><i class="fas fa-times modal-close" onclick="closeModal('engAddModal')"></i></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-item"><label>措施类型 <span class="req">*</span></label><select id="eaType"></select></div>
        <div class="form-item"><label>实施范围</label><input id="eaScope" placeholder="如：整栋 / 东立面墙体 / 屋面"/></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label>开工时间 <span class="req">*</span></label><input type="date" id="eaStart"/></div>
        <div class="form-item"><label>计划竣工时间</label><input type="date" id="eaEnd"/></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label>施工单位（从机构库选择）<span class="req">*</span></label><select id="eaCompany" onchange="renderEaContractor()"></select>
          <div class="contractor-info" id="eaContractorInfo" style="display:none"></div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-item"><label>施工负责人</label><input id="eaLeader" placeholder="姓名"/></div>
        <div class="form-item"><label>联系电话</label><input id="eaPhone" placeholder="手机"/></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label>工程概算（万元）</label><input type="number" id="eaBudget" min="0" step="0.1" placeholder="如：8.5"/></div>
        <div class="form-item"><label>资金来源</label><input id="eaFund" placeholder="如：城镇房屋安全专项整治资金 + 业主自筹"/></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label>设计图纸</label>
          <div class="upload-box"><input type="file" id="eaFileDesign" multiple onchange="onFilesChange(this,'eaDesignChips')"/></div>
          <div class="file-chips" id="eaDesignChips"></div>
        </div>
        <div class="form-item"><label>施工组织设计</label>
          <div class="upload-box"><input type="file" id="eaFileOrg" multiple onchange="onFilesChange(this,'eaOrgChips')"/></div>
          <div class="file-chips" id="eaOrgChips"></div>
        </div>
        <div class="form-item"><label>安全专项方案</label>
          <div class="upload-box"><input type="file" id="eaFileSafety" multiple onchange="onFilesChange(this,'eaSafetyChips')"/></div>
          <div class="file-chips" id="eaSafetyChips"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('engAddModal')">取消</button>
      <button class="btn btn-primary" onclick="saveEngAdd()"><i class="fas fa-save"></i> 保存</button>
    </div>
  </div>
</div>

<!-- 节点验收弹窗 -->
<div class="modal-mask" id="nodeModal">
  <div class="modal" style="width:520px">
    <div class="modal-header"><span id="ndTitle">节点验收</span><i class="fas fa-times modal-close" onclick="closeModal('nodeModal')"></i></div>
    <div class="modal-body">
      <input type="hidden" id="ndEngId"/><input type="hidden" id="ndName"/>
      <div class="form-row">
        <div class="form-item"><label>验收时间 <span class="req">*</span></label><input type="date" id="ndTime"/></div>
        <div class="form-item"><label>验收结论</label><select id="ndConclusion"><option>合格</option><option>基本合格（限期整改）</option><option>不合格</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label>验收人</label><input id="ndRecorder" placeholder="如：街道房管办 王建国"/></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label>验收照片</label>
          <div class="upload-box"><input type="file" accept="image/*" multiple onchange="onPhotosChange(this,'ndPhotoList')"/></div>
          <div class="photo-thumbs" id="ndPhotoList"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('nodeModal')">取消</button>
      <button class="btn btn-primary" onclick="saveNode()"><i class="fas fa-check"></i> 确认验收</button>
    </div>
  </div>
</div>

<!-- 竣工验收报告弹窗 -->
<div class="modal-mask" id="acceptModal">
  <div class="modal" style="width:560px">
    <div class="modal-header"><span>竣工验收报告</span><i class="fas fa-times modal-close" onclick="closeModal('acceptModal')"></i></div>
    <div class="modal-body">
      <input type="hidden" id="acEngId"/>
      <div class="form-row">
        <div class="form-item"><label>验收结论 <span class="req">*</span></label><select id="acConclusion"><option>合格</option><option>基本合格</option><option>不合格</option></select></div>
        <div class="form-item"><label>验收日期 <span class="req">*</span></label><input type="date" id="acDate"/></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label>验收人员</label><input id="acStaff" placeholder="多人以逗号分隔"/></div>
        <div class="form-item"><label>验收单位</label><input id="acUnit" placeholder="如：南桥镇建设管理部门"/></div>
      </div>
      <div class="form-row">
        <div class="form-item"><label>整改后照片</label>
          <div class="upload-box"><input type="file" accept="image/*" multiple onchange="onPhotosChange(this,'acPhotoList')"/></div>

<script>
initHouseArchSeed();

const NO = new URLSearchParams(location.search).get('no') || 'NF-2025-00001';
let REC = null;
let tmpPhotos = { maPhotoList: [], mfPhotoList: [], ndPhotoList: [], acPhotoList: [] };
let tmpFiles = { eaDesignChips: [], eaOrgChips: [], eaSafetyChips: [] };

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
// 灯箱查看照片（dataURL 用 window.open 会被浏览器拦截）
function viewPhoto(url){
    let box = document.getElementById('photoLightbox');
    if (!box) {
        box = document.createElement('div');
        box.id = 'photoLightbox';
        box.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:zoom-out';
        box.onclick = function(){ box.remove(); };
        document.body.appendChild(box);
    }
    box.innerHTML = '<img src="' + url + '" style="max-width:88vw;max-height:88vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5)"/>';
}
function todayStr(){ const d = new Date(); const p = n => (n<10?'0':'')+n; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function photosVal(key){ return (tmpPhotos[key]||[]).slice(); }
function onPhotosChange(input, key){
    Array.from(input.files).forEach(f => {
        const rd = new FileReader();
        rd.onload = e => { tmpPhotos[key].push(e.target.result); renderThumbs(key); };
        rd.readAsDataURL(f);
    });
    input.value = '';
}
function renderThumbs(key){
    document.getElementById(key).innerHTML = tmpPhotos[key].map((u,i) =>
        '<img src="' + u + '" onclick="viewPhoto(tmpPhotos[\'' + key + '\'][' + i + '])" title="点击查看"/>').join('');
}
function onFilesChange(input, key){
    Array.from(input.files).forEach(f => tmpFiles[key].push(f.name));
    input.value = '';
    renderFileChips(key);
}
function renderFileChips(key){
    document.getElementById(key).innerHTML = tmpFiles[key].map((n,i) =>
        '<span class="file-chip"><i class="fas fa-file-alt"></i>' + esc(n) +
        '<i class="fas fa-times" onclick="tmpFiles[\'' + key + '\'].splice(' + i + ',1);renderFileChips(\'' + key + '\')"></i></span>').join('');
}
function thumbsHtml(photos){
    const arr = Array.isArray(photos) ? photos : (photos ? [photos] : []);
    if (!arr.length) return '<span style="color:var(--text-secondary)">—</span>';
    return '<div class="photo-thumbs">' + arr.map(u => {
        if (typeof u === 'string' && u.indexOf('data:image') === 0) return '<img src="' + u + '" onclick="viewPhoto(this.src)"/>';
        return '<span class="file-chip"><i class="fas fa-image"></i>' + esc(u) + '</span>';
    }).join('') + '</div>';
}
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function openModal(id){ document.getElementById(id).classList.add('show'); }

// 6.1.2.23.2.1 整治完成后显示「申请销号」入口，跳转隐患销号申请与审核页
function renderCloseEntry(){
    const el = document.getElementById('closeApplyEntry');
    if (!el) return;
    const r = REC, cs = r.closeStatus || '未申请';
    if (r.governance === 'done' && (cs === '未申请' || cs === '已驳回')) {
        el.innerHTML = '<a class="btn btn-primary btn-xs" href="hidden-close-apply.html?apply=' + encodeURIComponent(r.no) + '">' +
            '<i class="fas fa-paper-plane"></i> 申请销号' + (cs === '已驳回' ? '（重新申请）' : '') + '</a>';
    } else if (cs === '待审核' || cs === '审核中') {
        el.innerHTML = '<span class="tag tag-warning"><i class="fas fa-hourglass-half"></i> 销号' + cs + '</span>';
    } else if (cs === '已通过') {
        el.innerHTML = '<span class="tag tag-success"><i class="fas fa-check-circle"></i> 已销号</span>';
    } else {
        el.innerHTML = '';
    }
}

function renderSummary(){
    const r = REC, ov = r.overview || {}, st = r.structure || {};
    document.getElementById('hNo').textContent = r.no;
    const govMap = { pending:['tag-grey','未整治'], doing:['tag-warning','整治中'], done:['tag-success','已整治'], overdue:['tag-danger','逾期未整治'] };
    const g = govMap[r.governance] || govMap.pending;
        const riskTag = r.risk === 'danger' ? '<span class="tag tag-danger">疑似危房</span>'
        : r.risk === 'major' ? '<span class="tag tag-orange">疑似严重损坏房</span>'
        : r.risk === 'warning' ? '<span class="tag tag-warning">疑似一般损坏房</span>' : '<span class="tag tag-success">完好房</span>';
    const taskTag = r.governTask ? '<span class="tag tag-info">' + esc(r.governTask.taskType) + ' ' + esc(r.governTask.dispatchTime).slice(0,10) + '</span>' : '<span class="tag tag-grey">排查任务未下发</span>';
    document.getElementById('hTags').innerHTML = riskTag + ' <span class="tag ' + g[0] + '">' + g[1] + '</span> ' + taskTag;
    const cells = [
        ['产权人', r.owner], ['街镇 / 社区', (r.street||'') + ' / ' + (r.community || r.village || '')], ['详细地址', r.address || ov.address],
        ['结构类型', st.structureType || r.category], ['层数 / 面积', (st.floors || '?') + ' 层 / ' + (st.buildingArea || '?') + ' ㎡'],
        ['建成年代', ov.builtYear || r.year]
    ];
    document.getElementById('summaryGrid').innerHTML = cells.map(c =>
        '<div class="sum-item"><div class="sum-label">' + c[0] + '</div><div class="sum-value">' + esc(c[1] || '—') + '</div></div>').join('');
}

function renderHazards(){
    const list = REC.hazards || [];
    document.getElementById('hazardList').innerHTML = list.length ? list.map(h => {
        const lv = (h.level === '疑似危房') ? 'lv-danger' : '';
        return '<div class="hazard-card ' + lv + '"><div class="hazard-head"><span>' + esc(h.part) + ' · ' + esc(h.type) + '</span>' +
            '<span class="tag ' + (lv ? 'tag-danger' : 'tag-warning') + '">' + esc(h.level || '疑似一般损坏房') + '</span></div>' +
            '<div class="hazard-desc">' + esc(h.desc) + '</div></div>';
    }).join('') : '<div class="hint" style="padding:6px">该房屋暂无隐患记录</div>';
}

// ---- 管理措施 ----
function renderManage(){
    const list = REC.manageRecords || [];
    const tb = document.getElementById('manageTbody');
    if (!list.length) { tb.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-secondary);padding:24px">暂无管理措施，点击右上角「新增管理措施」</td></tr>'; return; }
    const today = todayStr();
    tb.innerHTML = list.map(m => {
        const dl = getDeadlineStatus(m.planEndTime);
        const ended = m.isDone || m.status === '已结束';
        const endCell = esc(m.planEndTime || '—') + (ended ? '' :
            (dl.overdue ? ' <span class="tag tag-danger">' + dl.text + '</span>' : (dl.near ? ' <span class="tag tag-orange">' + dl.text + '</span>' : '')));
        const statusTag = ended ? '<span class="tag tag-success">已结束</span>' : '<span class="tag tag-warning">实施中</span>';
        const pendingChg = (m.changes || []).filter(c => c.status === '待审批').length;
        const ops = ended
            ? '<button class="btn btn-outline btn-xs" onclick="toggleDetail(\'' + m.id + '\')">详情</button>'
            : '<button class="btn btn-primary btn-xs" onclick="openManageFinish(\'' + m.id + '\')">措施结束</button>' +
              '<button class="btn btn-outline btn-xs" onclick="openManageChange(\'' + m.id + '\')">变更/延长</button>' +
              '<button class="btn btn-outline btn-xs" onclick="toggleDetail(\'' + m.id + '\')">详情' + (pendingChg ? '(' + pendingChg + ')' : '') + '</button>';
        return '<tr>' +
            '<td><b>' + esc(m.measureType) + '</b></td><td>' + esc(m.implementPart || '—') + '</td>' +
            '<td>' + esc(m.startTime || '—') + '</td><td>' + endCell + '</td>' +
            '<td>' + esc(m.dutyUnit || '—') + '<div class="hint">' + esc(m.dutyPerson || '') + ' ' + esc(m.phone || '') + '</div></td>' +
            '<td>' + statusTag + '</td><td>' + ops + '</td></tr>' +
            '<tr id="dtl-' + m.id + '" style="display:none"><td colspan="7">' + manageDetailHtml(m) + '</td></tr>';
    }).join('');
}
function toggleDetail(id){
    const el = document.getElementById('dtl-' + id);
    if (el) el.style.display = el.style.display === 'none' ? '' : 'none';
}
function manageDetailHtml(m){
    const ex = m.extras || {};
    const extraFields = GOV_MANAGE_EXTRA_FIELDS[m.measureType] || [];
    let html = '<div class="detail-grid">';
    html += kv('实施要求', m.requirement || m.measureDesc, true);
    extraFields.forEach(f => { html += kv(f.label, ex[f.key] || '—'); });
    html += kv('落实照片', thumbsHtml(m.implementPhotos));
    html += kv('完成照片', thumbsHtml(m.completePhotos));
    if (m.effectEvaluation) html += kv('效果评估', m.effectEvaluation + (m.riskControlled ? '（风险已有效控制）' : ''));
    html += kv('填报', (m.reporter || '—') + ' ' + (m.reportTime || ''));
    html += '</div>';
    if ((m.changes || []).length) {
        html += '<div class="change-log"><div style="font-size:12px;font-weight:600;margin-bottom:4px">变更 / 延长履历</div>' +
            m.changes.map(c => {
                const stTag = c.status === '待审批' ? '<span class="tag tag-orange">待审批</span>' : c.status === '已审批' ? '<span class="tag tag-success">已审批</span>' : '<span class="tag tag-danger">已驳回</span>';
                let line = '<div class="change-item">' + stTag + ' ' + esc(c.time) + ' ' + esc(c.applicant) + '：' + esc(c.reason) +
                    '（' + esc(c.oldEnd || '—') + ' → ' + esc(c.newEnd || '—') + '）';
                if (c.status === '待审批') {
                    line += ' <button class="btn btn-primary btn-xs" onclick="auditChange(\'' + m.id + '\',\'' + c.id + '\',true)">批准</button>' +
                            '<button class="btn btn-danger-o btn-xs" onclick="auditChange(\'' + m.id + '\',\'' + c.id + '\',false)">驳回</button>';
                } else if (c.auditor) {
                    line += '　审批：' + esc(c.auditor) + ' ' + esc(c.auditTime || '');
                }
                return line + '</div>';
            }).join('') + '</div>';
    }
    return html;
    function kv(k, v, full){ return '<div class="kv' + (full ? ' full' : '') + '"><span class="k">' + k + '：</span><span class="v">' + (typeof v === 'string' ? esc(v) : v) + '</span></div>'; }
}

function contractorOf(id){ return getContractorLibrary().find(c => c.id === id); }
function renderEng(){
    const list = REC.projectRecords || [];
    const box = document.getElementById('engList');
    if (!list.length) { box.innerHTML = '<div class="hint" style="text-align:center;padding:24px">暂无工程措施，点击右上角「新增工程措施」</div>'; return; }
    box.innerHTML = list.map(p => {
        const ct = contractorOf(p.companyId);
        const stTag = p.isDone ? '<span class="tag tag-success">已完成</span>' : '<span class="tag tag-warning">' + esc(p.status || '进行中') + '</span>';
        const ops = p.isDone
            ? ''
            : '<button class="btn btn-primary btn-xs" onclick="openAccept(\'' + p.id + '\')"><i class="fas fa-flag-checkered"></i> 竣工验收</button>';
        const planChips = ['design','org','safety'].map(k => {
            const label = { design: '设计图纸', org: '施工组织设计', safety: '安全专项方案' }[k];
            const files = (p.planFiles && p.planFiles[k]) || [];
            return '<div class="kv"><span class="k">' + label + '：</span><span class="v">' +
                (files.length ? files.map(f => '<span class="file-chip"><i class="fas fa-file-alt"></i>' + esc(f) + '</span>').join('') : '<span style="color:var(--text-secondary)">未上传</span>') +
                '</span></div>';
        }).join('');
        const nodes = (p.nodes || []).map((n, i) => {
            const done = n.status === '已验收';
            const inner = done
                ? '<div class="node-meta">' + esc(n.time) + '<br/>' + esc(n.conclusion) + ' · ' + esc(n.recorder || '') + thumbsHtml(n.photos) + '</div>'
                : (p.isDone ? '' : '<div class="node-meta"><button class="btn btn-outline btn-xs" onclick="openNode(\'' + p.id + '\',\'' + esc(n.name) + '\')">验收</button></div>');
            return '<div class="node-item' + (done ? ' done' : '') + '"><div class="node-dot"></div><div class="node-name">' + esc(n.name) + '</div>' + inner + '</div>';
        }).join('');
        const acceptHtml = p.acceptReport
            ? '<div class="contractor-info" style="background:#e6f4ea"><b>竣工验收报告</b>：' + esc(p.acceptReport.conclusion) +
              '　日期：' + esc(p.acceptReport.date) + '　人员：' + esc(p.acceptReport.staff || '—') + '　单位：' + esc(p.acceptReport.unit || '—') +
              '<br/>整改后照片：' + thumbsHtml(p.acceptReport.photos) + '</div>'
            : '';
        const ctInfo = ct
            ? '<div class="contractor-info"><i class="fas fa-building"></i> <b>' + esc(ct.name) + '</b>　资质：' + esc(ct.qualification) +
              '　信用评分：<b style="color:' + (ct.credit >= 90 ? 'var(--success)' : 'var(--warning)') + '">' + ct.credit + '</b><br/>历史业绩：' + esc(ct.history) + '</div>'
            : (p.company ? '<div class="contractor-info">' + esc(p.company) + '</div>' : '');
        return '<div class="eng-card">' +
            '<div class="eng-head"><span class="t">' + esc(p.engType || p.projectName) + '</span>' + stTag +
            '<div class="progress-bar"><div class="progress-fill" style="width:' + (p.progress || 0) + '%"></div></div><span class="hint">' + (p.progress || 0) + '%</span>' +
            '<div class="ops">' + ops + '</div></div>' +
            '<div class="eng-body"><div class="detail-grid">' +
            kv2('实施范围', p.scope) + kv2('开工时间', p.startDate) + kv2((p.isDone ? '竣工时间' : '计划竣工'), p.endDate) +
            kv2('施工负责人', (p.leader || '') + ' ' + (p.phone || '')) + kv2('工程概算', (p.budget ? p.budget + ' 万元' : '—')) + kv2('资金来源', p.fundSource) +
            planChips + '</div>' + ctInfo +
            '<div class="node-flow">' + nodes + '</div>' + acceptHtml + '</div></div>';
    }).join('');
    function kv2(k, v){ return '<div class="kv"><span class="k">' + k + '：</span><span class="v">' + esc(v || '—') + '</span></div>'; }
}

    document.getElementById('acDate').value = todayStr();
    document.getElementById('acStaff').value = '';
    document.getElementById('acUnit').value = (REC.street || '') + '建设管理部门';
    tmpPhotos.acPhotoList = []; renderThumbs('acPhotoList');
    openModal('acceptModal');
}
function saveAccept(){
    const engId = document.getElementById('acEngId').value;
    const photos = photosVal('acPhotoList');
    if (!photos.length) { alert('请上传整改后照片'); return; }
    let msg = '';
    patch(rec => {
        const r = finishGovernEng(rec, engId, {
            conclusion: document.getElementById('acConclusion').value,
            staff: document.getElementById('acStaff').value.trim(),
            unit: document.getElementById('acUnit').value.trim(),
            date: document.getElementById('acDate').value,
            photos: photos
        });
        if (!r.ok) msg = r.msg;
    });
    if (msg) { alert(msg); return; }
    closeModal('acceptModal');
}

// ---- 治理过程时间轴 ----
function renderTimeline(){
    const evs = [];
    (REC.manageRecords || []).forEach(m => {
        evs.push({ t: m.reportTime || m.startTime, c: '', html: '新增管理措施 <b>' + esc(m.measureType) + '</b>（' + esc(m.implementPart || '整栋房屋') + '），填报：' + esc(m.reporter || '—') });
        (m.changes || []).forEach(ch => evs.push({ t: ch.time, c: 'c-warn', html: '管理措施「' + esc(m.measureType) + '」变更申请：' + esc(ch.reason) + ' <span class="tag ' + (ch.status === '待审批' ? 'tag-orange' : ch.status === '已审批' ? 'tag-success' : 'tag-danger') + '">' + ch.status + '</span>' }));
        if (m.isDone) evs.push({ t: (m.actualEndTime || '') + ' 23:59', c: 'c-done', html: '管理措施「' + esc(m.measureType) + '」结束：' + esc(m.effectEvaluation || '') });
    });
    (REC.projectRecords || []).forEach(p => {
        evs.push({ t: p.reportTime || p.startDate, c: '', html: '新增工程措施 <b>' + esc(p.engType || p.projectName) + '</b>，施工单位：' + esc(p.company || '—') });
        (p.nodes || []).forEach(n => { if (n.status === '已验收') evs.push({ t: n.time + ' 12:00', c: '', html: '节点验收「' + esc(n.name) + '」：' + esc(n.conclusion) + '（' + esc(n.recorder || '') + '）' }); });
        if (p.acceptReport) evs.push({ t: p.acceptReport.date + ' 18:00', c: 'c-done', html: '工程措施「' + esc(p.engType || p.projectName) + '」竣工验收：' + esc(p.acceptReport.conclusion) });
    });
    if (REC.governTask) evs.push({ t: REC.governTask.dispatchTime, c: '', html: '排查任务' + esc(REC.governTask.taskType) + '，期限 ' + esc(REC.governTask.deadline || '—') + '，下发人：' + esc(REC.governTask.dispatcher) });
    evs.sort((a, b) => String(b.t).localeCompare(String(a.t)));
    document.getElementById('govTimeline').innerHTML = evs.length
        ? evs.map(e => '<div class="tl-item ' + e.c + '"><div class="tl-time">' + esc(String(e.t || '').slice(0, 16)) + '</div><div class="tl-content">' + e.html + '</div></div>').join('')
        : '<div class="hint">暂无治理过程记录</div>';
}

loadRec();
renderAll();
</script>
