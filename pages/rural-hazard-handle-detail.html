<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>整治处置 - 子任务详情</title>
<link rel="stylesheet" href="./all.min.css">
<link rel="stylesheet" href="./ui-modal.css">
<style>
:root {
    --primary: #1a73e8; --success: #188038; --warning: #e37400; --danger: #d93025;
    --bg-page: #f1f3f4; --bg-card: #ffffff; --text-main: #202124; --text-sub: #5f6368; --border: #e0e0e0;
}
[data-theme="dark"] {
    --bg-page: #121416; --bg-card: #1e2126; --text-main: #e8eaed; --text-sub: #9aa0a6; --border: #3c4043;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-page); color: var(--text-main); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; }
.top-bar { background: var(--bg-card); padding: 14px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
.btn-back { border: none; background: none; color: var(--primary); cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.top-bar h2 { font-size: 17px; }
.container { padding: 20px 28px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 22px; }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.card-title .fa-solid { color: var(--primary); }
.info-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 24px; }
.info-item .lbl { font-size: 12px; color: var(--text-sub); margin-bottom: 3px; }
.info-item .val { font-size: 14px; }
.status-tag { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 12px; }
.status-tag.wait-accept { background: rgba(95,99,104,0.12); color: var(--text-sub); }
.status-tag.doing { background: rgba(26,115,232,0.1); color: var(--primary); }
.status-tag.wait-check { background: rgba(227,116,0,0.1); color: var(--warning); }
.status-tag.done { background: rgba(24,128,56,0.1); color: var(--success); }
.req-box { background: rgba(26,115,232,0.05); border-left: 3px solid var(--primary); border-radius: 0 8px 8px 0; padding: 12px 16px; color: var(--text-main); line-height: 1.7; }
.house-card { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
.house-head { background: rgba(26,115,232,0.05); padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.house-head .name { font-weight: 700; font-size: 14px; }
.house-head .meta { color: var(--text-sub); }
.house-body { padding: 12px 16px; }
.risk-table { width: 100%; border-collapse: collapse; }
.risk-table th { text-align: left; font-size: 12px; color: var(--text-sub); padding: 8px 10px; border-bottom: 1px solid var(--border); font-weight: 600; }
.risk-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
.lv-tag { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 12px; }
.lv-red { background: rgba(217,48,37,0.1); color: var(--danger); }
.lv-yellow { background: rgba(227,116,0,0.1); color: var(--warning); }
.part-photo { width: 64px; height: 44px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); cursor: zoom-in; }
.form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.form-row label { font-size: 13px; color: var(--text-sub); }
.form-row label .req { color: var(--danger); }
.form-row select, .form-row textarea, .form-row input { border: 1px solid var(--border); border-radius: 6px; padding: 9px 12px; font-size: 14px; font-family: inherit; background: var(--bg-card); color: var(--text-main); }
.form-row textarea { min-height: 90px; resize: vertical; }
.photo-wall { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.photo-item { width: 110px; position: relative; }
.photo-item img { width: 110px; height: 78px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: zoom-in; }
.photo-item .del { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--danger); color: #fff; border: none; cursor: pointer; font-size: 11px; line-height: 20px; text-align: center; }
.photo-add { width: 110px; height: 78px; border: 1px dashed var(--border); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-sub); cursor: pointer; font-size: 12px; }
.photo-add:hover { border-color: var(--primary); color: var(--primary); }
.file-add { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: 1px dashed var(--border); border-radius: 6px; color: var(--text-sub); font-size: 13px; cursor: pointer; }
.file-add:hover { border-color: var(--primary); color: var(--primary); }
.file-item { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 6px; background: #f7f8fa; font-size: 13px; }
.file-item .fname { color: var(--text-main); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-item .fsize { color: var(--text-sub); font-size: 12px; }
.file-item .fop { color: var(--primary); cursor: pointer; }
.file-item .fdel { color: var(--danger); cursor: pointer; }
.stage-item { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
.f-block { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.f-block > label { font-weight: 600; color: var(--text-main); }
.stage-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.stage-name { font-weight: 600; font-size: 14px; }
.stage-badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #f0f1f3; color: var(--text-sub); }
.stage-badge.done { background: #e8f5e9; color: var(--success); }
.stage-badge.req { background: #fff2e8; color: #d4380d; margin-left: 6px; }
.stage-badge.opt { background: #f0f5ff; color: #2f54eb; margin-left: 6px; }
.stage-types { display: flex; gap: 18px; margin: 8px 0 2px; font-size: 13px; color: var(--text-main); }
.stage-types label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 400; }
.stage-types input { accent-color: var(--primary); }
.stage-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin: 8px 0; }
.stage-fields .sf-row { display: flex; flex-direction: column; gap: 4px; }
.stage-fields .sf-row.full { grid-column: 1 / -1; }
.stage-fields label { font-size: 12px; color: var(--text-sub); }
.stage-fields input, .stage-fields select, .stage-fields textarea { width: 100%; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; box-sizing: border-box; font-family: inherit; color: var(--text-main); }
.stage-fields textarea { min-height: 56px; resize: vertical; }
.stage-sub { border: 1px dashed #c9d4e8; border-radius: 6px; padding: 10px 12px; margin: 8px 0; background: #fcfcfd; }
.stage-sub-title { font-size: 13px; font-weight: 600; color: #003a8c; margin-bottom: 8px; }
.sub-del { float: right; color: var(--text-sub); font-size: 12px; font-weight: 400; cursor: pointer; }
.sub-del:hover { color: #d32f2f; }
.sub-add { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px dashed var(--border); border-radius: 6px; color: var(--text-sub); font-size: 12px; cursor: pointer; margin-top: 8px; }
.sub-add:hover { border-color: var(--primary); color: var(--primary); }
.stage-hint { font-size: 12px; color: var(--text-sub); }
.stage-row-view { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 13px; flex-wrap: wrap; }
.stage-row-view:last-child { border-bottom: none; }
.radio-line { display: flex; gap: 22px; align-items: center; }
.radio-item { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-main); cursor: pointer; }
.radio-item input { accent-color: var(--primary); }
.proxy-tag { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 12px; background: rgba(227,116,0,0.1); color: var(--warning); margin-left: 8px; }
.action-bar { display: flex; gap: 12px; justify-content: flex-end; }
.btn { height: 38px; padding: 0 22px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.btn-success { background: var(--success); border-color: var(--success); color: #fff; }
.timeline { position: relative; padding-left: 20px; }
.timeline::before { content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.tl-item { position: relative; padding-bottom: 14px; }
.tl-item::before { content: ''; position: absolute; left: -19px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.tl-time { font-size: 12px; color: var(--text-sub); }
.tl-text { font-size: 13px; margin-top: 2px; }
.accept-banner { border-radius: 8px; padding: 14px 18px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
.accept-banner.pass { background: rgba(24,128,56,0.08); color: var(--success); border: 1px solid rgba(24,128,56,0.3); }
.accept-banner.reject { background: rgba(217,48,37,0.06); color: var(--danger); border: 1px solid rgba(217,48,37,0.3); }
.preview-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 9999; cursor: zoom-out; }
.preview-mask img { max-width: 86vw; max-height: 86vh; border-radius: 8px; }
.toast-tip { position: fixed; top: 72px; left: 50%; transform: translateX(-50%); background: rgba(32,33,36,0.92); color: #fff; padding: 10px 22px; border-radius: 8px; font-size: 14px; z-index: 10000; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast-tip.show { opacity: 1; }
.toast-tip.warn { background: rgba(217,48,37,0.92); }
</style>
</head>
<body>
<div class="top-bar">
    <button class="btn-back" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i>返回</button>
    <h2 id="page-title">整治处置 - 子任务详情</h2>
</div>
<div class="container">
    <!-- 子任务信息 -->
    <div class="card">
        <div class="card-title"><i class="fa-solid fa-clipboard-list"></i>整治任务信息</div>
        <div class="info-grid">
            <div class="info-item"><div class="lbl">子任务名称</div><div class="val" id="s-name">-</div></div>
            <div class="info-item"><div class="lbl">责任人</div><div class="val" id="s-person">-</div></div>
            <div class="info-item"><div class="lbl">分发处置方式</div><div class="val" id="s-method">-</div></div>
            <div class="info-item"><div class="lbl">完成时限</div><div class="val" id="s-deadline">-</div></div>
            <div class="info-item"><div class="lbl">当前状态</div><div class="val" id="s-status">-</div></div>
            <div class="info-item"><div class="lbl">下发单位</div><div class="val" id="s-receiver">-</div></div>
            <div class="info-item"><div class="lbl">下发时间</div><div class="val" id="s-time">-</div></div>
            <div class="info-item"><div class="lbl">覆盖房屋</div><div class="val" id="s-count">-</div></div>
        </div>
        <div style="margin-top:14px;">
            <div class="lbl" style="font-size:12px;color:var(--text-sub);margin-bottom:6px;">总体处置要求</div>
            <div class="req-box" id="s-req">-</div>
        </div>
        <div style="margin-top:10px;">
            <div class="lbl" style="font-size:12px;color:var(--text-sub);margin-bottom:6px;">验收标准</div>
            <div class="req-box" id="s-std">-</div>
        </div>
    </div>

    <!-- 验收结果横幅（验收后出现） -->
    <div id="accept-banner" style="display:none;"></div>

    <!-- 房屋与风险部位 -->
    <div class="card">
        <div class="card-title"><i class="fa-solid fa-house-chimney-crack"></i>房屋信息与风险部位</div>
        <div id="house-list"></div>
    </div>

    <!-- 任务接收（待接收：仅确认接收，接收后才可填报） -->
    <div class="card" id="accept-card" style="display:none;">
        <div class="card-title"><i class="fa-solid fa-hand-point-up"></i>任务接收</div>
        <div class="form-row">
            <label>填报方式 <span class="req">*</span></label>
            <div class="radio-line">
                <label class="radio-item"><input type="radio" name="a-reporter" value="self" checked onchange="onAcceptReporterChange()"> 责任人本人填报</label>
                <label class="radio-item"><input type="radio" name="a-reporter" value="proxy" onchange="onAcceptReporterChange()"> 村委/镇/街道代报（责任人不便操作时，由接收单位代为填报）</label>
            </div>
        </div>
        <div class="form-row" id="a-proxy-row" style="max-width:360px;display:none;">
            <label>代报人 <span class="req">*</span></label>
            <input id="a-proxy" placeholder="代报人姓名/职务，如：村支书 张某">
        </div>
        <div class="action-bar">
            <button class="btn btn-success" id="btn-accept" onclick="acceptTask()"><i class="fa-solid fa-hand-point-up"></i>接收任务</button>
        </div>
    </div>

    <!-- 处置填报（处置中可编辑） -->
    <div class="card" id="form-card" style="display:none;">
        <div class="card-title"><i class="fa-solid fa-hammer"></i>处置填报</div>
        <div class="form-row">
            <label>填报方式 <span class="req">*</span></label>
            <div class="radio-line">
                <label class="radio-item"><input type="radio" name="f-reporter" value="self" checked onchange="onReporterChange()"> 责任人本人填报</label>
                <label class="radio-item"><input type="radio" name="f-reporter" value="proxy" onchange="onReporterChange()"> 村委/镇/街道代报（责任人不便操作时，由接收单位代为填报）</label>
            </div>
        </div>
        <div class="form-row" id="proxy-row" style="max-width:360px;display:none;">
            <label>代报人 <span class="req">*</span></label>
            <input id="f-proxy" placeholder="代报人姓名/职务，如：村支书 张某">
        </div>
        <div class="form-row">
            <label>处置环节记录 <span style="font-weight:400;color:var(--text-sub);font-size:12px;">（安全鉴定 / 安全评估 / 整治计划 / 整治措施均根据实际情况填写，无必填项）</span></label>
            <div id="stages-box"></div>
            <input type="file" id="rect-photo-file" accept="image/*" multiple style="display:none;">
            <input type="file" id="stage-file-input" accept="image/*,.pdf" multiple style="display:none;">
        </div>
        <div class="action-bar">
            <button class="btn btn-primary" id="btn-submit" onclick="submitAcceptance()"><i class="fa-solid fa-paper-plane"></i>提交验收</button>
        </div>
    </div>

    <!-- 处置记录只读（待验收/已完成） -->
    <div class="card" id="report-card" style="display:none;">
        <div class="card-title"><i class="fa-solid fa-file-lines"></i>处置记录</div>
        <div class="info-grid" style="margin-bottom:14px;">
            <div class="info-item"><div class="lbl">提交验收时间</div><div class="val" id="r-time">-</div></div>
            <div class="info-item"><div class="lbl">填报方式</div><div class="val" id="r-reporter">-</div></div>
        </div>
        <div class="form-row" id="r-stages-row" style="display:none;">
            <label>处置环节记录</label>
            <div id="r-stages"></div>
        </div>
    </div>

    <!-- 进度动态 -->
    <div class="card">
        <div class="card-title"><i class="fa-solid fa-clock-rotate-left"></i>进度动态</div>
        <div class="timeline" id="timeline"></div>
    </div>
</div>

<div class="preview-mask" id="preview-mask" onclick="this.style.display='none'"><img id="preview-img"></div>

<script src="./ui-modal.js"></script>
<script src="../js/house-arch-data.js"></script>
<script src="./rural-audit-seed.js"></script>
<script>
const ST_META = {
    '待接收': { cls: 'wait-accept' }, '处置中': { cls: 'doing' },
    '待验收': { cls: 'wait-check' }, '已完成': { cls: 'done' }
};
let task = null, pkg = null, sub = null;
let stages = {};

const JUDGE_OPTS = ['A级', 'B级', 'C级', 'D级'];
const STAGES = [
    { key: 'appraise', name: '安全鉴定', optional: true, hint: '视情委托专业机构开展房屋安全鉴定', fields: [
        { k: 'orgName', label: '鉴定机构名称' }, { k: 'creditCode', label: '统一社会信用代码' },
        { k: 'time', label: '鉴定时间', type: 'date' }, { k: 'principal', label: '鉴定负责人' },
        { k: 'conclusion', label: '鉴定结论', type: 'select', options: JUDGE_OPTS },
        { k: 'phaseTag', label: '阶段性标识', type: 'select', options: ['整治前进行的安全鉴定', '整治后进行的安全鉴定'] },
        { k: 'report', label: '鉴定报告', type: 'files' },
        { k: 'remark', label: '备注', type: 'textarea' }
    ]},
    { key: 'evaluate', name: '安全评估', optional: true, hint: '视情组织安全评估，明确风险程度与整治优先级', fields: [
        { k: 'orgName', label: '评估机构名称' }, { k: 'creditCode', label: '统一社会信用代码' },
        { k: 'time', label: '评估时间', type: 'date' }, { k: 'principal', label: '评估负责人' },
        { k: 'conclusion', label: '评估结论', type: 'select', options: JUDGE_OPTS },
        { k: 'phaseTag', label: '阶段性标识', type: 'select', options: ['整治前进行的安全评估', '整治后进行的安全评估'] },
        { k: 'report', label: '评估报告', type: 'files' },
        { k: 'remark', label: '备注', type: 'textarea' }
    ]},
    { key: 'plan', name: '整治计划', optional: true, hint: '视情制定整治计划，明确整治方式、工期安排与安全措施', fields: [
        { k: 'startTime', label: '计划开始时间', type: 'date' }, { k: 'endTime', label: '计划完成时间', type: 'date' },
        { k: 'principal', label: '负责人信息' }, { k: 'phone', label: '联系电话' },
        { k: 'scheme', label: '整治方案', type: 'textarea' },
        { k: 'hardIso', label: '是否采取硬隔离', type: 'select', options: ['是', '否'] },
        { k: 'noIsoReason', label: '未硬隔离原因说明', type: 'textarea' }
    ]},
    { key: 'rectify', name: '整治措施', optional: true, hint: '视情落实管理措施（人员撤离、封控警示等）和工程措施（维修加固、拆除重建等），按实际勾选填报' }
];
const RECTIFY_MGMT_OPTS = ['停止使用', '停止经营', '封控警示', '人员撤离', '搭设防护措施', '持续监控', '其他'];
const RECTIFY_ENG_OPTS = ['拆除重建', '维修加固', '拆除灭失', '其他'];
const RECTIFY_FIELDS = {
    mgmt: [
        { k: 'measure', label: '管理措施', type: 'select', options: RECTIFY_MGMT_OPTS },
        { k: 'startTime', label: '开始时间', type: 'date' }, { k: 'endTime', label: '结束时间', type: 'date' },
        { k: 'principal', label: '负责人信息' }, { k: 'phone', label: '联系电话' },
        { k: 'implPhotos', label: '管理措施实施照片', type: 'photos' },
        { k: 'donePhotos', label: '管理措施完成照片', type: 'photos' },
        { k: 'finished', label: '措施是否完成', type: 'select', options: ['是', '否'] },
        { k: 'remark', label: '备注', type: 'textarea' }
    ],
    eng: [
        { k: 'measure', label: '工程措施', type: 'select', options: RECTIFY_ENG_OPTS },
        { k: 'policyPath', label: '实施拟采用的政策路径' }, { k: 'otherPolicyPath', label: '其他实施拟采用政策路径' },
        { k: 'planDetail', label: '细化工程措施方案', type: 'textarea' },
        { k: 'startTime', label: '开始时间', type: 'date' }, { k: 'endTime', label: '结束时间', type: 'date' },
        { k: 'principal', label: '负责人信息' }, { k: 'phone', label: '联系电话' },
        { k: 'implPhotos', label: '工程措施实施照片', type: 'photos' },
        { k: 'donePhotos', label: '工程措施完成照片', type: 'photos' },
        { k: 'finished', label: '措施是否完成', type: 'select', options: ['是', '否'] },
        { k: 'remark', label: '备注', type: 'textarea' },
        { k: 'company', label: '施工单位' }, { k: 'acceptUnit', label: '验收单位' },

function hasStageData(s, st) {
    if (!st) return false;
    if (s.fields && st.fields && s.fields.some(f => st.fields[f.k])) return true;
    if (s.key === 'rectify' && st.types && (st.types.mgmt || st.types.eng)) return true;
    return false;
}
function stageViewFields(s, st) {
    let html = '';
    if (s.fields && st.fields) {
        const pairs = s.fields.filter(f => f.type !== 'files' && st.fields[f.k]).map(f => `${f.label}：${st.fields[f.k]}`);
        if (pairs.length) html += `<div style="margin-top:4px;font-size:12px;color:var(--text-sub);">${esc(pairs.join('；'))}</div>`;
        s.fields.filter(f => f.type === 'files').forEach(f => {
            const files = st.fields[f.k] || [];
            if (!files.length) return;
            html += `<div style="margin-top:4px;font-size:12px;color:var(--text-sub);">${f.label}：${files.map((fl, i) => `<span style="color:var(--primary);cursor:pointer;" onclick="viewSavedStageFile('${s.key}','${f.k}',${i})">${esc(fl.name)}</span>`).join('、')}</div>`;
        });
    }
    if (st.reporter || st.reportTime) {
        const extra = [st.reporter ? `填报人：${st.reporter}` : '', st.reportTime ? `填报时间：${st.reportTime}` : ''].filter(Boolean).join('；');
        html += `<div style="margin-top:4px;font-size:12px;color:var(--text-sub);">${esc(extra)}</div>`;
    }
    if (s.key === 'rectify' && st.types) {
        [['mgmt', '管理措施'], ['eng', '工程措施']].forEach(t => {
            if (!st.types[t[0]]) return;
            normRectArr(st[t[0]]).forEach((d, i) => {
                const pairs = RECTIFY_FIELDS[t[0]].filter(f => f.type !== 'photos' && d[f.k]).map(f => `${f.label}：${d[f.k]}`);
                if (pairs.length) html += `<div style="margin-top:4px;font-size:12px;color:var(--text-sub);">【${t[1]} ${i + 1}】${esc(pairs.join('；'))}</div>`;
                RECTIFY_FIELDS[t[0]].filter(f => f.type === 'photos').forEach(f => {
                    const photos = d[f.k] || [];
                    if (!photos.length) return;
                    html += `<div style="margin-top:4px;font-size:12px;color:var(--text-sub);">【${t[1]} ${i + 1}】${f.label}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0;">${photos.map(p => `<img src="${p}" style="width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:zoom-in;" onclick="preview('${encodeURIComponent(p)}')">`).join('')}</div>`;

function initStages() { stages = (sub.handleReport && sub.handleReport.stages) ? JSON.parse(JSON.stringify(sub.handleReport.stages)) : {}; }
function saveStageField(key, fKey, v) { stages[key] = stages[key] || {}; stages[key].fields = stages[key].fields || {}; stages[key].fields[fKey] = v; }
function normRectArr(v) { return Array.isArray(v) ? v : (v && typeof v === 'object' ? [v] : []); }
function saveRectifyField(kind, idx, fKey, v) {
    const st = stages.rectify = stages.rectify || {};

function toggleRectifyType(t, on) {

function delRectifyRecord(kind, idx) {

function fieldControlHtml(f, val, cb) {

function stageFieldRow(sKey, f, val) {

}
function fmtSize(n) {
    if (!n) return '';
    const units = ['B', 'KB', 'MB', 'GB']; let i = 0;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
    return n.toFixed(1) + units[i];
}
function isImageName(n) { return /\.(png|jpe?g|gif|webp|bmp)$/i.test(n || ''); }
function stageFileHtml(sKey, f, arr) {

function viewStageFile(sKey, fKey, i) {

function rectifySubHtml(kind, arr) {

const PHOTO_HINT = '需使用移动端现场实地拍摄照片，带地址时间水印！';

async function submitAcceptance() {
    const rep = getReporter();
    if (rep.type === 'proxy' && !rep.proxyName) { toast('代报时请填写代报人', 'warn'); return; }
    const doneNames = STAGES.filter(s => hasStageData(s, stages[s.key])).map(s => s.name);
    const doneText = doneNames.length ? doneNames.join('、') : '未填报任何环节';
    const ok = await uiConfirm(`确认提交验收？\n\n填报方式：${reporterLabel(rep)}\n已填报环节：${doneText}\n\n提交后将由 ${pkg.receiverName} 组织竣工验收`, { title: '提交验收' });
    if (!ok) return;
    const timeStr = now();
    STAGES.forEach(s => {
        const st = stages[s.key];
        if (hasStageData(s, st)) { st.reporter = reporterLabel(rep); st.reportTime = timeStr; }
    });
    sub.status = '待验收';
    sub.handleReport = { stages: stages, submitTime: timeStr, reporter: rep };
    pushUpdate(`${actorPrefix(rep)}：整治完成，提交验收，等待 ${pkg.receiverName} 验收`);
    savePkg();
    syncHazardStatus('待验收');
    toast('已提交验收');
    setTimeout(() => location.reload(), 600);
}

function renderAcceptBanner() {
    const el = document.getElementById('accept-banner');
    if (!sub.acceptance) { el.style.display = 'none'; return; }
    const a = sub.acceptance;
    el.style.display = 'block';
    el.innerHTML = a.result === '通过'
        ? `<div class="accept-banner pass"><i class="fa-solid fa-circle-check"></i>验收通过 · ${esc(a.org || pkg.receiverName)} · ${esc(a.time || '-')} &nbsp;｜&nbsp; ${esc(a.note || '')}</div>`
        : `<div class="accept-banner reject"><i class="fa-solid fa-circle-xmark"></i>验收未通过 · ${esc(a.org || pkg.receiverName)} · ${esc(a.time || '-')} &nbsp;｜&nbsp; ${esc(a.note || '')}（任务已退回处置中）</div>`;
}

function renderTimeline() {
    document.getElementById('timeline').innerHTML = (sub.updates || []).slice().reverse().map(u => `
        <div class="tl-item"><div class="tl-time">${esc(u.time)}</div><div class="tl-text">${esc(u.text)}</div></div>
    `).join('') || '<div style="color:var(--text-sub);">暂无动态</div>';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
let toastTimer = null;
function toast(msg, type) {
    let el = document.getElementById('toast-tip');
    if (!el) {
        el = document.createElement('div');
        el.id = 'toast-tip';
        el.className = 'toast-tip';
        document.body.appendChild(el);
    }
    el.textContent = msg;
    el.className = 'toast-tip show' + (type === 'warn' ? ' warn' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast-tip'; }, 2200);
}

function init() {
    initHouseArchSeed();
    ensureAuditSeedTasks();
    const { tid, sid } = getParams();
    const tasks = JSON.parse(localStorage.getItem('patrolTasks') || '[]');
    const pkgs = JSON.parse(localStorage.getItem('hazardDispatchPackages') || '{}');
    task = tasks.find(t => String(t.id) === String(tid));
    pkg = pkgs[tid];
    sub = pkg && (pkg.subTasks || []).find(s => s.id === sid);
    if (!task || !pkg || !sub) {
        document.querySelector('.container').innerHTML = '<div class="card" style="text-align:center;padding:60px;color:var(--text-sub);">未找到子任务，请从处置列表进入</div>';
        return;
    }
    document.getElementById('page-title').textContent = `整治处置 - ${sub.name}`;
    renderHeader();
    renderAcceptBanner();
    renderHouses();
    renderForm();
    renderTimeline();
}
init();
</script>
</body>
</html>
