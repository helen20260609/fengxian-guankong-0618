<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>城镇自建房安全风险治理</title>
<link href="./all.min.css" rel="stylesheet"/>
<style>
:root{--primary:#1a73e8;--primary-dark:#1557b0;--primary-light:#e8f0fe;--danger:#d93025;--warning:#e37400;--success:#1e8e3e;--bg-dark:#f0f2f5;--bg-card:#fff;--text-primary:#202124;--text-secondary:#5f6368;--border:#dadce0;--shadow:rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',-apple-system,sans-serif;background:var(--bg-dark);color:var(--text-primary);padding:20px}
.page-card{background:var(--bg-card);border-radius:8px;box-shadow:0 1px 4px var(--shadow);overflow:hidden;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:#fafbfc}
.card-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-title i{color:var(--primary)}
/* 统计卡 */
.stats-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:16px 20px}
.stat-card{border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center;background:#fff}
.stat-num{font-size:26px;font-weight:700;line-height:1.2}
.stat-label{font-size:12px;color:var(--text-secondary);margin-top:4px}
.stat-num.c-total{color:var(--primary)}.stat-num.c-doing{color:var(--warning)}.stat-num.c-done{color:var(--success)}.stat-num.c-overdue{color:var(--danger)}.stat-num.c-pending{color:#80868b}.stat-num.c-near{color:#b06000}
/* 分布条 */
.dist-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;padding:0 20px 18px}
.dist-box{border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.dist-title{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--text-primary)}
.dist-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
.dist-name{width:88px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dist-bar{flex:1;height:10px;background:#f1f3f4;border-radius:5px;overflow:hidden}
.dist-fill{height:100%;background:var(--primary);border-radius:5px}
.dist-cnt{width:34px;text-align:right;font-weight:600}
/* 工具栏 */
.search-toolbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);background:#fafbfc;flex-wrap:wrap}
.search-toolbar select,.search-toolbar input{height:34px;border:1px solid var(--border);border-radius:4px;padding:0 10px;font-size:13px;background:#fff;outline:none}
.search-toolbar input:focus,.search-toolbar select:focus{border-color:var(--primary)}
.toolbar-actions{margin-left:auto;display:flex;gap:10px}
.btn{height:34px;padding:0 14px;border:none;border-radius:4px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:#fff;border:1px solid var(--primary);color:var(--primary)}.btn-outline:hover{background:var(--primary-light)}
.btn-sm{height:26px;padding:0 10px;font-size:12px}
/* 表格 */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{background:#f8f9fa;padding:10px 12px;text-align:left;border-bottom:2px solid var(--border);color:var(--text-secondary);font-weight:600;white-space:nowrap}
.data-table td{padding:10px 12px;border-bottom:1px solid #f1f3f4;vertical-align:middle}
.data-table tr:hover{background:#f8fbff}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;white-space:nowrap}
.tag-danger{background:#fce8e6;color:var(--danger)}.tag-warning{background:#fef7e0;color:var(--warning)}.tag-success{background:#e6f4ea;color:var(--success)}.tag-info{background:var(--primary-light);color:var(--primary)}.tag-grey{background:#f1f3f4;color:#5f6368}.tag-orange{background:#fde7d9;color:#b06000}
.link{color:var(--primary);cursor:pointer;text-decoration:none}.link:hover{text-decoration:underline}
.measure-cell{font-size:12px;line-height:1.6}
.pagination{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 20px;font-size:13px;color:var(--text-secondary)}
.pagination button{min-width:30px;height:30px;border:1px solid var(--border);background:#fff;border-radius:4px;cursor:pointer}
.pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* 弹窗 */
.modal-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;justify-content:center;align-items:center}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:10px;width:640px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border);font-size:15px;font-weight:600}
.modal-close{cursor:pointer;color:var(--text-secondary);font-size:18px}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.form-row{display:flex;gap:14px;margin-bottom:14px}
.form-item{flex:1;display:flex;flex-direction:column;gap:6px}
.form-item label{font-size:13px;color:var(--text-secondary)}
.form-item label .req{color:var(--danger)}
.form-item input,.form-item select,.form-item textarea{height:34px;border:1px solid var(--border);border-radius:4px;padding:0 10px;font-size:13px;outline:none;font-family:inherit}
.form-item textarea{height:auto;padding:8px 10px;resize:vertical}
.form-item input:focus,.form-item select:focus{border-color:var(--primary)}
.house-check-list{max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:8px}
.house-check-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;font-size:13px}
.house-check-item:hover{background:#f8fbff}
.radio-group{display:flex;gap:18px;font-size:13px;align-items:center}
.hint{font-size:12px;color:var(--text-secondary);margin-top:4px}
</style>
</head>
<body>

<!-- 统计区 -->
<div class="page-card">
  <div class="card-header"><div class="card-title"><i class="fas fa-chart-pie"></i> 治理统计（按区域 / 措施类型 / 完成情况）</div></div>
  <div class="stats-row" id="statsRow"></div>
  <div class="dist-wrap" id="distWrap"></div>
</div>

<!-- 台账列表 -->
<div class="page-card">
  <div class="card-header"><div class="card-title"><i class="fas fa-tools"></i> 城镇自建房安全风险治理台账</div></div>
  <div class="search-toolbar">
    <select id="fTown"><option value="">全部街镇</option></select>
    <select id="fRisk"><option value="">全部风险等级</option><option value="danger">疑似危房</option><option value="major">疑似严重损坏房</option><option value="warning">疑似一般损坏房</option></select>
    <select id="fGov"><option value="">全部治理状态</option><option value="pending">未整治</option><option value="doing">整治中</option><option value="done">已整治</option><option value="overdue">逾期未整治</option></select>
    <select id="fTask"><option value="">任务下发</option><option value="yes">已下发</option><option value="no">未下发</option></select>
    <input id="fKw" placeholder="唯一标识 / 户主 / 地址" style="min-width:180px"/>
    <div class="toolbar-actions">
      <button class="btn btn-outline" id="btnDispatchBatch"><i class="fas fa-layer-group"></i> 批量下发排查任务</button>
      <button class="btn btn-primary" id="btnDispatchAim"><i class="fas fa-bullseye"></i> 定向指派</button>
    </div>
  </div>
  <div style="overflow-x:auto">
    <table class="data-table">
      <thead><tr>
        <th>序号</th><th>唯一标识</th><th>街镇</th><th>社区/村</th><th>户主</th><th>风险等级</th><th>隐患数</th>
        <th>管理措施</th><th>工程措施</th><th>排查任务</th><th>治理状态</th><th>操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="pagination" id="pager"></div>
</div>

<!-- 排查任务下发弹窗 -->
<div class="modal-mask" id="dispatchModal">
  <div class="modal">
    <div class="modal-header"><span id="dmTitle">下发排查任务</span><i class="fas fa-times modal-close" onclick="closeDispatch()"></i></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-item"><label>下发方式</label>
          <div class="radio-group">
            <label><input type="radio" name="dmMode" value="batch" checked/> 批量下发（当前筛选结果 <b id="dmBatchCnt">0</b> 栋）</label>
            <label><input type="radio" name="dmMode" value="aim"/> 定向指派（勾选房屋）</label>
          </div>
        </div>
      </div>
      <div class="form-row" id="dmAimRow" style="display:none">
        <div class="form-item"><label>选择房屋（<span id="dmChecked">0</span> 栋）</label>
          <div class="house-check-list" id="dmHouseList"></div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-item"><label>排查期限</label><input type="date" id="dmDeadline"/></div>
        <div class="form-item"><label>下发人</label><input id="dmDispatcher" value="区房管局-管理员"/></div>
      </div>
      <div class="hint">下发后任务同步至各房屋档案「排查任务」标记，社区网格员按期限完成入户排查并回传隐患信息。</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeDispatch()">取消</button>
      <button class="btn btn-primary" onclick="confirmDispatch()"><i class="fas fa-paper-plane"></i> 确认下发</button>
    </div>
  </div>
</div>

<script src="../js/urban-house-arch-data.js"></script>
<script>
initHouseArchSeed();
seedGovernDemoData(); // 一次性充实演示数据（幂等）
const PAGE_SIZE = 10;
let page = 1;

function allUrban() {
    return getAllHouseRecords().filter(r => r.houseType === '城镇自建房' && r.risk !== 'safe');
}
function getFiltered() {
    const town = document.getElementById('fTown').value;
    const risk = document.getElementById('fRisk').value;
    const gov = document.getElementById('fGov').value;
    const task = document.getElementById('fTask').value;
    const kw = document.getElementById('fKw').value.trim();
    return allUrban().filter(r => {
        if (town && r.street !== town) return false;
        if (risk && r.risk !== risk) return false;
        if (gov && (r.governance || 'pending') !== gov) return false;
        if (task === 'yes' && !r.governTask) return false;
        if (task === 'no' && r.governTask) return false;
        if (kw && !((r.no||'').includes(kw) || (r.owner||'').includes(kw) || (r.address||'').includes(kw))) return false;
        return true;
    });
}
function riskTag(risk) {
    if (risk === 'danger') return '<span class="tag tag-danger">疑似危房</span>';
    if (risk === 'major') return '<span class="tag tag-orange">疑似严重损坏房</span>';
    if (risk === 'warning') return '<span class="tag tag-warning">疑似一般损坏房</span>';
    return '<span class="tag tag-success">完好房</span>';
}
function govTag(g) {
    const map = { pending: ['tag-grey','未整治'], doing: ['tag-warning','整治中'], done: ['tag-success','已整治'], overdue: ['tag-danger','逾期未整治'] };
    const it = map[g] || map.pending;
    return '<span class="tag ' + it[0] + '">' + it[1] + '</span>';
}
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function renderStats() {
    const records = allUrban();
    records.forEach(ensureGovernData);
    const s = govListStats(records);
    const today = new Date(); const in7 = new Date(today.getTime() + 7*86400000);
    let nearCnt = 0;
    records.forEach(r => (r.manageRecords||[]).forEach(m => {
        if (!(m.isDone || m.status === '已结束') && m.planEndTime) {
            const d = new Date(m.planEndTime);
            if (d >= today && d <= in7) nearCnt++;
        }
    }));
    document.getElementById('statsRow').innerHTML =
        stat(s.total, '治理房屋总数', 'c-total') + stat(s.doing, '整治中', 'c-doing') +
        stat(s.done, '已整治', 'c-done') + stat(s.overdue, '逾期未整治', 'c-overdue') +
        stat(s.pending, '未整治', 'c-pending') + stat(nearCnt, '措施7天内到期', 'c-near');
    function stat(n, label, cls) { return '<div class="stat-card"><div class="stat-num ' + cls + '">' + n + '</div><div class="stat-label">' + label + '</div></div>'; }
    document.getElementById('distWrap').innerHTML =
        distBox('按区域分布（街镇）', s.byTown) +
        distBox('管理措施类型分布', s.byManageType) +
        distBox('工程措施类型分布', s.byEngType);
    function distBox(title, obj) {
        const entries = Object.entries(obj).sort((a,b) => b[1]-a[1]).slice(0, 8);
        const max = entries.length ? entries[0][1] : 1;
        let rows = entries.map(([k,v]) =>
            '<div class="dist-row"><span class="dist-name" title="' + esc(k) + '">' + esc(k) + '</span>' +
            '<div class="dist-bar"><div class="dist-fill" style="width:' + Math.round(v/max*100) + '%"></div></div>' +
            '<span class="dist-cnt">' + v + '</span></div>').join('');
        return '<div class="dist-box"><div class="dist-title">' + title + '</div>' + (rows || '<div class="hint">暂无数据</div>') + '</div>';
    }
}

function renderTable() {
    const list = getFiltered();
    const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (page > totalPages) page = totalPages;
    const rows = list.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
    const tb = document.getElementById('tbody');
    if (!rows.length) { tb.innerHTML = '<tr><td colspan="12" style="text-align:center;color:var(--text-secondary);padding:30px">暂无数据</td></tr>'; }
    else tb.innerHTML = rows.map((r, i) => {
        const gs = govStatsOf(r);
        const task = r.governTask
            ? '<span class="tag tag-info">' + esc(r.governTask.taskType) + '</span><div class="hint">' + esc(r.governTask.dispatchTime).slice(0,10) + '</div>'
            : '<span class="tag tag-grey">未下发</span>';
        return '<tr>' +
            '<td>' + ((page-1)*PAGE_SIZE + i + 1) + '</td>' +
            '<td><a class="link" href="hs-govern-detail-urban.html?no=' + encodeURIComponent(r.no) + '">' + esc(r.no) + '</a></td>' +
            '<td>' + esc(r.street) + '</td><td>' + esc(r.community || r.village) + '</td><td>' + esc(r.owner) + '</td>' +
            '<td>' + riskTag(r.risk) + '</td>' +
            '<td>' + (r.hazards || []).length + '</td>' +
            '<td class="measure-cell">' + (gs.mTotal ? gs.mDone + '/' + gs.mTotal + ' 完成' + (gs.mOverdue ? ' <span class="tag tag-danger">超期' + gs.mOverdue + '</span>' : '') : '—') + '</td>' +
            '<td class="measure-cell">' + (gs.pTotal ? gs.pDone + '/' + gs.pTotal + ' 完成' : '—') + '</td>' +
            '<td>' + task + '</td>' +
            '<td>' + govTag(r.governance || 'pending') + '</td>' +
            '<td><a class="link" href="hs-govern-detail-urban.html?no=' + encodeURIComponent(r.no) + '">治理详情</a></td>' +
        '</tr>';
    }).join('');
    // 分页
    let ph = '<span>共 ' + list.length + ' 条</span>';
    ph += '<button ' + (page <= 1 ? 'disabled' : '') + ' onclick="goPage(' + (page-1) + ')">&lt;</button>';
    for (let p = 1; p <= totalPages && p <= 7; p++) ph += '<button class="' + (p === page ? 'active' : '') + '" onclick="goPage(' + p + ')">' + p + '</button>';
    ph += '<button ' + (page >= totalPages ? 'disabled' : '') + ' onclick="goPage(' + (page+1) + ')">&gt;</button>';
    document.getElementById('pager').innerHTML = ph;
}
function goPage(p) { page = p; renderTable(); }

// ---- 排查任务下发 ----
function openDispatch(mode) {
    const filtered = getFiltered();
    document.getElementById('dmBatchCnt').textContent = filtered.length;
    document.querySelector('input[name="dmMode"][value="' + mode + '"]').checked = true;
    toggleDmMode();
    document.getElementById('dmHouseList').innerHTML = filtered.map(r =>
        '<label class="house-check-item"><input type="checkbox" value="' + esc(r.no) + '" onchange="updDmCnt()"/> ' +
        esc(r.no) + ' <span style="color:var(--text-secondary)">' + esc(r.street) + ' ' + esc(r.community || r.village) + ' ' + esc(r.owner) + '</span></label>').join('') || '<div class="hint">当前筛选无房屋</div>';
    updDmCnt();
    document.getElementById('dispatchModal').classList.add('show');
}
function toggleDmMode() {
    const mode = document.querySelector('input[name="dmMode"]:checked').value;
    document.getElementById('dmAimRow').style.display = mode === 'aim' ? '' : 'none';
}
function updDmCnt() {
    document.getElementById('dmChecked').textContent = document.querySelectorAll('#dmHouseList input:checked').length;
}
function closeDispatch() { document.getElementById('dispatchModal').classList.remove('show'); }
function confirmDispatch() {
    const mode = document.querySelector('input[name="dmMode"]:checked').value;
    let nos;
    if (mode === 'batch') nos = getFiltered().map(r => r.no);
    else nos = Array.from(document.querySelectorAll('#dmHouseList input:checked')).map(c => c.value);
    if (!nos.length) { alert('请先选择要下发的房屋'); return; }
    const cnt = dispatchGovernTask(nos, {
        taskType: mode === 'batch' ? '批量下发' : '定向指派',
        dispatcher: document.getElementById('dmDispatcher').value.trim() || '当前用户',
        deadline: document.getElementById('dmDeadline').value
    });
    closeDispatch();
    alert('已下发 ' + cnt + ' 栋房屋的排查任务');
    renderStats(); renderTable();
}

// ---- 初始化 ----
(function init() {
    const towns = [...new Set(allUrban().map(r => r.street).filter(Boolean))].sort();
    document.getElementById('fTown').innerHTML = '<option value="">全部街镇</option>' + towns.map(t => '<option>' + esc(t) + '</option>').join('');
    ['fTown','fRisk','fGov','fTask'].forEach(id => document.getElementById(id).addEventListener('change', () => { page = 1; renderTable(); }));
    document.getElementById('fKw').addEventListener('input', () => { page = 1; renderTable(); });
    document.getElementById('btnDispatchBatch').addEventListener('click', () => openDispatch('batch'));
    document.getElementById('btnDispatchAim').addEventListener('click', () => openDispatch('aim'));
    document.querySelectorAll('input[name="dmMode"]').forEach(r => r.addEventListener('change', toggleDmMode));
    renderStats(); renderTable();
})();
</script>
</body>
</html>
