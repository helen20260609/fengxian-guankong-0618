
<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>农村自建房 - 隐患流程配置</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ===== Theme Variables ===== */
:root {
    --primary: #1a73e8; --primary-dark: #1557b0; --primary-light: #e8f0fe;
    --secondary: #0097a7; --danger: #d93025; --warning: #e65100; --success: #1e8e3e;
    --bg-dark: #f0f2f5; --bg-card: #ffffff; --bg-hover: #e8eaed;
    --text-primary: #202124; --text-secondary: #5f6368; --border: #dadce0;
    --shadow: rgba(0,0,0,0.08); --input-bg: #ffffff; --input-border: #dadce0;
}
:root[data-theme="dark"] {
    --primary: #1e6fdb; --primary-dark: #1557b0; --primary-light: #e8f1fd;
    --secondary: #00b4d8; --danger: #ef4444; --warning: #f59e0b; --success: #10b981;
    --bg-dark: #0a1628; --bg-card: #112240; --bg-hover: #1a2f4a;
    --text-primary: #e2e8f0; --text-secondary: #94a3b8; --border: #1e3a5f;
    --shadow: rgba(0,0,0,0.3); --input-bg: rgba(255,255,255,0.05); --input-border: #1e3a5f;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif;
    background: var(--bg-dark);
    color: var(--text-primary);
    padding: 20px;
    min-height: 100vh;
}

/* ===== Breadcrumb & Title ===== */
.page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}
.breadcrumb {
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
}
.breadcrumb a {
    color: var(--primary);
    text-decoration: none;
    cursor: pointer;
}
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb-sep { color: var(--text-secondary); opacity: 0.5; }
.page-title {
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
}
.page-title i { color: var(--primary); }
.page-actions { display: flex; gap: 10px; }

/* ===== Common Buttons ===== */
.btn {
    height: 34px;
    padding: 0 18px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-default { background: var(--bg-hover); color: var(--text-primary); border: 1px solid var(--border); }
.btn-default:hover { background: var(--border); }

/* ===== Source Tabs ===== */
.source-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 1px 3px var(--shadow);
}
.source-tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.25s;
    border: 1px solid transparent;
    background: transparent;
}
.source-tab:hover {
    color: var(--primary);
    background: rgba(30, 111, 219, 0.06);
    border-color: rgba(30, 111, 219, 0.2);
}
.source-tab.active {
    color: #fff;
    background: var(--primary);
    border-color: var(--primary);
    box-shadow: 0 2px 6px rgba(26, 115, 232, 0.2);
}
.source-tab i { font-size: 15px; }
.source-tab .count {
    font-size: 12px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(255,255,255,0.2);
}

/* ===== Config Card ===== */
.config-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 3px var(--shadow);
}
.config-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--bg-hover);
    border-bottom: 1px solid var(--border);
}
.config-card-title {
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
}
.config-card-title i { color: var(--primary); }

/* ===== Flow Timeline ===== */
.flow-timeline {
    position: relative;
    padding: 24px 18px;
}
.flow-timeline::before {
    content: '';
    position: absolute;
    left: 42px;
    top: 38px;
    bottom: 38px;
    width: 2px;
    background: var(--border);
    z-index: 0;
}
.flow-node {
    position: relative;
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
    z-index: 1;
}
.flow-node:last-child { margin-bottom: 0; }
.node-marker {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 2px solid var(--primary);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
}
.node-card {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    transition: all 0.25s;
}
.node-card:hover {
    border-color: var(--primary);
    box-shadow: 0 2px 8px rgba(26, 115, 232, 0.1);
}
.node-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
}
.node-name {
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
}
.node-name i { color: var(--primary); font-size: 14px; }

/* ===== Node Settings (Horizontal Row Layout) ===== */
.node-settings {
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.setting-row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 34px;
}
.setting-row.block {
    display: block;
}
.setting-label {
    font-size: 13px;
    color: var(--text-primary);
    white-space: nowrap;
    font-weight: 500;
}
.setting-label i { color: var(--primary); font-size: 12px; margin-right: 4px; }
.setting-input,
.setting-select {
    height: 34px;
    padding: 0 12px;
    border: 1px solid var(--input-border);
    border-radius: 6px;
    background: var(--input-bg);
    color: var(--text-primary);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
    min-width: 220px;
}
.setting-input:focus,
.setting-select:focus { border-color: var(--primary); }

/* ===== Checkboxes ===== */
.checkbox-option {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-primary);
    cursor: pointer;
}
.checkbox-option input { cursor: pointer; }

/* ===== Toggle Switch ===== */
.switch-wrap {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-primary);
    cursor: pointer;
}
.switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 22px;
    flex-shrink: 0;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--border);
    border-radius: 22px;
    transition: 0.3s;
}
.slider::before {
    content: '';
    position: absolute;
    height: 18px;
    width: 18px;
    left: 2px;
    bottom: 2px;
    background: #fff;
    border-radius: 50%;
    transition: 0.3s;
}
.switch input:checked + .slider { background: var(--success); }
.switch input:checked + .slider::before { transform: translateX(18px); }

/* ===== Policy Group ===== */
.policy-group {
    margin-top: 4px;
}
.policy-title {
    font-size: 13px;
    color: var(--text-primary);
    font-weight: 500;
    margin-bottom: 10px;
}
.policy-title i { color: var(--primary); font-size: 12px; margin-right: 4px; }
.policy-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-left: 4px;
}
.policy-option {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 13px;
    color: var(--text-primary);
    cursor: pointer;
    line-height: 1.4;
}
.policy-option input { cursor: pointer; margin-top: 2px; flex-shrink: 0; }
.setting-hint {
    font-size: 12px;
    color: var(--warning);
    background: rgba(230, 81, 0, 0.08);
    padding: 8px 12px;
    border-radius: 6px;
    border-left: 3px solid var(--warning);
    line-height: 1.5;
    margin-top: 8px;
}

/* ===== Action Buttons ===== */
.actions {
    display: flex;
    gap: 10px;
    align-items: center;
}
.action-link {
    font-size: 13px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    transition: opacity 0.2s;
    color: var(--primary);
}
.action-link:hover {
    opacity: 0.8;
    text-decoration: underline;
}
.action-link.delete { color: var(--danger); }

/* ===== Responsive ===== */
@media (max-width: 768px) {
    .source-tabs { flex-wrap: wrap; }
    .source-tab { flex: 1 1 calc(50% - 4px); }
    .setting-row { flex-direction: column; align-items: flex-start; gap: 6px; }
}
</style>
</head>
<body>

<div class="page-header">
    <div>
        <div class="breadcrumb">
            <a onclick="window.parent.postMessage({action:'navigate',topNav:'risk-judgment',subNav:'rural-warning-center'},'*')">
                <i class="fa-solid fa-arrow-left"></i> 返回预警中心
            </a>
            <span class="breadcrumb-sep">/</span>
            <span>隐患流程配置</span>
        </div>
        <div class="page-title" style="margin-top:8px">
            <i class="fa-solid fa-house-chimney"></i>
            <span>农村自建房隐患流程配置</span>
        </div>
    </div>
    <div class="page-actions">
        <button class="btn btn-default" onclick="resetConfig()">
            <i class="fa-solid fa-rotate-left"></i> 重置
        </button>
        <button class="btn btn-primary" onclick="saveConfig()">
            <i class="fa-solid fa-floppy-disk"></i> 保存配置
        </button>
    </div>
</div>

<!-- 隐患来源切换 Tab -->
<div class="source-tabs" id="sourceTabs">
    <div class="source-tab active" data-source="inspection" onclick="switchSource(this)">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>排查发现</span>
        <span class="count">6</span>
    </div>
    <div class="source-tab" data-source="patrol" onclick="switchSource(this)">
        <i class="fa-solid fa-clipboard-check"></i>
        <span>巡查人员上报</span>
        <span class="count">6</span>
    </div>
    <div class="source-tab" data-source="citizen" onclick="switchSource(this)">
        <i class="fa-solid fa-users"></i>
        <span>群众举报</span>
        <span class="count">6</span>
    </div>
    <div class="source-tab" data-source="expert" onclick="switchSource(this)">
        <i class="fa-solid fa-user-doctor"></i>
        <span>专家研判</span>
        <span class="count">6</span>
    </div>
</div>

<!-- 流程节点配置 -->
<div class="config-card">
    <div class="config-card-header">
        <div class="config-card-title">
            <i class="fa-solid fa-sliders"></i>
            <span id="configTitle">排查发现 - 流程节点配置</span>
        </div>
    </div>
    <div class="flow-timeline" id="flowTimeline">
        <!-- Nodes will be rendered here -->
    </div>
</div>

<script>
// ===== 流程节点定义 =====
const FLOW_NODES = [
    { id: 'report', name: '隐患上报', icon: 'fa-file-circle-plus', seq: 1 },
    { id: 'audit', name: '隐患审核', icon: 'fa-clipboard-check', seq: 2 },
    { id: 'dispatch', name: '隐患分发', icon: 'fa-share-nodes', seq: 3 },
    { id: 'receive', name: '隐患接收', icon: 'fa-inbox', seq: 4 },
    { id: 'handle', name: '隐患处置', icon: 'fa-screwdriver-wrench', seq: 5 },
    { id: 'acceptance', name: '隐患验收', icon: 'fa-check-double', seq: 6 }
];

// ===== 隐患来源 =====
const SOURCE_MAP = {
    inspection: '排查发现',
    patrol: '巡查人员上报',
    citizen: '群众举报',
    expert: '专家研判'
};

// ===== 默认系统角色选项 =====
const ROLE_OPTIONS = [
    '区级管理员',
    '街镇城建中心管理员',
    '村级网格员',
    '产权人',
    '第三方鉴定机构',
    '巡查人员',
    '专家'
];

const HANDLER_STRATEGIES = [
    '按系统角色分配',
    '按房屋属地（街镇/村）分配',
    '按产权人分配',
    '按隐患上报人分配',
    '按第三方鉴定机构分配'
];

const REJECT_STRATEGIES = [
    '退回上一节点',
    '退回初始上报人'
];

// ===== 默认配置 =====
const DEFAULT_CONFIGS = {
    inspection: {
        report: { strategy: '按系统角色分配', role: '巡查人员' },
        audit: { strategy: '按系统角色分配', role: '街镇城建中心管理员', autoApprove: true, rejectStrategy: '退回上一节点' },
        dispatch: { strategy: '按房屋属地（街镇/村）分配', role: '街镇城建中心管理员', autoApprove: true, autoDispatch: true, allowFallback: true },
        receive: { strategy: '按房屋属地（街镇/村）分配', role: '村级网格员', rejectStrategy: '退回上一节点' },
        handle: { strategy: '按系统角色分配', role: '产权人' },
        acceptance: { strategy: '按系统角色分配', role: '第三方鉴定机构', rejectStrategy: '退回初始上报人' },
    },
    patrol: {
        report: { strategy: '按隐患上报人分配', role: '巡查人员' },
        audit: { strategy: '按系统角色分配', role: '街镇城建中心管理员', autoApprove: true, rejectStrategy: '退回上一节点' },
        dispatch: { strategy: '按房屋属地（街镇/村）分配', role: '街镇城建中心管理员', autoApprove: true, autoDispatch: true, allowFallback: true },
        receive: { strategy: '按房屋属地（街镇/村）分配', role: '村级网格员', rejectStrategy: '退回上一节点' },
        handle: { strategy: '按系统角色分配', role: '产权人' },
        acceptance: { strategy: '按系统角色分配', role: '第三方鉴定机构', rejectStrategy: '退回初始上报人' },
    },
    citizen: {
        report: { strategy: '按隐患上报人分配', role: '村级网格员' },
        audit: { strategy: '按系统角色分配', role: '街镇城建中心管理员', autoApprove: true, rejectStrategy: '退回上一节点' },
        dispatch: { strategy: '按房屋属地（街镇/村）分配', role: '街镇城建中心管理员', autoApprove: true, autoDispatch: true, allowFallback: true },
        receive: { strategy: '按房屋属地（街镇/村）分配', role: '村级网格员', rejectStrategy: '退回上一节点' },
        handle: { strategy: '按系统角色分配', role: '产权人' },
        acceptance: { strategy: '按系统角色分配', role: '第三方鉴定机构', rejectStrategy: '退回初始上报人' },
    },
    expert: {
        report: { strategy: '按第三方鉴定机构分配', role: '专家' },
        audit: { strategy: '按系统角色分配', role: '区级管理员', autoApprove: true, rejectStrategy: '退回上一节点' },
        dispatch: { strategy: '按系统角色分配', role: '区级管理员', autoApprove: true, autoDispatch: true, allowFallback: true },
        receive: { strategy: '按房屋属地（街镇/村）分配', role: '村级网格员', rejectStrategy: '退回上一节点' },
        handle: { strategy: '按系统角色分配', role: '产权人' },
        acceptance: { strategy: '按系统角色分配', role: '第三方鉴定机构', rejectStrategy: '退回初始上报人' },
    }
};

let currentSource = 'inspection';
let configs = JSON.parse(JSON.stringify(DEFAULT_CONFIGS));

// ===== 初始化 =====
function init() {
    renderTimeline();
}

// ===== 切换隐患来源 =====
function switchSource(el) {
    document.querySelectorAll('.source-tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentSource = el.dataset.source;
    document.getElementById('configTitle').textContent = SOURCE_MAP[currentSource] + ' - 流程节点配置';
    renderTimeline();
}

// ===== 渲染流程节点 =====
function renderTimeline() {
    const container = document.getElementById('flowTimeline');
    const cfg = configs[currentSource];
    container.innerHTML = FLOW_NODES.map(node => {
        const c = cfg[node.id];
        return `
        <div class="flow-node" data-node="${node.id}">
            <div class="node-marker">${node.seq}</div>
            <div class="node-card">
                <div class="node-header">
                    <div class="node-name">
                        <i class="fa-solid ${node.icon}"></i>
                        <span>节点 ${node.seq}：${node.name}</span>
                    </div>
                </div>
                <div class="node-settings">
                    <div class="setting-row">
                        <div class="setting-label"><i class="fa-solid fa-user-gear"></i> 节点配置策略：</div>
                        <select class="setting-select" onchange="updateConfig('${node.id}', 'strategy', this.value)">
                            ${HANDLER_STRATEGIES.map(s => `<option value="${s}" ${c.strategy === s ? 'selected' : ''}>${s}</option>`).join('')}
                        </select>
                    </div>
                    <div class="setting-row">
                        <div class="setting-label"><i class="fa-solid fa-id-badge"></i> 默认处理角色：</div>
                        <select class="setting-select" onchange="updateConfig('${node.id}', 'role', this.value)">
                            ${ROLE_OPTIONS.map(r => `<option value="${r}" ${c.role === r ? 'selected' : ''}>${r}</option>`).join('')}
                        </select>
                    </div>
                    ${node.id === 'audit' || node.id === 'receive' || node.id === 'acceptance' ? `
                    <div class="setting-row">
                        <div class="setting-label"><i class="fa-solid fa-rotate-left"></i> 退回/驳回策略：</div>
                        <select class="setting-select" onchange="updateConfig('${node.id}', 'rejectStrategy', this.value)">
                            ${REJECT_STRATEGIES.map(s => `<option value="${s}" ${c.rejectStrategy === s ? 'selected' : ''}>${s}</option>`).join('')}
                        </select>
                    </div>
                    ` : ''}
                    ${node.id === 'dispatch' ? `
                    <div class="setting-row">
                        <label class="checkbox-option">
                            <input type="checkbox" ${c.allowFallback ? 'checked' : ''} onchange="updateConfig('${node.id}', 'allowFallback', this.checked)">
                            允许兜底：若无法自动匹配到属地责任人，允许上一步处理人手动指定
                        </label>
                    </div>
                    ` : ''}
                    ${node.id === 'audit' || node.id === 'dispatch' ? `
                    <div class="setting-row block">
                        <div class="policy-title"><i class="fa-solid fa-wand-magic-sparkles"></i> 自动审批策略（可多选/并行生效）：</div>
                        <div class="policy-options">
                            <label class="policy-option">
                                <input type="checkbox" ${c.autoApprove ? 'checked' : ''} onchange="updateConfig('${node.id}', 'autoApprove', this.checked)">
                                同人自动过审（上下节点处理人相同时自动通过）
                            </label>
                            ${node.id === 'dispatch' ? `
                            <label class="policy-option">
                                <input type="checkbox" ${c.autoDispatch ? 'checked' : ''} onchange="updateConfig('${node.id}', 'autoDispatch', this.checked)">
                                条件自动分发（房屋已关联产权人/责任网格时自动派发）
                            </label>
                            ` : ''}
                        </div>
                        ${node.id === 'audit' ? `
                        <div class="setting-hint">当前节点的应处理人，与上一节点的实际办理人（或事项发起上报人）为同一主体时，系统自动执行本节点审批操作，审批结果默认置为通过。</div>
                        ` : ''}
                        ${node.id === 'dispatch' ? `
                        <div class="setting-hint">已明确产权人或责任网格的农村自建房隐患，系统免人工分发，直推对应村级网格员或产权人；无法自动匹配的，由节点策略角色人工分发。</div>
                        ` : ''}
                    </div>
                    ` : ''}
                </div>
            </div>
        </div>
        `;
    }).join('');
}

// ===== 更新配置 =====
function updateConfig(nodeId, field, value) {
    configs[currentSource][nodeId][field] = value;
}

// ===== 保存配置 =====
function saveConfig() {
    console.log('保存配置：', configs[currentSource]);
    alert('农村自建房隐患流程配置已保存（当前来源：' + SOURCE_MAP[currentSource] + '）');
}

// ===== 重置配置 =====
function resetConfig() {
    if (confirm('确定要重置当前来源的农村自建房默认流程配置吗？')) {
        configs[currentSource] = JSON.parse(JSON.stringify(DEFAULT_CONFIGS[currentSource]));
        renderTimeline();
    }
}

// ===== 主题同步 =====
window.addEventListener('message', function(event) {
    if (event.data && event.data.action === 'setTheme') {
        document.documentElement.setAttribute('data-theme', event.data.theme);
    }
});

init();
</script>
