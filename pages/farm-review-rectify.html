<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>农房回头看 · 隐患整治</title>
<link rel="stylesheet" href="./all.min.css">
<style>
:root {
  --primary: #1a73e8; --primary-light: #e8f0fe;
  --success: #1e8e3e; --danger: #d93025; --warning: #e65100;
  --bg-dark: #f0f2f5; --bg-card: #ffffff; --bg-hover: #e8eaed;
  --text-primary: #202124; --text-secondary: #5f6368; --border: #dadce0;
}
:root[data-theme="dark"] {
  --primary: #1e6fdb; --primary-light: #e8f1fd;
  --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
  --bg-dark: #0a1628; --bg-card: #112240; --bg-hover: #1a2f4a;
  --text-primary: #e2e8f0; --text-secondary: #94a3b8; --border: #1e3a5f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei','PingFang SC',-apple-system,sans-serif; background: var(--bg-dark); color: var(--text-primary); padding: 20px; min-height: 100vh; }

/* 头部 */
.sticky-wrapper { position: sticky; top: 0; z-index: 100; background: var(--bg-dark); padding-bottom: 16px; }
.breadcrumb { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.breadcrumb a { color: var(--primary); text-decoration: none; cursor: pointer; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb-sep { color: var(--text-secondary); opacity: .5; }
.page-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.page-title i { color: var(--danger); }
.page-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }

/* 卡片 */
.card { background: var(--bg-card); border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; overflow: hidden; }
.card-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.card-header .ch-title { font-size: 15px; font-weight: 700; }
.card-header .ch-badge { font-size: 11px; padding: 2px 8px; border-radius: 8px; background: var(--primary-light); color: var(--primary); font-weight: 600; }
.card-header .ch-badge.danger { background: #fce8e6; color: var(--danger); }
.card-header .ch-badge.success { background: #e6f4ea; color: var(--success); }
.card-body { padding: 18px 20px; }

/* 表单 */
.form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 18px; margin-bottom: 14px; }
.form-row.single { grid-template-columns: 1fr; }
.form-row.three { grid-template-columns: repeat(3, 1fr); }
.form-item { display: flex; flex-direction: column; gap: 5px; }
.fi-label { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
.fi-label .req { color: var(--danger); font-weight: 700; }
.fi-input, .fi-select, .fi-textarea { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: var(--bg-card); color: var(--text-primary); font-family: inherit; transition: border-color .15s; }
.fi-input:focus, .fi-select:focus, .fi-textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.fi-textarea { min-height: 72px; resize: vertical; }
.fi-input[readonly] { background: var(--bg-hover); color: var(--text-secondary); cursor: not-allowed; }

/* 单选/多选 */
.option-group { display: flex; flex-wrap: wrap; gap: 8px; }
.opt-pill { padding: 6px 14px; border: 1px solid var(--border); border-radius: 16px; font-size: 13px; cursor: pointer; user-select: none; background: var(--bg-card); transition: all .15s; }
.opt-pill:hover { border-color: var(--primary); color: var(--primary); }
.opt-pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.opt-pill.danger.active { background: var(--danger); border-color: var(--danger); }
.opt-pill.safe.active { background: var(--success); border-color: var(--success); }
.opt-pill.warning.active { background: var(--warning); border-color: var(--warning); }

/* 只读回显 */
.readonly-block { background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
.rb-row { display: flex; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--border); }
.rb-row:last-child { border-bottom: none; }
.rb-label { width: 140px; flex-shrink: 0; color: var(--text-secondary); }
.rb-value { flex: 1; color: var(--text-primary); word-break: break-all; }
.rb-value.empty { color: var(--text-secondary); opacity: .55; font-style: italic; }

/* 照片网格 */
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 8px; }
.photo-item { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); aspect-ratio: 4/3; background: var(--bg-hover); cursor: zoom-in; }
.photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-item .pi-del { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; border: none; cursor: pointer; font-size: 11px; display: none; align-items: center; justify-content: center; }
.photo-item.editable .pi-del { display: flex; }
.photo-item .pi-del:hover { background: var(--danger); }

.photo-upload { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border: 1px dashed var(--border); border-radius: 8px; background: var(--bg-dark); color: var(--text-secondary); font-size: 13px; cursor: pointer; transition: all .15s; margin-top: 8px; }
.photo-upload:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
.photo-upload input[type=file] { display: none; }

/* 签名区 */
.signature-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.signature-group .form-item { min-width: 0; }
.sig-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.sig-field .sf-label { font-size: 11px; color: var(--text-secondary); padding-left: 2px; }
.sig-field .sf-label .req { color: var(--danger); font-weight: 700; margin-right: 2px; }

/* 整治措施分组 */
.measure-group { display: grid; grid-template-columns: 110px 1fr; gap: 14px 18px; margin-bottom: 14px; }
.mg-label { grid-row: 1 / span 2; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; }
.mg-label-inner { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--text-primary); background: var(--primary-light); padding: 6px 14px; border-radius: 8px; }
.mg-label-inner .req { color: var(--danger); }
.mg-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 18px; }

/* 底部操作 */
.action-bar { position: sticky; bottom: 0; background: var(--bg-card); border-top: 1px solid var(--border); padding: 14px 20px; display: flex; gap: 12px; align-items: center; border-radius: 12px 12px 0 0; box-shadow: 0 -2px 8px rgba(0,0,0,.04); }
.btn { padding: 9px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); font-size: 13px; cursor: pointer; font-family: inherit; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn.primary:hover { background: #1565c0; }
.btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.action-bar .status-hint { margin-left: auto; font-size: 12px; color: var(--text-secondary); }

/* 只读模式 */
.readonly-mode .fi-input,
.readonly-mode .fi-select,
.readonly-mode .fi-textarea { pointer-events: none; background: var(--bg-hover) !important; color: var(--text-secondary) !important; }
.readonly-mode .opt-pill { pointer-events: none; opacity: .45; }
.readonly-mode .opt-pill.active { opacity: 1; }
.readonly-mode .photo-upload { pointer-events: none; opacity: .4; }
.readonly-mode .photo-item .pi-del { display: none !important; }
.readonly-mode .view-only-banner { display: flex; align-items: center; gap: 8px; background: var(--primary-light); color: var(--primary); font-size: 13px; padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; }
.view-only-banner { display: none; }

/* 空态 */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.empty-state i { font-size: 48px; margin-bottom: 12px; opacity: .3; }

/* lightbox */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 9999; align-items: center; justify-content: center; cursor: zoom-out; }
.lightbox.show { display: flex; }
.lightbox img { max-width: 92vw; max-height: 90vh; border-radius: 8px; }

/* 响应式 */
@media (max-width: 1024px) {
  .form-row, .form-row.three { grid-template-columns: 1fr; }
  .signature-group { grid-template-columns: 1fr; }
}
</style>
</head>

<script>
// ================= 配置 =================
var OPTION_GROUPS = {
  appraisalDone: [{value:'是',cls:'safe'},{value:'否',cls:'danger'}],
  appraisalConclusion: [{value:'A级',cls:'safe'},{value:'B级',cls:'warning'},{value:'C级',cls:'warning'},{value:'D级',cls:'danger'}],
  controlDone: [{value:'是',cls:'safe'},{value:'否',cls:'danger'}],
  engineeringDone: [{value:'是',cls:'safe'},{value:'否',cls:'danger'}]
};

var CHECKBOX_GROUPS = {
  controlTypes: ['停止使用','停止经营','封控警示','人员撤离','硬隔离防护措施','其他'],
  engineeringTypes: ['拆除重建','维修加固','拆除','其他']
};

// ================= 全局状态 =================
var currentRecord = null;
var rectifyData = {
  appraisal: { done: '', date: '', conclusion: '', orgName: '', orgCode: '' },
  measures: {
    controlDone: '', controlTypes: [], controlTypeOther: '',
    engineeringDone: '', engineeringTypes: [], engineeringTypeOther: '',
    ownerSign: '', ownerPhone: '', ownerDate: '',
    userSign: '', userPhone: '', userDate: '',
    townSign: '', townOrg: '', townPhone: '', townDate: '',
    districtSign: '', districtOrg: '', districtPhone: '', districtDate: '',
    controlPhotos: [], engineeringPhotos: []
  },
  updateTime: ''
};

// ================= 工具函数 =================
function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getQueryParam(name) {
  var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
  return m ? decodeURIComponent(m[1]) : '';
}

function fmtDate(d) {
  if (!d) return '';
  var dt = new Date(d);
  if (isNaN(dt.getTime())) return String(d);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}

// ================= 数据加载 =================
async function loadRecord() {
  var houseNo = getQueryParam('houseNo');
  if (!houseNo) { showEmpty('缺少 houseNo 参数'); return; }

  try {
    var res = await fetch('/api/farm-review-records/' + encodeURIComponent(houseNo));
    if (!res.ok) { showEmpty('未找到房屋编号为 ' + houseNo + ' 的已提交记录'); return; }
    var rec = await res.json();
    currentRecord = (rec && rec.houseNo && (rec.status === 'submitted' || rec.status === 'rectified')) ? rec : null;

    if (!currentRecord) { showEmpty('未找到房屋编号为 ' + houseNo + ' 的已提交记录'); return; }

    // 判定是否需整改：隐患等级为 一般/严重（兼容顶层与 answers 两种存储位置）
    var hz = currentRecord.hazardLevel || (currentRecord.answers && currentRecord.answers.hazardLevel) || '';
    var needRectify = (hz === '严重' || hz === '一般');
    // 兼容旧逻辑：若已填问卷结论且明确"无需整改"类，则不进入
    var conclusion = (currentRecord.answers && currentRecord.answers.conclusion) || '';
    if (conclusion === '存在隐患，需要整改') needRectify = true;
    if (!needRectify) {
      showEmpty('该记录隐患等级为「' + (hz || '未见隐患') + '」，无需隐患整治');
      return;
    }

    // 初始化已有数据
    if (currentRecord.rectify) {
      rectifyData = JSON.parse(JSON.stringify(currentRecord.rectify));
    }

    renderAll();
  } catch (e) {
    showEmpty('加载失败：' + e.message);
  }
}

function showEmpty(msg) {
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('emptyText').textContent = msg;
}

// ================= 渲染 =================
function renderAll() {
  document.getElementById('pageTitle').textContent = currentRecord.houseNo + ' · 隐患整治';
  document.getElementById('pageSubtitle').textContent = (currentRecord.town || '') + ' / ' + (currentRecord.village || '') + ' / ' + (currentRecord.houseAddress || '');

  // 面包屑
  var detailUrl = 'farm-review-detail.html?town=' + encodeURIComponent(currentRecord.town) + '&village=' + encodeURIComponent(currentRecord.village) + '&houseNo=' + encodeURIComponent(currentRecord.houseNo);
  document.getElementById('backToDetail').href = detailUrl;
  document.getElementById('backToList').href = 'farm-review-detail.html?town=' + encodeURIComponent(currentRecord.town) + '&village=' + encodeURIComponent(currentRecord.village);

  renderInitialJudge();
  renderOptionGroups();
  renderPhotoGrids();
  fillFormInputs();
  document.getElementById('mainContent').style.display = 'block';

  // 已有整治数据 → 默认只读模式
  if (rectifyData.updateTime) {
    enterReadonlyMode();
  }
}

// 进入只读模式
function enterReadonlyMode() {
  document.getElementById('mainContent').classList.add('readonly-mode');
  document.getElementById('viewOnlyBanner').style.display = 'flex';
  document.getElementById('btnEdit').style.display = '';
  document.getElementById('btnSave').style.display = 'none';
}

// 进入编辑模式
function enterEditMode() {
  document.getElementById('mainContent').classList.remove('readonly-mode');
  document.getElementById('viewOnlyBanner').style.display = 'none';
  document.getElementById('btnEdit').style.display = 'none';
  document.getElementById('btnSave').style.display = '';
}

// 第1块：只读回显初判信息
function renderInitialJudge() {
  var a = currentRecord.answers || {};
  var html = '';
  function row(label, value) {
    var v = (value == null || value === '') ? '<span class="rb-value empty">—</span>' : '<span class="rb-value">' + escHtml(value) + '</span>';
    return '<div class="rb-row"><span class="rb-label">' + escHtml(label) + '</span>' + v + '</div>';
  }

  // 地址拆解（简单按现有 houseAddress 显示）
  var addr = currentRecord.houseAddress || currentRecord.address || '';
  html += row('房屋建筑代码', currentRecord.houseNo || '');
  html += row('房屋隐患初判', a.structuralSafety || a.conclusion || '');
  html += row('地址', addr);
  html += row('户主姓名/机构名称', currentRecord.ownerName || currentRecord.owner || '');
  html += row('身份证号/机构代码', currentRecord.ownerId || '');
  html += row('户主类型', currentRecord.ownerType || '');
  html += row('房屋损伤情况', (a.damageCondition && a.damageCondition.length ? a.damageCondition.join('、') : ''));
  html += row('使用安全隐患-增加堆载', a.overload || '');

  document.getElementById('initialJudgeBlock').innerHTML = html;

  // 损伤照片
  var photos = [];
  if (currentRecord.photos && currentRecord.photos.damage) photos = photos.concat(currentRecord.photos.damage);
  if (currentRecord.photos && currentRecord.photos.damagePhoto) photos = photos.concat(currentRecord.photos.damagePhoto);
  var grid = document.getElementById('damagePhotoGrid');
  if (photos.length === 0) {
    grid.innerHTML = '<div style="color:var(--text-secondary);font-size:12px;padding:20px;text-align:center;grid-column:1/-1;">暂无损伤照片</div>';
  } else {
    grid.innerHTML = photos.map(function(p, i) {
      var src = (typeof p === 'string') ? p : (p && p.dataUrl) || '';
      return '<div class="photo-item" onclick="openLightbox(\'' + escHtml(src) + '\')"><img src="' + escHtml(src) + '" onerror="this.parentNode.style.display=\'none\'"><span class="pi-tag">照片 ' + (i+1) + '</span></div>';
    }).join('');
  }
}

// 渲染单选/多选组
function renderOptionGroups() {
  // 单选
  ['appraisalDone','appraisalConclusion','controlDone','engineeringDone'].forEach(function(key) {
    var container = document.getElementById(key);
    container.innerHTML = OPTION_GROUPS[key].map(function(opt) {
      return '<div class="opt-pill ' + opt.cls + '" data-value="' + escHtml(opt.value) + '" onclick="selectOption(\'' + key + '\',\'' + escHtml(opt.value) + '\')">' + escHtml(opt.value) + '</div>';
    }).join('');
    // 回显
    var path = key.replace(/([A-Z])/g, function(m) { return '.' + m.toLowerCase(); }); // appraisalDone -> appraisal.done
    var parts = path.split('.');
    var val = rectifyData;
    for (var i = 0; i < parts.length; i++) { val = val && val[parts[i]]; }
    if (val) {
      container.querySelectorAll('.opt-pill').forEach(function(p) {
        if (p.getAttribute('data-value') === val) p.classList.add('active');
      });
    }
  });

  // 多选
  ['controlTypes','engineeringTypes'].forEach(function(key) {
    var container = document.getElementById(key);
    container.innerHTML = CHECKBOX_GROUPS[key].map(function(opt) {
      return '<div class="opt-pill" data-value="' + escHtml(opt) + '" onclick="toggleOption(\'' + key + '\',\'' + escHtml(opt) + '\')">' + escHtml(opt) + '</div>';
    }).join('');
    // 回显
    var path = key.replace(/([A-Z])/g, function(m) { return '.' + m.toLowerCase(); });
    var parts = path.split('.');
    var val = rectifyData;
    for (var i = 0; i < parts.length; i++) { val = val && val[parts[i]]; }
    if (Array.isArray(val)) {
      container.querySelectorAll('.opt-pill').forEach(function(p) {
        if (val.indexOf(p.getAttribute('data-value')) >= 0) p.classList.add('active');
      });
    }
  });
}

function selectOption(key, value) {
  var container = document.getElementById(key);
  container.querySelectorAll('.opt-pill').forEach(function(p) { p.classList.remove('active'); });
  container.querySelector('.opt-pill[data-value="' + value + '"]').classList.add('active');

  // 写入数据
  if (key === 'appraisalDone') rectifyData.appraisal.done = value;
  else if (key === 'appraisalConclusion') rectifyData.appraisal.conclusion = value;
  else if (key === 'controlDone') {
    rectifyData.measures.controlDone = value;
    document.getElementById('controlOtherRow').style.display = (value === '是' && rectifyData.measures.controlTypes.indexOf('其他') >= 0) ? 'grid' : 'none';
  }
  else if (key === 'engineeringDone') {
    rectifyData.measures.engineeringDone = value;
    document.getElementById('engineeringOtherRow').style.display = (value === '是' && rectifyData.measures.engineeringTypes.indexOf('其他') >= 0) ? 'grid' : 'none';
  }
}

function toggleOption(key, value) {
  var arr = (key === 'controlTypes') ? rectifyData.measures.controlTypes : rectifyData.measures.engineeringTypes;
  var idx = arr.indexOf(value);
  if (idx >= 0) arr.splice(idx, 1); else arr.push(value);

  var container = document.getElementById(key);
  container.querySelector('.opt-pill[data-value="' + value + '"]').classList.toggle('active');

  // 其他选项显隐
  if (key === 'controlTypes') {
    document.getElementById('controlOtherRow').style.display = (rectifyData.measures.controlDone === '是' && arr.indexOf('其他') >= 0) ? 'grid' : 'none';
  } else {
    document.getElementById('engineeringOtherRow').style.display = (rectifyData.measures.engineeringDone === '是' && arr.indexOf('其他') >= 0) ? 'grid' : 'none';
  }
}

// 照片网格渲染
function renderPhotoGrids() {
  renderPhotoGrid('controlPhotoGrid', rectifyData.measures.controlPhotos, 'control');
  renderPhotoGrid('engineeringPhotoGrid', rectifyData.measures.engineeringPhotos, 'engineering');
}

function renderPhotoGrid(gridId, photos, type) {
  var grid = document.getElementById(gridId);
  if (photos.length === 0) {
    grid.innerHTML = '<div style="color:var(--text-secondary);font-size:12px;padding:20px;text-align:center;grid-column:1/-1;">暂无照片</div>';
    return;
  }
  grid.innerHTML = photos.map(function(p, i) {
    return '<div class="photo-item editable" onclick="openLightbox(\'' + escHtml(p) + '\')">' +
      '<img src="' + escHtml(p) + '">' +
      '<button class="pi-del" onclick="event.stopPropagation();removePhoto(\'' + type + '\',' + i + ')" title="删除"><i class="fas fa-xmark"></i></button>' +
      '<span class="pi-tag">照片 ' + (i+1) + '</span></div>';
  }).join('');
}

function removePhoto(type, index) {
  if (type === 'control') rectifyData.measures.controlPhotos.splice(index, 1);
  else rectifyData.measures.engineeringPhotos.splice(index, 1);
  renderPhotoGrids();
}

// 照片上传（压缩）
function handlePhotoUpload(input, type) {
  var files = Array.prototype.slice.call(input.files || []);
  if (files.length === 0) return;

  var target = (type === 'control') ? rectifyData.measures.controlPhotos : rectifyData.measures.engineeringPhotos;

  files.forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      compressImage(e.target.result, function(compressed) {
        target.push(compressed);
        renderPhotoGrids();
      });
    };
    reader.readAsDataURL(file);
  });

  input.value = ''; // 清空，允许重复选择同一文件
}

function compressImage(dataUrl, callback) {
  var img = new Image();
  img.onload = function() {
    var canvas = document.createElement('canvas');
    var maxSize = 1200;
    var w = img.width, h = img.height;
    if (w > h && w > maxSize) { h = h * maxSize / w; w = maxSize; }
    else if (h > maxSize) { w = w * maxSize / h; h = maxSize; }
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    callback(canvas.toDataURL('image/jpeg', 0.7));
  };
  img.src = dataUrl;
}

// 保存
async function saveRectify() {
  collectFormInputs();
  rectifyData.updateTime = new Date().toISOString();

  // 写回记录
  currentRecord.rectify = rectifyData;
  currentRecord.editedByPC = true;
  currentRecord.editedTime = new Date().toISOString();
  // 整改完成后状态流转：标记为已整改
  currentRecord.status = 'rectified';
  currentRecord.rectifyTime = new Date().toISOString();

  try {
    // 单条 upsert：只提交本条记录，避免全量覆盖抹掉他人并发新增
    var postRes = await fetch('/api/farm-review-records/' + encodeURIComponent(currentRecord.houseNo), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(currentRecord)
    });
    if (postRes.ok) {
      // 同步整治信息到农房档案（鉴定/整治记录，按 srcKey 去重）
      try {
        if (typeof syncRectifyRecordToHouse === 'function') {
          syncRectifyRecordToHouse(currentRecord, '农房回头看');
        }
      } catch (e) { console.warn('[rectify] 档案同步失败', e); }
      document.getElementById('statusHint').textContent = '保存成功';
      setTimeout(function() { enterReadonlyMode(); }, 800);
    } else {
      document.getElementById('statusHint').textContent = '保存失败';
    }
  } catch (e) {
    document.getElementById('statusHint').textContent = '保存失败：' + e.message;
  }
}

function cancelRectify() {
  var url = 'farm-review-detail.html?town=' + encodeURIComponent(currentRecord.town) + '&village=' + encodeURIComponent(currentRecord.village) + '&houseNo=' + encodeURIComponent(currentRecord.houseNo);
  window.location.href = url;
}

// lightbox
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('show');
}

// ================= 启动 =================
loadRecord();
