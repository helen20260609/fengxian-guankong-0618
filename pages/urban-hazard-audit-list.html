<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城镇自建房 - 专项风险隐患审核</title>
<link rel="stylesheet" href="./all.min.css">
<style>
:root {
    --primary: #1a73e8; --primary-dark: #1557b0; --primary-light: #e8f0fe;
    --secondary: #0097a7; --danger: #d93025; --warning: #e65100; --success: #1e8e3e;
    --bg-dark: #f0f2f5; --bg-card: #ffffff; --bg-hover: #e8eaed;
    --text-primary: #202124; --text-secondary: #5f6368; --border: #dadce0;
    --shadow: rgba(0,0,0,0.08); --input-bg: #ffffff; --input-border: #dadce0;
}
:root[data-theme="dark"] {
    --primary: #1e6fdb; --primary-dark: #1557b0; --primary-light: #e8f1fd;
    --secondary: #00b4d8; --danger: #ef4444; --warning: #f59e0b; --success: #10b981;
    --bg-dark: #0a1628; --bg-card: #112240; --bg-hover: #1a2f4a;
    --text-primary: #e2e8f0; --text-secondary: #94a3b8; --border: #1e3a5f;
    --shadow: rgba(0,0,0,0.3); --input-bg: rgba(255,255,255,0.05); --input-border: #1e3a5f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif; background: var(--bg-dark); color: var(--text-primary); font-size: 14px; min-height: 100vh; }

.page-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; background: var(--bg-card); padding: 18px 28px; border-bottom: 1px solid var(--border); }
.page-head h2 { font-size: 19px; display: flex; align-items: center; gap: 10px; }
.page-head h2 .fa-solid { color: var(--primary); }
.page-head .desc { margin-top: 6px; color: var(--text-secondary); font-size: 13px; }
.container { padding: 20px 28px; }

/* KPI */
.kpi-wrapper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.kpi-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--kc, var(--primary)); }
.kpi-label { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.kpi-label i { color: var(--kc, var(--primary)); }
.kpi-value { font-size: 28px; font-weight: 700; margin-top: 8px; color: var(--kc, var(--text-primary)); }
.kpi-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* Tabs */
.status-tabs { display: flex; gap: 4px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 8px; margin-bottom: 16px; overflow-x: auto; }
.tab-item { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--text-secondary); cursor: pointer; white-space: nowrap; transition: all 0.2s; border: none; background: transparent; }
.tab-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.tab-item.active { background: var(--primary); color: #fff; }
.tab-count { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 11px; font-weight: 600; background: rgba(0,0,0,0.06); }
.tab-item.active .tab-count { background: rgba(255,255,255,0.2); }

/* Filter */
.filter-bar { display: flex; align-items: flex-end; gap: 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-item { display: flex; flex-direction: column; gap: 6px; }
.filter-item label { font-size: 12px; color: var(--text-secondary); }
.filter-select, .filter-input { height: 34px; padding: 0 10px; border: 1px solid var(--input-border); border-radius: 6px; background: var(--input-bg); color: var(--text-primary); font-size: 13px; outline: none; }
.filter-select:focus, .filter-input:focus { border-color: var(--primary); }
.btn { height: 34px; padding: 0 16px; border-radius: 6px; border: none; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-default { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
.btn-default:hover { background: var(--bg-hover); }

/* Table */
.table-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.table-wrapper { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { background: var(--bg-hover); padding: 12px 14px; text-align: left; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
.data-table td { padding: 12px 14px; border-top: 1px solid var(--border); vertical-align: middle; }
.data-table tbody tr:hover { background: var(--bg-hover); }
.task-name { font-weight: 600; color: var(--primary); cursor: pointer; }
.task-name:hover { text-decoration: underline; }

.status-tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.status-tag.pending-audit { background: rgba(230,81,0,0.12); color: var(--warning); }
.status-tag.completed { background: rgba(30,142,62,0.12); color: var(--success); }
.status-tag.rejected { background: rgba(217,48,37,0.12); color: var(--danger); }

.risk-dist { display: inline-flex; gap: 6px; align-items: center; }
.risk-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.risk-pill.red { background: rgba(217,48,37,0.12); color: var(--danger); }
.risk-pill.yellow { background: rgba(230,81,0,0.12); color: var(--warning); }
.risk-pill.blue { background: rgba(26,115,232,0.12); color: var(--primary); }

.action-link { background: none; border: none; color: var(--primary); font-size: 13px; cursor: pointer; padding: 2px 6px; white-space: nowrap; }
.action-link:hover { text-decoration: underline; }
.action-link.audit { color: var(--warning); font-weight: 600; }

.pagination-bar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); }
.page-info { font-size: 12px; color: var(--text-secondary); margin-right: auto; }
.page-btn { min-width: 30px; height: 30px; border: 1px solid var(--border); background: var(--bg-card); border-radius: 6px; cursor: pointer; color: var(--text-primary); font-size: 13px; }
.page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.empty-tip { text-align: center; padding: 48px 0; color: var(--text-secondary); font-size: 13px; }
.empty-tip i { font-size: 32px; display: block; margin-bottom: 10px; opacity: 0.4; }
</style>
<link rel="stylesheet" href="ui-modal.css">
</head>
<body>

<div class="page-head">
    <div>
        <h2><i class="fa-solid fa-clipboard-check"></i>自建房专项风险隐患审核</h2>
        <div class="desc">对巡查任务上报的排查结果进行审核：审核通过的任务进入分发处置环节，退回的任务返回巡查整改</div>
    </div>
</div>
<div class="container">

<!-- KPI -->
<div class="kpi-wrapper">
    <div class="kpi-card" style="--kc:var(--warning);">
        <div class="kpi-label"><i class="fa-solid fa-hourglass-half"></i>待审核任务</div>
        <div class="kpi-value" id="kpi-pending">0</div>
        <div class="kpi-sub">等待审核确认</div>
    </div>
    <div class="kpi-card" style="--kc:var(--success);">
        <div class="kpi-label"><i class="fa-solid fa-circle-check"></i>审核通过</div>
        <div class="kpi-value" id="kpi-passed">0</div>
        <div class="kpi-sub">已进入分发处置</div>
    </div>
    <div class="kpi-card" style="--kc:var(--danger);">
        <div class="kpi-label"><i class="fa-solid fa-rotate-left"></i>已退回</div>
        <div class="kpi-value" id="kpi-rejected">0</div>
        <div class="kpi-sub">退回巡查整改</div>
    </div>
    <div class="kpi-card" style="--kc:var(--primary);">
        <div class="kpi-label"><i class="fa-solid fa-house-chimney"></i>待审核涉及房屋</div>
        <div class="kpi-value" id="kpi-houses">0</div>
        <div class="kpi-sub">待审核任务覆盖房屋总数</div>
    </div>
</div>

<!-- Tabs -->
<div class="status-tabs" id="status-tabs">
    <button class="tab-item active" data-tab="pending-audit">待审核 <span class="tab-count" id="cnt-pending">0</span></button>
    <button class="tab-item" data-tab="completed">已通过 <span class="tab-count" id="cnt-passed">0</span></button>
    <button class="tab-item" data-tab="rejected">已退回 <span class="tab-count" id="cnt-rejected">0</span></button>
    <button class="tab-item" data-tab="all">全部 <span class="tab-count" id="cnt-all">0</span></button>
</div>

<!-- Filter -->
<div class="filter-bar">
    <div class="filter-item">
        <label>镇/街道</label>
        <select class="filter-select" id="filter-town"><option value="">全部</option></select>
    </div>
    <div class="filter-item">
        <label>任务类型</label>
        <select class="filter-select" id="filter-type">
            <option value="">全部</option>
            <option value="routine">日常巡查</option>
            <option value="special">专项巡查</option>
            <option value="temporary">临时任务</option>
            <option value="review">复查任务</option>
        </select>
    </div>
    <div class="filter-item" style="flex:1;min-width:200px;">
        <label>任务名称</label>
        <input type="text" class="filter-input" id="filter-keyword" placeholder="输入任务名称/编号关键字">
    </div>
    <button class="btn btn-primary" id="btn-search"><i class="fa-solid fa-search"></i> 查询</button>
    <button class="btn btn-default" id="btn-reset"><i class="fa-solid fa-undo"></i> 重置</button>
</div>

<!-- Table -->
<div class="table-card">
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>任务名称</th>
                    <th>镇/街道/社区</th>
                    <th>房屋数量</th>
                    <th>隐患分布</th>
                    <th>巡查人</th>
                    <th>上报时间</th>
                    <th>截止时间</th>
                    <th>任务状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="task-table-body"></tbody>
        </table>
    </div>
    <div class="pagination-bar">
        <span class="page-info" id="page-info">共 0 条，每页 10 条</span>
        <button class="page-btn" id="page-prev"><i class="fa-solid fa-chevron-left"></i></button>
        <span id="page-numbers"></span>
        <button class="page-btn" id="page-next"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
</div>
    </div>

    <script src="../js/urban-house-arch-data.js"></script>
    <script src="urban-audit-seed.js"></script>
<script>
(function() {
    const PAGE_SIZE = 10;
    let allTasks = [];
    let filtered = [];
    let currentTab = 'pending-audit';
    let currentPage = 1;

    // ===== 数据加载：仅任务来源（带提交审核时间或审核结果）进入本列表 =====
    function loadTasks() {
        let tasks = [];
        try { tasks = JSON.parse(localStorage.getItem('urbanPatrolTasks') || '[]'); } catch (e) { tasks = []; }
        if (!Array.isArray(tasks)) tasks = [];
        return tasks.filter(t => t.status === 'pending-audit' || (t.auditResult && t.auditResult.result));
    }

    // 房屋清单：优先 selectedProjects，其次按 houseNos 从档案补
    function taskHouses(t) {
        if (Array.isArray(t.selectedProjects) && t.selectedProjects.length) return t.selectedProjects;
        if (Array.isArray(t.houseNos) && t.houseNos.length && typeof getHouseRecord === 'function') {
            return t.houseNos.map(no => {
                const rec = getHouseRecord(no) || {};
                return { houseNo: no, name: rec.name || no, address: rec.address || '', owner: rec.owner || '',
                    structure: rec.category || rec.structure || '', year: rec.year || '', checkItems: [],
                    status: 'inspected', village: rec.community || '' };
            });
        }
        const count = t.total || t.houseCount || 0;
        return new Array(count).fill(null).map((_, i) => ({ houseNo: '-', name: '房屋' + (i + 1), checkItems: [], status: 'inspected' }));
    }

    // 隐患分布：按各房检查项统计红/黄（蓝不产生隐患）
    function hazardDist(t) {
        let red = 0, yellow = 0;
        taskHouses(t).forEach(h => (h.checkItems || []).forEach(it => {
            if (it.level === 'red') red++;
            else if (it.level === 'yellow') yellow++;
        }));
        return { red, yellow };
    }

    function tabOf(t) {
        if (t.status === 'pending-audit') return 'pending-audit';
        if (t.auditResult && t.auditResult.result === '通过') return 'completed';
        if (t.auditResult && t.auditResult.result === '驳回') return 'rejected';
        return 'all';
    }

    function renderKPI() {
        const pending = allTasks.filter(t => tabOf(t) === 'pending-audit');
        document.getElementById('kpi-pending').textContent = pending.length;
        document.getElementById('kpi-passed').textContent = allTasks.filter(t => tabOf(t) === 'completed').length;
        document.getElementById('kpi-rejected').textContent = allTasks.filter(t => tabOf(t) === 'rejected').length;
        document.getElementById('kpi-houses').textContent = pending.reduce((s, t) => s + taskHouses(t).length, 0);
        document.getElementById('cnt-pending').textContent = pending.length;
        document.getElementById('cnt-passed').textContent = allTasks.filter(t => tabOf(t) === 'completed').length;
        document.getElementById('cnt-rejected').textContent = allTasks.filter(t => tabOf(t) === 'rejected').length;
        document.getElementById('cnt-all').textContent = allTasks.length;
    }

    function applyFilter(keepPage) {
        const town = document.getElementById('filter-town').value;
        const type = document.getElementById('filter-type').value;
        const kw = document.getElementById('filter-keyword').value.trim();
        filtered = allTasks.filter(t => {
            if (currentTab !== 'all' && tabOf(t) !== currentTab) return false;
            if (town && t.town !== town) return false;
            if (type && t.type !== type) return false;
            if (kw && !((t.name || '').includes(kw) || (t.no || '').includes(kw))) return false;
            return true;
        });
        // 待审核按上报时间倒序，其余按审核时间倒序
        filtered.sort((a, b) => {
            const ta = a.status === 'pending-audit' ? (a.submitAuditTime || a.finishTime || '') : ((a.auditResult && a.auditResult.time) || '');
            const tb = b.status === 'pending-audit' ? (b.submitAuditTime || b.finishTime || '') : ((b.auditResult && b.auditResult.time) || '');
            return tb.localeCompare(ta);
        });
        if (!keepPage) currentPage = 1;
        renderTable();
    }

    function statusTag(t) {
        const tab = tabOf(t);
        if (tab === 'pending-audit') return '<span class="status-tag pending-audit">待审核</span>';
        if (tab === 'completed') return '<span class="status-tag completed">审核通过</span>';
        return '<span class="status-tag rejected">已退回</span>';
    }

    function renderTable() {
        const tbody = document.getElementById('task-table-body');
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageData = filtered.slice(start, start + PAGE_SIZE);
        if (!pageData.length) {
            tbody.innerHTML = '<tr><td colspan="9"><div class="empty-tip"><i class="fa-solid fa-inbox"></i>暂无数据</div></td></tr>';
        } else {
            tbody.innerHTML = pageData.map(t => {
                const houses = taskHouses(t);
                const dist = hazardDist(t);
                const isPending = tabOf(t) === 'pending-audit';
                const action = isPending
                    ? `<button class="action-link audit" onclick="goAudit(${t.id})"><i class="fa-solid fa-clipboard-check"></i> 审核</button>`
                    : `<button class="action-link" onclick="goAudit(${t.id})">查看</button>`;
                return `<tr>
                    <td><span class="task-name" onclick="goAudit(${t.id})">${t.name || '-'}</span><div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">${t.no || ''}</div></td>
                    <td>${t.town || '-'}${t.village ? ' / ' + t.village : ''}</td>
                    <td>${houses.length} 栋</td>
                    <td><span class="risk-dist">
                        <span class="risk-pill red">严重 ${dist.red}</span>
                        <span class="risk-pill yellow">一定 ${dist.yellow}</span>
                    </span></td>
                    <td>${t.person || '-'}</td>
                    <td>${t.submitAuditTime || t.finishTime || '-'}</td>
                    <td>${t.endDate || '-'}</td>
                    <td>${statusTag(t)}</td>
                    <td>${action}</td>
                </tr>`;
            }).join('');
        }
        renderPagination();
    }

    function renderPagination() {
        const total = filtered.length;
        const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        document.getElementById('page-info').textContent = `共 ${total} 条，每页 ${PAGE_SIZE} 条`;
        document.getElementById('page-prev').disabled = currentPage <= 1;
        document.getElementById('page-next').disabled = currentPage >= pages;
        let html = '';
        for (let i = 1; i <= pages; i++) {
            html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
        }
        const nums = document.getElementById('page-numbers');
        nums.innerHTML = html;
        nums.querySelectorAll('.page-btn').forEach(b => b.addEventListener('click', () => { currentPage = Number(b.dataset.page); renderTable(); }));
    }

    window.goAudit = function(id) {
        window.location.href = 'urban-hazard-audit-detail.html?id=' + id;
    };

    function initTownOptions() {
        const towns = [...new Set(allTasks.map(t => t.town).filter(Boolean))];
        const sel = document.getElementById('filter-town');
        towns.forEach(tw => { const o = document.createElement('option'); o.value = tw; o.textContent = tw; sel.appendChild(o); });
    }

    // 事件
    document.getElementById('status-tabs').addEventListener('click', e => {
        const btn = e.target.closest('.tab-item');
        if (!btn) return;
        document.querySelectorAll('#status-tabs .tab-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        applyFilter();
    });
    document.getElementById('btn-search').addEventListener('click', () => applyFilter());
    document.getElementById('btn-reset').addEventListener('click', () => {
        document.getElementById('filter-town').value = '';
        document.getElementById('filter-type').value = '';
        document.getElementById('filter-keyword').value = '';
        applyFilter();
    });
    document.getElementById('filter-keyword').addEventListener('keydown', e => { if (e.key === 'Enter') applyFilter(); });
    document.getElementById('page-prev').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderTable(); } });
    document.getElementById('page-next').addEventListener('click', () => { currentPage++; renderTable(); });

    // 主题同步
    window.addEventListener('message', e => {
        if (e.data && e.data.action === 'setTheme') document.documentElement.setAttribute('data-theme', e.data.theme);
    });

    // Init：播种演示审核任务（幂等），再加载
    if (typeof ensureAuditSeedTasks === 'function') ensureAuditSeedTasks();
    allTasks = loadTasks();
    renderKPI();
    initTownOptions();
    applyFilter();
})();
</script>
<script src="ui-modal.js"></script>
</body>
</html>
