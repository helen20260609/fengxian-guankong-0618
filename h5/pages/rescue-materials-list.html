<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>抢险物资</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.page-hero { position: relative; z-index: 99; display: flex; flex-direction: column; align-items: center; padding: calc(34px + 16px) 18px 42px; }

.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; }
.content-sheet.page-body-sheet { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 0 16px 16px; background: #f5f6fa; margin-top: 0; border-radius: 0; }
.content-sheet.page-body-sheet::-webkit-scrollbar { display: none; }

.search-bar { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.search-input-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 2px 8px var(--shadow);
    border: 1px solid var(--border);
    min-height: 40px;
    position: relative;
}
.search-input-wrapper .search-icon { color: var(--text2); margin-left: 12px; font-size: 14px; }
.search-input-wrapper input {
    flex: 1;
    background: transparent;
    border: none;
    height: 40px;
    padding: 0 28px 0 10px;
    font-size: 14px;
    color: var(--text-primary);
}
.search-input-wrapper input:focus { outline: none; }
.search-input-wrapper .clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--text2);
    color: #fff;
    font-size: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    padding: 0;
}
.filter-trigger {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 40px;
    padding: 0 14px;
    background: var(--card);
    color: var(--text2);
    font-size: 13px;
    font-weight: 400;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 2px 8px var(--shadow);
    cursor: pointer;
    position: relative;
    transition: all .15s;
}
.filter-trigger.active { color: var(--primary); border-color: var(--primary); background: rgba(var(--primary-rgb),.08); }
.filter-trigger:active { transform: scale(.96); }
.filter-trigger .badge-dot { position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); border: 1.5px solid var(--card); display: none; }
.filter-trigger .badge-num { position: absolute; top: -6px; right: -6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--card); box-sizing: border-box; }

.major-tabs { display: flex; flex-wrap: nowrap; gap: 8px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.major-tabs::-webkit-scrollbar { display: none; }
.major-tab {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-primary);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
}
.major-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.selected-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tag { background: rgba(var(--primary-rgb),.08); color: var(--primary); border: 1px solid rgba(var(--primary-rgb),.18); border-radius: 999px; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.tag i { cursor: pointer; font-size: 10px; }

.list-header { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 12px; }
.list-title { font-size: 15px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
.list-title i { color: var(--primary); }
.list-count { font-size: 13px; color: var(--text2); }

.material-card {
    cursor: pointer;
    transition: transform .12s;
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 2px 10px var(--shadow);
    border: 1px solid var(--border);
    padding: 14px;
    margin-bottom: 12px;
    overflow: hidden;
}
.material-card:active { transform: scale(.99); }
.mc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.mc-name { font-size: 16px; font-weight: 700; color: var(--text-primary); line-height: 1.35; flex: 1; word-break: break-word; }
.mc-major-tag { flex-shrink: 0; padding: 4px 9px; border-radius: 6px; font-size: 11px; font-weight: 600; }
.mc-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 13px; color: var(--text2); flex-wrap: nowrap; overflow: hidden; }
.mc-meta span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mc-meta i { color: var(--text2); margin-right: 4px; flex-shrink: 0; }
.mc-meta .total { color: var(--primary); font-weight: 700; }
.mc-meta .total i { color: var(--primary); }
.mc-meta .sep { width: 1px; height: 12px; background: var(--border); flex-shrink: 0; }
.mc-location { font-size: 13px; color: var(--text2); line-height: 1.4; margin-bottom: 12px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.mc-location i { color: var(--text2); margin-right: 6px; }
.mc-contact-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mc-contact { font-size: 13px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.mc-contact i { color: var(--text2); margin-right: 6px; }
.mc-contact .name { color: var(--text-primary); font-weight: 700; }
.call-btn {
    flex-shrink: 0;
    background: rgba(var(--success-rgb),.1);
    color: var(--success);
    border: 1px solid rgba(var(--success-rgb),.25);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    cursor: pointer;
}
.call-btn i { font-size: 12px; }
.call-btn.hidden { display: none; }

.empty-state { text-align: center; padding: 40px 16px; color: var(--text2); }
.empty-state i { font-size: 40px; margin-bottom: 10px; display: block; }
.empty-state .empty-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
.empty-state .empty-desc { font-size: 13px; }

.loading { text-align: center; padding: 16px; color: var(--text2); font-size: 13px; }
.loading i { margin-right: 6px; }
.bottom-spacer { height: 20px; }

.filter-section { margin-bottom: 18px; }
.filter-section .filter-title { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
.filter-section .filter-options { display: flex; flex-wrap: wrap; gap: 10px; }
.filter-chip { padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-primary); cursor: pointer; transition: all .15s; }
.filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.sub-group-title { font-size: 12px; color: var(--text2); margin: 8px 0 6px; font-weight: 600; }

.filter-input-field {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--input-border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: var(--input-bg);
    color: var(--text-primary);
    font-family: inherit;
}
.filter-input-field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(var(--primary-rgb),.1); }

.date-range-row { display: flex; align-items: center; gap: 10px; }
.date-range-row .filter-input-field { flex: 1; }
.date-range-row span { color: var(--text2); font-size: 13px; flex-shrink: 0; }

.sheet-footer { display: flex; gap: 12px; padding-top: 16px; border-top: 1px solid var(--border); }
.sheet-footer .btn { flex: 1; height: 44px; border-radius: 10px; }

.modal-sheet { display: block !important; opacity: 0; pointer-events: none; transform: translateY(100%); transition: transform .25s ease, opacity .25s ease; z-index: 1001; }
.modal-sheet.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.modal-mask { display: none; opacity: 0; transition: opacity .25s ease; z-index: 1000; }
.modal-mask.show { display: block; opacity: 1; }

:root[data-theme="dark"] .tag { background: rgba(var(--primary-rgb),.15); border-color: rgba(var(--primary-rgb),.3); }
:root[data-theme="dark"] .search-input-wrapper input { background: transparent; }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title">抢险物资</div>
        </div>

        <div class="content-sheet page-body-sheet">
            <div class="major-tabs" id="majorTabs"></div>

            <div class="search-bar">
                <div class="search-input-wrapper">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="搜索物资名称/小类/储备地点/联系人" autocomplete="off">
                    <button class="clear-btn" id="clearSearch" onclick="clearSearch(event)"><i class="fa-solid fa-times"></i></button>
                </div>
                <div class="filter-trigger" id="filterTrigger" onclick="openDrawer()">
                    <i class="fa-solid fa-filter"></i> 筛选
                    <span class="badge-dot" id="filterDot"></span>
                    <span class="badge-num" id="filterBadge" style="display:none">0</span>
                </div>
            </div>

            <div class="selected-tags" id="selectedTags"></div>

            <div class="list-header">
                <div class="list-title"><i class="fa-solid fa-box-open"></i>物资清单</div>
                <div class="list-count" id="totalCount">共 0 项</div>
            </div>
            <div id="cardList"></div>
            <div class="loading" id="loading" style="display:none"><i class="fa-solid fa-circle-notch fa-spin"></i> 加载中…</div>
            <div class="empty-state" id="empty" style="display:none">
                <i class="fa-regular fa-folder-open"></i>
                <div class="empty-title">暂无符合条件的数据</div>
                <div class="empty-desc">请调整筛选或搜索条件</div>
            </div>
            <div class="bottom-spacer"></div>
        </div>

        <!-- 筛选抽屉 -->
        <div class="modal-mask" id="drawerOverlay" onclick="closeDrawer()"></div>
        <div class="modal-sheet" id="drawer">
            <div class="sheet-header">
                <div class="sheet-title">筛选条件</div>
                <div class="sheet-close" onclick="closeDrawer()"><i class="fa-solid fa-times"></i></div>
            </div>
            <div id="drawerBody"></div>
            <div class="sheet-footer">
                <button class="btn btn-outline" onclick="resetFilters()">重置</button>
                <button class="btn btn-primary" onclick="confirmFilters()">确定</button>
            </div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../../data/rescue-materials-data.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    var majorOptions = [
        { key: 'all', label: '全部' },
        { key: '抢险物资', label: '抢险物资' },
        { key: '救生器材', label: '救生器材' },
        { key: '抢险器具', label: '抢险器具' },
        { key: '大型抢险\n器械', label: '大型抢险器械' }
    ];
    var subCategoryMap = {
        '抢险物资': ['编制物料', '线绳', '阻水', '木料', '石料', '钢材'],
        '救生器材': ['救生衣圈', '救生船'],
        '抢险器具': ['灯具照明', '雨具', '配电器具', '通讯器具', '抽水设备', '五金工具', '登高工具'],
        '大型抢险\n器械': ['运输车辆', '机械设备']
    };
    var majorColorMap = {
        '抢险物资': 'blue',
        '救生器材': 'red',
        '抢险器具': 'orange',
        '大型抢险\n器械': 'purple'
    };
    var majorClassMap = {
        'blue': { color: '#1a73e8', bg: 'rgba(26,115,232,.08)', border: 'rgba(26,115,232,.2)' },
        'red': { color: '#d93025', bg: 'rgba(217,48,37,.08)', border: 'rgba(217,48,37,.2)' },
        'orange': { color: '#e65100', bg: 'rgba(230,81,0,.08)', border: 'rgba(230,81,0,.2)' },
        'purple': { color: '#7b2ff7', bg: 'rgba(123,47,247,.08)', border: 'rgba(123,47,247,.2)' }
    };

    function normalizeMajor(raw) {
        var v = String(raw || '').replace(/\n/g, '').trim();
        if (v === '抢险物资') return '抢险物资';
        if (v === '救生器材') return '救生器材';
        if (v === '抢险器具') return '抢险器具';
        if (v === '大型抢险器械') return '大型抢险\n器械';
        return v;
    }

    function getInitialData() {
        var data = (typeof rescueMaterialsData !== 'undefined' && Array.isArray(rescueMaterialsData)) ? rescueMaterialsData : [];
        data = data.map(function(item, idx) {
            var clone = Object.assign({}, item);
            clone.id = item.no ? ('rm_' + item.no + '_' + idx) : ('rm_' + idx);
            clone._major = normalizeMajor(item.majorCategory);
            return clone;
        });
        try { localStorage.setItem('rescueMaterialsData', JSON.stringify(data)); } catch (e) {}
        return data;
    }

    var allData = getInitialData();
    var selectedMajor = 'all';
    var selectedFilters = {};

    function getReportUnitOptions() {
        var map = {};
        allData.forEach(function(item) { if (item.reportUnit) map[item.reportUnit] = true; });
        return Object.keys(map).sort();
    }

    function getFilteredData() {
        var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        return allData.filter(function(item) {
            if (selectedMajor !== 'all' && item._major !== selectedMajor) return false;
            if (selectedFilters.subCategory && selectedFilters.subCategory !== 'all' && item.subCategory !== selectedFilters.subCategory) return false;
            if (selectedFilters.reportUnit && selectedFilters.reportUnit !== 'all' && item.reportUnit !== selectedFilters.reportUnit) return false;
            if (keyword) {
                var hay = (
                    (item.name || '') + ' ' +
                    (item.majorCategory || '') + ' ' +
                    (item.subCategory || '') + ' ' +
                    (item.location || '') + ' ' +
                    (item.contact || '') + ' ' +
                    (item.reportUnit || '') + ' ' +
                    (item.reporter || '') + ' ' +
                    (item.reportDate || '')
                ).toLowerCase();
                if (hay.indexOf(keyword) === -1) return false;
            }
            if (selectedFilters.reportDateStart && item.reportDate && item.reportDate < selectedFilters.reportDateStart) return false;
            if (selectedFilters.reportDateEnd && item.reportDate && item.reportDate > selectedFilters.reportDateEnd) return false;
            return true;
        });
    }

    function getMajorStyle(major) {
        var color = majorColorMap[major] || 'blue';
        return majorClassMap[color];
    }

    function renderMajorTabs() {
        var container = document.getElementById('majorTabs');
        container.innerHTML = majorOptions.map(function(opt) {
            var active = selectedMajor === opt.key ? ' active' : '';
            return '<div class="major-tab ' + active + '" onclick="selectMajor(\'' + opt.key + '\')">' + App.escapeHtml(opt.label) + '</div>';
        }).join('');
    }

    window.selectMajor = function(key) {
        selectedMajor = key;
        selectedFilters.subCategory = 'all';
        renderMajorTabs();
        refresh();
    };

    function renderTags() {
        var container = document.getElementById('selectedTags');
        var tags = [];
        if (selectedFilters.subCategory && selectedFilters.subCategory !== 'all') tags.push({ key: 'subCategory', label: '小类：' + selectedFilters.subCategory });
        if (selectedFilters.reportUnit && selectedFilters.reportUnit !== 'all') tags.push({ key: 'reportUnit', label: '填报单位：' + selectedFilters.reportUnit });
        if (selectedFilters.reportDateStart) tags.push({ key: 'reportDateStart', label: '填报日期起：' + selectedFilters.reportDateStart });
        if (selectedFilters.reportDateEnd) tags.push({ key: 'reportDateEnd', label: '填报日期止：' + selectedFilters.reportDateEnd });
        container.innerHTML = tags.map(function(t) {
            return '<div class="tag">' + App.escapeHtml(t.label) + '<i class="fa-solid fa-times" onclick="removeFilter(\'' + t.key + '\')"></i></div>';
        }).join('');
    }

    window.removeFilter = function(key) {
        delete selectedFilters[key];
        renderTags();
        renderFilterDot();
        refresh();
    };

    function renderFilterDot() {
        var activeCount = 0;
        if (selectedFilters.subCategory && selectedFilters.subCategory !== 'all') activeCount++;
        if (selectedFilters.reportUnit && selectedFilters.reportUnit !== 'all') activeCount++;
        if (selectedFilters.reportDateStart) activeCount++;
        if (selectedFilters.reportDateEnd) activeCount++;
        var badge = document.getElementById('filterBadge');
        var trigger = document.getElementById('filterTrigger');
        if (activeCount > 0) {
            badge.textContent = activeCount;
            badge.style.display = 'inline-flex';
            trigger.classList.add('active');
        } else {
            badge.style.display = 'none';
            trigger.classList.remove('active');
        }
    }

    function splitContacts(contact) {
        if (!contact) return [];
        return contact.split(/[、,，]/).map(function(s) { return s.trim(); }).filter(function(s) { return s; });
    }

    function renderCard(item) {
        var style = getMajorStyle(item._major);
        var contacts = splitContacts(item.contact);
        var hasPhone = item.phone && String(item.phone).trim();
        var contactText = contacts.length > 0
            ? (contacts[0] + (contacts.length > 1 ? ' 等 ' + contacts.length + ' 人' : ''))
            : '—';
        var callBtn = hasPhone
            ? '<a class="call-btn tap" onclick="event.stopPropagation();window.location.href=\'tel:' + App.escapeHtml(item.phone) + '\'"><i class="fa-solid fa-phone"></i> 拨打</a>'
            : '';
        var quantityVal = item.quantity && String(item.quantity).trim() ? item.quantity : '—';
        return '<div class="material-card tap" onclick="App.go(\'rescue-materials-detail.html?id=' + encodeURIComponent(item.id) + '\')">' +
            '<div class="mc-top">' +
                '<div class="mc-name">' + App.escapeHtml(item.name || '—') + '</div>' +
                '<div class="mc-major-tag" style="border:1px solid ' + style.border + ';color:' + style.color + ';background:' + style.bg + '">' + App.escapeHtml(item.majorCategory || '—').replace(/\n/g, '') + '</div>' +
            '</div>' +
            '<div class="mc-meta">' +
                '<span><i class="fa-solid fa-box"></i>小类：' + App.escapeHtml(item.subCategory || '—') + '</span>' +
                '<span class="sep"></span>' +
                '<span class="total"><i class="fa-solid fa-calculator"></i>储备总量：' + App.escapeHtml(quantityVal) + ' ' + App.escapeHtml(item.unit || '') + '</span>' +
            '</div>' +
            '<div class="mc-location"><i class="fa-solid fa-location-dot"></i>' + App.escapeHtml(item.location || '—') + '</div>' +
            '<div class="mc-contact-row">' +
                '<div class="mc-contact"><i class="fa-solid fa-user"></i>联系人：<span class="name">' + App.escapeHtml(contactText) + '</span></div>' +
                callBtn +
            '</div>' +
        '</div>';
    }

    function renderList() {
        var data = getFilteredData();
        var container = document.getElementById('cardList');
        var empty = document.getElementById('empty');
        document.getElementById('totalCount').textContent = '共 ' + data.length + ' 项';
        if (data.length === 0) {
            container.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';
        container.innerHTML = data.map(renderCard).join('');
    }

    function refresh() {
        renderTags();
        renderList();
    }

    function initSearch() {
        var input = document.getElementById('searchInput');
        var clearBtn = document.getElementById('clearSearch');
        input.addEventListener('input', function() {
            clearBtn.style.display = input.value ? 'flex' : 'none';
            refresh();
        });
        input.addEventListener('focus', function() { clearBtn.style.display = input.value ? 'flex' : 'none'; });
    }

    window.clearSearch = function(e) {
        if (e) e.stopPropagation();
        document.getElementById('searchInput').value = '';
        document.getElementById('clearSearch').style.display = 'none';
        refresh();
    };

    function renderChipGroup(key, title, options) {
        var chips = options.map(function(o) {
            var active = selectedFilters[key] === o || (!selectedFilters[key] && o === 'all');
            return '<div class="filter-chip ' + (active ? 'active' : '') + '" onclick="selectFilter(\'' + key + '\', \'' + App.escapeHtml(o).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + '\')">' + App.escapeHtml(o === 'all' ? '全部' : o) + '</div>';
        }).join('');
        return '<div class="filter-section"><div class="filter-title">' + title + '</div><div class="filter-options">' + chips + '</div></div>';
    }

    function renderDrawer() {
        var body = document.getElementById('drawerBody');
        var html = '';

        var subCategories = [];
        if (selectedMajor !== 'all' && subCategoryMap[selectedMajor]) {
            subCategories = ['all'].concat(subCategoryMap[selectedMajor]);
        } else {
            subCategories = ['all'];
            majorOptions.forEach(function(opt) {
                if (opt.key === 'all') return;
                var list = subCategoryMap[opt.key] || [];
                if (list.length > 0) {
                    subCategories.push('__group__' + opt.label);
                    subCategories = subCategories.concat(list);
                }
            });
        }

        html += '<div class="filter-section"><div class="filter-title">小类</div>';
        var currentMajor = '';
        subCategories.forEach(function(s) {
            if (s.indexOf('__group__') === 0) {
                var majorName = s.replace('__group__', '');
                html += '<div class="sub-group-title">' + App.escapeHtml(majorName) + '</div>';
                return;
            }
            var active = selectedFilters.subCategory === s || (!selectedFilters.subCategory && s === 'all');
            html += '<div class="filter-chip ' + (active ? 'active' : '') + '" style="margin-bottom:8px" onclick="selectFilter(\'subCategory\', \'' + App.escapeHtml(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + '\')">' + App.escapeHtml(s === 'all' ? '全部' : s) + '</div>';
        });
        html += '</div>';

        var reportUnits = getReportUnitOptions();
        if (reportUnits.length > 0) html += renderChipGroup('reportUnit', '填报单位', ['all'].concat(reportUnits));

        html += '<div class="filter-section">' +
            '<div class="filter-title">填报日期</div>' +
            '<div class="date-range-row">' +
                '<input type="date" class="filter-input-field" id="drawerDateStart" value="' + App.escapeHtml(selectedFilters.reportDateStart || '') + '">' +
                '<span>至</span>' +
                '<input type="date" class="filter-input-field" id="drawerDateEnd" value="' + App.escapeHtml(selectedFilters.reportDateEnd || '') + '">' +
            '</div>' +
            '</div>';

        body.innerHTML = html;
    }

    window.selectFilter = function(key, val) {
        selectedFilters[key] = val;
        renderDrawer();
    };

    window.openDrawer = function() {
        renderDrawer();
        document.getElementById('drawerOverlay').classList.add('show');
        document.getElementById('drawer').classList.add('show');
    };

    window.closeDrawer = function() {
        document.getElementById('drawerOverlay').classList.remove('show');
        document.getElementById('drawer').classList.remove('show');
    };

    window.confirmFilters = function() {
        var startInput = document.getElementById('drawerDateStart');
        var endInput = document.getElementById('drawerDateEnd');
        if (startInput && startInput.value) selectedFilters.reportDateStart = startInput.value;
        else delete selectedFilters.reportDateStart;
        if (endInput && endInput.value) selectedFilters.reportDateEnd = endInput.value;
        else delete selectedFilters.reportDateEnd;
        renderTags();
        renderFilterDot();
        closeDrawer();
        refresh();
    };

    window.resetFilters = function() {
        selectedFilters = {};
        renderDrawer();
    };

    function init() {
        renderMajorTabs();
        initSearch();
        renderTags();
        renderFilterDot();
        renderList();

        var now = new Date();
        document.getElementById('statusTime').textContent =
            String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    init();
})();
</script>
</body>
</html>
