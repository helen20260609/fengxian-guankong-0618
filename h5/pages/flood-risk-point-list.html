<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>防汛风险点位</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.page-hero { position: relative; z-index: 99; display: flex; flex-direction: column; align-items: center; padding: calc(34px + 16px) 18px 42px; }

.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; }
.content-sheet.page-body-sheet { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 0 16px 16px; background: transparent; margin-top: 0; border-radius: 0; box-shadow: none; border: none; }
.content-sheet.page-body-sheet::-webkit-scrollbar { display: none; }

.content-sheet .search-bar { display: flex; align-items: center; gap: 10px; margin-top: 12px; background: transparent; box-shadow: none; border: none; padding: 0; }
.content-sheet .search-input-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 2px 8px var(--shadow);
    border: 1px solid var(--border);
    min-height: 40px;
    position: relative;
}
.content-sheet .search-input-wrapper .search-icon { color: var(--text2); margin-left: 12px; font-size: 14px; }
.content-sheet .search-input-wrapper input {
    flex: 1;
    background: transparent;
    border-color: transparent;
    height: 40px;
    padding: 0 28px 0 10px;
    font-size: 14px;
    color: var(--text-primary);
}
.content-sheet .search-input-wrapper input:focus { outline: none; }
.content-sheet .search-input-wrapper .clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--text2);
    color: #fff;
    font-size: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    padding: 0;
}
.content-sheet .filter-trigger {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 40px;
    padding: 0 14px;
    background: var(--card);
    color: var(--text2);
    font-size: 13px;
    font-weight: 400;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 2px 8px var(--shadow);
    cursor: pointer;
    position: relative;
    transition: all .15s;
}
.content-sheet .filter-trigger.active { color: var(--primary); border-color: var(--primary); background: rgba(var(--primary-rgb),.08); }
.content-sheet .filter-trigger:active { transform: scale(.96); }
.content-sheet .filter-trigger .badge-dot { position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); border: 1.5px solid var(--card); display: none; }
.content-sheet .filter-trigger .badge-num { position: absolute; top: -6px; right: -6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--card); box-sizing: border-box; }

.selected-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tag { background: rgba(var(--primary-rgb),.08); color: var(--primary); border: 1px solid rgba(var(--primary-rgb),.18); border-radius: 999px; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.tag i { cursor: pointer; font-size: 10px; }

.list-header { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 12px; }
.list-title { font-size: 15px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
.list-title i { color: var(--primary); }
.list-count { font-size: 13px; color: var(--text2); }

.risk-card {
    cursor: pointer;
    transition: transform .12s;
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 2px 10px var(--shadow);
    border: 1px solid var(--border);
    padding: 14px;
    margin-bottom: 12px;
    overflow: hidden;
}
.risk-card:active { transform: scale(.99); }
.risk-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.risk-location { font-size: 16px; font-weight: 700; color: var(--text-primary); line-height: 1.35; word-break: break-word; flex: 1; }
.risk-status-tag {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid;
    margin-left: 8px;
}
.risk-status-tag.pending { color: #c78000; border-color: rgba(199,128,0,.35); background: rgba(199,128,0,.06); }
.risk-status-tag.due { color: #e65100; border-color: rgba(230,81,0,.35); background: rgba(230,81,0,.06); }
.risk-status-tag.overdue { color: var(--danger); border-color: rgba(217,48,37,.35); background: rgba(217,48,37,.06); }
.risk-status-tag.unfilled { color: var(--text2); border-color: rgba(100,100,100,.35); background: rgba(100,100,100,.08); }
.risk-type-row { margin-bottom: 8px; }
.risk-type-tag {
    display: inline-flex;
    align-items: center;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid;
    color: var(--primary);
    border-color: rgba(26,115,232,.35);
    background: rgba(26,115,232,.06);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.risk-info {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.5;
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-box-orient: vertical;
}
.risk-info.issues { -webkit-line-clamp: 2; }
.risk-info.measures { -webkit-line-clamp: 1; margin-bottom: 10px; }
.risk-info .info-label { color: var(--text-primary); font-weight: 500; }
.risk-unit {
    font-size: 13px;
    color: var(--text-primary);
    font-weight: 700;
    line-height: 1.5;
}

.empty-state { text-align: center; padding: 40px 16px; color: var(--text2); }
.empty-state i { font-size: 40px; margin-bottom: 10px; display: block; }
.empty-state .empty-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
.empty-state .empty-desc { font-size: 13px; }

.loading { text-align: center; padding: 16px; color: var(--text2); font-size: 13px; }
.loading i { margin-right: 6px; }
.bottom-spacer { height: 20px; }

.filter-section { margin-bottom: 18px; }
.filter-section .filter-title { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
.filter-section .filter-options { display: flex; flex-wrap: wrap; gap: 10px; }
.filter-chip { padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-primary); cursor: pointer; transition: all .15s; word-break: break-word; }
.filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.filter-chip.full-width { width: 100%; box-sizing: border-box; }

.filter-input-field {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--input-border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: var(--input-bg);
    color: var(--text-primary);
    font-family: inherit;
}
.filter-input-field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(var(--primary-rgb),.1); }

.date-range-row { display: flex; align-items: center; gap: 10px; }
.date-range-row .filter-input-field { flex: 1; }
.date-range-row span { color: var(--text2); font-size: 13px; flex-shrink: 0; }

.sheet-footer { display: flex; gap: 12px; padding-top: 16px; border-top: 1px solid var(--border); }
.sheet-footer .btn { flex: 1; height: 44px; border-radius: 10px; }

.modal-sheet { display: block !important; opacity: 0; pointer-events: none; transform: translateY(100%); transition: transform .25s ease, opacity .25s ease; z-index: 1001; }
.modal-sheet.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.modal-mask { display: none; opacity: 0; transition: opacity .25s ease; z-index: 1000; }
.modal-mask.show { display: block; opacity: 1; }

:root[data-theme="dark"] .tag { background: rgba(var(--primary-rgb),.15); border-color: rgba(var(--primary-rgb),.3); }
:root[data-theme="dark"] .search-input-wrapper input { background: transparent; }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title">防汛风险点位</div>
        </div>

        <div class="content-sheet page-body-sheet">
            <div class="search-bar">
                <div class="search-input-wrapper">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="搜索位置/问题描述/责任单位/整改措施/备注" autocomplete="off">
                    <button class="clear-btn" id="clearSearch" onclick="clearSearch(event)"><i class="fa-solid fa-times"></i></button>
                </div>
                <div class="filter-trigger" id="filterTrigger" onclick="openDrawer()">
                    <i class="fa-solid fa-filter"></i> 筛选
                    <span class="badge-dot" id="filterDot"></span>
                    <span class="badge-num" id="filterBadge" style="display:none">0</span>
                </div>
            </div>

            <div class="selected-tags" id="selectedTags"></div>

            <div class="list-header">
                <div class="list-title"><i class="fa-solid fa-droplet"></i>点位清单</div>
                <div class="list-count" id="totalCount">共 0 处</div>
            </div>
            <div id="cardList"></div>
            <div class="loading" id="loading" style="display:none"><i class="fa-solid fa-circle-notch fa-spin"></i> 加载中…</div>
            <div class="empty-state" id="empty" style="display:none">
                <i class="fa-regular fa-folder-open"></i>
                <div class="empty-title">暂无符合条件的数据</div>
                <div class="empty-desc">请调整筛选或搜索条件</div>
            </div>
            <div class="bottom-spacer"></div>
        </div>

        <!-- 筛选抽屉 -->
        <div class="modal-mask" id="drawerOverlay" onclick="closeDrawer()"></div>
        <div class="modal-sheet" id="drawer">
            <div class="sheet-header">
                <div class="sheet-title">筛选条件</div>
                <div class="sheet-close" onclick="closeDrawer()"><i class="fa-solid fa-times"></i></div>
            </div>
            <div id="drawerBody"></div>
            <div class="sheet-footer">
                <button class="btn btn-outline" onclick="resetFilters()">重置</button>
                <button class="btn btn-primary" onclick="confirmFilters()">确定</button>
            </div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../../data/flood-risk-point-data.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    function getInitialData() {
        var data = (typeof floodRiskPointData !== 'undefined' && Array.isArray(floodRiskPointData)) ? floodRiskPointData : [];
        data = data.map(function(item, idx) {
            var clone = Object.assign({}, item);
            clone.id = item.id || ('frp_' + (item.no || idx));
            return clone;
        });
        try { localStorage.setItem('floodRiskPointData', JSON.stringify(data)); } catch (e) {}
        return data;
    }

    var allData = getInitialData();
    var selectedFilters = {};

    function getOptions(extractor) {
        var map = {};
        allData.forEach(function(item) {
            var v = extractor(item);
            if (v) map[v] = true;
        });
        return Object.keys(map).sort();
    }

    function getFilteredData() {
        var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        return allData.filter(function(item) {
            if (selectedFilters.riskType && selectedFilters.riskType !== 'all' && item.riskType !== selectedFilters.riskType) return false;
            if (selectedFilters.responsibleUnit && selectedFilters.responsibleUnit !== 'all' && item.responsibleUnit !== selectedFilters.responsibleUnit) return false;
            if (selectedFilters.reportUnit && selectedFilters.reportUnit !== 'all' && item.reportUnit !== selectedFilters.reportUnit) return false;
            if (keyword) {
                var hay = (
                    (item.location || '') + ' ' +
                    (item.description || '') + ' ' +
                    (item.responsibleUnit || '') + ' ' +
                    (item.measures || '') + ' ' +
                    (item.reportUnit || '') + ' ' +
                    (item.reporter || '') + ' ' +
                    (item.reportDate || '') + ' ' +
                    (item.remark || '')
                ).toLowerCase();
                if (hay.indexOf(keyword) === -1) return false;
            }
            if (selectedFilters.reportDateStart && item.reportDate && item.reportDate < selectedFilters.reportDateStart) return false;
            if (selectedFilters.reportDateEnd && item.reportDate && item.reportDate > selectedFilters.reportDateEnd) return false;
            return true;
        });
    }

    function getStatusInfo(completionDate) {
        if (!completionDate || !String(completionDate).trim()) return { cls: 'unfilled', label: '时限未填报' };
        var today = new Date();
        today.setHours(0, 0, 0, 0);
        var date = new Date(completionDate);
        date.setHours(0, 0, 0, 0);
        if (date < today) return { cls: 'overdue', label: '已逾期' };
        if (date.getTime() === today.getTime()) return { cls: 'due', label: '到期应完成' };
        return { cls: 'pending', label: '整改中' };
    }

    function renderTags() {
        var container = document.getElementById('selectedTags');
        var tags = [];
        if (selectedFilters.riskType && selectedFilters.riskType !== 'all') tags.push({ key: 'riskType', label: '风险类型：' + selectedFilters.riskType });
        if (selectedFilters.responsibleUnit && selectedFilters.responsibleUnit !== 'all') tags.push({ key: 'responsibleUnit', label: '责任单位：' + selectedFilters.responsibleUnit });
        if (selectedFilters.reportUnit && selectedFilters.reportUnit !== 'all') tags.push({ key: 'reportUnit', label: '填报单位：' + selectedFilters.reportUnit });
        if (selectedFilters.reportDateStart) tags.push({ key: 'reportDateStart', label: '填报日期起：' + selectedFilters.reportDateStart });
        if (selectedFilters.reportDateEnd) tags.push({ key: 'reportDateEnd', label: '填报日期止：' + selectedFilters.reportDateEnd });
        container.innerHTML = tags.map(function(t) {
            return '<div class="tag">' + App.escapeHtml(t.label) + '<i class="fa-solid fa-times" onclick="removeFilter(\'' + t.key + '\')"></i></div>';
        }).join('');
    }

    window.removeFilter = function(key) {
        delete selectedFilters[key];
        renderTags();
        renderFilterDot();
        refresh();
    };

    function renderFilterDot() {
        var activeCount = 0;
        if (selectedFilters.riskType && selectedFilters.riskType !== 'all') activeCount++;
        if (selectedFilters.responsibleUnit && selectedFilters.responsibleUnit !== 'all') activeCount++;
        if (selectedFilters.reportUnit && selectedFilters.reportUnit !== 'all') activeCount++;
        if (selectedFilters.reportDateStart) activeCount++;
        if (selectedFilters.reportDateEnd) activeCount++;
        var badge = document.getElementById('filterBadge');
        var trigger = document.getElementById('filterTrigger');
        if (activeCount > 0) {
            badge.textContent = activeCount;
            badge.style.display = 'inline-flex';
            trigger.classList.add('active');
        } else {
            badge.style.display = 'none';
            trigger.classList.remove('active');
        }
    }

    function renderCard(item) {
        return '<div class="risk-card tap" onclick="App.go(\'flood-risk-point-detail.html?id=' + encodeURIComponent(item.id) + '\')">' +
            '<div class="risk-card-header">' +
                '<div class="risk-location">' + App.escapeHtml(item.location || '—') + '</div>' +
            '</div>' +
            '<div class="risk-type-row">' +
                '<div class="risk-type-tag">' + App.escapeHtml(item.riskType || '—') + '</div>' +
            '</div>' +
            '<div class="risk-info issues"><span class="info-label">⚠️ 问题：</span>' + App.escapeHtml(item.description || '—') + '</div>' +
            '<div class="risk-unit">🏢 单位：' + App.escapeHtml(item.responsibleUnit || '—') + '</div>' +
        '</div>';
    }

    function renderList() {
        var data = getFilteredData();
        var container = document.getElementById('cardList');
        var empty = document.getElementById('empty');
        document.getElementById('totalCount').textContent = '共 ' + data.length + ' 处';
        if (data.length === 0) {
            container.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';
        container.innerHTML = data.map(renderCard).join('');
    }

    function refresh() {
        renderTags();
        renderList();
    }

    function initSearch() {
        var input = document.getElementById('searchInput');
        var clearBtn = document.getElementById('clearSearch');
        input.addEventListener('input', function() {
            clearBtn.style.display = input.value ? 'flex' : 'none';
            refresh();
        });
        input.addEventListener('focus', function() { clearBtn.style.display = input.value ? 'flex' : 'none'; });
    }

    window.clearSearch = function(e) {
        if (e) e.stopPropagation();
        document.getElementById('searchInput').value = '';
        document.getElementById('clearSearch').style.display = 'none';
        refresh();
    };

    function renderChipGroup(key, title, options, fullWidth) {
        var chips = options.map(function(o) {
            var active = selectedFilters[key] === o || (!selectedFilters[key] && o === 'all');
            var isLong = o.length > 12;
            return '<div class="filter-chip ' + (active ? 'active' : '') + ' ' + (fullWidth || isLong ? 'full-width' : '') + '" onclick="selectFilter(\'' + key + '\', \'' + App.escapeHtml(o).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + '\')">' + App.escapeHtml(o === 'all' ? '全部' : o) + '</div>';
        }).join('');
        return '<div class="filter-section"><div class="filter-title">' + title + '</div><div class="filter-options">' + chips + '</div></div>';
    }

    function renderDrawer() {
        var body = document.getElementById('drawerBody');
        var riskTypes = getOptions(function(i) { return i.riskType; });
        var responsibleUnits = getOptions(function(i) { return i.responsibleUnit; });
        var reportUnits = getOptions(function(i) { return i.reportUnit; });

        var html = '';
        if (riskTypes.length > 0) html += renderChipGroup('riskType', '风险类型', ['all'].concat(riskTypes), true);
        if (responsibleUnits.length > 0) html += renderChipGroup('responsibleUnit', '责任单位', ['all'].concat(responsibleUnits));
        if (reportUnits.length > 0) html += renderChipGroup('reportUnit', '填报单位', ['all'].concat(reportUnits));

        html += '<div class="filter-section">' +
            '<div class="filter-title">填报日期</div>' +
            '<div class="date-range-row">' +
                '<input type="date" class="filter-input-field" id="drawerDateStart" value="' + App.escapeHtml(selectedFilters.reportDateStart || '') + '">' +
                '<span>至</span>' +
                '<input type="date" class="filter-input-field" id="drawerDateEnd" value="' + App.escapeHtml(selectedFilters.reportDateEnd || '') + '">' +
            '</div>' +
            '</div>';

        body.innerHTML = html;
    }

    window.selectFilter = function(key, val) {
        selectedFilters[key] = val;
        renderDrawer();
    };

    window.openDrawer = function() {
        renderDrawer();
        document.getElementById('drawerOverlay').classList.add('show');
        document.getElementById('drawer').classList.add('show');
    };

    window.closeDrawer = function() {
        document.getElementById('drawerOverlay').classList.remove('show');
        document.getElementById('drawer').classList.remove('show');
    };

    window.confirmFilters = function() {
        var startInput = document.getElementById('drawerDateStart');
        var endInput = document.getElementById('drawerDateEnd');
        if (startInput && startInput.value) selectedFilters.reportDateStart = startInput.value;
        else delete selectedFilters.reportDateStart;
        if (endInput && endInput.value) selectedFilters.reportDateEnd = endInput.value;
        else delete selectedFilters.reportDateEnd;
        renderTags();
        renderFilterDot();
        closeDrawer();
        refresh();
    };

    window.resetFilters = function() {
        selectedFilters = {};
        renderDrawer();
    };

    function init() {
        initSearch();
        renderTags();
        renderFilterDot();
        renderList();

        var now = new Date();
        document.getElementById('statusTime').textContent =
            String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    init();
})();
</script>
</body>
</html>
