<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>在建工地详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>

.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; }
.content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 0 0 16px; background: #f5f6fa; }
.content::-webkit-scrollbar { display: none; }

.hero-card {
    background: linear-gradient(135deg, #1a73e8 0%, #3b82f6 55%, #0097a7 100%);
    border-radius: 12px; margin: 8px 16px 14px; padding: 18px 16px; color: #fff;
    box-shadow: 0 6px 18px rgba(26,115,232,.22); position: relative; overflow: hidden;
}
.hero-card::before {
    content: ''; position: absolute; width: 120px; height: 120px; right: -30px; top: -30px;
    background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%); border-radius: 50%;
}
.hero-card .project-name { font-size: 17px; font-weight: 700; position: relative; z-index: 1; line-height: 1.4; word-break: break-word; }
.hero-card .hero-addr-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; position: relative; z-index: 1; }
.hero-card .hero-addr { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; font-size: 13px; opacity: .9; }
.hero-card .hero-addr .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero-card .hero-addr i { font-size: 12px; flex-shrink: 0; }
.hero-card .hero-plan-badge { flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.hero-card .hero-plan-badge.yes { background: rgba(82,196,26,.2); color: #fff; }
.hero-card .hero-plan-badge.no { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.25); }
.hero-card .hero-divider { height: 1px; background: rgba(255,255,255,.25); margin: 12px 0; position: relative; z-index: 1; }
.hero-card .hero-transfer-row { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
.hero-card .hero-category { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; font-size: 13px; }
.hero-card .hero-category .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.hero-card .hero-transfer { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; font-size: 13px; }
.hero-card .hero-transfer strong { font-size: 18px; font-weight: 700; }
.hero-card .hero-divider-v { width: 1px; height: 14px; background: rgba(255,255,255,.3); flex-shrink: 0; }
.hero-card .hero-shelter-row { display: flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 13px; position: relative; z-index: 1; }
.hero-card .hero-shelter-row .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.hero-card .hero-contact { margin-top: 8px; font-size: 13px; opacity: .9; position: relative; z-index: 1; }

.action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 0 16px 14px; }
.action-grid-cell {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: all .15s;
}
.action-grid-cell:active { transform: scale(.97); }
.action-grid-cell.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.action-grid-cell .ag-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.action-grid-cell .ag-icon.phone { background: rgba(30,142,62,.12); color: var(--success); }
.action-grid-cell .ag-icon.map { background: rgba(26,115,232,.12); color: var(--primary); }
.action-grid-cell .ag-icon.map.disabled { background: var(--bg-hover); color: var(--text2); }
.action-grid-cell .ag-label { font-size: 12px; color: var(--text-primary); font-weight: 500; }
.action-grid-cell .ag-label.disabled { color: var(--text2); }

.section-v2 { background: #fff; border-radius: 12px; margin: 0 16px 12px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.section-v2:last-of-type { margin-bottom: 16px; }
.sv2-head { margin-bottom: 10px; }
.sv2-title { font-size: 15px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 0; position: relative; padding-left: 10px; }
.sv2-title::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--primary); }
.sc-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #f2f2f2; gap: 16px; }
.sc-row:last-child { border-bottom: none; padding-bottom: 0; }
.sc-row.wrap { align-items: flex-start; }
.sc-label { font-size: 14px; color: var(--text2); text-align: left; line-height: 1.4; flex-shrink: 0; }
.sc-value { flex: 1; min-width: 0; font-size: 14px; color: var(--text-primary); font-weight: 500; text-align: right; line-height: 1.4; word-break: break-word; }
.sc-value.phone { color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; }
.sc-value.phone i { font-size: 12px; }
.sc-value.na { color: var(--text2); }

.bottom-spacer { height: 20px; }

:root[data-theme="dark"] .section-v2 { background: var(--bg-card); }
:root[data-theme="dark"] .hero-card { background: linear-gradient(135deg, #0d2a5c 0%, #103a7a 55%, #0a5f6b 100%); }
:root[data-theme="dark"] .action-grid-cell { background: var(--bg-card); border-color: var(--border); }
:root[data-theme="dark"] .content { background: var(--bg-body); }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <!-- 固定顶部区域：状态栏 + 导航栏 -->
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title" id="heroTitle">在建工地详情</div>
        </div>

        <div class="content" style="padding-top:8px">
            <!-- 头部蓝色渐变卡片 -->
            <div class="hero-card">
                <div class="project-name" id="projectName">--</div>
                <div class="hero-addr-row">
                    <div class="hero-addr"><i class="fa-solid fa-location-dot"></i><span class="txt" id="heroAddress">--</span></div>
                    <div class="hero-plan-badge" id="heroPlan">--</div>
                </div>
                <div class="hero-divider"></div>
                <div class="hero-transfer-row">
                    <div class="hero-category"><span>项目类别：</span><span class="txt" id="heroCategory">--</span></div>
                    <div class="hero-divider-v"></div>
                    <div class="hero-transfer"><span>需转运：</span><strong id="heroTransfer">0</strong></div>
                </div>
                <div class="hero-shelter-row" id="heroShelterRow"><span>安置场所：</span><span class="txt" id="heroShelter">--</span></div>
                <div class="hero-contact" id="heroContact">--</div>
            </div>

            <!-- 快捷操作 -->
            <div class="action-grid two-col">
                <div class="action-grid-cell" id="callAction">
                    <div class="ag-icon phone"><i class="fa-solid fa-phone"></i></div>
                    <div class="ag-label">拨打联系人</div>
                </div>
                <div class="action-grid-cell" id="mapAction">
                    <div class="ag-icon map"><i class="fa-solid fa-map-location-dot"></i></div>
                    <div class="ag-label">在地图中查看</div>
                </div>
            </div>

            <!-- 项目基础信息卡片 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">项目基础信息</div></div>
                <div id="baseInfo"></div>
            </div>

            <!-- 撤离安置信息卡片 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">撤离安置信息</div></div>
                <div id="evacuationInfo"></div>
            </div>

            <!-- 安置场所信息卡片 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">安置场所信息</div></div>
                <div id="shelterInfo"></div>
            </div>

            <!-- 填报信息卡片 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">填报信息</div></div>
                <div id="reportInfo"></div>
            </div>

            <div class="bottom-spacer"></div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../../data/construction-site-data.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    var rawData = (typeof constructionSiteData !== 'undefined' && Array.isArray(constructionSiteData)) ? constructionSiteData : [];
    var allData = rawData.map(function(item) {
        return {
            no: item.no || '',
            projectName: item.projectName || '',
            region: item.region || '',
            address: item.address || '',
            constructionUnit: item.constructionUnit || '',
            projectLevel: item.projectLevel || '',
            projectCategory: item.projectCategory || '',
            evacuationUnit: item.evacuationUnit || '',
            totalPeople: item.totalPeople || '',
            hasFloodPlan: item.hasFloodPlan || '',
            transferPeople: item.transferPeople || '',
            shelterName: item.shelterName || '',
            shelterAddress: item.shelterAddress || '',
            contactPerson: item.contactPerson || '',
            contactPosition: item.contactPosition || '',
            contactPhone: item.contactPhone || '',
            reportUnit: item.reportUnit || '',
            reporter: item.reporter || '',
            reportDate: item.reportDate || ''
        };
    });

    function loadData() {
        var id = App.getQuery('id');
        var fromStorage = null;
        try { fromStorage = JSON.parse(localStorage.getItem('constructionSiteData') || '[]'); } catch (e) {}
        var list = Array.isArray(fromStorage) && fromStorage.length ? fromStorage : allData;
        if (id) {
            var found = list.find(function(i) { return i.no === id; });
            if (found) return found;
        }
        return allData[0];
    }

    var item = loadData();

    function getVal(v) { return v && String(v).trim() ? v : '—'; }

    function renderInfoGrid(pairs) {
        return pairs.map(function(p) {
            return '<div class="sc-row"><div class="sc-label">' + p.label + '</div><div class="sc-value ' + (p.cls || '') + '"' + (p.id ? ' id="' + p.id + '"' : '') + '>' + p.value + '</div></div>';
        }).join('');
    }

    function renderHero() {
        document.getElementById('heroTitle').textContent = item.projectName ? '在建工地详情' : '在建工地详情';
        document.getElementById('projectName').textContent = getVal(item.projectName);
        document.getElementById('heroAddress').textContent = getVal(item.address);
        document.getElementById('heroCategory').textContent = getVal(item.projectCategory);
        document.getElementById('heroTransfer').textContent = getVal(item.transferPeople);
        document.getElementById('heroShelter').textContent = getVal(item.shelterName);

        var planYes = String(item.hasFloodPlan).trim() === '有';
        var planEl = document.getElementById('heroPlan');
        planEl.className = 'hero-plan-badge ' + (planYes ? 'yes' : 'no');
        planEl.innerHTML = '<i class="fa-solid fa-bolt"></i> ' + (planYes ? '有预案' : '无预案');

        var contact = getVal(item.contactPerson);
        var position = item.contactPosition ? ' (' + item.contactPosition + ')' : '';
        document.getElementById('heroContact').textContent = '现场负责人：' + contact + position;
    }

    function renderBaseInfo() {
        var rows = [
            { label: '项目名称', value: App.escapeHtml(getVal(item.projectName)) },
            { label: '级别', value: App.escapeHtml(getVal(item.projectLevel)) },
            { label: '类别', value: App.escapeHtml(getVal(item.projectCategory)) },
            { label: '街镇', value: App.escapeHtml(getVal(item.region)) },
            { label: '地址', value: App.escapeHtml(getVal(item.address)) },
            { label: '施工单位名称', value: App.escapeHtml(getVal(item.constructionUnit)) },
            { label: '有无应急预案', value: App.escapeHtml(getVal(item.hasFloodPlan)) }
        ];
        document.getElementById('baseInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderEvacuationInfo() {
        var rows = [
            { label: '组织撤离单位名称', value: App.escapeHtml(getVal(item.evacuationUnit)) },
            { label: '总人数', value: App.escapeHtml(getVal(item.totalPeople)) },
            { label: '需转移安置人数', value: App.escapeHtml(getVal(item.transferPeople)) },
            { label: '联系人', value: App.escapeHtml(getVal(item.contactPerson)) },
            { label: '职务', value: App.escapeHtml(getVal(item.contactPosition)) },
            { label: '联系方式', value: App.escapeHtml(getVal(item.contactPhone)), cls: 'phone' }
        ];
        document.getElementById('evacuationInfo').innerHTML = renderInfoGrid(rows);

        var phoneValue = document.querySelector('#evacuationInfo .sc-value.phone');
        if (phoneValue && item.contactPhone) {
            phoneValue.innerHTML = '<i class="fa-solid fa-phone"></i> ' + App.escapeHtml(item.contactPhone);
            phoneValue.style.cursor = 'pointer';
            phoneValue.addEventListener('click', function() {
                window.location.href = 'tel:' + item.contactPhone;
                App.showToast('正在呼叫 ' + App.escapeHtml(item.contactPerson) + ' ' + App.escapeHtml(item.contactPhone));
            });
        }
    }

    function renderShelterInfo() {
        var rows = [
            { label: '安置场所名称', value: App.escapeHtml(getVal(item.shelterName)) },
            { label: '安置场所地址', value: App.escapeHtml(getVal(item.shelterAddress)) }
        ];
        document.getElementById('shelterInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderReportInfo() {
        var rows = [
            { label: '填报单位', value: App.escapeHtml(getVal(item.reportUnit)) },
            { label: '填报人', value: App.escapeHtml(getVal(item.reporter)) },
            { label: '填报日期', value: App.escapeHtml(getVal(item.reportDate)) }
        ];
        document.getElementById('reportInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderActions() {
        var callAction = document.getElementById('callAction');
        callAction.addEventListener('click', function() {
            if (!item.contactPhone) return;
            window.location.href = 'tel:' + item.contactPhone;
            App.showToast('正在呼叫 ' + App.escapeHtml(item.contactPerson) + ' ' + App.escapeHtml(item.contactPhone));
        });

        var mapAction = document.getElementById('mapAction');
        var mapIcon = document.querySelector('#mapAction .ag-icon.map');
        var mapLabel = document.querySelector('#mapAction .ag-label');
        var hasCoords = item.longitude && item.latitude && String(item.longitude).trim() && String(item.latitude).trim();
        var hasAddress = item.address && String(item.address).trim();
        if (!hasCoords && !hasAddress) {
            mapAction.classList.add('disabled');
            if (mapIcon) mapIcon.classList.add('disabled');
            if (mapLabel) mapLabel.classList.add('disabled');
        } else {
            mapAction.addEventListener('click', function() {
                var url;
                if (hasCoords) {
                    url = 'https://uri.amap.com/marker?position=' + item.longitude + ',' + item.latitude + '&name=' + encodeURIComponent(item.projectName || item.address || '工地位置');
                } else {
                    url = 'https://uri.amap.com/search?keyword=' + encodeURIComponent(item.address) + '&city=' + encodeURIComponent(item.region || '上海');
                }
                window.open(url, '_blank');
            });
        }
    }

    function updateTime() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        document.getElementById('statusTime').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    }
    updateTime();
    setInterval(updateTime, 60000);

    renderHero();
    renderActions();
    renderBaseInfo();
    renderEvacuationInfo();
    renderShelterInfo();
    renderReportInfo();
})();
</script>
</body>
</html>
