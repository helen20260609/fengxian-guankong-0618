<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>地下空间信息</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.page-hero { position: relative; z-index: 99; display: flex; flex-direction: column; align-items: center; padding: calc(34px + 16px) 18px 42px; }
.page-hero .ph-sub { position: static; text-align: center; font-size: 12px; opacity: .85; margin-top: 40px; width: 100%; }

.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; }
.content-sheet.page-body-sheet { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 0 16px 16px; background: #f5f6fa; margin-top: 0; border-radius: 0; }
.content-sheet.page-body-sheet::-webkit-scrollbar { display: none; }

.search-bar { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
.search-input-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 2px 8px var(--shadow);
    border: 1px solid var(--border);
    min-height: 40px;
    position: relative;
}
.search-input-wrapper .search-icon { color: var(--text2); margin-left: 12px; font-size: 14px; }
.search-input-wrapper input {
    flex: 1;
    background: transparent;
    border: none;
    height: 40px;
    padding: 0 28px 0 10px;
    font-size: 14px;
    color: var(--text-primary);
}
.search-input-wrapper input:focus { outline: none; }
.search-input-wrapper .clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--text2);
    color: #fff;
    font-size: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    padding: 0;
}
.filter-trigger {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 40px;
    padding: 0 14px;
    background: var(--card);
    color: var(--text2);
    font-size: 13px;
    font-weight: 400;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 2px 8px var(--shadow);
    cursor: pointer;
    position: relative;
    transition: all .15s;
}
.filter-trigger.active { color: var(--primary); border-color: var(--primary); background: rgba(var(--primary-rgb),.08); }
.filter-trigger:active { transform: scale(.96); }
.filter-trigger .badge-dot { position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); border: 1.5px solid var(--card); display: none; }
.filter-trigger .badge-num { position: absolute; top: -6px; right: -6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--card); box-sizing: border-box; }

.selected-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.tag { background: rgba(var(--primary-rgb),.08); color: var(--primary); border: 1px solid rgba(var(--primary-rgb),.18); border-radius: 999px; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.tag i { cursor: pointer; font-size: 10px; }

.stats-row { margin: 14px 0 12px; font-size: 13px; color: var(--text2); }
.stats-row .danger { color: var(--danger); font-weight: 700; }

.ug-card { cursor: pointer; transition: transform .12s; background: var(--card); border-radius: 12px; box-shadow: 0 2px 10px var(--shadow); border: 1px solid var(--border); padding: 16px; margin-bottom: 12px; overflow: hidden; }
.ug-card:active { transform: scale(.99); }
.ug-name { font-size: 16px; font-weight: 700; color: #1F1F1F; line-height: 1.4; margin-bottom: 10px; word-break: break-word; }
.ug-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.ug-tag { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; border: 1px solid; }
.ug-tag.category { color: var(--primary); border-color: rgba(26,115,232,.35); background: rgba(26,115,232,.06); }
.ug-tag.drainage-yes { color: var(--success); border-color: rgba(30,142,62,.35); background: rgba(30,142,62,.06); }
.ug-tag.drainage-no { color: var(--danger); border-color: rgba(217,48,37,.35); background: rgba(217,48,37,.06); }
.ug-tag.drainage-yes::before, .ug-tag.drainage-no::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 4px; }
.ug-address { font-size: 13px; color: #7F7F7F; line-height: 1.4; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.ug-address i { font-size: 12px; flex-shrink: 0; }
.ug-area { font-size: 13px; color: var(--text-primary); font-weight: 500; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.ug-area i { font-size: 12px; color: var(--text2); flex-shrink: 0; }
.ug-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
.ug-info-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ug-info-line { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ug-info-line i { font-size: 12px; color: var(--text2); flex-shrink: 0; }
.ug-info-line .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ug-info-line .name { color: var(--text-primary); font-weight: 500; }
.call-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #E6FFED;
    color: #52C41A;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    text-decoration: none;
    flex-shrink: 0;
    cursor: pointer;
    transition: all .15s;
}
.call-btn:active { transform: scale(.94); background: #52C41A; color: #fff; }
.call-btn.hidden { display: none; }

.empty-state { text-align: center; padding: 40px 16px; color: var(--text2); }
.empty-state i { font-size: 40px; margin-bottom: 10px; display: block; }
.empty-state .empty-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
.empty-state .empty-desc { font-size: 13px; }

.loading { text-align: center; padding: 16px; color: var(--text2); font-size: 13px; }
.loading i { margin-right: 6px; }
.bottom-spacer { height: 20px; }

.filter-section { margin-bottom: 18px; }
.filter-section .filter-title { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
.filter-section .filter-options { display: flex; flex-wrap: wrap; gap: 10px; }
.filter-chip { padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-primary); cursor: pointer; transition: all .15s; }
.filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.filter-input-field {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--input-border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: var(--input-bg);
    color: var(--text-primary);
    font-family: inherit;
}
.filter-input-field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(var(--primary-rgb),.1); }

.date-range-row { display: flex; align-items: center; gap: 10px; }
.date-range-row .filter-input-field { flex: 1; }
.date-range-row span { color: var(--text2); font-size: 13px; flex-shrink: 0; }

.sheet-footer { display: flex; gap: 12px; padding-top: 16px; border-top: 1px solid var(--border); }
.sheet-footer .btn { flex: 1; height: 44px; border-radius: 10px; }

.modal-sheet { display: block !important; opacity: 0; pointer-events: none; transform: translateY(100%); transition: transform .25s ease, opacity .25s ease; z-index: 1001; }
.modal-sheet.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.modal-mask { display: none; opacity: 0; transition: opacity .25s ease; z-index: 1000; }
.modal-mask.show { display: block; opacity: 1; }

:root[data-theme="dark"] .tag { background: rgba(var(--primary-rgb),.15); border-color: rgba(var(--primary-rgb),.3); }
:root[data-theme="dark"] .search-input-wrapper input { background: transparent; }
:root[data-theme="dark"] .ug-name { color: #F0F0F0; }
:root[data-theme="dark"] .ug-info-line .name { color: #F0F0F0; }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title">地下空间信息</div>
            
        </div>

        <div class="content-sheet page-body-sheet">
            <div class="search-bar">
                <div class="search-input-wrapper">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="搜索名称/地址/管理单位/负责人/联系方式" autocomplete="off">
                    <button class="clear-btn" id="clearSearch" onclick="clearSearch(event)"><i class="fa-solid fa-times"></i></button>
                </div>
                <div class="filter-trigger" id="filterTrigger" onclick="openDrawer()">
                    <i class="fa-solid fa-filter"></i> 筛选
                    <span class="badge-dot" id="filterDot"></span>
                    <span class="badge-num" id="filterBadge" style="display:none">0</span>
                </div>
            </div>

            <div class="selected-tags" id="selectedTags"></div>

            <div class="stats-row" id="statsRow">共 0 处地下空间 · 无排水设施 <span class="danger">0</span> 处</div>

            <div id="cardList"></div>
            <div class="loading" id="loading" style="display:none"><i class="fa-solid fa-circle-notch fa-spin"></i> 加载中…</div>
            <div class="empty-state" id="empty" style="display:none">
                <i class="fa-regular fa-folder-open"></i>
                <div class="empty-title">暂无符合条件的地下空间</div>
                <div class="empty-desc">请调整筛选或搜索条件</div>
            </div>
            <div class="bottom-spacer"></div>
        </div>

        <!-- 筛选抽屉 -->
        <div class="modal-mask" id="drawerOverlay" onclick="closeDrawer()"></div>
        <div class="modal-sheet" id="drawer">
            <div class="sheet-header">
                <div class="sheet-title">筛选条件</div>
                <div class="sheet-close" onclick="closeDrawer()"><i class="fa-solid fa-times"></i></div>
            </div>
            <div id="drawerBody"></div>
            <div class="sheet-footer">
                <button class="btn btn-outline" onclick="resetFilters()">重置</button>
                <button class="btn btn-primary" onclick="confirmFilters()">确定</button>
            </div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../../data/underground-space-data.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    function normalizeDrainage(v) {
        var s = String(v || '').trim();
        if (s === '有' || s === '是' || s === 'true' || s === '1') return '有';
        return '无';
    }

    function getInitialData() {
        var data = (typeof undergroundSpaceData !== 'undefined' && Array.isArray(undergroundSpaceData)) ? undergroundSpaceData : [];
        data = data.map(function(item, idx) {
            var clone = Object.assign({}, item);
            clone.id = item.id || ('us_' + (item.no || idx));
            clone._drainage = normalizeDrainage(item.hasDrainageFacility);
            return clone;
        });
        try { localStorage.setItem('undergroundSpaceData', JSON.stringify(data)); } catch (e) {}
        return data;
    }

    var allData = getInitialData();
    var selectedFilters = {};

    function getOptions(extractor) {
        var map = {};
        allData.forEach(function(item) {
            var v = extractor(item);
            if (v) map[v] = true;
        });
        return Object.keys(map).sort();
    }

    function getFilteredData() {
        var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        return allData.filter(function(item) {
            if (selectedFilters.category && selectedFilters.category !== 'all' && item.category !== selectedFilters.category) return false;
            if (selectedFilters.hasDrainageFacility && selectedFilters.hasDrainageFacility !== 'all') {
                if (item._drainage !== selectedFilters.hasDrainageFacility) return false;
            }
            if (selectedFilters.reportUnit && selectedFilters.reportUnit !== 'all' && item.reportUnit !== selectedFilters.reportUnit) return false;
            if (keyword) {
                var hay = (
                    (item.name || '') + ' ' +
                    (item.address || '') + ' ' +
                    (item.managementUnit || '') + ' ' +
                    (item.manager || '') + ' ' +
                    (item.contactPhone || '') + ' ' +
                    (item.reportUnit || '') + ' ' +
                    (item.reporter || '') + ' ' +
                    (item.reportDate || '')
                ).toLowerCase();
                if (hay.indexOf(keyword) === -1) return false;
            }
            if (selectedFilters.reportDateStart && item.reportDate && item.reportDate < selectedFilters.reportDateStart) return false;
            if (selectedFilters.reportDateEnd && item.reportDate && item.reportDate > selectedFilters.reportDateEnd) return false;
            return true;
        });
    }

    function renderTags() {
        var container = document.getElementById('selectedTags');
        var tags = [];
        if (selectedFilters.category && selectedFilters.category !== 'all') tags.push({ key: 'category', label: '类别：' + selectedFilters.category });
        if (selectedFilters.hasDrainageFacility && selectedFilters.hasDrainageFacility !== 'all') tags.push({ key: 'hasDrainageFacility', label: '排水设施：' + selectedFilters.hasDrainageFacility });
        if (selectedFilters.reportUnit && selectedFilters.reportUnit !== 'all') tags.push({ key: 'reportUnit', label: '填报单位：' + selectedFilters.reportUnit });
        if (selectedFilters.reportDateStart) tags.push({ key: 'reportDateStart', label: '填报日期起：' + selectedFilters.reportDateStart });
        if (selectedFilters.reportDateEnd) tags.push({ key: 'reportDateEnd', label: '填报日期止：' + selectedFilters.reportDateEnd });
        container.innerHTML = tags.map(function(t) {
            return '<div class="tag">' + App.escapeHtml(t.label) + '<i class="fa-solid fa-times" onclick="removeFilter(\'' + t.key + '\')"></i></div>';
        }).join('');
    }

    window.removeFilter = function(key) {
        delete selectedFilters[key];
        renderTags();
        renderFilterDot();
        refresh();
    };

    function renderFilterDot() {
        var activeCount = 0;
        if (selectedFilters.category && selectedFilters.category !== 'all') activeCount++;
        if (selectedFilters.hasDrainageFacility && selectedFilters.hasDrainageFacility !== 'all') activeCount++;
        if (selectedFilters.reportUnit && selectedFilters.reportUnit !== 'all') activeCount++;
        if (selectedFilters.reportDateStart) activeCount++;
        if (selectedFilters.reportDateEnd) activeCount++;
        var badge = document.getElementById('filterBadge');
        var trigger = document.getElementById('filterTrigger');
        if (activeCount > 0) {
            badge.textContent = activeCount;
            badge.style.display = 'inline-flex';
            trigger.classList.add('active');
        } else {
            badge.style.display = 'none';
            trigger.classList.remove('active');
        }
    }

    function renderStats(data) {
        var noDrainage = data.filter(function(i) { return i._drainage === '无'; }).length;
        document.getElementById('statsRow').innerHTML = '共 ' + data.length + ' 处地下空间 · 无排水设施 <span class="danger">' + noDrainage + '</span> 处';
    }

    function renderCard(item) {
        var hasPhone = item.contactPhone && String(item.contactPhone).trim();
        var callBtn = hasPhone
            ? '<a class="call-btn tap" onclick="event.stopPropagation();window.location.href=\'tel:' + App.escapeHtml(item.contactPhone) + '\'"><i class="fa-solid fa-phone"></i></a>'
            : '';
        var areaText = item.area && String(item.area).trim() ? (parseFloat(item.area).toLocaleString() + ' ㎡') : '—';
        var drainageYes = item._drainage === '有';
        var drainageText = drainageYes ? '有排水设施' : '无排水设施';

        return '<div class="ug-card tap" onclick="App.go(\'underground-space-detail.html?id=' + encodeURIComponent(item.id) + '\')">' +
            '<div class="ug-name">' + App.escapeHtml(item.name || '—') + '</div>' +
            '<div class="ug-tags">' +
                (item.category ? '<div class="ug-tag category">' + App.escapeHtml(item.category) + '</div>' : '') +
                '<div class="ug-tag ' + (drainageYes ? 'drainage-yes' : 'drainage-no') + '">' + App.escapeHtml(drainageText) + '</div>' +
            '</div>' +
            '<div class="ug-address"><i class="fa-solid fa-location-dot"></i>' + App.escapeHtml(item.address || '—') + '</div>' +
            '<div class="ug-area"><i class="fa-solid fa-ruler-combined"></i>建筑面积：' + App.escapeHtml(areaText) + '</div>' +
            '<div class="ug-bottom">' +
                '<div class="ug-info-col">' +
                    '<div class="ug-info-line"><i class="fa-regular fa-user"></i>负责人：<span class="txt name">' + App.escapeHtml(item.manager || '—') + '</span></div>' +
                    '<div class="ug-info-line"><i class="fa-regular fa-building"></i><span class="txt">' + App.escapeHtml(item.managementUnit || '—') + '</span></div>' +
                '</div>' +
                callBtn +
            '</div>' +
        '</div>';
    }

    function renderList() {
        var data = getFilteredData();
        var container = document.getElementById('cardList');
        var empty = document.getElementById('empty');
        renderStats(data);
        if (data.length === 0) {
            container.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';
        container.innerHTML = data.slice(0, 20).map(renderCard).join('');
    }

    function refresh() {
        renderTags();
        renderList();
    }

    function initSearch() {
        var input = document.getElementById('searchInput');
        var clearBtn = document.getElementById('clearSearch');
        input.addEventListener('input', function() {
            clearBtn.style.display = input.value ? 'flex' : 'none';
            refresh();
        });
        input.addEventListener('focus', function() { clearBtn.style.display = input.value ? 'flex' : 'none'; });
    }

    window.clearSearch = function(e) {
        if (e) e.stopPropagation();
        document.getElementById('searchInput').value = '';
        document.getElementById('clearSearch').style.display = 'none';
        refresh();
    };

    function renderChipGroup(key, title, options, fullWidth) {
        var chips = options.map(function(o) {
            var active = selectedFilters[key] === o || (!selectedFilters[key] && o === 'all');
            var isLong = o.length > 12;
            return '<div class="filter-chip ' + (active ? 'active' : '') + ' ' + (fullWidth || isLong ? 'full-width' : '') + '" onclick="selectFilter(\'' + key + '\', \'' + App.escapeHtml(o).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + '\')">' + App.escapeHtml(o === 'all' ? '全部' : o) + '</div>';
        }).join('');
        return '<div class="filter-section"><div class="filter-title">' + title + '</div><div class="filter-options">' + chips + '</div></div>';
    }

    function renderDrawer() {
        var body = document.getElementById('drawerBody');
        var categories = getOptions(function(i) { return i.category; });
        var reportUnits = getOptions(function(i) { return i.reportUnit; });

        var html = '';
        if (categories.length > 0) html += renderChipGroup('category', '地下空间类别', ['all'].concat(categories), true);
        html += renderChipGroup('hasDrainageFacility', '排水设施', ['all', '有', '无'], true);
        if (reportUnits.length > 0) html += renderChipGroup('reportUnit', '填报单位', ['all'].concat(reportUnits));

        html += '<div class="filter-section">' +
            '<div class="filter-title">填报日期</div>' +
            '<div class="date-range-row">' +
                '<input type="date" class="filter-input-field" id="drawerDateStart" value="' + App.escapeHtml(selectedFilters.reportDateStart || '') + '">' +
                '<span>至</span>' +
                '<input type="date" class="filter-input-field" id="drawerDateEnd" value="' + App.escapeHtml(selectedFilters.reportDateEnd || '') + '">' +
            '</div>' +
            '</div>';

        body.innerHTML = html;
    }

    window.selectFilter = function(key, val) {
        selectedFilters[key] = val;
        renderDrawer();
    };

    window.openDrawer = function() {
        renderDrawer();
        document.getElementById('drawerOverlay').classList.add('show');
        document.getElementById('drawer').classList.add('show');
    };

    window.closeDrawer = function() {
        document.getElementById('drawerOverlay').classList.remove('show');
        document.getElementById('drawer').classList.remove('show');
    };

    window.confirmFilters = function() {
        var startInput = document.getElementById('drawerDateStart');
        var endInput = document.getElementById('drawerDateEnd');
        if (startInput && startInput.value) selectedFilters.reportDateStart = startInput.value;
        else delete selectedFilters.reportDateStart;
        if (endInput && endInput.value) selectedFilters.reportDateEnd = endInput.value;
        else delete selectedFilters.reportDateEnd;
        renderTags();
        renderFilterDot();
        closeDrawer();
        refresh();
    };

    window.resetFilters = function() {
        selectedFilters = {};
        renderDrawer();
    };

    function init() {
        initSearch();
        renderTags();
        renderFilterDot();
        renderList();

        var now = new Date();
        document.getElementById('statusTime').textContent =
            String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    init();
})();
</script>
</body>
</html>
