<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>监测趋势</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
.monitor-detail-header { background: linear-gradient(135deg, #1a73e8 0%, #1557b0 100%); padding: 16px 18px 30px; color: #fff; position: relative; }
.monitor-detail-header .md-header-row { display: flex; align-items: center; gap: 10px; }
.monitor-detail-header .md-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.monitor-detail-header .md-name { font-size: 17px; font-weight: 700; flex: 1; }
.monitor-detail-header .md-meta { font-size: 12.5px; opacity: .9; margin-top: 6px; }
.monitor-detail-header .md-value { font-size: 30px; font-weight: 800; margin-top: 12px; }
.monitor-detail-header .md-unit { font-size: 13px; font-weight: 500; opacity: .9; }
.monitor-detail-header .md-status { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; background: rgba(255,255,255,.2); }

.md-body { margin: -16px 14px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.06); position: relative; z-index: 2; }

.time-tabs { display: flex; background: var(--bg-dark); border-radius: 6px; padding: 4px; margin-bottom: 16px; }
.time-tab { flex: 1; text-align: center; padding: 8px 0; font-size: 12px; font-weight: 500; color: var(--text-secondary); border-radius: 5px; cursor: pointer; }
.time-tab.active { background: var(--card); color: var(--primary); box-shadow: 0 2px 6px var(--shadow); }

#trendChart { width: 100%; height: 260px; }

.md-section { margin-top: 18px; }
.md-section-title { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
.md-info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.md-info-item { background: var(--bg-dark); border-radius: 6px; padding: 12px; }
.md-info-item .label { font-size: 10px; color: var(--text-secondary); margin-bottom: 4px; }
.md-info-item .value { font-size: 14px; font-weight: 700; color: var(--text-primary); }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <div class="status-bar light">
        <span class="sb-time" id="statusTime">9:41</span>
        <span class="sb-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
            <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
        </span>
    </div>

    <div class="monitor-detail-header">
        <div class="md-header-row">
            <div class="md-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="md-name" id="mdName">--</div>
        </div>
        <div class="md-meta" id="mdMeta">--</div>
        <div class="md-value"><span id="mdValue">--</span> <span class="md-unit" id="mdUnit"></span></div>
        <div class="md-status" id="mdStatus">--</div>
    </div>

    <div class="md-body">
        <div class="time-tabs">
            <div class="time-tab active" data-range="24h">24小时</div>
            <div class="time-tab" data-range="7d">7天</div>
            <div class="time-tab" data-range="30d">30天</div>
        </div>

        <div id="trendChart"></div>

        <div class="md-section">
            <div class="md-section-title">监测统计</div>
            <div class="md-info-grid">
                <div class="md-info-item">
                    <div class="label">最大值</div>
                    <div class="value" id="maxValue">--</div>
                </div>
                <div class="md-info-item">
                    <div class="label">最小值</div>
                    <div class="value" id="minValue">--</div>
                </div>
                <div class="md-info-item">
                    <div class="label">平均值</div>
                    <div class="value" id="avgValue">--</div>
                </div>
                <div class="md-info-item">
                    <div class="label">更新次数</div>
                    <div class="value" id="countValue">--</div>
                </div>
            </div>
        </div>
    </div>

    </div>
</div>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    var id = App.getQuery('id');
    var point = DataStore.monitoringPoints.find(function(m) { return m.id === id; });
    if (!point) {
        App.showToast('监测点不存在');
        setTimeout(function() { App.back(); }, 1500);
        return;
    }

    var domainName = { build: '建筑工地', gas: '燃气', traffic: '交通', curtain: '幕墙', selfbuild: '自建房', falling: '高空坠物' };
    var statusText = { green: '正常', yellow: '预警', red: '报警' };

    document.getElementById('mdName').textContent = point.name;
    document.getElementById('mdMeta').textContent = (domainName[point.domain] || point.domain) + ' · ' + point.indicator;
    document.getElementById('mdValue').textContent = point.value;
    document.getElementById('mdUnit').textContent = point.unit;
    document.getElementById('mdStatus').innerHTML = '<span class="risk-dot ' + point.status + '"></span> ' + (statusText[point.status] || point.status);

    var chart = echarts.init(document.getElementById('trendChart'));
    var currentRange = '24h';

    function getData(range) {
        var all = point.history || [];
        if (range === '24h') {
            return all.slice(-7).map(function(h) {
                return { time: h.time.substring(11, 16), value: h.value };
            });
        }
        if (range === '7d') {
            return all.slice(-7).map(function(h) {
                return { time: h.time.substring(5, 10), value: h.value };
            });
        }
        return all.map(function(h, idx) {
            if (idx % 3 !== 0) return null;
            return { time: h.time.substring(5, 10), value: h.value };
        }).filter(Boolean);
    }

    function render(range) {
        var data = getData(range);
        var values = data.map(function(d) { return d.value; });
        document.getElementById('maxValue').textContent = Math.max.apply(null, values).toFixed(2) + (point.unit || '');
        document.getElementById('minValue').textContent = Math.min.apply(null, values).toFixed(2) + (point.unit || '');
        document.getElementById('avgValue').textContent = (values.reduce(function(a,b){return a+b;},0)/values.length).toFixed(2) + (point.unit || '');
        document.getElementById('countValue').textContent = values.length;

        var color = point.status === 'red' ? '#ef4444' : (point.status === 'yellow' ? '#f59e0b' : '#22c55e');
        chart.setOption({
            grid: { left: 10, right: 10, top: 30, bottom: 20, containLabel: true },
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'category', data: data.map(function(d){ return d.time; }), axisLine: { lineStyle: { color: '#e5e7eb' } }, axisLabel: { color: '#6b7280', fontSize: 11 } },
            yAxis: { type: 'value', splitLine: { lineStyle: { color: '#f3f4f6' } }, axisLabel: { color: '#6b7280', fontSize: 11 } },
            series: [{
                data: values,
                type: 'line',
                smooth: true,
                symbol: 'circle',
                symbolSize: 6,
                lineStyle: { color: color, width: 3 },
                itemStyle: { color: color },
                areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: color + '40' }, { offset: 1, color: color + '05' }] } }
            }]
        });
    }

    document.querySelectorAll('.time-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.time-tab').forEach(function(t) { t.classList.remove('active'); });
            this.classList.add('active');
            currentRange = this.dataset.range;
            render(currentRange);
        });
    });

    render('24h');
})();
</script>
</body>
</html>
