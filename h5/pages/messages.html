<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>风险管控 · 消息</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>

.msg-hero { background:linear-gradient(135deg, #1a73e8 0%, #1557b0 100%); margin-top:-34px; padding:50px 18px 18px; color:#fff; position:relative; z-index:1; }
.msg-hero .mh-top { display:flex; align-items:center; justify-content:space-between; }
.msg-hero h1 { font-size: 19px; font-weight:700; }
.msg-hero .mh-action { font-size: 12px; opacity:.92; display:flex; align-items:center; gap:5px; }

.cat-row { margin:14px 14px 0; position:relative; z-index:3; background:var(--card); border-radius: 10px; box-shadow:0 6px 18px rgba(0,0,0,.10); border:1px solid var(--border); display:flex; padding:14px 4px; }
.cat-row .cat { flex:1; text-align:center; position:relative; }
.cat-row .cat .c-ico { width:42px; height:42px; border-radius: 5px; display:flex; align-items:center; justify-content:center; font-size: 17px; margin:0 auto 6px; }
.cat-row .cat .c-lbl { font-size: 11px; color:var(--text-primary); }
.cat-row .cat .c-badge { position:absolute; top:-4px; left:50%; margin-left:6px; min-width:17px; height:17px; padding:0 4px; background:#ff3b30; color:#fff; font-size: 9px; border-radius: 5px; display:flex; align-items:center; justify-content:center; font-weight:700; border:1.5px solid var(--card); }
.cat-row .cat .c-dot { position:absolute; top:0; left:50%; margin-left:14px; width:8px; height:8px; background:#ff3b30; border-radius:50%; border:1.5px solid var(--card); }

.sub-tabs { margin:16px 14px 0; display:flex; gap:18px; border-bottom:1px solid var(--border); }
.sub-tab { padding:8px 2px; font-size: 13px; color:var(--text2); position:relative; font-weight:500; }
.sub-tab.active { color:var(--primary); font-weight:700; }
.sub-tab.active::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:3px; border-radius:2px; background:var(--primary); }

.msg-list { margin:12px 14px 0; background:var(--card); border-radius: 10px; box-shadow:0 2px 10px var(--shadow); border:1px solid var(--border); overflow:hidden; }
.msg-item { display:flex; gap:12px; padding:14px; border-bottom:1px solid var(--border); position:relative; }
.msg-item:last-child { border-bottom:none; }
.msg-item .m-ico { width:40px; height:40px; border-radius: 3px; display:flex; align-items:center; justify-content:center; font-size: 16px; flex-shrink:0; }
.msg-item .m-body { flex:1; min-width:0; }
.msg-item .m-head { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.msg-item .m-title { font-size: 13px; font-weight:600; color:var(--text-primary); line-height:1.4; }
.msg-item .m-time { font-size: 10px; color:var(--text2); flex-shrink:0; }
.msg-item .m-desc { font-size:12.5px; color:var(--text2); margin-top:0px; line-height:1.5; }
.msg-item.unread .m-title::before { content:''; display:inline-block; width:7px; height:7px; background:#ff3b30; border-radius:50%; margin-right:6px; vertical-align:middle; }
</style>
</head>
<body>
<div class="phone-frame">
    <!-- 侧边按钮 -->
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <!-- 状态栏 -->
    <div class="status-bar light">
        <span class="sb-time" id="statusTime">9:41</span>
        <span class="sb-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
            <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
        </span>
    </div>

    <div class="msg-hero">
        <div class="mh-top">
            <h1>消息中心</h1>
            <div class="mh-action tap" id="readAll"><i class="fa-solid fa-check-double"></i> 全部已读</div>
        </div>
    </div>

    <!-- 分类入口 -->
    <div class="cat-row anim d1">
        <div class="cat tap" onclick="filterMessages('warning')">
            <div class="c-ico ic-red"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div class="c-lbl">预警信息</div>
            <span class="c-badge" id="warnBadge">3</span>
        </div>
        <div class="cat tap" onclick="filterMessages('approval')">
            <div class="c-ico ic-orange"><i class="fa-solid fa-file-circle-check"></i></div>
            <div class="c-lbl">审批结果</div>
            <span class="c-dot" id="approvalDot"></span>
        </div>
        <div class="cat tap" onclick="filterMessages('task')">
            <div class="c-ico ic-blue"><i class="fa-solid fa-list-check"></i></div>
            <div class="c-lbl">任务提醒</div>
            <span class="c-badge" id="taskBadge">2</span>
        </div>
        <div class="cat tap" onclick="filterMessages('system')">
            <div class="c-ico ic-green"><i class="fa-solid fa-bullhorn"></i></div>
            <div class="c-lbl">系统通知</div>
        </div>
    </div>

    <!-- 子 tab -->
    <div class="sub-tabs anim d2">
        <div class="sub-tab active tap" data-filter="all">全部</div>
        <div class="sub-tab tap" data-filter="unread">未读 <span style="color:var(--danger);font-size: 11px" id="unreadTabCount">5</span></div>
        <div class="sub-tab tap" data-filter="warning">预警</div>
        <div class="sub-tab tap" data-filter="task">任务</div>
    </div>

    <!-- 消息列表 -->
    <div class="msg-list anim d3" id="msgList">
        <!-- 动态填充 -->
    </div>

    <div class="bottom-spacer"></div>

    <!-- 底部标签栏 -->
    <div class="tab-bar" id="tabBar"></div>

    </div>
</div>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    var iconMap = { warning: 'fa-triangle-exclamation', approval: 'file-circle-check', task: 'fa-list-check', system: 'fa-bullhorn' };
    var colorMap = { warning: 'ic-red', approval: 'ic-orange', task: 'ic-blue', system: 'ic-green' };
    var currentFilter = 'all';

    function renderMessages(filter) {
        var list = document.getElementById('msgList');
        list.innerHTML = '';
        var items = DataStore.messages.filter(function(m) {
            if (filter === 'all') return true;
            if (filter === 'unread') return m.unread;
            return m.type === filter;
        });
        if (items.length === 0) {
            list.innerHTML = '<div class="empty-state"><i class="fa-regular fa-envelope-open"></i><div class="empty-title">暂无消息</div></div>';
            return;
        }
        items.forEach(function(msg) {
            var cls = msg.unread ? 'msg-item unread tap' : 'msg-item tap';
            var html = '<div class="' + cls + '" onclick="App.go(\'' + (msg.link || '') + '\')">' +
                '<div class="m-ico ' + colorMap[msg.type] + '"><i class="fa-solid ' + iconMap[msg.type] + '"></i></div>' +
                '<div class="m-body">' +
                '<div class="m-head"><div class="m-title">' + App.escapeHtml(msg.title) + '</div><div class="m-time">' + App.relativeTime(msg.time) + '</div></div>' +
                '<div class="m-desc">' + App.escapeHtml(msg.desc) + '</div>' +
                '</div></div>';
            list.insertAdjacentHTML('beforeend', html);
        });
    }

    window.filterMessages = function(type) {
        currentFilter = type;
        document.querySelectorAll('.sub-tab').forEach(function(t) {
            t.classList.toggle('active', t.dataset.filter === type);
        });
        renderMessages(type);
    };

    document.querySelectorAll('.sub-tab').forEach(function(t) {
        t.addEventListener('click', function() {
            filterMessages(this.dataset.filter);
        });
    });

    document.getElementById('readAll').addEventListener('click', function() {
        DataStore.markAllRead();
        App.state.unread = 0;
        document.getElementById('unreadTabCount').textContent = '0';
        document.getElementById('warnBadge').style.display = 'none';
        document.getElementById('taskBadge').style.display = 'none';
        document.getElementById('approvalDot').style.display = 'none';
        renderMessages(currentFilter);
        App.showToast('已全部标记为已读');
    });

    // 初始化徽标
    document.getElementById('unreadTabCount').textContent = DataStore.stats.unread;
    App.state = DataStore.stats;

    renderMessages('all');
    App.renderTabBar('messages');
})();
</script>
</body>
</html>
