<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>天气详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>

.wd-header { background: linear-gradient(135deg,#60a5fa 0%,#3b82f6 50%,#1d4ed8 100%); margin-top: -34px; padding: calc(34px + 4px) 18px 20px; color: #fff; position: relative; overflow: hidden; }
.wd-header::before { content: ''; position: absolute; width: 160px; height: 160px; right: -50px; top: -20px; background: radial-gradient(circle,rgba(255,255,255,.18),transparent 70%); border-radius: 50%; }
.wd-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; position: relative; z-index: 2; }
.wd-header-row { display: flex; align-items: center; gap: 10px; }
.wd-location { font-size: 12px; opacity: .9; position: relative; z-index: 2; }
.wd-main { display: flex; align-items: center; gap: 14px; margin-top: 4px; position: relative; z-index: 2; }
.wd-main i { font-size: 42px; }
.wd-temp { font-size: 38px; font-weight: 800; line-height: 1; }
.wd-range { font-size: 12px; opacity: .9; margin-top: 4px; }
.wd-desc { font-size: 12px; opacity: .85; margin-top: 4px; }

.wd-body { margin: 5px 14px 14px; position: relative; z-index: 2; }
.wd-card { background: var(--card); border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.06); border: 1px solid var(--border); overflow: hidden; }
.wd-card .detail-tabs { position: relative !important; top: auto !important; border-bottom: 1px solid var(--border); background: var(--card); padding: 0 14px; }
.wd-card .detail-body { padding: 5px 14px 14px; overflow-y: auto; scrollbar-width: none; }
.wd-card .detail-body::-webkit-scrollbar { width: 0; }

.hourly-section { margin-bottom: 16px; }
.hourly-title { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
.section-title { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
.hourly-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
.hourly-scroll::-webkit-scrollbar { height: 0; }
.hourly-item { flex-shrink: 0; width: 58px; background: var(--bg-dark); border-radius: 8px; padding: 10px 4px; text-align: center; }
.hourly-item .hi-time { font-size: 10px; color: var(--text2); }
.hourly-item .hi-icon { font-size: 17px; color: var(--primary); margin: 6px 0; }
.hourly-item .hi-temp { font-size: 13px; font-weight: 700; color: var(--text-primary); }
.hourly-item .hi-rain { font-size: 9px; color: var(--text2); margin-top: 2px; }

.realtime-list { display: flex; flex-direction: column; gap: 10px; }
.realtime-item { display: flex; align-items: center; gap: 12px; background: var(--bg-dark); border-radius: 8px; padding: 12px 14px; }
.realtime-item i { font-size: 17px; color: var(--primary); width: 24px; text-align: center; }
.realtime-item .ri-label { flex: 1; font-size: 13px; color: var(--text-primary); }
.realtime-item .ri-value { font-size: 13px; font-weight: 700; color: var(--text-primary); }

.forecast-list { display: flex; flex-direction: column; gap: 10px; }
.forecast-item { display: flex; align-items: center; gap: 12px; background: var(--bg-dark); border-radius: 8px; padding: 12px 14px; }
.forecast-item .fd-date { width: 46px; flex-shrink: 0; }
.forecast-item .fd-weekday { font-size: 11px; color: var(--text2); }
.forecast-item .fd-day { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-top: 2px; }
.forecast-item .fd-icon { width: 34px; text-align: center; font-size: 19px; color: var(--primary); flex-shrink: 0; }
.forecast-item .fd-weather { flex: 1; font-size: 13px; color: var(--text-primary); }
.forecast-item .fd-temp { width: 90px; text-align: right; font-size: 13px; font-weight: 600; color: var(--text-primary); flex-shrink: 0; }

.warning-list { display: flex; flex-direction: column; gap: 12px; }
.warning-card { background: var(--bg-dark); border-radius: 8px; padding: 14px; }
.warning-card .wc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.warning-card .wc-head i { font-size: 19px; color: var(--primary); }
.warning-card .wc-title { flex: 1; font-size: 14px; font-weight: 700; color: var(--text-primary); }
.warning-card .wc-row { display: flex; margin-bottom: 8px; font-size: 12px; }
.warning-card .wc-row:last-child { margin-bottom: 0; }
.warning-card .wc-label { color: var(--text2); width: 70px; flex-shrink: 0; }
.warning-card .wc-value { flex: 1; color: var(--text-primary); line-height: 1.5; }
.warning-card .wc-guide { background: var(--card); border-radius: 6px; padding: 10px 12px; margin-top: 10px; border: 1px solid var(--border); }
.warning-card .wc-guide li { font-size: 12.5px; color: var(--text-primary); line-height: 1.7; margin-left: 16px; margin-bottom: 4px; }
.warning-card .wc-guide li:last-child { margin-bottom: 0; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 13px; }
.empty-state i { font-size: 38px; margin-bottom: 10px; opacity: .5; }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <!-- 状态栏 -->
    <div class="status-bar light">
        <span class="sb-time" id="statusTime">9:41</span>
        <span class="sb-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
            <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
        </span>
    </div>

    <div class="wd-header">
        <div class="wd-header-row">
            <div class="wd-back tap" onclick="App.go('../index.html')"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="wd-location"><i class="fa-solid fa-location-dot"></i> <span id="wdLocation">--</span></div>
        </div>
        <div class="wd-main">
            <i class="fa-solid" id="wdIcon"></i>
            <div>
                <div class="wd-temp"><span id="wdTemp">--</span>°</div>
                <div class="wd-range"><span id="wdTempMax">--</span>° / <span id="wdTempMin">--</span>°</div>
                <div class="wd-desc" id="wdDesc">--</div>
            </div>
        </div>
    </div>

    <div class="wd-body">
        <div class="wd-card">
            <div class="detail-tabs">
                <div class="detail-tab active" data-tab="realtime">实时气象</div>
                <div class="detail-tab" data-tab="forecast">天气预报</div>
                <div class="detail-tab" data-tab="warning">气象预警</div>
            </div>

            <div class="detail-body">
                <!-- 实时气象 -->
                <div class="detail-panel active" id="tab-realtime">
                    <div class="hourly-section anim d1">
                        <div class="hourly-title">24 小时预报</div>
                        <div class="hourly-scroll" id="wdHourly">
                            <!-- 动态填充 -->
                        </div>
                    </div>
                    <div class="realtime-list anim d2" id="wdRealtime">
                        <!-- 动态填充 -->
                    </div>
                </div>

                <!-- 天气预报 -->
                <div class="detail-panel" id="tab-forecast">
                    <div class="forecast-section anim d1">
                        <div class="section-title">未来 7 天预报</div>
                        <div class="forecast-list" id="wdForecast">
                            <!-- 动态填充 -->
                        </div>
                    </div>
                </div>

                <!-- 气象预警 -->
                <div class="detail-panel" id="tab-warning">
                    <div class="warning-section anim d1">
                        <div class="section-title">气象预警信息</div>
                        <div class="warning-list" id="wdWarnings">
                            <!-- 动态填充 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-spacer"></div>
    </div>
</div>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    // 状态栏时间
    var now = new Date();
    document.getElementById('statusTime').textContent =
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

    var w = DataStore.weather;
    var c = w.current;

    // 头部当前天气
    document.getElementById('wdLocation').textContent = w.location;
    document.getElementById('wdIcon').className = 'fa-solid ' + c.icon;
    document.getElementById('wdTemp').textContent = c.temp;
    document.getElementById('wdTempMax').textContent = c.tempMax;
    document.getElementById('wdTempMin').textContent = c.tempMin;
    document.getElementById('wdDesc').textContent = c.desc;

    // 24 小时预报
    var hourlyContainer = document.getElementById('wdHourly');
    if (w.hourly && w.hourly.length) {
        hourlyContainer.innerHTML = w.hourly.map(function(item) {
            return '<div class="hourly-item">' +
                '<div class="hi-time">' + App.escapeHtml(item.time) + '</div>' +
                '<div class="hi-icon"><i class="fa-solid ' + App.escapeHtml(item.icon) + '"></i></div>' +
                '<div class="hi-temp">' + item.temp + '°</div>' +
                '<div class="hi-rain">' + App.escapeHtml(item.precipProbability) + '</div>' +
            '</div>';
        }).join('');
    }

    // 实时气象横排条
    var realtimeData = [
        { icon: 'fa-droplet', label: '湿度', value: c.humidity + '%' },
        { icon: 'fa-gauge-high', label: '气压', value: c.pressure + 'hPa' },
        { icon: 'fa-wind', label: '风速', value: c.windSpeed + 'km/h' },
        { icon: 'fa-cloud-rain', label: '降雨', value: c.rainfall + 'mm' },
        { icon: 'fa-eye', label: '能见度', value: c.visibility + 'km' },
        { icon: 'fa-compass', label: '风向', value: c.windDir }
    ];
    document.getElementById('wdRealtime').innerHTML = realtimeData.map(function(item) {
        return '<div class="realtime-item">' +
            '<i class="fa-solid ' + item.icon + '"></i>' +
            '<div class="ri-label">' + item.label + '</div>' +
            '<div class="ri-value">' + item.value + '</div>' +
        '</div>';
    }).join('');

    // 未来 7 天预报
    var forecastContainer = document.getElementById('wdForecast');
    if (w.forecast && w.forecast.length) {
        forecastContainer.innerHTML = w.forecast.map(function(item) {
            return '<div class="forecast-item">' +
                '<div class="fd-date"><div class="fd-weekday">' + App.escapeHtml(item.weekday) + '</div><div class="fd-day">' + App.escapeHtml(item.date.slice(5)) + '</div></div>' +
                '<div class="fd-icon"><i class="fa-solid ' + App.escapeHtml(item.icon) + '"></i></div>' +
                '<div class="fd-weather">' + App.escapeHtml(item.weather) + '</div>' +
                '<div class="fd-temp">' + item.tempMax + '° / ' + item.tempMin + '°</div>' +
            '</div>';
        }).join('');
    } else {
        forecastContainer.innerHTML = '<div class="empty-state"><i class="fa-solid fa-calendar-xmark"></i><div>暂无预报数据</div></div>';
    }

    // 气象预警
    var warningContainer = document.getElementById('wdWarnings');
    if (w.warnings && w.warnings.length) {
        var iconMap = {
            typhoon: 'fa-hurricane',
            rainstorm: 'fa-cloud-showers-heavy',
            gale: 'fa-wind',
            thunderstorm: 'fa-bolt',
            highTemperature: 'fa-temperature-high',
            coldWave: 'fa-snowflake'
        };
        var levelTextMap = { red: '红色', orange: '橙色', yellow: '黄色', blue: '蓝色' };
        warningContainer.innerHTML = w.warnings.map(function(item) {
            var guideHtml = (item.guide || []).map(function(g) {
                return '<li>' + App.escapeHtml(g) + '</li>';
            }).join('');
            return '<div class="warning-card">' +
                '<div class="wc-head">' +
                    '<i class="fa-solid ' + (iconMap[item.type] || 'fa-triangle-exclamation') + '"></i>' +
                    '<div class="wc-title">' + App.escapeHtml(item.label) + '</div>' +
                    '<span class="risk-badge ' + item.level + '"><span class="risk-dot ' + item.level + '"></span> ' + App.escapeHtml(levelTextMap[item.level] || item.level) + '</span>' +
                '</div>' +
                '<div class="wc-row"><div class="wc-label">发布时间</div><div class="wc-value">' + App.escapeHtml(item.publishTime || '--') + '</div></div>' +
                '<div class="wc-row"><div class="wc-label">影响区域</div><div class="wc-value">' + App.escapeHtml(item.area || '--') + '</div></div>' +
                '<div class="wc-row"><div class="wc-label">预警内容</div><div class="wc-value">' + App.escapeHtml(item.text) + '</div></div>' +
                (guideHtml ? '<div class="wc-guide"><ul>' + guideHtml + '</ul></div>' : '') +
            '</div>';
        }).join('');
    } else {
        warningContainer.innerHTML = '<div class="empty-state"><i class="fa-solid fa-check-circle"></i><div>当前无气象预警</div></div>';
    }

    // 固定内容区高度为实时气象 tab 高度，超出部分使用隐藏式滚动条
    var realtimeTab = document.getElementById('tab-realtime');
    var detailBody = document.querySelector('.wd-card .detail-body');
    if (realtimeTab && detailBody) {
        detailBody.style.height = (realtimeTab.offsetHeight + 5 + 14) + 'px';
    }

    // 标签切换
    document.querySelectorAll('.detail-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            var name = this.dataset.tab;
            document.querySelectorAll('.detail-tab').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.detail-panel').forEach(function(p) { p.classList.remove('active'); });
            this.classList.add('active');
            document.getElementById('tab-' + name).classList.add('active');
        });
    });
})();
</script>
</body>
</html>
