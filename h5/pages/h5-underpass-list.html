<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>下立交三联动</title>

<style>

.page-hero .ph-action { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; background: rgba(255,255,255,.18); border-radius: 12px; border: 1px solid rgba(255,255,255,.25); cursor: pointer; }
.page-hero .ph-action .badge-num { position: static; margin: 0; }
.page-hero .ph-sub { display: none; }
.page-hero .ph-action { position: absolute; right: 14px; top: calc(34px + 16px); transform: translateY(0); display: flex; align-items: center; height: 32px; }

.content-sheet.page-body-sheet { margin-top: 0; padding-top: 18px; border-radius: 0; box-shadow: none; border: none; background: transparent; }
.content-sheet .search-bar { align-items: center; gap: 10px; margin-top: 4px; background: transparent; box-shadow: none; border: none; padding: 0; }
.content-sheet .search-input-wrapper { display: flex; align-items: center; background: var(--card); border-radius: var(--radius); box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); min-height: 40px; }
.content-sheet .search-input-wrapper input { background: transparent; border-color: transparent; height: 40px; padding-top: 0; padding-bottom: 0; }
.content-sheet .filter-trigger {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 40px;
    padding: 0 14px;
    background: var(--card);
    color: var(--text2);
    font-size: 13px;
    font-weight: 400;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 2px 8px var(--shadow);
    cursor: pointer;
    position: relative;
    transition: all .15s;
}
.content-sheet .filter-trigger:active { transform: scale(.96); }
.content-sheet .filter-trigger .badge-num {
    position: absolute;
    top: -6px;
    right: -6px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 8px;
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--card);
    box-sizing: border-box;
}

.selected-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.tag { background: rgba(var(--primary-rgb),.08); color: var(--primary); border: 1px solid rgba(var(--primary-rgb),.18); border-radius: 999px; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.tag i { cursor: pointer; font-size: 10px; }

.risk-card-item { cursor: pointer; transition: transform .12s; }
.risk-card-item:active { transform: scale(.99); }
.risk-card-item .rc-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.risk-card-item .rc-title .risk-badge { flex-shrink: 0; margin-left: auto; }

.up-card { cursor: pointer; transition: transform .12s; background: var(--card); border-radius: 12px; box-shadow: 0 2px 10px var(--shadow); border: 1px solid var(--border); padding: 14px; margin-bottom: 12px; overflow: hidden; }
.up-card:active { transform: scale(.99); }
.up-card.high { position: relative; }
.up-card.high::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--danger); }
.upc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.upc-name { font-size: 16px; font-weight: 700; color: var(--text-primary); line-height: 1.35; flex: 1; word-break: break-word; }
.upc-badge { flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.upc-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.upc-badge.red { background: rgba(217,48,37,.12); color: var(--dot-red); }
.upc-badge.orange { background: rgba(227,116,0,.12); color: var(--dot-orange); }
.upc-badge.yellow { background: rgba(249,171,0,.15); color: #c68400; }
.upc-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 13px; color: var(--text2); }
.upc-meta i { font-size: 12px; margin-right: 2px; }
.upc-spec { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 13px; color: var(--text2); flex-wrap: wrap; }
.upc-spec i { font-size: 12px; margin-right: 4px; }
.upc-spec .sep { width: 1px; height: 12px; background: var(--border); flex-shrink: 0; }
.upc-facility { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.hw-tag { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--card); }
.hw-tag.on { background: rgba(var(--success-rgb),.1); color: var(--success); border-color: rgba(var(--success-rgb),.25); }
.hw-tag.off { background: var(--bg-dark); color: var(--text2); border-color: var(--border); }
.hw-tag.warn { background: rgba(var(--warning-rgb),.1); color: var(--warning); border-color: rgba(var(--warning-rgb),.25); }
.hw-tag.plan { background: rgba(var(--primary-rgb),.08); color: var(--primary); border-color: rgba(var(--primary-rgb),.18); }
.upc-unit { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 10px; line-height: 1.4; }
.upc-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.upc-contact { font-size: 13px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.upc-contact i { font-size: 12px; margin-right: 5px; }
.upc-contact .name { color: var(--text-primary); font-weight: 700; }
.upc-call { flex-shrink: 0; height: 44px; padding: 0 22px; background: rgba(var(--success-rgb),.1); color: var(--success); border: 1px solid rgba(var(--success-rgb),.25); border-radius: 22px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.upc-call i { font-size: 14px; }
.upc-call.hidden { display: none; }

.facility-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.facility-tag { font-size: 11px; padding: 4px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; }
.facility-tag.on { background: rgba(var(--success-rgb),.1); color: var(--success); }
.facility-tag.off { background: var(--bg-dark); color: var(--text2); }
.facility-tag.warn { background: rgba(var(--warning-rgb),.1); color: var(--warning); }
.facility-tag.plan { background: rgba(var(--primary-rgb),.08); color: var(--primary); }

.card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; margin-top: 12px; border-top: 1px solid var(--border); }
.contact-info { font-size: 13px; }
.contact-info .unit { color: var(--text2); font-size: 11px; margin-bottom: 2px; }
.contact-info .name { font-weight: 600; color: var(--text-primary); }
.call-btn { background: rgba(var(--success-rgb),.1); color: var(--success); border: 1px solid rgba(var(--success-rgb),.25); border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }

.loading { text-align: center; padding: 16px; color: var(--text2); font-size: 13px; }
.loading i { margin-right: 6px; }

.filter-section { margin-bottom: 18px; }
.filter-section .filter-title { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
.filter-section .filter-options { display: flex; flex-wrap: wrap; gap: 10px; }
.filter-chip { padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-primary); cursor: pointer; transition: all .15s; }
.filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.sheet-footer { display: flex; gap: 12px; padding-top: 16px; border-top: 1px solid var(--border); }
.sheet-footer .btn { flex: 1; height: 44px; border-radius: 10px; }

.modal-sheet {
    display: block !important;
    opacity: 0;
    pointer-events: none;
    transform: translateY(100%);
    transition: transform .25s ease, opacity .25s ease;
    z-index: 1001;
}
.modal-sheet.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
}
.modal-mask { display: none; opacity: 0; transition: opacity .25s ease; z-index: 1000; }
.modal-mask.show { display: block; opacity: 1; }

.bottom-spacer { height: 20px; }

.risk-card-item.high { position: relative; overflow: hidden; }
.risk-card-item.high::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--danger); }

:root[data-theme="dark"] .content-sheet .search-input-wrapper input { background: var(--input-bg); }
:root[data-theme="dark"] .facility-tag.off { background: var(--bg-hover); }
:root[data-theme="dark"] .hw-tag.off { background: var(--bg-hover); }
:root[data-theme="dark"] .tag { background: rgba(var(--primary-rgb),.15); border-color: rgba(var(--primary-rgb),.3); }
</style>
</head>

<div class="phone-frame">
    <div class="phone-shell">
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title">下立交三联动</div>
        </div>

        <div class="content-sheet page-body-sheet">
            <div class="search-bar">
                <div class="search-input-wrapper" style="flex:1">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="搜索名称 / 管理单位 / 派出所 / 交警">
                </div>
                <div class="filter-trigger" onclick="openDrawer()">
                    <i class="fa-solid fa-filter"></i> 筛选
                    <span class="badge-num" id="filterBadge" style="display:none">0</span>

            </div>

            <div class="selected-tags" id="selectedTags"></div>

            <div class="section-v2" id="listSection">
                <div class="sv2-head">

                    <div class="sv2-more" id="totalCount">共 15 处</div>
                </div>
                <div class="card-list" id="cardList"></div>
                <div class="loading" id="loading" style="display:none"><i class="fa-solid fa-circle-notch fa-spin"></i> 加载中…</div>
                <div class="empty-state" id="empty" style="display:none">
                    <i class="fa-regular fa-folder-open"></i>
                    <div class="empty-title">暂无数据</div>
                    <div class="empty-desc">请调整筛选或搜索条件</div>
                </div>
                <div class="bottom-spacer"></div>
            </div>
        </div>

        <!-- 筛选抽屉 -->
        <div class="modal-mask" id="drawerOverlay" onclick="closeDrawer()"></div>
        <div class="modal-sheet" id="drawer">
            <div class="sheet-header">
                <div class="sheet-title">筛选条件</div>
                <div class="sheet-close" onclick="closeDrawer()"><i class="fa-solid fa-times"></i></div>
            </div>
            <div id="drawerBody"></div>
            <div class="sheet-footer">
                <button class="btn btn-outline" onclick="resetFilters()">重置</button>
                <button class="btn btn-primary" onclick="confirmFilters()">确定</button>
            </div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

    function saveToStorage() {
        try { localStorage.setItem('underpassData', JSON.stringify(embeddedData)); } catch (e) {}
    }

    function getFilteredData() {
        var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        return embeddedData.filter(function(item) {
            if (keyword) {
                var hay = (item.name + ' ' + item.managementUnit + ' ' + (item.police1Name || '') + ' ' + (item.police2Name || '') + ' ' + (item.traffic1Name || '') + ' ' + (item.traffic2Name || '')).toLowerCase();
                if (hay.indexOf(keyword) === -1) return false;
            }
            for (var k in selectedFilters) {
                if (selectedFilters[k] && item[k] !== selectedFilters[k]) return false;
            }
            return true;
        });
    }

    function getLevelBadgeClass(level) {
        if (level === '高风险') return 'red';
        if (level === '中风险') return 'orange';
        return 'yellow';
    }

    function renderCameraBlock(item) {
        if (item.hasCamera === '有') {
            return '<span class="hw-tag on"><i class="fa-solid fa-video"></i>监控：有</span>';
        }
        return '<span class="hw-tag off"><i class="fa-solid fa-video-slash"></i>监控：无</span>';
    }

    function renderFacilityBlocks(item) {
        var pump = item.hasPumpStation === '有'
            ? '<span class="hw-tag on"><i class="fa-solid fa-faucet"></i>泵站：有</span>'
            : '<span class="hw-tag off"><i class="fa-solid fa-faucet"></i>泵站：无</span>';
        var camera = renderCameraBlock(item);
        var water = item.waterMonitor === '有'
            ? '<span class="hw-tag on"><i class="fa-solid fa-droplet"></i>积水监测：有</span>'
            : '<span class="hw-tag off"><i class="fa-solid fa-droplet-slash"></i>积水监测：无</span>';
        return pump + camera + water;
    }

    function renderCard(item) {
        var highClass = item.waterloggingLevel === '高风险' ? ' high' : '';
        var badgeClass = getLevelBadgeClass(item.waterloggingLevel);
        var meta = App.escapeHtml(item.region) + ' · ' + App.escapeHtml(item.ownership) + ' · ' + App.escapeHtml(item.trafficType);
        var spec = '<span><i class="fa-solid fa-car"></i>' + App.escapeHtml(item.laneCount) + ' 车道</span>' +
            '<span class="sep"></span>' +
            '<span><i class="fa-solid fa-ruler"></i>长度：' + App.escapeHtml(item.length) + 'm</span>' +
            '<span class="sep"></span>' +
            '<span><i class="fa-solid fa-person-walking"></i>人行地道：' + App.escapeHtml(item.pedestrianTunnel) + '</span>';
        var facility = renderFacilityBlocks(item);
        var callBtn = item.managementPhone && String(item.managementPhone).trim()
            ? '<a class="upc-call" href="tel:' + App.escapeHtml(item.managementPhone) + '" onclick="event.stopPropagation();App.showToast(\'正在呼叫 ' + App.escapeHtml(item.managementContact) + ' ' + App.escapeHtml(item.managementPhone) + '\')"><i class="fa-solid fa-phone"></i>拨打</a>'
            : '';
        return '<div class="up-card' + highClass + '" onclick="goDetail(' + item.no + ')" data-id="' + item.no + '">' +
            '<div class="upc-head">' +
                '<div class="upc-name">' + App.escapeHtml(item.name) + '</div>' +
                '<div class="upc-badge ' + badgeClass + '">' + App.escapeHtml(item.waterloggingLevel) + '</div>' +
            '</div>' +
            '<div class="upc-meta"><i class="fa-solid fa-location-dot"></i>' + meta + '</div>' +
            '<div class="upc-spec">' + spec + '</div>' +
            '<div class="upc-facility">' + facility + '</div>' +
            '<div class="upc-unit">' + App.escapeHtml(item.managementUnit) + '</div>' +
            '<div class="upc-footer">' +
                '<div class="upc-contact"><i class="fa-solid fa-user"></i>联系人：<span class="name">' + App.escapeHtml(item.managementContact) + '</span></div>' +
                callBtn +
            '</div>' +
        '</div>';
    }

    function renderList(append) {
        var data = getFilteredData();
        var container = document.getElementById('cardList');
        if (!append) container.innerHTML = '';
        document.getElementById('totalCount').textContent = '共 ' + data.length + ' 处';
        if (data.length === 0) {
            document.getElementById('empty').style.display = 'block';
            return;
        }
        document.getElementById('empty').style.display = 'none';
        var start = append ? (currentPage - 1) * pageSize : 0;
        var pageData = data.slice(start, start + pageSize);
        pageData.forEach(function(item) { container.innerHTML += renderCard(item); });
        hasMore = data.length > start + pageData.length;
    }

    window.goDetail = function(id) {
        saveToStorage();
        window.location.href = 'h5-underpass-detail.html?id=' + id;
    };

    function renderSelectedTags() {
        var container = document.getElementById('selectedTags');
        var html = '';
        var count = 0;
        for (var k in selectedFilters) {
            var val = selectedFilters[k];
            if (!val) continue;
            var cfg = filterConfig.find(function(f) { return f.key === k; });
            html += '<span class="tag">' + cfg.title + '：' + val + '<i class="fa-solid fa-times" onclick="removeFilter(\'' + k + '\')"></i></span>';
            count++;
        }
        container.innerHTML = html;
        var badge = document.getElementById('filterBadge');
        badge.textContent = count;
        badge.style.display = count > 0 ? 'flex' : 'none';
    }

    window.removeFilter = function(key) {
        selectedFilters[key] = '';
        currentPage = 1;
        renderSelectedTags();
        renderDrawer();
        renderList(false);
    };

    window.openDrawer = function() {
        document.getElementById('drawerOverlay').classList.add('show');
        document.getElementById('drawer').classList.add('show');
    };

    window.closeDrawer = function() {
        document.getElementById('drawerOverlay').classList.remove('show');
        document.getElementById('drawer').classList.remove('show');
    };

    function renderDrawer() {
        var html = '';
        filterConfig.forEach(function(cfg) {
            html += '<div class="filter-section">';
            html += '<div class="filter-title">' + cfg.title + '</div>';
            html += '<div class="filter-options">';
            cfg.options.forEach(function(opt) {
                var active = selectedFilters[cfg.key] === opt ? ' active' : '';
                html += '<span class="filter-chip' + active + '" onclick="selectChip(this, \'' + cfg.key + '\', \'' + opt + '\')">' + opt + '</span>';
            });
            html += '</div></div>';
        });
        document.getElementById('drawerBody').innerHTML = html;
    }

    window.selectChip = function(el, key, value) {
        var group = el.parentElement;
        group.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
        if (selectedFilters[key] === value) {
            selectedFilters[key] = '';
        } else {
            selectedFilters[key] = value;
            el.classList.add('active');
        }
    };

    window.confirmFilters = function() {
        currentPage = 1;
        renderSelectedTags();
        closeDrawer();
        renderList(false);
    };

    window.resetFilters = function() {
        filterConfig.forEach(function(cfg) { selectedFilters[cfg.key] = ''; });
        renderDrawer();
        confirmFilters();
    };

    function onScroll() {
        if (isLoading || !hasMore) return;
        var scrollTop = window.scrollY || document.documentElement.scrollTop;
        var scrollHeight = document.documentElement.scrollHeight;
        var clientHeight = window.innerHeight;
        if (scrollTop + clientHeight >= scrollHeight - 60) {
            isLoading = true;
            document.getElementById('loading').style.display = 'block';
            setTimeout(function() {
                currentPage++;
                renderList(true);
                isLoading = false;
                document.getElementById('loading').style.display = 'none';
            }, 600);
        }
    }

    document.getElementById('searchInput').addEventListener('input', function() {
        currentPage = 1;
        renderList(false);
    });

    window.addEventListener('scroll', onScroll);

    // 状态栏时间
    function updateTime() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        document.getElementById('statusTime').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    }
    updateTime();
    setInterval(updateTime, 60000);

    saveToStorage();
    renderDrawer();
    renderSelectedTags();
    renderList(false);
})();
</script>
