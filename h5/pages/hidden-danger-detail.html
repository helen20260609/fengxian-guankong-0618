<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>隐患详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.hd-header { background: var(--card); padding: 16px 14px; border-bottom: 1px solid var(--border); }
.hd-header .hdh-title { font-size: 16px; font-weight: 700; }
.hd-header .hdh-meta { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; }

.info-block { background: var(--card); border-radius: 10px; margin: 14px; padding: 14px; box-shadow: 0 2px 10px var(--shadow); border: 1px solid var(--border); }
.info-block .ib-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.info-block .ib-title i { color: var(--primary); }
.info-block .ib-row { display: flex; margin-bottom: 10px; font-size: 12px; }
.info-block .ib-row:last-child { margin-bottom: 0; }
.info-block .ib-label { color: var(--text2); width: 80px; flex-shrink: 0; }
.info-block .ib-value { flex: 1; color: var(--text-primary); }
.info-block .ib-value.long { line-height: 1.6; }

.timeline { padding-left: 18px; }

.photo-grid { margin-top: 10px; }
.photo-grid .empty-tip { color: var(--text2); font-size: 12px; }
.media-list { margin-top: 10px; }
.media-item { display: flex; align-items: center; gap: 8px; padding: 8px; background: var(--bg-hover); border-radius: 6px; margin-bottom: 8px; font-size: 12px; color: var(--text-primary); }
.media-item i { color: var(--primary); font-size: 14px; }

.bottom-actions { position: sticky; bottom: 0; margin-top: auto; width: 100%; max-width: 390px; padding: 12px 14px calc(12px + var(--safe-bottom)); background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 10px; z-index: 100; }
.bottom-actions .btn { flex: 1; }

.page-body-pb { padding-bottom: calc(var(--safe-bottom) + 80px); }
</style>
</head>
<body>
<div class="phone-frame">
    <!-- 侧边按钮 -->
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <!-- 状态栏 -->
    <div class="status-bar">
        <span class="sb-time" id="statusTime">9:41</span>
        <span class="sb-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
            <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
        </span>
    </div>

    <div class="nav-bar">
        <div class="nav-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
        <div class="nav-title" id="navTitle">隐患详情</div>
        <div class="nav-action"></div>
    </div>

    <div class="hd-header">
        <div class="hdh-title" id="hdTitle">--</div>
        <div class="hdh-meta">
            <span id="hdLevel">--</span>
            <span id="hdStatus">--</span>
            <span id="hdNo">--</span>
        </div>
    </div>

    <div class="page-body-pb">

        <div class="info-block anim d1">
            <div class="ib-title"><i class="fa-solid fa-circle-info"></i>基本信息</div>
            <div class="ib-row"><div class="ib-label">隐患标题</div><div class="ib-value" id="hdTitleRow">--</div></div>
            <div class="ib-row"><div class="ib-label">风险类型</div><div class="ib-value" id="hdType">--</div></div>
            <div class="ib-row"><div class="ib-label">风险等级</div><div class="ib-value" id="hdLevelRow">--</div></div>
            <div class="ib-row"><div class="ib-label">发现时间</div><div class="ib-value" id="hdTime">--</div></div>
            <div class="ib-row"><div class="ib-label">隐患地点</div><div class="ib-value" id="hdLocation">--</div></div>
            <div class="ib-row"><div class="ib-label">业务领域</div><div class="ib-value" id="hdDomain">--</div></div>
            <div class="ib-row"><div class="ib-label">位置信息</div><div class="ib-value" id="hdGps">--</div></div>
            <div class="ib-row"><div class="ib-label">上报人</div><div class="ib-value" id="hdReporter">--</div></div>
            <div class="ib-row"><div class="ib-label">责任单位</div><div class="ib-value" id="hdUnit">--</div></div>
            <div class="ib-row"><div class="ib-label">隐患描述</div><div class="ib-value long" id="hdDesc">--</div></div>
        </div>

        <div class="info-block anim d2">
            <div class="ib-title"><i class="fa-solid fa-images"></i>现场证据</div>
            <div class="photo-grid" id="evidencePhotos">
                <div class="photo-thumb" style="background:var(--bg-hover);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size: 11px">现场照片 1</div>
                <div class="photo-thumb" style="background:var(--bg-hover);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size: 11px">现场照片 2</div>
            </div>
            <div class="media-list" id="evidenceMedia"></div>
        </div>

        <div class="info-block anim d3" id="extraInfoBlock" style="display:none">
            <div class="ib-title"><i class="fa-solid fa-clipboard-list"></i>专项信息</div>
            <div id="extraInfoRows"></div>
        </div>

        <div class="info-block anim d4">
            <div class="ib-title"><i class="fa-solid fa-route"></i>处置进度</div>
            <div class="timeline" id="timeline">
                <!-- 动态填充 -->
            </div>
        </div>

    </div>

    <!-- 底部操作 -->
    <div class="bottom-actions" id="bottomActions">
        <button class="btn btn-primary" onclick="App.showToast('处置操作开发中')">处置</button>
    </div>

    <!-- 处置反馈弹窗 -->
    <div class="modal-mask" id="feedbackModal">
        <div class="modal-sheet">
            <div class="sheet-header">
                <div class="sheet-title">处置反馈</div>
                <div class="sheet-close tap" onclick="closeFeedback()"><i class="fa-solid fa-xmark"></i></div>
            </div>
            <div class="form-item" style="margin-bottom:14px">
                <label>处置措施 <span class="req">*</span></label>
                <textarea id="feedbackMeasures" placeholder="填写已采取的处置措施" style="min-height:80px"></textarea>
                <div class="error-msg" id="feedbackMeasuresError"></div>
            </div>
            <div class="form-item" style="margin-bottom:14px">
                <label>完成时间 <span class="req">*</span></label>
                <input type="datetime-local" id="feedbackTime">
                <div class="error-msg" id="feedbackTimeError"></div>
            </div>
            <div class="form-item" style="margin-bottom:14px">
                <label>现场照片</label>
                <div class="photo-grid" id="feedbackPhotos"></div>
            </div>
            <button class="btn btn-primary btn-block" onclick="submitFeedback()">提交反馈</button>
        </div>
    </div>

    </div>
</div>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    var hdId = App.getQuery('id');
    var hd = DataStore.getHiddenDanger(hdId);

    if (!hd) {
        App.showToast('隐患不存在');
        setTimeout(function() { App.back(); }, 1500);
        return;
    }

    var statusName = { reported: '待处置', auditing: '审核中', dispatched: '已分派', handling: '处置中', accepting: '验收中', closed: '已闭环', rejected: '已驳回' };
    var isPublicSource = hd.source === 'public' || (DataStore.user && DataStore.user.role === 'public');

    document.getElementById('navTitle').textContent = isPublicSource ? '反馈详情' : '隐患详情';
    document.getElementById('hdTitle').textContent = hd.title;
    document.getElementById('hdLevel').innerHTML = '<span class="risk-badge ' + hd.level + '"><span class="risk-dot ' + hd.level + '"></span> ' + levelName(hd.level) + '</span>';
    document.getElementById('hdStatus').innerHTML = '<span class="status-tag ' + statusClass(hd.status) + '">' + statusName[hd.status] + '</span>';
    document.getElementById('hdNo').innerHTML = '<i class="fa-solid fa-barcode"></i> ' + hd.eventNo;

    document.getElementById('hdTitleRow').textContent = hd.title;
    document.getElementById('hdType').textContent = hd.type || '其他';
    document.getElementById('hdLevelRow').innerHTML = '<span class="risk-badge ' + hd.level + '"><span class="risk-dot ' + hd.level + '"></span> ' + levelName(hd.level) + '</span>';
    document.getElementById('hdLocation').textContent = (hd.location && hd.location.address) ? hd.location.address : (hd.location || '未填写');
    document.getElementById('hdDomain').textContent = domainLabel(hd.domain) || '未分类';
    document.getElementById('hdGps').textContent = formatGps(hd.gps);
    document.getElementById('hdReporter').textContent = hd.reporter ? (hd.reporter.name + '（' + hd.reporter.role + '）') : '匿名';
    document.getElementById('hdTime').textContent = App.formatDate(hd.reportTime, 'yyyy-MM-dd hh:mm');
    document.getElementById('hdUnit').textContent = hd.responsibleUnit || '待分配';
    document.getElementById('hdDesc').textContent = hd.description || '未填写';

    // 现场证据
    function renderEvidence() {
        var photos = Array.isArray(hd.photos) ? hd.photos : [];
        var videos = Array.isArray(hd.videos) ? hd.videos : [];
        var audios = Array.isArray(hd.audios) ? hd.audios : [];

        var photoContainer = document.getElementById('evidencePhotos');
        if (photos.length) {
            photoContainer.innerHTML = photos.map(function(url) {
                return '<div class="photo-thumb" style="background-image:url(' + url + ')"></div>';
            }).join('');
        } else {
            photoContainer.innerHTML = '<div class="empty-tip">暂无现场照片</div>';
        }

        var mediaContainer = document.getElementById('evidenceMedia');
        var mediaHtml = '';
        if (videos.length) {
            mediaHtml += videos.map(function(v, i) {
                return '<div class="media-item"><i class="fa-solid fa-video"></i><span>现场视频 ' + (i + 1) + '（' + (v.duration || 0) + 's）</span></div>';
            }).join('');
        }
        if (audios.length) {
            mediaHtml += audios.map(function(a, i) {
                return '<div class="media-item"><i class="fa-solid fa-microphone"></i><span>现场录音 ' + (i + 1) + '（' + (a.duration || 0) + 's）</span></div>';
            }).join('');
        }
        mediaContainer.innerHTML = mediaHtml || '';
    }
    renderEvidence();

    // 专项信息
    function renderExtraInfo() {
        var extra = hd.extra || {};
        var keys = Object.keys(extra);
        if (!keys.length) return;
        var html = keys.map(function(k) {
            var item = extra[k];
            var label = (item && item.label) ? item.label : k;
            var value = (item && item.value !== undefined) ? item.value : item;
            return '<div class="ib-row"><div class="ib-label">' + App.escapeHtml(label) + '</div><div class="ib-value">' + App.escapeHtml(value) + '</div></div>';
        }).join('');
        document.getElementById('extraInfoRows').innerHTML = html;
        document.getElementById('extraInfoBlock').style.display = 'block';
    }
    renderExtraInfo();

    // 时间轴
    function renderTimeline() {
        var timeline = document.getElementById('timeline');
        timeline.innerHTML = '';
        hd.timeline.forEach(function(step) {
            var cls = step.status === 'active' ? 'tl-item active' : (step.status === 'completed' ? 'tl-item completed' : 'tl-item');
            var html = '<div class="' + cls + '" style="margin-bottom:14px">' +
                '<div class="tl-title">' + step.step + '</div>' +
                (step.time ? '<div class="tl-time">' + App.formatDate(step.time, 'MM-dd hh:mm') + ' · ' + App.escapeHtml(step.actor) + '</div>' : '') +
                '<div class="tl-desc">' + App.escapeHtml(step.action) + (step.result ? '：' + App.escapeHtml(step.result) : '') + '</div>' +
            '</div>';
            timeline.insertAdjacentHTML('beforeend', html);
        });
    }
    renderTimeline();

    // 底部按钮根据状态/角色
    var feedbackPhotos = [];
    function renderBottomActions() {
        var actions = document.getElementById('bottomActions');
        if (isPublicSource) {
            actions.innerHTML = '<button class="btn btn-outline" onclick="App.back()">返回</button>';
            return;
        }
        if (hd.status === 'closed') {
            actions.innerHTML = '<button class="btn btn-outline" onclick="App.back()">返回</button>';
        } else if (hd.status === 'reported' || hd.status === 'auditing') {
            actions.innerHTML = '<button class="btn btn-outline" onclick="transferTask()">转交</button><button class="btn btn-primary" onclick="auditPass()">审核通过</button>';
        } else {
            actions.innerHTML = '<button class="btn btn-outline" onclick="App.showToast(\'已暂存\')">暂存</button><button class="btn btn-primary" onclick="openFeedback()">处置反馈</button>';
        }
    }
    renderBottomActions();

    window.transferTask = function() {
        App.confirm('确定将该隐患转交给其他责任人处理？', function() {
            App.showLoading('提交中...');
            setTimeout(function() {
                hd.status = 'auditing';
                App.hideLoading();
                App.showToast('转交申请已提交');
                renderBottomActions();
            }, 600);
        });
    };

    window.auditPass = function() {
        App.confirm('确定审核通过并派发处置？', function() {
            App.showLoading('处理中...');
            setTimeout(function() {
                hd.status = 'dispatched';
                hd.timeline.forEach(function(step) {
                    if (step.step === '审核') {
                        step.status = 'completed';
                        step.time = new Date().toISOString();
                        step.result = '审核通过';
                    }
                    if (step.step === '分派') {
                        step.status = 'active';
                        step.time = new Date().toISOString();
                        step.result = '已派发';
                    }
                });
                App.hideLoading();
                App.showToast('审核通过，已派发');
                renderBottomActions();
                renderTimeline();
            }, 600);
        });
    };

    window.openFeedback = function() {
        App.clearFormErrors('#feedbackModal');
        document.getElementById('feedbackModal').classList.add('show');
        document.getElementById('feedbackTime').value = App.formatDate(new Date(), 'yyyy-MM-ddThh:mm');
        renderFeedbackPhotos();
    };

    window.closeFeedback = function() {
        document.getElementById('feedbackModal').classList.remove('show');
    };

    function renderFeedbackPhotos() {
        var container = document.getElementById('feedbackPhotos');
        container.innerHTML = '<div class="photo-add" onclick="takeFeedbackPhoto()"><i class="fa-solid fa-camera" style="font-size: 19px;margin-bottom:4px"></i><div>拍照</div></div>' +
            feedbackPhotos.map(function(p, i) {
                return '<div class="photo-thumb" style="background-image:url(' + p + ')"><div class="remove" onclick="removeFeedbackPhoto(' + i + ')"><i class="fa-solid fa-xmark"></i></div></div>';
            }).join('');
    }

    window.takeFeedbackPhoto = function() {
        App.takePhoto().then(function(url) {
            feedbackPhotos.push(url);
            renderFeedbackPhotos();
        });
    };

    window.removeFeedbackPhoto = function(idx) {
        App.confirm('确认删除该照片？', function() {
            feedbackPhotos.splice(idx, 1);
            renderFeedbackPhotos();
        });
    };

    window.submitFeedback = function() {
        var v = App.validateForm([
            { id: 'feedbackMeasures', name: '处置措施', rules: ['required'] },
            { id: 'feedbackTime', name: '完成时间', rules: ['required'] }
        ], '#feedbackModal');
        if (!v.valid) return;

        var measures = document.getElementById('feedbackMeasures').value.trim();
        var time = document.getElementById('feedbackTime').value;

        var btn = document.activeElement;
        if (btn) btn.disabled = true;
        App.showLoading('提交中...');
        setTimeout(function() {
            DataStore.submitDisposalFeedback(hd.id, { measures: measures, time: time, photos: feedbackPhotos });
            App.hideLoading();
            if (btn) btn.disabled = false;
            closeFeedback();
            renderTimeline();
            renderBottomActions();
            App.showToast('处置反馈已提交');
        }, 600);
    };

    function levelName(level) {
        var map = { red: '红色', orange: '橙色', yellow: '黄色', blue: '蓝色' };
        return map[level] || level;
    }

    function domainLabel(domain) {
        var map = { build: '建筑工地', gas: '燃气安全', traffic: '交通安全', curtain: '玻璃幕墙', selfbuild: '自建房' };
        return map[domain] || domain;
    }

    function statusClass(status) {
        if (['reported','auditing'].indexOf(status) !== -1) return 'pending';
        if (['dispatched','handling','accepting'].indexOf(status) !== -1) return 'handling';
        if (status === 'closed') return 'closed';
        return 'rejected';
    }

    function formatGps(gps) {
        if (!gps) return '未获取';
        if (gps.lat && gps.lng) {
            return gps.lat.toFixed(4) + ', ' + gps.lng.toFixed(4) + (gps.accuracy ? '（精度 ' + gps.accuracy + 'm）' : '');
        }
        return '未获取';
    }

    // 实时清除/校验反馈表单错误
    var feedbackFields = [
        { id: 'feedbackMeasures', name: '处置措施', rules: ['required'] },
        { id: 'feedbackTime', name: '完成时间', rules: ['required'] }
    ];
    feedbackFields.forEach(function(f) {
        var el = document.getElementById(f.id);
        if (!el) return;
        el.addEventListener('input', function() { App.clearFieldError(f.id, '#feedbackModal'); });
        el.addEventListener('blur', function() { App.validateField(f, '#feedbackModal'); });
    });
})();
</script>
</body>
</html>
