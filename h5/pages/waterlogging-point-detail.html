<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>易积水点详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.status-bar { position: relative; z-index: 100; }
.page-hero { position: relative; z-index: 99; display: flex; flex-direction: column; align-items: center; padding: calc(34px + 16px) 18px 42px; }

.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; }
.content-sheet.page-body-sheet { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 0 0 16px; background: #f5f6fa; margin-top: 0; border-radius: 0; }
.content-sheet.page-body-sheet::-webkit-scrollbar { display: none; }

.hero-card {
    background: linear-gradient(180deg, #1557b0 0%, #1a73e8 100%);
    border-radius: 12px;
    margin: 12px 16px 14px;
    padding: 18px 16px;
    color: #fff;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(26,115,232,.22);
}
.hero-card::before {
    content: '';
    position: absolute;
    width: 120px;
    height: 120px;
    right: -30px;
    top: -30px;
    background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%);
    border-radius: 50%;
}
.hero-card .point-title { font-size: 20px; font-weight: 700; position: relative; z-index: 1; line-height: 1.35; }
.hero-card .point-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
}
.hero-card .point-address {
    font-size: 13px;
    opacity: .9;
    margin-top: 8px;
    position: relative;
    z-index: 1;
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
}
.hero-card .point-address i { margin-right: 4px; }
.hero-card .point-risk {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(255,255,255,.2);
    border: 1px solid rgba(255,255,255,.3);
    position: relative;
    z-index: 1;
    flex-shrink: 0;
}
.hero-card .point-risk .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; }
.hero-card .point-responsible {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.2);
    font-size: 13px;
    opacity: .95;
    position: relative;
    z-index: 1;
}
.hero-card .point-responsible .sep {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,.7);
}

.action-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 0 16px 14px;
}
.action-grid-cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all .15s;
}
.action-grid-cell:active { transform: scale(.97); }
.action-grid-cell.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.action-grid-cell .ag-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}
.action-grid-cell .ag-icon.phone { background: rgba(30,142,62,.12); color: var(--success); }
.action-grid-cell .ag-icon.map { background: rgba(26,115,232,.1); color: var(--primary); }
.action-grid-cell .ag-label { font-size: 12px; color: var(--text-primary); font-weight: 500; }

.section-v2 { background: var(--card); border-radius: 12px; margin: 0 16px 12px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid var(--border); }
.section-v2:last-of-type { margin-bottom: 16px; }
.sv2-head { margin-bottom: 10px; }
.sv2-title { font-size: 15px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 0; position: relative; padding-left: 10px; }
.sv2-title::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--primary); }

.sc-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); gap: 16px; }
.sc-row.wrap { align-items: flex-start; }
.sc-row:last-child { border-bottom: none; padding-bottom: 0; }
.sc-label { font-size: 14px; color: var(--text2); text-align: left; line-height: 1.4; flex-shrink: 0; }
.sc-value { flex: 1; min-width: 0; font-size: 14px; color: var(--text-primary); font-weight: 500; text-align: right; line-height: 1.4; word-break: break-word; white-space: normal; }
.sc-value.phone { color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; }
.sc-value.phone i { font-size: 12px; }
.sc-value.mono { font-family: 'SF Mono', monospace; }
.sc-value.long { white-space: pre-wrap; line-height: 1.6; }
.sc-row.wrap { align-items: flex-start; }
.sc-row.wrap .sc-label { padding-top: 2px; }
.sc-row.wrap .sc-value.long { flex: 1 1 100%; margin-top: 8px; text-align: right; }

.risk-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid;
}
.risk-tag.major { color: var(--danger); border-color: rgba(217,48,37,.35); background: rgba(217,48,37,.06); }
.risk-tag.high { color: #e65100; border-color: rgba(230,81,0,.35); background: rgba(230,81,0,.06); }
.risk-tag.general { color: #c78000; border-color: rgba(199,128,0,.35); background: rgba(199,128,0,.06); }
.risk-tag.low { color: var(--primary); border-color: rgba(26,115,232,.35); background: rgba(26,115,232,.06); }
.risk-tag .dot { width: 6px; height: 6px; border-radius: 50%; }
.risk-tag.major .dot { background: var(--danger); }
.risk-tag.high .dot { background: #e65100; }
.risk-tag.general .dot { background: #c78000; }
.risk-tag.low .dot { background: var(--primary); }

.bottom-spacer { height: 20px; }

:root[data-theme="dark"] .section-v2 { background: var(--bg-card); }
:root[data-theme="dark"] .hero-card { background: linear-gradient(180deg, #0d2a5c 0%, #1a73e8 100%); }
:root[data-theme="dark"] .action-grid-cell { background: var(--bg-card); border-color: var(--border); }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title">易积水点详情</div>
        </div>

        <div class="content-sheet page-body-sheet" style="padding:0 0 16px">
            <div class="hero-card">
                <div class="point-title-wrap">
                    <div class="point-title" id="pointTitle">--</div>
                    <div class="point-risk" id="pointRisk"><span class="dot"></span>--</div>
                </div>
                <div class="point-address" id="pointAddress"><i class="fa-solid fa-location-dot"></i>--</div>
                <div class="point-responsible" id="pointResponsible">--</div>
            </div>

            <div class="action-grid">
                <div class="action-grid-cell" id="callPhoneAction">
                    <div class="ag-icon phone"><i class="fa-solid fa-phone"></i></div>
                    <div class="ag-label">拨打联系电话</div>
                </div>
                <div class="action-grid-cell" id="mapViewAction">
                    <div class="ag-icon map"><i class="fa-solid fa-map-location-dot"></i></div>
                    <div class="ag-label">在地图中查看</div>
                </div>
            </div>

            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">点位信息</div></div>
                <div id="pointInfo"></div>
            </div>

            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">整改信息</div></div>
                <div id="rectifyInfo"></div>
            </div>

            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">填报信息</div></div>
                <div id="reportInfo"></div>
            </div>

            <div class="bottom-spacer"></div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../../data/waterlogging-point-data.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    function normalizeRiskLevel(raw) {
        var v = String(raw || '').trim();
        if (v.indexOf('重大') !== -1) return '重大';
        if (v.indexOf('较大') !== -1 || v.indexOf('橙') !== -1) return '较大';
        if (v.indexOf('一般') !== -1 || v.indexOf('黄') !== -1) return '一般';
        if (v.indexOf('低') !== -1 || v.indexOf('蓝') !== -1) return '低';
        return '低';
    }

    function getRiskInfo(raw) {
        var level = normalizeRiskLevel(raw);
        var map = {
            '重大': { label: '重大风险', cls: 'major', color: '#d93025' },
            '较大': { label: '较大风险', cls: 'high', color: '#e65100' },
            '一般': { label: '一般风险', cls: 'general', color: '#c78000' },
            '低': { label: '低风险', cls: 'low', color: '#1a73e8' }
        };
        return map[level];
    }

    function loadData() {
        var id = App.getQuery('id');
        var fromStorage = null;
        try { fromStorage = JSON.parse(localStorage.getItem('waterloggingPointData') || '[]'); } catch (e) {}
        var list = (Array.isArray(fromStorage) && fromStorage.length) ? fromStorage : (typeof waterloggingPointData !== 'undefined' ? waterloggingPointData : []);
        if (id) {
            var found = list.find(function(i) { return String(i.id) === String(id); });
            if (found) return found;
        }
        return list[0];
    }

    var item = loadData() || {};
    item._riskLevel = normalizeRiskLevel(item.riskLevel);

    function getVal(v) {
        return v && String(v).trim() ? v : '—';
    }

    function renderInfoGrid(pairs) {
        return pairs.map(function(p) {
            var valueHtml = p.long
                ? '<div class="sc-value long">' + p.value + '</div>'
                : '<div class="sc-value ' + (p.cls || '') + '"' + (p.id ? ' id="' + p.id + '"' : '') + '>' + p.value + '</div>';
            return '<div class="sc-row ' + (p.long ? 'wrap' : '') + '"><div class="sc-label">' + p.label + '</div>' + valueHtml + '</div>';
        }).join('');
    }

    function renderHero() {
        document.getElementById('pointTitle').textContent = item.location || '—';
        document.getElementById('pointAddress').innerHTML = '<i class="fa-solid fa-location-dot"></i>' + App.escapeHtml(item.detailAddress || '—');
        var risk = getRiskInfo(item.riskLevel);
        document.getElementById('pointRisk').innerHTML = '<span class="dot"></span>' + App.escapeHtml(risk.label);

        var unit = item.responsibleUnit && String(item.responsibleUnit).trim() ? item.responsibleUnit : '';
        var contact = item.contactName && String(item.contactName).trim() ? item.contactName : '';
        var responsibleHtml = '';
        if (unit && contact) {
            responsibleHtml = '责任单位：' + App.escapeHtml(unit) + '<span class="sep"></span>' + App.escapeHtml(contact);
        } else if (unit) {
            responsibleHtml = '责任单位：' + App.escapeHtml(unit);
        } else if (contact) {
            responsibleHtml = '联系人：' + App.escapeHtml(contact);
        } else {
            responsibleHtml = '—';
        }
        document.getElementById('pointResponsible').innerHTML = responsibleHtml;
    }

    function renderPointInfo() {
        var risk = getRiskInfo(item.riskLevel);
        var rows = [
            { label: '易积水点位置', value: App.escapeHtml(getVal(item.location)) },
            { label: '详细地址', value: App.escapeHtml(getVal(item.detailAddress)) },
            { label: '风险等级', value: '<span class="risk-tag ' + risk.cls + '"><span class="dot"></span>' + App.escapeHtml(risk.label) + '</span>' },
            { label: '影响范围（或长度）', value: App.escapeHtml(getVal(item.impactRange)) },
            { label: '积水原因', value: App.escapeHtml(getVal(item.reason)) }
        ];
        document.getElementById('pointInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderRectifyInfo() {
        var phoneVal = item.phone && String(item.phone).trim()
            ? '<span class="phone"><i class="fa-solid fa-phone"></i> ' + App.escapeHtml(item.phone) + '</span>'
            : App.escapeHtml('—');
        var rows = [
            { label: '整改措施', value: App.escapeHtml(getVal(item.measures)) },
            { label: '责任单位', value: App.escapeHtml(getVal(item.responsibleUnit)) },
            { label: '完成时间', value: App.escapeHtml(getVal(item.completionDate)) },
            { label: '联系人', value: App.escapeHtml(getVal(item.contactName)) },
            { label: '联系电话', value: phoneVal, cls: 'phone', id: 'phoneValue' }
        ];
        document.getElementById('rectifyInfo').innerHTML = renderInfoGrid(rows);

        var phoneEl = document.getElementById('phoneValue');
        if (phoneEl && item.phone && String(item.phone).trim()) {
            phoneEl.style.cursor = 'pointer';
            phoneEl.addEventListener('click', function() {
                window.location.href = 'tel:' + item.phone;
                App.showToast('正在呼叫 ' + App.escapeHtml(item.phone));
            });
        }
    }

    function renderReportInfo() {
        var rows = [
            { label: '填报单位', value: App.escapeHtml(getVal(item.reportUnit)) },
            { label: '填报人', value: App.escapeHtml(getVal(item.reporter)) },
            { label: '填报日期', value: App.escapeHtml(getVal(item.reportDate)) }
        ];
        document.getElementById('reportInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderActions() {
        var callAction = document.getElementById('callPhoneAction');
        if (!item.phone || !String(item.phone).trim()) {
            callAction.classList.add('disabled');
        } else {
            callAction.addEventListener('click', function() {
                window.location.href = 'tel:' + item.phone;
                App.showToast('正在呼叫 ' + App.escapeHtml(item.phone));
            });
        }

        var mapAction = document.getElementById('mapViewAction');
        if (!item.lng || !item.lat || !String(item.lng).trim() || !String(item.lat).trim()) {
            mapAction.classList.add('disabled');
        } else {
            mapAction.addEventListener('click', function() {
                var url = 'https://uri.amap.com/marker?position=' + encodeURIComponent(item.lng + ',' + item.lat) +
                    '&name=' + encodeURIComponent(item.location || '易积水点') +
                    '&src=' + encodeURIComponent('奉贤风险管控');
                window.open(url, '_blank');
            });
        }
    }

    function init() {
        renderHero();
        renderPointInfo();
        renderRectifyInfo();
        renderReportInfo();
        renderActions();

        var now = new Date();
        document.getElementById('statusTime').textContent =
            String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    init();
})();
</script>
</body>
</html>
