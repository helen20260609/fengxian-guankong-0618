<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>管辖区域</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.region-page-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--card); }

.region-card { background: var(--card); border-radius: 10px; box-shadow: 0 2px 10px var(--shadow); border: 1px solid var(--border); padding: 14px; margin-bottom: 12px; }
.region-card .rc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.region-card .rc-name { font-size: 14px; font-weight: 700; }
.region-card .rc-count { font-size: 11px; color: var(--text2); }
.region-card .rc-bar { height: 6px; background: var(--bg-dark); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.region-card .rc-bar-inner { height: 100%; border-radius: 3px; }
.region-card .rc-meta { font-size: 11px; color: var(--text2); margin-top: 8px; display: flex; gap: 12px; }

.level-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: var(--font-xs); font-weight: 700; }
.level-badge.high { background: rgba(217, 48, 37, .12); color: var(--dot-red); }
.level-badge.mid { background: rgba(249, 115, 22, .12); color: var(--dot-orange); }
.level-badge.low { background: rgba(26, 115, 232, .12); color: var(--dot-blue); }

.empty-state { padding: 60px 20px; }

.hero-stats-v2 .hs-value { color: #fff; }
.page-hero .ph-sub { position: static; text-align: center; font-size: 12.5px; opacity: .85; margin-top: 40px; width: 100%; z-index: 2; }
.page-hero .hero-stats-v2 { position: relative; z-index: 2; width: 100%; margin-top: 40px; }
.page-hero .ph-action { position: absolute; right: 14px; top: calc(34px + 16px); margin: 0; display: flex; align-items: center; height: 32px; z-index: 2; }
</style>
</head>
<body>
<div class="phone-frame">
    <!-- 侧边按钮 -->
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <!-- 状态栏 -->
    <div class="status-bar light">
        <span class="sb-time" id="statusTime">9:41</span>
        <span class="sb-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
            <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
        </span>
    </div>

    <div class="page-hero">
        <div class="ph-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
        <div class="ph-title">管辖区域</div>
            <div class="ph-sub">按区域查看风险分布与巡查任务</div>
        <div class="hero-stats-v2" style="margin-top:16px">
            <div class="hs-item"><div class="hs-value" id="statRegion">--</div><div class="hs-label">管辖区域</div></div>
            <div class="hs-item"><div class="hs-value red" id="statHigh">--</div><div class="hs-label">高风险</div></div>
            <div class="hs-item"><div class="hs-value orange" id="statMid">--</div><div class="hs-label">中风险</div></div>
            <div class="hs-item"><div class="hs-value blue" id="statLow">--</div><div class="hs-label">低风险</div></div>
        </div>
    </div>

    <div class="region-page-body">
        <div class="search-bar">
            <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="搜索区域名称">
            </div>
        </div>

        <div class="split-layout">
            <div class="split-sidebar" id="regionSidebar">
                <!-- 动态填充 -->
            </div>
            <div class="split-main" id="regionMain">
                <div id="regionList">
                    <!-- 动态填充 -->
                </div>
            </div>
        </div>
    </div>

    </div>
</div>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    var regions = DataStore.regionStats[App.role] || DataStore.regionStats.inspector;
    var keyword = '';
    var currentRegion = regions[0] && regions[0].name;

    var levelColor = { high: 'var(--dot-red)', mid: 'var(--dot-orange)', low: 'var(--dot-blue)' };
    var levelText = { high: '高风险', mid: '中风险', low: '低风险' };

    function renderStats() {
        var high = regions.filter(function(r) { return r.level === 'high'; }).length;
        var mid = regions.filter(function(r) { return r.level === 'mid'; }).length;
        var low = regions.filter(function(r) { return r.level === 'low'; }).length;
        document.getElementById('statRegion').textContent = regions.length;
        document.getElementById('statHigh').textContent = high;
        document.getElementById('statMid').textContent = mid;
        document.getElementById('statLow').textContent = low;
    }

    function renderSidebar() {
        var sidebar = document.getElementById('regionSidebar');
        sidebar.innerHTML = regions.map(function(r) {
            var active = r.name === currentRegion ? ' active' : '';
            return '<div class="s-item' + active + '" data-name="' + App.escapeHtml(r.name) + '">' +
                App.escapeHtml(r.name) + '<br>' +
                '<span style="font-size: 10px;opacity:.7">' + r.count + ' 项</span>' +
                '</div>';
        }).join('');
    }

    function renderList() {
        var container = document.getElementById('regionList');
        var list = regions.filter(function(r) {
            if (keyword) return r.name.toLowerCase().indexOf(keyword.toLowerCase()) !== -1;
            return currentRegion === 'all' || r.name === currentRegion;
        });

        if (list.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fa-regular fa-map"></i><div class="empty-title">未找到相关区域</div></div>';
            return;
        }

        var maxCount = Math.max.apply(null, regions.map(function(r) { return r.count; }));
        container.innerHTML = list.map(function(r, idx) {
            var percent = Math.round(r.count / maxCount * 100);
            var taskCount = Math.max(1, Math.round(r.count / 3));
            return '<div class="region-card tap anim d' + (idx % 5 + 1) + '" onclick="App.go(\'one-map.html?region=' + encodeURIComponent(r.name) + '\')">' +
                '<div class="rc-header">' +
                '<div class="rc-name"><i class="fa-solid fa-location-dot" style="color:var(--primary);margin-right:6px"></i>' + App.escapeHtml(r.name) + '</div>' +
                '<span class="level-badge ' + r.level + '">' + levelText[r.level] + '</span>' +
                '</div>' +
                '<div class="rc-meta">' +
                '<span><i class="fa-solid fa-triangle-exclamation"></i> 风险 ' + r.count + ' 项</span>' +
                '<span><i class="fa-solid fa-clipboard-check"></i> 任务 ' + taskCount + ' 项</span>' +
                '</div>' +
                '<div class="rc-bar"><div class="rc-bar-inner" style="width:' + percent + '%;background:' + levelColor[r.level] + '"></div></div>' +
                '</div>';
        }).join('');
    }

    document.getElementById('regionSidebar').addEventListener('click', function(e) {
        var item = e.target.closest('.s-item');
        if (!item) return;
        document.querySelectorAll('.s-item').forEach(function(s) { s.classList.remove('active'); });
        item.classList.add('active');
        currentRegion = item.dataset.name;
        renderList();
    });

    document.getElementById('searchInput').addEventListener('input', App.debounce(function() {
        keyword = this.value.trim();
        currentRegion = keyword ? 'all' : (regions[0] && regions[0].name);
        renderSidebar();
        renderList();
    }, 400));

    renderStats();
    renderSidebar();
    renderList();
})();
</script>
</body>
</html>
