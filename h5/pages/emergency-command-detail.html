<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>应急指挥机构详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>

.status-bar { position: relative; z-index: 100; }.page-hero { position: relative; z-index: 99; display: flex; flex-direction: column; align-items: center; padding: calc(34px + 16px) 18px 42px; }

.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; }
.content-sheet.page-body-sheet { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 0 0 16px; background: #f5f6fa; margin-top: 0; border-radius: 0; }
.content-sheet.page-body-sheet::-webkit-scrollbar { display: none; }

.hero-card {
    background: linear-gradient(180deg, #1557b0 0%, #1a73e8 100%);
    border-radius: 16px;
    margin: 12px 16px 14px;
    padding: 24px 20px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 6px 18px rgba(26,115,232,.22);
    position: relative;
    overflow: hidden;
}
.hero-card .org-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #fff;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
}
.hero-card .org-title {
    font-size: 18px;
    font-weight: 500;
    position: relative;
    z-index: 1;
}

.action-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 0 16px 14px;
}
.action-grid-cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all .15s;
}
.action-grid-cell:active { transform: scale(.97); }
.action-grid-cell.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.action-grid-cell .ag-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}
.action-grid-cell .ag-icon.phone { background: rgba(30,142,62,.12); color: var(--success); }
.action-grid-cell .ag-icon.fax { background: rgba(26,115,232,.1); color: var(--primary); }
.action-grid-cell .ag-icon.fax.disabled { background: var(--bg-hover); color: var(--text2); }
.action-grid-cell .ag-icon.addr { background: rgba(0,151,167,.1); color: #0097a7; }
.action-grid-cell .ag-icon.addr.disabled { background: var(--bg-hover); color: var(--text2); }
.action-grid-cell .ag-label { font-size: 12px; color: var(--text-primary); font-weight: 500; }
.action-grid-cell .ag-label.disabled { color: var(--text2); }

.section-v2 { background: #fff; border-radius: 12px; margin: 0 16px 12px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.section-v2:last-of-type { margin-bottom: 16px; }
.sv2-head { margin-bottom: 10px; }
.sv2-title { font-size: 15px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 0; position: relative; padding-left: 10px; }
.sv2-title::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--primary); }
.sv2-title i { display: none; }

.sc-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #f2f2f2; gap: 16px; }
.sc-row:last-child { border-bottom: none; padding-bottom: 0; }
.sc-row.wrap { align-items: flex-start; }
.sc-label { font-size: 14px; color: var(--text2); text-align: left; line-height: 1.4; flex-shrink: 0; }
.sc-value { flex: 1; min-width: 0; font-size: 14px; color: var(--text-primary); font-weight: 500; text-align: right; line-height: 1.4; word-break: break-word; }
.sc-value.phone { color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; }
.sc-value.phone i { font-size: 12px; }
.sc-value.na { color: var(--text2); }

.report-info { margin-top: 12px; padding-top: 12px; border-top: 1px solid #f2f2f2; }

.bottom-spacer { height: 20px; }

:root[data-theme="dark"] .section-v2 { background: var(--bg-card); }
:root[data-theme="dark"] .hero-card { background: linear-gradient(180deg, #0d2a5c 0%, #1a73e8 100%); }
:root[data-theme="dark"] .action-grid-cell { background: var(--bg-card); border-color: var(--border); }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title" id="heroName">机构详情</div>
        </div>

        <div class="content-sheet page-body-sheet" style="padding:0 0 16px">
            <!-- 头部蓝色渐变卡片 -->
            <div class="hero-card">
                <div class="org-icon"><i class="fa-solid fa-building-columns"></i></div>
                <div class="org-title" id="orgTitle">--</div>
            </div>

            <!-- 快捷操作三宫格 -->
            <div class="action-grid">
                <div class="action-grid-cell" id="callAction">
                    <div class="ag-icon phone"><i class="fa-solid fa-phone"></i></div>
                    <div class="ag-label">拨打电话</div>
                </div>
                <div class="action-grid-cell" id="faxAction">
                    <div class="ag-icon fax" id="faxIcon"><i class="fa-solid fa-fax"></i></div>
                    <div class="ag-label" id="faxLabel">复制传真号</div>
                </div>
                <div class="action-grid-cell" id="addrAction">
                    <div class="ag-icon addr" id="addrIcon"><i class="fa-solid fa-location-dot"></i></div>
                    <div class="ag-label" id="addrLabel">复制地址</div>
                </div>
            </div>

            <!-- 通讯信息卡片 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">通讯信息</div></div>
                <div id="contactInfo"></div>
            </div>

            <!-- 填报信息卡片 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">填报信息</div></div>
                <div id="reportInfo"></div>
            </div>

            <div class="bottom-spacer"></div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    var embeddedData = [
        { no: '1', orgName: '区防汛指挥部办公室', officePhone: '021-67180001', faxPhone: '021-67180010', location: '奉贤区南桥镇解放东路928号', reportUnit: '区防汛指挥部', reporter: '王亮', reportDate: '2026-03-18' },
        { no: '2', orgName: '区政府应急管理办公室', officePhone: '021-67180002', faxPhone: '021-67180020', location: '奉贤区南桥镇解放东路928号', reportUnit: '区政府应急办', reporter: '李娜', reportDate: '2026-03-18' },
        { no: '3', orgName: '应急值班室', officePhone: '021-67180003', faxPhone: '021-67180030', location: '奉贤区南桥镇解放东路928号', reportUnit: '区防汛指挥部', reporter: '张伟', reportDate: '2026-03-18' }
    ];

    function loadData() {
        var id = App.getQuery('id');
        var fromStorage = null;
        try { fromStorage = JSON.parse(localStorage.getItem('emergencyCommandData') || '[]'); } catch (e) {}
        var list = Array.isArray(fromStorage) && fromStorage.length ? fromStorage : embeddedData;
        if (id) {
            var found = list.find(function(i) { return i.no === id; });
            if (found) return found;
        }
        return embeddedData[0];
    }

    var item = loadData();

    function getVal(v) {
        return v && String(v).trim() ? v : '—';
    }

    function renderInfoGrid(pairs) {
        return pairs.map(function(p) {
            return '<div class="sc-row"><div class="sc-label">' + p.label + '</div><div class="sc-value ' + (p.cls || '') + '"' + (p.id ? ' id="' + p.id + '"' : '') + '>' + p.value + '</div></div>';
        }).join('');
    }

    function renderContactInfo() {
        var rows = [
            { label: '机构名称', value: App.escapeHtml(getVal(item.orgName)) },
            { label: '办公电话', value: App.escapeHtml(getVal(item.officePhone)), cls: 'phone' },
            { label: '传真电话', value: App.escapeHtml(getVal(item.faxPhone)) },
            { label: '设置地点', value: App.escapeHtml(getVal(item.location)) }
        ];
        document.getElementById('contactInfo').innerHTML = renderInfoGrid(rows);

        // 办公电话可点击拨打
        var phoneValue = document.querySelector('#contactInfo .sc-value.phone');
        if (phoneValue && item.officePhone) {
            phoneValue.innerHTML = '<i class="fa-solid fa-phone"></i> ' + App.escapeHtml(item.officePhone);
            phoneValue.style.cursor = 'pointer';
            phoneValue.addEventListener('click', function() {
                window.location.href = 'tel:' + item.officePhone;
                App.showToast('正在呼叫 ' + App.escapeHtml(item.orgName) + ' ' + App.escapeHtml(item.officePhone));
            });
        }
    }

    function renderReportInfo() {
        var rows = [
            { label: '填报单位', value: App.escapeHtml(getVal(item.reportUnit)) },
            { label: '填报人', value: App.escapeHtml(getVal(item.reporter)) },
            { label: '填报日期', value: App.escapeHtml(getVal(item.reportDate)) }
        ];
        document.getElementById('reportInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderHero() {
        document.getElementById('heroName').textContent = item.orgName || '机构详情';
        document.getElementById('orgTitle').textContent = item.orgName || '--';
    }

    function copyToClipboard(text, successMsg) {
        if (!text || !String(text).trim()) return;
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(function() {
                App.showToast(successMsg);
            }).catch(function() {
                fallbackCopy(text, successMsg);
            });
        } else {
            fallbackCopy(text, successMsg);
        }
    }

    function fallbackCopy(text, successMsg) {
        var input = document.createElement('input');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        try { document.execCommand('copy'); App.showToast(successMsg); } catch (e) {}
        document.body.removeChild(input);
    }

    function renderActions() {
        // 拨打电话
        var callAction = document.getElementById('callAction');
        callAction.addEventListener('click', function() {
            if (!item.officePhone) return;
            window.location.href = 'tel:' + item.officePhone;
            App.showToast('正在呼叫 ' + App.escapeHtml(item.orgName) + ' ' + App.escapeHtml(item.officePhone));
        });

        // 复制传真号
        var faxAction = document.getElementById('faxAction');
        var faxIcon = document.getElementById('faxIcon');
        var faxLabel = document.getElementById('faxLabel');
        if (!item.faxPhone || !String(item.faxPhone).trim()) {
            faxAction.classList.add('disabled');
            faxIcon.classList.add('disabled');
            faxLabel.classList.add('disabled');
        } else {
            faxAction.addEventListener('click', function() {
                copyToClipboard(item.faxPhone, '传真号码已复制');
            });
        }

        // 复制地址
        var addrAction = document.getElementById('addrAction');
        var addrIcon = document.getElementById('addrIcon');
        var addrLabel = document.getElementById('addrLabel');
        if (!item.location || !String(item.location).trim()) {
            addrAction.classList.add('disabled');
            addrIcon.classList.add('disabled');
            addrLabel.classList.add('disabled');
        } else {
            addrAction.addEventListener('click', function() {
                copyToClipboard(item.location, '地址已复制');
            });
        }
    }

    function updateTime() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        document.getElementById('statusTime').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    }
    updateTime();
    setInterval(updateTime, 60000);

    renderHero();
    renderActions();
    renderContactInfo();
    renderReportInfo();
})();
</script>
</body>
</html>
