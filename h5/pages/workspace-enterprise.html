<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>风险管控 · 企业工作台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>

.ws-hero { background:linear-gradient(135deg, #1a73e8 0%, #1557b0 100%); padding:16px 18px 22px; color:#fff; }
.ws-hero h1 { font-size: 19px; font-weight:700; }
.ws-hero p { font-size:12.5px; opacity:.85; margin-top:5px; }

.ws-group { margin:18px 14px 0; }
.ws-group-title { font-size: 12px; font-weight:700; color:var(--text2); margin-bottom:10px; display:flex; align-items:center; gap:6px; }
.ws-group-title i { color:var(--primary); font-size: 11px; }
.ws-grid { background:var(--card); border-radius: 10px; box-shadow:0 2px 10px var(--shadow); border:1px solid var(--border); padding:6px; display:grid; grid-template-columns:repeat(4,1fr); row-gap:14px; }
.ws-grid .fn-item { display:flex; flex-direction:column; align-items:center; gap:7px; position:relative; padding:8px 0; }
.ws-grid .fn-item .fn-icon { width:44px; height:44px; border-radius: 10px; display:flex; align-items:center; justify-content:center; font-size: 18px; color:var(--primary); background:rgba(var(--primary-rgb),.08); border:1px solid rgba(var(--primary-rgb),.15); }
.ws-grid .fn-item .fn-label { font-size: 11px; }
</style>
</head>
<body>
<div class="phone-frame">
    <!-- 侧边按钮 -->
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <!-- 状态栏 -->
    <div class="status-bar light">
        <span class="sb-time" id="statusTime">9:41</span>
        <span class="sb-icons">
            <i class="fa-regular fa-signal"></i>
            <i class="fa-regular fa-wifi" style="margin-left:4px"></i>
            <i class="fa-regular fa-battery-full" style="margin-left:4px"></i>
        </span>
    </div>

    <div class="ws-hero anim">
        <h1>企业工作台</h1>
        <p>聚合企业安全自查与整改功能</p>
    </div>

    <!-- 常用应用（可编辑，与首页共享） -->
    <div class="manager-apps anim d2" id="managerApps">
        <div class="ma-head">
            <div class="ma-title"><i class="fa-solid fa-table-cells" style="margin-right:6px"></i>常用应用</div>
            <div class="ma-edit tap" onclick="openAppEditor()">编辑</div>
        </div>
        <div class="ma-grid" id="managerAppGrid">
            <!-- 动态填充 -->
        </div>
    </div>

    <!-- 应用编辑弹窗 -->
    <div class="app-editor-mask" id="appEditorMask" onclick="closeAppEditor(event)">
        <div class="app-editor-sheet" onclick="event.stopPropagation()">
            <div class="ae-head">
                <div class="ae-title">添加常用应用</div>
                <div class="ae-close tap" onclick="closeAppEditor()"><i class="fa-regular fa-xmark"></i></div>
            </div>
            <div class="ae-grid" id="appEditorGrid">
                <!-- 动态填充 -->
            </div>
            <button class="btn btn-primary btn-block" style="margin-top:16px" onclick="saveManagerApps()">保存</button>
        </div>
    </div>

    <!-- 企业安全 -->
    <div class="ws-group anim d3">
        <div class="ws-group-title"><i class="fa-regular fa-building"></i>企业安全</div>
        <div class="ws-grid">
            <div class="fn-item tap" onclick="App.go('risk-list.html')">
                <div class="fn-icon"><i class="fa-regular fa-book-open"></i></div>
                <div class="fn-label">风险清单</div>
            </div>
            <div class="fn-item tap" onclick="App.go('hidden-danger-report.html')">
                <div class="fn-icon"><i class="fa-regular fa-triangle-exclamation"></i></div>
                <div class="fn-label">隐患上报</div>
            </div>
            <div class="fn-item tap" onclick="App.go('hidden-danger-list.html')">
                <div class="fn-icon"><i class="fa-regular fa-reply"></i></div>
                <div class="fn-label">整改反馈</div>
            </div>
            <div class="fn-item tap" onclick="App.go('inspection-execute.html')">
                <div class="fn-icon"><i class="fa-regular fa-clipboard-check"></i></div>
                <div class="fn-label">自查填报</div>
            </div>
            <div class="fn-item tap" onclick="App.go('knowledge-laws.html')">
                <div class="fn-icon"><i class="fa-regular fa-scale-balanced"></i></div>
                <div class="fn-label">知识栏目</div>
            </div>
        </div>
    </div>

    <div class="bottom-spacer"></div>

    <!-- 底部标签栏 -->
    <div class="tab-bar" id="tabBar"></div>

    </div>
</div>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    // 本页为企业人员工作台，固定角色为 enterprise
    App.setRole('enterprise');

    // 状态栏时间
    var now = new Date();
    document.getElementById('statusTime').textContent =
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

    App.state = DataStore.stats;

    // 常用应用（按当前角色派发）
    var selectedAppIds = App.getHomeApps(App.role);

    function renderManagerApps() {
        var grid = document.getElementById('managerAppGrid');
        var appIds = App.getHomeApps(App.role);
        var apps = App.getHomeAppPool(App.role).filter(function(app) { return appIds.indexOf(app.id) !== -1; });
        if (!apps.length) {
            grid.innerHTML = '<div class="empty-state-sm" style="grid-column:1/-1;padding:20px">点击「编辑」添加常用应用</div>';
            return;
        }
        grid.innerHTML = apps.map(function(app) {
            return '<div class="ma-item tap" onclick="App.go(\'' + app.href + '\')">' +
                '<i class="fa-regular ' + app.icon + '"></i>' +
                '<span>' + App.escapeHtml(app.label) + '</span>' +
            '</div>';
        }).join('');
    }

    window.openAppEditor = function() {
        selectedAppIds = App.getHomeApps(App.role);
        var grid = document.getElementById('appEditorGrid');
        grid.innerHTML = App.getHomeAppPool(App.role).map(function(app) {
            var selected = selectedAppIds.indexOf(app.id) !== -1;
            return '<div class="ae-item ' + (selected ? 'selected' : '') + ' tap" data-id="' + app.id + '" onclick="toggleApp(this, \'' + app.id + '\')">' +
                '<div class="ae-check"><i class="fa-regular fa-check"></i></div>' +
                '<i class="fa-regular ' + app.icon + '"></i>' +
                '<span>' + App.escapeHtml(app.label) + '</span>' +
            '</div>';
        }).join('');
        document.getElementById('appEditorMask').classList.add('show');
    };

    window.closeAppEditor = function(e) {
        if (e && !e.target.classList.contains('app-editor-mask')) return;
        document.getElementById('appEditorMask').classList.remove('show');
    };

    window.toggleApp = function(el, id) {
        el.classList.toggle('selected');
        var idx = selectedAppIds.indexOf(id);
        if (idx === -1) {
            selectedAppIds.push(id);
        } else {
            selectedAppIds.splice(idx, 1);
        }
    };

    window.saveManagerApps = function() {
        var btn = document.activeElement;
        if (btn) btn.disabled = true;
        App.showLoading('保存中...');
        setTimeout(function() {
            App.setHomeApps(selectedAppIds, App.role);
            renderManagerApps();
            closeAppEditor();
            App.hideLoading();
            if (btn) btn.disabled = false;
            App.showToast('常用应用已保存');
        }, 600);
    };

    renderManagerApps();
    App.renderTabBar('workspace');

    // 若从首页“编辑”跳转而来，自动打开应用编辑器
    if (new URLSearchParams(window.location.search).get('mode') === 'edit') {
        openAppEditor();
    }
})();
</script>
</body>
</html>
