<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>风险管控 · 巡查工作台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>

/* 顶部固定区：渐变蓝底 */
.top-sticky {
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
}
.top-sticky .status-bar { background: transparent; color: #fff; position: relative; z-index: 100; }

/* 工作台头部 */
.ws-header {
    background: transparent;
    padding: 8px 14px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.ws-title { font-size: 20px; font-weight: 700; color: #fff; }
.ws-header-right { display: flex; align-items: center; gap: 14px; }
.ws-header-right .h-icon {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #fff; cursor: pointer;
}

/* 可滚动内容区 */
.ws-body { flex: 1; overflow-y: auto; overflow-x: hidden; background: #f5f6fa; -webkit-overflow-scrolling: touch; }
.ws-body::-webkit-scrollbar { display: none; }
.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; }

.tab-bar {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    max-width: none;
    z-index: 100;
}
.ws-body { padding-bottom: calc(var(--tab-bar-height) + var(--safe-bottom, 0px) + 10px); }

/* 常用应用 */
.fav-section { background: #fff; padding: 18px 14px 12px; margin-bottom: 10px; }
.fav-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.fav-title { font-size: 16px; font-weight: 700; color: var(--text-primary); }
.fav-grid { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 18px; column-gap: 10px; }
.fav-item { display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; cursor: pointer; }
.fav-item .fi-icon {
    width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.08);
}
.fav-item .fi-icon.add { background: #f2f3f5; color: #909399; border: 1px dashed #c0c4cc; box-shadow: none; }
.fav-item .fi-label { font-size: 12px; color: var(--text-primary); text-align: center; line-height: 1.2; }
.fav-item .fi-dot { position: absolute; top: 0; right: 50%; margin-right: -22px; width: 8px; height: 8px; background: #ff3b30; border-radius: 50%; border: 1.5px solid #fff; }

/* 全部应用 */
.all-section { background: #fff; padding: 18px 0 12px; }
.all-head { display: flex; align-items: center; justify-content: space-between; margin: 0 14px 12px; }
.all-title { font-size: 16px; font-weight: 700; color: var(--text-primary); }

/* 分类 Tab - 下划线风格 */
.cat-tabs-wrap {
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
}
.cat-tabs {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    padding: 0 14px;
    scrollbar-width: none;
    white-space: nowrap;
    align-items: center;
    flex: 1;
}
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab {
    padding: 12px 0 10px;
    font-size: 14px;
    color: var(--text2);
    cursor: pointer;
    transition: all .2s;
    flex-shrink: 0;
    position: relative;
    font-weight: 500;
}
.cat-tab.active {
    color: var(--primary);
    font-weight: 700;
}
.cat-tab.active::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    border-radius: 2px 2px 0 0;
    background: var(--primary);
}

/* 分类菜单按钮 */
.cat-menu {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-primary);
    font-size: 18px;
    border-left: 1px solid var(--border);
    flex-shrink: 0;
}

/* 应用网格 */
.app-grid { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 18px; column-gap: 10px; padding: 16px 14px 0; }
.app-item { display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; cursor: pointer; }
.app-item .ai-icon {
    width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.08);
}
.app-item .ai-label { font-size: 12px; color: var(--text-primary); text-align: center; line-height: 1.2; }
.app-item .ai-dot { position: absolute; top: 0; right: 50%; margin-right: -20px; width: 8px; height: 8px; background: #ff3b30; border-radius: 50%; border: 1.5px solid #fff; }

/* 颜色 */
.bg-blue { background: linear-gradient(135deg, #5b8ff9, #3b6fd9); }
.bg-indigo { background: linear-gradient(135deg, #7a8cf6, #5766d3); }
.bg-purple { background: linear-gradient(135deg, #9c7bef, #7c5ed6); }
.bg-orange { background: linear-gradient(135deg, #ff9f43, #f07b3f); }
.bg-coral { background: linear-gradient(135deg, #ff6b6b, #ee5a6f); }
.bg-green { background: linear-gradient(135deg, #52c41a, #389e0d); }
.bg-teal { background: linear-gradient(135deg, #13c2c2, #08979c); }
.bg-cyan { background: linear-gradient(135deg, #36cfc9, #08979c); }
.bg-pink { background: linear-gradient(135deg, #ff85c0, #eb2f96); }
.bg-amber { background: linear-gradient(135deg, #ffc53d, #faad14); }
.bg-slate { background: linear-gradient(135deg, #6b7c93, #4a5568); }

/* 添加到首页模式 */
.add-home-btn { position: absolute; top: -4px; right: 50%; margin-right: -22px; width: 18px; height: 18px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 10px; display: none; align-items: center; justify-content: center; z-index: 2; border: 1.5px solid #fff; cursor: pointer; }
.add-home-btn.added { background: var(--success); }
body.add-to-home .add-home-btn { display: flex; }
body.add-to-home .fav-item, body.add-to-home .app-item { padding-top: 8px; }

/* 添加到首页提示条 */
.add-to-home-bar { margin: 14px 14px 0; background: linear-gradient(135deg,var(--primary),var(--secondary)); border-radius: 8px; padding: 12px 14px; color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.add-to-home-bar i { margin: 0 4px; }
.add-to-home-bar .btn { padding: 6px 14px; border-radius: 5px; border: none; background: #fff; color: var(--primary); font-size: 12px; font-weight: 600; cursor: pointer; }

/* 分类弹窗 */
.cat-sheet .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.cat-sheet .cat-item { padding: 14px; border-radius: 10px; background: #f2f3f5; text-align: center; font-size: 13px; color: var(--text-primary); cursor: pointer; transition: all .15s; border: 1px solid transparent; }
.cat-sheet .cat-item.active { background: rgba(var(--primary-rgb),.12); color: var(--primary); border-color: rgba(var(--primary-rgb),.3); font-weight: 700; }

/* 搜索占位 */
.search-bar-mini { margin: 14px 14px 0; background: #f2f3f5; border-radius: 18px; padding: 8px 14px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); }

.bottom-spacer { height: 20px; }

</style>
</head>
<body>
<div class="phone-frame">
    <!-- 侧边按钮 -->
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <!-- 状态栏 + 头部 -->
    <div class="top-sticky">
        <div class="status-bar">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="ws-header">
            <div class="ws-title">工作台</div>
            <div class="ws-header-right">
                <div class="h-icon tap" onclick="App.showToast('搜索')"><i class="fa-solid fa-magnifying-glass"></i></div>
                <div class="h-icon tap" onclick="App.go('workspace-inspector-settings.html')"><i class="fa-solid fa-gear"></i></div>
            </div>
        </div>
    </div>

    <!-- 添加到首页提示条 -->
    <div class="add-to-home-bar" id="addToHomeBar" style="display:none">
        <span>点击下方 <i class="fa-solid fa-plus"></i> 将功能添加到首页常用功能</span>
        <button class="btn" onclick="finishAddToHome()">完成</button>
    </div>

    <!-- 可滚动内容区 -->
    <div class="ws-body" id="wsBody">

        <!-- 常用应用 -->
        <div class="fav-section anim d1">
            <div class="fav-head">
                <div class="fav-title">常用应用</div>
            </div>
            <div class="fav-grid" id="favGrid"></div>
        </div>

        <!-- 全部应用 -->
        <div class="all-section anim d2">
            <div class="all-head">
                <div class="all-title">全部应用</div>
            </div>
            <div class="cat-tabs-wrap">
                <div class="cat-tabs" id="catTabs"></div>
                <div class="cat-menu tap" onclick="openCatSheet()"><i class="fa-solid fa-bars"></i></div>
            </div>
            <div class="app-grid" id="appGrid"></div>
            <div class="bottom-spacer"></div>
        </div>

        <!-- 分类弹窗 -->
        <div class="modal-mask" id="catMask" onclick="closeCatSheet(event)">
            <div class="modal-sheet cat-sheet" onclick="event.stopPropagation()">
                <div class="sheet-header">
                    <div class="sheet-title">应用分类</div>
                    <div class="sheet-close tap" onclick="closeCatSheet()"><i class="fa-solid fa-xmark"></i></div>
                </div>
                <div class="cat-grid" id="catGrid"></div>
            </div>
        </div>

        <!-- 底部标签栏 -->
        <div class="tab-bar" id="tabBar"></div>

    </div>
</div>

<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    // 本页为巡查人员工作台，固定角色为 inspector
    App.setRole('inspector');

    // 状态栏时间
    var now = new Date();
    document.getElementById('statusTime').textContent =
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

    App.state = DataStore.stats;

    // 应用数据
    var categories = [
        { id: 'recent', label: '最近使用', icon: 'fa-clock-rotate-left' },
        { id: 'flood', label: '防汛防台', icon: 'fa-cloud-showers-heavy' },
        { id: 'patrol', label: '巡查业务', icon: 'fa-hard-hat' },
        { id: 'risk', label: '区域风险', icon: 'fa-location-dot' },
        { id: 'assist', label: '巡查辅助', icon: 'fa-route' }
    ];

    var apps = [
        { id: 'emergency-leadership', label: '应急领导小组', icon: 'fa-users', color: 'bg-blue', category: 'flood', href: 'pages/emergency-leadership-list.html' },
        { id: 'emergency-command', label: '应急指挥机构', icon: 'fa-address-book', color: 'bg-indigo', category: 'flood', href: 'pages/emergency-command-list.html' },
        { id: 'response-command', label: '分级响应指挥', icon: 'fa-layer-group', color: 'bg-purple', category: 'flood', href: 'pages/response-command-list.html' },
        { id: 'emergency-duty', label: '应急值班信息', icon: 'fa-user-clock', color: 'bg-blue', category: 'flood', href: 'pages/emergency-duty.html' },
        { id: 'flood-risk-point', label: '防汛风险点位', icon: 'fa-droplet', color: 'bg-cyan', category: 'flood', href: 'pages/flood-risk-point-list.html' },
        { id: 'waterlogging-point', label: '易积水点位', icon: 'fa-water', color: 'bg-cyan', category: 'flood', href: 'pages/waterlogging-point-list.html' },
        { id: 'key-guarantee', label: '重点保障区域', icon: 'fa-shield-halved', color: 'bg-orange', category: 'flood', href: 'h5-key-guarantee-list.html' },
        { id: 'underpass', label: '下立交信息', icon: 'fa-road-bridge', color: 'bg-orange', category: 'flood', href: 'pages/underpass-list.html' },
        { id: 'underground-space', label: '地下空间', icon: 'fa-building', color: 'bg-orange', category: 'flood', href: 'pages/underground-space-list.html' },
        { id: 'construction-site', label: '在建工地', icon: 'fa-trowel-bricks', color: 'bg-orange', category: 'flood', href: 'pages/construction-site-list.html' },
        { id: 'mobile-device', label: '移动设备信息', icon: 'fa-truck-pickup', color: 'bg-orange', category: 'flood', href: '', isToast: true },
        { id: 'personnel-transfer', label: '人员转移安置', icon: 'fa-people-roof', color: 'bg-green', category: 'flood', href: 'pages/personnel-transfer-list.html' },
        { id: 'disaster-management', label: '防汛隐患管理', icon: 'fa-house-crack', color: 'bg-green', category: 'flood', href: 'disaster-management-list.html' },
        { id: 'flood-special-report', label: '防汛隐患上报', icon: 'fa-file-circle-plus', color: 'bg-coral', category: 'flood', href: 'flood-special-hidden-danger-report.html' },
        { id: 'flood-situation-report', label: '防汛情况管理', icon: 'fa-chart-simple', color: 'bg-coral', category: 'flood', href: 'flood-situation-report-list.html' },
        { id: 'flood-situation-report-form', label: '防汛情况上报', icon: 'fa-file-pen', color: 'bg-coral', category: 'flood', href: 'flood-situation-report-form.html' },
        { id: 'resettlement-site', label: '集中安置场所', icon: 'fa-hotel', color: 'bg-green', category: 'flood', href: 'h5-resettlement-site-list.html' },
        { id: 'rescue-team', label: '抢险队伍信息', icon: 'fa-people-group', color: 'bg-green', category: 'flood', href: 'h5-rescue-team-list.html' },
        { id: 'rescue-materials', label: '抢险物资信息', icon: 'fa-box-open', color: 'bg-green', category: 'flood', href: 'pages/rescue-materials-list.html' },
        { id: 'underpass-three', label: '下立交三联动', icon: 'fa-triangle-exclamation', color: 'bg-green', category: 'flood', href: 'pages/h5-underpass-list.html' },
        { id: 'three-in-place', label: '积水处置三到位', icon: 'fa-list-check', color: 'bg-green', category: 'flood', href: 'pages/three-in-place-list.html' },

        { id: 'patrol-mission', label: '巡查任务', icon: 'fa-clipboard-list', color: 'bg-coral', category: 'patrol', href: 'rural-patrol-mission.html', showDot: 'patrol' },
        { id: 'rural-patrol-mission', label: '农村自建房巡查', icon: 'fa-house-chimney', color: 'bg-coral', category: 'patrol', href: 'rural-patrol-mission.html' },
        { id: 'hidden-danger-manage', label: '隐患处置', icon: 'fa-triangle-exclamation', color: 'bg-coral', category: 'patrol', href: 'hidden-danger-manage.html' },
        { id: 'feedback-center', label: '反馈中心', icon: 'fa-comments', color: 'bg-coral', category: 'patrol', href: 'feedback-center.html' },
        { id: 'inspection-execute', label: '现场取证', icon: 'fa-camera', color: 'bg-coral', category: 'patrol', href: 'inspection-execute.html' },
        { id: 'warning-center', label: '预警信息', icon: 'fa-bell', color: 'bg-coral', category: 'patrol', href: 'warning-center.html' },

        { id: 'region-management', label: '管辖区域', icon: 'fa-map-location-dot', color: 'bg-blue', category: 'risk', href: 'region-management.html' },
        { id: 'risk-list', label: '风险清单', icon: 'fa-book-open', color: 'bg-blue', category: 'risk', href: 'risk-domain-select.html' },
        { id: 'knowledge-laws', label: '知识栏目', icon: 'fa-scale-balanced', color: 'bg-blue', category: 'risk', href: 'knowledge-laws.html' },

        { id: 'patrol-track', label: '巡查轨迹', icon: 'fa-route', color: 'bg-green', category: 'assist', href: 'patrol-track.html' },
        { id: 'route-plan', label: '路线规划', icon: 'fa-map-location-dot', color: 'bg-green', category: 'assist', href: 'route-plan.html' },
        { id: 'online-inspection', label: '在线排查', icon: 'fa-person-walking-arrow-right', color: 'bg-green', category: 'assist', href: 'online-inspection.html' },
        { id: 'monitoring', label: '实时监测', icon: 'fa-tower-broadcast', color: 'bg-green', category: 'assist', href: 'monitoring.html' }
    ];

    var currentCat = 'flood';
    var inspectorHomeIds = App.getInspectorHomeApps();

    function getAppColor(app) { return app.color || 'bg-blue'; }

    function renderFav() {
        var grid = document.getElementById('favGrid');
        var favApps = [];
        // 优先取 inspectorHomeIds 中存在的应用
        inspectorHomeIds.forEach(function(id) {
            var app = apps.find(function(a) { return a.id === id; });
            if (!app) {
                // 兼容旧 pool 中的 id
                var poolApp = App.getInspectorAppById(id);
                if (poolApp) {
                    app = apps.find(function(a) { return a.label === poolApp.label; });
                }
            }
            if (app) favApps.push(app);
        });
        // 默认填充几个常用
        if (favApps.length === 0) {
            favApps = [
                apps.find(function(a) { return a.id === 'patrol-mission'; }),
                apps.find(function(a) { return a.id === 'flood-special-report'; }),
                apps.find(function(a) { return a.id === 'hidden-danger-manage'; }),
                apps.find(function(a) { return a.id === 'flood-risk-point'; })
            ].filter(Boolean);
        }

        var html = favApps.map(function(app) {
            return renderAppItem(app, 'fav');
        }).join('');
        html += '<div class="fav-item tap" onclick="enterAddToHome()">' +
            '<div class="fi-icon add"><i class="fa-solid fa-plus"></i></div>' +
            '<div class="fi-label">添加常用</div>' +
        '</div>';
        grid.innerHTML = html;
    }

    function renderAppItem(app, type) {
        var cls = type === 'fav' ? 'fav-item' : 'app-item';
        var iconCls = type === 'fav' ? 'fi-icon' : 'ai-icon';
        var labelCls = type === 'fav' ? 'fi-label' : 'ai-label';
        var dot = '';
        if (app.showDot === 'patrol' && DataStore.stats.todo > 0) {
            dot = '<span class="' + (type === 'fav' ? 'fi-dot' : 'ai-dot') + '"></span>';
        }
        var addBtn = '';
        if (isAddToHome) {
            var isAdded = inspectorHomeIds.indexOf(app.id) !== -1;
            addBtn = '<div class="add-home-btn tap' + (isAdded ? ' added' : '') + '" data-app-id="' + app.id + '">' +
                (isAdded ? '<i class="fa-regular fa-check"></i>' : '<i class="fa-regular fa-plus"></i>') +
            '</div>';
        }
        var onclick = app.isToast
            ? 'onclick="App.showToast(\'' + App.escapeHtml(app.label) + '\')"'
            : 'onclick="App.go(\'' + app.href + '\')"';
        return '<div class="' + cls + ' tap" ' + onclick + ' data-app-id="' + app.id + '">' +
            dot +
            '<div class="' + iconCls + ' ' + getAppColor(app) + '"><i class="fa-solid ' + app.icon + '"></i></div>' +
            '<div class="' + labelCls + '">' + App.escapeHtml(app.label) + '</div>' +
            addBtn +
        '</div>';
    }

    function renderTabs() {
        var tabs = document.getElementById('catTabs');
        tabs.innerHTML = categories.map(function(c) {
            return '<div class="cat-tab tap ' + (c.id === currentCat ? 'active' : '') + '" data-cat="' + c.id + '">' + App.escapeHtml(c.label) + '</div>';
        }).join('');

        tabs.querySelectorAll('.cat-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                currentCat = this.getAttribute('data-cat');
                renderTabs();
                renderAppGrid();
            });
        });
    }

    function renderAppGrid() {
        var grid = document.getElementById('appGrid');
        var list = [];
        if (currentCat === 'recent') {
            // 最近使用：取前 8 个常用
            list = apps.filter(function(a) {
                return inspectorHomeIds.indexOf(a.id) !== -1;
            });
            if (list.length === 0) list = apps.slice(0, 8);
        } else {
            list = apps.filter(function(a) { return a.category === currentCat; });
        }
        grid.innerHTML = list.map(function(app) { return renderAppItem(app, 'app'); }).join('');
    }

    function renderCatSheet() {
        var grid = document.getElementById('catGrid');
        grid.innerHTML = categories.map(function(c) {
            return '<div class="cat-item tap ' + (c.id === currentCat ? 'active' : '') + '" data-cat="' + c.id + '">' + App.escapeHtml(c.label) + '</div>';
        }).join('');
        grid.querySelectorAll('.cat-item').forEach(function(item) {
            item.addEventListener('click', function() {
                currentCat = this.getAttribute('data-cat');
                renderTabs();
                renderAppGrid();
                closeCatSheet();
            });
        });
    }

    window.openCatSheet = function() {
        renderCatSheet();
        document.getElementById('catMask').classList.add('show');
    };

    window.closeCatSheet = function(e) {
        if (e && !e.target.classList.contains('modal-mask') && !e.target.classList.contains('sheet-close')) return;
        document.getElementById('catMask').classList.remove('show');
    };

    // 添加到首页模式
    var isAddToHome = new URLSearchParams(window.location.search).get('mode') === 'addToHome';
    if (isAddToHome) {
        document.body.classList.add('add-to-home');
        document.getElementById('addToHomeBar').style.display = 'flex';
    }

    window.enterAddToHome = function() {
        var url = new URL(window.location.href);
        url.searchParams.set('mode', 'addToHome');
        window.location.href = url.toString();
    };

    window.finishAddToHome = function() {
        App.go('../index.html');
    };

    function bindAddHomeButtons() {
        document.getElementById('wsBody').addEventListener('click', function(e) {
            var btn = e.target.closest('.add-home-btn');
            if (!btn) return;
            e.stopPropagation();
            var id = btn.getAttribute('data-app-id');
            var idx = inspectorHomeIds.indexOf(id);
            if (idx === -1) {
                inspectorHomeIds.push(id);
                btn.classList.add('added');
                btn.innerHTML = '<i class="fa-regular fa-check"></i>';
                App.showToast('已添加到首页');
            } else {
                inspectorHomeIds.splice(idx, 1);
                btn.classList.remove('added');
                btn.innerHTML = '<i class="fa-regular fa-plus"></i>';
                App.showToast('已取消添加');
            }
            App.setInspectorHomeApps(inspectorHomeIds);
            renderFav();
        });
    }

    function init() {
        renderFav();
        renderTabs();
        renderAppGrid();
        if (isAddToHome) bindAddHomeButtons();

        // 巡查任务红点
        var patrolDot = document.querySelector('[data-app-id="patrol-mission"] .fi-dot, [data-app-id="patrol-mission"] .ai-dot');
        // 红点已在 renderAppItem 中通过 showDot 控制

        App.renderTabBar('workspace');
    }

    init();
})();
</script>
</body>
</html>
