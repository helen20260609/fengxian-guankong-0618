<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>重点保障区域</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.page-hero .ph-sub { position: static; text-align: center; font-size: 12.5px; opacity: .85; margin-top: 40px; width: 100%; z-index: 2; }

.content-sheet.page-body-sheet { margin-top: 0; padding-top: 18px; border-radius: 0; box-shadow: none; border: none; background: transparent; }
.content-sheet .search-bar { align-items: center; gap: 10px; margin-top: 4px; background: transparent; box-shadow: none; border: none; padding: 0; }
.content-sheet .search-input-wrapper { display: flex; align-items: center; background: var(--card); border-radius: var(--radius); box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); min-height: 40px; }
.content-sheet .search-input-wrapper input { background: transparent; border-color: transparent; height: 40px; padding-top: 0; padding-bottom: 0; }

.content-sheet .filter-trigger {
    flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 40px; padding: 0 14px; background: var(--card); color: var(--text2);
    font-size: 13px; font-weight: 400; border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: 0 2px 8px var(--shadow); cursor: pointer; position: relative; transition: all .15s;
}
.content-sheet .filter-trigger:active { transform: scale(.96); }
.content-sheet .filter-trigger .badge-num {
    position: absolute; top: -6px; right: -6px; min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--card); box-sizing: border-box;
}

.selected-tags { display: flex; flex-wrap: nowrap; gap: 8px; margin: 12px 0 4px; overflow-x: auto; scrollbar-width: none; }
.selected-tags::-webkit-scrollbar { display: none; }
.tag { flex-shrink: 0; background: rgba(var(--primary-rgb),.08); color: var(--primary); border: 1px solid rgba(var(--primary-rgb),.18); border-radius: 999px; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.tag i { cursor: pointer; font-size: 10px; }

.guarantee-card { cursor: pointer; transition: transform .12s; padding: 16px; }
.guarantee-card:active { transform: scale(.99); }
.gc-title-wrap { display: flex; flex-direction: column; gap: 0; }
.gc-name { font-size: 16px; font-weight: 700; color: #1F1F1F; line-height: 1.4; margin-bottom: 10px; }
.gc-company { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #595959; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gc-company .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gc-address { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #7F7F7F; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gc-address .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gc-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
.gc-contact { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #1F1F1F; font-weight: 700; }
.call-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #E6FFED;
    color: #52C41A;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    text-decoration: none;
    transition: all .15s;
    flex-shrink: 0;
    margin-left: auto;
}
.call-btn:active { transform: scale(.94); background: #52C41A; color: #fff; }
.call-btn.hidden { display: none; }

.loading { text-align: center; padding: 16px; color: var(--text2); font-size: 13px; }
.loading i { margin-right: 6px; }

.filter-section { margin-bottom: 18px; }
.filter-section .filter-title { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
.filter-section .filter-options { display: flex; flex-wrap: wrap; gap: 10px; }
.filter-chip { padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-primary); cursor: pointer; transition: all .15s; }
.filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.date-range { display: flex; align-items: center; gap: 10px; }
.date-range input { flex: 1; height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--input-bg); color: var(--text-primary); font-size: 13px; }
.date-range .sep { color: var(--text2); }

.sheet-footer { display: flex; gap: 12px; padding-top: 16px; border-top: 1px solid var(--border); }
.sheet-footer .btn { flex: 1; height: 44px; border-radius: 10px; }

.modal-sheet { display: block !important; opacity: 0; pointer-events: none; transform: translateY(100%); transition: transform .25s ease, opacity .25s ease; z-index: 1001; }
.modal-sheet.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.modal-mask { display: none; opacity: 0; transition: opacity .25s ease; z-index: 1000; }
.modal-mask.show { display: block; opacity: 1; }

.bottom-spacer { height: 20px; }

:root[data-theme="dark"] .content-sheet .search-input-wrapper input { background: var(--input-bg); }
:root[data-theme="dark"] .gc-name { color: #F0F0F0; }
:root[data-theme="dark"] .gc-contact { color: #F0F0F0; }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title">重点保障区域</div>
            <div class="ph-sub" id="heroStat" style="display:none">共 -- 个</div>
        </div>

        <div class="content-sheet page-body-sheet">
            <div class="search-bar">
                <div class="search-input-wrapper" style="flex:1">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="搜索单位名称/地址/责任单位/联系人">
                </div>
                <div class="filter-trigger" onclick="openDrawer()">
                    <i class="fa-solid fa-filter"></i> 筛选
                    <span class="badge-num" id="filterBadge" style="display:none">0</span>
                </div>
            </div>

            <div class="selected-tags" id="selectedTags"></div>

            <div class="section-v2" id="listSection">
                <div class="sv2-head">
                    <div class="sv2-title"><i class="fa-solid fa-shield-halved" style="color:var(--primary);margin-right:6px"></i>重点保障区域</div>
                    <div class="sv2-more" id="totalCount">共 0 个</div>
                </div>
                <div class="card-list" id="cardList"></div>
                <div class="loading" id="loading" style="display:none"><i class="fa-solid fa-circle-notch fa-spin"></i> 加载中…</div>
                <div class="empty-state" id="empty" style="display:none">
                    <i class="fa-regular fa-folder-open"></i>
                    <div class="empty-title">暂无符合条件的区域</div>
                    <div class="empty-desc">请调整筛选或搜索条件</div>
                </div>
                <div class="bottom-spacer"></div>
            </div>
        </div>

        <!-- 筛选抽屉 -->
        <div class="modal-mask" id="drawerOverlay" onclick="closeDrawer()"></div>
        <div class="modal-sheet" id="drawer">
            <div class="sheet-header">
                <div class="sheet-title">筛选条件</div>
                <div class="sheet-close" onclick="closeDrawer()"><i class="fa-solid fa-times"></i></div>
            </div>
            <div id="drawerBody"></div>
            <div class="sheet-footer">
                <button class="btn btn-outline" onclick="resetFilters()">重置</button>
                <button class="btn btn-primary" onclick="confirmFilters()">确定</button>
            </div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    var embeddedData = [
        { no: "1", name: "青村高高压站", address: "李窑村1814号", responsibleUnit: "上海海贤能源股份有限公司", contact: "周静", phone: "18964616860", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "2", name: "新寺高高压站", address: "新寺南胜村7组", responsibleUnit: "上海海贤能源股份有限公司", contact: "周静", phone: "18964616860", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "3", name: "光明高中压站", address: "光明牌楼村6组", responsibleUnit: "上海海贤能源股份有限公司", contact: "周静", phone: "18964616860", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "4", name: "南桥储配站", address: "南亭公路1069号", responsibleUnit: "上海海贤能源股份有限公司", contact: "刘洪奎", phone: "13501918082", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "5", name: "青村高中压站", address: "南奉公路、沿钱公路往南20米", responsibleUnit: "上海海贤能源股份有限公司", contact: "陈平辉", phone: "18964321520", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "6", name: "金汇高中压站", address: "大叶公路、金钱公路南50米", responsibleUnit: "上海海贤能源股份有限公司", contact: "陈平辉", phone: "18964321520", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "7", name: "西渡中中压站", address: "兴中路、西闸公路北侧约100米", responsibleUnit: "上海海贤能源股份有限公司", contact: "陈平辉", phone: "18964321520", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "8", name: "南桥中中压站", address: "南奉公路、S4高速公路", responsibleUnit: "上海海贤能源股份有限公司", contact: "陈平辉", phone: "18964321520", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "9", name: "融园路高中压站", address: "融园路、朱桥路路口", responsibleUnit: "上海海贤能源股份有限公司", contact: "陈平辉", phone: "18964321520", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "10", name: "邬桥高中压站", address: "大叶公路、安东路路口", responsibleUnit: "上海海贤能源股份有限公司", contact: "陈平辉", phone: "18964321520", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "11", name: "贝港中中压站", address: "新建西路沪杭公路东北角", responsibleUnit: "上海海贤能源股份有限公司", contact: "陈平辉", phone: "18964321520", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "12", name: "浦星高中压站", address: "浦星公路港漕公路南", responsibleUnit: "上海海贤能源股份有限公司", contact: "李清", phone: "13818537638", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "13", name: "奉城高中压站", address: "团青公路新奉公路东南", responsibleUnit: "上海海贤能源股份有限公司", contact: "李清", phone: "13818537638", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "14", name: "四团高中压站", address: "新四平公路平海路东北", responsibleUnit: "上海海贤能源股份有限公司", contact: "李清", phone: "13818537638", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "15", name: "奉贤交通液化气有限公司储配站", address: "西渡街道五宅村326号", responsibleUnit: "上海奉贤交通液化气有限公司", contact: "陈中谛", phone: "13402101618", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" }
    ];

    try { localStorage.setItem('keyGuaranteeData', JSON.stringify(embeddedData)); } catch (e) {}

    var selectedFilters = {};
    var searchKw = '';
    var pageSize = 10, currentPage = 1, isLoading = false, hasMore = true;

    var units = [];
    embeddedData.forEach(function(item){
        if (units.indexOf(item.reportUnit) < 0) units.push(item.reportUnit);
    });

    function matchFilter(item){
        if (selectedFilters.reportUnit && item.reportUnit !== selectedFilters.reportUnit) return false;
        if (selectedFilters.dateStart && item.reportDate < selectedFilters.dateStart) return false;
        if (selectedFilters.dateEnd && item.reportDate > selectedFilters.dateEnd) return false;
        if (searchKw){
            var kw = searchKw.toLowerCase();
            var hay = (item.name + ' ' + item.address + ' ' + item.responsibleUnit + ' ' + item.contact + ' ' + item.phone + ' ' + item.reportUnit + ' ' + item.reporter).toLowerCase();
            if (hay.indexOf(kw) < 0) return false;
        }
        return true;
    }
    function filtered(){ return embeddedData.filter(matchFilter); }

    function cardHtml(item){
        return '<div class="card guarantee-card" onclick="goDetail(' + item.no + ')">'
            +   '<div class="gc-title-wrap">'
            +     '<div class="gc-name">' + item.name + '</div>'
            +     '<div class="gc-company"><i class="fa-regular fa-building"></i><span class="txt">' + item.responsibleUnit + '</span></div>'
            +     '<div class="gc-address"><i class="fa-regular fa-location-dot"></i><span class="txt">' + item.address + '</span></div>'
            +   '</div>'
            +   '<div class="gc-footer">'
            +     '<div class="gc-contact"><i class="fa-regular fa-user"></i>联系人：' + item.contact + '</div>'
            +     '<a class="call-btn" href="tel:' + item.phone + '" onclick="event.stopPropagation();App.showToast(\'正在呼叫 ' + item.contact + ' ' + item.phone + '\')"><i class="fa-solid fa-phone"></i></a>'
            +   '</div>'
            + '</div>';
    }

    function render(reset){
        var list = filtered();
        var total = list.length;
        document.getElementById('totalCount').textContent = '共 ' + total + ' 个';
        document.getElementById('heroStat').textContent = '共 ' + total + ' 个';

        var box = document.getElementById('cardList');
        var empty = document.getElementById('empty');
        if (reset){ box.innerHTML = ''; currentPage = 1; hasMore = true; }

        if (total === 0){ empty.style.display = 'block'; return; }
        empty.style.display = 'none';

        var slice = list.slice(0, currentPage * pageSize);
        box.innerHTML = slice.map(cardHtml).join('');
        hasMore = slice.length < total;
    }

    var FILTER_LABELS = { reportUnit:'填报单位', dateStart:'开始', dateEnd:'结束' };
    function renderTags(){
        var box = document.getElementById('selectedTags');
        var keys = Object.keys(selectedFilters).filter(function(k){ return selectedFilters[k]; });
        var badge = document.getElementById('filterBadge');
        if (keys.length === 0){ box.innerHTML = ''; badge.style.display = 'none'; return; }
        badge.style.display = 'inline-flex';
        badge.textContent = keys.length;
        box.innerHTML = keys.map(function(k){
            var v = selectedFilters[k];
            var label = (k === 'dateStart' || k === 'dateEnd') ? (FILTER_LABELS[k] + ':' + v) : v;
            return '<span class="tag">' + label + '<i class="fa-solid fa-xmark" onclick="removeFilter(\'' + k + '\')"></i></span>';
        }).join('');
    }
    window.removeFilter = function(k){ delete selectedFilters[k]; renderTags(); render(true); };

    function chipGroup(key, title, options){
        var chips = options.map(function(o){
            var act = selectedFilters[key] === o ? ' active' : '';
            return '<div class="filter-chip' + act + '" data-key="' + key + '" data-val="' + o + '">' + o + '</div>';
        }).join('');
        return '<div class="filter-section"><div class="filter-title">' + title + '</div>'
             + '<div class="filter-options">' + chips + '</div></div>';
    }
    function renderDrawer(){
        var html = chipGroup('reportUnit', '填报单位', units)
                 + '<div class="filter-section"><div class="filter-title">填报日期</div>'
                 + '<div class="date-range">'
                 + '<input type="date" id="dateStart" value="' + (selectedFilters.dateStart||'') + '">'
                 + '<span class="sep">~</span>'
                 + '<input type="date" id="dateEnd" value="' + (selectedFilters.dateEnd||'') + '">'
                 + '</div></div>';
        document.getElementById('drawerBody').innerHTML = html;

        document.querySelectorAll('#drawerBody .filter-chip').forEach(function(c){
            c.onclick = function(){
                var k = c.dataset.key, v = c.dataset.val;
                if (selectedFilters[k] === v) delete selectedFilters[k];
                else selectedFilters[k] = v;
                document.querySelectorAll('#drawerBody .filter-chip[data-key="' + k + '"]').forEach(function(x){
                    x.classList.toggle('active', selectedFilters[k] === x.dataset.val);
                });
            };
        });
    }
    window.openDrawer = function(){ renderDrawer(); document.getElementById('drawerOverlay').classList.add('show'); document.getElementById('drawer').classList.add('show'); };
    window.closeDrawer = function(){ document.getElementById('drawerOverlay').classList.remove('show'); document.getElementById('drawer').classList.remove('show'); };
    window.resetFilters = function(){
        selectedFilters = {};
        renderDrawer();
        document.getElementById('dateStart').value = '';
        document.getElementById('dateEnd').value = '';
    };
    window.confirmFilters = function(){
        var ds = document.getElementById('dateStart').value;
        var de = document.getElementById('dateEnd').value;
        if (ds) selectedFilters.dateStart = ds; else delete selectedFilters.dateStart;
        if (de) selectedFilters.dateEnd = de; else delete selectedFilters.dateEnd;
        closeDrawer(); renderTags(); render(true);
    };

    var searchTimer;
    document.getElementById('searchInput').addEventListener('input', function(e){
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function(){ searchKw = e.target.value.trim(); render(true); }, 250);
    });

    document.querySelector('.phone-shell').addEventListener('scroll', function(){
        if (isLoading || !hasMore) return;
        var el = this;
        if (el.scrollTop + el.clientHeight >= el.scrollHeight - 60){
            isLoading = true;
            document.getElementById('loading').style.display = 'block';
            setTimeout(function(){
                currentPage++;
                render(false);
                isLoading = false;
                document.getElementById('loading').style.display = 'none';
            }, 300);
        }
    });

    window.goDetail = function(id){ App.go('h5-key-guarantee-detail.html?id=' + id); };

    render(true);
})();
</script>
</body>
</html>
