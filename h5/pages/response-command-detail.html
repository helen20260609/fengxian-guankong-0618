<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>分级响应指挥详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.status-bar { position: relative; z-index: 100; }
.page-hero { position: relative; z-index: 99; display: flex; flex-direction: column; align-items: center; padding: calc(34px + 16px) 18px 42px; }

.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; }
.content-sheet.page-body-sheet { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 0 0 16px; background: #f5f6fa; margin-top: 0; border-radius: 0; }
.content-sheet.page-body-sheet::-webkit-scrollbar { display: none; }

.hero-card {
    background: linear-gradient(180deg, #1557b0 0%, #1a73e8 100%);
    border-radius: 16px;
    margin: 12px 16px 14px;
    padding: 20px 16px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 6px 18px rgba(26,115,232,.22);
    position: relative;
    overflow: hidden;
}
.hero-card .person-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 500;
    color: #fff;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
}
.hero-card .person-title { flex: 1; position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; }
.hero-card .person-name-row { display: flex; align-items: center; gap: 8px; }
.hero-card .person-name { font-size: 18px; font-weight: 500; color: #fff; line-height: 1.2; }
.hero-card .person-position {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    background: rgba(255,255,255,.25);
    line-height: 1.2;
}

.action-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 0 16px 14px;
}
.action-grid-cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all .15s;
}
.action-grid-cell:active { transform: scale(.97); }
.action-grid-cell.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.action-grid-cell .ag-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}
.action-grid-cell .ag-icon.phone { background: rgba(30,142,62,.12); color: var(--success); }
.action-grid-cell .ag-icon.copy { background: rgba(230,81,0,.1); color: #e65100; }
.action-grid-cell .ag-label { font-size: 12px; color: var(--text-primary); font-weight: 500; }
.action-grid-cell .ag-label.disabled { color: var(--text2); }

.section-v2 { background: #fff; border-radius: 12px; margin: 0 16px 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.section-v2:last-of-type { margin-bottom: 16px; }
.sv2-head { margin-bottom: 12px; }
.sv2-title { font-size: 15px; font-weight: 500; color: var(--text-primary); display: flex; align-items: center; gap: 0; position: relative; padding-left: 11px; }
.sv2-title::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 16px; border-radius: 2px; background: var(--primary); }

.duty-level-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.duty-level-item {
    border-radius: 8px;
    padding: 12px;
    border: 1px solid var(--border);
    background: #fff;
}
.duty-level-item .dl-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
}
.duty-level-item .dl-label .dot { width: 8px; height: 8px; border-radius: 50%; }
.duty-level-item .dl-value { font-size: 14px; font-weight: 500; line-height: 1.4; }
.duty-level-item .dl-value.empty { color: var(--text2); }
.duty-level-item.level-1 { background: rgba(217,48,37,.08); border-color: rgba(217,48,37,.15); }
.duty-level-item.level-1 .dl-label { color: #d93025; }
.duty-level-item.level-1 .dl-value { color: #d93025; }
.duty-level-item.level-2 { background: rgba(230,81,0,.08); border-color: rgba(230,81,0,.15); }
.duty-level-item.level-2 .dl-label { color: #e65100; }
.duty-level-item.level-2 .dl-value { color: #e65100; }
.duty-level-item.level-3 { background: #fff; }
.duty-level-item.level-3 .dl-label { color: #c78000; }
.duty-level-item.level-3 .dl-value { color: #c78000; }
.duty-level-item.level-4 { background: #fff; }
.duty-level-item.level-4 .dl-label { color: var(--primary); }
.duty-level-item.level-4 .dl-value { color: var(--primary); }

.sc-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #f2f2f2; gap: 16px; }
.sc-row:last-child { border-bottom: none; padding-bottom: 0; }
.sc-row.wrap { align-items: flex-start; }
.sc-label { font-size: 14px; color: var(--text2); text-align: left; line-height: 1.4; flex-shrink: 0; }
.sc-value { flex: 1; min-width: 0; font-size: 14px; color: var(--text-primary); font-weight: 500; text-align: right; line-height: 1.4; word-break: break-word; }
.sc-value.phone { color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; }
.sc-value.phone i { font-size: 12px; }
.sc-value.na { color: var(--text2); }

.bottom-spacer { height: 20px; }

:root[data-theme="dark"] .section-v2 { background: var(--bg-card); }
:root[data-theme="dark"] .hero-card { background: linear-gradient(180deg, #0d2a5c 0%, #1a73e8 100%); }
:root[data-theme="dark"] .action-grid-cell { background: var(--bg-card); border-color: var(--border); }
:root[data-theme="dark"] .duty-level-item { background: var(--bg-card); border-color: var(--border); }
:root[data-theme="dark"] .duty-level-item.level-1 { background: rgba(239,68,68,.1); border-color: rgba(239,68,68,.2); }
:root[data-theme="dark"] .duty-level-item.level-2 { background: rgba(249,115,22,.1); border-color: rgba(249,115,22,.2); }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title" id="heroName">指挥详情</div>
        </div>

        <div class="content-sheet page-body-sheet" style="padding:0 0 16px">
            <div class="hero-card">
                <div class="person-avatar" id="avatarText">--</div>
                <div class="person-title">
                    <div class="person-name-row">
                        <div class="person-name" id="personName">--</div>
                        <div class="person-position" id="personPosition">--</div>
                    </div>
                </div>
            </div>

            <div class="action-grid">
                <div class="action-grid-cell" id="callMobileAction">
                    <div class="ag-icon phone"><i class="fa-solid fa-mobile-screen"></i></div>
                    <div class="ag-label">拨打手机</div>
                </div>
                <div class="action-grid-cell" id="copyMobileAction">
                    <div class="ag-icon copy"><i class="fa-solid fa-copy"></i></div>
                    <div class="ag-label">复制手机号</div>
                </div>
            </div>

            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">分级响应指挥职务</div></div>
                <div class="duty-level-grid" id="dutyGrid"></div>
            </div>

            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">人员信息</div></div>
                <div id="personInfo"></div>
            </div>

            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">联系方式</div></div>
                <div id="contactInfo"></div>
            </div>

            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">填报信息</div></div>
                <div id="reportInfo"></div>
            </div>

            <div class="bottom-spacer"></div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    var embeddedData = [
        { id: 'rc1', no: '1', name: '张建国', position: '主任', mobilePhone: '138 1234 5678', level1Duty: '总指挥', level2Duty: '总指挥', level3Duty: '', level4Duty: '', reportUnit: '区燃气管理所', reportPerson: '张助理', reportDate: '2025-06-01' },
        { id: 'rc2', no: '2', name: '李明华', position: '科长', mobilePhone: '139 5678 9012', level1Duty: '总指挥', level2Duty: '总指挥', level3Duty: '行业总指挥', level4Duty: '', reportUnit: '区燃气管理所', reportPerson: '李秘书', reportDate: '2025-06-02' },
        { id: 'rc3', no: '3', name: '王志强', position: '科长', mobilePhone: '137 9012 3456', level1Duty: '常务副总指挥', level2Duty: '常务副总指挥', level3Duty: '行业总指挥', level4Duty: '行业现场指挥', reportUnit: '区城市综合管理科', reportPerson: '王干事', reportDate: '2025-06-03' },
        { id: 'rc4', no: '4', name: '陈书记', position: '党委书记', mobilePhone: '136 1111 2222', level1Duty: '总指挥', level2Duty: '总指挥', level3Duty: '', level4Duty: '', reportUnit: '区交通中心', reportPerson: '陈干事', reportDate: '2025-06-04' },
        { id: 'rc5', no: '5', name: '赵副主任', position: '副主任', mobilePhone: '135 2222 3333', level1Duty: '副总指挥', level2Duty: '副总指挥', level3Duty: '行业总指挥', level4Duty: '行业现场总指挥', reportUnit: '区水务局', reportPerson: '赵助理', reportDate: '2025-06-05' },
        { id: 'rc6', no: '6', name: '孙丽娜', position: '科员', mobilePhone: '133 3333 4444', level1Duty: '', level2Duty: '现场总指挥', level3Duty: '行业现场总指挥', level4Duty: '行业现场指挥', reportUnit: '区应急管理局', reportPerson: '孙秘书', reportDate: '2025-06-06' }
    ];

    function normalizePhone(phone) {
        return String(phone || '').replace(/\s/g, '').replace(/\*/g, '');
    }

    function isMaskedPhone(phone) {
        return phone && String(phone).indexOf('****') !== -1;
    }

    function loadData() {
        var id = App.getQuery('id');
        // 优先使用当前内置的完整数据，避免旧缓存中的脱敏或空格不一致数据影响展示
        var found = id ? embeddedData.find(function(i) { return i.id === id; }) : null;
        return found || embeddedData[0];
    }

    var item = loadData();

    function getLevelDuty(item, level) {
        var val = item['level' + level + 'Duty'];
        return val && String(val).trim() ? { type: 'duty', value: val } : { type: 'empty', value: '—' };
    }

    function getVal(v) {
        return v && String(v).trim() ? v : '—';
    }

    function renderInfoGrid(pairs) {
        return pairs.map(function(p) {
            return '<div class="sc-row"><div class="sc-label">' + p.label + '</div><div class="sc-value ' + (p.cls || '') + '"' + (p.id ? ' id="' + p.id + '"' : '') + '>' + p.value + '</div></div>';
        }).join('');
    }

    function renderHero() {
        document.getElementById('heroName').textContent = item.name ? item.name + ' - 指挥详情' : '指挥详情';
        document.getElementById('avatarText').textContent = item.name ? item.name.charAt(0) : '?';
        document.getElementById('personName').textContent = item.name || '--';
        document.getElementById('personPosition').textContent = item.position || '--';
    }

    function renderDutyGrid() {
        var labels = { 1: 'I级红色响应', 2: 'II级橙色响应', 3: 'III级黄色响应', 4: 'IV级蓝色响应' };
        var html = [1,2,3,4].map(function(level) {
            var d = getLevelDuty(item, level);
            var valueCls = d.type === 'empty' ? 'empty' : '';
            return '<div class="duty-level-item level-' + level + '">' +
                '<div class="dl-label"><span class="dot" style="background:' + getLevelColor(level) + '"></span>' + labels[level] + '</div>' +
                '<div class="dl-value ' + valueCls + '">' + App.escapeHtml(d.value) + '</div>' +
            '</div>';
        }).join('');
        document.getElementById('dutyGrid').innerHTML = html;
    }

    function getLevelColor(level) {
        if (level === 1) return 'var(--danger)';
        if (level === 2) return '#e65100';
        if (level === 3) return '#c78000';
        return 'var(--primary)';
    }

    function renderPersonInfo() {
        var rows = [
            { label: '姓名', value: App.escapeHtml(getVal(item.name)) },
            { label: '行政职务', value: App.escapeHtml(getVal(item.position)) }
        ];
        document.getElementById('personInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderContactInfo() {
        var phoneDisplay = App.escapeHtml(getVal(item.mobilePhone));
        var phoneRaw = normalizePhone(item.mobilePhone);
        var rows = [
            { label: '移动电话', value: phoneDisplay, cls: 'phone', id: 'mobilePhoneValue' }
        ];
        document.getElementById('contactInfo').innerHTML = renderInfoGrid(rows);

        var mobileEl = document.getElementById('mobilePhoneValue');
        if (mobileEl && phoneRaw) {
            mobileEl.innerHTML = '<i class="fa-solid fa-phone"></i> ' + phoneDisplay;
            mobileEl.style.cursor = 'pointer';
            mobileEl.addEventListener('click', function() {
                window.location.href = 'tel:' + phoneRaw;
                App.showToast('正在呼叫 ' + App.escapeHtml(item.name) + ' ' + phoneDisplay);
            });
        }
    }

    function renderReportInfo() {
        var rows = [
            { label: '填报单位', value: App.escapeHtml(getVal(item.reportUnit)) },
            { label: '填报人', value: App.escapeHtml(getVal(item.reportPerson)) },
            { label: '填报日期', value: App.escapeHtml(getVal(item.reportDate)) }
        ];
        document.getElementById('reportInfo').innerHTML = renderInfoGrid(rows);
    }

    function copyToClipboard(text, successMsg) {
        if (!text || !String(text).trim()) return;
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(function() {
                App.showToast(successMsg);
            }).catch(function() {
                fallbackCopy(text, successMsg);
            });
        } else {
            fallbackCopy(text, successMsg);
        }
    }

    function fallbackCopy(text, successMsg) {
        var input = document.createElement('input');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        try { document.execCommand('copy'); App.showToast(successMsg); } catch (e) {}
        document.body.removeChild(input);
    }

    function renderActions() {
        var phoneRaw = normalizePhone(item.mobilePhone);
        var phoneDisplay = App.escapeHtml(getVal(item.mobilePhone));
        var callMobile = document.getElementById('callMobileAction');
        callMobile.addEventListener('click', function() {
            if (!phoneRaw) return;
            window.location.href = 'tel:' + phoneRaw;
            App.showToast('正在呼叫 ' + App.escapeHtml(item.name) + ' ' + phoneDisplay);
        });

        var copyMobile = document.getElementById('copyMobileAction');
        if (!phoneRaw) {
            copyMobile.classList.add('disabled');
        } else {
            copyMobile.addEventListener('click', function() {
                copyToClipboard(phoneRaw, '手机号已复制');
            });
        }
    }

    function init() {
        renderHero();
        renderDutyGrid();
        renderPersonInfo();
        renderContactInfo();
        renderReportInfo();
        renderActions();

        var now = new Date();
        document.getElementById('statusTime').textContent =
            String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    init();
})();
</script>
</body>
</html>
