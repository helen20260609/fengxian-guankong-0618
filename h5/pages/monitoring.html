<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>实时监测</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.monitor-card { position: relative; }
.monitor-card .mc-header { display: flex; justify-content: space-between; align-items: flex-start; }
.monitor-card .mc-name { font-size: 14px; font-weight: 700; }
.monitor-card .mc-domain { font-size: 10px; color: var(--text2); margin-top: 3px; }
.monitor-card .mc-value { text-align: right; }
.monitor-card .mc-num { font-size: 21px; font-weight: 800; }
.monitor-card .mc-unit { font-size: 11px; color: var(--text2); }
.monitor-card .mc-time { font-size: 10px; color: var(--text2); margin-top: 10px; }
.monitor-card .mc-fav { position: absolute; top: 10px; right: 10px; color: var(--text2); font-size: 13px; }
.monitor-card .mc-fav.active { color: var(--warning); }

.chart-placeholder { height: 120px; background: var(--bg-dark); border-radius: var(--radius-sm); margin-top: 12px; display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 11px; }


/* ===== 标准顶部导航（方案①：绝对居中标题） ===== */
.page-hero { display: flex; align-items: center; justify-content: center; padding: calc(34px + 16px) 18px 42px; }
.page-hero .ph-back { position: absolute; left: 14px; top: calc(34px + 16px); margin: 0; display: flex; align-items: center; justify-content: center; height: 32px; }
.page-hero .ph-title { position: absolute; left: 50%; top: calc(34px + 16px); transform: translateX(-50%); text-align: center; line-height: 32px; width: 70%; z-index: 2; }
.page-hero .hero-title { display: contents; }
.page-hero .ph-sub { position: static; text-align: center; font-size: 12.5px; opacity: .85; margin-top: 40px; width: 100%; z-index: 2; }
.page-hero .hero-stats-v2 { position: relative; z-index: 2; width: 100%; margin-top: 40px; }
.page-hero .ph-action { position: absolute; right: 14px; top: calc(34px + 16px); margin: 0; display: flex; align-items: center; height: 32px; z-index: 2; }
</style>
</head>
<body>
<div class="phone-frame">
    <!-- 侧边按钮 -->
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <!-- 状态栏 -->
    <div class="status-bar light">
        <span class="sb-time" id="statusTime">9:41</span>
        <span class="sb-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
            <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
        </span>
    </div>

    <div class="page-hero">
        <div class="ph-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
        <div class="ph-title">实时监测</div>
            <div class="ph-sub">实时监测各风险点运行状态</div>
    </div>

    <div class="page-body">
        <!-- KPI -->
        <div class="kpi-grid cols-3 anim d1">
            <div class="kpi-card">
                <div class="kpi-value" id="totalMp">--</div>
                <div class="kpi-label">监测点总数</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-value" style="color:var(--danger)" id="alarmMp">--</div>
                <div class="kpi-label">报警数</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-value" style="color:var(--warning)" id="warnMp">--</div>
                <div class="kpi-label">预警数</div>
            </div>
        </div>

        <!-- 领域 Pill -->
        <div class="pill-nav anim d2" id="domainPills">
            <div class="pill active" data-domain="">全部</div>
            <div class="pill" data-domain="build">建筑工地</div>
            <div class="pill" data-domain="gas">燃气</div>
            <div class="pill" data-domain="traffic">交通</div>
            <div class="pill" data-domain="curtain">幕墙</div>
            <div class="pill" data-domain="selfbuild">自建房</div>
            <div class="pill" data-domain="rural">农村自建房</div>
            <div class="pill" data-domain="urban">城镇自建房</div>
        </div>

        <!-- 状态筛选 -->
        <div class="pill-nav anim d3" id="statusFilter">
            <div class="pill active" data-status="all">全部状态</div>
            <div class="pill" data-status="red">只看报警</div>
            <div class="pill" data-status="yellow">只看预警</div>
            <div class="pill" data-status="green">只看正常</div>
        </div>

        <div class="monitor-list anim d4" id="monitorList">
            <!-- 动态填充 -->
        </div>
    </div>

    </div>
</div>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    var currentDomain = '';
    var currentStatus = 'all';
    var domainName = { build: '建筑工地', gas: '燃气', traffic: '交通', curtain: '幕墙', selfbuild: '自建房', rural: '农村自建房', urban: '城镇自建房', falling: '高空坠物' };

    function getFavorites() {
        var saved = localStorage.getItem('risk-monitor-favorites');
        if (saved) { try { return JSON.parse(saved); } catch (e) {} }
        return [];
    }
    function setFavorites(ids) {
        localStorage.setItem('risk-monitor-favorites', JSON.stringify(ids));
    }

    function renderStats() {
        var total = DataStore.monitoringPoints.length;
        var alarm = DataStore.monitoringPoints.filter(function(m) { return m.status === 'red'; }).length;
        var warn = DataStore.monitoringPoints.filter(function(m) { return m.status === 'yellow'; }).length;
        document.getElementById('totalMp').textContent = total;
        document.getElementById('alarmMp').textContent = alarm;
        document.getElementById('warnMp').textContent = warn;
    }

    function getFilteredItems() {
        var favIds = getFavorites();
        return DataStore.monitoringPoints.filter(function(m) {
            if (currentDomain && m.domain !== currentDomain) return false;
            if (currentStatus !== 'all' && m.status !== currentStatus) return false;
            return true;
        }).sort(function(a, b) {
            var favA = favIds.indexOf(a.id) !== -1;
            var favB = favIds.indexOf(b.id) !== -1;
            if (favA && !favB) return -1;
            if (!favA && favB) return 1;
            var statusOrder = { red: 0, yellow: 1, green: 2 };
            return (statusOrder[a.status] || 9) - (statusOrder[b.status] || 9);
        });
    }

    function renderList() {
        var container = document.getElementById('monitorList');
        container.innerHTML = '';
        var items = getFilteredItems();
        var favIds = getFavorites();

        if (items.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fa-regular fa-chart-bar"></i><div class="empty-title">暂无监测点</div></div>';
            return;
        }

        items.forEach(function(m) {
            var statusText = { green: '正常', yellow: '预警', red: '报警', orange: '预警' }[m.status] || m.status;
            var isFav = favIds.indexOf(m.id) !== -1;
            var favHtml = '<div class="mc-fav ' + (isFav ? 'active' : '') + '" onclick="event.stopPropagation();toggleMonitorFavorite(\'' + m.id + '\')"><i class="fa-solid fa-star"></i></div>';
            var isSelfbuildDomain = m.domain === 'selfbuild' || m.domain === 'rural' || m.domain === 'urban';
            var onClick = isSelfbuildDomain
                ? ' onclick="App.go(\'selfbuild-monitor-detail.html?id=' + m.id + '\')"'
                : (m.status === 'red' || m.status === 'yellow'
                    ? ' onclick="App.go(\'warning-center.html\')"'
                    : ' onclick="App.go(\'monitoring-detail.html?id=' + m.id + '\')"');
            var html = '<div class="monitor-card card tap anim"' + onClick + '>' +
                favHtml +
                '<div class="mc-header">' +
                '<div><div class="mc-name">' + App.escapeHtml(m.name) + '</div><div class="mc-domain">' + (domainName[m.domain] || m.domain) + ' · ' + App.escapeHtml(m.indicator) + '</div></div>' +
                '<div class="mc-value"><div class="mc-num" style="color:' + valueColor(m.status) + '">' + m.value + '</div><div class="mc-unit">' + m.unit + '</div></div>' +
                '</div>' +
                '<div class="status-tag ' + m.status + '" style="margin-top:6px"><span class="risk-dot ' + m.status + '" style="margin-right:4px"></span> ' + statusText + '</div>' +
                '<div class="mc-time"><i class="fa-regular fa-clock"></i> 更新时间：' + App.relativeTime(m.updateTime) + '</div>' +
                '<div class="chart-placeholder"><i class="fa-solid fa-chart-line"></i> 24 小时趋势图</div>' +
                '</div>';
            container.insertAdjacentHTML('beforeend', html);
        });
    }

    window.toggleMonitorFavorite = function(id) {
        var favIds = getFavorites();
        var idx = favIds.indexOf(id);
        if (idx === -1) {
            favIds.push(id);
            App.showToast('已关注');
        } else {
            favIds.splice(idx, 1);
            App.showToast('已取消关注');
        }
        setFavorites(favIds);
        renderList();
    };

    function valueColor(status) {
        if (status === 'red') return 'var(--danger)';
        if (status === 'yellow') return 'var(--warning)';
        return 'var(--success)';
    }

    document.querySelectorAll('#domainPills .pill').forEach(function(p) {
        p.addEventListener('click', function() {
            document.querySelectorAll('#domainPills .pill').forEach(function(x) { x.classList.remove('active'); });
            this.classList.add('active');
            currentDomain = this.dataset.domain;
            renderList();
        });
    });

    document.querySelectorAll('#statusFilter .pill').forEach(function(s) {
        s.addEventListener('click', function() {
            document.querySelectorAll('#statusFilter .pill').forEach(function(x) { x.classList.remove('active'); });
            this.classList.add('active');
            currentStatus = this.dataset.status;
            renderList();
        });
    });

    renderStats();
    renderList();
})();
</script>
</body>
</html>
