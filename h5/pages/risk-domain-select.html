<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>选择领域行业</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>.page-hero { display: flex; align-items: center; gap: 12px; padding: 16px 18px; background: linear-gradient(135deg, #1a73e8 0%, #1b6cd5 50%, #1557b0 100%); color: #fff; margin-top: -34px; padding-top: 50px; position: relative; z-index: 1; }
.page-hero p { font-size: 12.5px; opacity: .85; margin-top: 4px; }

.domain-grid { padding: 18px 14px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.domain-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px 14px; text-align: center; box-shadow: 0 2px 10px var(--shadow); }
.domain-card .dc-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 0 auto 12px; color: var(--primary); background: rgba(var(--primary-rgb),.08); border: 1px solid rgba(var(--primary-rgb),.15); }
.domain-card .dc-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.domain-card .dc-count { font-size: 11px; color: var(--text2); margin-top: 5px; }
</style>
</head>
<body>
<div class="phone-frame">
    <!-- 侧边按钮 -->
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <!-- 状态栏 -->
    <div class="status-bar light">
        <span class="sb-time" id="statusTime">9:41</span>
        <span class="sb-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
            <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
        </span>
    </div>

    <div class="page-hero">
        <div class="ph-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
        <div>
            <div class="ph-title">选择领域行业</div>
            <p>请选择要查看的风险领域</p>
        </div>
    </div>

    <div class="domain-grid" id="domainGrid">
        <!-- 动态填充 -->
    </div>

    </div>
</div>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    // 状态栏时间
    var now = new Date();
    document.getElementById('statusTime').textContent =
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

    var mode = App.getQuery('mode') || '';
    var grid = document.getElementById('domainGrid');

    var all = RiskData.getAll ? RiskData.getAll() : [];
    grid.innerHTML = Object.keys(RiskData.domains).map(function(key) {
        var d = RiskData.domains[key];
        var count = all.filter(function(item) { return item.domain === key; }).length;
        var query = 'domain=' + key + (mode ? '&mode=' + mode : '');
        return '<div class="domain-card tap anim" onclick="App.go(\'risk-list.html?' + query + '\')">' +
            '<div class="dc-icon"><i class="fa-solid ' + d.icon + '"></i></div>' +
            '<div class="dc-name">' + App.escapeHtml(d.name) + '</div>' +
            '<div class="dc-count">' + count + ' 项风险</div>' +
        '</div>';
    }).join('');
})();
</script>
</body>
</html>
