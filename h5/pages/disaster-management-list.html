<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>防汛专项隐患管理</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
/* 固定顶部导航 */
.top-sticky { position: -webkit-sticky; position: sticky; top: 0; z-index: 100; flex-shrink: 0; background: linear-gradient(135deg, #1a73e8 0%, #1b6cd5 50%, #1557b0 100%); }
.top-sticky .status-bar { position: relative; z-index: 100; }
.page-hero { display: flex; align-items: center; justify-content: center; padding: calc(34px + 16px) 18px 42px; position: relative; z-index: 99; overflow: hidden; color: #fff; }
.page-hero::before { content: ''; position: absolute; width: 160px; height: 160px; right: -50px; top: -20px; background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%); border-radius: 50%; }
.page-hero .ph-back { position: absolute; left: 14px; top: calc(34px + 16px); margin: 0; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; cursor: pointer; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); box-shadow: 0 2px 6px rgba(0,0,0,.08); z-index: 2; }
.page-hero .ph-title { position: absolute; left: 50%; top: calc(34px + 16px); transform: translateX(-50%); text-align: center; line-height: 32px; width: 60%; color: #fff; font-size: 18px; font-weight: 700; z-index: 2; }

.phone-shell { display: flex; flex-direction: column; overflow: hidden; position: relative; }
.content-sheet { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 16px 0; background: var(--bg-body); scrollbar-width: none; -ms-overflow-style: none; margin-top: 12px; border-radius: 16px 16px 0 0; position: relative; z-index: 1; }
.content-sheet::-webkit-scrollbar { display: none; }

/* 顶部搜索栏 */
.search-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.search-input-wrapper { flex: 1; display: flex; align-items: center; background: transparent; border-radius: var(--radius); box-shadow: none; border: none; position: relative; }
.search-input-wrapper .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--text2); }
.search-input-wrapper input { width: 100%; padding: 9px 12px 9px 38px; border: 1px solid var(--border); background: var(--card); border-radius: var(--radius); box-shadow: 0 2px 8px var(--shadow); font-size: var(--font-sm); color: var(--text-primary); }
.search-input-wrapper input:focus { outline: none; border-color: var(--primary); }
.filter-trigger { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 14px; background: var(--card); color: var(--text2); font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 2px 8px var(--shadow); cursor: pointer; transition: all .15s; }
.filter-trigger:active { transform: scale(.96); }
.filter-trigger .badge-dot { position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); border: 1.5px solid var(--card); display: none; }
.filter-trigger { position: relative; }
.search-input-wrapper .clear-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; border-radius: 50%; background: var(--text2); color: #fff; font-size: 10px; display: none; align-items: center; justify-content: center; cursor: pointer; border: none; padding: 0; }

/* KPI 融合卡片 */
.kpi-row { display: flex; justify-content: space-around; align-items: center; gap: 0; margin-bottom: 14px; background: var(--card); border-radius: 12px; box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); overflow: hidden; flex-shrink: 0; }
.kpi-card { flex: 1; background: transparent; border-radius: 0; padding: 14px 0; text-align: center; box-shadow: none; border: none; position: relative; min-width: 0; }
.kpi-card:not(:last-child)::after { content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 1px; height: 55%; background: var(--border); }
.kpi-value { font-size: 26px; font-weight: 800; line-height: 1; }
.kpi-label { font-size: 14px; color: var(--text2); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-card.total .kpi-value { color: var(--primary); }
.kpi-card.done .kpi-value { color: var(--success); }
.kpi-card.overdue .kpi-value { color: var(--danger); }
.kpi-card.rate .kpi-value { color: var(--warning); }

/* 选中标签 */
.selected-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.tag { background: rgba(var(--primary-rgb),.08); color: var(--primary); border: 1px solid rgba(var(--primary-rgb),.18); border-radius: 999px; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.tag i { cursor: pointer; font-size: 10px; }

/* 卡片列表 */
.section-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-shrink: 0; }
.section-title { font-size: 15px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
.section-title i { color: var(--primary); font-size: 16px; }
.count { font-size: 13px; color: var(--text2); }

.card-list { margin-bottom: 12px; }
.danger-card { background: var(--card); border-radius: 12px; box-shadow: 0 2px 10px var(--shadow); border: 1px solid var(--border); overflow: hidden; margin-bottom: 10px; cursor: pointer; transition: transform .12s; position: relative; }
.danger-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.danger-card[data-level="red"]::before { background: #d93025; }
.danger-card[data-level="orange"]::before { background: #e65100; }
.danger-card[data-level="yellow"]::before { background: #c78000; }
.danger-card[data-level="blue"]::before { background: #1a73e8; }
.danger-card:active { transform: scale(.99); }

.card-inner { padding: 12px 12px 10px 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.badge-status { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; }
.badge-status.done { background: #e6f4ea; color: var(--success); }
.badge-status.undone { background: #fff3e0; color: #e65100; }
.unit-name { font-size: 15px; font-weight: 700; color: var(--text-primary); line-height: 1.4; flex: 1; word-break: break-all; }
.tag-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.level-badge { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
.level-badge.level-red { background: rgba(217,48,37,0.1); color: #d93025; }
.level-badge.level-orange { background: rgba(230,81,0,0.1); color: #e65100; }
.level-badge.level-yellow { background: rgba(199,128,0,0.1); color: #c78000; }
.level-badge.level-blue { background: rgba(26,115,232,0.1); color: #1a73e8; }
.type-badge { display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: rgba(var(--primary-rgb),0.1); color: var(--primary); }

.point-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 13px; color: var(--text-primary); }
.point-row i { color: var(--primary); font-size: 13px; flex-shrink: 0; }
.point-row .point-type { color: var(--text2); }
.address-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 12px; color: var(--text2); }
.address-row i { color: var(--primary); font-size: 12px; flex-shrink: 0; }
.address-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.card-body { padding: 0 0 10px; }
.danger-content { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; color: var(--text-primary); line-height: 1.6; }
.danger-content .warning-icon { color: #f59e0b; font-size: 16px; flex-shrink: 0; margin-top: 2px; }
.danger-content .content-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; }

.card-foot { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 10px 16px; border-top: 1px dashed var(--border); }
.deadline { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
.deadline.overdue { color: var(--danger); font-weight: 600; }
.deadline i { font-size: 12px; }
.deal-btn { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none; border-radius: 16px; padding: 6px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
.deal-btn:active { transform: scale(.97); }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
.empty-state i { font-size: 48px; margin-bottom: 12px; opacity: .5; }
.empty-state .empty-title { font-size: 15px; color: var(--text-primary); margin-bottom: 6px; }
.empty-state .empty-desc { font-size: 13px; }
.bottom-spacer { height: 20px; }

/* 筛选抽屉 */
.modal-sheet { position: absolute; left: 0; bottom: 0; width: 100%; max-height: 80%; display: flex !important; flex-direction: column; opacity: 0; pointer-events: none; transform: translateY(100%); transition: transform .25s ease, opacity .25s ease; z-index: 1001; background: var(--card); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
.modal-sheet.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.modal-mask { display: none; opacity: 0; transition: opacity .25s ease; z-index: 1000; }
.modal-mask.show { display: block; opacity: 1; }
.sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sheet-title { font-size: 16px; font-weight: 700; }
.sheet-close { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--text2); cursor: pointer; }
.sheet-body { padding: 16px; flex: 1; overflow-y: auto; min-height: 0; }
.filter-section { margin-bottom: 18px; }
.filter-section .filter-title { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
.filter-section .filter-options { display: flex; flex-wrap: wrap; gap: 10px; }
.filter-chip { padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-primary); cursor: pointer; transition: all .15s; }
.filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.sheet-footer { display: flex; gap: 12px; padding: 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
.sheet-footer .btn { flex: 1; height: 44px; border-radius: 10px; }

:root[data-theme="dark"] .danger-card, :root[data-theme="dark"] .search-input-wrapper, :root[data-theme="dark"] .filter-trigger { background: var(--bg-card); border-color: var(--border); }
:root[data-theme="dark"] .kpi-row { background: var(--bg-card); border-color: var(--border); }
:root[data-theme="dark"] .kpi-card:not(:last-child)::after { background: var(--border); }
:root[data-theme="dark"] .card-foot { border-top-color: var(--border); }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="top-sticky">
            <div class="status-bar light">
                <span class="sb-time" id="statusTime">9:41</span>
                <span class="sb-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                    <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
                </span>
            </div>
            <div class="page-hero">
                <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
                <div class="ph-title">防汛专项隐患管理</div>
            </div>
        </div>

        <div class="content-sheet" id="contentSheet">
            <div class="kpi-row" id="kpiRow">
                <div class="kpi-card total">
                    <div class="kpi-value" id="kpiTotal">0</div>
                    <div class="kpi-label">隐患总数</div>
                </div>
                <div class="kpi-card done">
                    <div class="kpi-value" id="kpiDone">0</div>
                    <div class="kpi-label">已整改</div>
                </div>
                <div class="kpi-card overdue">
                    <div class="kpi-value" id="kpiOverdue">0</div>
                    <div class="kpi-label">已逾期</div>
                </div>
                <div class="kpi-card rate">
                    <div class="kpi-value" id="kpiRate">0%</div>
                    <div class="kpi-label">整改率</div>
                </div>
            </div>

            <div class="search-bar">
                <div class="search-input-wrapper">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="搜索隐患单位/隐患内容/街镇" autocomplete="off">
                    <button class="clear-btn" id="clearSearch" onclick="clearSearch(event)"><i class="fa-solid fa-times"></i></button>
                </div>
                <div class="filter-trigger" id="filterTrigger" onclick="openDrawer()">
                    <i class="fa-solid fa-filter"></i> 筛选
                    <span class="badge-dot" id="filterDot"></span>
                </div>
            </div>

            <div class="selected-tags" id="selectedTags"></div>

            <div class="section-title-row">
                <div class="section-title"><i class="fa-solid fa-circle-exclamation" style="color: var(--primary); margin-right: 0;"></i><span>隐患列表</span></div>
                <div class="count" id="totalCount">共 0 条</div>
            </div>

            <div class="card-list" id="cardList"></div>
            <div class="empty-state" id="empty" style="display:none">
                <i class="fa-regular fa-folder-open"></i>
                <div class="empty-title">暂无符合条件的隐患</div>
                <div class="empty-desc">请调整筛选或搜索条件</div>
            </div>
            <div class="bottom-spacer"></div>
        </div>

        <div class="modal-mask" id="drawerOverlay" onclick="closeDrawer()"></div>
        <div class="modal-sheet" id="drawer">
            <div class="sheet-header">
                <div class="sheet-title">筛选条件</div>
                <div class="sheet-close" onclick="closeDrawer()"><i class="fa-solid fa-times"></i></div>
            </div>
            <div class="sheet-body" id="drawerBody"></div>
            <div class="sheet-footer">
                <button class="btn btn-outline" onclick="resetFilters()">重置</button>
                <button class="btn btn-primary" onclick="confirmFilters()">确定</button>
            </div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    var rawData = (typeof DataStore !== 'undefined' && Array.isArray(DataStore.hiddenDangers)) ? DataStore.hiddenDangers : [];

    var companyNames = ['上海南康钢结构建筑有限公司', '上海建工四建集团有限公司', '上海海贤能源股份有限公司', '奉贤区交警支队', '金汇镇人民政府'];
    var detailAddresses = [
        '南桥镇人民南路 1128 号幸福东方商城 3 号楼顶楼',
        '奉城镇浦卫东路 18 号建工一村外墟',
        '金汇镇金闸路 99 号海贤大厦 1 楼食堂',
        '南桥镇运河路与南亭公路路口东南角',
        '四团镇浦星路 168 号上海国际汽车城二期'
    ];
    var allData = rawData.map(function(item, idx) {
        var address = (item.location && item.location.address) || item.detailAddress || item.location || '';
        var regionMatch = (address || '').match(/^([\u4e00-\u9fa5]+镇|[\u4e00-\u9fa5]+街道|[\u4e00-\u9fa5]+社区)/);
        var region = regionMatch ? regionMatch[1] : (address ? address.split('')[0] + '镇' : townNames[idx % townNames.length]);
        var level = item.level || 'blue';
        var levelMap = { red: '重大隐患', orange: '较大隐患', yellow: '一般隐患', blue: '轻微隐患' };
        var companyName = item.hazardUnit || item.unit || item.responsibleUnit || companyNames[idx % companyNames.length] || '';
        var reportingUnits = ['交运中心', '区安质监站', '区交建中心', '区燃气所', '区防汛办'];
        var detailAddress = item.detailAddress || detailAddresses[idx % detailAddresses.length] || '';
        return {
            id: item.id || item.eventNo || '',
            title: companyName,
            unit: companyName,
            streetTown: region,
            region: region,
            address: address,
            detailAddress: detailAddress,
            hazardPoint: item.hazardPoint || '',
            type: item.type || '',
            level: level,
            levelLabel: levelMap[level] || levelMap.blue,
            source: reportingUnits[idx % reportingUnits.length] || item.source || '巡查',
            content: item.description || item.hazard || '',
            deadline: item.deadline || '',
            deadlineDate: formatDeadline(item.deadline || ''),
            completeTime: formatDeadline(item.completeTime || item.closeTime || ''),
            status: item.status || 'reported',
            statusLabel: statusLabel(item.status || 'reported'),
            isDone: item.status === 'closed' || item.status === 'completed',
            isOverdue: isOverdue(item.deadline || '', item.status || 'reported')
        };
    });

    // 补齐真实街镇（从地址提取，如不足则默认）
    var townNames = ['南桥镇', '奉城镇', '庄行镇', '金汇镇', '青村镇', '海湾镇', '四团镇', '柘林镇', '西渡街道'];
    allData.forEach(function(item, idx) {
        if (!item.address) item.address = item.region + ' · ' + item.source;
        if (!item.detailAddress) item.detailAddress = detailAddresses[idx % detailAddresses.length];
        if (!item.region || item.region.length < 2) {
            item.region = townNames[idx % townNames.length];
        } else if (!item.region.endsWith('镇') && !item.region.endsWith('街道')) {
            item.region = townNames[idx % townNames.length];
        }
    });

    var selectedFilters = { streetTown: '', level: '', status: '' };

    var townOptions = (function() {
        var set = {};
        allData.forEach(function(item) { if (item.region) set[item.region] = true; });
        var list = Object.keys(set);
        list.sort();
        return ['全部'].concat(list);
    })();

    var levelOptions = ['全部', '重大隐患', '较大隐患', '一般隐患', '轻微隐患'];
    var levelMap = { '重大隐患': 'red', '较大隐患': 'orange', '一般隐患': 'yellow', '轻微隐患': 'blue' };
    var levelLabelReverse = { 'red': '重大', 'orange': '较大', 'yellow': '一般', 'blue': '低' };

    var statusOptions = ['全部', '已整改', '未整改'];

    function levelLabel(level) {
        var map = { red: '重大隐患', orange: '较大隐患', yellow: '一般隐患', blue: '轻微隐患' };
        return map[level] || '轻微隐患';
    }

    function statusLabel(status) {
        if (status === 'closed' || status === 'completed') return '已整改';
        return '未整改';
    }

    function isOverdue(deadline, status) {
        if (status === 'closed' || status === 'completed') return false;
        if (!deadline) return false;
        var d = new Date(deadline);
        if (isNaN(d.getTime())) return false;
        return d < new Date();
    }

    function formatDeadline(deadline) {
        if (!deadline) return '—';
        var d = new Date(deadline);
        if (isNaN(d.getTime())) return '—';
        var y = d.getFullYear();
        var m = d.getMonth() + 1;
        var day = d.getDate();
        return y + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
    }

    // 补充一条逾期测试数据
    allData.push({
        id: 'HD-TEST-0001',
        title: '金汇镇某小区围墙开裂',
        unit: '上海南康钢结构建筑有限公司',
        streetTown: '金汇镇',
        region: '金汇镇',
        level: 'yellow',
        levelLabel: '一般隐患',
        source: '巡查',
        content: '小区外围围墙出现明显裂缝，存在坍塌风险。',
        deadline: new Date(new Date().getTime() - 2 * 24 * 60 * 60 * 1000).toISOString(),
        deadlineDate: formatDeadline(new Date(new Date().getTime() - 2 * 24 * 60 * 60 * 1000).toISOString()),
        completeTime: '',
        status: 'reported',
        statusLabel: '未整改',
        isDone: false,
        isOverdue: true
    });

    function getFilteredData() {
        var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        return allData.filter(function(item) {
            if (keyword) {
                var hay = [item.title, item.unit, item.region, item.levelLabel, item.content].join(' ').toLowerCase();
                if (hay.indexOf(keyword) === -1) return false;
            }
            if (selectedFilters.streetTown && selectedFilters.streetTown !== '全部' && item.region !== selectedFilters.streetTown) return false;
            if (selectedFilters.level && selectedFilters.level !== '全部' && item.levelLabel !== selectedFilters.level) return false;
            if (selectedFilters.status && selectedFilters.status !== '全部') {
                if (selectedFilters.status === '已整改' && !item.isDone) return false;
                if (selectedFilters.status === '未整改' && item.isDone) return false;
            }
            return true;
        });
    }

    function renderKpis(data) {
        var total = data.length;
        var done = data.filter(function(i) { return i.isDone; }).length;
        var overdue = data.filter(function(i) { return i.isOverdue; }).length;
        var rate = total ? Math.round(done / total * 100) : 0;
        document.getElementById('kpiTotal').textContent = total;
        document.getElementById('kpiDone').textContent = done;
        document.getElementById('kpiOverdue').textContent = overdue;
        document.getElementById('kpiRate').textContent = rate + '%';
    }

    function renderCard(item) {
        var levelBadgeCls = 'level-badge level-' + App.escapeHtml(item.level || 'blue');
        var statusCls = item.isDone ? 'badge-status done' : 'badge-status undone';
        var deadlineCls = item.isOverdue ? 'overdue' : '';
        var pointLine = item.hazardPoint || item.address || '';
        return '<div class="danger-card" onclick="goDetail(' + "'" + App.escapeHtml(item.id) + "'" + ')" data-level="' + App.escapeHtml(item.level) + '">' +
            '<div class="card-inner">' +
                '<div class="card-head">' +
                    '<div class="unit-name">' + App.escapeHtml(item.unit) + '</div>' +
                    '<span class="badge ' + statusCls + '">' + App.escapeHtml(item.statusLabel) + '</span>' +
                '</div>' +
                '<div class="tag-row">' +
                    '<div class="' + levelBadgeCls + '">' + App.escapeHtml(item.levelLabel) + '</div>' +
                    (item.type ? '<div class="type-badge">' + App.escapeHtml(item.type) + '</div>' : '') +
                '</div>' +
                '<div class="card-body">' +
                    '<div class="danger-content">' +
                        '<i class="fa-solid fa-triangle-exclamation warning-icon"></i>' +
                        '<span class="content-text">' + App.escapeHtml(item.content) + '</span>' +
                    '</div>' +
                '</div>' +
                (pointLine ? '<div class="point-row"><i class="fa-solid fa-thumbtack"></i><span>' + App.escapeHtml(pointLine) + '</span></div>' : '') +
                (item.detailAddress ? '<div class="address-row"><i class="fa-solid fa-location-dot"></i><span>' + App.escapeHtml(item.detailAddress) + '</span></div>' : '') +
            '</div>' +
            '<div class="card-foot">' +
                (item.isDone ?
                    '<div class="deadline"><i class="fa-regular fa-calendar-check"></i> 完成时间：' + App.escapeHtml(item.completeTime || item.deadlineDate) + '</div>' :
                    '<div class="deadline ' + deadlineCls + '"><i class="fa-regular fa-clock"></i> 完成时限：' + App.escapeHtml(item.deadlineDate) + (item.isOverdue ? ' · 已逾期' : '') + '</div>' +
                    '<button class="deal-btn" onclick="deal(event, ' + "'" + App.escapeHtml(item.id) + "'" + ')">立即处置</button>') +
            '</div>' +
        '</div>';
    }

    function renderList() {
        var data = getFilteredData();
        var container = document.getElementById('cardList');
        container.innerHTML = '';
        document.getElementById('totalCount').textContent = '共 ' + data.length + ' 条';
        renderKpis(data);
        if (data.length === 0) {
            document.getElementById('empty').style.display = 'block';
            return;
        }
        document.getElementById('empty').style.display = 'none';
        data.forEach(function(item) { container.innerHTML += renderCard(item); });
    }

    window.goDetail = function(id) {
        window.location.href = 'disaster-management-detail.html?id=' + encodeURIComponent(id);
    };

    window.deal = function(e, id) {
        e.stopPropagation();
        window.location.href = 'disaster-management-deal.html?id=' + encodeURIComponent(id);
    };

    function updateSearchClear() {
        var btn = document.getElementById('clearSearch');
        btn.style.display = document.getElementById('searchInput').value ? 'flex' : 'none';
    }

    window.clearSearch = function(e) {
        e.stopPropagation();
        document.getElementById('searchInput').value = '';
        updateSearchClear();
        renderList();
    };

    document.getElementById('searchInput').addEventListener('input', function() {
        updateSearchClear();
        renderList();
    });

    function renderSelectedTags() {
        var container = document.getElementById('selectedTags');
        var html = '';
        var count = 0;
        if (selectedFilters.streetTown && selectedFilters.streetTown !== '全部') {
            html += '<span class="tag">街镇：' + App.escapeHtml(selectedFilters.streetTown) + '<i class="fa-solid fa-times" onclick="removeFilter(' + "'streetTown'" + ')"></i></span>';
            count++;
        }
        if (selectedFilters.level && selectedFilters.level !== '全部') {
            html += '<span class="tag">等级：' + App.escapeHtml(selectedFilters.level) + '<i class="fa-solid fa-times" onclick="removeFilter(' + "'level'" + ')"></i></span>';
            count++;
        }
        if (selectedFilters.status && selectedFilters.status !== '全部') {
            html += '<span class="tag">状态：' + App.escapeHtml(selectedFilters.status) + '<i class="fa-solid fa-times" onclick="removeFilter(' + "'status'" + ')"></i></span>';
            count++;
        }
        container.innerHTML = html;
        var dot = document.getElementById('filterDot');
        var trigger = document.getElementById('filterTrigger');
        if (count > 0) { dot.style.display = 'block'; trigger.classList.add('active'); }
        else { dot.style.display = 'none'; trigger.classList.remove('active'); }
    }

    window.removeFilter = function(key) {
        selectedFilters[key] = '';
        renderSelectedTags();
        renderDrawer();
        renderList();
    };

    window.openDrawer = function() {
        document.getElementById('drawerOverlay').classList.add('show');
        document.getElementById('drawer').classList.add('show');
    };

    window.closeDrawer = function() {
        document.getElementById('drawerOverlay').classList.remove('show');
        document.getElementById('drawer').classList.remove('show');
    };

    function renderDrawer() {
        var html = '';
        html += '<div class="filter-section">';
        html += '<div class="filter-title">所属街镇</div>';
        html += '<div class="filter-options">';
        townOptions.forEach(function(opt) {
            var active = selectedFilters.streetTown === opt ? ' active' : '';
            html += '<span class="filter-chip' + active + '" onclick="selectChip(this, ' + "'streetTown', '" + opt + "'" + ')">' + App.escapeHtml(opt) + '</span>';
        });
        html += '</div></div>';

        html += '<div class="filter-section">';
        html += '<div class="filter-title">隐患等级</div>';
        html += '<div class="filter-options">';
        levelOptions.forEach(function(opt) {
            var active = selectedFilters.level === opt ? ' active' : '';
            html += '<span class="filter-chip' + active + '" onclick="selectChip(this, ' + "'level', '" + opt + "'" + ')">' + App.escapeHtml(opt) + '</span>';
        });
        html += '</div></div>';

        html += '<div class="filter-section">';
        html += '<div class="filter-title">整改状态</div>';
        html += '<div class="filter-options">';
        statusOptions.forEach(function(opt) {
            var active = selectedFilters.status === opt ? ' active' : '';
            html += '<span class="filter-chip' + active + '" onclick="selectChip(this, ' + "'status', '" + opt + "'" + ')">' + App.escapeHtml(opt) + '</span>';
        });
        html += '</div></div>';
        document.getElementById('drawerBody').innerHTML = html;
    }

    window.selectChip = function(el, key, value) {
        selectedFilters[key] = value;
        renderDrawer();
    };

    window.resetFilters = function() {
        selectedFilters = { streetTown: '', level: '', status: '' };
        renderDrawer();
        renderSelectedTags();
        closeDrawer();
        renderList();
    };

    window.confirmFilters = function() {
        renderSelectedTags();
        closeDrawer();
        renderList();
    };

    function updateTime() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        document.getElementById('statusTime').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    }
    updateTime();
    setInterval(updateTime, 60000);

    renderDrawer();
    renderSelectedTags();
    renderList();
})();
</script>
</body>
</html>
