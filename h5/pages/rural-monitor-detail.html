        .house-name { font-size: var(--font-xl); font-weight: 600; margin-bottom: 8px; position: relative; }

        .house-meta span { display: flex; align-items: center; gap: 4px; }

        .realtime-card {
            background: var(--bg-card); margin: var(--space-sm) var(--space); border-radius: var(--radius-lg);
            padding: var(--space); box-shadow: 0 2px 8px var(--shadow); display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border);
        }
        .realtime-value { display: flex; flex-direction: column; gap: 4px; }
        .realtime-label { font-size: var(--font-sm); color: var(--text-secondary); }
        .realtime-number { font-size: 36px; font-weight: 700; line-height: 1; }
        .realtime-number.normal { color: var(--success); }
        .realtime-number.warning { color: var(--warning); }
        .realtime-number.alarm { color: var(--danger); }
        .realtime-unit { font-size: 14px; font-weight: 400; margin-left: 4px; }
        .realtime-status { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .status-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .status-icon.normal { background: rgba(var(--success-rgb), .12); color: var(--success); }
        .status-icon.warning { background: rgba(var(--warning-rgb), .12); color: var(--warning); }
        .status-icon.alarm { background: rgba(var(--danger-rgb), .12); color: var(--danger); }
        .status-text { font-size: var(--font-sm); font-weight: 600; }
        .status-text.normal { color: var(--success); }
        .status-text.warning { color: var(--warning); }
        .status-text.alarm { color: var(--danger); }

        .detail-tabs {
            display: flex; background: var(--bg-card); border-bottom: 1px solid var(--border);
            margin: var(--space-sm) var(--space) 0;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0; overflow: hidden;
            position: -webkit-sticky; position: sticky; top: 0; z-index: 90;
        }
        .detail-tab { flex: 1; text-align: center; padding: 12px 0; font-size: var(--font-base); font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; position: relative; background: var(--bg-card); border: none; }
        .detail-tab.active { color: var(--primary); font-weight: 600; }
        .detail-tab.active::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 40px; height: 3px; background: var(--primary); border-radius: 2px 2px 0 0; }
        .tab-panel { display: none; padding: var(--space-sm) var(--space); }
        .tab-panel .card { margin-left: 0; margin-right: 0; }
        .tab-panel .card:not(:first-child) { margin-top: var(--space-sm); }
        .tab-panel.active { display: block; }

        .time-filter { display: flex; gap: 8px; margin-bottom: var(--space-sm); }
        .time-tag { flex: 1; text-align: center; padding: 6px 0; border-radius: var(--radius-sm); font-size: var(--font-sm); border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); cursor: pointer; transition: all 0.2s; }
        .time-tag.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .trend-chart { height: 200px; position: relative; background: var(--bg-dark); border-radius: var(--radius); overflow: hidden; }
        .chart-placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-secondary); font-size: var(--font-sm); flex-direction: column; gap: 8px; }
        .chart-placeholder i { font-size: 32px; color: var(--border); }

        .stats-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: var(--space-sm); }
        .stat-box { text-align: center; padding: 10px; background: var(--bg-dark); border-radius: var(--radius); }
        .stat-box-value { font-size: 18px; font-weight: 700; color: var(--text-primary); }
        .stat-box-label { font-size: var(--font-xs); color: var(--text-secondary); margin-top: 2px; }

        .alarm-list { max-height: 300px; overflow-y: auto; }
        .alarm-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .alarm-item:last-child { border-bottom: none; padding-bottom: 0; }
        .alarm-time-line { display: flex; flex-direction: column; align-items: center; width: 40px; flex-shrink: 0; }
        .alarm-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); margin-top: 4px; }
        .alarm-dot.warning { background: var(--warning); }
        .alarm-line { flex: 1; width: 2px; background: var(--border); margin-top: 4px; }
        .alarm-content { flex: 1; }
        .alarm-time { font-size: var(--font-xs); color: var(--text-secondary); margin-bottom: 4px; }
        .alarm-desc { font-size: var(--font-base); color: var(--text-primary); line-height: 1.5; }
        .alarm-value { font-size: var(--font-sm); color: var(--danger); font-weight: 600; margin-top: 2px; }
        .alarm-value.warning { color: var(--warning); }

        .info-row { display: flex; justify-content: space-between; align-items: flex-start; }
        .info-row-label { font-size: var(--font-sm); color: var(--text-secondary); flex-shrink: 0; width: 80px; }
        .info-row-value { font-size: var(--font-base); color: var(--text-primary); text-align: right; flex: 1; }

        .map-container { height: 160px; background: var(--bg-dark); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: var(--text-secondary); font-size: var(--font-sm); position: relative; overflow: hidden; }

function generateHistory(base, max, min, alarm) {
    var history = [];
    var now = new Date('2025-06-26T14:00:00');
    for (var i = 30; i >= 0; i--) {
        var t = new Date(now.getTime() - i * 24 * 60 * 60 * 1000);
        var value = base + (Math.random() - 0.5) * (max - min);
        if (i === 0) value = alarm;
        history.push({ time: formatDate(t), value: parseFloat(value.toFixed(2)) });
    }
    return history;
}

function formatDate(date) {
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, '0');
    var d = String(date.getDate()).padStart(2, '0');
    var h = String(date.getHours()).padStart(2, '0');
    var min = String(date.getMinutes()).padStart(2, '0');
    var s = String(date.getSeconds()).padStart(2, '0');
    return y + '-' + m + '-' + d + ' ' + h + ':' + min + ':' + s;
}

    document.getElementById('houseLocation').textContent = house.location;

    var valueEl = document.getElementById('realtimeValue');
    valueEl.innerHTML = house.value + '<span class="realtime-unit">' + house.unit + '</span>';
    valueEl.className = 'realtime-number ' + status.class;

    document.getElementById('statusIcon').className = 'status-icon ' + status.class;
    document.getElementById('statusIcon').innerHTML = '<i class="fas ' + status.icon + '"></i>';
    document.getElementById('statusText').className = 'status-text ' + status.class;
    document.getElementById('statusText').textContent = status.label;

    document.getElementById('houseStructure').textContent = house.structure;
    document.getElementById('buildYear').textContent = house.buildYear;
    document.getElementById('houseFloors').textContent = house.floors;
    document.getElementById('houseArea').textContent = house.area;
    document.getElementById('monitorDevice').textContent = house.device;
    document.getElementById('installDate').textContent = house.installDate;
    document.getElementById('houseOwner').textContent = house.owner;
    document.getElementById('ownerPhone').textContent = house.phone;

    document.getElementById('houseTags').innerHTML = house.tags.map(function(t) {
        return '<span class="house-tag"><i class="fa-solid fa-tag"></i> ' + App.escapeHtml(t) + '</span>';
    }).join('');

    document.getElementById('detailAddress').textContent = house.location;
    document.getElementById('coordinates').textContent = house.coordinates;

    renderAlarmRecords(house.alarmRecords || [], 'alarmList');

    initChart(house);
    renderTrend('24h', house);
}

function initChart(house) {
    var chartEl = document.getElementById('trendChart');
    chartEl.innerHTML = '';
    chart = echarts.init(chartEl);
}

function renderTrend(range, house) {
    if (!chart) return;

    var all = house.history || [];
    var data = [];

    if (range === '24h') {
        data = all.slice(-7).map(function(h) { return { time: h.time.substring(11, 16), value: h.value }; });
    } else if (range === '7d') {
        data = all.slice(-7).map(function(h) { return { time: h.time.substring(5, 10), value: h.value }; });
    } else {
        data = all.map(function(h, idx) { if (idx % 3 !== 0) return null; return { time: h.time.substring(5, 10), value: h.value }; }).filter(Boolean);
    }

    var values = data.map(function(d) { return d.value; });
    if (!values.length) {
        document.getElementById('maxValue').textContent = '--';
        document.getElementById('minValue').textContent = '--';
        document.getElementById('avgValue').textContent = '--';
        chart.clear();
        return;
    }

    var max = Math.max.apply(null, values);
    var min = Math.min.apply(null, values);
    var avg = values.reduce(function(a, b) { return a + b; }, 0) / values.length;

    document.getElementById('maxValue').textContent = max.toFixed(2) + house.unit;
    document.getElementById('minValue').textContent = min.toFixed(2) + house.unit;
    document.getElementById('avgValue').textContent = avg.toFixed(2) + house.unit;

    var hexColor = house.status === 'red' ? '#ef4444' : (house.status === 'yellow' || house.status === 'orange' ? '#f59e0b' : '#22c55e');

    chart.setOption({
        grid: { left: 10, right: 10, top: 30, bottom: 20, containLabel: true },
        tooltip: { trigger: 'axis' },
        xAxis: {
            type: 'category',
            data: data.map(function(d) { return d.time; }),
            axisLine: { lineStyle: { color: '#e5e7eb' } },
            axisLabel: { color: '#6b7280', fontSize: 11, interval: 'auto' },
            axisTick: { alignWithLabel: true }
        },
        yAxis: { type: 'value', splitLine: { lineStyle: { color: '#f3f4f6' } }, axisLabel: { color: '#6b7280', fontSize: 11 } },
        series: [{
            data: values,
            type: 'line',
            smooth: true,
            symbol: 'circle',
            symbolSize: 6,
            lineStyle: { color: hexColor, width: 3 },
            itemStyle: { color: hexColor },
            areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: hexColor + '40' }, { offset: 1, color: hexColor + '05' }] } }
        }]
    }, true);
    setTimeout(function() { chart.resize(); }, 100);
}

function renderAlarmRecords(records, elementId) {
    var listEl = document.getElementById(elementId);
    if (!records || records.length === 0) {
        listEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-secondary)">暂无报警记录</div>';
        return;
    }

    listEl.innerHTML = records.map(function(record, index) {
        var isLast = index === records.length - 1;
        var typeClass = record.type === 'warning' ? 'warning' : '';
        return '<div class="alarm-item">' +
            '<div class="alarm-time-line">' +
            '<div class="alarm-dot ' + typeClass + '"></div>' +
            (isLast ? '' : '<div class="alarm-line"></div>') +
            '</div>' +
            '<div class="alarm-content">' +
            '<div class="alarm-time">' + App.escapeHtml(record.time) + '</div>' +
            '<div class="alarm-desc">' + App.escapeHtml(record.desc) + '</div>' +
            '<div class="alarm-value ' + typeClass + '">数值: ' + App.escapeHtml(record.value) + '</div>' +
            '</div>' +
            '</div>';
    }).join('');
}

function switchTab(el, panelId) {
    document.querySelectorAll('.detail-tab').forEach(function(tab) { tab.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(panel) { panel.classList.remove('active'); });
    el.classList.add('active');
    document.getElementById('panel-' + panelId).classList.add('active');
    if (panelId === 'overview' && chart) { setTimeout(function() { chart.resize(); }, 50); }
}

function switchTimeRange(el, range) {
    document.querySelectorAll('.time-tag').forEach(function(tag) { tag.classList.remove('active'); });
    el.classList.add('active');
    var id = App.getQuery('id') || 'RHC-001';
    var house = ruralHouseData[id];
    if (house) renderTrend(range, house);
}

initPage();
</script>
</body>
</html>
