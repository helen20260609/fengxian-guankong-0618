<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>应急领导小组成员详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>

.status-bar { position: relative; z-index: 100; }.page-hero { position: relative; z-index: 99; display: flex; flex-direction: column; align-items: center; padding: calc(34px + 16px) 18px 42px; }

.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; }
.content-sheet.page-body-sheet { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 0 0 16px; background: #f5f6fa; margin-top: 0; border-radius: 0; }
.content-sheet.page-body-sheet::-webkit-scrollbar { display: none; }

.hero-card {
    background: linear-gradient(180deg, #1557b0 0%, #1a73e8 100%);
    border-radius: 16px;
    margin: 12px 16px 14px;
    padding: 20px 16px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 6px 18px rgba(26,115,232,.22);
    position: relative;
    overflow: hidden;
}
.hero-card::before {
    content: '';
    position: absolute;
    width: 120px;
    height: 120px;
    right: -30px;
    top: -30px;
    background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%);
    border-radius: 50%;
}
.hero-card .person-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 500;
    color: #fff;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
}
.hero-card .person-title {
    flex: 1;
    position: relative;
    z-index: 1;
}
.hero-card .person-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
}
.hero-card .person-name {
    font-size: 18px;
    font-weight: 700;
}
.hero-card .person-post {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    background: rgba(255,255,255,.25);
    border: 1px solid rgba(255,255,255,.3);
}
.hero-card .person-position {
    font-size: 13px;
    color: rgba(255,255,255,.8);
    margin-top: 6px;
    font-weight: 600;
}

.action-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 0 16px 14px;
}
.action-grid-cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all .15s;
}
.action-grid-cell:active { transform: scale(.97); }
.action-grid-cell.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.action-grid-cell .ag-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}
.action-grid-cell .ag-icon.phone { background: rgba(30,142,62,.12); color: var(--success); }
.action-grid-cell .ag-icon.office { background: rgba(26,115,232,.1); color: var(--primary); }
.action-grid-cell .ag-icon.copy { background: rgba(230,81,0,.1); color: #e65100; }
.action-grid-cell .ag-label { font-size: 12px; color: var(--text-primary); font-weight: 500; }
.action-grid-cell .ag-label.disabled { color: var(--text2); }

.section-v2 { background: #fff; border-radius: 12px; margin: 0 16px 12px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.section-v2:last-of-type { margin-bottom: 16px; }
.sv2-head { margin-bottom: 10px; }
.sv2-title { font-size: 15px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 0; position: relative; padding-left: 10px; }
.sv2-title::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--primary); }
.sv2-title i { display: none; }

.sc-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #f2f2f2; gap: 16px; }
.sc-row:last-child { border-bottom: none; padding-bottom: 0; }
.sc-row.wrap { align-items: flex-start; }
.sc-label { font-size: 14px; color: var(--text2); text-align: left; line-height: 1.4; flex-shrink: 0; }
.sc-value { flex: 1; min-width: 0; font-size: 14px; color: var(--text-primary); font-weight: 500; text-align: right; line-height: 1.4; word-break: break-word; }
.sc-value.phone { color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; }
.sc-value.phone i { font-size: 12px; }
.sc-value.na { color: var(--text2); }

.bottom-spacer { height: 20px; }

:root[data-theme="dark"] .section-v2 { background: var(--bg-card); }
:root[data-theme="dark"] .hero-card { background: linear-gradient(180deg, #0e3870 0%, #1557b0 100%); }
:root[data-theme="dark"] .action-grid-cell { background: var(--bg-card); border-color: var(--border); }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title" id="heroName">成员详情</div>
        </div>

        <div class="content-sheet page-body-sheet" style="padding:0 0 16px">
            <!-- 头部蓝色渐变卡片 -->
            <div class="hero-card">
                <div class="person-avatar" id="avatarText">--</div>
                <div class="person-title">
                    <div class="person-name-row">
                        <div class="person-name" id="personName">--</div>
                        <div class="person-post" id="personPost">--</div>
                    </div>
                    <div class="person-position" id="personPosition">--</div>
                </div>
            </div>

            <!-- 快捷操作三宫格 -->
            <div class="action-grid">
                <div class="action-grid-cell" id="callMobileAction">
                    <div class="ag-icon phone"><i class="fa-solid fa-mobile-screen"></i></div>
                    <div class="ag-label">拨打手机</div>
                </div>
                <div class="action-grid-cell" id="callOfficeAction">
                    <div class="ag-icon office" id="officeIcon"><i class="fa-solid fa-phone"></i></div>
                    <div class="ag-label" id="officeLabel">拨打办公电话</div>
                </div>
                <div class="action-grid-cell" id="copyMobileAction">
                    <div class="ag-icon copy"><i class="fa-solid fa-copy"></i></div>
                    <div class="ag-label">复制手机号</div>
                </div>
            </div>

            <!-- 人员信息卡片 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">人员信息</div></div>
                <div id="personInfo"></div>
            </div>

            <!-- 联系方式卡片 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">联系方式</div></div>
                <div id="contactInfo"></div>
            </div>

            <!-- 填报信息卡片 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">填报信息</div></div>
                <div id="reportInfo"></div>
            </div>

            <div class="bottom-spacer"></div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/emergency-leadership-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    var embeddedData = window.EMERGENCY_LEADERSHIP_DATA || [];

    function loadData() {
        var id = App.getQuery('id');
        var fromStorage = null;
        try { fromStorage = JSON.parse(localStorage.getItem('emergencyLeadershipData') || '[]'); } catch (e) {}
        var list = Array.isArray(fromStorage) && fromStorage.length ? fromStorage : embeddedData;
        if (id) {
            var found = list.find(function(i) { return i.id === id; });
            if (found) return found;
        }
        return embeddedData[0];
    }

    var item = loadData();

    function getVal(v) {
        return v && String(v).trim() ? v : '—';
    }

    function renderInfoGrid(pairs) {
        return pairs.map(function(p) {
            return '<div class="sc-row"><div class="sc-label">' + p.label + '</div><div class="sc-value ' + (p.cls || '') + '"' + (p.id ? ' id="' + p.id + '"' : '') + '>' + p.value + '</div></div>';
        }).join('');
    }

    function renderHero() {
        document.getElementById('heroName').textContent = item.name ? item.name + ' - 成员详情' : '成员详情';
        document.getElementById('avatarText').textContent = item.name ? item.name.charAt(0) : '?';
        document.getElementById('personName').textContent = item.name || '--';
        document.getElementById('personPost').textContent = item.floodPost || '--';
        document.getElementById('personPosition').textContent = item.position || '--';
    }

    function renderPersonInfo() {
        var rows = [
            { label: '姓名', value: App.escapeHtml(getVal(item.name)) },
            { label: '行政职务', value: App.escapeHtml(getVal(item.position)) },
            { label: '防汛职务', value: App.escapeHtml(getVal(item.floodPost)) }
        ];
        document.getElementById('personInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderContactInfo() {
        var rows = [
            { label: '手机', value: App.escapeHtml(getVal(item.mobilePhone)), cls: 'phone', id: 'mobilePhoneValue' },
            { label: '办公电话', value: App.escapeHtml(getVal(item.officePhone)), cls: 'phone', id: 'officePhoneValue' }
        ];
        document.getElementById('contactInfo').innerHTML = renderInfoGrid(rows);

        var mobileEl = document.getElementById('mobilePhoneValue');
        if (mobileEl && item.mobilePhone) {
            mobileEl.innerHTML = '<i class="fa-solid fa-phone"></i> ' + App.escapeHtml(item.mobilePhone);
            mobileEl.style.cursor = 'pointer';
            mobileEl.addEventListener('click', function() {
                window.location.href = 'tel:' + item.mobilePhone;
                App.showToast('正在呼叫 ' + App.escapeHtml(item.name) + ' ' + App.escapeHtml(item.mobilePhone));
            });
        }

        var officeEl = document.getElementById('officePhoneValue');
        if (officeEl && item.officePhone) {
            officeEl.innerHTML = '<i class="fa-solid fa-phone"></i> ' + App.escapeHtml(item.officePhone);
            officeEl.style.cursor = 'pointer';
            officeEl.addEventListener('click', function() {
                window.location.href = 'tel:' + item.officePhone;
                App.showToast('正在呼叫 ' + App.escapeHtml(item.name) + ' ' + App.escapeHtml(item.officePhone));
            });
        }
    }

    function renderReportInfo() {
        var rows = [
            { label: '填报单位', value: App.escapeHtml(getVal(item.reportUnit)) },
            { label: '填报人', value: App.escapeHtml(getVal(item.reportPerson)) },
            { label: '填报日期', value: App.escapeHtml(getVal(item.reportDate)) }
        ];
        document.getElementById('reportInfo').innerHTML = renderInfoGrid(rows);
    }

    function copyToClipboard(text, successMsg) {
        if (!text || !String(text).trim()) return;
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(function() {
                App.showToast(successMsg);
            }).catch(function() {
                fallbackCopy(text, successMsg);
            });
        } else {
            fallbackCopy(text, successMsg);
        }
    }

    function fallbackCopy(text, successMsg) {
        var input = document.createElement('input');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        try { document.execCommand('copy'); App.showToast(successMsg); } catch (e) {}
        document.body.removeChild(input);
    }

    function renderActions() {
        var callMobile = document.getElementById('callMobileAction');
        callMobile.addEventListener('click', function() {
            if (!item.mobilePhone) return;
            window.location.href = 'tel:' + item.mobilePhone;
            App.showToast('正在呼叫 ' + App.escapeHtml(item.name) + ' ' + App.escapeHtml(item.mobilePhone));
        });

        var callOffice = document.getElementById('callOfficeAction');
        var officeIcon = document.getElementById('officeIcon');
        var officeLabel = document.getElementById('officeLabel');
        if (!item.officePhone || !String(item.officePhone).trim()) {
            callOffice.classList.add('disabled');
            officeIcon.classList.add('disabled');
            officeLabel.classList.add('disabled');
        } else {
            callOffice.addEventListener('click', function() {
                window.location.href = 'tel:' + item.officePhone;
                App.showToast('正在呼叫 ' + App.escapeHtml(item.name) + ' ' + App.escapeHtml(item.officePhone));
            });
        }

        var copyMobile = document.getElementById('copyMobileAction');
        if (!item.mobilePhone || !String(item.mobilePhone).trim()) {
            copyMobile.classList.add('disabled');
        } else {
            copyMobile.addEventListener('click', function() {
                copyToClipboard(item.mobilePhone, '手机号已复制');
            });
        }
    }

    function init() {
        renderHero();
        renderPersonInfo();
        renderContactInfo();
        renderReportInfo();
        renderActions();

        var now = new Date();
        document.getElementById('statusTime').textContent =
            String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    init();
})();
</script>
</body>
</html>
