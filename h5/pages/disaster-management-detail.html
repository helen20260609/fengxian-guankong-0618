<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>防汛隐患详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; position: relative; }
.content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 0 0 16px; background: #f5f6fa; }
.content::-webkit-scrollbar { display: none; }

/* Hero */
.hero-card {
    background: linear-gradient(135deg, #1a73e8 0%, #1b6cd5 50%, #1557b0 100%);
    border-radius: 16px; margin: 12px 16px 14px; padding: 18px 16px 16px; color: #fff;
    box-shadow: 0 8px 20px rgba(26,115,232,.28); position: relative; overflow: hidden;
}
.hero-card::before {
    content: ''; position: absolute; width: 160px; height: 160px; right: -50px; top: -60px;
    background: radial-gradient(circle, rgba(255,255,255,.16), transparent 70%); border-radius: 50%;
}
.hero-card .unit-name { font-size: 18px; font-weight: 700; position: relative; z-index: 1; line-height: 1.35; word-break: break-word; }
.hero-card .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; position: relative; z-index: 1; }
.hero-card .badge { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; white-space: nowrap; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.18); color: #fff; display: inline-flex; align-items: center; gap: 5px; }
.hero-card .badge .dot { width: 8px; height: 8px; border-radius: 50%; }
.hero-card .badge.level .dot { background: #ff6b6b; }
.hero-card .badge.status .dot { background: #ffa94d; }
.hero-card .deadline-row { display: flex; align-items: center; gap: 8px; margin-top: 16px; position: relative; z-index: 1; font-size: 14px; color: #fff; opacity: .95; }
.hero-card .deadline-row i { font-size: 15px; }

.tab-nav { display: flex; align-items: center; background: var(--card); border-radius: 12px; margin: 0 16px 12px; padding: 6px; box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); }
.tab-item { flex: 1; text-align: center; padding: 10px 0; font-size: 14px; font-weight: 500; color: var(--text2); border-radius: 8px; cursor: pointer; transition: all .2s; }
.tab-item.active { background: var(--primary); color: #fff; }
.tab-content { position: relative; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

.section-v2 { background: var(--card); border-radius: 12px; margin: 0 16px 12px; padding: 14px 16px; box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); }
.section-v2:last-of-type { margin-bottom: 16px; }
.sv2-head { margin-bottom: 10px; display: flex; align-items: center; justify-content: flex-start; }
.sv2-title { font-size: 15px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
.sv2-title i { color: var(--primary); font-size: 16px; width: 18px; text-align: center; }
.sc-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f2f2f2; gap: 16px; }
.sc-row:last-child { border-bottom: none; padding-bottom: 0; }
.sc-row.wrap { align-items: flex-start; flex-direction: column; gap: 8px; }
.sc-row.wrap .sc-value { width: 100%; text-align: left; line-height: 1.6; }
.sc-label { font-size: 14px; color: var(--text2); text-align: left; line-height: 1.4; flex-shrink: 0; }
.sc-value { flex: 1; min-width: 0; font-size: 14px; color: var(--text-primary); font-weight: 500; text-align: right; line-height: 1.4; word-break: break-word; }
.sc-value.na { color: var(--text2); }
.sc-value .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; display: inline-block; }
.badge-domain { background: #e8f2fe; color: #1a73e8; border: 1px solid rgba(26,115,232,.15); }

.photo-section { margin-top: 4px; }
.photo-col-label { font-size: 13px; color: var(--text2); margin-bottom: 8px; }
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.photo-thumb {
    aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #5b9cf6, #1a73e8); color: #fff; font-size: 12px; cursor: pointer;
    overflow: hidden; position: relative;
}
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-thumb.empty::after { content: attr(data-label); }

.bottom-actions { position: sticky; bottom: 0; width: 100%; padding: 12px 16px calc(12px + var(--safe-bottom)); background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 10px; z-index: 100; }
.bottom-actions .btn { flex: 1; }
.bottom-spacer { height: 20px; }

/* 处置底部抽屉 */
.deal-drawer-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 300;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s, visibility 0.3s;
}
.deal-drawer-overlay.active { opacity: 1; visibility: visible; }
.deal-drawer {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--card);
    border-radius: 16px 16px 0 0;
    z-index: 301;
    transform: translateY(100%);
    transition: transform 0.3s ease-out, opacity 0.3s;
    max-height: 80vh;
    display: none;
    flex-direction: column;
    opacity: 0;
}
.deal-drawer.active { display: flex; transform: translateY(0); opacity: 1; }
.deal-drawer-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 8px;
}
.deal-drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px 12px;
    border-bottom: 1px solid var(--border);
}
.deal-drawer-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 6px;
}
.deal-drawer-title i { color: var(--primary); }
.deal-drawer-close {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--bg-dark);
    color: var(--text2);
    cursor: pointer;
    border: none;
    font-size: 16px;
}
.deal-drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    -webkit-overflow-scrolling: touch;
}
.deal-drawer-body::-webkit-scrollbar { display: none; }
.deal-drawer-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
}
.deal-drawer-footer .btn {
    flex: 1;
    height: 44px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    cursor: pointer;
}
.deal-drawer-footer .btn-primary { background: var(--primary); color: #fff; }
.deal-drawer-footer .btn-outline { background: var(--card); color: var(--text2); border: 1px solid var(--border); }

.form-group { background: var(--card); border-radius: 12px; padding: 0 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid var(--border); }
.form-row { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid #f0f0f0; }
.form-row:last-child { border-bottom: none; }
.form-row.horizontal { flex-direction: row; align-items: center; justify-content: space-between; }
.fr-label { font-size: 15px; color: var(--text-primary); font-weight: 500; }
.fr-label .req { color: #ff4d4f; margin-right: 4px; }
.fr-control { display: flex; align-items: flex-start; }
.fr-control input[type="text"],
.fr-control input[type="date"],
.fr-control textarea {
    flex: 1;
    border: none;
    padding: 0;
    font-size: 15px;
    background: transparent;
    color: var(--text-primary);
    font-family: inherit;
    width: 100%;
    outline: none;
    text-align: right;
}
.fr-control textarea { resize: none; line-height: 1.5; text-align: left; }
.fr-control input::placeholder,
.fr-control textarea::placeholder { color: #bfbfbf; }

.photo-group { padding: 14px 0; }
.photo-group-title { font-size: 15px; color: var(--text-primary); font-weight: 500; margin-bottom: 12px; }
.photo-group-title .sub { font-size: 12px; color: var(--text-secondary); font-weight: 400; margin-left: 4px; }
.photo-grid-v2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.photo-grid-v2 .photo-add, .photo-grid-v2 .photo-thumb { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.photo-grid-v2 .photo-add { border: 1px dashed var(--border); color: var(--text-secondary); font-size: 22px; background: var(--bg-dark); flex-direction: column; gap: 4px; cursor: pointer; }
.photo-grid-v2 .photo-add .add-text { font-size: 10px; }
.photo-grid-v2 .photo-thumb { background: var(--bg-dark); overflow: hidden; position: relative; background-size: cover; background-position: center; }
.photo-grid-v2 .photo-thumb .remove { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; }

.info-card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
}
.info-card .unit-name { font-size: 16px; font-weight: 700; color: var(--text-primary); line-height: 1.4; }
.info-card .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.info-card .badge { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.info-card .badge.level { background: rgba(217,48,37,0.1); color: #d93025; }
.info-card .badge.status { background: rgba(34,139,34,0.1); color: #228b22; }
.info-card .badge.domain { background: rgba(26,115,232,0.1); color: #1a73e8; }
.info-card .desc { margin-top: 12px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

:root[data-theme="dark"] .section-v2 { background: var(--bg-card); border-color: var(--border); }
:root[data-theme="dark"] .hero-card { background: linear-gradient(135deg, #0d2a5c 0%, #103a7a 55%, #0a5f6b 100%); }
:root[data-theme="dark"] .content { background: var(--bg-body); }
:root[data-theme="dark"] .tab-nav { background: var(--bg-card); border-color: var(--border); }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title" id="heroTitle">防汛隐患详情</div>
        </div>

        <div class="content" style="padding-top:2px; text-align: left;">
            <div class="hero-card" id="heroCard">
                <div class="unit-name" id="unitName">--</div>
                <div class="tag-row" id="heroTags"></div>
                <div class="deadline-row" id="heroDeadline"><i class="fa-regular fa-clock"></i> 完成时限：<span id="heroDeadlineText">--</span></div>
            </div>

            <div class="tab-nav">
                <div class="tab-item active" data-tab="info" onclick="switchTab('info')">隐患详情</div>
                <div class="tab-item" data-tab="rectify" onclick="switchTab('rectify')">整改详情</div>
            </div>

            <div class="tab-content">
                <div class="tab-pane active" id="tab-info">
                    <div class="section-v2">
                        <div class="sv2-head"><div class="sv2-title"><i class="fa-solid fa-circle-info"></i>基本信息</div></div>
                        <div id="basicInfo"></div>
                    </div>

                    <div class="section-v2">
                        <div class="sv2-head"><div class="sv2-title"><i class="fa-solid fa-triangle-exclamation"></i>隐患信息</div></div>
                        <div id="rectifyInfo"></div>
                    </div>

                    <div class="section-v2">
                        <div class="sv2-head"><div class="sv2-title"><i class="fa-solid fa-gavel"></i>处置与处罚</div></div>
                        <div id="punishInfo"></div>
                    </div>

                    <div class="section-v2">
                        <div class="sv2-head"><div class="sv2-title"><i class="fa-solid fa-camera"></i>整改前照片</div></div>
                        <div class="photo-section">
                            <div class="photo-grid" id="photoBeforeGrid"></div>
                        </div>
                    </div>

                    <div class="section-v2">
                        <div class="sv2-head"><div class="sv2-title"><i class="fa-solid fa-clipboard-check"></i>检查信息</div></div>
                        <div id="checkInfo"></div>
                    </div>
                </div>

                <div class="tab-pane" id="tab-rectify">
                    <div class="section-v2">
                        <div class="sv2-head"><div class="sv2-title"><i class="fa-solid fa-clipboard-check"></i>整改信息</div></div>
                        <div id="dealInfo"></div>
                    </div>

                    <div class="section-v2">
                        <div class="sv2-head"><div class="sv2-title"><i class="fa-solid fa-camera"></i>整改前照片</div></div>
                        <div class="photo-section">
                            <div class="photo-grid" id="photoBeforeGrid2"></div>
                        </div>
                    </div>

                    <div class="section-v2">
                        <div class="sv2-head"><div class="sv2-title"><i class="fa-solid fa-camera"></i>整改后照片</div></div>
                        <div class="photo-section">
                            <div class="photo-grid" id="photoAfterGrid"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bottom-spacer"></div>
        </div>

        <div class="bottom-actions" id="bottomActions">
            <button class="btn btn-primary" id="dealBtn" onclick="openDealDrawer()">处置</button>
        </div>

        <!-- 处置底部抽屉 -->
        <div class="deal-drawer-overlay" id="dealDrawerOverlay" onclick="closeDealDrawer()"></div>
        <div class="deal-drawer" id="dealDrawer">
        <div class="deal-drawer-handle"></div>
        <div class="deal-drawer-header">
            <div class="deal-drawer-title"><i class="fa-solid fa-clipboard-check"></i> 隐患处置</div>
            <button class="deal-drawer-close" onclick="closeDealDrawer()"><i class="fa-solid fa-times"></i></button>
        </div>
        <div class="deal-drawer-body" id="dealDrawerBody">
            <div class="form-group">
                <div class="form-row vertical">
                    <div class="fr-label"><span class="req">*</span>整改措施</div>
                    <div class="fr-control">
                        <textarea rows="4" id="dealDesc" placeholder="请填写具体整改措施..."></textarea>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="photo-group">
                    <div class="photo-group-title"><span class="req">*</span>整改后照片</div>
                    <div class="photo-grid-v2" id="drawerPhotoGrid">
                        <div class="photo-add" onclick="takeDealPhoto()"><i class="fa-solid fa-camera"></i><span class="add-text">拍摄</span></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="deal-drawer-footer">
            <button class="btn btn-outline" onclick="closeDealDrawer()">取消</button>
            <button class="btn btn-primary" onclick="submitDeal()">提交处置</button>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    var rawData = (typeof DataStore !== 'undefined' && Array.isArray(DataStore.hiddenDangers)) ? DataStore.hiddenDangers : [];

    var companyNames = ['奉贤区南桥百联购物中心', '上海建工四建集团有限公司', '上海海贤能源股份有限公司', '奉贤区交警支队', '金汇镇人民政府'];
    var reportingUnits = ['区安质监站', '区安质监站', '区交建中心', '区燃气所', '区防汛办'];
    var inspectors = ['王亮', '刘洋', '屠惟', '张明', '李伟'];
    var addresses = ['南桥镇百齐路588号', '奉城镇川南奉公路8888号', '庄行镇浦卫公路3398号', '南桥镇解放中路200号', '金汇镇金碧路2000号'];
    var positions = ['商场东侧外立面三层', '基坑东侧排水沟', '储配站围墙外排水沟', '路口东南角', '小区北侧围墙'];
    var measures = ['已安排专业单位更换密封胶并做淋水试验', '已疏通排水沟并配置备用排水泵', '已疏通排水并补充防汛沙袋', '已修复信号灯并恢复通行', '已安排专业单位加固围墙'];

    var townNames = ['南桥镇', '奉城镇', '庄行镇', '金汇镇', '青村镇', '海湾镇', '四团镇', '柘林镇', '西渡街道'];

    var allData = rawData.map(function(item, idx) {
        var regionMatch = (item.location && item.location.address || '').match(/^([\u4e00-\u9fa5]+镇|[\u4e00-\u9fa5]+街道|[\u4e00-\u9fa5]+社区)/);
        var region = regionMatch ? regionMatch[1] : townNames[idx % townNames.length];
        var level = item.level || 'blue';
        var levelMap = { red: '重大隐患', orange: '较大隐患', yellow: '一般隐患', blue: '轻微隐患' };
        var companyName = companyNames[idx % companyNames.length] || item.responsibleUnit || '';
        return {
            id: item.id || item.eventNo || '',
            title: item.title || '',
            unit: companyName,
            streetTown: region,
            region: region,
            level: level,
            levelLabel: levelMap[level] || levelMap.blue,
            domain: item.type || '玻璃幕墙',
            source: reportingUnits[idx % reportingUnits.length] || item.source || '区安质监站',
            content: item.description || '',
            address: addresses[idx % addresses.length] || ((item.location && item.location.address) || ''),
            position: positions[idx % positions.length] || '',
            measure: measures[idx % measures.length] || '',
            inspector: inspectors[idx % inspectors.length] || '',
            deadline: item.deadline || '',
            deadlineDate: formatDeadline(item.deadline || ''),
            completeTime: formatDeadline(item.completeTime || item.closeTime || ''),
            status: item.status || 'reported',
            statusLabel: statusLabel(item.status || 'reported'),
            isDone: item.status === 'closed' || item.status === 'completed',
            isOverdue: isOverdue(item.deadline || '', item.status || 'reported')
        };
    });

    // 补充逾期测试数据
    allData.push({
        id: 'HD-TEST-0001',
        title: '金汇镇某小区围墙开裂',
        unit: '奉贤区南桥百联购物中心',
        streetTown: '金汇镇',
        region: '金汇镇',
        level: 'yellow',
        levelLabel: '一般隐患',
        domain: '巡查',
        source: '区防汛办',
        content: '小区外围围墙出现明显裂缝，存在坍塌风险。',
        address: '金汇镇金碧路2000号',
        position: '小区北侧围墙',
        measure: '已安排专业单位加固围墙',
        inspector: '李伟',
        deadline: new Date(new Date().getTime() - 2 * 24 * 60 * 60 * 1000).toISOString(),
        deadlineDate: formatDeadline(new Date(new Date().getTime() - 2 * 24 * 60 * 60 * 1000).toISOString()),
        completeTime: '',
        status: 'reported',
        statusLabel: '未整改',
        isDone: false,
        isOverdue: true
    });

    var detailId = App.getQuery('id');
    var item = allData.find(function(i) { return i.id === detailId; }) || allData[0];

    function levelLabel(level) {
        var map = { red: '重大隐患', orange: '较大隐患', yellow: '一般隐患', blue: '轻微隐患' };
        return map[level] || '轻微隐患';
    }

    function statusLabel(status) {
        if (status === 'closed' || status === 'completed') return '已整改';
        return '未完成';
    }

    function isOverdue(deadline, status) {
        if (status === 'closed' || status === 'completed') return false;
        if (!deadline) return false;
        var d = new Date(deadline);
        if (isNaN(d.getTime())) return false;
        return d < new Date();
    }

    function formatDeadline(deadline) {
        if (!deadline) return '—';
        var d = new Date(deadline);
        if (isNaN(d.getTime())) return '—';
        var y = d.getFullYear();
        var m = d.getMonth() + 1;
        var day = d.getDate();
        return y + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
    }

    function getVal(v) { return v && String(v).trim() ? v : '—'; }

    function renderInfoGrid(pairs) {
        return pairs.map(function(p) {
            return '<div class="sc-row ' + (p.wrap ? 'wrap' : '') + '"><div class="sc-label">' + App.escapeHtml(p.label) + '</div><div class="sc-value ' + (p.cls || '') + '">' + p.value + '</div></div>';
        }).join('');
    }

    function renderHero() {
        document.getElementById('heroTitle').textContent = '防汛隐患详情';
        document.getElementById('unitName').textContent = getVal(item.unit);
        document.getElementById('heroDeadlineText').textContent = getVal(item.deadlineDate);

        var tagsHtml = '';
        tagsHtml += '<span class="badge level"><span class="dot"></span>' + App.escapeHtml(item.levelLabel) + '</span>';
        tagsHtml += '<span class="badge status"><span class="dot"></span>' + App.escapeHtml(item.statusLabel) + '</span>';
        tagsHtml += '<span class="badge">' + App.escapeHtml(item.domain) + '</span>';
        document.getElementById('heroTags').innerHTML = tagsHtml;
    }

    function renderBasicInfo() {
        var rows = [
            { label: '隐患单位', value: App.escapeHtml(getVal(item.unit)) },
            { label: '所属街道', value: App.escapeHtml(getVal(item.region)) },
            { label: '隐患单位详细地址', value: App.escapeHtml(getVal(item.address)), wrap: true }
        ];
        document.getElementById('basicInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderCheckInfo() {
        var rows = [
            { label: '检查单位', value: App.escapeHtml(getVal(item.source)) },
            { label: '检查人员', value: App.escapeHtml(getVal(item.inspector)) },
            { label: '检查日期', value: '2025-06-22' }
        ];
        document.getElementById('checkInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderRectifyInfo() {
        var rows = [
            { label: '隐患类型', value: App.escapeHtml(item.domain) },
            { label: '隐患等级', value: App.escapeHtml(item.levelLabel) },
            { label: '具体问题隐患', value: App.escapeHtml(getVal(item.content)), wrap: true },
            { label: '具体点位', value: App.escapeHtml(getVal(item.position)), wrap: true },
            { label: '完成时限', value: App.escapeHtml(getVal(item.deadlineDate)) },
            { label: '整改单位', value: App.escapeHtml(getVal(item.unit)) },
            { label: '备注', value: '—' }
        ];
        document.getElementById('rectifyInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderDealInfo() {
        var rows = [
            { label: '整改单位', value: App.escapeHtml(getVal(item.unit)) },
            { label: '整改人', value: App.escapeHtml(getVal(item.dealHandler)) },
            { label: '整改时间', value: App.escapeHtml(getVal(item.completeTime || item.deadlineDate)) },
            { label: '整改措施', value: App.escapeHtml(getVal(item.dealDesc || item.measure)), wrap: true }
        ];
        document.getElementById('dealInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderPunishInfo() {
        var rows = [
            { label: '是否立案', value: '否' },
            { label: '是否移送司法机关', value: '否' },
            { label: '是否曝光约谈或联合惩戒', value: '否' },
            { label: '判定依据', value: '—' }
        ];
        document.getElementById('punishInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderBottomActions() {
        var actions = document.getElementById('bottomActions');
        if (item.isDone) {
            actions.innerHTML = '';
        } else {
            actions.innerHTML = '<button class="btn btn-primary" onclick="openDealDrawer()">处置</button>';
        }
    }

    var dealAfterPhotos = [];

    window.openDealDrawer = function() {
        document.getElementById('dealDrawerOverlay').classList.add('active');
        document.getElementById('dealDrawer').classList.add('active');
    };

    window.closeDealDrawer = function() {
        document.getElementById('dealDrawerOverlay').classList.remove('active');
        document.getElementById('dealDrawer').classList.remove('active');
    };

    window.takeDealPhoto = function() {
        App.takePhoto().then(function(url) {
            dealAfterPhotos.push(url);
            renderDealPhotos();
        });
    };

    window.removeDealPhoto = function(idx) {
        dealAfterPhotos.splice(idx, 1);
        renderDealPhotos();
    };

    function renderDealPhotos() {
        var grid = document.getElementById('drawerPhotoGrid');
        var html = '';
        dealAfterPhotos.forEach(function(url, i) {
            html += '<div class="photo-thumb" style="background-image:url(' + url + ')"><div class="remove" onclick="removeDealPhoto(' + i + ')"><i class="fa-solid fa-xmark"></i></div></div>';
        });
        html += '<div class="photo-add" onclick="takeDealPhoto()"><i class="fa-solid fa-camera"></i><span class="add-text">拍摄</span></div>';
        grid.innerHTML = html;
    }

    window.submitDeal = function() {
        var desc = document.getElementById('dealDesc').value.trim();

        if (!desc) { App.showToast('请填写整改措施'); return; }
        if (dealAfterPhotos.length === 0) { App.showToast('请拍摄整改后照片'); return; }

        App.showLoading('提交中...');
        setTimeout(function() {
            item.status = 'closed';
            item.completeTime = new Date().toISOString().slice(0, 10);
            item.dealDesc = desc;
            item.afterPhotos = dealAfterPhotos.slice();
            item.isDone = true;
            item.statusLabel = '已整改';

            App.hideLoading();
            App.showToast('处置提交成功');
            closeDealDrawer();

            // 刷新详情页
            renderHero();
            renderDealInfo();
            renderPhotoGrid('photoAfterGrid', item.afterPhotos, '照片');
            renderBottomActions();
        }, 600);
    };

    window.switchTab = function(tab) {
        document.querySelectorAll('.tab-item').forEach(function(el) {
            el.classList.toggle('active', el.dataset.tab === tab);
        });
        document.querySelectorAll('.tab-pane').forEach(function(el) {
            el.classList.toggle('active', el.id === 'tab-' + tab);
        });
    };

    function updateTime() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        document.getElementById('statusTime').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    }
    updateTime();
    setInterval(updateTime, 60000);

    renderHero();
    renderBasicInfo();
    renderCheckInfo();
    renderRectifyInfo();
    renderDealInfo();
    renderPunishInfo();

    function renderPhotoGrid(containerId, photos, labelPrefix) {
        var container = document.getElementById(containerId);
        var list = Array.isArray(photos) && photos.length > 0 ? photos : [];
        if (list.length === 0) {
            list = [labelPrefix + '1', labelPrefix + '2', labelPrefix + '3'];
        }
        container.innerHTML = list.map(function(p, i) {
            if (/^https?:\/\//.test(p) || p.indexOf('data:image') === 0) {
                return '<div class="photo-thumb"><img src="' + App.escapeHtml(p) + '" alt="照片"></div>';
            }
            return '<div class="photo-thumb empty" data-label="' + App.escapeHtml(p) + '"></div>';
        }).join('');
    }

    renderPhotoGrid('photoBeforeGrid', item.photos, '照片');
    renderPhotoGrid('photoBeforeGrid2', item.photos, '照片');
    renderPhotoGrid('photoAfterGrid', item.afterPhotos, '照片');

    renderBottomActions();
})();
</script>
</body>
</html>
