<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>人员转移安置详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>

.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; }
.content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 0 0 16px; background: #f5f6fa; }
.content::-webkit-scrollbar { display: none; }

.hero-card {
    background: linear-gradient(135deg, #1a73e8 0%, #1b6cd5 50%, #1557b0 100%);
    border-radius: 16px; margin: 12px 16px 14px; padding: 16px; color: #fff;
    box-shadow: 0 8px 20px rgba(26,115,232,.28); position: relative; overflow: hidden;
}
.hero-card::before {
    content: ''; position: absolute; width: 140px; height: 140px; right: -40px; top: -50px;
    background: radial-gradient(circle, rgba(255,255,255,.15), transparent 70%); border-radius: 50%;
}
.hero-card .hero-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; z-index: 1; }
.hero-card .unit-name { font-size: 17px; font-weight: 700; line-height: 1.4; flex: 1; word-break: break-word; }
.hero-card .hero-tag { flex-shrink: 0; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.3); }
.hero-card .flow-list { margin-top: 14px; position: relative; z-index: 1; }
.hero-card .flow-item { display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 1.4; }
.hero-card .flow-item.start { margin-bottom: 4px; }
.hero-card .flow-item.end { margin-top: 4px; }
.hero-card .flow-arrow { display: inline-flex; align-items: center; font-size: 12px; opacity: .7; margin-right: 4px; }
.hero-card .flow-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.hero-card .flow-dot.red { background: #ff6b6b; box-shadow: 0 0 0 3px rgba(255,107,107,.2); }
.hero-card .flow-dot.green { background: #52c41a; box-shadow: 0 0 0 3px rgba(82,196,26,.2); }
.hero-card .flow-text span { font-weight: 600; }
.hero-card .count-row { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.25); font-size: 14px; position: relative; z-index: 1; }
.hero-card .count-row span { font-size: 20px; font-weight: 700; margin-right: 2px; }

.action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 16px 14px; }
.action-grid-cell {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: all .15s;
}
.action-grid-cell:active { transform: scale(.97); }
.action-grid-cell.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.action-grid-cell .ag-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.action-grid-cell .ag-icon.evac { background: rgba(26,115,232,.12); color: #1a73e8; }
.action-grid-cell .ag-icon.shelter { background: rgba(30,142,62,.12); color: #1e8e3e; }
.action-grid-cell .ag-icon.map { background: rgba(0,151,167,.1); color: #0097a7; }
.action-grid-cell .ag-icon.disabled { background: var(--bg-hover); color: var(--text2); }
.action-grid-cell .ag-label { font-size: 12px; color: var(--text-primary); font-weight: 500; }
.action-grid-cell .ag-label.disabled { color: var(--text2); }

.section-v2 { background: #fff; border-radius: 12px; margin: 0 16px 12px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.section-v2:last-of-type { margin-bottom: 16px; }
.sv2-head { margin-bottom: 10px; }
.sv2-title { font-size: 15px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 0; position: relative; padding-left: 10px; }
.sv2-title::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--primary); }
.sc-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #f2f2f2; gap: 16px; }
.sc-row:last-child { border-bottom: none; padding-bottom: 0; }
.sc-row.wrap { align-items: flex-start; }
.sc-label { font-size: 14px; color: var(--text2); text-align: left; line-height: 1.4; flex-shrink: 0; }
.sc-value { flex: 1; min-width: 0; font-size: 14px; color: var(--text-primary); font-weight: 500; text-align: right; line-height: 1.4; word-break: break-word; }
.sc-value.phone { color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; }
.sc-value.phone i { font-size: 12px; }
.sc-value.na { color: var(--text2); }
.sc-value .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; }
.sc-value .badge-plan-yes { background: rgba(var(--success-rgb),.12); color: var(--success); border: 1px solid rgba(var(--success-rgb),.25); }
.sc-value .badge-plan-no { background: rgba(var(--danger-rgb),.12); color: var(--danger); border: 1px solid rgba(var(--danger-rgb),.25); }

.bottom-spacer { height: 20px; }

:root[data-theme="dark"] .section-v2 { background: var(--bg-card); }
:root[data-theme="dark"] .hero-card { background: linear-gradient(135deg, #0d2a5c 0%, #103a7a 55%, #0a5f6b 100%); }
:root[data-theme="dark"] .action-grid-cell { background: var(--bg-card); border-color: var(--border); }
:root[data-theme="dark"] .content { background: var(--bg-body); }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title" id="heroTitle">人员转移安置详情</div>
        </div>

        <div class="content" style="padding-top:18px">
            <div class="hero-card">
                <div class="hero-head">
                    <div class="unit-name" id="unitName">--</div>
                    <div class="hero-tag" id="heroTag">--</div>
                </div>
                <div class="flow-list">
                    <div class="flow-item start">
                        <div class="flow-dot red"></div>
                        <div class="flow-text">撤离起点：<span id="heroStart">--</span></div>
                    </div>
                    <div class="flow-item end">
                        <div class="flow-arrow"><i class="fa-solid fa-arrow-right"></i></div>
                        <div class="flow-dot green"></div>
                        <div class="flow-text">安置终点：<span id="heroEnd">--</span></div>
                    </div>
                </div>
                <div class="count-row">撤离人数：<span id="heroCount">0</span> 人</div>
            </div>

            <div class="action-grid">
                <div class="action-grid-cell" id="callAction">
                    <div class="ag-icon evac"><i class="fa-solid fa-phone"></i></div>
                    <div class="ag-label">撤离点负责人</div>
                </div>
                <div class="action-grid-cell" id="shelterCallAction">
                    <div class="ag-icon shelter"><i class="fa-solid fa-phone"></i></div>
                    <div class="ag-label">安置点负责人</div>
                </div>
                <div class="action-grid-cell" id="mapAction">
                    <div class="ag-icon map" id="mapIcon"><i class="fa-solid fa-map-location-dot"></i></div>
                    <div class="ag-label" id="mapLabel">在地图中查看</div>
                </div>
            </div>

            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">撤离信息</div></div>
                <div id="evacuationInfo"></div>
            </div>

            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">安置信息</div></div>
                <div id="shelterInfo"></div>
            </div>

            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">填报信息</div></div>
                <div id="reportInfo"></div>
            </div>

            <div class="bottom-spacer"></div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../../data/personnel-transfer-data.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    var rawData = (typeof personnelTransferData !== 'undefined' && Array.isArray(personnelTransferData)) ? personnelTransferData : [];
    var allData = rawData.map(function(item) {
        return {
            no: item.no || '',
            streetTown: item.streetTown || '',
            evacuationUnit: item.evacuationUnit || '',
            evacuationPoint: item.evacuationPoint || '',
            evacuatedCount: item.evacuatedCount || '',
            evacuationReason: item.evacuationReason || '',
            contactPerson: item.contactPerson || '',
            contactPhone: item.contactPhone || '',
            shelterName: item.shelterName || '',
            shelterAddress: item.shelterAddress || '',
            shelterContactPerson: item.shelterContactPerson || '',
            shelterContactPhone: item.shelterContactPhone || '',
            reportUnit: item.reportUnit || '',
            reporter: item.reporter || '',
            reportDate: item.reportDate || ''
        };
    });

    function loadData() {
        var id = App.getQuery('id');
        var fromStorage = null;
        try { fromStorage = JSON.parse(localStorage.getItem('personnelTransferData') || '[]'); } catch (e) {}
        var list = Array.isArray(fromStorage) && fromStorage.length ? fromStorage : allData;
        if (id) {
            var found = list.find(function(i) { return i.no === id; });
            if (found) return found;
        }
        return allData[0];
    }

    var item = loadData();

    function getVal(v) { return v && String(v).trim() ? v : '—'; }

    function renderInfoGrid(pairs) {
        return pairs.map(function(p) {
            return '<div class="sc-row ' + (p.wrap ? 'wrap' : '') + '" ' + (p.id ? 'id="' + p.id + '"' : '') + '><div class="sc-label">' + p.label + '</div><div class="sc-value ' + (p.cls || '') + '"' + (p.id ? ' id="val_' + p.id + '"' : '') + '>' + p.value + '</div></div>';
        }).join('');
    }

    function renderHero() {
        document.getElementById('heroTitle').textContent = item.evacuationUnit ? '人员转移安置详情' : '人员转移安置详情';
        document.getElementById('unitName').textContent = getVal(item.evacuationUnit);
        document.getElementById('heroStart').textContent = getVal(item.evacuationPoint);
        document.getElementById('heroEnd').textContent = getVal(item.shelterName);
        document.getElementById('heroCount').textContent = getVal(item.evacuatedCount);

        var tagParts = [];
        if (item.streetTown) tagParts.push(App.escapeHtml(item.streetTown));
        if (item.evacuationReason) tagParts.push(App.escapeHtml(item.evacuationReason));
        document.getElementById('heroTag').textContent = tagParts.length ? tagParts.join(' · ') : '—';
    }

    function renderEvacuationInfo() {
        var rows = [
            { label: '单位', value: App.escapeHtml(getVal(item.evacuationUnit)) },
            { label: '街镇', value: App.escapeHtml(getVal(item.streetTown)) },
            { label: '撤离原因', value: App.escapeHtml(getVal(item.evacuationReason)) },
            { label: '撤离人数', value: App.escapeHtml(getVal(item.evacuatedCount)) },
            { label: '撤离点地址', value: App.escapeHtml(getVal(item.evacuationPoint)), wrap: true },
            { label: '联系人', value: App.escapeHtml(getVal(item.contactPerson)) },
            { label: '联系电话', value: App.escapeHtml(getVal(item.contactPhone)), cls: 'phone', id: 'contactPhone' }
        ];
        document.getElementById('evacuationInfo').innerHTML = renderInfoGrid(rows);

        var phoneValue = document.getElementById('val_contactPhone');
        if (phoneValue && item.contactPhone) {
            phoneValue.innerHTML = '<i class="fa-solid fa-phone"></i> ' + App.escapeHtml(item.contactPhone);
            phoneValue.style.cursor = 'pointer';
            phoneValue.addEventListener('click', function() {
                window.location.href = 'tel:' + item.contactPhone;
                App.showToast('正在呼叫 ' + App.escapeHtml(item.contactPerson) + ' ' + App.escapeHtml(item.contactPhone));
            });
        }
    }

    function renderShelterInfo() {
        var rows = [
            { label: '安置点名称', value: App.escapeHtml(getVal(item.shelterName)) },
            { label: '安置点地址', value: App.escapeHtml(getVal(item.shelterAddress)), wrap: true },
            { label: '联系人', value: App.escapeHtml(getVal(item.shelterContactPerson)) },
            { label: '联系电话', value: App.escapeHtml(getVal(item.shelterContactPhone)), cls: 'phone', id: 'shelterPhone' }
        ];
        document.getElementById('shelterInfo').innerHTML = renderInfoGrid(rows);

        var phoneValue = document.getElementById('val_shelterPhone');
        if (phoneValue && item.shelterContactPhone) {
            phoneValue.innerHTML = '<i class="fa-solid fa-phone"></i> ' + App.escapeHtml(item.shelterContactPhone);
            phoneValue.style.cursor = 'pointer';
            phoneValue.addEventListener('click', function() {
                window.location.href = 'tel:' + item.shelterContactPhone;
                App.showToast('正在呼叫 ' + App.escapeHtml(item.shelterContactPerson) + ' ' + App.escapeHtml(item.shelterContactPhone));
            });
        }
    }

    function renderReportInfo() {
        var rows = [
            { label: '填报单位', value: App.escapeHtml(getVal(item.reportUnit)) },
            { label: '填报人', value: App.escapeHtml(getVal(item.reporter)) },
            { label: '填报日期', value: App.escapeHtml(getVal(item.reportDate)) }
        ];
        document.getElementById('reportInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderActions() {
        var callAction = document.getElementById('callAction');
        if (!item.contactPhone) callAction.classList.add('disabled');
        callAction.addEventListener('click', function() {
            if (!item.contactPhone) return;
            window.location.href = 'tel:' + item.contactPhone;
            App.showToast('正在呼叫 ' + App.escapeHtml(item.contactPerson) + ' ' + App.escapeHtml(item.contactPhone));
        });

        var shelterCallAction = document.getElementById('shelterCallAction');
        if (!item.shelterContactPhone) shelterCallAction.classList.add('disabled');
        shelterCallAction.addEventListener('click', function() {
            if (!item.shelterContactPhone) return;
            window.location.href = 'tel:' + item.shelterContactPhone;
            App.showToast('正在呼叫 ' + App.escapeHtml(item.shelterContactPerson) + ' ' + App.escapeHtml(item.shelterContactPhone));
        });

        var mapAction = document.getElementById('mapAction');
        var mapIcon = document.getElementById('mapIcon');
        var mapLabel = document.getElementById('mapLabel');
        if (!item.shelterAddress || !String(item.shelterAddress).trim()) {
            mapAction.classList.add('disabled');
            if (mapIcon) mapIcon.classList.add('disabled');
            if (mapLabel) mapLabel.classList.add('disabled');
        } else {
            mapAction.addEventListener('click', function() {
                var url = 'https://uri.amap.com/search?keyword=' + encodeURIComponent(item.shelterAddress) + '&city=' + encodeURIComponent(item.streetTown || '上海');
                window.open(url, '_blank');
            });
        }
    }

    function updateTime() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        document.getElementById('statusTime').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    }
    updateTime();
    setInterval(updateTime, 60000);

    renderHero();
    renderActions();
    renderEvacuationInfo();
    renderShelterInfo();
    renderReportInfo();
})();
</script>
</body>
</html>
