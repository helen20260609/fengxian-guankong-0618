<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>队伍详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.status-bar { position: relative; z-index: 100; }
.page-hero .ph-sub { display: none; }

.summary-card { position: relative; margin: 16px; background: linear-gradient(135deg, #1a73e8 0%, #1b6cd5 50%, #1557b0 100%); border-radius: 16px; padding: 16px; color: #fff; border: none; box-shadow: 0 8px 20px rgba(26,115,232,.28); overflow: hidden; }
.summary-card::before { content: ''; position: absolute; width: 140px; height: 140px; right: -40px; top: -50px; background: radial-gradient(circle, rgba(255,255,255,.15), transparent 70%); border-radius: 50%; }
.summary-card .sc-inner { position: relative; z-index: 1; }
.summary-card .sc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.summary-card .sc-name { font-size: 18px; font-weight: 700; line-height: 1.4; flex: 1; min-width: 0; word-break: break-word; }
.summary-card .sc-tag { flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.3); }
.summary-card .sc-area { display: flex; align-items: center; gap: 6px; font-size: 13px; opacity: .9; margin-bottom: 14px; }
.summary-card .sc-area i { font-size: 12px; flex-shrink: 0; }
.summary-card .sc-area span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.summary-card .sc-metric-row { display: flex; align-items: center; gap: 12px; font-size: 12px; margin-bottom: 10px; }
.summary-card .sc-metric-item { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.summary-card .sc-metric-item i { font-size: 12px; opacity: .8; flex-shrink: 0; }
.summary-card .sc-metric-item b { font-weight: 700; }
.summary-card .sc-metric-divider { width: 1px; height: 14px; background: rgba(255,255,255,.3); flex-shrink: 0; }
.summary-card .sc-contact { display: flex; align-items: center; gap: 6px; font-size: 14px; opacity: .95; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.summary-card .sc-contact i { font-size: 12px; flex-shrink: 0; }
.summary-card .sc-contact b { font-weight: 600; }

.action-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 0 16px 14px;
}
.action-grid-cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all .15s;
}
.action-grid-cell:active { transform: scale(.97); }
.action-grid-cell.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.action-grid-cell .ag-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}
.action-grid-cell .ag-icon.phone { background: rgba(30,142,62,.12); color: var(--success); }
.action-grid-cell .ag-icon.map { background: rgba(26,115,232,.1); color: var(--primary); }
.action-grid-cell .ag-label { font-size: 12px; color: var(--text-primary); font-weight: 500; }

.content-sheet.page-body-sheet { margin: 0; padding: 0; border-radius: 0; box-shadow: none; border: none; background: transparent; position: relative; z-index: 1; }
.content-sheet.page-body-sheet .quick-actions,
.content-sheet.page-body-sheet .group-card { margin-left: 16px; margin-right: 16px; }

.quick-actions { display: flex; gap: 12px; margin-bottom: 16px; }
.qa-btn { flex: 1; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; transition: opacity .15s; }
.qa-btn:active { opacity: .85; }
.qa-primary { background: var(--success); color: #fff; box-shadow: 0 4px 12px rgba(var(--success-rgb),.3); }
.qa-secondary { background: var(--card); color: var(--primary); border: 1px solid var(--border); }
.qa-secondary.disabled { color: var(--text2); opacity: .5; pointer-events: none; }

.group-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 2px 8px var(--shadow); margin-bottom: 14px; overflow: hidden; }
.gc-head { padding: 12px 16px; font-size: 14px; font-weight: 700; color: var(--text-primary); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.gc-head i { color: var(--primary); }
.gc-body { padding: 4px 16px 12px; }
.info-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.info-row:last-child { border-bottom: none; }
.info-label { width: 86px; flex-shrink: 0; color: var(--text2); text-align: left; }
.info-value { flex: 1; color: var(--text-primary); word-break: break-all; text-align: right; }
.info-value.mono { font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; }
.info-value.empty { color: var(--text2); }

.cat-tag { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 6px; font-weight: 600; }
.cat-blue   { background: rgba(26,115,232,.1);  color: #1a73e8; }
.cat-cyan   { background: rgba(0,151,167,.1);   color: #0097a7; }
.cat-green  { background: rgba(52,168,83,.1);   color: #34a853; }
.cat-orange { background: rgba(230,81,0,.1);    color: #e65100; }
.cat-red    { background: rgba(217,48,37,.1);   color: #d93025; }
.cat-purple { background: rgba(123,47,247,.1);  color: #7b2ff7; }
.cat-gold   { background: rgba(199,128,0,.12);  color: #c78000; }

.contact-line { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
.contact-line + .contact-line { border-top: 1px dashed var(--border); }
.contact-line .cname { color: var(--text-primary); }
.call-mini { background: rgba(var(--success-rgb),.1); color: var(--success); border: 1px solid rgba(var(--success-rgb),.25); border-radius: 16px; padding: 4px 12px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; flex-shrink: 0; margin-left: 10px; }
.phone-num { font-family: 'Consolas', monospace; color: var(--primary); }
.info-phone-link { color: var(--primary); text-decoration: none; }
.info-phone-link:active { opacity: .7; }

.bottom-spacer { height: 20px; }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="top-sticky" id="topSticky">
            <div class="status-bar light">
                <span class="sb-time" id="statusTime">9:41</span>
                <span class="sb-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                    <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
                </span>
            </div>

            <div class="page-hero">
                <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
                <div class="ph-title">队伍详情</div>
            </div>
        </div>

        <div class="content-sheet page-body-sheet" id="detailBody"></div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/rescue-team-data.js"></script>
<script>
(function(){
    var CAT_COLOR = {
        '机动抢险': 'cat-blue', '兼职机动抢险': 'cat-blue', '应急抢险': 'cat-blue',
        '排水除涝': 'cat-cyan', '道路清障排水': 'cat-cyan', '内河搜救': 'cat-cyan',
        '道路清障': 'cat-green', '桥梁养护': 'cat-green',
        '绿化安全': 'cat-gold',
        '物资抢运': 'cat-orange', '车辆牵引': 'cat-orange',
        '人员疏散、应急接驳': 'cat-red',
        '供气保障': 'cat-purple'
    };
    function catClass(c){ return CAT_COLOR[c] || 'cat-blue'; }
    function esc(s){ return (s == null || s === '') ? '<span class="info-value empty">—</span>' : s; }
    function getParam(name){
        var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
        return m ? decodeURIComponent(m[1]) : '';
    }

    var id = parseInt(getParam('id'), 10);
    var t = (window.RESCUE_TEAM_DATA || []).find(function(x){ return x.id === id; });
    if (!t){
        document.getElementById('detailBody').innerHTML = '<div class="empty-state"><i class="fa-regular fa-folder-open"></i><div class="empty-title">数据不存在</div></div>';
        return;
    }

    /* ---------- 联系人多值拆分 ---------- */
    var contacts = (t.contact || '').split('、').map(function(s){ return s.trim(); }).filter(Boolean);
    var phones = (t.phone || '').split('、').map(function(s){ return s.trim(); }).filter(Boolean);
    var contactName = contacts[0] || '—';
    var contactPhone = phones[0] || '';
    var contactPhoneHtml = contactPhone
        ? '<a class="info-phone-link" href="tel:' + contactPhone + '"><i class="fa-solid fa-phone" style="margin-right:4px"></i>' + contactPhone + '</a>'
        : '<span class="info-value empty">—</span>';

    /* ---------- 快捷操作 ---------- */
    var quickHtml = '<div class="action-grid">'
        + '<div class="action-grid-cell" id="callPhoneAction">'
        +   '<div class="ag-icon phone"><i class="fa-solid fa-phone"></i></div>'
        +   '<div class="ag-label" id="callLabel">呼叫队伍联系人</div>'
        + '</div>'
        + '<div class="action-grid-cell" id="mapViewAction">'
        +   '<div class="ag-icon map"><i class="fa-solid fa-map-location-dot"></i></div>'
        +   '<div class="ag-label">在地图中查看</div>'
        + '</div>'
        + '</div>';

    /* ---------- 头部摘要卡片 ---------- */
    var summaryHtml = '<div class="summary-card">'
        + '<div class="sc-inner">'
        +   '<div class="sc-head">'
        +     '<div class="sc-name">' + t.name + '</div>'
        +     '<span class="sc-tag"><i class="fa-solid fa-bolt" style="margin-right:4px"></i>' + t.category + '</span>'
        +   '</div>'
        +   '<div class="sc-area"><i class="fa-solid fa-shield-halved"></i>责任区域：<span>' + t.responsibility + '</span></div>'
        +   '<div class="sc-metric-row">'
        +     '<div class="sc-metric-item"><i class="fa-solid fa-bolt"></i>所属领域：<b>' + t.domain + '</b></div>'
        +     '<div class="sc-metric-divider"></div>'
        +     '<div class="sc-metric-item"><i class="fa-solid fa-users"></i>队伍总人数：<b>' + t.headcount + '</b> 人</div>'
        +   '</div>'
        +   '<div class="sc-contact"><i class="fa-regular fa-user"></i>联系人：<b>' + contactName + '</b></div>'
        + '</div>'
        + '</div>';

    /* ---------- 分组卡片 ---------- */
    function row(label, valueHtml){
        return '<div class="info-row"><div class="info-label">' + label + '</div><div class="info-value">' + valueHtml + '</div></div>';
    }
    function group(icon, title, rowsHtml){
        return '<div class="group-card"><div class="gc-head"><i class="fa-solid ' + icon + '"></i>' + title + '</div><div class="gc-body">' + rowsHtml + '</div></div>';
    }

    var html = summaryHtml + quickHtml;

    /* ① 基本信息 */
    html += group('fa-people-group', '基本信息',
          row('队伍名称', t.name)
        + row('队伍类别', '<span class="cat-tag ' + catClass(t.category) + '">' + t.category + '</span>')
        + row('所属领域', t.domain)
        + row('队伍人数', '<b>' + t.headcount + '</b> 人')
        + row('队伍地址', t.address)
        + row('责任区域', t.responsibility)
    );

    /* ② 联系方式 */
    html += group('fa-phone', '联系方式',
          row('联系人', contactName)
        + row('联系电话', contactPhoneHtml)
        + row('传真', t.fax ? t.fax : '<span class="info-value empty">—</span>')
    );

    /* ③ 填报信息 */
    html += group('fa-file-lines', '填报信息',
          row('填报单位', t.reportUnit)
        + row('填报人', t.reporter)
        + row('填报日期', t.reportDate)
    );

    html += '<div class="bottom-spacer"></div>';
    document.getElementById('detailBody').innerHTML = html;

    function renderActions() {
        var callAction = document.getElementById('callPhoneAction');
        var callLabel = document.getElementById('callLabel');
        if (phones.length === 0) {
            callAction.classList.add('disabled');
        } else if (phones.length === 1) {
            callLabel.textContent = '呼叫队伍联系人';
            callAction.addEventListener('click', function() {
                window.location.href = 'tel:' + phones[0];
                if (window.App && App.showToast) App.showToast('正在呼叫 ' + App.escapeHtml(phones[0]));
            });
        } else {
            callLabel.textContent = '选择联系人拨打';
            callAction.addEventListener('click', function() {
                var list = phones.map(function(p) {
                    return '<div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:pointer" onclick="window.location.href=\'tel:' + App.escapeHtml(p) + '\';App.showToast(\'正在呼叫 ' + App.escapeHtml(p) + '\')">' +
                        '<span style="font-weight:500">' + App.escapeHtml(p) + '</span><span style="color:var(--success);font-weight:600"><i class="fa-solid fa-phone"></i> 拨打</span></div>';
                }).join('');
                if (window.App && App.showModal) App.showModal({ title: '选择电话拨打', content: '<div style="max-height:300px;overflow-y:auto">' + list + '</div>' });
                else if (window.App && App.showToast) App.showToast('多联系人：请进详情拨打');
            });
        }

        var mapAction = document.getElementById('mapViewAction');
        if (!t.lng || !t.lat || !String(t.lng).trim() || !String(t.lat).trim()) {
            mapAction.classList.add('disabled');
        } else {
            mapAction.addEventListener('click', function() {
                var url = 'https://uri.amap.com/marker?position=' + encodeURIComponent(t.lng + ',' + t.lat) +
                    '&name=' + encodeURIComponent(t.name || '抢险队伍') +
                    '&src=' + encodeURIComponent('奉贤风险管控');
                window.open(url, '_blank');
            });
        }
    }
    renderActions();
})();
</script>
</body>
</html>
