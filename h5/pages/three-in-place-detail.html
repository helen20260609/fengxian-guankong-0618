<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>三到位详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.status-bar { position: relative; z-index: 100; }
.page-hero { position: relative; z-index: 99; display: flex; flex-direction: column; align-items: center; padding: calc(34px + 16px) 18px 42px; }

.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; }
.content-sheet.page-body-sheet { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 0 0 16px; background: #f5f6fa; margin-top: 0; border-radius: 0; }
.content-sheet.page-body-sheet::-webkit-scrollbar { display: none; }

.hero-card {
    background: linear-gradient(180deg, #1557b0 0%, #1a73e8 100%);
    border-radius: 12px;
    margin: 12px 16px 14px;
    padding: 18px 16px;
    color: #fff;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(26,115,232,.22);
}
.hero-card::before {
    content: '';
    position: absolute;
    width: 120px;
    height: 120px;
    right: -30px;
    top: -30px;
    background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%);
    border-radius: 50%;
}
.hero-card .hc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; position: relative; z-index: 1; }
.hero-card .hc-title { font-size: 20px; font-weight: 700; line-height: 1.35; flex: 1; word-break: break-word; }
.hero-card .hc-status {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(255,255,255,.2);
    border: 1px solid rgba(255,255,255,.3);
}
.hero-card .hc-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,.95); margin-bottom: 6px; position: relative; z-index: 1; }
.hero-card .hc-line:last-child { margin-bottom: 0; }
.hero-card .hc-line i { font-size: 10px; }
.hero-card .hc-line b { font-weight: 600; }

.action-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 0 16px 14px;
}
.action-grid-cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all .15s;
}
.action-grid-cell:active { transform: scale(.97); }
.action-grid-cell.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.action-grid-cell .ag-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}
.action-grid-cell .ag-icon.local { background: rgba(30,142,62,.12); color: var(--success); }
.action-grid-cell .ag-icon.police { background: rgba(123,47,247,.12); color: #7c3aed; }
.action-grid-cell .ag-icon.rescue { background: rgba(230,81,0,.12); color: #e65100; }
.action-grid-cell .ag-icon.map { background: rgba(26,115,232,.1); color: var(--primary); }
.action-grid-cell .ag-label { font-size: 12px; color: var(--text-primary); font-weight: 500; }

.section-v2 { background: var(--card); border-radius: 12px; margin: 0 16px 12px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid var(--border); }
.section-v2:last-of-type { margin-bottom: 16px; }
.sv2-head { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.sv2-title { font-size: 15px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 0; position: relative; padding-left: 10px; }
.sv2-title::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; }
.sv2-title.local::before { background: var(--success); }
.sv2-title.police::before { background: #7b2ff7; }
.sv2-title.rescue::before { background: #e65100; }
.sv2-title.report::before { background: var(--primary); }
.missing-tag { font-size: 11px; color: var(--text2); background: rgba(100,100,100,.08); border: 1px solid rgba(100,100,100,.2); padding: 2px 8px; border-radius: 999px; }

.sc-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); gap: 16px; }
.sc-row.wrap { align-items: flex-start; }
.sc-row:last-child { border-bottom: none; padding-bottom: 0; }
.sc-label { font-size: 14px; color: var(--text2); text-align: left; line-height: 1.4; flex-shrink: 0; }
.sc-value { flex: 1; min-width: 0; font-size: 14px; color: var(--text-primary); font-weight: 500; text-align: right; line-height: 1.4; word-break: break-word; white-space: normal; }
.sc-value.phone { color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; cursor: pointer; }
.sc-value.phone i { font-size: 12px; }

.bottom-spacer { height: 20px; }

:root[data-theme="dark"] .section-v2 { background: var(--bg-card); }
:root[data-theme="dark"] .hero-card { background: linear-gradient(180deg, #0d2a5c 0%, #1a73e8 100%); }
:root[data-theme="dark"] .action-grid-cell { background: var(--bg-card); border-color: var(--border); }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title">三到位详情</div>
        </div>

        <div class="content-sheet page-body-sheet" style="padding:0 0 16px">
            <div class="hero-card" id="heroCard">
                <div class="hc-head">
                    <div class="hc-title" id="heroTitle">--</div>
                    <div class="hc-status" id="heroStatus"></div>
                </div>
                <div class="hc-line" id="heroLocal"></div>
                <div class="hc-line" id="heroPolice"></div>
                <div class="hc-line" id="heroRescue"></div>
            </div>

            <div class="action-grid" id="actionGrid"></div>

            <div class="section-v2">
                <div class="sv2-head">
                    <div class="sv2-title local" id="localTitle">属地信息</div>
                    <div class="missing-tag" id="localMissing" style="display:none">未填报</div>
                </div>
                <div id="localInfo"></div>
            </div>

            <div class="section-v2">
                <div class="sv2-head">
                    <div class="sv2-title police" id="policeTitle">民警信息</div>
                    <div class="missing-tag" id="policeMissing" style="display:none">未填报</div>
                </div>
                <div id="policeInfo"></div>
            </div>

            <div class="section-v2">
                <div class="sv2-head">
                    <div class="sv2-title rescue" id="rescueTitle">抢险信息</div>
                    <div class="missing-tag" id="rescueMissing" style="display:none">未填报</div>
                </div>
                <div id="rescueInfo"></div>
            </div>

            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title report">填报信息</div></div>
                <div id="reportInfo"></div>
            </div>

            <div class="bottom-spacer"></div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../../data/three-in-place-data.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    function loadData() {
        var id = App.getQuery('id');
        var fromStorage = null;
        try { fromStorage = JSON.parse(localStorage.getItem('threeInPlaceData') || '[]'); } catch (e) {}
        var list = (Array.isArray(fromStorage) && fromStorage.length) ? fromStorage : (typeof threeInPlaceData !== 'undefined' ? threeInPlaceData : []);
        if (id) {
            var found = list.find(function(i) { return String(i.id) === String(id); });
            if (found) return found;
        }
        return list[0];
    }

    var item = loadData() || {};

    function getVal(v) { return v && String(v).trim() ? v : '—'; }

    function isMissing(unit, name, phone) {
        return (!unit || !String(unit).trim()) && (!name || !String(name).trim()) && (!phone || !String(phone).trim());
    }

    function calcCompleteness() {
        var count = 0;
        if (!isMissing(item.localUnit, item.localName, item.localPhone)) count++;
        if (!isMissing(item.policeUnit, item.policeName, item.policePhone)) count++;
        if (!isMissing(item.rescueUnit, item.rescueName, item.rescuePhone)) count++;
        return count;
    }

    function renderInfoGrid(pairs) {
        return pairs.map(function(p) {
            return '<div class="sc-row"><div class="sc-label">' + p.label + '</div><div class="sc-value ' + (p.cls || '') + '"' + (p.id ? ' id="' + p.id + '"' : '') + '>' + p.value + '</div></div>';
        }).join('');
    }

    function renderHero() {
        document.getElementById('heroTitle').textContent = (item.localUnit || '—') + '积水处置点';
        var comp = calcCompleteness();
        var complete = comp === 3;
        document.getElementById('heroStatus').innerHTML = '<i class="fa-solid ' + (complete ? 'fa-check' : 'fa-triangle-exclamation') + '"></i> ' + (complete ? '到位 3/3' : '到位 ' + comp + '/3');

        function setLine(elId, color, label, name, unit) {
            var text = (name && String(name).trim() ? name : '—') + (unit && String(unit).trim() ? ' (' + unit + ')' : '');
            document.getElementById(elId).innerHTML = '<i class="fa-solid fa-circle" style="color:' + color + '"></i><span><b>' + label + '：</b>' + App.escapeHtml(text) + '</span>';
        }
        setLine('heroLocal', 'var(--success)', '属地', item.localName, item.localUnit);
        setLine('heroPolice', '#7c3aed', '民警', item.policeName, item.policeUnit);
        setLine('heroRescue', '#e65100', '抢险', item.rescueName, item.rescueUnit);
    }

    function renderActionGrid() {
        var groups = [
            { key: 'local', label: '呼叫属地联系人', icon: 'fa-user', cls: 'local', phone: item.localPhone },
            { key: 'police', label: '呼叫民警联系人', icon: 'fa-shield-halved', cls: 'police', phone: item.policePhone },
            { key: 'rescue', label: '呼叫抢险联系人', icon: 'fa-truck-medical', cls: 'rescue', phone: item.rescuePhone },
            { key: 'map', label: '在地图中查看', icon: 'fa-map-location-dot', cls: 'map', phone: '' }
        ];

        var html = groups.map(function(g) {
            var disabled = (!g.phone || !String(g.phone).trim()) ? ' disabled' : '';
            return '<div class="action-grid-cell' + disabled + '" id="act_' + g.key + '">' +
                '<div class="ag-icon ' + g.cls + '"><i class="fa-solid ' + g.icon + '"></i></div>' +
                '<div class="ag-label">' + g.label + '</div>' +
            '</div>';
        }).join('');
        document.getElementById('actionGrid').innerHTML = html;

        ['local', 'police', 'rescue'].forEach(function(k) {
            var g = groups.find(function(x) { return x.key === k; });
            var el = document.getElementById('act_' + k);
            if (!el || !g.phone || !String(g.phone).trim()) return;
            el.addEventListener('click', function(e) {
                e.stopPropagation();
                window.location.href = 'tel:' + g.phone;
                App.showToast('正在呼叫 ' + App.escapeHtml(g.phone));
            });
        });

        var mapEl = document.getElementById('act_map');
        if (!item.lng || !item.lat || !String(item.lng).trim() || !String(item.lat).trim()) {
            mapEl.classList.add('disabled');
        } else {
            mapEl.addEventListener('click', function(e) {
                e.stopPropagation();
                var url = 'https://uri.amap.com/marker?position=' + encodeURIComponent(item.lng + ',' + item.lat) +
                    '&name=' + encodeURIComponent(item.localUnit || '三到位点位') +
                    '&src=' + encodeURIComponent('奉贤风险管控');
                window.open(url, '_blank');
            });
        }
    }

    function renderGroup(prefix, unitKey, nameKey, postKey, phoneKey, containerId, missingId) {
        var unit = item[unitKey];
        var name = item[nameKey];
        var post = item[postKey];
        var phone = item[phoneKey];
        var missing = isMissing(unit, name, phone);
        document.getElementById(missingId).style.display = missing ? 'block' : 'none';

        var phoneVal = phone && String(phone).trim()
            ? '<span class="phone"><i class="fa-solid fa-phone"></i> ' + App.escapeHtml(phone) + '</span>'
            : App.escapeHtml('—');
        var rows = [
            { label: prefix + '单位', value: App.escapeHtml(getVal(unit)) },
            { label: '姓名', value: App.escapeHtml(getVal(name)) },
            { label: '职务', value: App.escapeHtml(getVal(post)) },
            { label: '联系方式', value: phoneVal, cls: 'phone' }
        ];
        document.getElementById(containerId).innerHTML = renderInfoGrid(rows);
    }

    function renderReportInfo() {
        var rows = [
            { label: '填报单位', value: App.escapeHtml(getVal(item.reportUnit)) },
            { label: '填报人', value: App.escapeHtml(getVal(item.reporter)) },
            { label: '填报日期', value: App.escapeHtml(getVal(item.reportDate)) }
        ];
        document.getElementById('reportInfo').innerHTML = renderInfoGrid(rows);
    }

    function init() {
        renderHero();
        renderActionGrid();
        renderGroup('属地', 'localUnit', 'localName', 'localPost', 'localPhone', 'localInfo', 'localMissing');
        renderGroup('民警', 'policeUnit', 'policeName', 'policePost', 'policePhone', 'policeInfo', 'policeMissing');
        renderGroup('抢险', 'rescueUnit', 'rescueName', 'rescuePost', 'rescuePhone', 'rescueInfo', 'rescueMissing');
        renderReportInfo();

        var now = new Date();
        document.getElementById('statusTime').textContent =
            String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    init();
})();
</script>
</body>
</html>
