<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>在建工地</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>

.phone-shell { display: flex; flex-direction: column; overflow: hidden; position: relative; }
.content-sheet.page-body-sheet { flex: 1; overflow-y: auto; overflow-x: hidden; margin-top: 0; padding-top: 18px; border-radius: 0; box-shadow: none; border: none; background: transparent; scrollbar-width: none; -ms-overflow-style: none; }
.content-sheet.page-body-sheet::-webkit-scrollbar { display: none; }
.content-sheet .search-bar { align-items: center; gap: 10px; margin-top: 4px; background: transparent; box-shadow: none; border: none; padding: 0; }
.content-sheet .search-input-wrapper { display: flex; align-items: center; background: var(--card); border-radius: var(--radius); box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); min-height: 40px; position: relative; }
.content-sheet .search-input-wrapper input { background: transparent; border-color: transparent; height: 40px; padding-top: 0; padding-bottom: 0; flex: 1; width: 100%; min-width: 0; padding-right: 30px; }
.content-sheet .filter-trigger {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 40px;
    padding: 0 14px;
    background: var(--card);
    color: var(--text2);
    font-size: 13px;
    font-weight: 400;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 2px 8px var(--shadow);
    cursor: pointer;
    position: relative;
    transition: all .15s;
}
.content-sheet .filter-trigger:active { transform: scale(.96); }
.content-sheet .filter-trigger .badge-num {
    position: absolute;
    top: -6px;
    right: -6px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 8px;
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--card);
    box-sizing: border-box;
    display: none;
}
.content-sheet .filter-trigger .badge-dot {
    position: absolute;
    top: -3px;
    right: -3px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
    border: 1.5px solid var(--card);
    display: none;
}

.search-input-wrapper .clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--text2);
    color: #fff;
    font-size: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    padding: 0;
}

.selected-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.tag { background: rgba(var(--primary-rgb),.08); color: var(--primary); border: 1px solid rgba(var(--primary-rgb),.18); border-radius: 999px; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.tag i { cursor: pointer; font-size: 10px; }

.site-card { background: var(--card); border-radius: 14px; box-shadow: 0 2px 10px var(--shadow); border: 1px solid var(--border); padding: 16px; margin-bottom: 12px; cursor: pointer; transition: transform .12s; }
.site-card:active { transform: scale(.99); }

.site-title-wrap { margin-bottom: 10px; }
.site-title-row { display: flex; align-items: flex-start; gap: 10px; }
.site-main-title { font-size: 16px; font-weight: 700; color: #1F1F1F; line-height: 1.4; word-break: break-word; flex: 1; }
.site-sub-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; }
.site-sub-title { font-size: 13px; color: var(--text2); line-height: 1.4; word-break: break-word; flex: 1; }
.site-plan-badge {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 999px;
    white-space: nowrap;
}
.site-plan-badge.yes { background: var(--success); color: #fff; }
.site-plan-badge.no { background: rgba(var(--danger-rgb),.12); color: var(--danger); border: 1px solid rgba(var(--danger-rgb),.25); }

.site-meta-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
.site-meta-row .site-level-region { flex-shrink: 0; white-space: nowrap; }
.site-meta-row .site-category { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.site-meta-row .site-category span { color: var(--text-primary); font-weight: 500; }
.site-meta-row .site-divider { width: 1px; height: 12px; background: var(--border); flex-shrink: 0; }
.site-address-row { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); margin-bottom: 10px; }
.site-address-row .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.site-address-row i { font-size: 12px; flex-shrink: 0; }

.site-people-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text2); margin-bottom: 8px; }
.site-people-item { display: flex; align-items: center; gap: 6px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.site-people-item i { font-size: 12px; flex-shrink: 0; }
.site-people-item span { color: var(--text-primary); font-weight: 600; }
.site-people-item.warn span { color: #e65100; }
.site-people-row .site-divider { width: 1px; height: 12px; background: var(--border); flex-shrink: 0; }

.site-shelter { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.site-shelter i { font-size: 12px; flex-shrink: 0; color: var(--primary); }
.site-shelter span { color: var(--text-primary); font-weight: 500; }

.site-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
.site-contact { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.site-contact i { font-size: 12px; flex-shrink: 0; }
.site-contact .label { flex-shrink: 0; }
.site-contact .name { color: var(--text-primary); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.call-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #E6FFED;
    color: #52C41A;
    border: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    text-decoration: none;
    flex-shrink: 0;
    cursor: pointer;
    transition: all .15s;
}
.call-btn:active { transform: scale(.94); background: #52C41A; color: #fff; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
.empty-state i { font-size: 48px; margin-bottom: 12px; opacity: .5; }
.empty-state .empty-title { font-size: 15px; color: var(--text-primary); margin-bottom: 6px; }
.empty-state .empty-desc { font-size: 13px; }

.bottom-spacer { height: 20px; }

.modal-sheet {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    max-height: 80%;
    display: flex !important;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transform: translateY(100%);
    transition: transform .25s ease, opacity .25s ease;
    z-index: 1001;
    background: var(--card);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    scrollbar-width: none; -ms-overflow-style: none;
}
.modal-sheet::-webkit-scrollbar { display: none; }
.modal-sheet.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.modal-mask { display: none; opacity: 0; transition: opacity .25s ease; z-index: 1000; }
.modal-mask.show { display: block; opacity: 1; }
.sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sheet-title { font-size: 16px; font-weight: 700; }
.sheet-close { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--text2); cursor: pointer; }
.sheet-body { padding: 16px; flex: 1; overflow-y: auto; min-height: 0; scrollbar-width: none; -ms-overflow-style: none; }
.sheet-body::-webkit-scrollbar { display: none; }
.filter-section { margin-bottom: 18px; }
.filter-section .filter-title { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
.filter-section .filter-options { display: flex; flex-wrap: wrap; gap: 10px; }
.filter-chip { padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-primary); cursor: pointer; transition: all .15s; }
.filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.sheet-footer { display: flex; gap: 12px; padding: 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
.sheet-footer .btn { flex: 1; height: 44px; border-radius: 10px; }
.date-row { display: flex; align-items: center; gap: 10px; }
.date-row input { flex: 1; height: 40px; border: 1px solid var(--border); border-radius: var(--radius); padding: 0 10px; font-size: 14px; background: var(--input-bg); color: var(--text-primary); }
.date-row span { color: var(--text2); font-size: 13px; }

:root[data-theme="dark"] .tag { background: rgba(var(--primary-rgb),.15); border-color: rgba(var(--primary-rgb),.3); }
:root[data-theme="dark"] .content-sheet .search-input-wrapper input { background: var(--input-bg); }
:root[data-theme="dark"] .site-main-title { color: #F0F0F0; }
:root[data-theme="dark"] .site-contact .name { color: #F0F0F0; }
:root[data-theme="dark"] .site-people-item span { color: #F0F0F0; }
:root[data-theme="dark"] .site-shelter span { color: #F0F0F0; }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <!-- 固定顶部区域：状态栏 + 导航栏 -->
        <div class="top-sticky">
            <div class="status-bar light">
                <span class="sb-time" id="statusTime">9:41</span>
                <span class="sb-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                    <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
                </span>
            </div>
            <div class="page-hero">
                <div class="ph-back" onclick="App.back()">
                    <i class="fa-solid fa-chevron-left"></i>
                </div>
                <div class="ph-title">在建工地</div>
            </div>
        </div>

        <!-- 可滚动内容区 -->
        <div class="content-sheet page-body-sheet">
            <div class="search-bar">
                <div class="search-input-wrapper" style="flex:1">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="搜索工程名称/地址/施工单位/联系人" autocomplete="off">
                    <button class="clear-btn" id="clearSearch" onclick="clearSearch(event)"><i class="fa-solid fa-times"></i></button>
                </div>
                <div class="filter-trigger" id="filterTrigger" onclick="openDrawer()">
                    <i class="fa-solid fa-filter"></i> 筛选
                    <span class="badge-dot" id="filterDot"></span>
                    <span class="badge-num" id="filterBadge" style="display:none">0</span>
                </div>
            </div>

            <div class="selected-tags" id="selectedTags"></div>

            <div class="section-v2" id="listSection">
                <div class="sv2-head">
                    <div class="sv2-title">
                        <i class="fa-solid fa-building" style="color:var(--primary);margin-right:6px"></i>
                        在建工地
                    </div>
                    <div class="sv2-more" id="totalCount">共 0 处</div>
                </div>
                <div class="card-list" id="cardList"></div>
                <div class="loading" id="loading" style="display:none">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> 加载中…
                </div>
                <div class="empty-state" id="empty" style="display:none">
                    <i class="fa-regular fa-folder-open"></i>
                    <div class="empty-title">暂无符合条件的在建工地</div>
                    <div class="empty-desc">请调整筛选或搜索条件</div>
                </div>
                <div class="bottom-spacer"></div>
            </div>
        </div>

        <!-- 筛选抽屉 -->
        <div class="modal-mask" id="drawerOverlay" onclick="closeDrawer()"></div>
        <div class="modal-sheet" id="drawer">
            <div class="sheet-header">
                <div class="sheet-title">筛选条件</div>
            </div>
            <div class="sheet-body" id="drawerBody"></div>
            <div class="sheet-footer">
                <button class="btn btn-outline" onclick="resetFilters()">重置</button>
                <button class="btn btn-primary" onclick="confirmFilters()">确定</button>
            </div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../../data/construction-site-data.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    var rawData = (typeof constructionSiteData !== 'undefined' && Array.isArray(constructionSiteData)) ? constructionSiteData : [];
    var allData = rawData.map(function(item) {
        return {
            no: item.no || '',
            projectName: item.projectName || '',
            region: item.region || '',
            address: item.address || '',
            constructionUnit: item.constructionUnit || '',
            projectLevel: item.projectLevel || '',
            projectCategory: item.projectCategory || '',
            evacuationUnit: item.evacuationUnit || '',
            totalPeople: item.totalPeople || '',
            hasFloodPlan: item.hasFloodPlan || '',
            transferPeople: item.transferPeople || '',
            shelterName: item.shelterName || '',
            shelterAddress: item.shelterAddress || '',
            contactPerson: item.contactPerson || '',
            contactPosition: item.contactPosition || '',
            contactPhone: item.contactPhone || '',
            reportUnit: item.reportUnit || '',
            reporter: item.reporter || '',
            reportDate: item.reportDate || ''
        };
    });

    var selectedFilters = { projectLevel: '', region: '', hasFloodPlan: '', startDate: '', endDate: '' };

    var levelOptions = ['全部', '市级', '区级', '镇级'];
    var planOptions = ['全部', '有', '无'];

    var regionOptions = (function() {
        var set = {};
        allData.forEach(function(item) { if (item.region) set[item.region] = true; });
        var list = Object.keys(set);
        list.sort();
        return ['全部'].concat(list);
    })();

    function saveToStorage() {
        try { localStorage.setItem('constructionSiteData', JSON.stringify(allData)); } catch (e) {}
    }

    function getFilteredData() {
        var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        return allData.filter(function(item) {
            if (keyword) {
                var hay = [
                    item.projectName, item.region, item.address, item.constructionUnit,
                    item.evacuationUnit, item.contactPerson, item.shelterName, item.shelterAddress,
                    item.contactPosition, item.reportUnit, item.reporter, item.reportDate
                ].join(' ').toLowerCase();
                if (hay.indexOf(keyword) === -1) return false;
            }
            if (selectedFilters.projectLevel && selectedFilters.projectLevel !== '全部' && item.projectLevel !== selectedFilters.projectLevel) return false;
            if (selectedFilters.region && selectedFilters.region !== '全部' && item.region !== selectedFilters.region) return false;
            if (selectedFilters.hasFloodPlan && selectedFilters.hasFloodPlan !== '全部') {
                var plan = String(item.hasFloodPlan).trim();
                if (plan !== selectedFilters.hasFloodPlan) return false;
            }
            if (selectedFilters.startDate && item.reportDate) {
                if (item.reportDate < selectedFilters.startDate) return false;
            }
            if (selectedFilters.endDate && item.reportDate) {
                if (item.reportDate > selectedFilters.endDate) return false;
            }
            return true;
        });
    }

    function parseProjectName(name) {
        var main = name || '—';
        var sub = '';
        var idx = main.indexOf('（');
        if (idx > 0) {
            sub = main.substring(idx);
            main = main.substring(0, idx);
        }
        return { main: main, sub: sub };
    }

    function renderCard(item) {
        var hasPhone = item.contactPhone && String(item.contactPhone).trim();
        var nameParts = parseProjectName(item.projectName);
        var planYes = String(item.hasFloodPlan).trim() === '有';

        return '<div class="site-card" onclick="goDetail(' + item.no + ')" data-id="' + item.no + '">' +
            '<div class="site-title-wrap">' +
                '<div class="site-title-row">' +
                    '<div class="site-main-title">' + App.escapeHtml(nameParts.main) + '</div>' +
                '</div>' +
                '<div class="site-sub-row">' +
                    (nameParts.sub ? '<div class="site-sub-title">' + App.escapeHtml(nameParts.sub) + '</div>' : '<div></div>') +
                    '<div class="site-plan-badge ' + (planYes ? 'yes' : 'no') + '">' + (planYes ? '有预案' : '无预案') + '</div>' +
                '</div>' +
            '</div>' +
            '<div class="site-meta-row">' +
                '<div class="site-level-region">' + App.escapeHtml(item.projectLevel || '—') + ' · ' + App.escapeHtml(item.region || '—') + '</div>' +
                '<div class="site-divider"></div>' +
                '<div class="site-category">项目类别：<span>' + App.escapeHtml(item.projectCategory || '—') + '</span></div>' +
            '</div>' +
            '<div class="site-address-row"><i class="fa-solid fa-location-dot"></i><span class="txt">' + App.escapeHtml(item.address || '—') + '</span></div>' +
            '<div class="site-people-row">' +
                '<div class="site-people-item"><i class="fa-solid fa-users"></i>总人数：<span>' + App.escapeHtml(item.totalPeople || '0') + '</span></div>' +
                '<div class="site-divider"></div>' +
                '<div class="site-people-item warn"><i class="fa-solid fa-triangle-exclamation"></i>需转移安置：<span>' + App.escapeHtml(item.transferPeople || '0') + '</span></div>' +
            '</div>' +
            '<div class="site-shelter"><i class="fa-solid fa-tents"></i>安置场所：<span>' + App.escapeHtml(item.shelterName || '—') + '</span></div>' +
            '<div class="site-bottom">' +
                '<div class="site-contact"><i class="fa-regular fa-user"></i><span class="label">' + App.escapeHtml(item.contactPosition || '联系人') + '：</span><span class="name">' + App.escapeHtml(item.contactPerson || '—') + '</span></div>' +
                (hasPhone ? '<a class="call-btn" href="tel:' + App.escapeHtml(item.contactPhone) + '" onclick="event.stopPropagation();App.showToast(\'正在呼叫 ' + App.escapeHtml(item.contactPerson) + ' ' + App.escapeHtml(item.contactPhone) + '\')"><i class="fa-solid fa-phone"></i></a>' : '') +
            '</div>' +
        '</div>';
    }

    function renderList() {
        var data = getFilteredData();
        var container = document.getElementById('cardList');
        container.innerHTML = '';
        document.getElementById('totalCount').innerHTML = '共 <strong>' + data.length + '</strong> 处在建工地';
        if (data.length === 0) {
            document.getElementById('empty').style.display = 'block';
            return;
        }
        document.getElementById('empty').style.display = 'none';
        data.forEach(function(item) { container.innerHTML += renderCard(item); });
    }

    window.goDetail = function(id) {
        saveToStorage();
        window.location.href = 'construction-site-detail.html?id=' + id;
    };

    function updateSearchClear() {
        var btn = document.getElementById('clearSearch');
        btn.style.display = document.getElementById('searchInput').value ? 'flex' : 'none';
    }

    window.clearSearch = function(e) {
        e.stopPropagation();
        document.getElementById('searchInput').value = '';
        updateSearchClear();
        renderList();
    };

    document.getElementById('searchInput').addEventListener('input', function() {
        updateSearchClear();
        renderList();
    });

    function renderSelectedTags() {
        var container = document.getElementById('selectedTags');
        var html = '';
        var count = 0;
        if (selectedFilters.projectLevel && selectedFilters.projectLevel !== '全部') {
            html += '<span class="tag">级别：' + App.escapeHtml(selectedFilters.projectLevel) + '<i class="fa-solid fa-times" onclick="removeFilter(\'projectLevel\')"></i></span>';
            count++;
        }
        if (selectedFilters.region && selectedFilters.region !== '全部') {
            html += '<span class="tag">街镇：' + App.escapeHtml(selectedFilters.region) + '<i class="fa-solid fa-times" onclick="removeFilter(\'region\')"></i></span>';
            count++;
        }
        if (selectedFilters.hasFloodPlan && selectedFilters.hasFloodPlan !== '全部') {
            html += '<span class="tag">预案：' + App.escapeHtml(selectedFilters.hasFloodPlan) + '<i class="fa-solid fa-times" onclick="removeFilter(\'hasFloodPlan\')"></i></span>';
            count++;
        }
        if (selectedFilters.startDate || selectedFilters.endDate) {
            var dateText = (selectedFilters.startDate || '—') + ' ~ ' + (selectedFilters.endDate || '—');
            html += '<span class="tag">日期：' + App.escapeHtml(dateText) + '<i class="fa-solid fa-times" onclick="removeFilter(\'dateRange\')"></i></span>';
            count++;
        }
        container.innerHTML = html;

        var badge = document.getElementById('filterBadge');
        var dot = document.getElementById('filterDot');
        var trigger = document.getElementById('filterTrigger');
        if (count > 0) {
            badge.textContent = count;
            badge.style.display = 'flex';
            dot.style.display = 'none';
            trigger.classList.add('active');
        } else {
            badge.style.display = 'none';
            dot.style.display = 'none';
            trigger.classList.remove('active');
        }
    }

    window.removeFilter = function(key) {
        if (key === 'dateRange') {
            selectedFilters.startDate = '';
            selectedFilters.endDate = '';
        } else {
            selectedFilters[key] = '';
        }
        renderSelectedTags();
        renderDrawer();
        renderList();
    };

    window.openDrawer = function() {
        document.getElementById('drawerOverlay').classList.add('show');
        document.getElementById('drawer').classList.add('show');
    };

    window.closeDrawer = function() {
        document.getElementById('drawerOverlay').classList.remove('show');
        document.getElementById('drawer').classList.remove('show');
    };

    function renderDrawer() {
        var html = '';

        // 项目级别
        html += '<div class="filter-section">';
        html += '<div class="filter-title">项目级别</div>';
        html += '<div class="filter-options">';
        levelOptions.forEach(function(opt) {
            var active = selectedFilters.projectLevel === opt ? ' active' : '';
            html += '<span class="filter-chip' + active + '" onclick="selectChip(this, \'projectLevel\', \'' + opt + '\')">' + opt + '</span>';
        });
        html += '</div></div>';

        // 所属街镇
        html += '<div class="filter-section">';
        html += '<div class="filter-title">所属街镇</div>';
        html += '<div class="filter-options">';
        regionOptions.forEach(function(opt) {
            var active = selectedFilters.region === opt ? ' active' : '';
            html += '<span class="filter-chip' + active + '" onclick="selectChip(this, \'region\', \'' + opt + '\')">' + opt + '</span>';
        });
        html += '</div></div>';

        // 应急预案
        html += '<div class="filter-section">';
        html += '<div class="filter-title">应急预案</div>';
        html += '<div class="filter-options">';
        planOptions.forEach(function(opt) {
            var active = selectedFilters.hasFloodPlan === opt ? ' active' : '';
            html += '<span class="filter-chip' + active + '" onclick="selectChip(this, \'hasFloodPlan\', \'' + opt + '\')">' + opt + '</span>';
        });
        html += '</div></div>';

        // 填报日期
        html += '<div class="filter-section">';
        html += '<div class="filter-title">填报日期</div>';
        html += '<div class="date-row">';
        html += '<input type="date" id="startDateInput" value="' + (selectedFilters.startDate || '') + '">';
        html += '<span>~</span>';
        html += '<input type="date" id="endDateInput" value="' + (selectedFilters.endDate || '') + '">';
        html += '</div></div>';

        document.getElementById('drawerBody').innerHTML = html;
    }

    window.selectChip = function(el, key, value) {
        var group = el.parentElement;
        group.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
        if (selectedFilters[key] === value) {
            selectedFilters[key] = '';
        } else {
            selectedFilters[key] = value;
            el.classList.add('active');
        }
    };

    window.confirmFilters = function() {
        var startInput = document.getElementById('startDateInput');
        var endInput = document.getElementById('endDateInput');
        if (startInput) selectedFilters.startDate = startInput.value;
        if (endInput) selectedFilters.endDate = endInput.value;
        renderSelectedTags();
        closeDrawer();
        renderList();
    };

    window.resetFilters = function() {
        selectedFilters = { projectLevel: '', region: '', hasFloodPlan: '', startDate: '', endDate: '' };
        renderDrawer();
        renderSelectedTags();
        renderList();
    };

    function updateTime() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        document.getElementById('statusTime').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    }
    updateTime();
    setInterval(updateTime, 60000);

    renderDrawer();
    renderSelectedTags();
    renderList();
})();
</script>
</body>
</html>
