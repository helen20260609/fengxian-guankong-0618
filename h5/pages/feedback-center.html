<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>反馈中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/tokens.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/h5-frame.css">
    <style>
        
        .knowledge-hero {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #1d4ed8 100%);
            margin-top: -34px;
            padding: calc(34px + 4px) 18px 12px;
            color: #fff;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .knowledge-hero::before {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            right: -50px;
            top: -20px;
            background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%);
            border-radius: 50%;
        }
        .knowledge-hero .kh-back {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            cursor: pointer;
        }
        .knowledge-hero .hero-title { flex: 1; position: relative; z-index: 2; text-align: center; padding-right: 32px; }
        .knowledge-hero h1 { font-size: 17px; font-weight: 600; }

        .law-body {
            flex: 1;
            overflow-y: auto;
            padding: var(--space);
            background: var(--bg-dark);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .law-body::-webkit-scrollbar { display: none; }

        .filter-bar {
            background: var(--card);
            padding: 12px 0;
            display: flex;
            justify-content: flex-start;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .filter-dropdown {
            flex: 0 0 auto;
            width: 120px;
            position: relative;
        }
        .filter-dropdown select {
            width: 100%;
            padding: 8px 28px 8px 12px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-primary);
            background: var(--input-bg);
            appearance: none;
            -webkit-appearance: none;
            outline: none;
            cursor: pointer;
        }
        .filter-dropdown::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text2);
            font-size: 12px;
            pointer-events: none;
        }
        .filter-type-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-type-btn {
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--card);
            font-size: 12px;
            color: var(--text2);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .filter-type-btn.active {
            border-color: var(--primary);
            background: rgba(var(--primary-rgb), 0.12);
            color: var(--primary);
            font-weight: 500;
        }

        .status-tabs {
            display: flex;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 0 var(--space);
            position: sticky;
            top: 49px;
            z-index: 50;
        }
        .status-tab {
            flex: 1;
            padding: 14px 0;
            text-align: center;
            font-size: 14px;
            color: var(--text2);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .status-tab.active {
            color: var(--primary);
            font-weight: 600;
        }
        .status-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            right: 20%;
            height: 3px;
            background: var(--primary);
            border-radius: 3px 3px 0 0;
        }
        .status-tab .badge {
            display: inline-block;
            width: 18px;
            height: 18px;
            line-height: 18px;
            text-align: center;
            background: rgba(217,48,37,0.12);
            color: var(--dot-red);
            font-size: 11px;
            border-radius: 50%;
            margin-left: 4px;
            font-weight: 600;
        }

        .feedback-list {
            padding: var(--space) 0;
        }
        .feedback-card {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: var(--space);
            margin-bottom: var(--space);
            box-shadow: 0 4px 16px rgba(0,0,0,.06);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }
        .feedback-card:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .feedback-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .feedback-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            line-height: 1.4;
        }
        .feedback-status-tag {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            margin-left: 8px;
            flex-shrink: 0;
        }
        .feedback-status-tag.pending { background: rgba(227,116,0,0.12); color: var(--dot-orange); }
        .feedback-status-tag.processing { background: rgba(26,115,232,0.12); color: var(--primary); }
        .feedback-status-tag.resolved { background: rgba(30,142,62,0.12); color: var(--success); }
        .feedback-meta {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: var(--text2);
            margin-bottom: 8px;
        }
        .feedback-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .feedback-meta i {
            font-size: 11px;
        }
        .feedback-domain {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            background: var(--bg-dark);
            color: var(--text2);
            margin-right: 6px;
        }
        .feedback-type {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            background: var(--bg-dark);
            color: var(--text2);
        }
        .feedback-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-top: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .feedback-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .feedback-card-footer .feedback-meta {
            margin-bottom: 0;
        }
        .feedback-action-btn {
            padding: 6px 14px;
            border-radius: 16px;
            border: 1px solid var(--primary);
            background: var(--primary);
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .feedback-action-btn:active {
            opacity: 0.9;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text2);
        }
        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            color: var(--border);
        }
        .empty-state p {
            font-size: 14px;
        }

        .phone-shell {
            overflow: hidden;
        }

        @media screen and (min-width: 480px) {
            .phone-shell .filter-bar,
            .phone-shell .status-tabs {
                width: var(--phone-shell-width);
                left: 50%;
                right: auto;
                transform: translateX(-50%);
            }
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="side-button side-button-left mute"></div>
        <div class="side-button side-button-left volume-up"></div>
        <div class="side-button side-button-left volume-down"></div>
        <div class="side-button side-button-right power"></div>
        <div class="phone-shell">
            <div class="status-bar light">
                <span class="sb-time" id="statusTime">9:41</span>
                <span class="sb-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                    <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
                </span>
            </div>

            <div class="knowledge-hero">
                <div class="kh-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
                <div class="hero-title">
                    <h1>反馈中心</h1>
                </div>
            </div>

            <div class="law-body">
                <!-- 筛选栏 -->
                <div class="filter-bar anim d1">
                    <div class="filter-dropdown">
                        <select id="domainFilter" onchange="filterByDomain(this.value)">
                            <option value="">全部领域</option>
                            <option value="selfhouse">城镇自建房</option>
                            <option value="ruralhouse">农村自建房</option>
                            <option value="construction">建筑工地</option>
                            <option value="deepfoundation">深基坑</option>
                            <option value="glasswall">玻璃幕墙</option>
                            <option value="gas">燃气安全</option>
                            <option value="falling">高空坠物</option>
                            <option value="traffic">交通安全</option>
                        </select>
                    </div>
                    <div class="filter-type-group" id="filterTypeGroup">
                        <button class="filter-type-btn" data-type="tech" onclick="toggleTypeFilter(this)">技术</button>
                        <button class="filter-type-btn" data-type="resource" onclick="toggleTypeFilter(this)">资源</button>
                        <button class="filter-type-btn" data-type="coordination" onclick="toggleTypeFilter(this)">协调</button>
                        <button class="filter-type-btn" data-type="process" onclick="toggleTypeFilter(this)">流程</button>
                    </div>
                </div>

                <!-- 状态标签栏 -->
                <div class="status-tabs anim d1">
                    <div class="status-tab active" onclick="switchTab(this, 'pending')">
                        待处理 <span class="badge">3</span>
                    </div>
                    <div class="status-tab" onclick="switchTab(this, 'processing')">
                        处理中 <span class="badge">2</span>
                    </div>
                    <div class="status-tab" onclick="switchTab(this, 'resolved')">
                        已解决
                    </div>
                </div>

                <!-- 反馈列表 -->
                <div class="feedback-list anim d2" id="feedbackList"></div>

                <div class="bottom-spacer"></div>
            </div>
        </div>
    </div>

    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/risk-data.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>
        // 状态栏时间
        var now = new Date();
        document.getElementById('statusTime').textContent =
            String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

        // 反馈数据
        const feedbackData = [
            {
                id: 1,
                title: '燃气管道检测方案不可行',
                domain: 'gas',
                domainName: '燃气安全',
                type: 'tech',
                typeName: '技术问题',
                status: 'pending',
                desc: '当前使用的检测方案在实际操作中无法准确识别管道泄漏点，建议更换为更先进的检测设备。',
                operator: '张三',
                time: '2025-06-20 14:32:18',
                photos: 2
            },
            {
                id: 2,
                title: '深基坑监测人员不足',
                domain: 'deepfoundation',
                domainName: '深基坑',
                type: 'resource',
                typeName: '资源问题',
                status: 'pending',
                desc: '基坑监测需要24小时轮班，但目前监测人员只有2人，无法满足监测要求。',
                operator: '李四',
                time: '2025-06-19 10:15:30',
                photos: 0
            },
            {
                id: 3,
                title: '建筑工地审批流程过慢',
                domain: 'construction',
                domainName: '建筑工地',
                type: 'process',
                typeName: '流程问题',
                status: 'pending',
                desc: '施工许可证审批已经超过15个工作日，严重影响工程进度。',
                operator: '王五',
                time: '2025-06-18 16:45:00',
                photos: 1
            },
            {
                id: 4,
                title: '玻璃幕墙检测协调困难',
                domain: 'glasswall',
                domainName: '玻璃幕墙',
                type: 'coordination',
                typeName: '协调问题',
                status: 'processing',
                desc: '物业不配合检测人员进入楼宇内部进行检测，需要协调相关部门介入。',
                operator: '赵六',
                time: '2025-06-17 09:20:15',
                photos: 3
            },
            {
                id: 5,
                title: '高空坠物防护设备缺乏',
                domain: 'falling',
                domainName: '高空坠物',
                type: 'resource',
                typeName: '资源问题',
                status: 'processing',
                desc: '老旧小区外墙防护网安装需要专用设备，目前设备租赁困难。',
                operator: '钱七',
                time: '2025-06-16 14:00:00',
                photos: 0
            },
            {
                id: 6,
                title: '交通安全标识设置不合理',
                domain: 'traffic',
                domainName: '交通安全',
                type: 'tech',
                typeName: '技术问题',
                status: 'resolved',
                desc: '路口交通标识设置位置不合理，驾驶员视线受阻，已重新规划标识位置。',
                operator: '孙八',
                time: '2025-06-15 11:30:00',
                photos: 2
            },
            {
                id: 7,
                title: '农村自建房排查流程优化',
                domain: 'ruralhouse',
                domainName: '农村自建房',
                type: 'process',
                typeName: '流程问题',
                status: 'resolved',
                desc: '建议简化农村自建房排查登记流程，采用移动端直接录入代替纸质登记。',
                operator: '周九',
                time: '2025-06-14 16:00:00',
                photos: 0
            },
            {
                id: 8,
                title: '农村自建房墙体开裂隐患上报',
                domain: 'ruralhouse',
                domainName: '农村自建房',
                type: 'tech',
                typeName: '技术问题',
                status: 'pending',
                desc: '南桥镇某农村自建房外墙出现明显裂缝，屋顶存在渗漏，建议尽快组织技术鉴定并制定加固方案。',
                operator: '吴十',
                time: '2025-06-25 09:30:00',
                photos: 2
            }
        ];

        let currentStatus = 'pending';
        let currentDomain = '';
        let selectedTypes = new Set();

        // 切换状态标签
        function switchTab(el, status) {
            document.querySelectorAll('.status-tab').forEach(tab => tab.classList.remove('active'));
            el.classList.add('active');
            currentStatus = status;
            renderFeedbackList();
        }

        // 按领域筛选
        function filterByDomain(domain) {
            currentDomain = domain;
            renderFeedbackList();
        }

        // 多选类型筛选
        function toggleTypeFilter(el) {
            const type = el.dataset.type;
            if (selectedTypes.has(type)) {
                selectedTypes.delete(type);
                el.classList.remove('active');
            } else {
                selectedTypes.add(type);
                el.classList.add('active');
            }
            renderFeedbackList();
        }

        // 渲染反馈列表
        function renderFeedbackList() {
            const container = document.getElementById('feedbackList');
            let filtered = feedbackData.filter(item => {
                if (item.status !== currentStatus) return false;
                if (currentDomain && item.domain !== currentDomain) return false;
                if (selectedTypes.size > 0 && !selectedTypes.has(item.type)) return false;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-inbox"></i>
                        <p>暂无${getStatusText(currentStatus)}的反馈</p>
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach(item => {
                const statusClass = item.status === 'pending' ? 'pending' :
                                   item.status === 'processing' ? 'processing' : 'resolved';
                const statusText = item.status === 'pending' ? '待处理' :
                                  item.status === 'processing' ? '处理中' : '已解决';

                html += `
                    <div class="feedback-card" onclick="viewFeedbackDetail(${item.id})">
                        <div class="feedback-card-header">
                            <div class="feedback-title">${item.title}</div>
                            <span class="feedback-status-tag ${statusClass}">${statusText}</span>
                        </div>
                        <div>
                            <span class="feedback-domain">${item.domainName}</span>
                            <span class="feedback-type">${item.typeName}</span>
                        </div>
                        <div class="feedback-desc">${item.desc}</div>
                        <div class="feedback-card-footer">
                            <div class="feedback-meta">
                                <span><i class="fa-solid fa-user"></i> ${item.operator}</span>
                                <span><i class="fa-solid fa-clock"></i> ${item.time}</span>
                            </div>
                            <button class="feedback-action-btn" onclick="event.stopPropagation(); location.href='feedback-detail.html?id=${item.id}'"><i class="fa-solid fa-comment-dots" style="margin-right: 4px;"></i>处理</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 获取状态文本
        function getStatusText(status) {
            return status === 'pending' ? '待处理' :
                   status === 'processing' ? '处理中' : '已解决';
        }

        // 查看反馈详情
        function viewFeedbackDetail(id) {
            alert('查看反馈详情：' + id);
        }

        // 处理反馈
        function handleFeedback(id) {
            alert('处理反馈：' + id);
        }

        // 初始化渲染
        renderFeedbackList();
    </script>
</body>
</html>
