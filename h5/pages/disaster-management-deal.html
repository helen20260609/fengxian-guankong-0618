<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>隐患处置</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
/* 固定顶部：状态栏 + 导航栏 */
.top-sticky {
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 100;
}
.top-sticky .status-bar {
    position: relative;
    z-index: 100;
}

.page-hero {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(34px + 16px) 18px 42px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    position: relative;
}
.page-hero .ph-back {
    position: absolute;
    left: 14px;
    top: calc(34px + 16px);
    margin: 0;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}
.page-hero .ph-title {
    position: absolute;
    left: 50%;
    top: calc(34px + 16px);
    transform: translateX(-50%);
    text-align: center;
    line-height: 32px;
    width: 60%;
    font-size: 17px;
    font-weight: 600;
}

.content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 0 0 calc(80px + var(--safe-bottom, 0px)); background: #f5f6fa; }
.content::-webkit-scrollbar { display: none; }

.info-card {
    background: #fff;
    border-radius: 0;
    padding: 16px;
    margin: 0 0 12px 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.form-group { background: #fff; border-radius: 12px; padding: 0 16px; margin: 0 16px 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.info-card .unit-name { font-size: 16px; font-weight: 700; color: #333; line-height: 1.4; }
.info-card .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.info-card .badge { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.info-card .badge.level { background: #fff2ef; color: #d93025; }
.info-card .badge.status { background: #fff6ed; color: #e65100; }
.info-card .badge.domain { background: #e8f2fe; color: #1a73e8; }
.info-card .desc { margin-top: 12px; font-size: 13px; color: #666; line-height: 1.6; }


.form-row { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid #f0f0f0; }
.form-row:last-child { border-bottom: none; }
.form-row.horizontal { flex-direction: row; align-items: center; justify-content: space-between; }
.fr-label { font-size: 15px; color: #333; font-weight: 500; }
.fr-label .req { color: #ff4d4f; margin-right: 4px; }
.fr-control { display: flex; align-items: flex-start; }
.fr-control input[type="text"],
.fr-control input[type="date"],
.fr-control textarea {
    flex: 1;
    border: none;
    padding: 0;
    font-size: 15px;
    background: transparent;
    color: #333;
    font-family: inherit;
    width: 100%;
    outline: none;
}
.fr-control textarea { resize: none; line-height: 1.5; }
.fr-control input::placeholder,
.fr-control textarea::placeholder { color: #bfbfbf; }

.photo-group { padding: 14px 0; }
.photo-group-title { font-size: 15px; color: #333; font-weight: 500; margin-bottom: 12px; }
.photo-group-title .sub { font-size: 12px; color: #999; font-weight: 400; margin-left: 4px; }
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.photo-grid .photo-add, .photo-grid .photo-thumb { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.photo-grid .photo-add { border: 1px dashed #d9d9d9; color: #999; font-size: 22px; background: #fafafa; flex-direction: column; gap: 4px; cursor: pointer; }
.photo-grid .photo-add .add-text { font-size: 10px; }
.photo-grid .photo-thumb { background: #f5f5f5; overflow: hidden; position: relative; background-size: cover; background-position: center; }
.photo-grid .photo-thumb .remove { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; }

.bottom-actions {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    padding: 12px 16px calc(12px + var(--safe-bottom, 0px));
    background: #fff;
    border-top: 1px solid #f0f0f0;
    display: flex;
    gap: 12px;
    z-index: 100;
}
.bottom-actions .btn { flex: 1; height: 44px; border-radius: 22px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; }
.bottom-actions .btn-primary { background: var(--primary); color: #fff; }
.bottom-actions .btn-outline { background: #fff; color: #666; border: 1px solid #e0e0e0; }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="top-sticky">
            <div class="status-bar light">
                <span class="sb-time" id="statusTime">9:41</span>
                <span class="sb-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                    <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
                </span>
            </div>

            <div class="page-hero">
                <div class="ph-back tap" onclick="App.back()">
                    <i class="fa-solid fa-chevron-left"></i>
                </div>
                <div class="ph-title">隐患处置</div>
            </div>
        </div>

        <div class="content" id="content">
            <div class="info-card" id="infoCard">
                <div class="unit-name" id="unitName">--</div>
                <div class="tag-row" id="tagRow"></div>
                <div class="desc" id="dangerDesc">--</div>
            </div>

            <div class="form-group">
                <div class="form-row vertical">
                    <div class="fr-label"><span class="req">*</span>整改措施</div>
                    <div class="fr-control">
                        <textarea rows="4" id="dealDesc" placeholder="请填写具体处置措施及结果..."></textarea>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="photo-group">
                    <div class="photo-group-title">整改后照片 <span class="sub">(选填)</span></div>
                    <div class="photo-grid" id="photoGrid">
                        <div class="photo-add tap" onclick="takePhoto()"><i class="fa-solid fa-camera"></i><span class="add-text">拍摄</span></div>
                    </div>
                </div>
            </div>


        </div>

        <div class="bottom-actions">
            <button class="btn btn-outline" onclick="App.back()">取消</button>
            <button class="btn btn-primary" onclick="submitDeal()">提交处置</button>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    var now = new Date();
    document.getElementById('statusTime').textContent =
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');


    var detailId = App.getQuery('id');
    var rawData = (typeof DataStore !== 'undefined' && Array.isArray(DataStore.hiddenDangers)) ? DataStore.hiddenDangers : [];
    var item = rawData.find(function(i) { return i.id === detailId; });

    function getVal(v) { return v && String(v).trim() ? v : '—'; }

    function levelLabel(level) {
        var map = { red: '重大隐患', orange: '较大隐患', yellow: '一般隐患', blue: '轻微隐患' };
        return map[level] || level;
    }

    function statusLabel(status) {
        if (status === 'closed' || status === 'completed') return '已完成';
        return '未完成';
    }

    function renderInfo() {
        if (!item) {
            document.getElementById('unitName').textContent = '未找到隐患记录';
            return;
        }
        document.getElementById('unitName').textContent = getVal(item.unit || item.title);
        document.getElementById('dangerDesc').textContent = getVal(item.description || item.content);

        var level = item.level || 'blue';
        var levelMap = { red: '重大隐患', orange: '较大隐患', yellow: '一般隐患', blue: '轻微隐患' };
        var levelLabelText = levelMap[level] || level;
        var statusText = statusLabel(item.status);
        var domain = item.type || item.domain || '其他';

        document.getElementById('tagRow').innerHTML =
            '<span class="badge level">' + App.escapeHtml(levelLabelText) + '</span>' +
            '<span class="badge status">' + App.escapeHtml(statusText) + '</span>' +
            '<span class="badge domain">' + App.escapeHtml(domain) + '</span>';
    }

    var afterPhotos = [];

    function renderPhotos() {
        var grid = document.getElementById('photoGrid');
        var html = '';
        afterPhotos.forEach(function(url, i) {
            html += '<div class="photo-thumb" style="background-image:url(' + url + ')"><div class="remove" onclick="removePhoto(' + i + ')"><i class="fa-solid fa-xmark"></i></div></div>';
        });
        html += '<div class="photo-add tap" onclick="takePhoto()"><i class="fa-solid fa-camera"></i><span class="add-text">拍摄</span></div>';
        grid.innerHTML = html;
    }

    window.takePhoto = function() {
        App.takePhoto().then(function(url) {
            afterPhotos.push(url);
            renderPhotos();
        });
    };

    window.removePhoto = function(idx) {
        afterPhotos.splice(idx, 1);
        renderPhotos();
    };

    window.submitDeal = function() {
        var desc = document.getElementById('dealDesc').value.trim();

        if (!desc) { App.showToast('请填写整改措施'); return; }

        App.showLoading('提交中...');
        setTimeout(function() {
            if (item) {
                item.status = 'closed';
                item.completeTime = now.toISOString().slice(0, 10);
                item.dealDesc = desc;
                item.dealHandler = currentUserName;
                item.afterPhotos = afterPhotos.slice();
            }
            App.hideLoading();
            App.showToast('处置提交成功');
            setTimeout(function() {
                App.back();
            }, 1200);
        }, 600);
    };

    renderInfo();
})();
</script>
</body>
</html>
