<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>隐患处置</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
.filter-row { display: flex; gap: 8px; padding: 12px 14px; overflow-x: auto; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-row .fr { flex-shrink: 0; padding: 5px 12px; border-radius: 10px; font-size: 11px; border: 1px solid var(--border); background: var(--card); }
.filter-row .fr.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.hd-list { padding: 0 14px 20px; }
.hd-card { background: var(--card); border-radius: 10px; box-shadow: 0 2px 10px var(--shadow); border: 1px solid var(--border); padding: 14px; margin-bottom: 12px; }
.hd-card .hd-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.hd-card .hd-title { font-size: 14px; font-weight: 700; flex: 1; }
.hd-card .hd-meta { font-size: 11px; color: var(--text2); margin-top: 8px; display: flex; flex-wrap: wrap; gap: 10px; }
.hd-card .hd-meta span { display: flex; align-items: center; gap: 4px; }
.hd-card .hd-domain { font-size: 10px; color: var(--primary); background: rgba(var(--primary-rgb),.1); padding: 2px 8px; border-radius: 4px; }
.hd-card .hd-footer { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
.hd-card .hd-time { font-size: 10px; color: var(--text2); }

.fab { position: sticky; bottom: calc(20px + var(--safe-bottom)); margin-left: auto; margin-right: 20px; width: 52px; height: 52px; border-radius: 5px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 21px; box-shadow: 0 6px 16px rgba(26,115,232,.4); z-index: 90; }

.toolbar { display: flex; gap: 8px; padding: 0 14px 12px; }
.toolbar .tb-btn { flex: 1; padding: 8px 0; border-radius: 6px; border: 1px solid var(--border); background: var(--card); font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }

.map-view { display: none; margin: 0 14px 14px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 2px 10px var(--shadow); animation: fadeIn .3s; }
.map-view.show { display: block; }
#dangerMapChart { width: 100%; height: 420px; background: linear-gradient(180deg,#e0f2fe 0%,#f0fdf4 100%); }

.filter-panel { display: none; position: fixed; left: 0; right: 0; bottom: 0; top: 0; background: rgba(0,0,0,.5); z-index: 200; }
.filter-panel.show { display: block; }
.filter-sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 20px 20px 0 0; padding: 20px 14px calc(20px + var(--safe-bottom)); max-height: 80vh; overflow-y: auto; animation: slideUp .3s; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.filter-sheet .fs-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
.filter-sheet .fs-section { margin-bottom: 16px; }
.filter-sheet .fs-label { font-size: 12px; color: var(--text2); margin-bottom: 8px; }
.filter-sheet .fs-options { display: flex; flex-wrap: wrap; gap: 8px; }
.filter-sheet .fs-option { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 11px; background: var(--bg-card); }
.filter-sheet .fs-option.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.filter-sheet .fs-actions { display: flex; gap: 10px; margin-top: 20px; }
.filter-sheet .fs-actions .btn { flex: 1; }
</style>
</head>
<body>
<div class="phone-frame">
    <!-- 侧边按钮 -->
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <!-- 状态栏 -->
    <div class="status-bar">
        <span class="sb-time" id="statusTime">9:41</span>
        <span class="sb-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
            <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
        </span>
    </div>

    <div class="nav-bar">
        <div class="nav-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
        <div class="nav-title">隐患处置</div>
        <div class="nav-action tap" id="modeBtn" onclick="toggleMode()"><i class="fa-solid fa-map"></i></div>
    </div>

    <div class="toolbar anim d1">
        <div class="tb-btn tap" onclick="openFilter()"><i class="fa-solid fa-filter"></i> 筛选</div>
        <div class="tb-btn tap" onclick="resetFilter()"><i class="fa-solid fa-rotate-right"></i> 重置</div>
    </div>

    <div class="filter-row anim d2" id="statusFilter">
        <div class="fr active" data-status="all">全部</div>
        <div class="fr" data-status="reported">待处置</div>
        <div class="fr" data-status="handling">处置中</div>
        <div class="fr" data-status="closed">已闭环</div>
    </div>

    <div class="hd-list anim d3" id="hdList">
        <!-- 动态填充 -->
    </div>

    <div class="map-view" id="mapView">
        <div id="dangerMapChart"></div>
    </div>

    <div class="fab tap" onclick="App.go('hidden-danger-report.html')">
        <i class="fa-solid fa-plus"></i>
    </div>

    <!-- 筛选面板 -->
    <div class="filter-panel" id="filterPanel">
        <div class="filter-sheet">
            <div class="fs-title">
                <span>高级筛选</span>
                <div class="tap" onclick="closeFilter()"><i class="fa-solid fa-xmark"></i></div>
            </div>
            <div class="fs-section">
                <div class="fs-label">风险等级</div>
                <div class="fs-options" id="levelOptions">
                    <div class="fs-option active" data-val="all">全部</div>
                    <div class="fs-option" data-val="red">红色</div>
                    <div class="fs-option" data-val="orange">橙色</div>
                    <div class="fs-option" data-val="yellow">黄色</div>
                    <div class="fs-option" data-val="blue">蓝色</div>
                </div>
            </div>
            <div class="fs-section">
                <div class="fs-label">业务领域</div>
                <div class="fs-options" id="domainOptions">
                    <div class="fs-option active" data-val="all">全部</div>
                    <div class="fs-option" data-val="build">建筑工地</div>
                    <div class="fs-option" data-val="gas">燃气安全</div>
                    <div class="fs-option" data-val="traffic">交通安全</div>
                    <div class="fs-option" data-val="curtain">玻璃幕墙</div>
                    <div class="fs-option" data-val="selfbuild">自建房</div>
                    <div class="fs-option" data-val="rural">农村自建房</div>
                    <div class="fs-option" data-val="urban">城镇自建房</div>
                </div>
            </div>
            <div class="fs-actions">
                <button class="btn btn-outline" onclick="closeFilter()">取消</button>
                <button class="btn btn-primary" onclick="applyFilter()">确定</button>
            </div>
        </div>
    </div>

    </div>
</div>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    var currentStatus = 'all';
    var currentLevel = 'all';
    var currentDomain = 'all';
    var isMapMode = false;
    var chart = null;
    var statusName = { reported: '待处置', auditing: '审核中', dispatched: '已分派', handling: '处置中', accepting: '验收中', closed: '已闭环', rejected: '已驳回' };

    function getFilteredItems() {
        var filter = App.getQuery('filter');
        return DataStore.hiddenDangers.filter(function(h) {
            if (filter === 'reporter') return h.reporter.name === DataStore.user.name;
            if (currentStatus !== 'all') {
                if (currentStatus === 'reported' && ['reported','auditing'].indexOf(h.status) === -1) return false;
                if (currentStatus === 'handling' && ['dispatched','handling','accepting'].indexOf(h.status) === -1) return false;
                if (currentStatus === 'closed' && h.status !== 'closed') return false;
            }
            if (currentLevel !== 'all' && h.level !== currentLevel) return false;
            if (currentDomain !== 'all' && h.domain !== currentDomain) return false;
            return true;
        });
    }

    function renderList() {
        var container = document.getElementById('hdList');
        container.innerHTML = '';
        var items = getFilteredItems();

        if (items.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fa-regular fa-folder-open"></i><div class="empty-title">暂无隐患</div></div>';
            return;
        }

        items.forEach(function(h, idx) {
            var html = '<div class="hd-card tap anim d' + (idx % 5 + 1) + '" onclick="App.go(\'hidden-danger-detail.html?id=' + h.id + '\')">' +
                '<div class="hd-header">' +
                '<div class="hd-title">' + App.escapeHtml(h.title) + '</div>' +
                '<span class="risk-badge ' + h.level + '"><span class="risk-dot ' + h.level + '" style="margin-right:4px"></span> ' + levelName(h.level) + '</span>' +
                '</div>' +
                '<div class="hd-meta">' +
                '<span><i class="fa-solid fa-location-dot"></i> ' + App.escapeHtml(h.location.address) + '</span>' +
                (h.domain ? '<span class="hd-domain">' + domainLabel(h.domain) + '</span>' : '') +
                '<span><i class="fa-solid fa-building-user"></i> ' + App.escapeHtml(h.responsibleUnit || '待分配') + '</span>' +
                '</div>' +
                '<div class="hd-footer">' +
                '<div class="hd-time"><i class="fa-regular fa-clock"></i> ' + App.relativeTime(h.reportTime) + '</div>' +
                '<span class="status-tag ' + statusClass(h.status) + '" style="font-size: 11px">' + statusName[h.status] + '</span>' +
                '</div>' +
                '</div>';
            container.insertAdjacentHTML('beforeend', html);
        });
    }

    function normalizeCoord(lat, lng) {
        return [(lng - 121.4726) / 0.06 * 100, (30.9123 - lat) / 0.04 * 100];
    }

    function renderMap() {
        if (!chart) chart = echarts.init(document.getElementById('dangerMapChart'));
        var items = getFilteredItems();
        var data = items.map(function(h) {
            var lat = h.location.lat || (30.92 - Math.random() * 0.04);
            var lng = h.location.lng || (121.47 + Math.random() * 0.06);
            var c = normalizeCoord(lat, lng);
            return {
                value: [c[0], c[1]],
                item: h,
                itemStyle: { color: { red: '#ef4444', orange: '#f97316', yellow: '#eab308', blue: '#3b82f6' }[h.level] || '#3b82f6' }
            };
        });
        chart.setOption({
            grid: { left: 0, right: 0, top: 0, bottom: 0 },
            xAxis: { show: false, min: 0, max: 100 },
            yAxis: { show: false, min: 0, max: 100 },
            tooltip: { show: false },
            series: [{ type: 'scatter', symbolSize: 16, data: data }]
        }, true);
        chart.off('click');
        chart.on('click', function(params) {
            App.go('hidden-danger-detail.html?id=' + params.data.item.id);
        });
    }

    window.toggleMode = function() {
        isMapMode = !isMapMode;
        document.getElementById('modeBtn').innerHTML = isMapMode ? '<i class="fa-solid fa-list"></i>' : '<i class="fa-solid fa-map"></i>';
        document.getElementById('hdList').style.display = isMapMode ? 'none' : 'block';
        document.getElementById('mapView').classList.toggle('show', isMapMode);
        document.getElementById('statusFilter').style.display = isMapMode ? 'none' : 'flex';
        document.querySelector('.toolbar').style.display = isMapMode ? 'none' : 'flex';
        document.querySelector('.fab').style.display = isMapMode ? 'none' : 'flex';
        if (isMapMode) setTimeout(renderMap, 0);
    };

    document.querySelectorAll('#statusFilter .fr').forEach(function(f) {
        f.addEventListener('click', function() {
            document.querySelectorAll('#statusFilter .fr').forEach(function(x) { x.classList.remove('active'); });
            this.classList.add('active');
            currentStatus = this.dataset.status;
            renderList();
            if (isMapMode) renderMap();
        });
    });

    function bindOptions(groupId, key) {
        document.querySelectorAll('#' + groupId + ' .fs-option').forEach(function(opt) {
            opt.addEventListener('click', function() {
                document.querySelectorAll('#' + groupId + ' .fs-option').forEach(function(o) { o.classList.remove('active'); });
                this.classList.add('active');
                if (key === 'level') currentLevel = this.dataset.val;
                if (key === 'domain') currentDomain = this.dataset.val;
            });
        });
    }
    bindOptions('levelOptions', 'level');
    bindOptions('domainOptions', 'domain');

    window.openFilter = function() { document.getElementById('filterPanel').classList.add('show'); };
    window.closeFilter = function() { document.getElementById('filterPanel').classList.remove('show'); };
    window.applyFilter = function() {
        renderList();
        if (isMapMode) renderMap();
        closeFilter();
    };
    window.resetFilter = function() {
        currentStatus = 'all';
        currentLevel = 'all';
        currentDomain = 'all';
        document.querySelectorAll('#statusFilter .fr').forEach(function(f, i) { f.classList.toggle('active', i === 0); });
        document.querySelectorAll('.fs-options .fs-option').forEach(function(o) { o.classList.remove('active'); });
        document.querySelectorAll('.fs-options').forEach(function(group) { group.children[0].classList.add('active'); });
        renderList();
        if (isMapMode) renderMap();
    };

    // 点击遮罩关闭筛选面板
    document.getElementById('filterPanel').addEventListener('click', function(e) {
        if (e.target === this) closeFilter();
    });

    function levelName(level) {
        var map = { red: '红色', orange: '橙色', yellow: '黄色', blue: '蓝色' };
        return map[level] || level;
    }

    function domainLabel(domain) {
        var map = { build: '建筑工地', gas: '燃气安全', traffic: '交通安全', curtain: '玻璃幕墙', selfbuild: '自建房', rural: '农村自建房', urban: '城镇自建房' };
        return map[domain] || domain;
    }

    function statusClass(status) {
        if (['reported','auditing'].indexOf(status) !== -1) return 'pending';
        if (['dispatched','handling','accepting'].indexOf(status) !== -1) return 'handling';
        if (status === 'closed') return 'closed';
        return 'rejected';
    }

    renderList();
})();
</script>
</body>
</html>
