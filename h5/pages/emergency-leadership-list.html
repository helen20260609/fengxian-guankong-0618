<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>应急领导小组</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.page-hero .ph-sub { display: none; }

.content-sheet.page-body-sheet { margin-top: 0; padding-top: 18px; border-radius: 0; box-shadow: none; border: none; background: transparent; }
.content-sheet .search-bar { align-items: center; gap: 10px; margin-top: 4px; background: transparent; box-shadow: none; border: none; padding: 0; }
.content-sheet .search-input-wrapper { display: flex; align-items: center; background: var(--card); border-radius: var(--radius); box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); min-height: 40px; }
.content-sheet .search-input-wrapper input { background: transparent; border-color: transparent; height: 40px; padding-top: 0; padding-bottom: 0; }
.content-sheet .filter-trigger {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 40px;
    padding: 0 14px;
    background: var(--card);
    color: var(--text2);
    font-size: 13px;
    font-weight: 400;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 2px 8px var(--shadow);
    cursor: pointer;
    position: relative;
    transition: all .15s;
}
.content-sheet .filter-trigger.active { color: var(--primary); border-color: var(--primary); background: rgba(var(--primary-rgb),.08); }
.content-sheet .filter-trigger:active { transform: scale(.96); }
.content-sheet .filter-trigger .badge-dot {
    position: absolute;
    top: -3px;
    right: -3px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
    border: 1.5px solid var(--card);
    display: none;
}
.content-sheet .filter-trigger .badge-num {
    position: absolute;
    top: -6px;
    right: -6px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 8px;
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--card);
    box-sizing: border-box;
}

.search-input-wrapper .clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--text2);
    color: #fff;
    font-size: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    padding: 0;
}

.selected-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.tag { background: rgba(var(--primary-rgb),.08); color: var(--primary); border: 1px solid rgba(var(--primary-rgb),.18); border-radius: 999px; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.tag i { cursor: pointer; font-size: 10px; }

.leader-card { cursor: pointer; transition: transform .12s; background: #fff; border-radius: 12px; box-shadow: 0 2px 10px var(--shadow); border: 1px solid var(--border); margin-bottom: 12px; overflow: hidden; display: flex; align-items: stretch; }
.leader-card:active { transform: scale(.99); }

.leader-main {
    flex: 1;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}
.leader-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
    background: linear-gradient(135deg, #1a73e8, #3b82f6);
}
.leader-info { flex: 1; min-width: 0; }
.leader-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.leader-name { font-size: 17px; font-weight: 600; color: #151515; line-height: 1.35; }
.leader-post {
    font-size: 12px;
    font-weight: 500;
    color: #fff;
    background: #0052D9;
    border-radius: 4px;
    padding: 2px 6px;
    flex-shrink: 0;
}
.leader-position { font-size: 14px; color: #595959; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leader-phone { font-size: 15px; color: #1F1F1F; margin-top: 6px; }

.leader-call-zone {
    width: 33%;
    min-width: 80px;
    max-width: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    cursor: pointer;
    flex-shrink: 0;
}
.leader-call-zone:active .leader-call-btn { transform: scale(.92); }
.leader-call-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #E6FFED;
    color: #28C76F;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    transition: transform .12s;
}

.loading { text-align: center; padding: 16px; color: var(--text2); font-size: 13px; }
.loading i { margin-right: 6px; }

.filter-section { margin-bottom: 18px; }
.filter-section .filter-title { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
.filter-section .filter-options { display: flex; flex-wrap: wrap; gap: 10px; }
.filter-chip { padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-primary); cursor: pointer; transition: all .15s; }
.filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.sheet-footer { display: flex; gap: 12px; padding-top: 16px; border-top: 1px solid var(--border); }
.sheet-footer .btn { flex: 1; height: 44px; border-radius: 10px; }

.modal-sheet {
    display: block !important;
    opacity: 0;
    pointer-events: none;
    transform: translateY(100%);
    transition: transform .25s ease, opacity .25s ease;
    z-index: 1001;
}
.modal-sheet.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.modal-mask { display: none; opacity: 0; transition: opacity .25s ease; z-index: 1000; }
.modal-mask.show { display: block; opacity: 1; }

.bottom-spacer { height: 20px; }

:root[data-theme="dark"] .tag { background: rgba(var(--primary-rgb),.15); border-color: rgba(var(--primary-rgb),.3); }
:root[data-theme="dark"] .content-sheet .search-input-wrapper input { background: var(--input-bg); }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title">应急领导小组</div>
        </div>

        <div class="content-sheet page-body-sheet">
            <div class="search-bar">
                <div class="search-input-wrapper" style="flex:1">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="搜索姓名、行政职务、电话等" autocomplete="off">
                    <button class="clear-btn" id="clearSearch" onclick="clearSearch(event)"><i class="fa-solid fa-times"></i></button>
                </div>
                <div class="filter-trigger" id="filterTrigger" onclick="openDrawer()">
                    <i class="fa-solid fa-filter"></i> 筛选
                    <span class="badge-dot" id="filterDot"></span>
                    <span class="badge-num" id="filterBadge" style="display:none">0</span>
                </div>
            </div>

            <div class="selected-tags" id="selectedTags"></div>

            <div class="section-v2" id="listSection" style="background:transparent;box-shadow:none;border:none;padding:0;margin:0">
                <div class="sv2-head" style="margin-bottom:12px">
                    <div class="sv2-title" style="padding-left:0">
                        <i class="fa-solid fa-users" style="color:var(--primary);margin-right:6px"></i>成员名单
                    </div>
                    <div class="sv2-more" id="totalCount">共 0 名成员</div>
                </div>
                <div class="card-list" id="cardList"></div>
                <div class="loading" id="loading" style="display:none"><i class="fa-solid fa-circle-notch fa-spin"></i> 加载中…</div>
                <div class="empty-state" id="empty" style="display:none">
                    <i class="fa-regular fa-folder-open"></i>
                    <div class="empty-title">暂无符合条件的成员</div>
                    <div class="empty-desc">请调整筛选或搜索条件</div>
                </div>
                <div class="bottom-spacer"></div>
            </div>
        </div>

        <!-- 筛选抽屉 -->
        <div class="modal-mask" id="drawerOverlay" onclick="closeDrawer()"></div>
        <div class="modal-sheet" id="drawer">
            <div class="sheet-header">
                <div class="sheet-title">筛选条件</div>
                <div class="sheet-close" onclick="closeDrawer()"><i class="fa-solid fa-times"></i></div>
            </div>
            <div id="drawerBody"></div>
            <div class="sheet-footer">
                <button class="btn btn-outline" onclick="resetFilters()">重置</button>
                <button class="btn btn-primary" onclick="confirmFilters()">确定</button>
            </div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/emergency-leadership-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    var floodPostOptions = ['全部职务', '组长', '常务副组长', '副组长', '成员'];
    var reportUnitOptions = ['全部单位', '区防汛指挥部', '区应急管理局', '区水务局', '区建管委', '区交通中心'];

    var filterConfig = [
        { key: 'floodPost', title: '防汛职务', options: floodPostOptions },
        { key: 'reportUnit', title: '填报单位', options: reportUnitOptions }
    ];

    var selectedFilters = {};
    var currentPage = 1;
    var pageSize = 10;
    var isLoading = false;
    var hasMore = true;

    var embeddedData = window.EMERGENCY_LEADERSHIP_DATA || [];

    function saveToStorage() {
        try { localStorage.setItem('emergencyLeadershipData', JSON.stringify(embeddedData)); } catch (e) {}
    }

    function getInitialData() {
        try {
            var saved = localStorage.getItem('emergencyLeadershipData');
            if (saved) return JSON.parse(saved);
        } catch (e) {}
        saveToStorage();
        return embeddedData;
    }

    var allData = getInitialData();

    function getFloodPostLevel(post) {
        if (post === '组长') return 1;
        if (post === '常务副组长') return 2;
        if (post === '副组长') return 3;
        return 4;
    }

    function getFirstChar(name) {
        return name ? name.charAt(0) : '?';
    }

    function getFilteredData() {
        var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        return allData.filter(function(item) {
            if (keyword) {
                var hay = (item.name + ' ' + item.position + ' ' + item.floodPost + ' ' + item.officePhone + ' ' + item.mobilePhone + ' ' + item.reportUnit).toLowerCase();
                if (hay.indexOf(keyword) === -1) return false;
            }
            for (var k in selectedFilters) {
                var val = selectedFilters[k];
                if (!val || val.indexOf('全部') === 0) continue;
                if (k === 'reportUnit' && item.reportUnit !== val) return false;
                if (k === 'floodPost' && item.floodPost !== val) return false;
            }
            return true;
        });
    }

    function renderTags() {
        var container = document.getElementById('selectedTags');
        var tags = [];
        for (var k in selectedFilters) {
            var val = selectedFilters[k];
            if (!val || val.indexOf('全部') === 0) continue;
            var title = filterConfig.find(function(c) { return c.key === k; }).title;
            tags.push({ key: k, label: title + '：' + val });
        }
        container.innerHTML = tags.map(function(t) {
            return '<div class="tag">' + App.escapeHtml(t.label) + '<i class="fa-solid fa-times" onclick="removeFilter(\'' + t.key + '\')"></i></div>';
        }).join('');
    }

    window.removeFilter = function(key) {
        delete selectedFilters[key];
        renderTags();
        renderFilterDot();
        refresh();
    };

    function renderFilterDot() {
        var activeCount = 0;
        for (var k in selectedFilters) {
            var val = selectedFilters[k];
            if (val && val.indexOf('全部') !== 0) activeCount++;
        }
        var badge = document.getElementById('filterBadge');
        var dot = document.getElementById('filterDot');
        var trigger = document.getElementById('filterTrigger');
        if (activeCount > 0) {
            badge.textContent = activeCount;
            badge.style.display = 'inline-flex';
            dot.style.display = 'none';
            trigger.classList.add('active');
        } else {
            badge.style.display = 'none';
            dot.style.display = 'none';
            trigger.classList.remove('active');
        }
    }

    function renderCard(item) {
        var firstChar = getFirstChar(item.name);
        return '<div class="leader-card" data-id="' + App.escapeHtml(item.id) + '">' +
            '<div class="leader-main" onclick="App.go(\'emergency-leadership-detail.html?id=' + encodeURIComponent(item.id) + '\')">' +
                '<div class="leader-avatar">' + App.escapeHtml(firstChar) + '</div>' +
                '<div class="leader-info">' +
                    '<div class="leader-name-row">' +
                        '<div class="leader-name">' + App.escapeHtml(item.name) + '</div>' +
                        '<div class="leader-post">' + App.escapeHtml(item.floodPost) + '</div>' +
                    '</div>' +
                    '<div class="leader-position">' + App.escapeHtml(item.position) + '</div>' +
                    '<div class="leader-phone">' + App.escapeHtml(item.mobilePhone) + '</div>' +
                '</div>' +
            '</div>' +
            '<div class="leader-call-zone" onclick="event.stopPropagation();window.location.href=\'tel:' + App.escapeHtml(item.mobilePhone) + '\'">' +
                '<div class="leader-call-btn"><i class="fa-solid fa-phone"></i></div>' +
            '</div>' +
        '</div>';
    }

    function renderList() {
        var data = getFilteredData();
        var container = document.getElementById('cardList');
        var empty = document.getElementById('empty');
        document.getElementById('totalCount').textContent = '共 ' + data.length + ' 名成员';
        if (data.length === 0) {
            container.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';
        container.innerHTML = data.map(renderCard).join('');
    }

    function refresh() {
        currentPage = 1;
        hasMore = true;
        renderList();
    }

    function initSearch() {
        var input = document.getElementById('searchInput');
        var clearBtn = document.getElementById('clearSearch');
        input.addEventListener('input', function() {
            clearBtn.style.display = input.value ? 'flex' : 'none';
            refresh();
        });
        input.addEventListener('focus', function() { clearBtn.style.display = input.value ? 'flex' : 'none'; });
    }

    window.clearSearch = function(e) {
        if (e) e.stopPropagation();
        document.getElementById('searchInput').value = '';
        document.getElementById('clearSearch').style.display = 'none';
        refresh();
    };

    function renderDrawer() {
        var body = document.getElementById('drawerBody');
        body.innerHTML = filterConfig.map(function(fc) {
            var html = '<div class="filter-section">' +
                '<div class="filter-title">' + App.escapeHtml(fc.title) + '</div>' +
                '<div class="filter-options">';
            html += fc.options.map(function(opt) {
                var active = selectedFilters[fc.key] === opt;
                if (!selectedFilters[fc.key] && opt.indexOf('全部') === 0) active = true;
                return '<div class="filter-chip ' + (active ? 'active' : '') + '" onclick="selectFilter(\'' + fc.key + '\', \'' + opt + '\')">' + App.escapeHtml(opt) + '</div>';
            }).join('');
            html += '</div></div>';
            return html;
        }).join('');
    }

    window.selectFilter = function(key, val) {
        selectedFilters[key] = val;
        renderDrawer();
    };

    window.openDrawer = function() {
        renderDrawer();
        document.getElementById('drawerOverlay').classList.add('show');
        document.getElementById('drawer').classList.add('show');
    };

    window.closeDrawer = function() {
        document.getElementById('drawerOverlay').classList.remove('show');
        document.getElementById('drawer').classList.remove('show');
    };

    window.confirmFilters = function() {
        renderTags();
        renderFilterDot();
        closeDrawer();
        refresh();
    };

    window.resetFilters = function() {
        selectedFilters = {};
        renderDrawer();
    };

    function init() {
        initSearch();
        renderList();
        renderFilterDot();

        var now = new Date();
        document.getElementById('statusTime').textContent =
            String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    init();
})();
</script>
</body>
</html>
