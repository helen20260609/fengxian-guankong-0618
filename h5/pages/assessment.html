<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>评估分析</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
.score-card { background: var(--card); border-radius: 10px; margin: 14px; padding: 20px; box-shadow: 0 2px 10px var(--shadow); border: 1px solid var(--border); text-align: center; }
.score-card .sc-num { font-size: 50px; font-weight: 800; color: var(--primary); line-height: 1; }
.score-card .sc-label { font-size: 13px; color: var(--text2); margin-top: 8px; }
.score-card .sc-level { display: inline-block; margin-top: 10px; padding: 3px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; background: rgba(var(--success-rgb),.14); color: var(--success); }

.dimension-list { padding: 0 14px; }
.dim-item { background: var(--card); border-radius: 8px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); }
.dim-item .di-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
.dim-item .di-bar { height: 8px; background: var(--bg-hover); border-radius: 4px; overflow: hidden; }
.dim-item .di-fill { height: 100%; border-radius: 4px; }

.event-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 14px; }
.event-card { background: var(--card); border-radius: 8px; padding: 14px; box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); }
.event-card .ec-num { font-size: 22px; font-weight: 800; }
.event-card .ec-label { font-size: 11px; color: var(--text2); margin-top: 4px; }

.chart-placeholder { height: 160px; background: var(--card); border-radius: 10px; margin: 14px; display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 12px; border: 1px solid var(--border); }

.section-title { font-size: 14px; font-weight: 700; margin: 20px 14px 12px; }
</style>
</head>
<body>
<div class="phone-frame">
    <!-- 侧边按钮 -->
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <!-- 状态栏 -->
    <div class="status-bar">
        <span class="sb-time" id="statusTime">9:41</span>
        <span class="sb-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
            <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
        </span>
    </div>

    <div class="nav-bar">
        <div class="nav-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
        <div class="nav-title">评估分析</div>
        <div class="nav-action"></div>
    </div>

    <div class="score-card anim d1">
        <div class="sc-num" id="totalScore">--</div>
        <div class="sc-label">综合评估得分</div>
        <div class="sc-level" id="scoreLevel">--</div>
    </div>

    <div class="section-title">维度得分</div>
    <div class="dimension-list anim d2" id="dimensionList">
        <!-- 动态填充 -->
    </div>

    <div class="section-title">事件统计</div>
    <div class="event-cards anim d3">
        <div class="event-card">
            <div class="ec-num" id="eventTotal">--</div>
            <div class="ec-label">事件总数</div>
        </div>
        <div class="event-card">
            <div class="ec-num" id="eventDisposed">--</div>
            <div class="ec-label">已处置</div>
        </div>
        <div class="event-card">
            <div class="ec-num" id="onTimeRate">--</div>
            <div class="ec-label">按时处置率</div>
        </div>
        <div class="event-card">
            <div class="ec-num" id="recurrenceRate">--</div>
            <div class="ec-label">复发率</div>
        </div>
    </div>

    <div class="section-title">效率评估</div>
    <div class="chart-card anim d4" style="background:var(--card);border-radius: 10px;margin:0 14px 14px;padding:14px;box-shadow:0 2px 8px var(--shadow);border:1px solid var(--border)">
        <div style="font-size: 13px;font-weight:700;margin-bottom:10px">各部门处置效率对比</div>
        <div id="deptEffChart" style="width:100%;height:180px"></div>
    </div>

    <div class="chart-card anim d5" style="background:var(--card);border-radius: 10px;margin:0 14px 14px;padding:14px;box-shadow:0 2px 8px var(--shadow);border:1px solid var(--border)">
        <div style="font-size: 13px;font-weight:700;margin-bottom:10px">处置效率趋势</div>
        <div id="effTrendChart" style="width:100%;height:180px"></div>
    </div>

    <div class="section-title">效率指标</div>
    <div class="event-cards anim d5" style="padding-bottom:20px">
        <div class="event-card">
            <div class="ec-num" id="avgTime">--</div>
            <div class="ec-label">平均处置时长（小时）</div>
        </div>
        <div class="event-card">
            <div class="ec-num" id="passRate">--</div>
            <div class="ec-label">整改合格率</div>
        </div>
        <div class="event-card">
            <div class="ec-num" id="coverage">--</div>
            <div class="ec-label">巡查覆盖率</div>
        </div>
        <div class="event-card">
            <div class="ec-num">87</div>
            <div class="ec-label">综合评分</div>
        </div>
    </div>

    </div>
</div>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    var a = DataStore.assessment;
    document.getElementById('totalScore').textContent = a.score;
    document.getElementById('scoreLevel').textContent = a.level;

    var colors = ['var(--primary)', 'var(--secondary)', 'var(--warning)', 'var(--success)'];
    var container = document.getElementById('dimensionList');
    Object.keys(a.dimensions).forEach(function(key, idx) {
        var d = a.dimensions[key];
        var html = '<div class="dim-item">' +
            '<div class="di-top"><span>' + d.label + '</span><span style="font-weight:700">' + d.score + '</span></div>' +
            '<div class="di-bar"><div class="di-fill" style="width:' + d.score + '%;background:' + colors[idx % colors.length] + '"></div></div>' +
            '</div>';
        container.insertAdjacentHTML('beforeend', html);
    });

    document.getElementById('eventTotal').textContent = a.events.total;
    document.getElementById('eventDisposed').textContent = a.events.disposed;
    document.getElementById('onTimeRate').textContent = a.events.onTimeRate + '%';
    document.getElementById('recurrenceRate').textContent = a.events.recurrenceRate + '%';

    document.getElementById('avgTime').textContent = a.efficiency.avgTime;
    document.getElementById('passRate').textContent = a.efficiency.passRate + '%';
    document.getElementById('coverage').textContent = a.efficiency.coverage + '%';

    // 各部门处置效率对比
    var deptEffChart = echarts.init(document.getElementById('deptEffChart'));
    deptEffChart.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: 10, right: 20, top: 10, bottom: 20, containLabel: true },
        xAxis: { type: 'value', max: 100, show: false },
        yAxis: { type: 'category', data: ['区应急局', '交警支队', '燃气公司', '施工单位', '物业'], axisLine: { show: false }, axisTick: { show: false } },
        series: [{
            type: 'bar',
            data: [96, 92, 88, 85, 82],
            itemStyle: { borderRadius: [0, 8, 8, 0], color: '#3b82f6' },
            label: { show: true, position: 'right', fontSize: 11 }
        }]
    });

    // 处置效率趋势
    var effTrendChart = echarts.init(document.getElementById('effTrendChart'));
    effTrendChart.setOption({
        tooltip: { trigger: 'axis' },
        grid: { left: 10, right: 10, top: 20, bottom: 20, containLabel: true },
        xAxis: { type: 'category', data: ['1月','2月','3月','4月','5月','6月'], axisLine: { lineStyle: { color: '#ccc' } } },
        yAxis: { type: 'value', max: 100, splitLine: { lineStyle: { color: '#eee' } } },
        series: [{
            type: 'line',
            smooth: true,
            data: [82, 84, 85, 86, 87, 87],
            itemStyle: { color: '#22c55e' },
            areaStyle: { color: 'rgba(34,197,94,.15)' }
        }]
    });
})();
</script>
</body>
</html>
