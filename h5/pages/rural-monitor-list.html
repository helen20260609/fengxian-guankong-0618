<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>农村自建房监测</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/tokens.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/h5-frame.css">
    <style>
        .page-body { padding: 0; padding-bottom: calc(var(--space) + var(--safe-bottom)); }

        .knowledge-hero {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #1d4ed8 100%);
            margin-top: -34px;
            padding: calc(34px + 4px) 18px 12px;
            color: #fff;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 85px;
        }
        .knowledge-hero::before {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            right: -50px;
            top: -20px;
            background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%);
            border-radius: 50%;
        }
        .knowledge-hero .kh-back {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            font-size: 17px; position: relative; z-index: 2; flex-shrink: 0; cursor: pointer;
        }
        .knowledge-hero .hero-title { flex: 1; position: relative; z-index: 2; text-align: center; padding-right: 32px; }
        .knowledge-hero h1 { font-size: 17px; font-weight: 600; }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: var(--space-sm) var(--space);
        }
        .kpi-item {
            background: var(--bg-card); border-radius: var(--radius); padding: 10px 0;
            text-align: center; box-shadow: 0 2px 6px var(--shadow); display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .kpi-value { font-size: 18px; font-weight: 700; }
        .kpi-value.red { color: var(--danger); }
        .kpi-value.orange { color: var(--warning); }
        .kpi-value.green { color: var(--success); }
        .kpi-label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

        .quick-filter-bar {
            display: flex; gap: 8px; padding: 0 var(--space) var(--space-sm); overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .quick-filter-bar::-webkit-scrollbar { display: none; }
        .quick-filter { flex-shrink: 0; padding: 6px 14px; border-radius: 999px; font-size: var(--font-sm); border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); transition: all 0.2s; }
        .quick-filter.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .monitor-list { padding: 0 var(--space) var(--space); display: flex; flex-direction: column; gap: var(--space-sm); }

        .monitor-card {
            background: var(--bg-card); border-radius: var(--radius-lg); padding: var(--space);
            box-shadow: 0 2px 8px var(--shadow); display: flex; flex-direction: column; gap: 10px;
            border: 1px solid var(--border); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        .monitor-card:active { transform: scale(0.99); box-shadow: 0 1px 4px var(--shadow); }
        .monitor-card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .monitor-title-group { display: flex; align-items: center; gap: 8px; }
        .monitor-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .monitor-icon.blue { background: rgba(59, 130, 246, 0.12); color: #3b82f6; }
        .monitor-info { display: flex; flex-direction: column; }
        .monitor-name { font-size: var(--font-base); font-weight: 600; color: var(--text-primary); }
        .monitor-id { font-size: 11px; color: var(--text-secondary); }
        .monitor-status { display: flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .monitor-status.red { background: rgba(239, 68, 68, 0.12); color: var(--danger); }
        .monitor-status.orange { background: rgba(245, 158, 11, 0.12); color: var(--warning); }
        .monitor-status.green { background: rgba(34, 197, 94, 0.12); color: var(--success); }
        .monitor-body { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
        .monitor-item { display: flex; flex-direction: column; gap: 2px; }
        .monitor-item-label { font-size: 11px; color: var(--text-secondary); }
        .monitor-item-value { font-size: var(--font-base); color: var(--text-primary); font-weight: 500; }
        .monitor-item-value.red { color: var(--danger); font-weight: 700; }
        .monitor-item-value.orange { color: var(--warning); font-weight: 700; }
        .monitor-item-value.green { color: var(--success); font-weight: 700; }
        .monitor-footer { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        .monitor-footer i { color: var(--primary); }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="side-button side-button-left mute"></div>
        <div class="side-button side-button-left volume-up"></div>
        <div class="side-button side-button-left volume-down"></div>
        <div class="side-button side-button-right power"></div>
        <div class="phone-shell">
            <div class="status-bar light">
                <span class="sb-time" id="statusTime">9:41</span>
                <span class="sb-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                    <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
                </span>
            </div>

            <div class="knowledge-hero">
                <div class="kh-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
                <div class="hero-title"><h1>农村自建房监测</h1></div>
            </div>

            <div class="page-body">
                <div class="kpi-grid" id="kpiGrid">
                    <div class="kpi-item"><div class="kpi-value" id="totalCount">0</div><div class="kpi-label">总监测数</div></div>
                    <div class="kpi-item"><div class="kpi-value red" id="alarmCount">0</div><div class="kpi-label">报警</div></div>
                    <div class="kpi-item"><div class="kpi-value orange" id="warningCount">0</div><div class="kpi-label">预警</div></div>
                    <div class="kpi-item"><div class="kpi-value green" id="normalCount">0</div><div class="kpi-label">正常</div></div>
                </div>

                <div class="quick-filter-bar" id="quickFilterBar">
                    <div class="quick-filter active" data-filter="all" onclick="setFilter(this)">全部</div>
                    <div class="quick-filter" data-filter="alarm" onclick="setFilter(this)">报警</div>
                    <div class="quick-filter" data-filter="warning" onclick="setFilter(this)">预警</div>
                    <div class="quick-filter" data-filter="normal" onclick="setFilter(this)">正常</div>
                </div>

                <div class="monitor-list" id="monitorList"></div>
            </div>
        </div>
    </div>

<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
const ruralHouseList = [
    { id: 'RHC-001', name: '青村镇李老汉住宅', location: '奉贤区青村镇青村中路 128 号', value: '4.5', unit: '‰', status: 'red', time: '2025-06-26 14:28:33', indicator: '倾斜率' },
    { id: 'RHC-002', name: '南桥镇王家宅院', location: '奉贤区南桥镇南桥路 88 号', value: '2.1', unit: '‰', status: 'green', time: '2025-06-26 13:15:22', indicator: '倾斜率' },
    { id: 'RHC-003', name: '奉浦街道张大姐楼房', location: '奉贤区奉浦街道韩村路 56 号', value: '3.7', unit: '‰', status: 'yellow', time: '2025-06-26 10:18:45', indicator: '倾斜率' },
    { id: 'RHC-004', name: '金汇镇老周私房', location: '奉贤区金汇镇金汇路 202 号', value: '6.2', unit: '‰', status: 'red', time: '2025-06-26 09:12:07', indicator: '倾斜率' },
    { id: 'RHC-005', name: '柘林镇孙家老宅', location: '奉贤区柘林镇柘林路 33 号', value: '2.8', unit: '‰', status: 'green', time: '2025-06-26 11:42:30', indicator: '倾斜率' },
    { id: 'RHC-006', name: '四团镇赵家小楼', location: '奉贤区四团镇四团路 77 号', value: '3.4', unit: '‰', status: 'orange', time: '2025-06-26 12:25:52', indicator: '倾斜率' }
];

const statusMap = {
    red:    { label: '报警', cls: 'red', icon: 'fa-circle-exclamation' },
    orange: { label: '预警', cls: 'orange', icon: 'fa-triangle-exclamation' },
    yellow: { label: '预警', cls: 'orange', icon: 'fa-triangle-exclamation' },
    green:  { label: '正常', cls: 'green', icon: 'fa-circle-check' }
};

var currentFilter = 'all';

function renderKPI() {
    var total = ruralHouseList.length;
    var alarm = ruralHouseList.filter(function(h) { return h.status === 'red'; }).length;
    var warning = ruralHouseList.filter(function(h) { return h.status === 'orange' || h.status === 'yellow'; }).length;
    var normal = ruralHouseList.filter(function(h) { return h.status === 'green'; }).length;

    document.getElementById('totalCount').textContent = total;
    document.getElementById('alarmCount').textContent = alarm;
    document.getElementById('warningCount').textContent = warning;
    document.getElementById('normalCount').textContent = normal;
}

function renderList() {
    var listEl = document.getElementById('monitorList');
    var filtered = currentFilter === 'all'
        ? ruralHouseList
        : ruralHouseList.filter(function(h) {
            if (currentFilter === 'alarm') return h.status === 'red';
            if (currentFilter === 'warning') return h.status === 'orange' || h.status === 'yellow';
            if (currentFilter === 'normal') return h.status === 'green';
            return true;
        });

    if (!filtered.length) {
        listEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-secondary)">暂无数据</div>';
        return;
    }

    listEl.innerHTML = filtered.map(function(h) {
        var s = statusMap[h.status] || statusMap.green;
        return '<div class="monitor-card" onclick="goToDetail(\'' + h.id + '\')">' +
            '<div class="monitor-card-header">' +
            '<div class="monitor-title-group">' +
            '<div class="monitor-icon blue"><i class="fa-solid fa-house-user"></i></div>' +
            '<div class="monitor-info">' +
            '<div class="monitor-name">' + App.escapeHtml(h.name) + '</div>' +
            '<div class="monitor-id">' + App.escapeHtml(h.id) + '</div>' +
            '</div></div>' +
            '<div class="monitor-status ' + s.cls + '"><i class="fa-solid ' + s.icon + '"></i> ' + s.label + '</div>' +
            '</div>' +
            '<div class="monitor-body">' +
            '<div class="monitor-item"><div class="monitor-item-label">当前' + App.escapeHtml(h.indicator) + '</div><div class="monitor-item-value ' + s.cls + '">' + App.escapeHtml(h.value) + '<span style="font-size:12px;font-weight:400;margin-left:2px">' + App.escapeHtml(h.unit) + '</span></div></div>' +
            '<div class="monitor-item"><div class="monitor-item-label">数据更新时间</div><div class="monitor-item-value">' + App.escapeHtml(h.time) + '</div></div>' +
            '</div>' +
            '<div class="monitor-footer"><i class="fa-solid fa-location-dot"></i> ' + App.escapeHtml(h.location) + '</div>' +
            '</div>';
    }).join('');
}

function setFilter(el) {
    document.querySelectorAll('.quick-filter').forEach(function(f) { f.classList.remove('active'); });
    el.classList.add('active');
    currentFilter = el.getAttribute('data-filter');
    renderList();
}

function goToDetail(id) {
    App.go('rural-monitor-detail.html?id=' + encodeURIComponent(id));
}

renderKPI();
renderList();
</script>
</body>
</html>
