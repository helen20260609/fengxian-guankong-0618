<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>人员转移安置</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>

.phone-shell { display: flex; flex-direction: column; overflow: hidden; position: relative; }
.content-sheet.page-body-sheet { flex: 1; overflow-y: auto; overflow-x: hidden; margin-top: 0; padding-top: 18px; border-radius: 0; box-shadow: none; border: none; background: transparent; scrollbar-width: none; -ms-overflow-style: none; }
.content-sheet.page-body-sheet::-webkit-scrollbar { display: none; }
.content-sheet .search-bar { align-items: center; gap: 10px; margin-top: 4px; background: transparent; box-shadow: none; border: none; padding: 0; }
.content-sheet .search-input-wrapper { display: flex; align-items: center; background: var(--card); border-radius: var(--radius); box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); min-height: 40px; position: relative; }
.content-sheet .search-input-wrapper input { background: transparent; border-color: transparent; height: 40px; padding-top: 0; padding-bottom: 0; flex: 1; width: 100%; min-width: 0; padding-right: 30px; }
.content-sheet .filter-trigger {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 40px;
    padding: 0 14px;
    background: var(--card);
    color: var(--text2);
    font-size: 13px;
    font-weight: 400;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 2px 8px var(--shadow);
    cursor: pointer;
    position: relative;
    transition: all .15s;
}
.content-sheet .filter-trigger:active { transform: scale(.96); }
.content-sheet .filter-trigger .badge-dot {
    position: absolute;
    top: -3px;
    right: -3px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
    border: 1.5px solid var(--card);
    display: none;
}

.search-input-wrapper .clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--text2);
    color: #fff;
    font-size: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    padding: 0;
}

.selected-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.tag { background: rgba(var(--primary-rgb),.08); color: var(--primary); border: 1px solid rgba(var(--primary-rgb),.18); border-radius: 999px; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.tag i { cursor: pointer; font-size: 10px; }

.kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.kpi-card { background: var(--card); border-radius: 12px; padding: 14px 10px; text-align: center; box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); display: none; }
.kpi-value { font-size: 22px; font-weight: 800; color: var(--primary); line-height: 1; }
.kpi-label { font-size: 12px; color: var(--text2); margin-top: 6px; }

.transfer-card { background: var(--card); border-radius: 12px; box-shadow: 0 2px 10px var(--shadow); border: 1px solid var(--border); padding: 12px; margin-bottom: 10px; cursor: pointer; transition: transform .12s; }
.transfer-card:active { transform: scale(.99); }

.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card-title { font-size: 15px; font-weight: 600; color: var(--text-primary); line-height: 1.4; flex: 1; }
.people-badge { display: inline-flex; align-items: center; gap: 4px; background: #fff6ed; color: #e65100; border: 1px solid #ffe2c6; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.people-badge i { font-size: 11px; }

.tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.badge {
    font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 6px; white-space: nowrap;
}
.tag-region { background: #e8f2fe; color: #1a73e8; }
.tag-reason { background: #fff2ef; color: #d93025; }

.flow-row { display: none; }

.pt-line { margin-top: 12px; }
.pt-line:first-of-type { margin-top: 10px; }
.pt-header { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-primary); font-weight: 600; }
.pt-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pt-dot.red { background: #d93025; box-shadow: 0 0 0 3px rgba(217,48,37,.12); }
.pt-dot.green { background: #1e8e3e; box-shadow: 0 0 0 3px rgba(30,142,62,.12); }
.pt-addr { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); margin-top: 6px; padding-left: 16px; }
.pt-addr i { font-size: 12px; flex-shrink: 0; }
.pt-contact { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; padding-left: 16px; }
.pt-contact-info { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pt-contact-info i { font-size: 12px; flex-shrink: 0; }
.pt-call-btn {
    background: transparent; color: #1e8e3e; border: 1px solid rgba(30,142,62,.4);
    border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 4px; text-decoration: none; flex-shrink: 0;
}
.pt-call-btn i { font-size: 11px; }

.contact-row { display: none; }
.call-btn { display: none; }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
.empty-state i { font-size: 48px; margin-bottom: 12px; opacity: .5; }
.empty-state .empty-title { font-size: 15px; color: var(--text-primary); margin-bottom: 6px; }
.empty-state .empty-desc { font-size: 13px; }

.bottom-spacer { height: 20px; }

.modal-sheet {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    max-height: 80%;
    display: flex !important;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transform: translateY(100%);
    transition: transform .25s ease, opacity .25s ease;
    z-index: 1001;
    background: var(--card);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    scrollbar-width: none; -ms-overflow-style: none;
}
.modal-sheet::-webkit-scrollbar { display: none; }
.modal-sheet.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.modal-mask { display: none; opacity: 0; transition: opacity .25s ease; z-index: 1000; }
.modal-mask.show { display: block; opacity: 1; }
.sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sheet-title { font-size: 16px; font-weight: 700; }
.sheet-close { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--text2); cursor: pointer; }
.sheet-body { padding: 16px; flex: 1; overflow-y: auto; min-height: 0; scrollbar-width: none; -ms-overflow-style: none; }
.sheet-body::-webkit-scrollbar { display: none; }
.filter-section { margin-bottom: 18px; }
.filter-section .filter-title { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
.filter-section .filter-options { display: flex; flex-wrap: wrap; gap: 10px; }
.filter-chip { padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-primary); cursor: pointer; transition: all .15s; }
.filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.sheet-footer { display: flex; gap: 12px; padding: 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
.sheet-footer .btn { flex: 1; height: 44px; border-radius: 10px; }

:root[data-theme="dark"] .tag { background: rgba(var(--primary-rgb),.15); border-color: rgba(var(--primary-rgb),.3); }
:root[data-theme="dark"] .content-sheet .search-input-wrapper input { background: var(--input-bg); }
:root[data-theme="dark"] .kpi-card { background: var(--bg-card); border-color: var(--border); }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="top-sticky">
            <div class="status-bar light">
                <span class="sb-time" id="statusTime">9:41</span>
                <span class="sb-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                    <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
                </span>
            </div>
            <div class="page-hero">
                <div class="ph-back" onclick="App.back()">
                    <i class="fa-solid fa-chevron-left"></i>
                </div>
                <div class="ph-title">人员转移安置</div>
            </div>
        </div>

        <div class="content-sheet page-body-sheet">
            <div class="search-bar">
                <div class="search-input-wrapper" style="flex:1">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="搜索撤离单位/撤离点/安置点/联系人" autocomplete="off">
                    <button class="clear-btn" id="clearSearch" onclick="clearSearch(event)"><i class="fa-solid fa-times"></i></button>
                </div>
                <div class="filter-trigger" id="filterTrigger" onclick="openDrawer()">
                    <i class="fa-solid fa-filter"></i> 筛选
                    <span class="badge-dot" id="filterDot"></span>
                </div>
            </div>

            <div class="selected-tags" id="selectedTags"></div>

            <div class="section-v2" id="listSection">
                <div class="sv2-head">
                    <div class="sv2-title">
                        <i class="fa-solid fa-people-roof" style="color:var(--primary);margin-right:6px"></i>
                        人员转移安置
                    </div>
                    <div class="sv2-more" id="totalCount">共 0 条</div>
                </div>
                <div class="card-list" id="cardList"></div>
                <div class="loading" id="loading" style="display:none">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> 加载中…
                </div>
                <div class="empty-state" id="empty" style="display:none">
                    <i class="fa-regular fa-folder-open"></i>
                    <div class="empty-title">暂无符合条件的人员转移安置信息</div>
                    <div class="empty-desc">请调整筛选或搜索条件</div>
                </div>
                <div class="bottom-spacer"></div>
            </div>
        </div>

        <div class="modal-mask" id="drawerOverlay" onclick="closeDrawer()"></div>
        <div class="modal-sheet" id="drawer">
            <div class="sheet-header">
                <div class="sheet-title">筛选条件</div>
            </div>
            <div class="sheet-body" id="drawerBody"></div>
            <div class="sheet-footer">
                <button class="btn btn-outline" onclick="resetFilters()">重置</button>
                <button class="btn btn-primary" onclick="confirmFilters()">确定</button>
            </div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../../data/personnel-transfer-data.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    var rawData = (typeof personnelTransferData !== 'undefined' && Array.isArray(personnelTransferData)) ? personnelTransferData : [];
    var allData = rawData.map(function(item) {
        return {
            no: item.no || '',
            streetTown: item.streetTown || '',
            evacuationUnit: item.evacuationUnit || '',
            evacuationPoint: item.evacuationPoint || '',
            evacuatedCount: item.evacuatedCount || '',
            evacuationReason: item.evacuationReason || '',
            contactPerson: item.contactPerson || '',
            contactPhone: item.contactPhone || '',
            shelterName: item.shelterName || '',
            shelterAddress: item.shelterAddress || '',
            shelterContactPerson: item.shelterContactPerson || '',
            shelterContactPhone: item.shelterContactPhone || '',
            reportUnit: item.reportUnit || '',
            reporter: item.reporter || '',
            reportDate: item.reportDate || ''
        };
    });

    var selectedFilters = { streetTown: '', evacuationReason: '' };

    var townOptions = (function() {
        var set = {};
        allData.forEach(function(item) { if (item.streetTown) set[item.streetTown] = true; });
        var list = Object.keys(set);
        list.sort();
        return ['全部'].concat(list);
    })();

    var reasonOptions = (function() {
        var set = {};
        allData.forEach(function(item) { if (item.evacuationReason) set[item.evacuationReason] = true; });
        var list = Object.keys(set);
        list.sort();
        return ['全部'].concat(list);
    })();

    function saveToStorage() {
        try { localStorage.setItem('personnelTransferData', JSON.stringify(allData)); } catch (e) {}
    }

    function getFilteredData() {
        var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        return allData.filter(function(item) {
            if (keyword) {
                var hay = [
                    item.streetTown, item.evacuationUnit, item.evacuationPoint, item.evacuationReason,
                    item.contactPerson, item.contactPhone, item.shelterName, item.shelterAddress,
                    item.shelterContactPerson, item.shelterContactPhone
                ].join(' ').toLowerCase();
                if (hay.indexOf(keyword) === -1) return false;
            }
            if (selectedFilters.streetTown && selectedFilters.streetTown !== '全部' && item.streetTown !== selectedFilters.streetTown) return false;
            if (selectedFilters.evacuationReason && selectedFilters.evacuationReason !== '全部' && item.evacuationReason !== selectedFilters.evacuationReason) return false;
            return true;
        });
    }

    function renderKpis(data) { return; }

    function renderCard(item) {
        var evacPhone = item.contactPhone && String(item.contactPhone).trim();
        var shelterPhone = item.shelterContactPhone && String(item.shelterContactPhone).trim();
        return '<div class="transfer-card" onclick="goDetail(' + item.no + ')" data-id="' + item.no + '" title="查看详情">' +
            '<div class="card-head">' +
                '<div class="card-title">' + App.escapeHtml(item.evacuationUnit) + '</div>' +
                '<span class="badge tag-region">' + App.escapeHtml(item.streetTown || '—') + '</span>' +
            '</div>' +
            '<div class="tag-row">' +
                '<div class="people-badge"><i class="fa-solid fa-user"></i> ' + App.escapeHtml(item.evacuatedCount || '0') + '人</div>' +
                '<span class="badge tag-reason">' + App.escapeHtml(item.evacuationReason || '—') + '</span>' +
            '</div>' +
            '<div class="pt-line">' +
                '<div class="pt-header"><div class="pt-dot red"></div>撤离点：' + App.escapeHtml(item.evacuationPoint || '—') + '</div>' +
                '<div class="pt-contact">' +
                    '<div class="pt-contact-info"><i class="fa-regular fa-user"></i>负责人：' + App.escapeHtml(item.contactPerson || '—') + (evacPhone ? ' (' + App.escapeHtml(evacPhone) + ')' : '') + '</div>' +
                    (evacPhone ? '<a class="pt-call-btn" href="tel:' + App.escapeHtml(evacPhone) + '" onclick="event.stopPropagation();App.showToast(\'正在呼叫 ' + App.escapeHtml(item.contactPerson) + ' ' + App.escapeHtml(evacPhone) + '\')"><i class="fa-solid fa-phone"></i>呼叫</a>' : '') +
                '</div>' +
            '</div>' +
            '<div class="pt-line">' +
                '<div class="pt-header"><div class="pt-dot green"></div>安置点：' + App.escapeHtml(item.shelterName || '—') + '</div>' +
                '<div class="pt-addr"><i class="fa-solid fa-location-dot"></i>地址：' + App.escapeHtml(item.shelterAddress || '—') + '</div>' +
                '<div class="pt-contact">' +
                    '<div class="pt-contact-info"><i class="fa-regular fa-user"></i>负责人：' + App.escapeHtml(item.shelterContactPerson || '—') + (shelterPhone ? ' (' + App.escapeHtml(shelterPhone) + ')' : '') + '</div>' +
                    (shelterPhone ? '<a class="pt-call-btn" href="tel:' + App.escapeHtml(shelterPhone) + '" onclick="event.stopPropagation();App.showToast(\'正在呼叫 ' + App.escapeHtml(item.shelterContactPerson) + ' ' + App.escapeHtml(shelterPhone) + '\')"><i class="fa-solid fa-phone"></i>呼叫</a>' : '') +
                '</div>' +
            '</div>' +
        '</div>';
    }

    function renderList() {
        var data = getFilteredData();
        var container = document.getElementById('cardList');
        container.innerHTML = '';
        document.getElementById('totalCount').innerHTML = '共 <strong>' + data.length + '</strong> 条';
        renderKpis(data);
        if (data.length === 0) {
            document.getElementById('empty').style.display = 'block';
            return;
        }
        document.getElementById('empty').style.display = 'none';
        data.forEach(function(item) { container.innerHTML += renderCard(item); });
    }

    window.goDetail = function(id) {
        saveToStorage();
        window.location.href = 'personnel-transfer-detail.html?id=' + id;
    };

    function updateSearchClear() {
        var btn = document.getElementById('clearSearch');
        btn.style.display = document.getElementById('searchInput').value ? 'flex' : 'none';
    }

    window.clearSearch = function(e) {
        e.stopPropagation();
        document.getElementById('searchInput').value = '';
        updateSearchClear();
        renderList();
    };

    document.getElementById('searchInput').addEventListener('input', function() {
        updateSearchClear();
        renderList();
    });

    function renderSelectedTags() {
        var container = document.getElementById('selectedTags');
        var html = '';
        var count = 0;
        if (selectedFilters.streetTown && selectedFilters.streetTown !== '全部') {
            html += '<span class="tag">街镇：' + App.escapeHtml(selectedFilters.streetTown) + '<i class="fa-solid fa-times" onclick="removeFilter(\'streetTown\')"></i></span>';
            count++;
        }
        if (selectedFilters.evacuationReason && selectedFilters.evacuationReason !== '全部') {
            html += '<span class="tag">原因：' + App.escapeHtml(selectedFilters.evacuationReason) + '<i class="fa-solid fa-times" onclick="removeFilter(\'evacuationReason\')"></i></span>';
            count++;
        }
        container.innerHTML = html;

        var dot = document.getElementById('filterDot');
        var trigger = document.getElementById('filterTrigger');
        if (count > 0) {
            dot.style.display = 'block';
            trigger.classList.add('active');
        } else {
            dot.style.display = 'none';
            trigger.classList.remove('active');
        }
    }

    window.removeFilter = function(key) {
        selectedFilters[key] = '';
        renderSelectedTags();
        renderDrawer();
        renderList();
    };

    window.openDrawer = function() {
        document.getElementById('drawerOverlay').classList.add('show');
        document.getElementById('drawer').classList.add('show');
    };

    window.closeDrawer = function() {
        document.getElementById('drawerOverlay').classList.remove('show');
        document.getElementById('drawer').classList.remove('show');
    };

    function renderDrawer() {
        var html = '';
        html += '<div class="filter-section">';
        html += '<div class="filter-title">所属街镇</div>';
        html += '<div class="filter-options">';
        townOptions.forEach(function(opt) {
            var active = selectedFilters.streetTown === opt ? ' active' : '';
            html += '<span class="filter-chip' + active + '" onclick="selectChip(this, \'streetTown\', \'' + opt + '\')">' + opt + '</span>';
        });
        html += '</div></div>';

        html += '<div class="filter-section">';
        html += '<div class="filter-title">撤离原因</div>';
        html += '<div class="filter-options">';
        reasonOptions.forEach(function(opt) {
            var active = selectedFilters.evacuationReason === opt ? ' active' : '';
            html += '<span class="filter-chip' + active + '" onclick="selectChip(this, \'evacuationReason\', \'' + opt + '\')">' + opt + '</span>';
        });
        html += '</div></div>';

        document.getElementById('drawerBody').innerHTML = html;
    }

    window.selectChip = function(el, key, value) {
        var group = el.parentElement;
        group.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
        if (selectedFilters[key] === value) {
            selectedFilters[key] = '';
        } else {
            selectedFilters[key] = value;
            el.classList.add('active');
        }
    };

    window.confirmFilters = function() {
        renderSelectedTags();
        closeDrawer();
        renderList();
    };

    window.resetFilters = function() {
        selectedFilters = { streetTown: '', evacuationReason: '' };
        renderDrawer();
        renderSelectedTags();
        renderList();
    };

    function updateTime() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        document.getElementById('statusTime').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    }
    updateTime();
    setInterval(updateTime, 60000);

    renderDrawer();
    renderSelectedTags();
    renderList();
})();
</script>
</body>
</html>
