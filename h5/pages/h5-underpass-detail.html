<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

.status-bar { position: relative; z-index: 100; }.page-hero { position: relative; z-index: 99; display: flex; flex-direction: column; align-items: center; padding: calc(34px + 16px) 18px 42px; }

.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; }
.content-sheet.page-body-sheet { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.content-sheet.page-body-sheet::-webkit-scrollbar { display: none; }

.hero-detail { padding: 18px 16px 22px; display: flex; flex-direction: column; gap: 6px; }
.hero-title { font-size: 20px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
.hero-subtitle { font-size: 13px; color: rgba(255,255,255,.9); }

.summary-card { background: linear-gradient(180deg, #1557b0 0%, #1a73e8 100%); border-radius: 12px; margin: 12px 16px 14px; padding: 18px 16px; color: #fff; position: relative; overflow: hidden; box-shadow: 0 6px 18px rgba(26,115,232,.22); }
.summary-card::before { content: ''; position: absolute; width: 120px; height: 120px; right: -30px; top: -30px; background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%); border-radius: 50%; }
.summary-card.high::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--danger); }
.sc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; position: relative; z-index: 1; }
.sc-name { font-size: 20px; font-weight: 700; color: #fff; line-height: 1.35; flex: 1; word-break: break-word; position: relative; z-index: 1; }
.sc-badge { flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.2); position: relative; z-index: 1; }
.sc-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.sc-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; font-size: 13px; color: rgba(255,255,255,.9); position: relative; z-index: 1; }
.sc-meta i { font-size: 12px; margin-right: 2px; }
.sc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; position: relative; z-index: 1; }
.sc-grid-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,.9); }
.sc-grid-item i { font-size: 13px; width: 16px; text-align: center; }
.sc-grid-item b { color: #fff; font-weight: 600; }
.sc-line { font-size: 13px; color: rgba(255,255,255,.9); margin-bottom: 4px; line-height: 1.5; position: relative; z-index: 1; }
.sc-line:last-child { margin-bottom: 0; }
.sc-line b { color: #fff; font-weight: 600; }
.sc-contact i { font-size: 12px; margin-right: 4px; }

:root[data-theme="dark"] .summary-card { background: linear-gradient(180deg, #0d2a5c 0%, #1a73e8 100%); }

.linkage-card { background: transparent; border-radius: 0; padding: 0 16px; margin: 0 0 12px; border: none; border-bottom: 1px solid var(--border); }

.lc3-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding-bottom: 16px; }
.lc3-btn-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: all .15s; }
.lc3-btn-card:active { transform: scale(.97); }
.lc3-btn-card.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.lc3-btn-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.lc3-btn-icon.onsite { background: rgba(26,115,232,.1); color: var(--primary); }
.lc3-btn-icon.police { background: rgba(123,47,247,.12); color: #7c3aed; }
.lc3-btn-icon.water { background: rgba(0,151,167,.1); color: #0097a7; }
.lc3-btn-icon.traffic { background: rgba(30,142,62,.12); color: var(--success); }
.lc3-btn-label { font-size: 12px; color: var(--text-primary); font-weight: 500; }

.content-sheet.page-body-sheet { margin-top: 0; border-radius: 0; padding: 0 0 16px; background: #f5f6fa; }

.section-v2 { background: #fff; border-radius: 12px; margin: 0 16px 12px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.section-v2:last-of-type { margin-bottom: 16px; }
.sv2-head { margin-bottom: 10px; }
.sv2-title { font-size: 15px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 0; position: relative; padding-left: 10px; }
.sv2-title::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--primary); }
.sv2-title i { display: none; }

.sc-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #f2f2f2; gap: 16px; }
.sc-row:last-child { border-bottom: none; padding-bottom: 0; }
.sc-row.wrap { align-items: flex-start; }
.sc-label { font-size: 14px; color: var(--text2); text-align: left; line-height: 1.4; flex-shrink: 0; }
.sc-value { flex: 1; min-width: 0; font-size: 14px; color: var(--text-primary); font-weight: 500; text-align: right; line-height: 1.4; word-break: break-word; }
.sc-value.phone { color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; }
.sc-value.phone i { font-size: 12px; }
.sc-value.na { color: var(--text2); }
.sc-value.success { color: var(--success); font-weight: 600; }
.sc-value.danger { color: var(--danger); font-weight: 600; }
.sc-value.warning { color: var(--warning); font-weight: 600; }

.sc-group-title { font-size: 13px; color: var(--text2); font-weight: 600; padding: 10px 0 6px; }
.sc-group-title:first-child { padding-top: 0; }

.remarks-area { background: #f5f6fa; border-radius: 8px; padding: 12px; font-size: 14px; color: var(--text-primary); line-height: 1.6; min-height: 50px; white-space: pre-wrap; }
.remarks-area:empty::before { content: attr(placeholder); color: var(--text2); }
.report-info { margin-top: 12px; padding-top: 12px; border-top: 1px solid #f2f2f2; }
.report-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; }
.report-row .sc-label { color: var(--text2); }
.report-row .sc-value { color: var(--text-primary); font-weight: 500; }

.binfo-grid { display: flex; flex-direction: column; }
.binfo-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 12px; }
.binfo-row:last-child { border-bottom: none; padding-bottom: 12px; }
.binfo-row.wrap { align-items: flex-start; }
.binfo-label { width: 90px; font-size: 14px; color: var(--text2); text-align: right; line-height: 1.4; flex-shrink: 0; }
.binfo-value { flex: 1; min-width: 0; font-size: 14px; color: var(--text-primary); font-weight: 600; text-align: left; line-height: 1.4; word-break: break-word; }
.binfo-value.gray { color: var(--text2); }
.binfo-value.na { color: var(--text2); font-style: italic; }
.binfo-value.danger { color: var(--danger); font-weight: 700; }
.binfo-value.warning { color: var(--warning); font-weight: 700; }
.binfo-value.success { color: var(--success); font-weight: 700; }

.info-list { display: flex; flex-direction: column; }
.il-item { display: flex; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 16px; }
.il-item:last-child { border-bottom: none; padding-bottom: 12px; }
.il-label { width: 100px; font-size: 14px; color: var(--text2); flex-shrink: 0; text-align: right; line-height: 1.4; }
.il-value { flex: 1; min-width: 0; font-size: 14px; color: var(--text-primary); font-weight: 600; text-align: left; line-height: 1.4; word-break: break-word; }
.il-value.gray { color: var(--text2); }
.il-value.na { color: var(--text2); font-style: italic; }
.il-value.danger { color: var(--danger); font-weight: 700; }
.il-value.warning { color: var(--warning); font-weight: 700; }
.il-value.success { color: var(--success); font-weight: 700; }

.contact-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 12px; }
.contact-row .contact-main { flex: 1; min-width: 0; }
.contact-row .contact-name { font-weight: 600; font-size: 15px; color: var(--text-primary); line-height: 1.35; }
.contact-row .contact-role { font-size: 13px; color: var(--text2); margin-top: 3px; }

.contact-row .call-pill.warning { background: var(--warning); }

.contact-row .call-pill.traffic { background: var(--success); }

.pump-group .il-value.danger { color: var(--danger); font-weight: 600; }

.info-grid .label { font-size: 13px; color: var(--text2); }
.info-grid .value { font-size: 14px; color: var(--text-primary); font-weight: 500; }

.remarks-area { background: var(--bg-dark); border-radius: var(--radius-md); padding: 12px; font-size: 14px; color: var(--text-primary); line-height: 1.6; min-height: 60px; white-space: pre-wrap; }
.remarks-area:empty::before { content: attr(placeholder); color: var(--text2); }

.report-info { font-size: 12px; color: var(--text2); text-align: right; margin-top: 8px; }

.bottom-actions .btn { flex: 1; }

.bottom-spacer { height: 20px; }

:root[data-theme="dark"] .section-v2 { background: var(--bg-card); }
:root[data-theme="dark"] .linkage-card { background: var(--bg-card); border-color: var(--border); }
:root[data-theme="dark"] .contact-row { background: transparent; }
:root[data-theme="dark"] .remarks-area { background: var(--bg-hover); }
</style>

<div class="phone-frame">
    <div class="phone-shell">
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title" id="heroName">下立交详情</div>
        </div>

        <div class="content-sheet page-body-sheet" style="padding:0 0 16px">

            <div class="summary-card" id="summaryCard"></div>

            <!-- 三联动快捷拨号 -->
            <div class="linkage-card" id="linkageCard">

            </div>

            <!-- 基础信息 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">基础信息</div></div>
                <div id="basicInfo"></div>
            </div>

            <!-- 管理责任 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">管理责任</div></div>
                <div id="managementContact"></div>
            </div>

            <!-- 现场值守 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">现场值守</div></div>
                <div id="onSiteContact"></div>
            </div>

            <!-- 水务信息 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">水务信息</div></div>
                <div id="waterContact"></div>
            </div>

            <!-- 所属派出所 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">所属派出所</div></div>
                <div id="policeContact"></div>
            </div>

            <!-- 交警部门 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">交警部门</div></div>
                <div id="trafficContact"></div>
            </div>

            <!-- 泵站信息 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">泵站信息</div></div>
                <div id="pumpInfo"></div>
            </div>

            <!-- 摄像机点位 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">摄像机点位</div></div>
                <div id="cameraInfo"></div>
            </div>

            <!-- 备注与填报信息 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">备注与填报信息</div></div>
                <div class="remarks-area" id="remarksArea" placeholder="无备注"></div>
                <div class="report-info" id="reportInfo"></div>
            </div>

            <div class="bottom-spacer"></div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

    function loadData() {
        var id = App.getQuery('id');
        var fromStorage = null;
        try { fromStorage = JSON.parse(localStorage.getItem('underpassData') || '[]'); } catch (e) {}
        var list = Array.isArray(fromStorage) && fromStorage.length ? fromStorage : embeddedData;
        if (id) {
            var found = list.find(function(i) { return i.no === id; });
            if (found) return found;
        }
        return embeddedData[0];
    }

    var item = loadData();

    function getVal(v) {
        return v && String(v).trim() ? v : '—';
    }

    function getYesNoClass(v) {
        if (v === '有' || v === '是') return 'success';
        if (v === '无' || v === '否') return 'danger';
        return 'gray';
    }

    function getLevelClass(v) {
        return levelClassMap[v] || 'gray';
    }

    function renderInfoGrid(pairs) {
        return pairs.map(function(p) {
            var idAttr = p.id ? ' id="' + p.id + '"' : '';
            return '<div class="sc-row"><div class="sc-label">' + p.label + '</div><div class="sc-value ' + (p.cls || '') + '"' + idAttr + '>' + p.value + '</div></div>';
        }).join('');
    }

    function renderContactRow(label, name, phone) {
        var phoneToUse = phone && String(phone).trim() ? phone : '';
        var displayName = name && String(name).trim() ? name : '—';
        if (!phoneToUse) {
            return '<div class="sc-row"><div class="sc-label">' + label + '</div><div class="sc-value na">' + displayName + '</div></div>';
        }
        var display = displayName + ' ' + phoneToUse;
        return '<div class="sc-row"><div class="sc-label">' + label + '</div><a class="sc-value phone" href="tel:' + phoneToUse + '" onclick="App.showToast(\'正在呼叫 ' + display + '\')"><i class="fa-solid fa-phone"></i>' + display + '</a></div>';
    }

    function renderBasicInfo() {
        var rows = [
            { label: '下立交名称', value: getVal(item.name) },
            { label: '所在区域', value: getVal(item.region) },
            { label: '归属分类', value: getVal(item.ownership) },
            { label: '易积水下立交', value: getVal(item.waterloggingLevel), cls: getLevelClass(item.waterloggingLevel) },
            { label: '车道数量', value: getVal(item.laneCount) },
            { label: '下立交长度（米）', value: getVal(item.length) },
            { label: '下立交属性', value: getVal(item.underpassAttr) },
            { label: '桥洞定义', value: getVal(item.bridgeType) },
            { label: '通行分类', value: getVal(item.trafficType) },
            { label: '人行地道', value: getVal(item.pedestrianTunnel), cls: getYesNoClass(item.pedestrianTunnel) },
            { label: '积水监测点位', value: getVal(item.waterMonitor), cls: getYesNoClass(item.waterMonitor) }
        ];
        document.getElementById('basicInfo').innerHTML = renderInfoGrid(rows);
    }

            { label: '是否真两路供电', value: getVal(item.trueDualPower), cls: getYesNoClass(item.trueDualPower) },
            { label: '有/无备用移动电源', value: getVal(item.backupPower), cls: getYesNoClass(item.backupPower) },
            { label: '有无管理用房', value: getVal(item.managementRoom), cls: getYesNoClass(item.managementRoom) }
        ];
        document.getElementById('pumpInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderCameraInfo() {
        var rows = [
            { label: '有/无摄像机', value: getVal(item.hasCamera), cls: getYesNoClass(item.hasCamera) },
            { label: '有/无安装计划', value: getVal(item.cameraPlan), cls: getYesNoClass(item.cameraPlan) },
            { label: '是否接入市级平台', value: getVal(item.cityPlatform), cls: getYesNoClass(item.cityPlatform) },
            { label: '视频设备归属', value: getVal(item.cameraBelong) }
        ];
        document.getElementById('cameraInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderRemarks() {
        document.getElementById('remarksArea').textContent = item.remarks || '';
        var rows = [
            { label: '填报单位', value: getVal(item.reportUnit) },
            { label: '填报人', value: getVal(item.reporter) },
            { label: '填报日期', value: getVal(item.reportDate) }
        ];
        document.getElementById('reportInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderLinkage() {
        var groups = [
            { key: 'onsite', label: '呼叫现场值守', icon: 'fa-user', cls: 'onsite', phones: [item.onSite1Phone, item.onSite2Phone, item.onSite3Phone].filter(function(p) { return p && String(p).trim(); }) },
            { key: 'police', label: '呼叫派出所', icon: 'fa-shield-halved', cls: 'police', phones: [item.police1Phone, item.police2Phone].filter(function(p) { return p && String(p).trim(); }) },
            { key: 'water', label: '呼叫水务', icon: 'fa-droplet', cls: 'water', phones: [item.waterDeptPhone].filter(function(p) { return p && String(p).trim(); }) },
            { key: 'traffic', label: '呼叫交警大队', icon: 'fa-traffic-light', cls: 'traffic', phones: [item.traffic1Phone, item.traffic2Phone].filter(function(p) { return p && String(p).trim(); }) }
        ];

        var html = groups.map(function(g) {
            var disabled = g.phones.length === 0 ? ' disabled' : '';
            return '<div class="lc3-btn-card' + disabled + '" id="link_' + g.key + '">' +
                '<div class="lc3-btn-icon ' + g.cls + '"><i class="fa-solid ' + g.icon + '"></i></div>' +
                '<div class="lc3-btn-label">' + g.label + '</div>' +
            '</div>';
        }).join('');
        document.getElementById('linkageBody').innerHTML = html;

        groups.forEach(function(g) {
            var el = document.getElementById('link_' + g.key);
            if (!el || g.phones.length === 0) return;
            el.addEventListener('click', function(e) {
                e.stopPropagation();
                if (g.phones.length === 1) {
                    window.location.href = 'tel:' + g.phones[0];
                    App.showToast('正在呼叫 ' + g.label);
                } else {
                    var list = g.phones.map(function(p) {
                        return '<div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:pointer" onclick="window.location.href=\'tel:' + App.escapeHtml(p) + '\';App.showToast(\'正在呼叫 ' + App.escapeHtml(p) + '\')">' +
                            '<span style="font-weight:500">' + App.escapeHtml(p) + '</span><span style="color:var(--success);font-weight:600"><i class="fa-solid fa-phone"></i> 拨打</span></div>';
                    }).join('');
                    App.showModal ? App.showModal({ title: '选择电话', content: '<div style="max-height:300px;overflow-y:auto">' + list + '</div>' }) : App.showToast('多联系人：请进详情拨打');
                }
            });
        });
    }

    function renderHero() {
        document.getElementById('heroName').textContent = item.name || '下立交详情';
    }

    function getLevelBadgeClass(level) {
        if (level === '高风险') return 'red';
        if (level === '中风险') return 'orange';
        return 'yellow';
    }

    function renderSummaryCard() {
        var highClass = item.waterloggingLevel === '高风险' ? ' high' : '';
        var badgeClass = getLevelBadgeClass(item.waterloggingLevel);
        var meta = App.escapeHtml(item.region || '—') + ' · ' + App.escapeHtml(item.underpassAttr || '—');
        var cameraText = item.hasCamera === '有'
            ? '有'
            : (item.cameraPlan === '有' ? '有安装计划' : '无');
        document.getElementById('summaryCard').innerHTML =
            '<div class="sc-head">' +
                '<div class="sc-name">' + App.escapeHtml(item.name || '—') + '</div>' +
                '<div class="sc-badge ' + badgeClass + '">' + App.escapeHtml(item.waterloggingLevel || '—') + '</div>' +
            '</div>' +
            '<div class="sc-meta"><i class="fa-solid fa-location-dot"></i>' + meta + '</div>' +
            '<div class="sc-grid">' +
                '<div class="sc-grid-item"><i class="fa-solid fa-faucet"></i><b>泵站：' + App.escapeHtml(item.hasPumpStation || '—') + '</b></div>' +
                '<div class="sc-grid-item"><i class="fa-solid fa-video"></i><b>监控：' + App.escapeHtml(cameraText) + '</b></div>' +
                '<div class="sc-grid-item"><i class="fa-solid fa-droplet"></i><b>积水监测：' + App.escapeHtml(item.waterMonitor || '—') + '</b></div>' +
                '<div class="sc-grid-item"><i class="fa-solid fa-person-walking"></i><b>人行地道：' + App.escapeHtml(item.pedestrianTunnel || '—') + '</b></div>' +
            '</div>' +
            '<div class="sc-line"><b>管理单位：</b>' + App.escapeHtml(item.managementUnit || '—') + '</div>' +
            '<div class="sc-line sc-contact"><i class="fa-solid fa-user"></i><b>联系人：</b>' + App.escapeHtml(item.managementContact || '—') + '</div>';
    }

    // 状态栏时间
    function updateTime() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        document.getElementById('statusTime').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    }
    updateTime();
    setInterval(updateTime, 60000);

    renderHero();
    renderSummaryCard();
    renderLinkage();
    renderBasicInfo();
    renderManagementContact();
    renderOnSiteContact();
    renderWaterContact();
    renderPoliceContact();
    renderTrafficContact();
    renderPumpInfo();
    renderCameraInfo();
    renderRemarks();
})();
</script>
</body>
</html>
