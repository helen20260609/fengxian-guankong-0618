<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Schema 排查 Demo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
/* ===== 复用 farm-review-inspect 的视觉语言 ===== */
.inspect-body { flex: 1; overflow-y: auto; padding: 14px 14px calc(90px + var(--safe-bottom)); background: var(--bg); }
.section { background: #fff; border-radius: 12px; padding: 16px 14px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.sec-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
.section-num { color: var(--primary); font-weight: 700; }

/* 底数只读行 */
.bi-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.bi-row:last-child { border-bottom: none; }
.bi-label { color: var(--text-secondary); }
.bi-value { color: var(--text-primary); font-weight: 500; max-width: 60%; text-align: right; }

/* 填报项 */
.check-item { margin-bottom: 14px; }
.ci-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; line-height: 1.5; }
.req-star { color: #e02020; margin-left: 2px; }
.form-input, .form-textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; color: var(--text-primary); }
.form-input:focus, .form-textarea:focus { outline: none; border-color: var(--primary); }
.form-input[disabled], .form-textarea[disabled] { background: #f5f6f8; color: var(--text-secondary); }
.view-text { font-size: 14px; color: var(--text-primary); padding: 4px 0; }
.view-empty { color: var(--text-secondary); }

/* pill 选择 */
.radio-row, .checkbox-row { display: flex; flex-wrap: wrap; gap: 8px; }
.radio-pill, .checkbox-pill { padding: 7px 16px; border: 1px solid var(--border); border-radius: 16px; font-size: 13px; color: var(--text-secondary); cursor: pointer; user-select: none; transition: all .15s; background: #fff; }
.radio-pill.active, .checkbox-pill.active { border-color: var(--primary); color: var(--primary); background: var(--primary-light, #e8f0fe); font-weight: 500; }
.radio-pill.disabled, .checkbox-pill.disabled { opacity: .6; pointer-events: none; }
.custom-input, .other-input { width: 100%; }

/* 隐患卡 */
.hazard-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fafbfc; }
.hazard-card .hc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.hazard-card .hc-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.hazard-card .hc-del { width: 24px; height: 24px; border-radius: 50%; background: #fee; color: #e02020; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; }
.hazard-card .check-item:last-child { margin-bottom: 0; }
.hazard-add { border: 1px dashed var(--border); border-radius: 8px; padding: 10px; text-align: center; color: var(--primary); font-size: 13px; cursor: pointer; margin-top: 4px; }
.hazard-add:active { background: var(--primary-light, #e8f0fe); }

/* 底部操作条 */
.bottom-actions { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(10px + var(--safe-bottom)); background: #fff; border-top: 1px solid var(--border); display: flex; gap: 10px; z-index: 10; }
.bottom-actions .btn { flex: 1; padding: 12px 0; border-radius: 22px; font-size: 15px; border: none; cursor: pointer; text-align: center; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-ghost { background: #f0f2f5; color: var(--text-primary); }

/* demo 工具条 */
.demo-bar { background: linear-gradient(90deg,#fff8e1,#fff3e0); border: 1px solid #ffe0b2; border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; font-size: 12px; color: #7a4e00; }
.demo-bar select { margin-left: 6px; padding: 3px 6px; border: 1px solid #e0a800; border-radius: 6px; font-size: 12px; }
.demo-bar .demo-tag { display: inline-block; background: #e02020; color: #fff; border-radius: 4px; padding: 1px 6px; font-size: 11px; margin-right: 6px; }
.demo-bar .row2 { margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
.demo-bar .demo-link { color: var(--primary); cursor: pointer; text-decoration: underline; }

/* 历史回放卡 */
.history-card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.history-card .hh { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; }
.history-card .hh .round-tag { font-size: 11px; background: var(--primary-light, #e8f0fe); color: var(--primary); border-radius: 8px; padding: 2px 8px; font-weight: 400; }
.history-card .hm { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
.history-card .hbtn { font-size: 12px; color: var(--primary); cursor: pointer; }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="inspect-body" id="inspectBody">
            <!-- demo 控制条 -->
            <div class="demo-bar">
                <div><span class="demo-tag">概念验证</span>表单由 <b>round-schemas.json</b> 驱动，非代码写死</div>
                <div class="row2">
                    轮次：
                    <select id="roundSelect"></select>
                    <span class="demo-link" id="btnViewHistory">查看该房历史排查 →</span>
                </div>
            </div>
            <!-- Schema 渲染区 -->
            <div id="formRoot"></div>
            <!-- 历史回放区（默认隐藏） -->
            <div id="historyRoot" style="display:none"></div>
        </div>
        <div class="bottom-actions">
            <button class="btn btn-ghost" id="btnBack">返回</button>
            <button class="btn btn-primary" id="btnSubmit">提交排查</button>
        </div>
    </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../../js/house-arch-data.js"></script>
<script src="../assets/js/schema-renderer.js"></script>
<script>
(function() {
    var houseNo = (App.getQuery('no') || '').trim().toUpperCase();
    var house = null;
    var schemas = null;      // round-schemas.json 内容
    var currentSchema = null;
    var historyMode = false;

    // ---------- 加载房屋档案（与 farm-review-inspect 同一套数据链路） ----------
    initHouseArchSeed();
    if (houseNo) {
        house = getHouseRecord(houseNo);
        if (!house) {
            // 兜底：待排查 / 已排查记录
            var fromReview = null;
            try {
                var pend = JSON.parse(localStorage.getItem('farm-review-pending') || '[]');
                for (var i = 0; i < pend.length; i++) {
                    if ((pend[i].houseNo || '').toUpperCase() === houseNo) { fromReview = pend[i]; break; }
                }
            } catch (e) {}
            if (fromReview) {
                house = {
                    no: fromReview.houseNo,
                    owner: fromReview.owner || '',
                    address: fromReview.houseAddress || '',
                    street: fromReview.town || '',
                    village: fromReview.village || '',
                    overview: { usage: fromReview.houseUsage || '', floors: fromReview.floors || '', builtYear: fromReview.buildYear || '' }
                };
            }
        }
    }

    // ---------- 加载 Schema ----------
    function loadSchemas() {
        return fetch('/api/round-schemas')
            .then(function(r) { return r.ok ? r.json() : null; })
            .catch(function() { return null; });
    }

    function currentRound() {
        if (!schemas) return null;
        var rid = schemas.currentRoundId;
        return (schemas.rounds || []).find(function(r) { return r.roundId === rid; }) || (schemas.rounds || [])[0];
    }

    function renderRoundSelect() {
        var sel = document.getElementById('roundSelect');
        sel.innerHTML = (schemas.rounds || []).map(function(r) {
            return '<option value="' + r.roundId + '"' + (r === currentRound() ? ' selected' : '') + '>' +
                r.name + (r.status === 'archived' ? '（已归档）' : '') + '</option>';
        }).join('');
    }

    function renderForm() {
        currentSchema = currentRound();
        historyMode = false;
        document.getElementById('historyRoot').style.display = 'none';
        var root = document.getElementById('formRoot');
        root.style.display = '';
        SchemaRenderer.render(root, currentSchema, { house: house });
    }

    // ---------- 提交 ----------
    function submit() {
        if (!currentSchema || !house) { App.showToast('缺少房屋或轮次配置'); return; }
        var root = document.getElementById('formRoot');
        var errs = SchemaRenderer.validate(root, currentSchema);
        if (errs.length) { App.showToast('请填写：' + errs[0]); return; }
        var values = SchemaRenderer.collect(root, currentSchema);
        var record = {
            houseNo: house.no,
            roundId: currentSchema.roundId,
            schemaVersion: currentSchema.version,
            roundName: currentSchema.name,
            values: values,
            submitTime: new Date().toISOString(),
            status: 'submitted',
            source: 'schema-demo'
        };
        fetch('/api/inspect-round-records', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(record)
        }).then(function(r) {
            if (r.ok) App.showToast('已提交（roundId=' + record.roundId + '）', 2200);
            else App.showToast('保存失败');
        }).catch(function() { App.showToast('服务不可用'); });
    }

    // ---------- 历史回放：按记录 roundId 找当时 Schema 渲染 ----------
    function loadHistory() {
        if (!house) { App.showToast('未找到房屋'); return; }
        fetch('/api/inspect-round-records?houseNo=' + encodeURIComponent(house.no))
            .then(function(r) { return r.ok ? r.json() : []; })
            .then(function(list) {
                list = Array.isArray(list) ? list : [];
                var mine = list.filter(function(x) { return (x.houseNo || '').toUpperCase() === house.no.toUpperCase(); });
                renderHistory(mine);
            })
            .catch(function() { App.showToast('历史加载失败'); });
    }

    function renderHistory(records) {
        historyMode = true;
        document.getElementById('formRoot').style.display = 'none';
        var root = document.getElementById('historyRoot');
        root.style.display = '';
        if (!records.length) {
            root.innerHTML = '<div class="section"><div class="sec-title">历史排查记录</div>' +
                '<div style="font-size:13px;color:var(--text-secondary);padding:8px 0">暂无 Schema 化排查记录，可先在表单页提交一条。</div></div>';
            return;
        }
        var html = '<div class="section"><div class="sec-title">历史排查记录（' + records.length + '）</div></div>';
        records.forEach(function(rec, i) {
            var round = (schemas.rounds || []).find(function(r) { return r.roundId === rec.roundId; });
            var roundName = rec.roundName || (round ? round.name : rec.roundId);
            html += '<div class="history-card">' +
                '<div class="hh"><span>' + (rec.submitTime || '').slice(0, 10) + ' 排查</span>' +
                '<span class="round-tag">' + roundName + '</span></div>' +
                '<div class="hm">roundId=' + rec.roundId + ' · schemaV' + (rec.schemaVersion || 1) + '</div>' +
                '<span class="hbtn" data-replay="' + i + '">按当时轮次回放 →</span>' +
                '</div>';
        });
        // 回放容器
        html += '<div id="replayBox"></div>';
        root.innerHTML = html;

        root.querySelectorAll('[data-replay]').forEach(function(el) {
            el.addEventListener('click', function() {
                var rec = records[+el.dataset.replay];
                var round = (schemas.rounds || []).find(function(r) { return r.roundId === rec.roundId; });
                if (!round) { App.showToast('找不到该记录对应的轮次配置：' + rec.roundId); return; }
                var box = document.getElementById('replayBox');
                box.innerHTML = '<div style="font-size:12px;color:var(--text-secondary);margin:4px 0 10px">' +
                    '↓ 按「' + (round.name) + '」的字段结构回放（只读）</div>';
                var inner = document.createElement('div');
                box.appendChild(inner);
                // 关键：用记录当时的 Schema 回放，而非当前轮次
                SchemaRenderer.render(inner, round, { house: house, record: rec, readonly: true });
                box.scrollIntoView({ behavior: 'smooth' });
            });
        });
    }

    // ---------- 启动 ----------
    loadSchemas().then(function(s) {
        if (!s) {
            document.getElementById('formRoot').innerHTML =
                '<div class="section"><div class="sec-title">配置加载失败</div>' +
                '<div style="font-size:13px;color:var(--text-secondary)">请确认服务端已挂载 /api/round-schemas 且 data/round-schemas.json 存在。</div></div>';
            return;
        }
        schemas = s;
        renderRoundSelect();
        renderForm();
        document.getElementById('roundSelect').addEventListener('change', function() {
            schemas.currentRoundId = this.value;
            renderForm();
        });
    });

    document.getElementById('btnSubmit').addEventListener('click', submit);
    document.getElementById('btnViewHistory').addEventListener('click', loadHistory);
    document.getElementById('btnBack').addEventListener('click', function() { App.back(); });
})();
</script>
</body>
</html>
