<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>防汛隐患上报</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>

/* 固定顶部：状态栏 + 导航栏 */
.top-sticky {
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 100;
}
.top-sticky .status-bar {
    position: relative;
    z-index: 100;
}

.page-hero {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(34px + 16px) 18px 42px;
    background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #1d4ed8 100%);
    color: #fff;
    position: relative;
    overflow: hidden;
}
.page-hero::before {
    content: '';
    position: absolute;
    width: 160px;
    height: 160px;
    right: -50px;
    top: -20px;
    background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%);
    border-radius: 50%;
}
.page-hero .ph-back {
    position: absolute;
    left: 14px;
    top: calc(34px + 16px);
    margin: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #fff;
    cursor: pointer;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 2;
}
.page-hero .ph-title {
    position: absolute;
    left: 50%;
    top: calc(34px + 16px);
    transform: translateX(-50%);
    text-align: center;
    line-height: 32px;
    width: 60%;
    font-size: 18px;
    font-weight: 700;
    z-index: 2;
}

.content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 0 0 calc(70px + var(--safe-bottom, 0px)); background: #f5f6fa; }
.content::-webkit-scrollbar { display: none; }
.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; }

/* 表单分组 */
.form-group { background: #fff; margin-bottom: 10px; }
.form-group:last-of-type { margin-bottom: 0; }
.form-group-title { font-size: 15px; color: #333; font-weight: 600; padding: 14px 16px 8px; }

/* 表单行 */
.form-row {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid #f0f0f0;
}
.form-row:last-child { border-bottom: none; }
.form-row.horizontal { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
.form-row.horizontal .fr-control { width: auto; justify-content: flex-end; }

.fr-label { font-size: 15px; color: #333; font-weight: 500; line-height: 1.4; }
.fr-label .req { color: #ff4d4f; margin-right: 4px; }
.fr-control { display: flex; align-items: flex-start; justify-content: flex-start; gap: 8px; min-width: 0; width: 100%; }
.fr-control.fr-between { justify-content: space-between; }
.fr-control.fr-end { justify-content: flex-end; }
.fr-label-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
.fr-label-row .map-link { font-size: 14px; }

.fr-control input[type="text"],
.fr-control input[type="date"],
.fr-control textarea {
    flex: 1;
    border: none;
    padding: 0;
    font-size: 15px;
    background: transparent;
    color: #333;
    font-family: inherit;
    width: 100%;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
}
.fr-control input[type="date"] { position: relative; }
.fr-control input[type="date"]::-webkit-calendar-picker-indicator {
    opacity: 0;
    position: absolute;
    right: 0;
    top: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
}
.fr-control input::placeholder,
.fr-control textarea::placeholder { color: #bfbfbf; }
.fr-control textarea { resize: none; line-height: 1.5; }
.fr-control .placeholder { color: #bfbfbf; font-size: 15px; }
.fr-control .arrow { color: #999; font-size: 13px; flex-shrink: 0; }
.multi-select-tags { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.multi-select-tags:empty::before { content: '请选择'; color: #bfbfbf; font-size: 15px; }
.multi-select-tags .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 4px; font-size: 12px; background: var(--primary-light); border: 1px solid rgba(26,115,232,0.2); color: var(--primary); }
.multi-select-option { display: flex; align-items: center; justify-content: space-between; padding: 12px; border: 1px solid #f0f0f0; border-radius: 8px; cursor: pointer; margin-bottom: 8px; transition: all .2s; }
.multi-select-option:last-child { margin-bottom: 0; }
.multi-select-option.selected { border-color: var(--primary); background: rgba(26,115,232,0.05); }
.multi-select-option .check-box { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #d9d9d9; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; }
.multi-select-option.selected .check-box { background: var(--primary); border-color: var(--primary); }

/* 选择地址链接 */
.map-link { display: flex; align-items: center; gap: 4px; color: var(--primary); font-size: 15px; cursor: pointer; flex-shrink: 0; }
.map-link i { font-size: 14px; }

/* 分段选择 */
.segment-control { display: inline-flex; background: #f5f5f5; border-radius: 8px; padding: 3px; }
.segment-control label { padding: 6px 16px; font-size: 14px; color: #666; cursor: pointer; border-radius: 6px; transition: all .2s; }
.segment-control input { display: none; }
.segment-control input:checked + span { background: #fff; color: #333; box-shadow: 0 1px 3px rgba(0,0,0,.1); font-weight: 600; }

/* Switch 开关 */
.switch-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #f0f0f0; }
.switch-row:last-child { border-bottom: none; }
.switch-row .sr-label { font-size: 15px; color: #333; font-weight: 500; }
.switch { position: relative; display: inline-block; width: 46px; height: 26px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider { position: absolute; cursor: pointer; inset: 0; background: #e0e0e0; border-radius: 26px; transition: .2s; }
.switch .slider::before { content: ''; position: absolute; height: 22px; width: 22px; left: 2px; bottom: 2px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch input:checked + .slider { background: var(--primary); }
.switch input:checked + .slider::before { transform: translateX(20px); }

/* 照片 */
.photo-group { background: #fff; padding: 14px 16px; margin-bottom: 10px; }
.photo-group-title { font-size: 15px; color: #333; font-weight: 500; margin-bottom: 12px; }
.photo-group-title .sub { font-size: 12px; color: #999; font-weight: 400; margin-left: 4px; }
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.photo-grid .photo-add, .photo-grid .photo-thumb { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.photo-grid .photo-add { border: 1px dashed #d9d9d9; color: #999; font-size: 22px; background: #fafafa; flex-direction: column; gap: 4px; cursor: pointer; }
.photo-grid .photo-add .add-text { font-size: 10px; }
.photo-grid .photo-thumb { background: #f5f5f5; overflow: hidden; position: relative; }
.photo-grid .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-grid .photo-thumb .remove { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; }

/* 底部操作栏 */
.bottom-actions {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    padding: 10px 14px calc(10px + var(--safe-bottom, 0px));
    background: #fff;
    border-top: 1px solid #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    z-index: 100;
}
.bottom-actions .draft-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 11px;
    color: #666;
    background: transparent;
    border: none;
    padding: 0 8px;
    cursor: pointer;
    min-width: 50px;
}
.bottom-actions .draft-btn i { font-size: 20px; color: #333; }
.bottom-actions .submit-btn {
    flex: 1;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 12px 0;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

/* 地图选点 */
.map-picker-sheet { padding: 0; display: flex; flex-direction: column; max-height: 85vh; }
.map-picker-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
.map-picker-header .mp-btn { font-size: 15px; color: #333; background: none; border: none; padding: 4px; cursor: pointer; font-family: inherit; }
.map-picker-header .mp-btn.primary { color: var(--primary); font-weight: 500; }
.map-picker-header .mp-title { font-size: 16px; font-weight: 600; color: #333; }
.map-search { padding: 10px 16px; position: relative; }
.map-search-input { width: 100%; background: #f5f5f5; border: none; border-radius: 8px; padding: 10px 12px 10px 36px; font-size: 14px; color: #333; font-family: inherit; outline: none; }
.map-search-input::placeholder { color: #999; }
.map-search-icon { position: absolute; left: 28px; top: 50%; transform: translateY(-50%); color: #999; font-size: 14px; pointer-events: none; }
.map-area { height: 240px; background: #e8f4e9; position: relative; overflow: hidden; flex-shrink: 0; }
.map-area::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(0,0,0,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.05) 1px, transparent 1px); background-size: 40px 40px; }
.map-center-pin { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -100%); color: var(--primary); font-size: 36px; text-shadow: 0 2px 6px rgba(0,0,0,.2); pointer-events: none; line-height: 1; }
.map-location-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.map-location-item { display: flex; align-items: flex-start; padding: 14px 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer; }
.map-location-item:active { background: #f9f9f9; }
.map-location-item.active { background: rgba(26,115,232,0.05); }
.map-location-item .loc-icon { width: 20px; margin-right: 10px; color: #999; font-size: 16px; padding-top: 2px; }
.map-location-item.active .loc-icon { color: var(--primary); }
.map-location-item .loc-info { flex: 1; min-width: 0; }
.map-location-item .loc-name { font-size: 15px; color: #333; font-weight: 500; line-height: 1.4; }
.map-location-item .loc-address { font-size: 12px; color: #999; margin-top: 4px; line-height: 1.4; }
.map-location-item .loc-check { color: var(--primary); font-size: 16px; margin-left: 8px; padding-top: 2px; }
.map-location-empty { padding: 30px 16px; text-align: center; color: #999; font-size: 14px; }

/* 选择器弹窗 */
.picker-trigger {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--input-bg); border: 1px solid var(--input-border); border-radius: var(--radius-sm);
    padding: 11px 12px; font-size: var(--font-sm); color: var(--text-primary); cursor: pointer;
}
.picker-trigger .placeholder { color: var(--text2); }

</style>
</head>
<body>
<div class="phone-frame">
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

        <!-- 固定顶部区域：状态栏 + 导航栏 -->
        <div class="top-sticky">
            <div class="status-bar light">
                <span class="sb-time" id="statusTime">9:41</span>
                <span class="sb-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                    <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
                </span>
            </div>

            <div class="page-hero">
                <div class="ph-back tap" onclick="App.back()">
                    <i class="fa-solid fa-chevron-left"></i>
                </div>
                <div class="ph-title">防汛专项隐患上报</div>
            </div>
        </div>

        <!-- 可滚动内容区 -->
        <div class="content" id="content">

            <!-- 基本信息 -->
            <div class="form-group">
                <div class="form-row">
                    <div class="fr-label"><span class="req">*</span>隐患单位</div>
                    <div class="fr-control">
                        <input type="text" id="unitName" placeholder="请输入隐患单位全称">
                    </div>
                </div>
                <div class="form-row" onclick="openStreetPicker()">
                    <div class="fr-label"><span class="req">*</span>所属街镇</div>
                    <div class="fr-control fr-between">
                        <span class="placeholder" id="streetText">请选择</span>
                        <i class="fa-solid fa-chevron-right arrow"></i>
                    </div>
                    <input type="hidden" id="streetValue">
                </div>
                <div class="form-row vertical">
                    <div class="fr-label-row">
                        <div class="fr-label"><span class="req">*</span>隐患单位地址</div>
                        <div class="map-link" onclick="event.stopPropagation(); openMapPicker()">
                            <i class="fa-solid fa-location-dot"></i>
                            <span>选择地址</span>
                        </div>
                    </div>
                    <div class="fr-control">
                        <textarea rows="2" id="unitAddress" placeholder="请输入地址"></textarea>
                    </div>
                </div>
                <div class="form-row" onclick="openInspectorPicker()">
                    <div class="fr-label">检察人员</div>
                    <div class="fr-control fr-between">
                        <div class="multi-select-tags" id="inspectorTags"></div>
                        <i class="fa-solid fa-chevron-right arrow"></i>
                    </div>
                </div>
            </div>

            <!-- 隐患信息 -->
            <div class="form-group">
                <div class="form-group-title">隐患信息</div>
                <div class="form-row" onclick="openTypePicker()">
                    <div class="fr-label"><span class="req">*</span>隐患类型</div>
                    <div class="fr-control fr-between">
                        <span class="placeholder" id="typeText">请选择</span>
                        <i class="fa-solid fa-chevron-right arrow"></i>
                    </div>
                    <input type="hidden" id="typeValue">
                </div>
                <div class="form-row" onclick="openLevelPicker()">
                    <div class="fr-label"><span class="req">*</span>隐患等级</div>
                    <div class="fr-control fr-between">
                        <span class="placeholder" id="levelText">请选择隐患等级</span>
                        <i class="fa-solid fa-chevron-right arrow"></i>
                    </div>
                    <input type="hidden" id="levelValue">
                </div>
                <div class="form-row">
                    <div class="fr-label">具体点位</div>
                    <div class="fr-control">
                        <input type="text" id="dangerPoint" placeholder="请输入具体位置">
                    </div>
                </div>
                <div class="form-row vertical">
                    <div class="fr-label"><span class="req">*</span>隐患描述</div>
                    <div class="fr-control">
                        <textarea rows="3" id="dangerDetail" maxlength="200" placeholder="监测系统检测到脚手架倾斜速率异常..."></textarea>
                    </div>
                    <div style="text-align:right; font-size:11px; color:#999;">
                        <span id="dangerCount">0</span> / 200
                    </div>
                </div>
                <div class="form-row">
                    <div class="fr-label"><span class="req">*</span>完成时限</div>
                    <div class="fr-control">
                        <input type="date" id="deadline">
                    </div>
                </div>
                <div class="form-row">
                    <div class="fr-label">整改单位</div>
                    <div class="fr-control">
                        <input type="text" id="rectifyUnit" placeholder="请输入整改单位">
                    </div>
                </div>
                <div class="form-row">
                    <div class="fr-label">备注</div>
                    <div class="fr-control">
                        <input type="text" id="remark" placeholder="请输入补充说明（选填）">
                    </div>
                </div>
            </div>

            <!-- 处置认定与依据 -->
            <div class="form-group">
                <div class="form-group-title">处置认定与依据</div>
                <div class="switch-row">
                    <div class="sr-label">是否立案</div>
                    <label class="switch">
                        <input type="checkbox" id="isFiling">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="switch-row">
                    <div class="sr-label">是否移送司法机关</div>
                    <label class="switch">
                        <input type="checkbox" id="isJudicial">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="switch-row">
                    <div class="sr-label">是否曝光约谈或联合惩戒</div>
                    <label class="switch">
                        <input type="checkbox" id="isPunishment">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="form-row vertical">
                    <div class="fr-label">判定依据</div>
                    <div class="fr-control">
                        <textarea rows="3" id="basis" placeholder="请输入执法或判定依据"></textarea>
                    </div>
                </div>
            </div>

            <!-- 现场照片 -->
            <div class="photo-group">
                <div class="photo-group-title">整改前照片 <span class="sub">(1~6张)</span></div>
                <div class="photo-grid" id="beforeGrid">
                    <div class="photo-add tap" onclick="takePhoto()"><i class="fa-solid fa-camera"></i><span class="add-text">拍摄</span></div>
                </div>
                <div class="error-msg" id="beforePhotoError" style="font-size:11px;color:var(--danger);margin-top:6px;min-height:17px;"></div>
            </div>

        </div>

        <div class="bottom-actions">
            <button class="draft-btn tap" onclick="saveDraft()">
                <i class="fa-solid fa-file-arrow-down"></i>
                <span>存草稿</span>
            </button>
            <button class="submit-btn tap" onclick="submitReport()">立即上报</button>
        </div>

        <!-- 地图选点弹窗 -->
        <div class="modal-mask" id="mapPickerMask" onclick="closeMapPicker(event)">
            <div class="modal-sheet map-picker-sheet" onclick="event.stopPropagation()">
                <div class="map-picker-header">
                    <button class="mp-btn" onclick="closeMapPicker()">取消</button>
                    <div class="mp-title">位置</div>
                    <button class="mp-btn primary" onclick="confirmMapPoint()">确定</button>
                </div>
                <div class="map-search">
                    <i class="fa-solid fa-magnifying-glass map-search-icon"></i>
                    <input type="text" class="map-search-input" id="mapSearchInput" placeholder="搜索地点" oninput="filterMapLocations(this.value)">
                </div>
                <div class="map-area" id="mapArea">
                    <div class="map-center-pin" id="mapCenterPin"><i class="fa-solid fa-location-dot"></i></div>
                </div>
                <div class="map-location-list" id="mapLocationList"></div>
            </div>
        </div>

        <!-- 选择器弹窗（街镇 / 隐患类型） -->
        <div class="modal-mask" id="selectorMask" onclick="closeSelector(event)">
            <div class="modal-sheet" onclick="event.stopPropagation()" style="max-height:70vh;">
                <div class="sheet-header">
                    <div class="sheet-title" id="selectorTitle">请选择</div>
                    <div class="sheet-close tap" onclick="closeSelector()"><i class="fa-solid fa-xmark"></i></div>
                </div>
                <div id="selectorList" style="display:flex;flex-direction:column;gap:8px;"></div>
            </div>
        </div>

        <!-- 多选选择器弹窗 -->
        <div class="modal-mask" id="multiSelectorMask" onclick="closeMultiSelector(event)">
            <div class="modal-sheet" onclick="event.stopPropagation()" style="max-height:70vh;">
                <div class="sheet-header">
                    <div class="sheet-title" id="multiSelectorTitle">请选择</div>
                    <div class="sheet-close tap" onclick="closeMultiSelector()"><i class="fa-solid fa-xmark"></i></div>
                </div>
                <div id="multiSelectorList" style="padding: 8px 0;"></div>
                <div class="sheet-footer" style="padding: 12px 16px; border-top: 1px solid #f0f0f0;">
                    <button class="btn btn-primary tap" style="width:100%;" onclick="confirmMultiSelector()">确定</button>
                </div>
            </div>
        </div>

    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    var now = new Date();
    document.getElementById('statusTime').textContent =
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

    var deadline = new Date();
    deadline.setDate(deadline.getDate() + 30);
    document.getElementById('deadline').value = deadline.toISOString().slice(0, 10);

    var streetOptions = ['南桥镇', '奉浦街道', '庄行镇', '金汇镇', '青村镇', '柘林镇', '四团镇', '海湾镇', '西渡街道', '海湾旅游区', '头桥街道'];
    var dangerTypeOptions = ['脚手架工程', '基坑工程', '高大模板', '起重机械', '高处作业', '临时用电', '地下管线', '河道堤防', '户外广告', '地下空间', '其他'];
    var dangerLevelOptions = ['轻微隐患', '一般隐患', '较大隐患', '重大隐患'];
    var currentUserName = (typeof DataStore !== 'undefined' && DataStore.user && DataStore.user.name) || '本人';
    var inspectorOptions = [currentUserName, '张三', '李四', '王五', '赵六'];

    var selectedStreet = '';
    var selectedType = '';
    var selectedLevel = '';
    var selectedInspectors = [currentUserName];
    renderInspectorTags();
    var currentSelector = null;
    var currentMultiSelector = null;
    var tempMultiSelection = [];
    var pickedMapPoint = null;
    var beforePhotos = [];

    var mapLocations = [
        { name: '[位置]', address: '上海市奉贤区金海街道上海术理智能科技有限公司', lat: 30.9123, lng: 121.4726 },
        { name: '术理创新（上海）智能科技股份有限公司', address: '上海市奉贤区东方美谷大道5666号南上海科创中心南塔', lat: 30.9135, lng: 121.4738 },
        { name: '南上海科创中心', address: '上海市奉贤区望园路', lat: 30.9110, lng: 121.4710 },
        { name: '南上海科创中心1号楼', address: '上海市奉贤区东方美谷大道与望园路交叉口西北300米', lat: 30.9140, lng: 121.4745 },
        { name: '东方美谷产业综合服务平台厂房出租', address: '上海市奉贤区东方美谷大道5666号2楼', lat: 30.9105, lng: 121.4705 },
        { name: 'NewPro Bioworks 上海新壹芽生物科技有限公司', address: '上海市奉贤区东方美谷大道5666号1幢5楼', lat: 30.9150, lng: 121.4750 },
        { name: '龙擎空天（上海）智能科技有限公司', address: '上海市奉贤区东方美谷大道5666号1号楼6楼', lat: 30.9095, lng: 121.4695 }
    ];
    var filteredMapLocations = mapLocations.slice();
    var selectedMapLocationIndex = 0;

    document.getElementById('dangerDetail').addEventListener('input', function() {
        document.getElementById('dangerCount').textContent = this.value.length;
        App.clearFieldError('dangerDetail');
    });

    window.openStreetPicker = function() { openSelector('street', '请选择所属街镇', streetOptions, selectedStreet); };
    window.openTypePicker = function() { openSelector('type', '请选择隐患类型', dangerTypeOptions, selectedType); };
    window.openLevelPicker = function() { openSelector('level', '请选择隐患等级', dangerLevelOptions, selectedLevel); };

    function openSelector(type, title, options, selected) {
        currentSelector = type;
        document.getElementById('selectorTitle').textContent = title;
        var list = document.getElementById('selectorList');
        list.innerHTML = options.map(function(opt) {
            var isSelected = opt === selected;
            return '<div class="picker-trigger tap" style="margin-bottom:0;' + (isSelected ? 'border-color:var(--primary);background:rgba(var(--primary-rgb),.08)' : '') + '" onclick="selectOption(\'' + App.escapeHtml(opt).replace(/'/g, "\\'") + '\')">' +
                '<span>' + App.escapeHtml(opt) + '</span>' +
                (isSelected ? '<i class="fa-solid fa-check" style="color:var(--primary)"></i>' : '') +
            '</div>';
        }).join('');
        document.getElementById('selectorMask').classList.add('show');
    }

    window.selectOption = function(value) {
        if (currentSelector === 'street') {
            selectedStreet = value;
            document.getElementById('streetText').textContent = value;
            document.getElementById('streetText').classList.remove('placeholder');
            document.getElementById('streetValue').value = value;
        } else if (currentSelector === 'type') {
            selectedType = value;
            document.getElementById('typeText').textContent = value;
            document.getElementById('typeText').classList.remove('placeholder');
            document.getElementById('typeValue').value = value;
        } else if (currentSelector === 'level') {
            selectedLevel = value;
            document.getElementById('levelText').textContent = value;
            document.getElementById('levelText').classList.remove('placeholder');
            document.getElementById('levelValue').value = value;
        }
        closeSelector();
    };

    window.closeSelector = function(e) {
        if (e && !e.target.classList.contains('modal-mask')) return;
        document.getElementById('selectorMask').classList.remove('show');
    };

    window.openInspectorPicker = function() {
        openMultiSelector('inspector', '请选择检察人员', inspectorOptions, selectedInspectors);
    };

    function openMultiSelector(type, title, options, selected) {
        currentMultiSelector = type;
        tempMultiSelection = selected.slice();
        document.getElementById('multiSelectorTitle').textContent = title;
        renderMultiSelector(options);
        document.getElementById('multiSelectorMask').classList.add('show');
    }

    function renderMultiSelector(options) {
        var list = document.getElementById('multiSelectorList');
        list.innerHTML = options.map(function(opt) {
            var isSelected = tempMultiSelection.indexOf(opt) !== -1;
            return '<div class="multi-select-option ' + (isSelected ? 'selected' : '') + '" onclick="toggleMultiOption(\'' + App.escapeHtml(opt).replace(/'/g, "\\'") + '\')">' +
                '<span>' + App.escapeHtml(opt) + '</span>' +
                '<div class="check-box"><i class="fa-solid fa-check"></i></div>' +
            '</div>';
        }).join('');
    }

    window.toggleMultiOption = function(value) {
        var idx = tempMultiSelection.indexOf(value);
        if (idx === -1) {
            tempMultiSelection.push(value);
        } else {
            tempMultiSelection.splice(idx, 1);
        }
        if (currentMultiSelector === 'inspector') {
            renderMultiSelector(inspectorOptions);
        }
    };

    window.closeMultiSelector = function(e) {
        if (e && !e.target.classList.contains('modal-mask')) return;
        document.getElementById('multiSelectorMask').classList.remove('show');
    };

    window.confirmMultiSelector = function() {
        if (currentMultiSelector === 'inspector') {
            selectedInspectors = tempMultiSelection.slice();
            renderInspectorTags();
        }
        closeMultiSelector();
    };

    function renderInspectorTags() {
        var container = document.getElementById('inspectorTags');
        if (selectedInspectors.length === 0) {
            container.innerHTML = '';
            return;
        }
        container.innerHTML = selectedInspectors.map(function(name) {
            return '<span class="tag">' + App.escapeHtml(name) + '</span>';
        }).join('');
    }

    window.openMapPicker = function() {
        document.getElementById('mapSearchInput').value = '';
        filteredMapLocations = mapLocations.slice();
        selectedMapLocationIndex = 0;
        renderMapLocationList();
        document.getElementById('mapPickerMask').classList.add('show');
    };

    window.closeMapPicker = function(e) {
        if (e && !e.target.classList.contains('modal-mask')) return;
        document.getElementById('mapPickerMask').classList.remove('show');
    };

    function renderMapLocationList() {
        var list = document.getElementById('mapLocationList');
        if (filteredMapLocations.length === 0) {
            list.innerHTML = '<div class="map-location-empty">未找到相关地点</div>';
            return;
        }
        list.innerHTML = filteredMapLocations.map(function(loc, idx) {
            var isSelected = idx === selectedMapLocationIndex;
            return '<div class="map-location-item ' + (isSelected ? 'active' : '') + '" onclick="selectMapLocation(' + idx + ')">' +
                '<div class="loc-icon"><i class="fa-solid ' + (isSelected ? 'fa-location-dot' : 'fa-map-pin') + '"></i></div>' +
                '<div class="loc-info">' +
                    '<div class="loc-name">' + App.escapeHtml(loc.name) + '</div>' +
                    '<div class="loc-address">' + App.escapeHtml(loc.address) + '</div>' +
                '</div>' +
                (isSelected ? '<div class="loc-check"><i class="fa-solid fa-check"></i></div>' : '') +
            '</div>';
        }).join('');
    }

    window.filterMapLocations = function(keyword) {
        var k = keyword.trim().toLowerCase();
        if (!k) {
            filteredMapLocations = mapLocations.slice();
        } else {
            filteredMapLocations = mapLocations.filter(function(loc) {
                return loc.name.toLowerCase().indexOf(k) !== -1 || loc.address.toLowerCase().indexOf(k) !== -1;
            });
        }
        selectedMapLocationIndex = 0;
        renderMapLocationList();
    };

    window.selectMapLocation = function(idx) {
        selectedMapLocationIndex = idx;
        pickedMapPoint = {
            lat: filteredMapLocations[idx].lat,
            lng: filteredMapLocations[idx].lng
        };
        renderMapLocationList();
    };

    window.confirmMapPoint = function() {
        var loc = filteredMapLocations[selectedMapLocationIndex];
        if (!loc) {
            App.showToast('请选择位置');
            return;
        }
        pickedMapPoint = { lat: loc.lat, lng: loc.lng };
        document.getElementById('unitAddress').value = loc.address;
        closeMapPicker();
        App.showToast('已选择：' + loc.name);
    };

    function renderPhotos() {
        var grid = document.getElementById('beforeGrid');
        var html = '';
        beforePhotos.forEach(function(url, i) {
            html += '<div class="photo-thumb" style="background-image:url(' + url + ')"><div class="remove" onclick="removePhoto(' + i + ')"><i class="fa-solid fa-xmark"></i></div></div>';
        });
        if (beforePhotos.length < 6) {
            html += '<div class="photo-add tap" onclick="takePhoto()"><i class="fa-solid fa-camera"></i><span class="add-text">拍摄</span></div>';
        }
        grid.innerHTML = html;
    }

    window.takePhoto = function() {
        if (beforePhotos.length >= 6) {
            App.showToast('整改前照片最多 6 张');
            return;
        }
        App.takePhoto().then(function(url) {
            beforePhotos.push(url);
            renderPhotos();
            document.getElementById('beforePhotoError').textContent = '';
        });
    };

    window.removePhoto = function(idx) {
        beforePhotos.splice(idx, 1);
        renderPhotos();
    };

    function collectData() {
        return {
            unitName: document.getElementById('unitName').value.trim(),
            street: selectedStreet,
            address: document.getElementById('unitAddress').value.trim(),
            inspectors: selectedInspectors.slice(),
            dangerDetail: document.getElementById('dangerDetail').value.trim(),
            dangerType: selectedType,
            dangerLevel: selectedLevel,
            dangerPoint: document.getElementById('dangerPoint').value.trim(),
            deadline: document.getElementById('deadline').value,
            rectifyUnit: document.getElementById('rectifyUnit').value.trim(),
            remark: document.getElementById('remark').value.trim(),
            isFiling: document.getElementById('isFiling').checked,
            isJudicial: document.getElementById('isJudicial').checked,
            isPunishment: document.getElementById('isPunishment').checked,
            basis: document.getElementById('basis').value.trim(),
            beforePhotos: beforePhotos.slice(),
            mapPoint: pickedMapPoint,
            reportTime: new Date().toISOString()
        };
    }

    function fillData(data) {
        if (!data) return;
        document.getElementById('unitName').value = data.unitName || '';
        selectedStreet = data.street || '';
        if (selectedStreet) {
            document.getElementById('streetText').textContent = selectedStreet;
            document.getElementById('streetText').classList.remove('placeholder');
            document.getElementById('streetValue').value = selectedStreet;
        }
        document.getElementById('unitAddress').value = data.address || '';
        selectedInspectors = Array.isArray(data.inspectors) && data.inspectors.length > 0 ? data.inspectors.slice() : [currentUserName];
        renderInspectorTags();
        document.getElementById('dangerDetail').value = data.dangerDetail || '';
        document.getElementById('dangerCount').textContent = (data.dangerDetail || '').length;
        selectedType = data.dangerType || '';
        if (selectedType) {
            document.getElementById('typeText').textContent = selectedType;
            document.getElementById('typeText').classList.remove('placeholder');
            document.getElementById('typeValue').value = selectedType;
        }
        var levelMap = { general: '一般隐患', major: '重大隐患' };
        selectedLevel = levelMap[data.dangerLevel] || data.dangerLevel || '';
        if (selectedLevel) {
            document.getElementById('levelText').textContent = selectedLevel;
            document.getElementById('levelText').classList.remove('placeholder');
            document.getElementById('levelValue').value = selectedLevel;
        }
        document.getElementById('dangerPoint').value = data.dangerPoint || '';
        document.getElementById('deadline').value = data.deadline || '';
        document.getElementById('rectifyUnit').value = data.rectifyUnit || '';
        document.getElementById('remark').value = data.remark || '';
        document.getElementById('isFiling').checked = !!data.isFiling;
        document.getElementById('isJudicial').checked = !!data.isJudicial;
        document.getElementById('isPunishment').checked = !!data.isPunishment;
        document.getElementById('basis').value = data.basis || '';
        beforePhotos = (data.beforePhotos || []).slice();
        pickedMapPoint = data.mapPoint || null;
        renderPhotos();
    }

    function loadDraft() {
        var draft = localStorage.getItem('flood-special-hidden-danger-draft');
        if (!draft) return;
        try {
            var data = JSON.parse(draft);
            if (Date.now() - data._savedAt < 7 * 24 * 60 * 60 * 1000) {
                fillData(data);
            }
        } catch (e) {}
    }
    loadDraft();

    function validate() {
        App.clearFormErrors();
        document.getElementById('beforePhotoError').textContent = '';

        var errors = [];
        if (!document.getElementById('unitName').value.trim()) errors.push('请填写隐患单位');
        if (!selectedStreet) errors.push('请选择所属街镇');
        if (!document.getElementById('unitAddress').value.trim()) errors.push('请填写隐患单位地址');
        if (!document.getElementById('dangerDetail').value.trim()) errors.push('请填写具体问题隐患');
        if (!selectedType) errors.push('请选择隐患类型');
        if (!selectedLevel) errors.push('请选择隐患等级');
        if (!document.getElementById('deadline').value) errors.push('请选择完成时限');
        if (beforePhotos.length === 0) errors.push('请至少上传 1 张整改前照片');

        if (errors.length > 0) {
            App.showToast(errors[0]);
            return false;
        }
        return true;
    }

    window.saveDraft = function() {
        var data = collectData();
        data._savedAt = Date.now();
        localStorage.setItem('flood-special-hidden-danger-draft', JSON.stringify(data));
        App.showToast('已存为草稿');
    };

    window.submitReport = function() {
        if (!validate()) return;

        var data = collectData();
        App.showLoading('上报中...');
        setTimeout(function() {
            var eventNo = 'FX-' + new Date().getFullYear() + '-' + String(Date.now()).slice(-6);
            var report = {
                id: eventNo,
                source: '防汛专项隐患',
                status: 'reported'
            };
            for (var key in data) {
                if (data.hasOwnProperty(key)) report[key] = data[key];
            }

            var list = [];
            try { list = JSON.parse(localStorage.getItem('floodSpecialHiddenDangers') || '[]'); } catch (e) {}
            list.unshift(report);
            localStorage.setItem('floodSpecialHiddenDangers', JSON.stringify(list));

            localStorage.removeItem('flood-special-hidden-danger-draft');

            App.hideLoading();
            App.showToast('上报成功，事件编号：' + eventNo);
            setTimeout(function() {
                App.go('disaster-management-list.html');
            }, 1500);
        }, 600);
    };
})();
</script>
</body>
</html>
