<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>风险管控 · 工作台</title>
<script>
// 工作台已按角色拆分为独立页面，此处按当前角色重定向到对应工作台
(function () {
    var role = localStorage.getItem('risk-role');
    if (role !== 'inspector' && role !== 'manager' && role !== 'enterprise') {
        role = 'manager';
    }
    window.location.replace('workspace-' + role + '.html');
})();
</script>
</head>
<body></body>
</html>
