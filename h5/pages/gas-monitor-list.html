<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>风险隐患监测</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/tokens.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/h5-frame.css">
    <style>
        
        .knowledge-hero {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #1d4ed8 100%);
            margin-top: -34px;
            padding: calc(34px + 4px) 18px 12px;
            color: #fff;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .knowledge-hero::before {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            right: -50px;
            top: -20px;
            background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%);
            border-radius: 50%;
        }
        .knowledge-hero .kh-back {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            cursor: pointer;
        }
        .knowledge-hero .hero-title { flex: 1; position: relative; z-index: 2; text-align: center; padding-right: 32px; }
        .knowledge-hero h1 { font-size: 17px; font-weight: 600; }

        .law-body {
            flex: 1;
            overflow-y: auto;
            padding: var(--space);
            background: var(--bg-dark);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .law-body::-webkit-scrollbar { display: none; }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .kpi-item { text-align: center; padding: 8px 4px; }
        .kpi-value { font-size: 22px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
        .kpi-value.normal { color: var(--success); }
        .kpi-value.warning { color: var(--dot-yellow); }
        .kpi-value.alarm { color: var(--dot-red); }
        .kpi-label { font-size: 11px; color: var(--text2); }

        .quick-filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .quick-filter-bar::-webkit-scrollbar { display: none; }
        .filter-btn {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text2);
            transition: all 0.2s;
            white-space: nowrap;
        }
        .filter-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .monitor-list { display: flex; flex-direction: column; gap: 10px; }
        .monitor-card {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 10px var(--shadow);
            border: 1px solid var(--border);
        }
        .monitor-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            border-radius: 12px 0 0 12px;
        }
        .monitor-card.normal::before { background: var(--success); }
        .monitor-card.warning::before { background: var(--dot-yellow); }
        .monitor-card.alarm::before { background: var(--dot-red); }

        .monitor-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .monitor-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            line-height: 1.4;
        }
        .monitor-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
            white-space: nowrap;
        }
        .monitor-status.normal { background: rgba(30,142,62,0.12); color: var(--success); }
        .monitor-status.warning { background: rgba(249,171,0,0.16); color: #c68400; }
        .monitor-status.alarm { background: rgba(217,48,37,0.12); color: var(--dot-red); }
        .monitor-status i { font-size: 10px; }

        .monitor-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        .info-item { display: flex; flex-direction: column; gap: 2px; }
        .info-label { font-size: 11px; color: var(--text2); }
        .info-value {
            font-size: 13px;
            color: var(--text-primary);
            font-weight: 500;
        }
        .info-value.current-value { font-size: 18px; font-weight: 700; }
        .info-value.current-value.normal { color: var(--success); }
        .info-value.current-value.warning { color: var(--dot-yellow); }
        .info-value.current-value.alarm { color: var(--dot-red); }

        .monitor-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .update-time { font-size: 11px; color: var(--text2); }

        .bottom-spacer { height: 20px; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text2); }
        .empty-state i { font-size: 48px; margin-bottom: 16px; color: var(--border); }
        .empty-state p { font-size: 14px; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="side-button side-button-left mute"></div>
        <div class="side-button side-button-left volume-up"></div>
        <div class="side-button side-button-left volume-down"></div>
        <div class="side-button side-button-right power"></div>
        <div class="phone-shell">
            <div class="status-bar light">
                <span class="sb-time" id="statusTime">9:41</span>
                <span class="sb-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                    <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
                </span>
            </div>

            <div class="knowledge-hero">
                <div class="kh-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
                <div class="hero-title">
                    <h1>风险隐患监测</h1>
                </div>
            </div>

            <div class="law-body">
                <!-- 统计卡片 -->
                <div class="card anim d1">
                    <div class="kpi-grid">
                        <div class="kpi-item">
                            <div class="kpi-value normal" id="normalCount">5</div>
                            <div class="kpi-label">正常</div>
                        </div>
                        <div class="kpi-item">
                            <div class="kpi-value warning" id="warningCount">2</div>
                            <div class="kpi-label">预警</div>
                        </div>
                        <div class="kpi-item">
                            <div class="kpi-value alarm" id="alarmCount">1</div>
                            <div class="kpi-label">报警</div>
                        </div>
                    </div>
                </div>

                <!-- 筛选栏 -->
                <div class="quick-filter-bar anim d2">
                    <button class="filter-btn active" data-filter="all" onclick="filterDevices('all')">全部</button>
                    <button class="filter-btn" data-filter="normal" onclick="filterDevices('normal')">正常</button>
                    <button class="filter-btn" data-filter="warning" onclick="filterDevices('warning')">预警</button>
                    <button class="filter-btn" data-filter="alarm" onclick="filterDevices('alarm')">报警</button>
                </div>

                <!-- 监测点列表 -->
                <div class="monitor-list anim d3" id="monitorList">
                    <!-- 数据由JS生成 -->
                </div>

                <div class="bottom-spacer"></div>
            </div>
        </div>
    </div>

    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/risk-data.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>
        // 监测设备数据
        const monitorData = [
            {
                id: 'IOT-001',
                name: '南桥调压站压力监测',
                indicator: '出口压力',
                value: '0.25',
                unit: 'MPa',
                status: 'normal',
                updateTime: '2025-06-26 14:32:18',
                location: '奉贤区南桥镇解放路中段'
            },
            {
                id: 'IOT-002',
                name: '奉浦阀门井浓度监测',
                indicator: '燃气浓度',
                value: '15.2',
                unit: '%LEL',
                status: 'warning',
                updateTime: '2025-06-26 14:30:05',
                location: '奉贤区奉浦街道环城东路'
            },
            {
                id: 'IOT-003',
                name: '金汇管道温度监测',
                indicator: '管道温度',
                value: '42.5',
                unit: '℃',
                status: 'alarm',
                updateTime: '2025-06-26 14:28:33',
                location: '奉贤区金汇镇金汇路'
            },
            {
                id: 'IOT-004',
                name: '南桥储配站液位监测',
                indicator: '储罐液位',
                value: '68.5',
                unit: '%',
                status: 'normal',
                updateTime: '2025-06-26 14:25:12',
                location: '奉贤区南桥镇解放路'
            },
            {
                id: 'IOT-005',
                name: '奉浦流量计监测',
                indicator: '瞬时流量',
                value: '1250',
                unit: 'm³/h',
                status: 'normal',
                updateTime: '2025-06-26 14:22:48',
                location: '奉贤区奉浦街道肖塘路'
            },
            {
                id: 'IOT-006',
                name: '南桥加臭剂浓度监测',
                indicator: '加臭剂浓度',
                value: '18.5',
                unit: 'mg/m³',
                status: 'warning',
                updateTime: '2025-06-26 14:20:15',
                location: '奉贤区南桥镇解放路'
            },
            {
                id: 'IOT-007',
                name: '金汇调压器开度监测',
                indicator: '阀门开度',
                value: '85.2',
                unit: '%',
                status: 'normal',
                updateTime: '2025-06-26 14:18:42',
                location: '奉贤区金汇镇金汇路'
            },
            {
                id: 'IOT-008',
                name: '奉浦阴保电位监测',
                indicator: '保护电位',
                value: '-0.85',
                unit: 'V',
                status: 'normal',
                updateTime: '2025-06-26 14:15:30',
                location: '奉贤区奉浦街道环城东路'
            }
        ];

        // 状态映射
        const statusMap = {
            normal: { label: '正常', class: 'normal', icon: 'fa-circle-check' },
            warning: { label: '预警', class: 'warning', icon: 'fa-triangle-exclamation' },
            alarm: { label: '报警', class: 'alarm', icon: 'fa-circle-exclamation' }
        };

        // 渲染监测列表
        function renderMonitorList(filter) {
            filter = filter || 'all';
            const listEl = document.getElementById('monitorList');
            const filteredData = filter === 'all'
                ? monitorData
                : monitorData.filter(function(item) { return item.status === filter; });

            if (filteredData.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-inbox"></i>
                        <p>暂无数据</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = filteredData.map(function(item) {
                const status = statusMap[item.status];
                return `
                    <div class="monitor-card ${status.class}" data-status="${item.status}">
                        <div class="monitor-header">
                            <div class="monitor-name">${item.name}</div>
                            <div class="monitor-status ${status.class}">
                                <i class="fa-solid ${status.icon}"></i>
                                <span>${status.label}</span>
                            </div>
                        </div>
                        <div class="monitor-info">
                            <div class="info-item">
                                <span class="info-label">监测指标</span>
                                <span class="info-value">${item.indicator}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">当前数值</span>
                                <span class="info-value current-value ${status.class}">${item.value} <small style="font-size:12px;font-weight:400">${item.unit}</small></span>
                            </div>
                        </div>
                        <div class="monitor-footer">
                            <span class="update-time"><i class="fa-regular fa-clock" style="margin-right:4px"></i>${item.updateTime}</span>
                            <button class="btn btn-sm btn-primary" onclick="goToDetail('${item.id}')">
                                <span>详情</span>
                                <i class="fa-solid fa-chevron-right" style="font-size:10px; margin-left:4px;"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 筛选设备
        function filterDevices(status) {
            // 更新筛选按钮状态
            document.querySelectorAll('.filter-btn').forEach(function(tag) {
                tag.classList.toggle('active', tag.dataset.filter === status);
            });
            // 渲染列表
            renderMonitorList(status);
        }

        // 跳转到详情页
        function goToDetail(deviceId) {
            App.go('gas-monitor-detail.html?id=' + deviceId);
        }

        // 初始化
        renderMonitorList();
    </script>
</body>
</html>
