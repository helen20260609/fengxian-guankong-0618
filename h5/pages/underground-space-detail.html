<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>地下空间详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.status-bar { position: relative; z-index: 100; }
.page-hero { position: relative; z-index: 99; display: flex; flex-direction: column; align-items: center; padding: calc(34px + 16px) 18px 42px; }

.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; }
.content-sheet.page-body-sheet { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 0 0 16px; background: #f5f6fa; margin-top: 0; border-radius: 0; }
.content-sheet.page-body-sheet::-webkit-scrollbar { display: none; }

.hero-card {
    background: linear-gradient(180deg, #1557b0 0%, #1a73e8 100%);
    border-radius: 12px;
    margin: 12px 16px 14px;
    padding: 18px 16px;
    color: #fff;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(26,115,232,.22);
}
.hero-card::before {
    content: '';
    position: absolute;
    width: 120px;
    height: 120px;
    right: -30px;
    top: -30px;
    background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%);
    border-radius: 50%;
}
.hero-card .ug-title { font-size: 20px; font-weight: 700; position: relative; z-index: 1; line-height: 1.35; word-break: break-word; }
.hero-card .ug-address { font-size: 13px; opacity: .9; margin-top: 8px; position: relative; z-index: 1; display: flex; align-items: center; gap: 6px; }
.hero-card .ug-address i { font-size: 12px; }
.hero-card .ug-board {
    display: flex;
    align-items: center;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.15);
    position: relative;
    z-index: 1;
}
.hero-card .ug-board-item {
    flex: 1;
    font-size: 13px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.hero-card .ug-board-item + .ug-board-item {
    padding-left: 12px;
    margin-left: 12px;
    border-left: 1px solid rgba(255,255,255,.2);
    flex-shrink: 0;
}
.hero-card .ug-board-item .label { opacity: .85; flex-shrink: 0; }
.hero-card .ug-board-item .value { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero-card .ug-board-item .value i { font-size: 12px; margin-right: 2px; }
.hero-card .ug-unit { font-size: 13px; opacity: .95; margin-top: 10px; position: relative; z-index: 1; }

.action-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 0 16px 14px;
}
.action-grid-cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all .15s;
}
.action-grid-cell:active { transform: scale(.97); }
.action-grid-cell.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.action-grid-cell .ag-icon { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.action-grid-cell .ag-icon.phone { background: rgba(30,142,62,.12); color: var(--success); }
.action-grid-cell .ag-icon.map { background: rgba(26,115,232,.1); color: var(--primary); }
.action-grid-cell .ag-label { font-size: 12px; color: var(--text-primary); font-weight: 500; }

.section-v2 { background: var(--card); border-radius: 12px; margin: 0 16px 12px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid var(--border); }
.section-v2:last-of-type { margin-bottom: 16px; }
.sv2-head { margin-bottom: 10px; }
.sv2-title { font-size: 15px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 0; position: relative; padding-left: 10px; }
.sv2-title::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--primary); }

.sc-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); gap: 16px; }
.sc-row.wrap { align-items: flex-start; }
.sc-row:last-child { border-bottom: none; padding-bottom: 0; }
.sc-label { font-size: 14px; color: var(--text2); text-align: left; line-height: 1.4; flex-shrink: 0; }
.sc-value { flex: 1; min-width: 0; font-size: 14px; color: var(--text-primary); font-weight: 500; text-align: right; line-height: 1.4; word-break: break-word; white-space: normal; }
.sc-value.phone { color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; cursor: pointer; }
.sc-value.phone i { font-size: 12px; }
.sc-value.mono { font-family: 'SF Mono', monospace; }
.sc-value.long { white-space: pre-wrap; line-height: 1.6; text-align: right; }
.sc-row.wrap { align-items: flex-start; }
.sc-row.wrap .sc-label { padding-top: 2px; }
.sc-row.wrap .sc-value.long { flex: 1 1 100%; margin-top: 8px; text-align: right; }
.drainage-tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; border: 1px solid; }
.drainage-tag.yes { color: var(--success); border-color: rgba(30,142,62,.35); background: rgba(30,142,62,.06); }
.drainage-tag.no { color: var(--danger); border-color: rgba(217,48,37,.35); background: rgba(217,48,37,.06); }
.drainage-tag.unknown { color: var(--text2); border-color: rgba(100,100,100,.35); background: rgba(100,100,100,.08); }

.bottom-spacer { height: 20px; }

:root[data-theme="dark"] .section-v2 { background: var(--bg-card); }
:root[data-theme="dark"] .hero-card { background: linear-gradient(180deg, #0d2a5c 0%, #1a73e8 100%); }
:root[data-theme="dark"] .action-grid-cell { background: var(--bg-card); border-color: var(--border); }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title">地下空间详情</div>
        </div>

        <div class="content-sheet page-body-sheet" style="padding:0 0 16px">
            <div class="hero-card">
                <div class="ug-title" id="ugTitle">--</div>
                <div class="ug-address" id="ugAddress"><i class="fa-solid fa-location-dot"></i>--</div>
                <div class="ug-board">
                    <div class="ug-board-item">
                        <span class="label">类别：</span>
                        <span class="value" id="ugCategory">--</span>
                    </div>
                    <div class="ug-board-item">
                        <span class="label">排水设施：</span>
                        <span class="value" id="ugDrainage">--</span>
                    </div>
                </div>
                <div class="ug-unit" id="ugUnit">--</div>
            </div>

            <div class="action-grid">
                <div class="action-grid-cell" id="callPhoneAction">
                    <div class="ag-icon phone"><i class="fa-solid fa-phone"></i></div>
                    <div class="ag-label">拨打负责人</div>
                </div>
                <div class="action-grid-cell" id="mapViewAction">
                    <div class="ag-icon map"><i class="fa-solid fa-map-location-dot"></i></div>
                    <div class="ag-label">在地图中查看</div>
                </div>
            </div>

            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">基本信息</div></div>
                <div id="basicInfo"></div>
            </div>

            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">填报信息</div></div>
                <div id="reportInfo"></div>
            </div>

            <div class="bottom-spacer"></div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../../data/underground-space-data.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    function normalizeDrainage(v) {
        var s = String(v || '').trim();
        if (s === '有' || s === '是' || s === 'true' || s === '1') return '有';
        return '无';
    }

    function loadData() {
        var id = App.getQuery('id');
        var fromStorage = null;
        try { fromStorage = JSON.parse(localStorage.getItem('undergroundSpaceData') || '[]'); } catch (e) {}
        var list = (Array.isArray(fromStorage) && fromStorage.length) ? fromStorage : (typeof undergroundSpaceData !== 'undefined' ? undergroundSpaceData : []);
        if (id) {
            var found = list.find(function(i) { return String(i.id) === String(id); });
            if (found) return found;
            found = list.find(function(i) { return String(i.no) === String(id); });
            if (found) return found;
        }
        return list[0];
    }

    var item = loadData() || {};
    item._drainage = normalizeDrainage(item.hasDrainageFacility);

    function getVal(v) { return v && String(v).trim() ? v : '—'; }

    function renderInfoGrid(pairs) {
        return pairs.map(function(p) {
            var valueHtml = p.long
                ? '<div class="sc-value long">' + p.value + '</div>'
                : '<div class="sc-value ' + (p.cls || '') + '"' + (p.id ? ' id="' + p.id + '"' : '') + '>' + p.value + '</div>';
            return '<div class="sc-row ' + (p.long ? 'wrap' : '') + '"><div class="sc-label">' + p.label + '</div>' + valueHtml + '</div>';
        }).join('');
    }

    function renderHero() {
        document.getElementById('ugTitle').textContent = item.name || '—';
        document.getElementById('ugAddress').innerHTML = '<i class="fa-solid fa-location-dot"></i>' + App.escapeHtml(getVal(item.address));
        document.getElementById('ugCategory').textContent = item.category || '—';
        document.getElementById('ugDrainage').textContent = item._drainage;
        var unitHtml = '管理单位：' + App.escapeHtml(getVal(item.managementUnit));
        if (item.manager && String(item.manager).trim()) {
            unitHtml += ' (负责人: ' + App.escapeHtml(item.manager) + ')';
        }
        document.getElementById('ugUnit').innerHTML = unitHtml;
    }

    function renderActions() {
        var callAction = document.getElementById('callPhoneAction');
        if (!item.contactPhone || !String(item.contactPhone).trim()) {
            callAction.classList.add('disabled');
        } else {
            callAction.addEventListener('click', function() {
                window.location.href = 'tel:' + item.contactPhone;
                App.showToast('正在呼叫 ' + App.escapeHtml(item.contactPhone));
            });
        }

        var mapAction = document.getElementById('mapViewAction');
        if (!item.address || !String(item.address).trim()) {
            mapAction.classList.add('disabled');
        } else {
            mapAction.addEventListener('click', function() {
                var url = 'https://uri.amap.com/search?keyword=' + encodeURIComponent(item.address) +
                    '&src=' + encodeURIComponent('奉贤风险管控');
                window.open(url, '_blank');
            });
        }
    }

    function renderBasicInfo() {
        var areaText = item.area && String(item.area).trim() ? (parseFloat(item.area).toLocaleString() + ' ㎡') : '—';
        var phoneVal = item.contactPhone && String(item.contactPhone).trim()
            ? '<span class="phone"><i class="fa-solid fa-phone"></i> ' + App.escapeHtml(item.contactPhone) + '</span>'
            : App.escapeHtml('—');
        var rows = [
            { label: '名称', value: App.escapeHtml(getVal(item.name)) },
            { label: '类别', value: item.category ? '<span style="color:var(--primary);font-weight:600">' + App.escapeHtml(item.category) + '</span>' : '—' },
            { label: '建筑面积', value: App.escapeHtml(areaText) },
            { label: '排水设施', value: App.escapeHtml(item._drainage) },
            { label: '地址', value: App.escapeHtml(getVal(item.address)), long: true },
            { label: '管理单位', value: App.escapeHtml(getVal(item.managementUnit)) },
            { label: '负责人', value: App.escapeHtml(getVal(item.manager)) },
            { label: '联系方式', value: phoneVal, cls: 'phone', id: 'phoneValue' }
        ];
        document.getElementById('basicInfo').innerHTML = renderInfoGrid(rows);

        var phoneEl = document.getElementById('phoneValue');
        if (phoneEl && item.contactPhone && String(item.contactPhone).trim()) {
            phoneEl.addEventListener('click', function() {
                window.location.href = 'tel:' + item.contactPhone;
                App.showToast('正在呼叫 ' + App.escapeHtml(item.contactPhone));
            });
        }
    }

    function renderReportInfo() {
        var rows = [
            { label: '填报单位', value: App.escapeHtml(getVal(item.reportUnit)) },
            { label: '填报人', value: App.escapeHtml(getVal(item.reporter)) },
            { label: '填报日期', value: App.escapeHtml(getVal(item.reportDate)) }
        ];
        document.getElementById('reportInfo').innerHTML = renderInfoGrid(rows);
    }

    function init() {
        renderHero();
        renderActions();
        renderBasicInfo();
        renderReportInfo();

        var now = new Date();
        document.getElementById('statusTime').textContent =
            String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    init();
})();
</script>
</body>
</html>
