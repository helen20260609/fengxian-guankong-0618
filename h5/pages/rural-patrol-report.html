<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>农村自建房现场巡查</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/tokens.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/h5-frame.css">
    <script src="../assets/js/risk-data.js"></script>
    <style>
        
        .knowledge-hero {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #1d4ed8 100%);
            margin-top: -34px;
            padding: calc(34px + 4px) 18px 0;
            color: #fff;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .knowledge-hero::before {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            right: -50px;
            top: -20px;
            background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%);
            border-radius: 50%;
        }
        .knowledge-hero .kh-back {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            cursor: pointer;
        }
        .knowledge-hero .hero-title { flex: 1; position: relative; z-index: 2; text-align: center; padding-right: 32px; }
        .knowledge-hero h1 { font-size: 17px; font-weight: 600; }

        .law-body {
            flex: 1;
            overflow-y: auto;
            padding: 0 0 var(--space);
            background: var(--bg-dark);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .law-body::-webkit-scrollbar { display: none; }

        .hero-card {
            background: var(--card);
            width: 100%;
            padding: var(--space);
            box-sizing: border-box;
            border-bottom: 1px solid var(--border);
            border-radius: 0;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 var(--space);
            margin-top: var(--space);
        }
        .card-title i { color: var(--primary); font-size: 15px; }

        .hero-project {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4;
            margin-bottom: 6px;
        }
        .hero-task {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hero-task i { color: var(--primary); font-size: 15px; }
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px;
        }
        .hero-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .hero-item.full-width { grid-column: 1 / -1; }
        .hero-item i {
            font-size: 13px;
            color: var(--text2);
            width: 14px;
            text-align: center;
            display: none;
        }
        .hero-item .label {
            color: var(--text2);
            white-space: nowrap;
            font-size: 13px;
        }
        .hero-item .value {
            color: var(--text-primary);
            font-weight: 500;
            font-size: 13px;
        }

        .tip-card {
            background: rgba(var(--primary-rgb), 0.08);
            border: 1px solid rgba(var(--primary-rgb), 0.2);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .tip-card i { color: var(--primary); font-size: 18px; margin-top: 2px; }
        .tip-card .tip-text { font-size: 13px; color: var(--primary); line-height: 1.6; }

        .progress-bar-sticky {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--card);
            padding: 12px var(--space);
            border-bottom: 1px solid var(--border);
            width: 100%;
            box-sizing: border-box;
            border-radius: 0;
        }
        .progress-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text2);
            margin-bottom: 8px;
        }
        .progress-stats .stat-done { color: var(--success); font-weight: 600; }
        .progress-stats .stat-risk { color: var(--dot-red); font-weight: 600; }
        .progress-stats .stat-extra { color: var(--primary); font-weight: 600; }
        .progress-track {
            height: 8px;
            background: rgba(var(--primary-rgb), 0.12);
            border-radius: 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 0;
            transition: width 0.3s ease;
        }

        .bottom-drawer-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .bottom-drawer-overlay.active { opacity: 1; visibility: visible; }
        .bottom-drawer {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            background: var(--card);
            border-radius: 16px 16px 0 0;
            z-index: 201;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
            height: 70vh;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        .bottom-drawer.active { transform: translateY(0); }
        .bottom-drawer-handle {
            width: 40px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: 12px auto 8px;
        }
        .bottom-drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 12px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .bottom-drawer-header .drawer-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .bottom-drawer-header .drawer-close {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: var(--bg-dark);
            color: var(--text2);
            cursor: pointer;
            border: none;
            font-size: 16px;
        }
        .bottom-drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            -webkit-overflow-scrolling: touch;
        }
        .bottom-drawer-body::-webkit-scrollbar { display: none; }
        .bottom-drawer-footer {
            padding: 12px 20px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .bottom-drawer-footer .btn {
            flex: 1;
            padding: 14px 0;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-cancel {
            background: var(--bg-dark);
            color: var(--text2);
            border: 1px solid var(--border);
        }
        .btn-confirm {
            background: var(--primary);
            color: #fff;
        }

        .risk-card {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 10px var(--shadow);
            border: 1px solid var(--border);
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }
        .risk-card:hover { box-shadow: 0 4px 14px var(--shadow); }
        .risk-card.collapsed .risk-info { display: none; }
        .risk-card.completed { opacity: 0.7; }
        .risk-card.completed .risk-header::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: var(--success);
            margin-left: 8px;
            font-size: 16px;
        }
        .risk-card.completed.collapsed { padding: 12px 14px; }
        .risk-card.completed.collapsed .risk-header { margin-bottom: 0; }
        .risk-card.completed.collapsed .risk-level { display: none; }

        .risk-card .risk-judge-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 12px 0 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .risk-card .risk-judge-label i { color: var(--primary); font-size: 16px; }

        .risk-expand-form { display: none; }
        .form-row { margin-bottom: 16px; }
        .form-row:last-child { margin-bottom: 0; }
        .form-row label {
            display: block;
            font-size: 13px;
            color: var(--text-primary);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-row input,
        .form-row textarea,
        .form-row select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 13px;
            background: var(--input-bg);
            color: var(--text-primary);
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .form-row input:focus,
        .form-row textarea:focus,
        .form-row select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.08);
        }
        .form-row textarea { min-height: 60px; resize: vertical; }
        .form-row .photo-upload { display: flex; gap: 8px; flex-wrap: wrap; }
        .photo-upload .photo-box {
            width: 70px;
            height: 70px;
            border: 2px dashed var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text2);
            font-size: 20px;
            cursor: pointer;
            background: var(--input-bg);
        }
        .photo-upload .photo-box:active { background: var(--bg-dark); }
        .photo-upload .photo-preview {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
        }

        .risk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .risk-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            line-height: 1.4;
        }
        .risk-level {
            display: inline-flex;
            align-items: center;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            margin-left: 8px;
        }
        .risk-level.red { background: rgba(217,48,37,0.12); color: var(--dot-red); }
        .risk-level.orange { background: rgba(227,116,0,0.12); color: var(--dot-orange); }
        .risk-level.yellow { background: rgba(249,171,0,0.16); color: #c68400; }
        .risk-level.blue { background: rgba(26,115,232,0.12); color: var(--primary); }

        .risk-tag {
            display: inline-flex;
            align-items: center;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            margin-left: 8px;
        }
        .risk-tag.red { background: rgba(217,48,37,0.12); color: var(--dot-red); }
        .risk-tag.orange { background: rgba(227,116,0,0.12); color: var(--dot-orange); }

        .risk-info {
            font-size: 13px;
            color: var(--text2);
            line-height: 1.8;
            margin-bottom: 12px;
            padding: 10px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .risk-info-row { margin-bottom: 6px; }
        .risk-info-row:last-child { margin-bottom: 0; }
        .risk-info-row .label {
            color: var(--text2);
            font-size: 13px;
            display: block;
            margin-bottom: 4px;
        }
        .risk-info-row .value {
            color: var(--text-primary);
            font-size: 13px;
            display: block;
        }

        /* 风险识别单选组 */
        .risk-radio-group { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
        .risk-radio-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            line-height: 1.5;
        }
        .risk-radio-item:active { transform: scale(0.98); }
        .risk-radio-item input[type="radio"] {
            margin-top: 2px;
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        .risk-radio-item .radio-label { flex: 1; }
        .risk-radio-item.blue   { border-left: 3px solid var(--primary); background: rgba(26,115,232,0.06); }
        .risk-radio-item.yellow { border-left: 3px solid #c68400; background: rgba(249,171,0,0.06); }
        .risk-radio-item.orange { border-left: 3px solid var(--dot-orange); background: rgba(227,116,0,0.06); }
        .risk-radio-item.red    { border-left: 3px solid var(--dot-red); background: rgba(217,48,37,0.06); }
        .risk-radio-item.blue.selected   { background: rgba(26,115,232,0.14); border-color: var(--primary); }
        .risk-radio-item.yellow.selected { background: rgba(249,171,0,0.14); border-color: #c68400; }
        .risk-radio-item.orange.selected { background: rgba(227,116,0,0.14); border-color: var(--dot-orange); }
        .risk-radio-item.red.selected    { background: rgba(217,48,37,0.14); border-color: var(--dot-red); }

        .level-tag {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .level-tag.red { background: var(--dot-red); }
        .level-tag.orange { background: var(--dot-orange); }
        .level-tag.yellow { background: var(--dot-yellow); }
        .level-tag.blue { background: var(--primary); }

        .risk-actions { display: flex; gap: 8px; margin-top: 12px; }
        .risk-btn {
            flex: 1;
            padding: 10px 0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text2);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .risk-btn:hover { opacity: 0.8; }
        .risk-btn.active-normal {
            background: rgba(30,142,62,0.12);
            border-color: var(--success);
            color: var(--success);
        }
        .risk-btn.active-risk {
            background: rgba(217,48,37,0.12);
            border-color: var(--dot-red);
            color: var(--dot-red);
        }
        .risk-btn.active-na {
            background: rgba(95,99,104,0.12);
            border-color: var(--text2);
            color: var(--text2);
        }
        .disposal-btns { display: flex; gap: 10px; }
        .disposal-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text2);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .disposal-btn.active-immediate {
            background: rgba(217,48,37,0.12);
            border-color: var(--dot-red);
            color: var(--dot-red);
        }
        .disposal-btn.active-transfer {
            background: rgba(var(--primary-rgb), 0.12);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ===== 清单外问题 ===== */
        .extra-count {
            font-size: 12px;
            color: var(--text2);
            font-weight: normal;
            margin-left: auto;
        }
        .extra-card {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 10px var(--shadow);
            border: 1px solid var(--border);
        }
        .extra-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .extra-card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            line-height: 1.4;
        }
        .extra-level {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            margin-left: 8px;
        }
        .extra-level.severe { background: rgba(217,48,37,0.12); color: var(--dot-red); }
        .extra-level.moderate { background: rgba(227,116,0,0.12); color: var(--dot-orange); }
        .extra-level.slight { background: rgba(249,171,0,0.16); color: #c68400; }
        .extra-level.none { background: rgba(30,142,62,0.12); color: var(--success); }
        .extra-card-desc {
            font-size: 13px;
            color: var(--text2);
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .extra-card-meta {
            font-size: 12px;
            color: var(--text2);
            margin-bottom: 10px;
        }
        .extra-card-footer {
            display: flex;
            justify-content: flex-end;
        }
        .btn-revoke {
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid var(--dot-red);
            background: var(--card);
            color: var(--dot-red);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-revoke:active { background: rgba(217,48,37,0.08); }
        .extra-add-btn {
            width: 100%;
            padding: 14px 0;
            border: 1px dashed var(--border);
            border-radius: 12px;
            background: var(--card);
            color: var(--text2);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .extra-add-btn:active { background: var(--bg-dark); }
        .extra-add-btn i { font-size: 14px; }
        .extra-empty {
            text-align: center;
            padding: 20px 0;
            color: var(--text2);
            font-size: 13px;
        }

        .bottom-actions {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            z-index: 100;
            box-shadow: 0 -2px 10px var(--shadow);
        }
        .bottom-actions .btn {
            padding: 12px 0;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-sign {
            flex: 1;
            background: var(--bg-dark);
            color: var(--text2);
            border: 1px solid var(--border);
        }
        .btn-sign.signed {
            background: rgba(var(--primary-rgb), 0.12);
            color: var(--primary);
            border-color: var(--primary);
        }
        .btn-submit {
            flex: 2;
            background: var(--primary);
            color: #fff;
        }
        .btn-submit:active { opacity: 0.9; }

        .bottom-spacer { height: calc(var(--tab-bar-height) + var(--safe-bottom) + 20px); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
        .empty-state i { font-size: 40px; color: var(--border); margin-bottom: 8px; }

        .phone-shell {
            overflow: hidden;
        }

        @media screen and (min-width: 480px) {
            .phone-shell .bottom-drawer-overlay {
                width: var(--phone-shell-width);
                left: 50%;
                right: auto;
                top: var(--phone-frame-padding);
                bottom: var(--phone-frame-padding);
                transform: translateX(-50%);
            }
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="side-button side-button-left mute"></div>
        <div class="side-button side-button-left volume-up"></div>
        <div class="side-button side-button-left volume-down"></div>
        <div class="side-button side-button-right power"></div>
        <div class="phone-shell">
            <div class="status-bar light">
                <span class="sb-time" id="statusTime">9:41</span>
                <span class="sb-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                    <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
                </span>
            </div>

            <div class="knowledge-hero">
                <div class="kh-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
                <div class="hero-title">
                    <h1>农村自建房排查</h1>
                </div>
            </div>

            <div class="law-body">
                <!-- 头部信息展示区 -->
                <div class="hero-card anim d1">
                    <div class="hero-project" id="houseAddress">奉浦街道韩村路56号</div>
                    <div class="hero-task">
                        <i class="fa-solid fa-clipboard-list"></i>青村镇农村自建房安全隐患排查
                    </div>
                    <div class="hero-grid">
                        <div class="hero-item">
                            <i class="fa-solid fa-barcode"></i>
                            <span class="label">房屋编号</span>
                            <span class="value" id="houseNo">-</span>
                        </div>
                        <div class="hero-item">
                            <i class="fa-solid fa-user"></i>
                            <span class="label">产权人</span>
                            <span class="value" id="houseOwner">-</span>
                        </div>
                        <div class="hero-item">
                            <i class="fa-solid fa-id-card"></i>
                            <span class="label">身份证号</span>

        // 获取风险数据（农村自建房）
        // 依据《奉贤区农房安全隐患巡查——对照清单》融合严重/一定安全隐患对照项
        function getRiskData() {
            if (typeof RiskData !== 'undefined' && RiskData.data && RiskData.data.selfbuild) {
                const base = RiskData.data.selfbuild.slice(0, 6);
                const checklist = getFengxianChecklist();
                return base.concat(checklist);
            }
            // 备用数据（与 rural-risk-list-build 风险清单一致）
            return [
                {id:'selfbuild-0001', domain:'selfbuild', main:'建筑结构信息', sub:'地基基础', content:'地基基础情况', riskIdentify:'地基基础局部或整体塌陷；上部结构不均匀沉降裂缝严重，且继续发展尚未稳定，或已出现明显倾斜。', accident:'房屋倾斜或倒塌', level:'red', measures:'维修加固', basis:''},
                {id:'selfbuild-0002', domain:'selfbuild', main:'建筑结构信息', sub:'地基基础', content:'地基基础情况', riskIdentify:'地基基础出现少量损坏，有较明显的不均匀沉降，上部结构出现明显不均匀沉降裂缝，或外露基础明显腐蚀、酥碱、松散和剥落。', accident:'房屋倾斜或倒塌', level:'orange', measures:'维修加固', basis:''},
                {id:'selfbuild-0003', domain:'selfbuild', main:'建筑结构信息', sub:'墙体', content:'墙体情况', riskIdentify:'承重墙体多数受力裂缝，部分承重墙体明显位移和歪闪；部分山墙转角处和纵、横墙交接处有明显松动、脱闪现象。', accident:'墙体酥碎或倒塌', level:'orange', measures:'维修加固', basis:''},
                {id:'selfbuild-0004', domain:'selfbuild', main:'建筑结构信息', sub:'墙体', content:'墙体情况', riskIdentify:'承重墙体有少量受力裂缝和变形；墙体转角处和纵、横墙交接处无松动、脱闪现象。', accident:'墙体酥碎或倒塌', level:'yellow', measures:'维修加固', basis:''},
                {id:'selfbuild-0005', domain:'selfbuild', main:'建筑结构信息', sub:'地基基础', content:'地基基础情况', riskIdentify:'地基基础保持稳定，无明显不均匀沉降；上部结构有轻微不均匀沉降裂缝，外露基础基本完好。', accident:'房屋倾斜或倒塌', level:'yellow', measures:'维修加固', basis:''},
                {id:'selfbuild-0006', domain:'selfbuild', main:'建筑结构信息', sub:'地基基础', content:'地基基础情况', riskIdentify:'地基基础保持稳定，无明显不均匀沉降；上部结构无不均匀沉降裂缝和倾斜，外露基础完好。', accident:'无', level:'blue', measures:'无', basis:''}
            ];

        function getFengxianChecklist() {
            return [
                { id:'fx-check-001', domain:'selfbuild', main:'结构安全', sub:'地基基础', content:'地基基础稳定性', riskIdentify:'地基基础不稳定，存在明显不均匀沉降', accident:'房屋倾斜或倒塌', level:'red', measures:'停止使用，委托鉴定，加固或拆除', basis:'奉贤区农房安全隐患巡查对照清单' },
                { id:'fx-check-001b', domain:'selfbuild', main:'结构安全', sub:'地基基础', content:'不均匀沉降', riskIdentify:'地基基础不稳定，存在明显不均匀沉降', accident:'房屋倾斜或倒塌', level:'red', measures:'停止使用，委托鉴定，加固或拆除', basis:'奉贤区农房安全隐患巡查对照清单' },
                { id:'fx-check-002', domain:'selfbuild', main:'结构安全', sub:'承重构件', content:'承重构件损伤变形', riskIdentify:'承重构件严重损伤、开裂、变形，随时丧失承载力、存在倒塌风险', accident:'坍塌', level:'red', measures:'立即停止使用，委托鉴定，加固或拆除', basis:'奉贤区农房安全隐患巡查对照清单' },
                { id:'fx-check-003', domain:'selfbuild', main:'违规改建', sub:'承重结构', content:'擅自拆改承重结构', riskIdentify:'擅自拆改承重结构', accident:'坍塌', level:'red', measures:'制止违法行为，恢复原状，鉴定评估', basis:'奉贤区农房安全隐患巡查对照清单' },
                { id:'fx-check-004', domain:'selfbuild', main:'违规改建', sub:'光伏加装', content:'屋顶加装光伏设施', riskIdentify:'屋顶加装光伏设施导致承重构件严重损伤、变形，存在倒塌风险', accident:'坍塌', level:'red', measures:'拆除违规加装设施，委托鉴定，加固处理', basis:'奉贤区农房安全隐患巡查对照清单' },
                { id:'fx-check-005', domain:'selfbuild', main:'结构安全', sub:'地基基础', content:'地基基础轻微损伤', riskIdentify:'地基基础无明显不均匀沉降，个别承重构件轻微损伤、裂缝、变形，不能完全满足安全使用要求', accident:'局部损坏或影响正常使用', level:'orange', measures:'维修加固，定期观测', basis:'奉贤区农房安全隐患巡查对照清单' },
                { id:'fx-check-006', domain:'selfbuild', main:'违规改建', sub:'光伏加装', content:'屋顶光伏局部影响', riskIdentify:'屋顶加装光伏设施造成局部承重构件轻微受力影响', accident:'局部构件损伤', level:'orange', measures:'评估影响，必要时加固或拆除', basis:'奉贤区农房安全隐患巡查对照清单' }
            ];
        }

        // 渲染风险清单
        function renderRiskList() {
            const container = document.getElementById('riskListContainer');
            const risks = getRiskData();
            document.getElementById('riskCount').textContent = risks.length;
            document.getElementById('totalCount').textContent = risks.length;

            if (risks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-inbox"></i>
                        <p>暂无风险清单数据</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = risks.map((item, index) => {
                const level = levelMap[item.level] || levelMap.blue;
                // 所有卡片默认展开
                // 奉贤区对照清单卡片（fx-check-001~006）不显示右侧等级标签
                const isFengxian = item.id && item.id.startsWith('fx-check-');
                // 带单选组的风险识别卡片
                const hasRadio = item.id === 'fx-check-001';
                // fengxian 卡片等级标签
                let tagText = '';
                let tagClass = '';
                if (isFengxian) {
                    if (['fx-check-001b','fx-check-002','fx-check-003','fx-check-004'].includes(item.id)) {
                        tagText = '严重安全隐患';
                        tagClass = 'red';
                    } else if (['fx-check-005','fx-check-006'].includes(item.id)) {
                        tagText = '一定安全隐患';
                        tagClass = 'orange';
                    }
                }
                return `
                    <div class="risk-card ${level.class}" data-id="${item.id}" onclick="toggleCard(this, event)">
                        <div class="risk-header">
                            <div class="risk-title">${item.sub} - ${item.content}</div>
                            ${isFengxian && tagText ? `<div class="risk-tag ${tagClass}">${tagText}</div>` : ''}
                            ${!isFengxian ? `<div class="risk-level ${level.class}">${level.label}</div>` : ''}
                        </div>
                        <div class="risk-info">
                            ${hasRadio ? `
                            <div class="risk-info-row">
                                <span class="label">风险识别：</span>
                                <div class="risk-radio-group" onclick="event.stopPropagation()">
                                    <label class="risk-radio-item blue" data-value="blue">
                                        <input type="radio" name="riskLevel_fx001" value="blue">
                                        <span class="radio-label">地基基础保持稳定，无明显不均匀沉降；上部结构无不均匀沉降裂缝和倾斜，外露基础完好。</span>
                                    </label>
                                    <label class="risk-radio-item yellow" data-value="yellow">
                                        <input type="radio" name="riskLevel_fx001" value="yellow">
                                        <span class="radio-label">地基基础保持稳定，无明显不均匀沉降；上部结构有轻微不均匀沉降裂缝，外露基础基本完好。</span>
                                    </label>
                                    <label class="risk-radio-item orange" data-value="orange">
                                        <input type="radio" name="riskLevel_fx001" value="orange">
                                        <span class="radio-label">地基基础出现少量损坏，有较明显的不均匀沉降，上部结构出现明显不均匀沉降裂缝，或外露基础明显腐蚀、酥碱、松散和剥落。</span>
                                    </label>
                                    <label class="risk-radio-item red" data-value="red">
                                        <input type="radio" name="riskLevel_fx001" value="red">
                                        <span class="radio-label">地基基础局部或整体塌陷；上部结构不均匀沉降裂缝严重，且继续发展尚未稳定，或已出现明显倾斜。</span>
                                    </label>
                                </div>
                            </div>
                            ` : `
                            <div class="risk-info-row">
                                <span class="label">风险识别：</span>
                                <span class="value">${item.riskIdentify}</span>
                            </div>
                            `}
                            <div class="risk-info-row">
                                <span class="label">可能导致：</span>
                                <span class="value">${item.accident}</span>
                            </div>
                        </div>
                        <div class="risk-actions" onclick="event.stopPropagation()">
                            <button class="risk-btn" onclick="setRiskStatus('${item.id}', 'normal', this)" data-status="normal">
                                <i class="fa-solid fa-check-circle"></i>正常
                            </button>
                            <button class="risk-btn" onclick="setRiskStatus('${item.id}', 'na', this)" data-status="na">
                                <i class="fa-solid fa-ban"></i>不适用
                            </button>
                            <button class="risk-btn" onclick="openDrawer('${item.id}', 'risk', this)" data-status="risk">
                                <i class="fa-solid fa-triangle-exclamation"></i>异常
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 风险识别单选联动：选择后自动更新卡片等级并标记异常
        function initRiskRadio() {
            document.querySelectorAll('.risk-radio-item input[type="radio"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    const card = this.closest('.risk-card');
                    const item = this.closest('.risk-radio-item');
                    const group = this.closest('.risk-radio-group');
                    group.querySelectorAll('.risk-radio-item').forEach(r => r.classList.remove('selected'));
                    item.classList.add('selected');
                    const val = this.value;
                    const map = { blue:'完好房(基本完好房)', yellow:'一般损坏房', orange:'严重损坏房', red:'疑似危房' };
                    const levelEl = card.querySelector('.risk-level');
                    if (levelEl) {
                        levelEl.textContent = map[val] || levelEl.textContent;
                        levelEl.className = 'risk-level ' + val;
                    }
                    card.className = 'risk-card ' + val;
                    // 选中 red/orange 时自动点击异常按钮
                    if (val === 'red' || val === 'orange') {
                        const riskBtn = card.querySelector('[data-status="risk"]');
                        if (riskBtn && !riskBtn.disabled) riskBtn.click();
                    }
                });
            });
        }

        // 当前打开的抽屉状态
        let currentDrawerId = null;
        let currentDrawerStatus = null;
        let currentDrawerBtn = null;

        // 底部操作抽屉内容模板

                            </div>

                    </div>
                </div>
            `
        };

        // 选择处置方式
        function selectDisposal(type) {
            document.getElementById('drawerDisposalType').value = type;

                    <div class="form-row">
                        <label>隐患名称</label>
                        <input type="text" id="drawerRiskName" placeholder="请输入隐患名称">
                    </div>
                    <div class="form-row">

        // 打开底部操作抽屉
        function openDrawer(id, status, btn) {
            currentDrawerId = id;
            currentDrawerStatus = status;
            currentDrawerBtn = btn;

            const drawer = document.getElementById('bottomDrawer');
            const overlay = document.getElementById('drawerOverlay');
            const body = document.getElementById('drawerBody');
            const title = document.getElementById('drawerTitle');

            title.textContent = '异常上报';
            body.innerHTML = drawerTemplates[currentDrawerStatus];

            // 自动带入当前清单项的风险部位
            var riskItem = getRiskData().find(function(r) { return r.id === id; });
            if (riskItem && riskItem.sub) {
                var partSelect = document.getElementById('drawerRiskPart');
                if (partSelect) {
                    for (var i = 0; i < partSelect.options.length; i++) {
                        if (partSelect.options[i].text === riskItem.sub) { partSelect.selectedIndex = i; break; }
                    }
                }
                var nameInput = document.getElementById('drawerRiskName');
                if (nameInput && !nameInput.value) nameInput.value = riskItem.sub + ' - ' + riskItem.content;

                // fengxian 卡片自动绑定隐患等级
                if (riskItem.id && riskItem.id.startsWith('fx-check-')) {
                    var levelSelect = document.getElementById('drawerRiskLevel') || document.getElementById('drawerTransferLevel');
                    if (levelSelect) {
                        var isSevere = ['fx-check-001b','fx-check-002','fx-check-003','fx-check-004'].includes(riskItem.id);
                        levelSelect.value = isSevere ? 'severe' : 'moderate';
                    }
                }
            }

            overlay.classList.add('active');
            drawer.classList.add('active');
        }

        // 关闭底部操作抽屉
        function closeDrawer() {
            const drawer = document.getElementById('bottomDrawer');
            const overlay = document.getElementById('drawerOverlay');
            drawer.classList.remove('active');
            overlay.classList.remove('active');
            currentDrawerId = null;
            currentDrawerStatus = null;
            currentDrawerBtn = null;
            extraDrawerMode = false;
        }

        // 确认抽屉内容
        function confirmDrawer() {
            if (extraDrawerMode) {
                const name = document.getElementById('extraName').value.trim();
                const level = document.getElementById('extraLevel').value;
                if (!name) { alert('请输入隐患名称'); return; }
                if (!level) { alert('请选择隐患等级'); return; }
                extraProblems.unshift({
                    id: ++extraSeq,
                    name: name,
                    level: level,
                    desc: document.getElementById('extraDesc').value.trim(),
                    scope: document.getElementById('extraScope').value.trim(),
                    deadline: document.getElementById('extraDeadline').value,
                    disposal: extraDisposal,
                    time: formatTime(new Date())
                });
                renderExtraList();
                extraDrawerMode = false;
                closeDrawer();
                return;
            }
            if (currentDrawerBtn && currentDrawerId && currentDrawerStatus) {
                setRiskStatus(currentDrawerId, currentDrawerStatus, currentDrawerBtn);
            }
            closeDrawer();
        }

        // 切换卡片折叠/展开
        function toggleCard(card, event) {
            // 如果点击的是按钮区域，不切换
            if (event.target.closest('.risk-btn')) {
                return;
            }
            card.classList.toggle('collapsed');
        }

        // 更新进度条
        function updateProgress() {
            const cards = document.querySelectorAll('.risk-card');
            const total = cards.length;
            let done = 0;
            let risk = 0;

            cards.forEach(card => {
                const activeBtn = card.querySelector('.risk-btn.active-normal, .risk-btn.active-risk, .risk-btn.active-na');
                if (activeBtn) {
                    done++;
                    if (activeBtn.dataset.status === 'risk') {
                        risk++;
                    }
                    // 已完成的项添加completed类并自动收起
                    card.classList.add('completed');
                    if (!card.classList.contains('collapsed')) {
                        card.classList.add('collapsed');
                    }
                }
            });

            document.getElementById('doneCount').textContent = done;
            document.getElementById('riskCountStat').textContent = risk;
            document.getElementById('extraCountStat').textContent = extraProblems.length;
            document.getElementById('progressFill').style.width = total > 0 ? (done / total * 100) + '%' : '0%';
        }

        // 设置风险状态
        function setRiskStatus(id, status, btn) {
            const card = btn.closest('.risk-card');
            const buttons = card.querySelectorAll('.risk-btn');

            // 清除所有按钮的激活状态
            buttons.forEach(b => {
                b.classList.remove('active-normal', 'active-risk', 'active-na');
            });

            // 设置当前按钮的激活状态
            if (status === 'normal') {
                btn.classList.add('active-normal');
                // 正常状态自动收起
                card.classList.add('completed', 'collapsed');
            } else if (status === 'risk') {
                btn.classList.add('active-risk');
                card.classList.remove('completed');
            } else if (status === 'na') {
                btn.classList.add('active-na');
                card.classList.add('completed', 'collapsed');
            }

            // 已提交后，禁用该卡片所有按钮，防止重复操作
            buttons.forEach(b => {
                b.disabled = true;
                b.style.pointerEvents = 'none';
                b.style.opacity = b === btn ? '1' : '0.45';
            });

            // 更新进度
            updateProgress();

            // 存储状态
            console.log(`风险项 ${id} 状态设置为: ${status}`);
        }

        // 拍照功能
        function takePhoto(box) {
            // 模拟拍照，实际开发中调用相机API
            const preview = document.createElement('img');
            preview.className = 'photo-preview';
            preview.src = 'https://via.placeholder.com/70x70/1a73e8/fff?text=Photo';
            preview.onclick = function() { this.remove(); };
            box.parentNode.insertBefore(preview, box);
        }

        // 签到
        function signIn() {
            const btn = document.getElementById('signBtn');
            if (btn.classList.contains('signed')) {
                alert('您已签到！');
                return;
            }
            // 模拟获取当前位置
            const mockLocation = '青村镇解放路88号附近';
            const now = new Date();
            const timeStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
            alert('签到成功！\n时间：' + timeStr + '\n位置：' + mockLocation);
            btn.classList.add('signed');
            btn.innerHTML = '<i class="fa-solid fa-check" style="margin-right: 4px;"></i>已签到';
        }

        // 确认提交
        function submitCheck() {
            const results = [];
            document.querySelectorAll('.risk-card').forEach(card => {
                const id = card.dataset.id;
                const activeBtn = card.querySelector('.risk-btn.active-normal, .risk-btn.active-risk, .risk-btn.active-na');
                if (activeBtn) {
                    results.push({
                        id: id,
                        status: activeBtn.dataset.status
                    });
                }
            });

            const total = document.querySelectorAll('.risk-card').length;
            if (results.length < total) {
                alert(`还有 ${total - results.length} 项未排查，请完成全部排查后再提交`);
                return;
            }

            alert('提交成功！共排查 ' + results.length + ' 项');

            // 检查是否有异常项
            const hasAbnormal = results.some(r => r.status === 'risk');

            // 有异常项才提示是否进入隐患管理页面
            if (hasAbnormal) {
                const goToHiddenDanger = confirm('提交完成！发现异常项，是否进入隐患管理页面？');
                if (goToHiddenDanger) {
                    App.go('hidden-danger-manage.html');
                }
            }
        }

        // ===== 清单外问题 =====
        let extraProblems = [
            {
                id: 1,
                name: '房屋外墙瓷砖脱落',
                level: 'moderate',
                desc: '现场排查发现房屋二层外墙瓷砖多处空鼓、脱落，存在砸伤行人风险。',
                scope: '影响楼下行人通行安全',
                deadline: '2026-08-20',
                disposal: 'immediate',
                time: '2026-08-10 09:32:15'
            }
        ];
        let extraSeq = 1;
        let extraDrawerMode = false;
        let extraDisposal = 'immediate';

        const extraLevelMap = {
            'severe': { label: '严重安全隐患', class: 'severe' },
            'moderate': { label: '一定安全隐患', class: 'moderate' }
        };

        function formatTime(d) {
            const p = n => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
        }

        function renderExtraList() {
            const container = document.getElementById('extraListContainer');
            document.getElementById('extraCount').textContent = extraProblems.length;
            const extraStat = document.getElementById('extraCountStat');
            if (extraStat) extraStat.textContent = extraProblems.length;
            if (extraProblems.length === 0) {
                container.innerHTML = '<div class="extra-empty">暂无清单外问题，点击下方按钮添加</div>';
                return;
            }
            container.innerHTML = extraProblems.map(p => {
                const lv = extraLevelMap[p.level] || extraLevelMap.none;
                return `
                    <div class="extra-card" data-eid="${p.id}">
                        <div class="extra-card-header">
                            <div class="extra-card-title">${p.name}</div>
                            <div class="extra-level ${lv.class}">${lv.label}</div>
                        </div>
                        <div class="extra-card-desc">${p.desc || '暂无描述'}</div>
                        <div class="extra-card-meta">上报时间：${p.time}</div>
                        <div class="extra-card-footer">
                            <button class="btn-revoke" onclick="revokeExtra(${p.id})">撤回</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

                <div class="form-row">
                    <label>隐患描述</label>
                    <textarea id="extraDesc" placeholder="请描述隐患具体情况..."></textarea>
                </div>
                <div class="form-row">
                    <label>影响范围</label>
                    <input type="text" id="extraScope" placeholder="如：影响周边3户居民">
                </div>
                <div class="form-row">

                    <input type="date" id="extraDeadline">
                </div>
                <div class="form-row">
                    <label>现场证据（拍照）</label>
                    <div class="photo-upload">
                        <div class="photo-box" onclick="takePhoto(this)">
                            <i class="fa-solid fa-camera"></i>
                        </div>
                    </div>
                </div>
            `;
            overlay.classList.add('active');
            drawer.classList.add('active');
        }

        function selectExtraDisposal(type) {
            extraDisposal = type;
            document.getElementById('extraBtnImmediate').classList.toggle('active-immediate', type === 'immediate');
            document.getElementById('extraBtnTransfer').classList.toggle('active-transfer', type === 'transfer');
        }

        function revokeExtra(id) {
            if (!confirm('确定撤回该清单外问题吗？')) return;
            extraProblems = extraProblems.filter(p => p.id !== id);
            renderExtraList();
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            renderRiskList();
            renderExtraList();
        });
