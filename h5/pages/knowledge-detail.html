<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>知识详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.kd-header { background: linear-gradient(135deg, #1a73e8 0%, #1557b0 100%); padding: 16px 18px 30px; color: #fff; position: relative; }
.kd-header .kd-header-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.kd-header .kd-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.kd-header .kd-tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 3px; font-size: 10px; font-weight: 600; background: rgba(255,255,255,.2); }
.kd-header h1 { font-size: 17px; font-weight: 700; line-height: 1.4; flex: 1; margin: 0; }
.kd-body { margin: -16px 14px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.06); position: relative; z-index: 2; }
.kd-section { margin-bottom: 18px; }
.kd-section:last-child { margin-bottom: 0; }
.kd-section .kds-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
.kd-section .kds-value { font-size: 13px; color: var(--text-primary); font-weight: 500; line-height: 1.6; }
.kd-section .kds-content { font-size: 12px; color: var(--text-primary); line-height: 1.8; }
</style>
</head>
<body>
<div class="phone-frame">
    <!-- 侧边按钮 -->
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <!-- 状态栏 -->
    <div class="status-bar light">
        <span class="sb-time" id="statusTime">9:41</span>
        <span class="sb-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
            <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
        </span>
    </div>

    <div class="kd-header">
        <div class="kd-header-row">
            <div class="kd-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <h1 id="kdTitle">--</h1>
        </div>
        <div class="kd-tag" id="kdTag">--</div>
    </div>

    <div class="kd-body" id="kdBody">
        <!-- 动态填充 -->
    </div>

    <div class="bottom-spacer"></div>
    </div>
</div>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    var params = new URLSearchParams(window.location.search);
    var type = params.get('type') || 'laws';
    var id = params.get('id');
    var item = DataStore.getKnowledge(id);

    if (!item) {
        document.getElementById('kdTitle').textContent = '内容不存在';
        return;
    }

    var tagMap = {
        laws: { cls: 'law', icon: 'fa-scale-balanced', label: '法律法规' },
        policies: { cls: 'policy', icon: 'fa-file-lines', label: '政策要求' },
        standards: { cls: 'standard', icon: 'fa-ruler-combined', label: '标准规范' },
        floodTyphoon: { cls: 'flood', icon: 'fa-cloud-showers-heavy', label: '防汛防台' }
    };
    var tag = tagMap[type] || tagMap.laws;

    document.getElementById('kdTag').innerHTML = '<i class="fa-solid ' + tag.icon + '"></i> ' + App.escapeHtml(item.category || tag.label);
    document.getElementById('kdTitle').textContent = item.title;

    document.getElementById('kdBody').innerHTML =
        '<div class="kd-section"><div class="kds-label">发布机关</div><div class="kds-value">' + App.escapeHtml(item.organ) + '</div></div>' +
        '<div class="kd-section"><div class="kds-label">发布日期</div><div class="kds-value">' + item.pubDate + '</div></div>' +
        '<div class="kd-section"><div class="kds-label">实施日期</div><div class="kds-value">' + item.effectDate + '</div></div>' +
        (item.domain ? '<div class="kd-section"><div class="kds-label">适用领域</div><div class="kds-value">' + App.escapeHtml(item.domain) + '</div></div>' : '') +
        '<div class="kd-section"><div class="kds-label">内容简介</div><div class="kds-content">' + App.escapeHtml(item.summary) + '</div></div>';
})();
</script>
</body>
</html>
