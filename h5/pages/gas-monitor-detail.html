    <style>
        
        .page-body { padding: 0; padding-bottom: calc(var(--space) + var(--safe-bottom)); }

        .knowledge-hero {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #1d4ed8 100%);
            margin-top: -34px;
            padding: calc(34px + 4px) 18px 12px;
            color: #fff;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 85px;
        }
        .knowledge-hero::before {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            right: -50px;
            top: -20px;
            background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%);
            border-radius: 50%;
        }
        .knowledge-hero .kh-back {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            cursor: pointer;
        }
        .knowledge-hero .hero-title { flex: 1; position: relative; z-index: 2; text-align: center; padding-right: 32px; }
        .knowledge-hero h1 { font-size: 17px; font-weight: 600; }.page-hero { display: none; }

        .device-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            margin: var(--space-sm) var(--space) 0;
            padding: 14px var(--space);
            border-radius: var(--radius-lg);
            color: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(0,0,0,.1);
        }
.device-header::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 160px;
    height: 160px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
}
.device-name {
    font-size: var(--font-xl);
    font-weight: 600;
    margin-bottom: 8px;
    position: relative;
}
.device-meta {
    display: flex;
    gap: var(--space-sm);
    font-size: var(--font-sm);
    opacity: 0.9;
    position: relative;
    flex-wrap: wrap;
}
.device-meta span {
    display: flex;
    align-items: center;
    gap: 4px;
}

.realtime-card {
    background: var(--bg-card);
    margin: var(--space-sm) var(--space);
    border-radius: var(--radius-lg);
    padding: var(--space);
    box-shadow: 0 2px 8px var(--shadow);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid var(--border);
}
.realtime-value {
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.realtime-label {
    font-size: var(--font-sm);
    color: var(--text-secondary);
}
.realtime-number {
    font-size: 36px;
    font-weight: 700;
    line-height: 1;
}
.realtime-number.normal { color: var(--success); }
.realtime-number.warning { color: var(--warning); }
.realtime-number.alarm { color: var(--danger); }
.realtime-unit {
    font-size: 14px;
    font-weight: 400;
    margin-left: 4px;
}
.realtime-status {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}
.status-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
}
.status-icon.normal { background: rgba(var(--success-rgb), .12); color: var(--success); }
.status-icon.warning { background: rgba(var(--warning-rgb), .12); color: var(--warning); }
.status-icon.alarm { background: rgba(var(--danger-rgb), .12); color: var(--danger); }
.status-text {
    font-size: var(--font-sm);
    font-weight: 600;
}
.status-text.normal { color: var(--success); }
.status-text.warning { color: var(--warning); }
.status-text.alarm { color: var(--danger); }

.time-filter {
    display: flex;
    gap: 8px;
    margin-bottom: var(--space-sm);
}
.time-tag {
    flex: 1;
    text-align: center;
    padding: 6px 0;
    border-radius: var(--radius-sm);
    font-size: var(--font-sm);
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
}
.time-tag.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}

.trend-chart {
    height: 180px;
    position: relative;
    background: var(--bg-dark);
    border-radius: var(--radius);
    overflow: hidden;
}
.chart-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-secondary);
    font-size: var(--font-sm);
    flex-direction: column;
    gap: 8px;
}
.chart-placeholder i {
    font-size: 32px;
    color: var(--border);
}

.stats-summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: var(--space-sm);
}
.stat-box {
    text-align: center;
    padding: 10px;
    background: var(--bg-dark);
    border-radius: var(--radius);
}
.stat-box-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
}
.stat-box-label {
    font-size: var(--font-xs);
    color: var(--text-secondary);
    margin-top: 2px;
}

.alarm-list {
    max-height: 300px;
    overflow-y: auto;
}
.alarm-item {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
}
.alarm-item:last-child {
    border-bottom: none;
    padding-bottom: 0;
}
.alarm-time-line {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 40px;
    flex-shrink: 0;
}
.alarm-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--danger);
    margin-top: 4px;
}
.alarm-dot.warning { background: var(--warning); }
.alarm-line {
    flex: 1;
    width: 2px;
    background: var(--border);
    margin-top: 4px;
}
.alarm-content { flex: 1; }
.alarm-time {
    font-size: var(--font-xs);
    color: var(--text-secondary);
    margin-bottom: 4px;
}
.alarm-desc {
    font-size: var(--font-base);
    color: var(--text-primary);
    line-height: 1.5;
}
.alarm-value {
    font-size: var(--font-sm);
    color: var(--danger);
    font-weight: 600;
    margin-top: 2px;
}
.alarm-value.warning { color: var(--warning); }

.info-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.info-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}
.info-row-label {
    font-size: var(--font-sm);
    color: var(--text-secondary);
    flex-shrink: 0;
    width: 80px;
}
.info-row-value {
    font-size: var(--font-base);
    color: var(--text-primary);
    text-align: right;
    flex: 1;
}

.map-container {
    height: 160px;
    background: var(--bg-dark);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: var(--text-secondary);
    font-size: var(--font-sm);
    position: relative;
    overflow: hidden;
}
.map-container i {
    font-size: 32px;
    color: var(--primary);
}
.map-pin {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -100%);
    color: var(--danger);
    font-size: 24px;
}

        .detail-tabs {
            display: flex;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            margin: var(--space-sm) var(--space) 0;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            overflow: hidden;
        }
        .detail-tab {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            font-size: var(--font-base);
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            background: var(--bg-card);
            border: none;
        }
        .detail-tab.active {
            color: var(--primary);
            font-weight: 600;
        }
        .detail-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background: var(--primary);
            border-radius: 2px 2px 0 0;
        }
        .tab-panel { display: none; padding: var(--space-sm) var(--space); }
        .tab-panel .card { margin-left: 0; margin-right: 0; }
        .tab-panel .card:not(:first-child) { margin-top: var(--space-sm); }
        .tab-panel.active { display: block; }

</style>
</head>

                        </div>
                        <div class="stat-box">

                        </div>
                    </div>
                </div>

                <!-- 安装位置 -->
                <div class="card">

                    </div>
                    <div class="map-container">

            </div>

            <!-- 报警记录 -->

                    </div>
                </div>
            </div>
        </div>

// 获取URL参数
function getUrlParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

// 初始化页面
function initPage() {
    const deviceId = getUrlParam('id') || 'IOT-003';
    const data = monitorData[deviceId];
    
    if (!data) {
        document.querySelector('.page-content').innerHTML = '<div style="padding:40px;text-align:center;color:#999">设备不存在</div>';
        return;
    }

    const status = statusMap[data.status];

    // 填充头部信息
    document.getElementById('deviceName').textContent = data.name;
    document.getElementById('deviceId').textContent = deviceId;
    document.getElementById('deviceLocation').textContent = data.location;

    // 填充实时数值
    const valueEl = document.getElementById('realtimeValue');
    valueEl.innerHTML = `${data.value} <span class="realtime-unit">${data.unit}</span>`;
    valueEl.className = `realtime-number ${status.class}`;

    // 填充状态
    document.getElementById('statusIcon').className = `status-icon ${status.class}`;
    document.getElementById('statusIcon').innerHTML = `<i class="fas ${status.icon}"></i>`;
    document.getElementById('statusText').className = `status-text ${status.class}`;
    document.getElementById('statusText').textContent = status.label;

    // 填充统计值
    document.getElementById('maxValue').textContent = data.stats.max + data.unit;
    document.getElementById('minValue').textContent = data.stats.min + data.unit;
    document.getElementById('avgValue').textContent = data.stats.avg + data.unit;

    // 渲染报警记录
    renderAlarmRecords(data.alarmRecords, 'alarmList');

    // 填充位置信息
    document.getElementById('detailAddress').textContent = data.location;
    document.getElementById('coordinates').textContent = data.coordinates;
}

// 渲染报警记录
function renderAlarmRecords(records, elementId) {
    const listEl = document.getElementById(elementId);
    if (!records || records.length === 0) {
        listEl.innerHTML = '<div style="text-align:center;padding:20px;color:#999">暂无报警记录</div>';
        return;
    }

    listEl.innerHTML = records.map((record, index) => {
        const isLast = index === records.length - 1;
        const typeClass = record.type === 'warning' ? 'warning' : '';
        return `
            <div class="alarm-item">
                <div class="alarm-time-line">
                    <div class="alarm-dot ${typeClass}"></div>
                    ${!isLast ? '<div class="alarm-line"></div>' : ''}
                </div>
                <div class="alarm-content">
                    <div class="alarm-time">${record.time}</div>
                    <div class="alarm-desc">${record.desc}</div>
                    <div class="alarm-value ${typeClass}">数值: ${record.value}</div>
                </div>
            </div>
        `;
    }).join('');
}

// 切换 Tab
function switchTab(el, panelId) {
    document.querySelectorAll('.detail-tab').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('panel-' + panelId).classList.add('active');
}

// 切换时间范围
function switchTimeRange(el, range) {
    document.querySelectorAll('.time-tag').forEach(tag => tag.classList.remove('active'));
    el.classList.add('active');
    // 这里可以添加实际切换图表数据的逻辑
    console.log('切换时间范围:', range);
}

// 初始化
initPage();
</script>
