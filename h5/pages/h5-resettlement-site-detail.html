<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>集中安置场所详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
:root { --primary: #1a73e8; --primary-rgb: 26,115,232; --success: #34a853; --success-rgb: 52,168,83; --danger: #ea4335; --warning: #f9ab00; --text-primary: #202124; --text2: #5f6368; --card: #fff; --bg: #f5f6fa; --border: #e8eaed; --shadow: rgba(60,64,67,.08); --radius: 12px; --radius-sm: 8px; --input-bg: #f8f9fa; }
body { background: var(--bg); }

.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; position: relative; background: var(--bg); }

.hero-card { position: relative; left: auto; right: auto; bottom: auto; margin: 20px 0 16px; background: linear-gradient(135deg, #1a73e8 0%, #1b6cd5 50%, #1557b0 100%); border-radius: 16px; padding: 16px; color: #fff; border: none; box-shadow: 0 8px 20px rgba(26,115,232,.28); overflow: hidden; }
.hero-card::before { content: ''; position: absolute; width: 140px; height: 140px; right: -40px; top: -50px; background: radial-gradient(circle, rgba(255,255,255,.15), transparent 70%); border-radius: 50%; }
.hero-card .hc-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; position: relative; z-index: 1; line-height: 1.4; word-break: break-word; }
.hero-card .hc-address { display: flex; align-items: center; gap: 6px; font-size: 13px; opacity: .9; margin-bottom: 14px; position: relative; z-index: 1; }
.hero-card .hc-address i { font-size: 12px; flex-shrink: 0; }
.hero-card .hc-address span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero-card .hc-metric-row { display: flex; align-items: center; gap: 12px; font-size: 14px; margin-bottom: 10px; position: relative; z-index: 1; }
.hero-card .hc-metric-item { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.hero-card .hc-metric-txt { display: flex; align-items: center; flex: 1; min-width: 0; }
.hero-card .hc-metric-num { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; font-weight: 700; }
.hero-card .hc-metric-unit { flex-shrink: 0; font-weight: 700; }
.hero-card .hc-metric-item i { font-size: 12px; opacity: .8; flex-shrink: 0; }
.hero-card .hc-metric-divider { width: 1px; height: 14px; background: rgba(255,255,255,.3); flex-shrink: 0; }
.hero-card .hc-contact { font-size: 14px; opacity: .95; position: relative; z-index: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero-card .hc-contact span { font-weight: 600; }

.content-sheet.page-body-sheet { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 18px 14px 20px; border-radius: 0; box-shadow: none; border: none; background: var(--bg); position: relative; z-index: 2; -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none; }
.content-sheet.page-body-sheet::-webkit-scrollbar { display: none; }

.action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.action-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: all .15s; text-decoration: none; color: var(--text-primary); }
.action-item:active { transform: scale(.97); }
.action-item.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.action-item i { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.action-item .ai-label { font-size: 12px; color: var(--text-primary); font-weight: 500; }
.action-item.ai-green i { background: rgba(30,142,62,.12); color: var(--success); }
.action-item.ai-orange i { background: rgba(230,81,0,.12); color: #e65100; }
.action-item.ai-blue i { background: rgba(26,115,232,.1); color: var(--primary); }

.info-card { background: var(--card); border-radius: var(--radius); padding: 0; box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); margin-bottom: 14px; overflow: hidden; }
.info-card .ic-header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 700; color: var(--text-primary); }
.info-card .ic-header i { color: var(--primary); font-size: 16px; }
.info-row { display: flex; padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
.info-row:last-child { border-bottom: none; }
.info-label { width: 120px; color: var(--text2); flex-shrink: 0; }
.info-value { flex: 1; color: var(--text-primary); word-break: break-all; text-align: right; }
.info-value a { color: var(--primary); text-decoration: none; }
.info-value.phone { color: var(--primary); text-align: right; }

.bottom-spacer { height: 20px; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text2); display: none; }
.empty-state i { font-size: 48px; margin-bottom: 12px; opacity: .5; }
.empty-state .empty-title { font-size: 15px; color: var(--text-primary); margin-bottom: 6px; }

:root[data-theme="dark"] .hero-card { background: linear-gradient(135deg, #0d2a5c 0%, #103a7a 55%, #0a5f6b 100%); color: #fff; }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="top-sticky">
            <div class="status-bar light">
                <span class="sb-time" id="statusTime">9:41</span>
                <span class="sb-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                    <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
                </span>
            </div>
            <div class="page-hero">
                <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
                <div class="ph-title">场所详情</div>
            </div>
        </div>

        <div class="content-sheet page-body-sheet">
            <div class="hero-card" id="heroCard">
                <div class="hc-title" id="heroName">—</div>
                <div class="hc-address"><i class="fa-solid fa-location-dot"></i><span id="heroAddress">—</span></div>
                <div class="hc-metric-row">
                    <div class="hc-metric-item"><i class="fa-solid fa-chart-simple"></i><span class="hc-metric-txt">可安置：<span class="hc-metric-num" id="heroCapacity">—</span><span class="hc-metric-unit"> 人</span></span></div>
                    <div class="hc-metric-divider"></div>
                    <div class="hc-metric-item"><i class="fa-solid fa-ruler-combined"></i><span class="hc-metric-txt">避难面积：<span class="hc-metric-num" id="heroArea">—</span><span class="hc-metric-unit"> ㎡</span></span></div>
                </div>
                <div class="hc-contact">联系人：<span id="heroContact">—</span></div>
            </div>

            <div class="action-grid" id="actionGrid">
                <a class="action-item ai-green" id="callContactBtn" href="#" onclick="event.stopPropagation()">
                    <i class="fa-solid fa-phone"></i>
                    <div class="ai-label">呼叫场所联系人</div>
                </a>
                <div class="action-item ai-blue" id="mapBtn" onclick="viewOnMap()">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <div class="ai-label">在地图中查看</div>
                </div>
            </div>

            <div class="info-card">
                <div class="ic-header"><i class="fa-solid fa-house-medical"></i> 基本信息</div>
                <div class="info-row">
                    <div class="info-label">安置场所名称</div>
                    <div class="info-value" id="infoName">—</div>
                </div>
                <div class="info-row">
                    <div class="info-label">安置场所地址</div>
                    <div class="info-value" id="infoAddress">—</div>
                </div>
                <div class="info-row">
                    <div class="info-label">有效避难面积</div>
                    <div class="info-value" id="infoArea">—</div>
                </div>
                <div class="info-row">
                    <div class="info-label">可安置人数</div>
                    <div class="info-value" id="infoCapacity">—</div>
                </div>
                <div class="info-row">
                    <div class="info-label">联系人</div>
                    <div class="info-value" id="infoContact">—</div>
                </div>
                <div class="info-row">
                    <div class="info-label">联系方式</div>
                    <div class="info-value phone">
                        <a id="infoPhoneLink" href="#" onclick="event.stopPropagation()">—</a>
                    </div>
                </div>
            </div>

            <div class="info-card">
                <div class="ic-header"><i class="fa-solid fa-building"></i> 运维（产权）单位信息</div>
                <div class="info-row">
                    <div class="info-label">运维（产权）单位</div>
                    <div class="info-value" id="infoMaintainUnit">—</div>
                </div>
                <div class="info-row">
                    <div class="info-label">运维（产权）单位联系人</div>
                    <div class="info-value" id="infoMaintainContact">—</div>
                </div>
                <div class="info-row">
                    <div class="info-label">运维（产权）单位电话</div>
                    <div class="info-value phone">
                        <a id="infoMaintainPhoneLink" href="#" onclick="event.stopPropagation()">—</a>
                    </div>
                </div>
            </div>

            <div class="info-card">
                <div class="ic-header"><i class="fa-solid fa-file-lines"></i> 其他信息</div>
                <div class="info-row">
                    <div class="info-label">备注</div>
                    <div class="info-value" id="infoRemark">—</div>
                </div>
            </div>

            <div class="info-card">
                <div class="ic-header"><i class="fa-solid fa-file-pen"></i> 填报信息</div>
                <div class="info-row">
                    <div class="info-label">填报单位</div>
                    <div class="info-value" id="infoReportUnit">—</div>
                </div>
                <div class="info-row">
                    <div class="info-label">填报人</div>
                    <div class="info-value" id="infoReporter">—</div>
                </div>
                <div class="info-row">
                    <div class="info-label">填报日期</div>
                    <div class="info-value" id="infoReportDate">—</div>
                </div>
            </div>

            <div class="bottom-spacer"></div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../../data/resettlement-site-data.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    var rawData = (typeof resettlementSiteData !== 'undefined' && Array.isArray(resettlementSiteData)) ? resettlementSiteData : [];
    var id = App.getQuery('id');
    var item = rawData.find(function(d) { return String(d.no) === String(id); }) || {};

    function parseNumber(v) {
        if (!v && v !== 0) return '—';
        var n = parseFloat(String(v).replace(/[^0-9.]/g, ''));
        return isNaN(n) ? '—' : n;
    }

    function setText(id, text) { document.getElementById(id).textContent = text || '—'; }
    function setHtml(id, html) { document.getElementById(id).innerHTML = html || '—'; }

    if (!item.no) {
        document.querySelector('.content-sheet.page-body-sheet').innerHTML = '<div class="empty-state" style="display:block"><i class="fa-regular fa-folder-open"></i><div class="empty-title">未找到场所信息</div></div>';
        return;
    }

    setText('heroName', item.name);
    setText('heroAddress', item.address);
    setText('heroCapacity', parseNumber(item.capacity));
    setText('heroArea', parseNumber(item.area));
    setText('heroContact', item.contact);
    setText('infoName', item.name);
    setText('infoAddress', item.address);
    setText('infoArea', parseNumber(item.area) + ' ㎡');
    setText('infoCapacity', parseNumber(item.capacity) + ' 人');
    setText('infoRemark', item.remark || '—');
    setText('infoContact', item.contact);
    setText('infoMaintainUnit', item.maintainUnit || '—');
    setText('infoMaintainContact', item.maintainContact || '—');
    setText('infoReportUnit', item.reportUnit || '—');
    setText('infoReporter', item.reporter || '—');
    setText('infoReportDate', item.reportDate || '—');

    var phoneLink = document.getElementById('infoPhoneLink');
    if (item.contactPhone) {
        phoneLink.textContent = item.contactPhone;
        phoneLink.href = 'tel:' + item.contactPhone;
    } else {
        phoneLink.textContent = '—';
        phoneLink.href = '#';
        phoneLink.onclick = function(e) { e.preventDefault(); };
    }

    var maintainPhoneLink = document.getElementById('infoMaintainPhoneLink');
    if (item.maintainPhone) {
        maintainPhoneLink.textContent = item.maintainPhone;
        maintainPhoneLink.href = 'tel:' + item.maintainPhone;
    } else {
        maintainPhoneLink.textContent = '—';
        maintainPhoneLink.href = '#';
        maintainPhoneLink.onclick = function(e) { e.preventDefault(); };
    }

    var callContactBtn = document.getElementById('callContactBtn');
    if (item.contactPhone) {
        callContactBtn.href = 'tel:' + item.contactPhone;
        callContactBtn.onclick = function() { App.showToast('正在呼叫 ' + item.contact + ' ' + item.contactPhone); };
    } else {
        callContactBtn.style.opacity = '.5';
        callContactBtn.style.pointerEvents = 'none';
    }

    window.viewOnMap = function() {
        if (item.coordinates && String(item.coordinates).trim()) {
            var parts = String(item.coordinates).split(',').map(function(s) { return s.trim(); });
            if (parts.length >= 2 && parts[0] && parts[1]) {
                var url = 'https://uri.amap.com/marker?position=' + parts[0] + ',' + parts[1] + '&name=' + encodeURIComponent(item.name || item.address || '安置场所');
                window.open(url, '_blank');
                return;
            }
        }
        if (item.address && String(item.address).trim()) {
            var url = 'https://uri.amap.com/search?keyword=' + encodeURIComponent(item.address) + '&city=' + encodeURIComponent('上海');
            window.open(url, '_blank');
        } else {
            App.showToast('暂无地址信息');
        }
    };

    var mapBtn = document.getElementById('mapBtn');
    var hasCoords = item.coordinates && String(item.coordinates).trim() && String(item.coordinates).split(',').length >= 2;
    var hasAddress = item.address && String(item.address).trim();
    if (!hasCoords && !hasAddress) {
        mapBtn.style.opacity = '.5';
        mapBtn.style.pointerEvents = 'none';
    }

    function updateTime() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        document.getElementById('statusTime').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    }
    updateTime();
    setInterval(updateTime, 60000);
})();
</script>
</body>
</html>
