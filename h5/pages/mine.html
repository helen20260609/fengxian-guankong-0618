<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>风险管控 · 我的</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>

.mine-hero { background:linear-gradient(135deg, #1a73e8 0%, #1557b0 100%); margin-top:-34px; padding:calc(34px + 22px) 20px 120px; color:#fff; position:relative; overflow:hidden; }
.mine-hero::before { content:''; position:absolute; width:180px; height:180px; right:-50px; top:-40px; background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%); border-radius:50%; }
.profile { display:flex; align-items:center; gap:14px; position:relative; z-index:5; }
.avatar { width:60px; height:60px; border-radius:50%; background:rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-size: 24px; border:2px solid rgba(255,255,255,.5); flex-shrink:0; }
.profile-info { flex:1; min-width:0; }
.profile .p-name { font-size: 18px; font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.profile .p-name .role-chip { font-size: 10px; background:rgba(255,255,255,.22); padding:2px 8px; border-radius:5px; font-weight:600; }
.profile .p-org { font-size:12.5px; opacity:.88; margin-top:5px; }

.role-switch-mini {
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:2px 8px;
    border-radius:5px;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    font-size: 10px;
    cursor:pointer;
}
.role-switch-mini select {
    background:transparent;
    border:none;
    color:#fff;
    font-size: 10px;
    outline:none;
    cursor:pointer;
    appearance:none;
    padding-right:14px;
}
.role-switch-mini option { color:var(--text-primary); }
.role-switch-mini i { position:absolute; right:6px; pointer-events:none; font-size: 9px; }

.mine-stats { margin:-40px 14px 0; position:relative; z-index:3; background:var(--card); border-radius: 10px; box-shadow:0 6px 18px rgba(0,0,0,.10); border:1px solid var(--border); display:flex; padding:18px 6px; }
.mine-stats .ms { flex:1; text-align:center; position:relative; }
.mine-stats .ms + .ms::before { content:''; position:absolute; left:0; top:18%; height:64%; width:1px; background:var(--border); }
.mine-stats .ms .ms-num { font-size: 20px; font-weight:800; color:var(--text-primary); font-variant-numeric:tabular-nums; }
.mine-stats .ms .ms-lbl { font-size: 11px; color:var(--text2); margin-top:4px; }

.sync-bar { margin:14px 14px 0; background:rgba(var(--success-rgb),.1); border:1px solid rgba(var(--success-rgb),.25); border-radius: 8px; padding:11px 14px; display:flex; align-items:center; gap:10px; }
.sync-bar i { color:var(--success); font-size: 14px; }
.sync-bar .sb-txt { flex:1; font-size:12.5px; color:var(--text-primary); }
.sync-bar .sb-txt b { color:var(--success); }
.sync-bar .sb-time { font-size: 10px; color:var(--text2); }

.group { margin:16px 14px 0; background:var(--card); border-radius: 10px; box-shadow:0 2px 10px var(--shadow); border:1px solid var(--border); overflow:hidden; }
.group-item { display:flex; align-items:center; gap:13px; padding:14px; border-bottom:1px solid var(--border); }
.group-item:last-child { border-bottom:none; }
.group-item .gi-ico { width:36px; height:36px; border-radius: 3px; display:flex; align-items:center; justify-content:center; font-size: 15px; flex-shrink:0; }
.group-item .gi-label { flex:1; font-size:14.5px; color:var(--text-primary); }
.group-item .gi-val { font-size: 12px; color:var(--text2); }
.group-item .gi-arrow { color:var(--text2); font-size: 12px; }
.group-item .gi-dot { width:8px; height:8px; background:#ff3b30; border-radius:50%; }

.section-label { font-size: 11px; color:var(--text2); font-weight:600; margin:18px 18px 8px; }

.logout-btn { margin:24px 14px 0; padding:14px; text-align:center; background:var(--card); border-radius: 10px; box-shadow:0 2px 10px var(--shadow); border:1px solid var(--border); color:#ff3b30; font-size: 14px; font-weight:600; cursor:pointer; }
.logout-btn i { margin-right:6px; }
</style>
</head>
<body>
<div class="phone-frame">
    <!-- 侧边按钮 -->
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <!-- 状态栏 -->
    <div class="status-bar light">
        <span class="sb-time" id="statusTime">9:41</span>
        <span class="sb-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
            <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
        </span>
    </div>

    <!-- 个人信息 -->
    <div class="mine-hero">
        <div class="profile">
            <div class="avatar tap" onclick="App.showToast('个人资料功能开发中')"><i class="fa-solid fa-user-tie" id="userAvatar"></i></div>
            <div class="profile-info">
                <div class="p-name">
                    <span id="userName">张明</span>
                    <span class="role-chip" id="roleChip">巡查人员</span>
                    <span class="role-switch-mini">
                        <select id="roleSelect" onchange="switchRole(this.value)">
                            <option value="public">普通用户</option>
                            <option value="inspector">巡查人员</option>
                            <option value="manager">管理人员</option>
                            <option value="enterprise">企业人员</option>
                        </select>
                        <i class="fa-solid fa-caret-down"></i>
                    </span>
                </div>
                <div class="p-org" id="userOrg">上海市奉贤区应急管理局 · 风险巡查科</div>
            </div>
        </div>
    </div>

    <!-- 数据概览（普通用户） -->
    <div class="mine-stats anim d1" id="publicStats" style="display:none">
        <div class="ms tap" onclick="App.go('my-feedback.html')">
            <div class="ms-num" id="feedbackCount">2</div>
            <div class="ms-lbl">我的反馈</div>
        </div>
        <div class="ms tap" onclick="App.go('knowledge-laws.html')">
            <div class="ms-num" id="knowledgeCount">14</div>
            <div class="ms-lbl">知识栏目</div>
        </div>
        <div class="ms tap" onclick="App.go('snap-report.html')">
            <div class="ms-num"><i class="fa-solid fa-triangle-exclamation" style="font-size: 17px"></i></div>
            <div class="ms-lbl">隐患上报</div>
        </div>
    </div>

    <!-- 数据概览（管理人员/巡查/企业） -->
    <div class="mine-stats anim d1" id="staffStats">
        <div class="ms tap" onclick="App.go('inspection-domains.html')">
            <div class="ms-num" id="patrolCount">128</div>
            <div class="ms-lbl">巡查次数</div>
        </div>
        <div class="ms tap" onclick="App.go('hidden-danger-list.html?filter=reporter')">
            <div class="ms-num" id="reportCount">47</div>
            <div class="ms-lbl">隐患上报</div>
        </div>
        <div class="ms tap" onclick="App.go('assessment.html')">
            <div class="ms-num">96%</div>
            <div class="ms-lbl">整改率</div>
        </div>
    </div>

    <!-- 普通用户功能区 -->
    <div id="publicMenu" style="display:none">
        <div class="section-label anim d2">我的服务</div>
        <div class="group anim d2">
            <div class="group-item tap" onclick="App.go('snap-report.html')">
                <div class="gi-ico ic-purple"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <div class="gi-label">隐患上报</div>
                <div class="gi-arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </div>
            <div class="group-item tap" onclick="App.go('my-feedback.html')">
                <div class="gi-ico ic-orange"><i class="fa-solid fa-comments"></i></div>
                <div class="gi-label">我的反馈</div>
                <div class="gi-arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </div>
            <div class="group-item tap" onclick="App.go('knowledge-laws.html')">
                <div class="gi-ico ic-blue"><i class="fa-solid fa-scale-balanced"></i></div>
                <div class="gi-label">法律法规</div>
                <div class="gi-arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </div>
            <div class="group-item tap" onclick="App.go('knowledge-policies.html')">
                <div class="gi-ico ic-green"><i class="fa-solid fa-file-lines"></i></div>
                <div class="gi-label">政策要求</div>
                <div class="gi-arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </div>
            <div class="group-item tap" onclick="App.go('knowledge-standards.html')">
                <div class="gi-ico ic-purple"><i class="fa-solid fa-ruler-combined"></i></div>
                <div class="gi-label">标准规范</div>
                <div class="gi-arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </div>
            <div class="group-item tap" onclick="App.go('knowledge-flood-typhoon.html')">
                <div class="gi-ico ic-cyan"><i class="fa-solid fa-cloud-showers-heavy"></i></div>
                <div class="gi-label">防汛防台</div>
                <div class="gi-arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </div>
            <div class="group-item tap" onclick="App.go('knowledge-laws.html')">
                <div class="gi-ico ic-red"><i class="fa-solid fa-bookmark"></i></div>
                <div class="gi-label">我的收藏</div>
                <div class="gi-val" id="favCount">12</div>
                <div class="gi-arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </div>
        </div>
    </div>

    <!-- 同步状态 -->
    <div class="sync-bar anim d2" id="staffSync">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <div class="sb-txt">已与 PC 端 <b>实时同步</b>，数据无缝切换</div>
        <div class="sb-time">刚刚</div>
    </div>

    <!-- 我的收藏（仅非普通用户显示全部，普通用户显示收藏法规） -->
    <div id="favWrapper">
        <div class="section-label anim d2">我的收藏</div>
        <div class="group anim d2">
            <div class="group-item tap" onclick="App.go('knowledge-laws.html')">
                <div class="gi-ico ic-red"><i class="fa-solid fa-bookmark"></i></div>
                <div class="gi-label">收藏的法规标准</div>
                <div class="gi-val">12</div>
                <div class="gi-arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </div>
            <div class="group-item tap staff-only" onclick="App.showToast('收藏的风险案例功能开发中')">
                <div class="gi-ico ic-orange"><i class="fa-solid fa-star"></i></div>
                <div class="gi-label">收藏的风险案例</div>
                <div class="gi-val">8</div>
                <div class="gi-arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </div>
            <div class="group-item tap staff-only" onclick="App.showToast('我的报告功能开发中')">
                <div class="gi-ico ic-blue"><i class="fa-solid fa-file-lines"></i></div>
                <div class="gi-label">我的报告</div>
                <div class="gi-val">23</div>
                <div class="gi-arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </div>
            <div class="group-item tap staff-only" onclick="App.go('risk-list.html?favorites=1')">
                <div class="gi-ico ic-purple"><i class="fa-solid fa-heart"></i></div>
                <div class="gi-label">风险清单收藏</div>
                <div class="gi-val">5</div>
                <div class="gi-arrow"><i class="fa-solid fa-chevron-right"></i></div>
            </div>
        </div>
    </div>

    <!-- 系统管理（仅管理人员） -->
    <div class="group anim d3 role-manager" style="display:none">
        <div class="group-item tap" onclick="App.go('admin-center.html')">
            <div class="gi-ico ic-red"><i class="fa-solid fa-screwdriver-wrench"></i></div>
            <div class="gi-label">管理后台</div>
            <div class="gi-arrow"><i class="fa-solid fa-chevron-right"></i></div>
        </div>
    </div>

    <!-- 退出登录 -->
    <div class="logout-btn tap anim d3" onclick="App.showToast('退出登录功能开发中')">
        <i class="fa-solid fa-arrow-right-from-bracket"></i> 退出登录
    </div>

    <div class="bottom-spacer"></div>

    <!-- 底部标签栏 -->
    <div class="tab-bar" id="tabBar"></div>

    </div>
</div>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    var role = App.role || DataStore.user.role || 'public';
    var isPublic = role === 'public';

    document.getElementById('userName').textContent = DataStore.user.name;
    document.getElementById('roleChip').textContent = App.getRoleLabel(role);
    document.getElementById('userOrg').textContent = DataStore.user.org;
    document.getElementById('roleSelect').value = role;
    // 头像随角色变化
    var avatarEl = document.getElementById('userAvatar');
    if (avatarEl && DataStore.user.avatar) {
        avatarEl.className = 'fa-solid ' + DataStore.user.avatar;
    }

    if (isPublic) {
        document.getElementById('publicStats').style.display = 'flex';
        document.getElementById('staffStats').style.display = 'none';
        document.getElementById('publicMenu').style.display = 'block';
        document.getElementById('staffSync').style.display = 'none';
        document.querySelectorAll('.staff-only').forEach(function(el) { el.style.display = 'none'; });
        document.getElementById('feedbackCount').textContent = DataStore.myFeedback.length;
        var knowledgeCount = DataStore.knowledge.laws.length + DataStore.knowledge.policies.length +
            DataStore.knowledge.standards.length + DataStore.knowledge.floodTyphoon.length;
        document.getElementById('knowledgeCount').textContent = knowledgeCount;
        // 普通用户：将我的收藏作为服务列表最后一项，隐藏原有分组
        document.getElementById('favWrapper').style.display = 'none';
        document.getElementById('favCount').textContent = DataStore.knowledge.laws.length || 12;
    } else {
        document.getElementById('publicStats').style.display = 'none';
        document.getElementById('staffStats').style.display = 'flex';
        document.getElementById('publicMenu').style.display = 'none';
        document.getElementById('staffSync').style.display = 'flex';
        document.querySelectorAll('.staff-only').forEach(function(el) { el.style.display = 'flex'; });
        document.getElementById('patrolCount').textContent = 128;
        document.getElementById('reportCount').textContent = DataStore.hiddenDangers.filter(function(h) {
            return h.reporter.name === DataStore.user.name;
        }).length;
        document.getElementById('favWrapper').style.display = 'block';
    }

    document.querySelectorAll('.role-manager').forEach(function(el) {
        el.style.display = (role === 'manager') ? 'block' : 'none';
    });

    App.state = DataStore.stats;

    window.switchRole = function(newRole) {
        App.setRole(newRole);
        window.location.reload();
    };

    App.renderTabBar('mine');
})();
</script>
</body>
</html>
