<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>应急指挥机构</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.page-hero .ph-sub { display: none; }

.content-sheet.page-body-sheet { margin-top: 0; padding-top: 18px; border-radius: 0; box-shadow: none; border: none; background: transparent; }
.content-sheet .search-bar { align-items: center; gap: 10px; margin-top: 4px; background: transparent; box-shadow: none; border: none; padding: 0; }
.content-sheet .search-input-wrapper { display: flex; align-items: center; background: var(--card); border-radius: var(--radius); box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); min-height: 40px; }
.content-sheet .search-input-wrapper input { background: transparent; border-color: transparent; height: 40px; padding-top: 0; padding-bottom: 0; }
.content-sheet .filter-trigger {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 40px;
    padding: 0 14px;
    background: var(--card);
    color: var(--text2);
    font-size: 13px;
    font-weight: 400;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 2px 8px var(--shadow);
    cursor: pointer;
    position: relative;
    transition: all .15s;
}
.content-sheet .filter-trigger.active { color: var(--primary); border-color: var(--primary); background: rgba(var(--primary-rgb),.08); }
.content-sheet .filter-trigger:active { transform: scale(.96); }
.content-sheet .filter-trigger .badge-num {
    position: absolute;
    top: -6px;
    right: -6px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 8px;
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--card);
    box-sizing: border-box;
}
.content-sheet .filter-trigger .badge-dot {
    position: absolute;
    top: -3px;
    right: -3px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
    border: 1.5px solid var(--card);
    display: none;
}

.search-input-wrapper .clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--text2);
    color: #fff;
    font-size: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    padding: 0;
}

.selected-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.tag { background: rgba(var(--primary-rgb),.08); color: var(--primary); border: 1px solid rgba(var(--primary-rgb),.18); border-radius: 999px; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.tag i { cursor: pointer; font-size: 10px; }

.org-card-item { cursor: pointer; transition: transform .12s; background: #fff; border-radius: 12px; box-shadow: 0 2px 10px var(--shadow); border: 1px solid var(--border); margin-bottom: 12px; overflow: hidden; display: flex; align-items: stretch; }
.org-card-item:active { transform: scale(.99); }

.org-main {
    flex: 1;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}
.org-icon {
    font-size: 20px;
    color: var(--primary);
    flex-shrink: 0;
}
.org-info { flex: 1; min-width: 0; }
.org-name { font-size: 16px; font-weight: 700; color: #000; line-height: 1.35; }
.org-phone { font-size: 15px; font-weight: 500; color: var(--text-primary); margin-top: 4px; }
.org-location { font-size: 12px; color: var(--text2); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.org-call-zone {
    width: 33%;
    min-width: 80px;
    max-width: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    cursor: pointer;
    flex-shrink: 0;
}
.org-call-zone:active .org-call-btn { transform: scale(.92); }
.org-call-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #E6FFED;
    color: #28C76F;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    transition: transform .12s;
}

.loading { text-align: center; padding: 16px; color: var(--text2); font-size: 13px; }
.loading i { margin-right: 6px; }

.filter-section { margin-bottom: 18px; }
.filter-section .filter-title { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
.filter-section .filter-options { display: flex; flex-wrap: wrap; gap: 10px; }
.filter-chip { padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-primary); cursor: pointer; transition: all .15s; }
.filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.sheet-footer { display: flex; gap: 12px; padding-top: 16px; border-top: 1px solid var(--border); }
.sheet-footer .btn { flex: 1; height: 44px; border-radius: 10px; }

.modal-sheet {
    display: block !important;
    opacity: 0;
    pointer-events: none;
    transform: translateY(100%);
    transition: transform .25s ease, opacity .25s ease;
    z-index: 1001;
}
.modal-sheet.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.modal-mask { display: none; opacity: 0; transition: opacity .25s ease; z-index: 1000; }
.modal-mask.show { display: block; opacity: 1; }

.bottom-spacer { height: 20px; }

:root[data-theme="dark"] .tag { background: rgba(var(--primary-rgb),.15); border-color: rgba(var(--primary-rgb),.3); }
:root[data-theme="dark"] .content-sheet .search-input-wrapper input { background: var(--input-bg); }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title">应急指挥机构</div>
        </div>

        <div class="content-sheet page-body-sheet">
            <div class="search-bar">
                <div class="search-input-wrapper" style="flex:1">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="搜索机构名称" autocomplete="off">
                    <button class="clear-btn" id="clearSearch" onclick="clearSearch(event)"><i class="fa-solid fa-times"></i></button>
                </div>
                <div class="filter-trigger" id="filterTrigger" onclick="openDrawer()">
                    <i class="fa-solid fa-filter"></i> 筛选
                    <span class="badge-dot" id="filterDot"></span>
                    <span class="badge-num" id="filterBadge" style="display:none">0</span>
                </div>
            </div>

            <div class="selected-tags" id="selectedTags"></div>

            <div class="section-v2" id="listSection" style="background:transparent;box-shadow:none;border:none;padding:0;margin:0">
                <div class="sv2-head" style="margin-bottom:12px">
                    <div class="sv2-title" style="padding-left:0">
                        <i class="fa-solid fa-address-book" style="color:var(--primary);margin-right:6px"></i>通讯信息
                    </div>
                    <div class="sv2-more" id="totalCount">共 0 条通讯信息</div>
                </div>
                <div class="card-list" id="cardList"></div>
                <div class="loading" id="loading" style="display:none"><i class="fa-solid fa-circle-notch fa-spin"></i> 加载中…</div>
                <div class="empty-state" id="empty" style="display:none">
                    <i class="fa-regular fa-folder-open"></i>
                    <div class="empty-title">暂无符合条件的通讯信息</div>
                    <div class="empty-desc">请调整筛选或搜索条件</div>
                </div>
                <div class="bottom-spacer"></div>
            </div>
        </div>

        <!-- 筛选抽屉 -->
        <div class="modal-mask" id="drawerOverlay" onclick="closeDrawer()"></div>
        <div class="modal-sheet" id="drawer">
            <div class="sheet-header">
                <div class="sheet-title">筛选条件</div>
                <div class="sheet-close" onclick="closeDrawer()"><i class="fa-solid fa-times"></i></div>
            </div>
            <div id="drawerBody"></div>
            <div class="sheet-footer">
                <button class="btn btn-outline" onclick="resetFilters()">重置</button>
                <button class="btn btn-primary" onclick="confirmFilters()">确定</button>
            </div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    var unitOptions = ['区防汛指挥部', '区政府应急办', '区建管委', '区交通中心', '区水务局'];
    var dateRangeOptions = ['全部日期', '2026-03-01 ~ 2026-03-31', '2026-03-01 ~ 2026-03-15', '2026-03-16 ~ 2026-03-31'];

    var filterConfig = [
        { key: 'reportUnit', title: '填报单位', options: unitOptions },
        { key: 'dateRange', title: '填报日期', options: dateRangeOptions }
    ];

    var selectedFilters = {};
    var currentPage = 1;
    var pageSize = 10;
    var isLoading = false;
    var hasMore = true;

    var embeddedData = [
        { no: '1', orgName: '区防汛指挥部办公室', officePhone: '021-67180001', faxPhone: '021-67180010', location: '奉贤区南桥镇解放东路928号', reportUnit: '区防汛指挥部', reporter: '王亮', reportDate: '2026-03-18' },
        { no: '2', orgName: '区政府应急管理办公室', officePhone: '021-67180002', faxPhone: '021-67180020', location: '奉贤区南桥镇解放东路928号', reportUnit: '区政府应急办', reporter: '李娜', reportDate: '2026-03-18' },
        { no: '3', orgName: '应急值班室', officePhone: '021-67180003', faxPhone: '021-67180030', location: '奉贤区南桥镇解放东路928号', reportUnit: '区防汛指挥部', reporter: '张伟', reportDate: '2026-03-18' }
    ];

    function saveToStorage() {
        try { localStorage.setItem('emergencyCommandData', JSON.stringify(embeddedData)); } catch (e) {}
    }

    function parseDateRange(range) {
        if (!range || range === '全部日期') return null;
        var parts = range.split(' ~ ');
        if (parts.length !== 2) return null;
        return { start: parts[0], end: parts[1] };
    }

    function getFilteredData() {
        var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        return embeddedData.filter(function(item) {
            if (keyword) {
                var hay = (item.orgName + ' ' + item.location + ' ' + item.reportUnit).toLowerCase();
                if (hay.indexOf(keyword) === -1) return false;
            }
            for (var k in selectedFilters) {
                var val = selectedFilters[k];
                if (!val) continue;
                if (k === 'reportUnit' && item.reportUnit !== val) return false;
                if (k === 'dateRange') {
                    var range = parseDateRange(val);
                    if (range && item.reportDate) {
                        var d = item.reportDate.slice(0, 10);
                        if (d < range.start || d > range.end) return false;
                    }
                }
            }
            return true;
        });
    }

    function renderCard(item) {
        return '<div class="org-card-item" data-id="' + item.no + '">' +
            '<div class="org-main" onclick="goDetail(' + item.no + ')">' +
                '<i class="fa-solid fa-building-columns org-icon"></i>' +
                '<div class="org-info">' +
                    '<div class="org-name">' + App.escapeHtml(item.orgName) + '</div>' +
                    '<div class="org-phone">' + App.escapeHtml(item.officePhone || '—') + '</div>' +
                    '<div class="org-location">' + App.escapeHtml(item.location || '—') + '</div>' +
                '</div>' +
            '</div>' +
            '<div class="org-call-zone" onclick="event.stopPropagation();window.location.href=\'tel:' + App.escapeHtml(item.officePhone) + '\';App.showToast(\'正在呼叫 ' + App.escapeHtml(item.orgName) + ' ' + App.escapeHtml(item.officePhone) + '\')">' +
                '<div class="org-call-btn"><i class="fa-solid fa-phone"></i></div>' +
            '</div>' +
        '</div>';
    }

    function renderList(append) {
        var data = getFilteredData();
        var container = document.getElementById('cardList');
        if (!append) container.innerHTML = '';
        document.getElementById('totalCount').textContent = '共 ' + data.length + ' 条通讯信息';
        if (data.length === 0) {
            document.getElementById('empty').style.display = 'block';
            return;
        }
        document.getElementById('empty').style.display = 'none';
        var start = append ? (currentPage - 1) * pageSize : 0;
        var pageData = data.slice(start, start + pageSize);
        pageData.forEach(function(item) { container.innerHTML += renderCard(item); });
        hasMore = data.length > start + pageData.length;
    }

    window.goDetail = function(id) {
        saveToStorage();
        window.location.href = 'emergency-command-detail.html?id=' + id;
    };

    function updateSearchClear() {
        var btn = document.getElementById('clearSearch');
        btn.style.display = document.getElementById('searchInput').value ? 'flex' : 'none';
    }

    window.clearSearch = function(e) {
        e.stopPropagation();
        document.getElementById('searchInput').value = '';
        updateSearchClear();
        currentPage = 1;
        renderList(false);
    };

    document.getElementById('searchInput').addEventListener('input', function() {
        updateSearchClear();
        currentPage = 1;
        renderList(false);
    });

    function renderSelectedTags() {
        var container = document.getElementById('selectedTags');
        var html = '';
        var count = 0;
        for (var k in selectedFilters) {
            var val = selectedFilters[k];
            if (!val) continue;
            var cfg = filterConfig.find(function(f) { return f.key === k; });
            html += '<span class="tag">' + cfg.title + '：' + App.escapeHtml(val) + '<i class="fa-solid fa-times" onclick="removeFilter(\'' + k + '\')"></i></span>';
            count++;
        }
        container.innerHTML = html;

        var badge = document.getElementById('filterBadge');
        var dot = document.getElementById('filterDot');
        var trigger = document.getElementById('filterTrigger');
        if (count > 0) {
            badge.textContent = count;
            badge.style.display = 'flex';
            dot.style.display = 'none';
            trigger.classList.add('active');
        } else {
            badge.style.display = 'none';
            dot.style.display = 'none';
            trigger.classList.remove('active');
        }
    }

    window.removeFilter = function(key) {
        selectedFilters[key] = '';
        currentPage = 1;
        renderSelectedTags();
        renderDrawer();
        renderList(false);
    };

    window.openDrawer = function() {
        document.getElementById('drawerOverlay').classList.add('show');
        document.getElementById('drawer').classList.add('show');
    };

    window.closeDrawer = function() {
        document.getElementById('drawerOverlay').classList.remove('show');
        document.getElementById('drawer').classList.remove('show');
    };

    function renderDrawer() {
        var html = '';
        filterConfig.forEach(function(cfg) {
            html += '<div class="filter-section">';
            html += '<div class="filter-title">' + cfg.title + '</div>';
            html += '<div class="filter-options">';
            cfg.options.forEach(function(opt) {
                var active = selectedFilters[cfg.key] === opt ? ' active' : '';
                html += '<span class="filter-chip' + active + '" onclick="selectChip(this, \'' + cfg.key + '\', \'' + opt + '\')">' + opt + '</span>';
            });
            html += '</div></div>';
        });
        document.getElementById('drawerBody').innerHTML = html;
    }

    window.selectChip = function(el, key, value) {
        var group = el.parentElement;
        group.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
        if (selectedFilters[key] === value) {
            selectedFilters[key] = '';
        } else {
            selectedFilters[key] = value;
            el.classList.add('active');
        }
    };

    window.confirmFilters = function() {
        currentPage = 1;
        renderSelectedTags();
        closeDrawer();
        renderList(false);
    };

    window.resetFilters = function() {
        filterConfig.forEach(function(cfg) { selectedFilters[cfg.key] = ''; });
        renderDrawer();
        confirmFilters();
    };

    function onScroll() {
        if (isLoading || !hasMore) return;
        var scrollTop = window.scrollY || document.documentElement.scrollTop;
        var scrollHeight = document.documentElement.scrollHeight;
        var clientHeight = document.documentElement.clientHeight;
        if (scrollTop + clientHeight >= scrollHeight - 60) {
            isLoading = true;
            document.getElementById('loading').style.display = 'block';
            setTimeout(function() {
                currentPage++;
                renderList(true);
                isLoading = false;
                document.getElementById('loading').style.display = 'none';
            }, 400);
        }
    }

    document.querySelector('.content-sheet.page-body-sheet').addEventListener('scroll', onScroll);

    renderDrawer();
    renderSelectedTags();
    renderList(false);
})();
</script>
</body>
</html>
