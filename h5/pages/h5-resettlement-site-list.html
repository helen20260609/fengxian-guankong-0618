<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>集中安置场所</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
:root { --primary: #1a73e8; --primary-rgb: 26,115,232; --success: #34a853; --success-rgb: 52,168,83; --danger: #ea4335; --warning: #f9ab00; --text-primary: #202124; --text2: #5f6368; --card: #fff; --bg: #f5f6fa; --border: #e8eaed; --shadow: rgba(60,64,67,.08); --radius: 10px; --radius-sm: 6px; --radius-lg: 16px; --input-bg: #f8f9fa; }
body { background: var(--bg); }

.phone-shell { display: flex; flex-direction: column; overflow: hidden; position: relative; background: var(--bg); }
.content-sheet.page-body-sheet { flex: 1; overflow-y: auto; overflow-x: hidden; margin-top: 0; padding: 18px 14px 14px; border-radius: 0; box-shadow: none; border: none; background: transparent; scrollbar-width: none; -ms-overflow-style: none; }
.content-sheet.page-body-sheet::-webkit-scrollbar { display: none; }
.content-sheet .search-bar { align-items: center; gap: 10px; margin-top: 0; background: transparent; box-shadow: none; border: none; padding: 0; }
.content-sheet .search-input-wrapper { display: flex; align-items: center; background: var(--card); border-radius: var(--radius); box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); min-height: 40px; position: relative; flex: 1; }
.content-sheet .search-input-wrapper input { background: transparent; border: none; height: 40px; padding: 0 30px 0 34px; flex: 1; width: 100%; min-width: 0; font-size: 14px; color: var(--text-primary); }
.content-sheet .search-input-wrapper .search-icon { position: absolute; left: 12px; color: var(--text2); font-size: 13px; }
.content-sheet .filter-trigger { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 14px; background: var(--card); color: var(--text2); font-size: 13px; font-weight: 400; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 2px 8px var(--shadow); cursor: pointer; position: relative; transition: all .15s; }
.content-sheet .filter-trigger:active { transform: scale(.96); }

.search-input-wrapper .clear-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; border-radius: 50%; background: var(--text2); color: #fff; font-size: 10px; display: none; align-items: center; justify-content: center; cursor: pointer; border: none; padding: 0; }

.selected-tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.tag { background: rgba(var(--primary-rgb),.08); color: var(--primary); border: 1px solid rgba(var(--primary-rgb),.18); border-radius: 999px; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.tag i { cursor: pointer; font-size: 10px; }

.summary-bar { color: var(--text2); font-size: 13px; margin-bottom: 14px; }
.summary-bar strong { color: #e65100; margin: 0 2px; }

.section-v2 { background: transparent; border-radius: 0; box-shadow: none; border: none; padding: 0; margin-bottom: 0; }
.sv2-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sv2-title { font-size: 15px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 0; }
.sv2-title i { color: var(--primary); margin-right: 6px; font-size: 16px; }
.sv2-more { font-size: 13px; color: var(--text2); }
.sv2-more strong { color: var(--primary); margin: 0 2px; }
.card-list { padding: 0; }

.site-card { background: var(--card); border-radius: 14px; box-shadow: 0 2px 10px var(--shadow); border: 1px solid var(--border); padding: 14px; margin-bottom: 12px; cursor: pointer; transition: transform .12s; }
.site-card:active { transform: scale(.99); }
.card-left { display: none; }
.card-arrow { display: none; }
.card-right { width: 100%; }
.card-title { font-size: 17px; font-weight: 700; color: var(--text-primary); line-height: 1.4; margin-bottom: 6px; }
.card-address { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.card-address i { font-size: 12px; flex-shrink: 0; }
.metric-row { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text2); margin-bottom: 10px; }
.metric-item { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.metric-item i { font-size: 12px; flex-shrink: 0; color: var(--primary); }
.metric-item span { color: var(--text-primary); font-weight: 600; }
.metric-divider { width: 1px; height: 12px; background: var(--border); flex-shrink: 0; }
.contact-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
.contact-info { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.contact-info i { font-size: 12px; flex-shrink: 0; }
.contact-info span { color: var(--text-primary); font-weight: 600; }
.call-btn { background: var(--success); color: #fff; border: none; border-radius: 18px; padding: 5px 12px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; flex-shrink: 0; box-shadow: 0 2px 6px rgba(var(--success-rgb), .35); }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text2); display: none; }
.empty-state i { font-size: 48px; margin-bottom: 12px; opacity: .5; }
.empty-state .empty-title { font-size: 15px; color: var(--text-primary); margin-bottom: 6px; }
.empty-state .empty-desc { font-size: 13px; }
.bottom-spacer { height: 20px; }

.modal-sheet { position: absolute; left: 0; bottom: 0; width: 100%; max-height: 80%; display: flex !important; flex-direction: column; opacity: 0; pointer-events: none; transform: translateY(100%); transition: transform .25s ease, opacity .25s ease; z-index: 1001; background: var(--card); border-radius: var(--radius-lg) var(--radius-lg) 0 0; scrollbar-width: none; -ms-overflow-style: none; }
.modal-sheet::-webkit-scrollbar { display: none; }
.modal-sheet.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.modal-mask { display: none; opacity: 0; transition: opacity .25s ease; z-index: 1000; }
.modal-mask.show { display: block; opacity: 1; }
.sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sheet-title { font-size: 16px; font-weight: 700; }
.sheet-close { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--text2); cursor: pointer; }
.sheet-body { padding: 16px; flex: 1; overflow-y: auto; min-height: 0; scrollbar-width: none; -ms-overflow-style: none; }
.sheet-body::-webkit-scrollbar { display: none; }
.filter-section { margin-bottom: 18px; }
.filter-section .filter-title { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 10px; }
.filter-section .filter-options { display: flex; flex-wrap: wrap; gap: 10px; }
.filter-chip { padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-primary); cursor: pointer; transition: all .15s; }
.filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.sheet-footer { display: flex; gap: 12px; padding: 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
.sheet-footer .btn { flex: 1; height: 44px; border-radius: 10px; font-size: 15px; font-weight: 600; border: none; cursor: pointer; }
.sheet-footer .btn-outline { background: var(--input-bg); color: var(--text-primary); border: 1px solid var(--border); }
.sheet-footer .btn-primary { background: var(--primary); color: #fff; }

:root[data-theme="dark"] .content-sheet .search-input-wrapper input { background: transparent; }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="top-sticky">
            <div class="status-bar light">
                <span class="sb-time" id="statusTime">9:41</span>
                <span class="sb-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                    <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
                </span>
            </div>
            <div class="page-hero">
                <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
                <div class="ph-title">集中安置场所</div>
            </div>
        </div>

        <div class="content-sheet page-body-sheet">
            <div class="search-bar">
                <div class="search-input-wrapper">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="场所名称/地址/联系人/联系方式" autocomplete="off">
                    <button class="clear-btn" id="clearSearch" onclick="clearSearch(event)"><i class="fa-solid fa-times"></i></button>
                </div>
                <div class="filter-trigger" id="filterTrigger" onclick="openDrawer()">
                    <i class="fa-solid fa-filter"></i> 筛选
                </div>
            </div>

            <div class="selected-tags" id="selectedTags"></div>
            <div class="summary-bar" id="summaryBar"></div>

            <div class="section-v2" id="listSection">
                <div class="sv2-head">
                    <div class="sv2-title">
                        <i class="fa-solid fa-house-medical"></i>
                        集中安置场所
                    </div>
                    <div class="sv2-more" id="totalCount">共 0 处</div>
                </div>
                <div class="card-list" id="cardList"></div>
                <div class="loading" id="loading" style="display:none">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> 加载中…
                </div>
                <div class="empty-state" id="empty">
                    <i class="fa-regular fa-folder-open"></i>
                    <div class="empty-title">暂无符合条件的场所</div>
                    <div class="empty-desc">请调整筛选或搜索条件</div>
                </div>
                <div class="bottom-spacer"></div>
            </div>
        </div>

        <div class="modal-mask" id="drawerOverlay" onclick="closeDrawer()"></div>
        <div class="modal-sheet" id="drawer">
            <div class="sheet-header">
                <div class="sheet-title">筛选条件</div>
                <div class="sheet-close" onclick="closeDrawer()"><i class="fa-solid fa-times"></i></div>
            </div>
            <div class="sheet-body" id="drawerBody"></div>
            <div class="sheet-footer">
                <button class="btn btn-outline" onclick="resetFilters()">重置</button>
                <button class="btn btn-primary" onclick="confirmFilters()">确定</button>
            </div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../../data/resettlement-site-data.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    var rawData = (typeof resettlementSiteData !== 'undefined' && Array.isArray(resettlementSiteData)) ? resettlementSiteData : [];
    var allData = rawData.map(function(item) {
        return {
            no: item.no || '',
            name: item.name || '',
            address: item.address || '',
            coordinates: item.coordinates || '',
            area: parseArea(item.area),
            capacity: parseNumber(item.capacity),
            contact: item.contact || '',
            contactPhone: item.contactPhone || '',
            maintainUnit: item.maintainUnit || '',
            maintainContact: item.maintainContact || '',
            maintainPhone: item.maintainPhone || '',
            remark: item.remark || '',
            reportUnit: item.reportUnit || '',
            reporter: item.reporter || '',
            reportDate: item.reportDate || ''
        };
    });

    function parseNumber(v) {
        if (!v && v !== 0) return '';
        var n = parseFloat(String(v).replace(/[^0-9.]/g, ''));
        return isNaN(n) ? '' : n;
    }
    function parseArea(v) {
        if (!v && v !== 0) return '';
        var n = parseFloat(String(v).replace(/[^0-9.]/g, ''));
        return isNaN(n) ? '' : n;
    }

    var selectedFilters = { capacity: '', area: '' };
    var capacityOptions = ['全部', '0-200', '200-500', '500+'];
    var areaOptions = ['全部', '0-500', '500-1000', '1000+'];

    function getFilteredData() {
        var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        return allData.filter(function(item) {
            if (keyword) {
                var hay = [item.name, item.address, item.contact, item.contactPhone, item.maintainUnit].join(' ').toLowerCase();
                if (hay.indexOf(keyword) === -1) return false;
            }
            if (selectedFilters.capacity && selectedFilters.capacity !== '全部') {
                if (!matchRange(item.capacity, selectedFilters.capacity)) return false;
            }
            if (selectedFilters.area && selectedFilters.area !== '全部') {
                if (!matchRange(item.area, selectedFilters.area)) return false;
            }
            return true;
        });
    }

    function matchRange(value, range) {
        if (value === '' || value === null || value === undefined) return false;
        if (range === '0-200') return value <= 200;
        if (range === '200-500') return value > 200 && value <= 500;
        if (range === '500+') return value > 500;
        if (range === '0-500') return value <= 500;
        if (range === '500-1000') return value > 500 && value <= 1000;
        if (range === '1000+') return value > 1000;
        return true;
    }

    function renderCard(item) {
        var hasPhone = item.contactPhone && String(item.contactPhone).trim();
        return '<div class="site-card" onclick="goDetail(' + item.no + ')" data-id="' + item.no + '">' +
            '<div class="card-right">' +
                '<div class="card-title">' + App.escapeHtml(item.name) + '</div>' +
                '<div class="card-address"><i class="fa-solid fa-location-dot"></i>' + App.escapeHtml(item.address || '—') + '</div>' +
                '<div class="metric-row">' +
                    '<div class="metric-item"><i class="fa-solid fa-chart-simple"></i>可安置：<span>' + (item.capacity || '—') + '</span>人</div>' +
                    '<div class="metric-divider"></div>' +
                    '<div class="metric-item"><i class="fa-solid fa-ruler-combined"></i>避难面积：<span>' + (item.area || '—') + '</span>㎡</div>' +
                '</div>' +
                '<div class="contact-row">' +
                    '<div class="contact-info"><i class="fa-regular fa-user"></i>联系人：<span>' + App.escapeHtml(item.contact || '—') + '</span>' + (hasPhone ? ' (' + App.escapeHtml(item.contactPhone) + ')' : '') + '</div>' +
                    (hasPhone ? '<a class="call-btn" href="tel:' + App.escapeHtml(item.contactPhone) + '" onclick="event.stopPropagation();App.showToast(\'正在呼叫 ' + App.escapeHtml(item.contact) + ' ' + App.escapeHtml(item.contactPhone) + '\')"><i class="fa-solid fa-phone"></i>拨打</a>' : '') +
                '</div>' +
            '</div>' +
        '</div>';
    }

    function renderList() {
        var data = getFilteredData();
        var container = document.getElementById('cardList');
        container.innerHTML = '';
        var totalCapacity = 0, totalArea = 0, count = 0;
        data.forEach(function(item) {
            count++;
            if (item.capacity) totalCapacity += Number(item.capacity);
            if (item.area) totalArea += Number(item.area);
        });
        document.getElementById('totalCount').innerHTML = '共 <strong>' + count + '</strong> 处';
        document.getElementById('summaryBar').innerHTML = '';
        if (data.length === 0) {
            document.getElementById('empty').style.display = 'block';
            return;
        }
        document.getElementById('empty').style.display = 'none';
        data.forEach(function(item) { container.innerHTML += renderCard(item); });
    }

    window.goDetail = function(id) {
        window.location.href = 'h5-resettlement-site-detail.html?id=' + id;
    };

    function updateSearchClear() {
        var btn = document.getElementById('clearSearch');
        btn.style.display = document.getElementById('searchInput').value ? 'flex' : 'none';
    }

    window.clearSearch = function(e) {
        e.stopPropagation();
        document.getElementById('searchInput').value = '';
        updateSearchClear();
        renderList();
    };

    document.getElementById('searchInput').addEventListener('input', function() {
        updateSearchClear();
        renderList();
    });
    document.getElementById('searchInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') renderList();
    });

    window.openDrawer = function() {
        document.getElementById('drawerOverlay').classList.add('show');
        document.getElementById('drawer').classList.add('show');
    };
    window.closeDrawer = function() {
        document.getElementById('drawerOverlay').classList.remove('show');
        document.getElementById('drawer').classList.remove('show');
    };

    function renderDrawer() {
        var html = '';
        html += '<div class="filter-section">';
        html += '<div class="filter-title">可安置人数</div>';
        html += '<div class="filter-options">';
        capacityOptions.forEach(function(opt) {
            var active = selectedFilters.capacity === opt ? ' active' : '';
            html += '<span class="filter-chip' + active + '" onclick="selectChip(this, \'capacity\', \'' + opt + '\')">' + opt + '</span>';
        });
        html += '</div></div>';
        html += '<div class="filter-section">';
        html += '<div class="filter-title">有效避难面积</div>';
        html += '<div class="filter-options">';
        areaOptions.forEach(function(opt) {
            var active = selectedFilters.area === opt ? ' active' : '';
            html += '<span class="filter-chip' + active + '" onclick="selectChip(this, \'area\', \'' + opt + '\')">' + opt + '</span>';
        });
        html += '</div></div>';
        document.getElementById('drawerBody').innerHTML = html;
    }

    window.selectChip = function(el, key, value) {
        var group = el.parentElement;
        group.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
        if (selectedFilters[key] === value) {
            selectedFilters[key] = '';
        } else {
            selectedFilters[key] = value;
            el.classList.add('active');
        }
    };

    window.confirmFilters = function() {
        renderSelectedTags();
        closeDrawer();
        renderList();
    };

    window.resetFilters = function() {
        selectedFilters = { capacity: '', area: '' };
        renderDrawer();
        renderSelectedTags();
        renderList();
    };

    window.removeFilter = function(key) {
        selectedFilters[key] = '';
        renderDrawer();
        renderSelectedTags();
        renderList();
    };

    function renderSelectedTags() {
        var html = '', count = 0;
        if (selectedFilters.capacity && selectedFilters.capacity !== '全部') {
            html += '<span class="tag">可安置：' + App.escapeHtml(selectedFilters.capacity) + '<i class="fa-solid fa-times" onclick="removeFilter(\'capacity\')"></i></span>';
            count++;
        }
        if (selectedFilters.area && selectedFilters.area !== '全部') {
            html += '<span class="tag">面积：' + App.escapeHtml(selectedFilters.area) + '<i class="fa-solid fa-times" onclick="removeFilter(\'area\')"></i></span>';
            count++;
        }
        document.getElementById('selectedTags').innerHTML = html;
    }

    function updateTime() {
        var now = new Date();
        var h = now.getHours();
        var m = now.getMinutes();
        document.getElementById('statusTime').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    }
    updateTime();
    setInterval(updateTime, 60000);

    renderDrawer();
    renderSelectedTags();
    renderList();
})();
</script>
</body>
</html>
