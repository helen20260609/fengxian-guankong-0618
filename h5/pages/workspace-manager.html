<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>风险管控 · 管理工作台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>

.ws-hero { background:linear-gradient(135deg, #1a73e8 0%, #1557b0 100%); margin-top:-34px; padding:50px 18px 22px; color:#fff; position:relative; z-index:1; }
.ws-hero h1 { font-size: 19px; font-weight:700; }
.ws-hero p { font-size:12.5px; opacity:.85; margin-top:5px; }

.todo-strip { margin:14px 14px 0; display:flex; gap:10px; }
.todo-strip .ts-item { flex:1; background:var(--card); border-radius: 8px; padding:13px 12px; border:1px solid var(--border); box-shadow:0 2px 8px var(--shadow); display:flex; align-items:center; gap:10px; }
.ts-item .ts-ico { width:34px; height:34px; border-radius: 8px; display:flex; align-items:center; justify-content:center; font-size: 14px; flex-shrink:0; color:var(--primary); background:rgba(var(--primary-rgb),.08); border:1px solid rgba(var(--primary-rgb),.15); }
.ts-item .ts-num { font-size: 18px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.ts-item .ts-lbl { font-size: 10px; color:var(--text2); margin-top:3px; }

.ws-group { margin:18px 14px 0; }
.ws-group-title { font-size: 12px; font-weight:700; color:var(--text2); margin-bottom:10px; display:flex; align-items:center; gap:6px; }
.ws-group-title i { color:var(--primary); font-size: 11px; }
.ws-grid { background:var(--card); border-radius: 10px; box-shadow:0 2px 10px var(--shadow); border:1px solid var(--border); padding:6px; display:grid; grid-template-columns:repeat(4,1fr); row-gap:14px; }
.ws-grid .fn-item { display:flex; flex-direction:column; align-items:center; gap:7px; position:relative; padding:8px 0; }
.ws-grid .fn-item .fn-icon { width:44px; height:44px; border-radius: 10px; display:flex; align-items:center; justify-content:center; font-size: 18px; color:var(--primary); background:rgba(var(--primary-rgb),.08); border:1px solid rgba(var(--primary-rgb),.15); }
.ws-grid .fn-item .fn-label { font-size: 11px; }
.ws-grid .fn-item .fn-dot { position:absolute; top:4px; left:50%; margin-left:18px; width:8px; height:8px; background:#ff3b30; border-radius:50%; border:1.5px solid var(--card); }
</style>
</head>
<body>
<div class="phone-frame">
    <!-- 侧边按钮 -->
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <!-- 状态栏 -->
    <div class="status-bar light">
        <span class="sb-time" id="statusTime">9:41</span>
        <span class="sb-icons">
            <i class="fa-regular fa-signal"></i>
            <i class="fa-regular fa-wifi" style="margin-left:4px"></i>
            <i class="fa-regular fa-battery-full" style="margin-left:4px"></i>
        </span>
    </div>

    <div class="ws-hero anim">
        <h1>管理工作台</h1>
        <p>聚合管理与审批功能，全局指挥调度</p>
    </div>

    <!-- 常用应用（可编辑，与首页共享） -->
    <div class="manager-apps anim d2" id="managerApps">
        <div class="ma-head">
            <div class="ma-title"><i class="fa-solid fa-table-cells" style="margin-right:6px"></i>常用应用</div>
            <div class="ma-edit tap" onclick="openAppEditor()">编辑</div>
        </div>
        <div class="ma-grid" id="managerAppGrid">
            <!-- 动态填充 -->
        </div>
    </div>

    <!-- 应用编辑弹窗 -->
    <div class="app-editor-mask" id="appEditorMask" onclick="closeAppEditor(event)">
        <div class="app-editor-sheet" onclick="event.stopPropagation()">
            <div class="ae-head">
                <div class="ae-title">添加常用应用</div>
                <div class="ae-close tap" onclick="closeAppEditor()"><i class="fa-solid fa-xmark"></i></div>
            </div>
            <div class="ae-grid" id="appEditorGrid">
                <!-- 动态填充 -->
            </div>
            <button class="btn btn-primary btn-block" style="margin-top:16px" onclick="saveManagerApps()">保存</button>
        </div>
    </div>

    <!-- 待办概览 -->
    <div class="todo-strip anim d2">
        <div class="ts-item tap" onclick="App.go('inspection-tasks.html')">
            <div class="ts-ico"><i class="fa-solid fa-list-check"></i></div>
            <div><div class="ts-num" id="todoCount">12</div><div class="ts-lbl">待办事项</div></div>
        </div>
        <div class="ts-item tap" onclick="App.go('warning-center.html')">
            <div class="ts-ico"><i class="fa-solid fa-bell"></i></div>
            <div><div class="ts-num" id="warningCount">3</div><div class="ts-lbl">预警待处</div></div>
        </div>
        <div class="ts-item tap" onclick="App.go('hidden-danger-list.html')">
            <div class="ts-ico"><i class="fa-solid fa-file-circle-check"></i></div>
            <div><div class="ts-num" id="approvalCount">5</div><div class="ts-lbl">待审批</div></div>
        </div>
    </div>

    <!-- 监测预警 -->
    <div class="ws-group anim d3">
        <div class="ws-group-title"><i class="fa-solid fa-tower-broadcast"></i>监测预警</div>
        <div class="ws-grid">
            <div class="fn-item tap" onclick="App.go('monitoring.html')">
                <div class="fn-icon"><i class="fa-solid fa-gauge-high"></i></div>
                <div class="fn-label">实时监测</div>
            </div>
            <div class="fn-item tap" onclick="App.go('warning-center.html')">
                <span class="fn-dot" id="warnDot"></span>
                <div class="fn-icon"><i class="fa-solid fa-bell"></i></div>
                <div class="fn-label">预警中心</div>
            </div>
            <div class="fn-item tap" onclick="App.go('real-time-release.html')">
                <div class="fn-icon"><i class="fa-solid fa-bullhorn"></i></div>
                <div class="fn-label">实时发布</div>
            </div>
            <div class="fn-item tap" onclick="App.go('decision-info.html')">
                <div class="fn-icon"><i class="fa-solid fa-sitemap"></i></div>
                <div class="fn-label">辅助决策</div>
            </div>
        </div>
    </div>

<div class="ws-group anim d3">
        <div class="ws-group-title"><i class="fa-solid fa-cloud-showers-heavy"></i>防汛防台</div>
        <div class="ws-grid">
            <div class="fn-item tap" onclick="App.go('pages/emergency-leadership-list.html')">
                <div class="fn-icon"><i class="fa-solid fa-users"></i></div>
                <div class="fn-label">应急领导小组</div>
            </div>
            <div class="fn-item tap" onclick="App.go('pages/personnel-transfer-list.html')">
                <div class="fn-icon"><i class="fa-solid fa-people-roof"></i></div>
                <div class="fn-label">人员转移安置</div>
            </div>
            <div class="fn-item tap" onclick="App.go('pages/disaster-management-list.html')">
                <div class="fn-icon"><i class="fa-solid fa-house-crack"></i></div>
                <div class="fn-label">灾情管理</div>
            </div>
            <div class="fn-item tap" onclick="App.go('h5-key-guarantee-list.html')">
                <div class="fn-icon"><i class="fa-solid fa-shield-halved"></i></div>
                <div class="fn-label">重点保障区域</div>
            </div>
        </div>
    </div>

    <!-- 综合应用 -->
    <div class="ws-group anim d3">
        <div class="ws-group-title"><i class="fa-solid fa-diagram-project"></i>综合应用</div>
        <div class="ws-grid">
            <div class="fn-item tap" onclick="App.go('one-map.html')">
                <div class="fn-icon"><i class="fa-solid fa-map"></i></div>
                <div class="fn-label">一张图</div>
            </div>
            <div class="fn-item tap" onclick="App.go('contacts.html')">
                <div class="fn-icon"><i class="fa-solid fa-address-book"></i></div>
                <div class="fn-label">通讯录</div>
            </div>
            <div class="fn-item tap" onclick="App.go('risk-list.html')">
                <div class="fn-icon"><i class="fa-solid fa-book-open"></i></div>
                <div class="fn-label">风险清单</div>
            </div>
            <div class="fn-item tap" onclick="App.go('knowledge-laws.html')">
                <div class="fn-icon"><i class="fa-solid fa-book-open-reader"></i></div>
                <div class="fn-label">知识栏目</div>
            </div>
        </div>
    </div>

    <!-- 审批管理 -->
    <div class="ws-group anim d3">
        <div class="ws-group-title"><i class="fa-solid fa-stamp"></i>审批管理</div>
        <div class="ws-grid">
            <div class="fn-item tap" onclick="App.go('hidden-danger-list.html')">
                <span class="fn-dot" id="approvalDot"></span>
                <div class="fn-icon"><i class="fa-solid fa-file-circle-check"></i></div>
                <div class="fn-label">待办审批</div>
            </div>
            <div class="fn-item tap" onclick="App.showToast('审批历史功能开发中')">
                <div class="fn-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
                <div class="fn-label">审批历史</div>
            </div>
            <div class="fn-item tap" onclick="App.showToast('签署文件功能开发中')">
                <div class="fn-icon"><i class="fa-solid fa-file-signature"></i></div>
                <div class="fn-label">签署文件</div>
            </div>
            <div class="fn-item tap" onclick="App.showToast('转交他人功能开发中')">
                <div class="fn-icon"><i class="fa-solid fa-share-from-square"></i></div>
                <div class="fn-label">转交他人</div>
            </div>
        </div>
    </div>

    <!-- 数据分析 -->
    <div class="ws-group anim d3">
        <div class="ws-group-title"><i class="fa-solid fa-chart-line"></i>数据分析</div>
        <div class="ws-grid">
            <div class="fn-item tap" onclick="App.go('event-display.html')">
                <div class="fn-icon"><i class="fa-solid fa-chart-column"></i></div>
                <div class="fn-label">事件分类</div>
            </div>
            <div class="fn-item tap" onclick="App.go('score-evaluation.html')">
                <div class="fn-icon"><i class="fa-solid fa-star-half-stroke"></i></div>
                <div class="fn-label">分数评价</div>
            </div>
            <div class="fn-item tap" onclick="App.go('assessment.html')">
                <div class="fn-icon"><i class="fa-solid fa-magnifying-glass-chart"></i></div>
                <div class="fn-label">趋势分析</div>
            </div>
            <div class="fn-item tap" onclick="App.go('report-generation.html')">
                <div class="fn-icon"><i class="fa-solid fa-file-lines"></i></div>
                <div class="fn-label">报告生成</div>
            </div>
        </div>
    </div>

    <div class="bottom-spacer"></div>

    <!-- 底部标签栏 -->
    <div class="tab-bar" id="tabBar"></div>

    </div>
</div>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    // 本页为管理人员工作台，固定角色为 manager
    App.setRole('manager');

    // 状态栏时间
    var now = new Date();
    document.getElementById('statusTime').textContent =
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

    // 待办统计
    document.getElementById('todoCount').textContent = DataStore.stats.todo;
    document.getElementById('warningCount').textContent = DataStore.stats.warning;
    document.getElementById('approvalCount').textContent = DataStore.stats.approval;
    App.state = DataStore.stats;

    // 红点
    document.getElementById('warnDot').style.display = DataStore.stats.warning > 0 ? 'block' : 'none';
    document.getElementById('approvalDot').style.display = DataStore.stats.approval > 0 ? 'block' : 'none';

    // 常用应用（按当前角色派发）
    var selectedAppIds = App.getHomeApps(App.role);

    function renderManagerApps() {
        var grid = document.getElementById('managerAppGrid');
        var appIds = App.getHomeApps(App.role);
        var apps = App.getHomeAppPool(App.role).filter(function(app) { return appIds.indexOf(app.id) !== -1; });
        if (!apps.length) {
            grid.innerHTML = '<div class="empty-state-sm" style="grid-column:1/-1;padding:20px">点击「编辑」添加常用应用</div>';
            return;
        }
        grid.innerHTML = apps.map(function(app) {
            return '<div class="ma-item tap" onclick="App.go(\'' + app.href + '\')">' +
                '<i class="fa-solid ' + app.icon + '"></i>' +
                '<span>' + App.escapeHtml(app.label) + '</span>' +
            '</div>';
        }).join('');
    }

    window.openAppEditor = function() {
        selectedAppIds = App.getHomeApps(App.role);
        var grid = document.getElementById('appEditorGrid');
        grid.innerHTML = App.getHomeAppPool(App.role).map(function(app) {
            var selected = selectedAppIds.indexOf(app.id) !== -1;
            return '<div class="ae-item ' + (selected ? 'selected' : '') + ' tap" data-id="' + app.id + '" onclick="toggleApp(this, \'' + app.id + '\')">' +
                '<div class="ae-check"><i class="fa-solid fa-check"></i></div>' +
                '<i class="fa-solid ' + app.icon + '"></i>' +
                '<span>' + App.escapeHtml(app.label) + '</span>' +
            '</div>';
        }).join('');
        document.getElementById('appEditorMask').classList.add('show');
    };

    window.closeAppEditor = function(e) {
        if (e && !e.target.classList.contains('app-editor-mask')) return;
        document.getElementById('appEditorMask').classList.remove('show');
    };

    window.toggleApp = function(el, id) {
        el.classList.toggle('selected');
        var idx = selectedAppIds.indexOf(id);
        if (idx === -1) {
            selectedAppIds.push(id);
        } else {
            selectedAppIds.splice(idx, 1);
        }
    };

    window.saveManagerApps = function() {
        var btn = document.activeElement;
        if (btn) btn.disabled = true;
        App.showLoading('保存中...');
        setTimeout(function() {
            App.setHomeApps(selectedAppIds, App.role);
            renderManagerApps();
            closeAppEditor();
            App.hideLoading();
            if (btn) btn.disabled = false;
            App.showToast('常用应用已保存');
        }, 600);
    };

    renderManagerApps();
    App.renderTabBar('workspace');

    // 若从首页“编辑”跳转而来，自动打开应用编辑器
    if (new URLSearchParams(window.location.search).get('mode') === 'edit') {
        openAppEditor();
    }
})();
</script>
</body>
</html>
