<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>工作台设置</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>

/* 顶部固定区：白底 */
.top-sticky {
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 100;
    background: #fff;
    border-bottom: 1px solid var(--border);
}
.top-sticky .status-bar { background: transparent; color: var(--text-primary); position: relative; z-index: 100; }

.page-header {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 14px 12px;
    position: relative;
}
.page-header .ph-back {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--text-primary);
    cursor: pointer;
}
.page-header .ph-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
}
.page-header .ph-done {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    color: var(--primary);
    font-weight: 600;
    cursor: pointer;
}

.content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    background: #f5f6fa;
}
.content::-webkit-scrollbar { display: none; }
.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; }

.section { margin-top: 12px; background: #fff; padding: 16px 14px; }
.section-title { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
.section-sub { font-size: 12px; color: var(--text2); margin-bottom: 14px; }

.fav-list { display: flex; flex-direction: column; }
.fav-list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
}
.fav-list-item:last-child { border-bottom: none; }
.fav-list-item .remove {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ff4d4f;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    cursor: pointer;
    flex-shrink: 0;
}
.fav-list-item .fi-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #fff;
    flex-shrink: 0;
}
.fav-list-item .fi-label {
    flex: 1;
    font-size: 15px;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.fav-list-item .drag {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--text2);
    flex-shrink: 0;
}

.empty-tip { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 13px; }

/* 颜色 */
.bg-blue { background: linear-gradient(135deg, #5b8ff9, #3b6fd9); }
.bg-indigo { background: linear-gradient(135deg, #7a8cf6, #5766d3); }
.bg-purple { background: linear-gradient(135deg, #9c7bef, #7c5ed6); }
.bg-orange { background: linear-gradient(135deg, #ff9f43, #f07b3f); }
.bg-coral { background: linear-gradient(135deg, #ff6b6b, #ee5a6f); }
.bg-green { background: linear-gradient(135deg, #52c41a, #389e0d); }
.bg-teal { background: linear-gradient(135deg, #13c2c2, #08979c); }
.bg-cyan { background: linear-gradient(135deg, #36cfc9, #08979c); }
.bg-pink { background: linear-gradient(135deg, #ff85c0, #eb2f96); }
.bg-amber { background: linear-gradient(135deg, #ffc53d, #faad14); }
.bg-slate { background: linear-gradient(135deg, #6b7c93, #4a5568); }

.bottom-spacer { height: 20px; }

</style>
</head>
<body>
<div class="phone-frame">
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

        <div class="top-sticky">
            <div class="status-bar">
                <span class="sb-time" id="statusTime">9:41</span>
                <span class="sb-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                    <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
                </span>
            </div>

            <div class="page-header">
                <div class="ph-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
                <div class="ph-title">工作台设置</div>
                <div class="ph-done tap" onclick="App.back()">完成</div>
            </div>
        </div>

        <div class="content" id="content">
            <div class="section">
                <div class="section-title">个人常用应用</div>
                <div class="section-sub">点击下方减号可移除常用应用</div>
                <div class="fav-list" id="favList"></div>
            </div>
            <div class="bottom-spacer"></div>
        </div>

    </div>
</div>

<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    App.setRole('inspector');

    var now = new Date();
    document.getElementById('statusTime').textContent =
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

    var apps = [
        { id: 'emergency-leadership', label: '应急领导小组', icon: 'fa-users', color: 'bg-blue', category: 'flood' },
        { id: 'emergency-command', label: '应急指挥机构', icon: 'fa-address-book', color: 'bg-indigo', category: 'flood' },
        { id: 'response-command', label: '分级响应指挥', icon: 'fa-layer-group', color: 'bg-purple', category: 'flood' },
        { id: 'emergency-duty', label: '应急值班信息', icon: 'fa-user-clock', color: 'bg-blue', category: 'flood' },
        { id: 'flood-risk-point', label: '防汛风险点位', icon: 'fa-droplet', color: 'bg-cyan', category: 'flood' },
        { id: 'waterlogging-point', label: '易积水点位', icon: 'fa-water', color: 'bg-cyan', category: 'flood' },
        { id: 'key-guarantee', label: '重点保障区域', icon: 'fa-shield-halved', color: 'bg-orange', category: 'flood' },
        { id: 'underpass', label: '下立交信息', icon: 'fa-road-bridge', color: 'bg-orange', category: 'flood' },
        { id: 'underground-space', label: '地下空间', icon: 'fa-building', color: 'bg-orange', category: 'flood' },
        { id: 'construction-site', label: '在建工地', icon: 'fa-trowel-bricks', color: 'bg-orange', category: 'flood' },
        { id: 'mobile-device', label: '移动设备信息', icon: 'fa-truck-pickup', color: 'bg-orange', category: 'flood' },
        { id: 'personnel-transfer', label: '人员转移安置', icon: 'fa-people-roof', color: 'bg-green', category: 'flood' },
        { id: 'disaster-management', label: '防汛隐患管理', icon: 'fa-house-crack', color: 'bg-green', category: 'flood' },
        { id: 'flood-special-report', label: '防汛隐患上报', icon: 'fa-file-circle-plus', color: 'bg-coral', category: 'flood' },
        { id: 'resettlement-site', label: '集中安置场所', icon: 'fa-hotel', color: 'bg-green', category: 'flood' },
        { id: 'rescue-team', label: '抢险队伍信息', icon: 'fa-people-group', color: 'bg-green', category: 'flood' },
        { id: 'rescue-materials', label: '抢险物资信息', icon: 'fa-box-open', color: 'bg-green', category: 'flood' },
        { id: 'underpass-three', label: '下立交三联动', icon: 'fa-triangle-exclamation', color: 'bg-green', category: 'flood' },
        { id: 'three-in-place', label: '积水处置三到位', icon: 'fa-list-check', color: 'bg-green', category: 'flood' },
        { id: 'patrol-mission', label: '巡查任务', icon: 'fa-clipboard-list', color: 'bg-coral', category: 'patrol' },
        { id: 'hidden-danger-manage', label: '隐患处置', icon: 'fa-triangle-exclamation', color: 'bg-coral', category: 'patrol' },
        { id: 'feedback-center', label: '反馈中心', icon: 'fa-comments', color: 'bg-coral', category: 'patrol' },
        { id: 'inspection-execute', label: '现场取证', icon: 'fa-camera', color: 'bg-coral', category: 'patrol' },
        { id: 'warning-center', label: '预警信息', icon: 'fa-bell', color: 'bg-coral', category: 'patrol' },
        { id: 'region-management', label: '管辖区域', icon: 'fa-map-location-dot', color: 'bg-blue', category: 'risk' },
        { id: 'risk-list', label: '风险清单', icon: 'fa-book-open', color: 'bg-blue', category: 'risk' },
        { id: 'knowledge-laws', label: '知识栏目', icon: 'fa-scale-balanced', color: 'bg-blue', category: 'risk' },
        { id: 'patrol-track', label: '巡查轨迹', icon: 'fa-route', color: 'bg-green', category: 'assist' },
        { id: 'route-plan', label: '路线规划', icon: 'fa-map-location-dot', color: 'bg-green', category: 'assist' },
        { id: 'online-inspection', label: '在线排查', icon: 'fa-person-walking-arrow-right', color: 'bg-green', category: 'assist' },
        { id: 'monitoring', label: '实时监测', icon: 'fa-tower-broadcast', color: 'bg-green', category: 'assist' }
    ];

    var inspectorHomeIds = App.getInspectorHomeApps();

    function getAppById(id) {
        return apps.find(function(a) { return a.id === id; }) || App.getInspectorAppById(id);
    }

    function renderList() {
        var list = document.getElementById('favList');
        var favApps = [];
        inspectorHomeIds.forEach(function(id) {
            var app = apps.find(function(a) { return a.id === id; });
            if (!app) {
                var poolApp = App.getInspectorAppById(id);
                if (poolApp) {
                    app = apps.find(function(a) { return a.label === poolApp.label; });
                }
            }
            if (app) favApps.push(app);
        });

        if (favApps.length === 0) {
            list.innerHTML = '<div class="empty-tip">暂无常用应用，请返回工作台添加</div>';
            return;
        }

        list.innerHTML = favApps.map(function(app) {
            return '<div class="fav-list-item" data-app-id="' + app.id + '">' +
                '<div class="remove tap" onclick="removeFav(\'' + app.id + '\')"><i class="fa-solid fa-minus"></i></div>' +
                '<div class="fi-icon ' + (app.color || 'bg-blue') + '"><i class="fa-solid ' + app.icon + '"></i></div>' +
                '<div class="fi-label">' + App.escapeHtml(app.label) + '</div>' +
                '<div class="drag"><i class="fa-solid fa-bars"></i></div>' +
            '</div>';
        }).join('');
    }

    window.removeFav = function(id) {
        var idx = inspectorHomeIds.indexOf(id);
        if (idx !== -1) {
            inspectorHomeIds.splice(idx, 1);
            App.setInspectorHomeApps(inspectorHomeIds);
            renderList();
        }
    };

    renderList();
})();
</script>
</body>
</html>
