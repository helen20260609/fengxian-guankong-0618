<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>重点保障区域详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.status-bar { position: relative; z-index: 100; }

.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; }
.content-sheet.page-body-sheet { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.content-sheet.page-body-sheet::-webkit-scrollbar { display: none; }

.hero-detail { padding: 18px 16px 22px; display: flex; flex-direction: column; gap: 6px; }
.hero-title { font-size: 20px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
.hero-subtitle { font-size: 13px; color: rgba(255,255,255,.9); }
.hero-badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 3px 10px; font-size: 12px; color: #fff; margin-top: 8px; width: fit-content;
}

.summary-card {
    background: linear-gradient(180deg, #1557b0 0%, #1a73e8 100%);
    border-radius: 12px;
    margin: 12px 16px 14px;
    padding: 18px 16px;
    color: #fff;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(26,115,232,.22);
}
.summary-card::before {
    content: '';
    position: absolute;
    width: 120px;
    height: 120px;
    right: -30px;
    top: -30px;
    background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%);
    border-radius: 50%;
}
.summary-card .sc-title {
    font-size: 20px;
    font-weight: 700;
    position: relative;
    z-index: 1;
    line-height: 1.35;
}
.summary-card .sc-address {
    font-size: 13px;
    opacity: .9;
    margin-top: 8px;
    position: relative;
    z-index: 1;
    line-height: 1.4;
    display: flex;
    align-items: center;
    gap: 6px;
}
.summary-card .sc-address i { font-size: 12px; }
.summary-card .sc-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.15);
    font-size: 12px;
    opacity: .9;
    position: relative;
    z-index: 1;
}
.summary-card .sc-meta .sep {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,.7);
}

.quick-actions { display: flex; gap: 12px; margin: 16px; }
.qa-btn { flex: 1; height: 72px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 500; text-decoration: none; cursor: pointer; border: none; transition: opacity .15s; background: var(--card); color: var(--text-primary); box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); }
.qa-btn:active { opacity: .85; }
.qa-btn i { font-size: 22px; }
.qa-btn.call i { color: var(--success); }
.qa-btn.location i { color: var(--primary); }
.qa-btn.disabled { color: var(--text2); opacity: .5; pointer-events: none; }

.content-sheet.page-body-sheet { margin-top: 0; border-radius: 0; padding: 0 0 16px; background: var(--bg-dark); }

.section-v2 { background: var(--card); border-radius: 12px; margin: 0 16px 12px; padding: 14px 16px; box-shadow: 0 2px 8px var(--shadow); }
.section-v2:last-of-type { margin-bottom: 16px; }
.sv2-head { margin-bottom: 10px; }
.sv2-title { font-size: 15px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 0; position: relative; padding-left: 10px; }
.sv2-title::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--primary); }
.sv2-title i { color: var(--primary); margin-right: 6px; }

.sc-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #f2f2f2; gap: 16px; }
.sc-row:last-child { border-bottom: none; padding-bottom: 0; }
.sc-row.wrap { align-items: flex-start; }
.sc-label { font-size: 14px; color: var(--text2); text-align: left; line-height: 1.4; flex-shrink: 0; }
.sc-value { flex: 1; min-width: 0; font-size: 14px; color: var(--text-primary); font-weight: 500; text-align: right; line-height: 1.4; word-break: break-word; }
.sc-value.phone { color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; }
.sc-value.phone i { font-size: 12px; }
.sc-value.na { color: var(--text2); }
.sc-value.unit { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; }
.sc-value.unit i { font-size: 12px; color: var(--primary); }

.bottom-spacer { height: 20px; }

:root[data-theme="dark"] .section-v2 { background: var(--bg-card); }
:root[data-theme="dark"] .sc-row { border-bottom-color: var(--border); }
:root[data-theme="dark"] .quick-actions .qa-btn { background: var(--bg-card); border-color: var(--border); }
:root[data-theme="dark"] .summary-card { background: linear-gradient(180deg, #0d2a5c 0%, #1a73e8 100%); }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="top-sticky" id="topSticky">
            <div class="status-bar light">
                <span class="sb-time" id="statusTime">9:41</span>
                <span class="sb-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                    <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
                </span>
            </div>

            <div class="page-hero">
                <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
                <div class="ph-title" id="heroName">重点保障详情</div>
            </div>
        </div>

        <div class="content-sheet page-body-sheet" id="detailBody">
            <!-- 摘要卡片 -->
            <div class="summary-card">
                <div class="sc-title" id="summaryTitle">--</div>
                <div class="sc-address" id="summaryAddress"><i class="fa-solid fa-location-dot"></i>--</div>
                <div class="sc-meta" id="summaryMeta">--</div>
            </div>

            <!-- 快捷操作 -->
            <div class="quick-actions" id="quickActions">
                <a class="qa-btn call" id="callBtn" href="#"><i class="fa-solid fa-phone"></i><span>拨打联系人</span></a>
                <button class="qa-btn location" id="mapBtn"><i class="fa-solid fa-map-location-dot"></i><span>在地图中查看</span></button>
            </div>

            <!-- 基本信息 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">基本信息</div></div>
                <div id="basicInfo"></div>
            </div>

            <!-- 填报信息 -->
            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">填报信息</div></div>
                <div id="reportInfo"></div>
            </div>

            <div class="bottom-spacer"></div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    var embeddedData = [
        { no: "1", name: "青村高高压站", address: "李窑村1814号", responsibleUnit: "上海海贤能源股份有限公司", contact: "周静", phone: "18964616860", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "2", name: "新寺高高压站", address: "新寺南胜村7组", responsibleUnit: "上海海贤能源股份有限公司", contact: "周静", phone: "18964616860", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "3", name: "光明高中压站", address: "光明牌楼村6组", responsibleUnit: "上海海贤能源股份有限公司", contact: "周静", phone: "18964616860", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "4", name: "南桥储配站", address: "南亭公路1069号", responsibleUnit: "上海海贤能源股份有限公司", contact: "刘洪奎", phone: "13501918082", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "5", name: "青村高中压站", address: "南奉公路、沿钱公路往南20米", responsibleUnit: "上海海贤能源股份有限公司", contact: "陈平辉", phone: "18964321520", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "6", name: "金汇高中压站", address: "大叶公路、金钱公路南50米", responsibleUnit: "上海海贤能源股份有限公司", contact: "陈平辉", phone: "18964321520", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "7", name: "西渡中中压站", address: "兴中路、西闸公路北侧约100米", responsibleUnit: "上海海贤能源股份有限公司", contact: "陈平辉", phone: "18964321520", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "8", name: "南桥中中压站", address: "南奉公路、S4高速公路", responsibleUnit: "上海海贤能源股份有限公司", contact: "陈平辉", phone: "18964321520", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "9", name: "融园路高中压站", address: "融园路、朱桥路路口", responsibleUnit: "上海海贤能源股份有限公司", contact: "陈平辉", phone: "18964321520", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "10", name: "邬桥高中压站", address: "大叶公路、安东路路口", responsibleUnit: "上海海贤能源股份有限公司", contact: "陈平辉", phone: "18964321520", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "11", name: "贝港中中压站", address: "新建西路沪杭公路东北角", responsibleUnit: "上海海贤能源股份有限公司", contact: "陈平辉", phone: "18964321520", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "12", name: "浦星高中压站", address: "浦星公路港漕公路南", responsibleUnit: "上海海贤能源股份有限公司", contact: "李清", phone: "13818537638", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "13", name: "奉城高中压站", address: "团青公路新奉公路东南", responsibleUnit: "上海海贤能源股份有限公司", contact: "李清", phone: "13818537638", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "14", name: "四团高中压站", address: "新四平公路平海路东北", responsibleUnit: "上海海贤能源股份有限公司", contact: "李清", phone: "13818537638", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" },
        { no: "15", name: "奉贤交通液化气有限公司储配站", address: "西渡街道五宅村326号", responsibleUnit: "上海奉贤交通液化气有限公司", contact: "陈中谛", phone: "13402101618", reportUnit: "奉贤区燃气管理所", reporter: "屠惟", reportDate: "2026-03-23" }
    ];

    function loadData(){
        var id = App.getQuery('id');
        var fromStorage = null;
        try { fromStorage = JSON.parse(localStorage.getItem('keyGuaranteeData') || '[]'); } catch (e) {}
        var list = Array.isArray(fromStorage) && fromStorage.length ? fromStorage : embeddedData;
        if (id) {
            var found = list.find(function(i) { return String(i.no) === String(id); });
            if (found) return found;
        }
        return embeddedData[0];
    }

    var item = loadData();
    document.getElementById('heroName').textContent = item.name;

    /* 摘要卡片 */
    document.getElementById('summaryTitle').textContent = item.name || '—';
    document.getElementById('summaryAddress').innerHTML = '<i class="fa-solid fa-location-dot"></i>' + esc(item.address || '—');
    var unit = item.responsibleUnit && String(item.responsibleUnit).trim() ? item.responsibleUnit : '';
    var contact = item.contact && String(item.contact).trim() ? item.contact : '';
    var summaryMetaHtml = '';
    if (unit && contact) {
        summaryMetaHtml = esc(unit) + '<span class="sep"></span>' + esc(contact);
    } else if (unit) {
        summaryMetaHtml = esc(unit);
    } else if (contact) {
        summaryMetaHtml = '联系人：' + esc(contact);
    } else {
        summaryMetaHtml = '—';
    }
    document.getElementById('summaryMeta').innerHTML = summaryMetaHtml;

    function esc(s){ return s == null ? '' : String(s); }
    function na(s){ return s == null || String(s).trim() === '' ? '<span class="sc-value na">—</span>' : esc(s); }

    function row(label, valueHtml){
        return '<div class="sc-row"><div class="sc-label">' + label + '</div><div class="sc-value">' + valueHtml + '</div></div>';
    }

    function renderInfoGrid(pairs){
        return pairs.map(function(p){
            return row(p.label, p.value);
        }).join('');
    }

    /* 基础信息 */
    var basicHtml = renderInfoGrid([
        { label: '单位名称', value: na(item.name) },
        { label: '地址', value: na(item.address) },
        { label: '责任单位', value: na(item.responsibleUnit) }
    ]);
    basicHtml += row('联系人', na(item.contact));
    if (item.phone && String(item.phone).trim()) {
        basicHtml += row('联系电话', '<a class="sc-value phone" href="tel:' + item.phone + '" onclick="App.showToast(\'正在呼叫 ' + item.contact + ' ' + item.phone + '\')"><i class="fa-solid fa-phone"></i>' + item.phone + '</a>');
    } else {
        basicHtml += row('联系电话', na(item.phone));
    }
    document.getElementById('basicInfo').innerHTML = basicHtml;

    /* 填报信息 */
    document.getElementById('reportInfo').innerHTML = renderInfoGrid([
        { label: '填报单位', value: na(item.reportUnit) },
        { label: '填报人', value: na(item.reporter) },
        { label: '填报日期', value: na(item.reportDate) }
    ]);

    /* 快捷按钮 */
    var callBtn = document.getElementById('callBtn');
    var mapBtn = document.getElementById('mapBtn');

    if (item.phone && String(item.phone).trim()) {
        callBtn.href = 'tel:' + item.phone;
        callBtn.classList.remove('disabled');
        callBtn.onclick = function(){ App.showToast('正在呼叫 ' + item.contact + ' ' + item.phone); };
    } else {
        callBtn.classList.add('disabled');
    }

    if (item.address && String(item.address).trim()) {
        mapBtn.classList.remove('disabled');
        mapBtn.onclick = function(){
            var url = 'https://uri.amap.com/search?keyword=' + encodeURIComponent(item.address) +
                '&src=' + encodeURIComponent('奉贤风险管控');
            window.open(url, '_blank');
        };
    } else {
        mapBtn.classList.add('disabled');
    }
})();
</script>
</body>
</html>
