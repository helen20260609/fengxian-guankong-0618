<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>我的反馈</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
        
        .knowledge-hero {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #1d4ed8 100%);
            margin-top: -34px;
            padding: calc(34px + 16px) 18px 42px;
            color: #fff;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .knowledge-hero::before {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            right: -50px;
            top: -20px;
            background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%);
            border-radius: 50%;
        }
        .knowledge-hero .kh-back {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
        }
        .knowledge-hero .hero-title {
            flex: 1;
            position: relative;
            z-index: 2;
        }
        .knowledge-hero h1 { font-size: 19px; font-weight: 700; }
        .knowledge-hero p { font-size: 12.5px; opacity: .85; margin-top: 4px; }

        .law-body {
            flex: 1;
            overflow-y: auto;
            padding: var(--space);
            background: var(--bg-dark);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .law-body::-webkit-scrollbar { display: none; }

        .fb-filter {
            display: flex;
            gap: 8px;
            padding: 12px 0;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .fb-filter::-webkit-scrollbar { display: none; }
        .fb-filter .ff-chip {
            flex-shrink: 0;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .fb-filter .ff-chip.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            font-weight: 500;
        }

        .feedback-list { padding: 0; }
        .feedback-item {
            background: var(--card);
            border-radius: var(--radius-lg);
            padding: var(--space);
            margin-bottom: var(--space);
            box-shadow: 0 4px 16px rgba(0,0,0,.06);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }
        .feedback-item:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .feedback-item .fi-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }
        .feedback-item .fi-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            line-height: 1.4;
        }
        .feedback-item .fi-status {
            flex-shrink: 0;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
        }
        .feedback-item .fi-status.pending { background: rgba(227,116,0,0.12); color: var(--dot-orange); }
        .feedback-item .fi-status.handling { background: rgba(26,115,232,0.12); color: var(--primary); }
        .feedback-item .fi-status.closed { background: rgba(30,142,62,0.12); color: var(--success); }
        .feedback-item .fi-status.rejected { background: rgba(217,48,37,0.12); color: var(--dot-red); }
        .feedback-item .fi-meta {
            font-size: 12px;
            color: var(--text2);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .feedback-item .fi-meta i { font-size: 11px; }
        .feedback-item .fi-reply {
            margin-top: 10px;
            padding: 10px 12px;
            background: var(--bg-dark);
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .feedback-item .fi-reply i { color: var(--primary); margin-right: 4px; }

        .empty-state-sm {
            text-align: center;
            padding: 60px 20px;
            color: var(--text2);
            font-size: 14px;
        }
        .empty-state-sm i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: .35;
            display: block;
        }

        .fab-report {
            position: fixed;
            right: 20px;
            bottom: calc(20px + var(--tab-bar-height, 56px) + var(--safe-bottom, 0px));
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            box-shadow: 0 6px 16px rgba(26,115,232,.4);
            z-index: 90;
            border: none;
            cursor: pointer;
        }
        .fab-report:active { opacity: 0.9; transform: scale(0.95); }

        .bottom-spacer { height: 20px; }

        @media screen and (min-width: 480px) {
            .phone-shell .fab-report {
                right: calc(50% - var(--phone-shell-width) / 2 + 20px);
                bottom: calc(var(--phone-frame-padding) + 20px + var(--tab-bar-height, 56px) + var(--safe-bottom, 0px));
            }
        }
    </style>
</head>
<body>
<div class="phone-frame">
    <!-- 侧边按钮 -->
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <!-- 状态栏 -->
    <div class="status-bar light">
        <span class="sb-time" id="statusTime">9:41</span>
        <span class="sb-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
            <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
        </span>
    </div>

    <div class="knowledge-hero">
        <div class="kh-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
        <div class="hero-title">
            <h1>我的反馈</h1>
            <p>查看随手拍提交的问题及处理进展</p>
        </div>
    </div>

    <div class="law-body">
        <div class="fb-filter anim d1" id="statusFilter">
            <div class="ff-chip active" data-status="">全部</div>
            <div class="ff-chip" data-status="reported">待受理</div>
            <div class="ff-chip" data-status="handling">处理中</div>
            <div class="ff-chip" data-status="closed">已办结</div>
            <div class="ff-chip" data-status="rejected">已反馈</div>
        </div>

        <div class="feedback-list anim d2" id="feedbackList">
            <!-- 动态填充 -->
        </div>

        <div class="bottom-spacer"></div>
    </div>

    <button class="fab-report tap" onclick="App.go('snap-report.html')">
        <i class="fa-solid fa-camera"></i>
    </button>

    <!-- 底部标签栏 -->
    <div class="tab-bar" id="tabBar"></div>

    </div>
</div>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    // 状态栏时间
    var now = new Date();
    document.getElementById('statusTime').textContent =
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

    var currentStatus = '';
    var container = document.getElementById('feedbackList');

    function render() {
        var list = currentStatus
            ? DataStore.myFeedback.filter(function(f) { return f.status === currentStatus; })
            : DataStore.myFeedback;

        if (!list.length) {
            container.innerHTML = '<div class="empty-state-sm"><i class="fa-regular fa-folder-open"></i>暂无相关反馈记录</div>';
            return;
        }

        container.innerHTML = list.map(function(item) {
            return '<div class="feedback-item tap" onclick="App.go(\'feedback-detail.html?id=' + item.id + '\')">' +
                '<div class="fi-header">' +
                    '<div class="fi-title">' + App.escapeHtml(item.title) + '</div>' +
                    '<div class="fi-status ' + item.status + '">' + App.escapeHtml(item.statusLabel) + '</div>' +
                '</div>' +
                '<div class="fi-meta"><i class="fa-solid fa-clock"></i> 更新于 ' + App.formatDate(item.updateTime, 'MM-dd hh:mm') + '</div>' +
                (item.reply ? '<div class="fi-reply"><i class="fa-solid fa-reply"></i> ' + App.escapeHtml(item.reply) + '</div>' : '') +
            '</div>';
        }).join('');
    }

    document.getElementById('statusFilter').addEventListener('click', function(e) {
        var chip = e.target.closest('.ff-chip');
        if (!chip) return;
        document.querySelectorAll('.ff-chip').forEach(function(c) { c.classList.remove('active'); });
        chip.classList.add('active');
        currentStatus = chip.dataset.status;
        render();
    });

    render();

    App.renderTabBar('mine');
})();
</script>
</body>
</html>
