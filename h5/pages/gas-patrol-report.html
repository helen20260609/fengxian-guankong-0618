<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>现场巡查</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/tokens.css">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/h5-frame.css">
    <script src="../../pages/gas-risk-data.js"></script>
    <style>
        
        .knowledge-hero {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #1d4ed8 100%);
            margin-top: -34px;
            padding: calc(34px + 4px) 18px 0;
            color: #fff;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .knowledge-hero::before {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            right: -50px;
            top: -20px;
            background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%);
            border-radius: 50%;
        }
        .knowledge-hero .kh-back {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            cursor: pointer;
        }
        .knowledge-hero .hero-title { flex: 1; position: relative; z-index: 2; text-align: center; padding-right: 32px; }
        .knowledge-hero h1 { font-size: 17px; font-weight: 600; }

        .law-body {
            flex: 1;
            overflow-y: auto;
            padding: 0 0 var(--space);
            background: var(--bg-dark);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .law-body::-webkit-scrollbar { display: none; }

        .hero-card {
            background: var(--card);
            width: 100%;
            padding: var(--space);
            box-sizing: border-box;
            border-bottom: 1px solid var(--border);
            border-radius: 0;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 var(--space);
            margin-top: var(--space);
        }
        .card-title i { color: var(--primary); font-size: 15px; }

        .hero-project {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4;
            margin-bottom: 6px;
        }
        .hero-task {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hero-task i { color: var(--primary); font-size: 15px; }
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 16px;
        }
        .hero-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .hero-item.full-width { grid-column: 1 / -1; }
        .hero-item i {
            font-size: 13px;
            color: var(--text2);
            width: 14px;
            text-align: center;
        }
        .hero-item .label {
            color: var(--text2);
            white-space: nowrap;
            font-size: 13px;
        }
        .hero-item .value {
            color: var(--text-primary);
            font-weight: 500;
            font-size: 13px;
        }

        .tip-card {
            background: rgba(var(--primary-rgb), 0.08);
            border: 1px solid rgba(var(--primary-rgb), 0.2);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .tip-card i { color: var(--primary); font-size: 18px; margin-top: 2px; }
        .tip-card .tip-text { font-size: 13px; color: var(--primary); line-height: 1.6; }

        .progress-bar-sticky {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--card);
            padding: 12px var(--space);
            border-bottom: 1px solid var(--border);
            width: 100%;
            box-sizing: border-box;
            border-radius: 0;
        }
        .progress-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text2);
            margin-bottom: 8px;
        }
        .progress-stats .stat-done { color: var(--success); font-weight: 600; }
        .progress-stats .stat-risk { color: var(--dot-red); font-weight: 600; }
        .progress-track {
            height: 8px;
            background: rgba(var(--primary-rgb), 0.12);
            border-radius: 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 0;
            transition: width 0.3s ease;
        }

        .bottom-drawer-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .bottom-drawer-overlay.active { opacity: 1; visibility: visible; }
        .bottom-drawer {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            background: var(--card);
            border-radius: 16px 16px 0 0;
            z-index: 201;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
            height: 70vh;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        .bottom-drawer.active { transform: translateY(0); }
        .bottom-drawer-handle {
            width: 40px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: 12px auto 8px;
        }
        .bottom-drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 12px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .bottom-drawer-header .drawer-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .bottom-drawer-header .drawer-close {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: var(--bg-dark);
            color: var(--text2);
            cursor: pointer;
            border: none;
            font-size: 16px;
        }
        .bottom-drawer-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            -webkit-overflow-scrolling: touch;
        }
        .bottom-drawer-body::-webkit-scrollbar { display: none; }
        .bottom-drawer-footer {
            padding: 12px 20px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .bottom-drawer-footer .btn {
            flex: 1;
            padding: 14px 0;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-cancel {
            background: var(--bg-dark);
            color: var(--text2);
            border: 1px solid var(--border);
        }
        .btn-confirm {
            background: var(--primary);
            color: #fff;
        }

        .risk-card {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 10px var(--shadow);
            border: 1px solid var(--border);
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }
        .risk-card:hover { box-shadow: 0 4px 14px var(--shadow); }
        .risk-card.collapsed .risk-info { display: none; }
        .risk-card.completed { opacity: 0.7; }
        .risk-card.completed .risk-header::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: var(--success);
            margin-left: 8px;
            font-size: 16px;
        }
        .risk-card.completed.collapsed { padding: 12px 14px; }
        .risk-card.completed.collapsed .risk-header { margin-bottom: 0; }
        .risk-card.completed.collapsed .risk-level { display: none; }

        .risk-card .risk-judge-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 12px 0 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .risk-card .risk-judge-label i { color: var(--primary); font-size: 16px; }

        .risk-expand-form { display: none; }
        .form-row { margin-bottom: 16px; }
        .form-row:last-child { margin-bottom: 0; }
        .form-row label {
            display: block;
            font-size: 13px;
            color: var(--text-primary);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-row input,
        .form-row textarea,
        .form-row select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 13px;
            background: var(--input-bg);
            color: var(--text-primary);
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .form-row input:focus,
        .form-row textarea:focus,
        .form-row select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.08);
        }
        .form-row textarea { min-height: 60px; resize: vertical; }
        .form-row .photo-upload { display: flex; gap: 8px; flex-wrap: wrap; }
        .photo-upload .photo-box {
            width: 70px;
            height: 70px;
            border: 2px dashed var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text2);
            font-size: 20px;
            cursor: pointer;
            background: var(--input-bg);
        }
        .photo-upload .photo-box:active { background: var(--bg-dark); }
        .photo-upload .photo-preview {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
        }

        .risk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .risk-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            line-height: 1.4;
        }
        .risk-level {
            display: inline-flex;
            align-items: center;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            margin-left: 8px;
        }
        .risk-level.red { background: rgba(217,48,37,0.12); color: var(--dot-red); }
        .risk-level.orange { background: rgba(227,116,0,0.12); color: var(--dot-orange); }
        .risk-level.yellow { background: rgba(249,171,0,0.16); color: #c68400; }
        .risk-level.blue { background: rgba(26,115,232,0.12); color: var(--primary); }

        .risk-info {
            font-size: 13px;
            color: var(--text2);
            line-height: 1.8;
            margin-bottom: 12px;
            padding: 10px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .risk-info-row { display: flex; margin-bottom: 6px; }
        .risk-info-row:last-child { margin-bottom: 0; }
        .risk-info-row .label {
            color: var(--text2);
            white-space: nowrap;
            width: 70px;
            font-size: 13px;
        }
        .risk-info-row .value {
            color: var(--text-primary);
            flex: 1;
            font-size: 13px;
        }

        .level-tag {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .level-tag.red { background: var(--dot-red); }
        .level-tag.orange { background: var(--dot-orange); }
        .level-tag.yellow { background: var(--dot-yellow); }
        .level-tag.blue { background: var(--primary); }

        .risk-actions { display: flex; gap: 8px; margin-top: 12px; }
        .risk-btn {
            flex: 1;
            padding: 10px 0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text2);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .risk-btn:hover { opacity: 0.8; }
        .risk-btn.active-normal {
            background: rgba(30,142,62,0.12);
            border-color: var(--success);
            color: var(--success);
        }
        .risk-btn.active-risk {
            background: rgba(217,48,37,0.12);
            border-color: var(--dot-red);
            color: var(--dot-red);
        }
        .risk-btn.active-review {
            background: rgba(var(--primary-rgb), 0.12);
            border-color: var(--primary);
            color: var(--primary);
        }
        .disposal-btns { display: flex; gap: 10px; }
        .disposal-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text2);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .disposal-btn.active-immediate {
            background: rgba(217,48,37,0.12);
            border-color: var(--dot-red);
            color: var(--dot-red);
        }
        .disposal-btn.active-transfer {
            background: rgba(var(--primary-rgb), 0.12);
            border-color: var(--primary);
            color: var(--primary);
        }

        .bottom-actions {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            z-index: 100;
            box-shadow: 0 -2px 10px var(--shadow);
        }
        .bottom-actions .btn {
            padding: 12px 0;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-sign {
            flex: 1;
            background: var(--bg-dark);
            color: var(--text2);
            border: 1px solid var(--border);
        }
        .btn-sign.signed {
            background: rgba(var(--primary-rgb), 0.12);
            color: var(--primary);
            border-color: var(--primary);
        }
        .btn-submit {
            flex: 2;
            background: var(--primary);
            color: #fff;
        }
        .btn-submit:active { opacity: 0.9; }

        .bottom-spacer { height: calc(var(--tab-bar-height) + var(--safe-bottom) + 20px); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
        .empty-state i { font-size: 40px; color: var(--border); margin-bottom: 8px; }

        .phone-shell {
            overflow: hidden;
        }

        @media screen and (min-width: 480px) {
            .phone-shell .bottom-drawer-overlay {
                width: var(--phone-shell-width);
                left: 50%;
                right: auto;
                top: var(--phone-frame-padding);
                bottom: var(--phone-frame-padding);
                transform: translateX(-50%);
            }
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="side-button side-button-left mute"></div>
        <div class="side-button side-button-left volume-up"></div>
        <div class="side-button side-button-left volume-down"></div>
        <div class="side-button side-button-right power"></div>
        <div class="phone-shell">
            <div class="status-bar light">
                <span class="sb-time" id="statusTime">9:41</span>
                <span class="sb-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                    <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
                </span>
            </div>

            <div class="knowledge-hero">
                <div class="kh-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
                <div class="hero-title">
                    <h1>现场巡查</h1>
                </div>
            </div>

            <div class="law-body">
                <!-- 头部信息展示区 -->
                <div class="hero-card anim d1">
                    <div class="hero-project">解放小区3号楼燃气管道</div>
                    <div class="hero-task">
                        <i class="fa-solid fa-clipboard-list"></i>青村镇老旧小区管网应急排查
                    </div>
                    <div class="hero-grid">
                        <div class="hero-item">
                            <i class="fa-solid fa-tag"></i>
                            <span class="label">类型</span>
                            <span class="value">燃气管线</span>
                        </div>
                        <div class="hero-item">
                            <i class="fa-solid fa-industry"></i>
                            <span class="label">企业</span>
                            <span class="value">奉贤燃气有限公司</span>
                        </div>
                        <div class="hero-item full-width">
                            <i class="fa-solid fa-location-dot"></i>
                            <span class="label">地址</span>
                            <span class="value">青村镇解放路88号</span>
                        </div>
                    </div>
                </div>

                <!-- 全局进度条 -->
                <div class="progress-bar-sticky anim d2" id="progressBar">
                    <div class="progress-stats">
                        <span>已完成 <span class="stat-done" id="doneCount">0</span>/<span id="totalCount">0</span> 项</span>
                        <span>异常 <span class="stat-risk" id="riskCountStat">0</span> 项</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                </div>

                <div class="card-title anim d2">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    风险清单排查
                    <span style="font-size: 12px; color: var(--text2); font-weight: normal; margin-left: auto;">共 <span id="riskCount">0</span> 项</span>
                </div>

                <!-- 风险清单容器 -->
                <div id="riskListContainer" class="anim d3" style="padding: 0 var(--space);">
                    <!-- 动态渲染 -->
                </div>

                <div class="bottom-spacer"></div>
            </div>

            <!-- 底部操作抽屉 -->
            <div class="bottom-drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
            <div class="bottom-drawer" id="bottomDrawer">
                <div class="bottom-drawer-handle"></div>
                <div class="bottom-drawer-header">
                    <div class="drawer-title" id="drawerTitle">异常上报</div>
                    <button class="drawer-close" onclick="closeDrawer()">
                        <i class="fa-solid fa-times"></i>
                    </button>
                </div>
                <div class="bottom-drawer-body" id="drawerBody">
                    <!-- 动态表单内容 -->
                </div>
                <div class="bottom-drawer-footer">
                    <button class="btn btn-cancel" onclick="closeDrawer()">取消</button>
                    <button class="btn btn-confirm" onclick="confirmDrawer()">确认</button>
                </div>
            </div>

            <!-- 底部固定操作栏 -->
            <div class="bottom-actions">
                <button class="btn btn-sign" id="signBtn" onclick="signIn()">
                    <i class="fa-solid fa-location-dot" style="margin-right: 4px;"></i>签到
                </button>
                <button class="btn btn-submit" onclick="submitCheck()">
                    <i class="fa-solid fa-check-circle" style="margin-right: 4px;"></i>确认提交
                </button>
            </div>
        </div>
    </div>

    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/risk-data.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>
        // 风险等级映射
        const levelMap = {
            'red': { label: '重大风险', class: 'red' },
            'orange': { label: '较大风险', class: 'orange' },
            'yellow': { label: '一般风险', class: 'yellow' },
            'blue': { label: '低风险', class: 'blue' }
        };

        // 获取风险数据（燃气管线）
        function getRiskData() {
            if (typeof riskData !== 'undefined') {
                return riskData.filter(item => item.main === '燃气管线').slice(0, 5);
            }
            // 备用数据
            return [
                {id:1, main:"燃气管线", sub:"碳钢管", content:"设备、设施、工具附件缺陷", risk:"管道用材不符合国家相关规范要求形成管体破裂", accident:"火灾、其它爆炸", level:"orange"},
                {id:2, main:"燃气管线", sub:"碳钢管", content:"强度不够", risk:"强度试验不符合国家相关规范要求", accident:"火灾、其它爆炸", level:"yellow"},
                {id:3, main:"燃气管线", sub:"碳钢管", content:"耐腐蚀性差", risk:"管线定位（物探）不符合国家相关规范要求，造成外防腐层破损形成局部腐蚀泄漏", accident:"火灾、其它爆炸", level:"orange"},
                {id:13, main:"燃气管线", sub:"碳钢管", content:"违章作业", risk:"第三方作业造成管道损坏", accident:"火灾、其它爆炸", level:"red"},
                {id:19, main:"燃气管线", sub:"聚乙烯管", content:"违章作业", risk:"第三方作业造成管道损坏", accident:"火灾、其它爆炸", level:"red"}
            ];
        }

        // 渲染风险清单
        function renderRiskList() {
            const container = document.getElementById('riskListContainer');
            const risks = getRiskData();
            document.getElementById('riskCount').textContent = risks.length;
            document.getElementById('totalCount').textContent = risks.length;

            if (risks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-inbox"></i>
                        <p>暂无风险清单数据</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = risks.map((item, index) => {
                const level = levelMap[item.level] || levelMap.blue;
                // 所有卡片默认展开
                return `
                    <div class="risk-card ${level.class}" data-id="${item.id}" onclick="toggleCard(this, event)">
                        <div class="risk-header">
                            <div class="risk-title">${item.sub} - ${item.content}</div>
                            <div class="risk-level ${level.class}">
                                <span class="level-tag ${level.class}"></span>${level.label}
                            </div>
                        </div>
                        <div class="risk-info">
                            <div class="risk-info-row">
                                <span class="label">风险识别：</span>
                                <span class="value">${item.risk}</span>
                            </div>
                            <div class="risk-info-row">
                                <span class="label">可能导致：</span>
                                <span class="value">${item.accident}</span>
                            </div>
                        </div>
                        <div class="risk-actions" onclick="event.stopPropagation()">
                            <button class="risk-btn" onclick="setRiskStatus(${item.id}, 'normal', this)" data-status="normal">
                                <i class="fa-solid fa-check-circle"></i>正常
                            </button>
                            <button class="risk-btn" onclick="openDrawer(${item.id}, 'risk', this)" data-status="risk">
                                <i class="fa-solid fa-triangle-exclamation"></i>异常
                            </button>
                            <button class="risk-btn" onclick="openDrawer(${item.id}, 'review', this)" data-status="review">
                                <i class="fa-solid fa-clock"></i>需复查
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 当前打开的抽屉状态
        let currentDrawerId = null;
        let currentDrawerStatus = null;
        let currentDrawerBtn = null;

        // 底部操作抽屉内容模板
        const drawerTemplates = {
            risk: `
                <div class="form-row">
                    <label>处置方式</label>
                    <div class="disposal-btns">
                        <button type="button" class="disposal-btn active-immediate" id="btnImmediate" onclick="selectDisposal('immediate')">
                            <i class="fa-solid fa-bolt"></i>立即处置
                        </button>
                        <button type="button" class="disposal-btn" id="btnTransfer" onclick="selectDisposal('transfer')">
                            <i class="fa-solid fa-share-square"></i>上报转办
                        </button>
                    </div>
                    <input type="hidden" id="drawerDisposalType" value="immediate">
                </div>
                <div id="disposalFormArea">
                    <div class="form-row">
                        <label>隐患等级</label>
                        <select id="drawerRiskLevel">
                            <option value="">请选择</option>
                            <option value="major">重大隐患</option>
                            <option value="orange">较大隐患</option>
                            <option value="general">一般隐患</option>
                            <option value="minor">轻微隐患</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>隐患描述</label>
                        <textarea id="drawerRiskDesc" placeholder="请描述隐患具体情况..."></textarea>
                    </div>
                    <div class="form-row">
                        <label>影响范围</label>
                        <input type="text" id="drawerRiskScope" placeholder="如：影响周边3户居民">
                    </div>
                    <div class="form-row">
                        <label>紧急程度</label>
                        <select id="drawerRiskUrgency">
                            <option value="">请选择</option>
                            <option value="urgent">紧急 - 需立即处理</option>
                            <option value="high">高 - 24小时内处理</option>
                            <option value="medium">中 - 3日内处理</option>
                            <option value="low">低 - 7日内处理</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>现场证据（拍照）</label>
                        <div class="photo-upload">
                            <div class="photo-box" onclick="takePhoto(this)">
                                <i class="fa-solid fa-camera"></i>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            review: `
                <div class="form-row">
                    <label>复查日期</label>
                    <input type="date" id="drawerReviewDate" placeholder="请选择复查日期">
                </div>
                <div class="form-row">
                    <label>复查要求</label>
                    <textarea id="drawerReviewReq" placeholder="请填写复查的具体要求..."></textarea>
                </div>
            `
        };

        // 选择处置方式
        function selectDisposal(type) {
            document.getElementById('drawerDisposalType').value = type;
            document.getElementById('btnImmediate').classList.remove('active-immediate');
            document.getElementById('btnTransfer').classList.remove('active-transfer');
            if (type === 'immediate') {
                document.getElementById('btnImmediate').classList.add('active-immediate');
                document.getElementById('disposalFormArea').innerHTML = `
                    <div class="form-row">
                        <label>隐患等级</label>
                        <select id="drawerRiskLevel">
                            <option value="">请选择</option>
                            <option value="major">重大隐患</option>
                            <option value="orange">较大隐患</option>
                            <option value="general">一般隐患</option>
                            <option value="minor">轻微隐患</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>隐患描述</label>
                        <textarea id="drawerRiskDesc" placeholder="请描述隐患具体情况..."></textarea>
                    </div>
                    <div class="form-row">
                        <label>影响范围</label>
                        <input type="text" id="drawerRiskScope" placeholder="如：影响周边3户居民">
                    </div>
                    <div class="form-row">
                        <label>紧急程度</label>
                        <select id="drawerRiskUrgency">
                            <option value="">请选择</option>
                            <option value="urgent">紧急 - 需立即处理</option>
                            <option value="high">高 - 24小时内处理</option>
                            <option value="medium">中 - 3日内处理</option>
                            <option value="low">低 - 7日内处理</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>现场证据（拍照）</label>
                        <div class="photo-upload">
                            <div class="photo-box" onclick="takePhoto(this)">
                                <i class="fa-solid fa-camera"></i>
                            </div>
                        </div>
                    </div>
                `;
            } else if (type === 'transfer') {
                document.getElementById('btnTransfer').classList.add('active-transfer');
                document.getElementById('disposalFormArea').innerHTML = `
                    <div class="form-row">
                        <label>建议处置措施</label>
                        <textarea id="drawerTransferMeasure" placeholder="请填写建议的处置措施..."></textarea>
                    </div>
                    <div class="form-row">
                        <label>建议整改时限</label>
                        <input type="text" id="drawerTransferDeadline" placeholder="如：3个工作日内">
                    </div>
                    <div class="form-row">
                        <label>建议责任单位</label>
                        <input type="text" id="drawerTransferUnit" placeholder="请填写建议的责任单位">
                    </div>
                    <div class="form-row">
                        <label>现场证据（拍照）</label>
                        <div class="photo-upload">
                            <div class="photo-box" onclick="takePhoto(this)">
                                <i class="fa-solid fa-camera"></i>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // 打开底部操作抽屉
        function openDrawer(id, status, btn) {
            currentDrawerId = id;
            currentDrawerStatus = status;
            currentDrawerBtn = btn;

            const drawer = document.getElementById('bottomDrawer');
            const overlay = document.getElementById('drawerOverlay');
            const body = document.getElementById('drawerBody');
            const title = document.getElementById('drawerTitle');

            title.textContent = status === 'risk' ? '异常上报' : '复查安排';
            body.innerHTML = drawerTemplates[status];

            overlay.classList.add('active');
            drawer.classList.add('active');
        }

        // 关闭底部操作抽屉
        function closeDrawer() {
            const drawer = document.getElementById('bottomDrawer');
            const overlay = document.getElementById('drawerOverlay');
            drawer.classList.remove('active');
            overlay.classList.remove('active');
            currentDrawerId = null;
            currentDrawerStatus = null;
            currentDrawerBtn = null;
        }

        // 确认抽屉内容
        function confirmDrawer() {
            if (currentDrawerBtn && currentDrawerId && currentDrawerStatus) {
                setRiskStatus(currentDrawerId, currentDrawerStatus, currentDrawerBtn);
            }
            closeDrawer();
        }

        // 切换卡片折叠/展开
        function toggleCard(card, event) {
            // 如果点击的是按钮区域，不切换
            if (event.target.closest('.risk-btn')) {
                return;
            }
            card.classList.toggle('collapsed');
        }

        // 更新进度条
        function updateProgress() {
            const cards = document.querySelectorAll('.risk-card');
            const total = cards.length;
            let done = 0;
            let risk = 0;

            cards.forEach(card => {
                const activeBtn = card.querySelector('.risk-btn.active-normal, .risk-btn.active-risk, .risk-btn.active-review');
                if (activeBtn) {
                    done++;
                    if (activeBtn.dataset.status === 'risk') {
                        risk++;
                    }
                    // 已完成的项添加completed类并自动收起
                    card.classList.add('completed');
                    if (!card.classList.contains('collapsed')) {
                        card.classList.add('collapsed');
                    }
                }
            });

            document.getElementById('doneCount').textContent = done;
            document.getElementById('riskCountStat').textContent = risk;
            document.getElementById('progressFill').style.width = total > 0 ? (done / total * 100) + '%' : '0%';
        }

        // 设置风险状态
        function setRiskStatus(id, status, btn) {
            const card = btn.closest('.risk-card');
            const buttons = card.querySelectorAll('.risk-btn');

            // 清除所有按钮的激活状态
            buttons.forEach(b => {
                b.classList.remove('active-normal', 'active-risk', 'active-review');
            });

            // 设置当前按钮的激活状态
            if (status === 'normal') {
                btn.classList.add('active-normal');
                // 正常状态自动收起
                card.classList.add('completed', 'collapsed');
            } else if (status === 'risk') {
                btn.classList.add('active-risk');
                card.classList.remove('completed');
            } else if (status === 'review') {
                btn.classList.add('active-review');
                card.classList.remove('completed');
            }

            // 更新进度
            updateProgress();

            // 存储状态
            console.log(`风险项 ${id} 状态设置为: ${status}`);
        }

        // 拍照功能
        function takePhoto(box) {
            // 模拟拍照，实际开发中调用相机API
            const preview = document.createElement('img');
            preview.className = 'photo-preview';
            preview.src = 'https://via.placeholder.com/70x70/1a73e8/fff?text=Photo';
            preview.onclick = function() { this.remove(); };
            box.parentNode.insertBefore(preview, box);
        }

        // 签到
        function signIn() {
            const btn = document.getElementById('signBtn');
            if (btn.classList.contains('signed')) {
                alert('您已签到！');
                return;
            }
            // 模拟获取当前位置
            const mockLocation = '青村镇解放路88号附近';
            const now = new Date();
            const timeStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
            alert('签到成功！\n时间：' + timeStr + '\n位置：' + mockLocation);
            btn.classList.add('signed');
            btn.innerHTML = '<i class="fa-solid fa-check" style="margin-right: 4px;"></i>已签到';
        }

        // 确认提交
        function submitCheck() {
            const results = [];
            document.querySelectorAll('.risk-card').forEach(card => {
                const id = card.dataset.id;
                const activeBtn = card.querySelector('.risk-btn.active-normal, .risk-btn.active-risk, .risk-btn.active-review');
                if (activeBtn) {
                    results.push({
                        id: id,
                        status: activeBtn.dataset.status
                    });
                }
            });

            const total = document.querySelectorAll('.risk-card').length;
            if (results.length < total) {
                alert(`还有 ${total - results.length} 项未排查，请完成全部排查后再提交`);
                return;
            }

            alert('提交成功！共排查 ' + results.length + ' 项');

            // 检查是否有异常项（风险或需复查）
            const hasAbnormal = results.some(r => r.status === 'risk' || r.status === 'review');

            // 有异常项才提示是否进入隐患管理页面
            if (hasAbnormal) {
                const goToHiddenDanger = confirm('提交完成！发现异常项，是否进入隐患管理页面？');
                if (goToHiddenDanger) {
                    App.go('hidden-danger-manage.html');
                }
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            renderRiskList();
        });
    </script>
</body>
</html>
