<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>物资详情</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.status-bar { position: relative; z-index: 100; }
.page-hero { position: relative; z-index: 99; display: flex; flex-direction: column; align-items: center; padding: calc(34px + 16px) 18px 42px; }

.phone-shell { display: flex; flex-direction: column; overflow: hidden !important; }
.content-sheet.page-body-sheet { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 0 0 16px; background: #f5f6fa; margin-top: 0; border-radius: 0; }
.content-sheet.page-body-sheet::-webkit-scrollbar { display: none; }

.hero-card {
    position: relative;
    margin: 16px;
    background: linear-gradient(135deg, #1a73e8 0%, #1b6cd5 50%, #1557b0 100%);
    border-radius: 16px;
    padding: 16px;
    color: #fff;
    border: none;
    box-shadow: 0 8px 20px rgba(26,115,232,.28);
    overflow: hidden;
}
.hero-card::before {
    content: '';
    position: absolute;
    width: 140px;
    height: 140px;
    right: -40px;
    top: -50px;
    background: radial-gradient(circle, rgba(255,255,255,.15), transparent 70%);
    border-radius: 50%;
}
.hero-card .hc-inner { position: relative; z-index: 1; }
.hero-card .hc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.hero-card .mat-title { font-size: 18px; font-weight: 700; line-height: 1.4; flex: 1; min-width: 0; word-break: break-word; }
.hero-card .mat-tag { flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.3); }
.hero-card .hc-location { display: flex; align-items: center; gap: 6px; font-size: 13px; opacity: .9; margin-bottom: 14px; }
.hero-card .hc-location i { font-size: 12px; flex-shrink: 0; }
.hero-card .hc-location span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.hero-card .hc-metric-row { display: flex; align-items: center; gap: 12px; font-size: 12px; margin-bottom: 10px; }
.hero-card .hc-metric-item { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero-card .hc-metric-item i { font-size: 12px; opacity: .8; flex-shrink: 0; }
.hero-card .hc-metric-item b { font-weight: 700; }
.hero-card .hc-metric-divider { width: 1px; height: 14px; background: rgba(255,255,255,.3); flex-shrink: 0; }
.hero-card .hc-contact { display: flex; align-items: center; gap: 6px; font-size: 14px; opacity: .95; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero-card .hc-contact i { font-size: 12px; flex-shrink: 0; }
.hero-card .hc-contact b { font-weight: 600; }

.action-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin: 0 16px 14px;
}
.action-grid-cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all .15s;
}
.action-grid-cell:active { transform: scale(.97); }
.action-grid-cell.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.action-grid-cell .ag-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}
.action-grid-cell .ag-icon.phone { background: rgba(30,142,62,.12); color: var(--success); }
.action-grid-cell .ag-icon.map { background: rgba(26,115,232,.1); color: var(--primary); }
.action-grid-cell .ag-label { font-size: 12px; color: var(--text-primary); font-weight: 500; }

.section-v2 { background: var(--card); border-radius: 12px; margin: 0 16px 12px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid var(--border); }
.section-v2:last-of-type { margin-bottom: 16px; }
.sv2-head { margin-bottom: 10px; }
.sv2-title { font-size: 15px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 0; position: relative; padding-left: 10px; }
.sv2-title::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--primary); }

.sc-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); gap: 16px; }
.sc-row.wrap { align-items: flex-start; }
.sc-row:last-child { border-bottom: none; padding-bottom: 0; }
.sc-label { font-size: 14px; color: var(--text2); text-align: left; line-height: 1.4; flex-shrink: 0; }
.sc-value { flex: 1; min-width: 0; font-size: 14px; color: var(--text-primary); font-weight: 500; text-align: right; line-height: 1.4; word-break: break-word; white-space: normal; }
.sc-value.phone { color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; cursor: pointer; }
.sc-value.phone i { font-size: 12px; }
.sc-value.mono { font-family: 'SF Mono', monospace; }

.phone-list { display: flex; flex-direction: column; gap: 8px; }
.phone-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.phone-row:last-child { border-bottom: none; padding-bottom: 0; }
.phone-number { font-size: 14px; color: var(--text-primary); font-weight: 500; font-family: 'SF Mono', monospace; }
.phone-dial { color: var(--success); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }

.bottom-spacer { height: 20px; }

:root[data-theme="dark"] .section-v2 { background: var(--bg-card); }
:root[data-theme="dark"] .hero-card { background: linear-gradient(135deg, #0d2a5c 0%, #103a7a 55%, #0a5f6b 100%); }
:root[data-theme="dark"] .action-grid-cell { background: var(--bg-card); border-color: var(--border); }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="phone-shell">
        <div class="status-bar light">
            <span class="sb-time" id="statusTime">9:41</span>
            <span class="sb-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
                <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
            </span>
        </div>

        <div class="page-hero">
            <div class="ph-back" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="ph-title">物资详情</div>
        </div>

        <div class="content-sheet page-body-sheet" style="padding:0 0 16px">
            <div class="hero-card" id="heroCard">
                <div class="hc-inner">
                    <div class="hc-head">
                        <div class="mat-title" id="matTitle">--</div>
                        <div class="mat-tag" id="matTag"></div>
                    </div>
                    <div class="hc-location" id="matLocation"></div>
                    <div class="hc-metric-row" id="matMetrics"></div>
                    <div class="hc-contact" id="matContact"></div>
                </div>
            </div>

            <div class="action-grid">
                <div class="action-grid-cell" id="callPhoneAction">
                    <div class="ag-icon phone"><i class="fa-solid fa-phone"></i></div>
                    <div class="ag-label" id="callLabel">呼叫仓库联系人</div>
                </div>
                <div class="action-grid-cell" id="mapViewAction">
                    <div class="ag-icon map"><i class="fa-solid fa-map-location-dot"></i></div>
                    <div class="ag-label">在地图中查看</div>
                </div>
            </div>

            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">基础信息</div></div>
                <div id="basicInfo"></div>
            </div>

            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">联系方式</div></div>
                <div id="contactInfo"></div>
            </div>

            <div class="section-v2">
                <div class="sv2-head"><div class="sv2-title">填报信息</div></div>
                <div id="reportInfo"></div>
            </div>

            <div class="bottom-spacer"></div>
        </div>
    </div>
    <div class="phone-home-indicator"></div>
</div>

<script src="../../data/rescue-materials-data.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function(){
    function loadData() {
        var id = App.getQuery('id');
        var fromStorage = null;
        try { fromStorage = JSON.parse(localStorage.getItem('rescueMaterialsData') || '[]'); } catch (e) {}
        var list = (Array.isArray(fromStorage) && fromStorage.length) ? fromStorage : (typeof rescueMaterialsData !== 'undefined' ? rescueMaterialsData : []);
        if (id) {
            var found = list.find(function(i) { return String(i.id) === String(id); });
            if (found) return found;
        }
        return list[0];
    }

    var item = loadData() || {};

    function getVal(v) { return v && String(v).trim() ? v : '—'; }

    function normalizeMajor(raw) {
        var v = String(raw || '').replace(/\n/g, '').trim();
        if (v === '大型抢险器械') return '大型抢险\n器械';
        return v;
    }

    function getMajorStyle(major) {
        var normalized = normalizeMajor(major);
        var colorMap = {
            '抢险物资': 'blue',
            '救生器材': 'red',
            '抢险器具': 'orange',
            '大型抢险\n器械': 'purple'
        };
        var color = colorMap[normalized] || 'blue';
        var map = {
            'blue': { color: '#1a73e8', bg: 'rgba(26,115,232,.2)', border: 'rgba(255,255,255,.3)' },
            'red': { color: '#ff6b6b', bg: 'rgba(217,48,37,.2)', border: 'rgba(255,255,255,.3)' },
            'orange': { color: '#ffb347', bg: 'rgba(230,81,0,.2)', border: 'rgba(255,255,255,.3)' },
            'purple': { color: '#b388ff', bg: 'rgba(123,47,247,.2)', border: 'rgba(255,255,255,.3)' }
        };
        return map[color];
    }

    function renderInfoGrid(pairs) {
        return pairs.map(function(p) {
            return '<div class="sc-row"><div class="sc-label">' + p.label + '</div><div class="sc-value ' + (p.cls || '') + '"' + (p.id ? ' id="' + p.id + '"' : '') + '>' + p.value + '</div></div>';
        }).join('');
    }

    function renderHero() {
        document.getElementById('matTitle').textContent = item.name || '—';
        var style = getMajorStyle(item.majorCategory);
        var tagEl = document.getElementById('matTag');
        tagEl.textContent = (item.majorCategory || '—').replace(/\n/g, '');
        tagEl.style.borderColor = style.border;
        tagEl.style.background = style.bg;
        document.getElementById('matLocation').innerHTML = '<i class="fa-solid fa-location-dot"></i><span>' + App.escapeHtml(item.location || '—') + '</span>';
        var quantityVal = item.quantity && String(item.quantity).trim() ? item.quantity : '—';
        document.getElementById('matMetrics').innerHTML =
            '<div class="hc-metric-item"><i class="fa-solid fa-box"></i>物资小类：<b>' + App.escapeHtml(item.subCategory || '—') + '</b></div>' +
            '<div class="hc-metric-divider"></div>' +
            '<div class="hc-metric-item"><i class="fa-solid fa-calculator"></i>储备总量：<b>' + App.escapeHtml(quantityVal) + ' ' + App.escapeHtml(item.unit || '') + '</b></div>';
        var contacts = splitContacts(item.contact);
        var contactName = contacts.length > 0 ? contacts[0] : '—';
        document.getElementById('matContact').innerHTML = '<i class="fa-regular fa-user"></i>仓库联系人：<b>' + App.escapeHtml(contactName) + '</b>';
    }

    function splitContacts(contact) {
        if (!contact) return [];
        return contact.split(/[、,，]/).map(function(s) { return s.trim(); }).filter(function(s) { return s; });
    }

    function splitPhones(phone) {
        if (!phone) return [];
        return phone.split(/[、,，]/).map(function(s) { return s.trim(); }).filter(function(s) { return s; });
    }

    function renderActions() {
        var contacts = splitContacts(item.contact);
        var phones = splitPhones(item.phone);
        var callAction = document.getElementById('callPhoneAction');
        var callLabel = document.getElementById('callLabel');
        if (phones.length === 0) {
            callAction.classList.add('disabled');
        } else if (phones.length === 1) {
            callLabel.textContent = '呼叫仓库联系人';
            callAction.addEventListener('click', function() {
                window.location.href = 'tel:' + phones[0];
                App.showToast('正在呼叫 ' + App.escapeHtml(phones[0]));
            });
        } else {
            callLabel.textContent = '选择联系人拨打';
            callAction.addEventListener('click', function() {
                var list = phones.map(function(p) {
                    return '<div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:pointer" onclick="window.location.href=\'tel:' + App.escapeHtml(p) + '\';App.showToast(\'正在呼叫 ' + App.escapeHtml(p) + '\')">' +
                        '<span style="font-weight:500">' + App.escapeHtml(p) + '</span><span style="color:var(--success);font-weight:600"><i class="fa-solid fa-phone"></i> 拨打</span></div>';
                }).join('');
                App.showModal ? App.showModal({ title: '选择电话拨打', content: '<div style="max-height:300px;overflow-y:auto">' + list + '</div>' }) : App.showToast('多联系人：请进详情拨打');
            });
        }

        var mapAction = document.getElementById('mapViewAction');
        if (!item.lng || !item.lat || !String(item.lng).trim() || !String(item.lat).trim()) {
            mapAction.classList.add('disabled');
        } else {
            mapAction.addEventListener('click', function() {
                var url = 'https://uri.amap.com/marker?position=' + encodeURIComponent(item.lng + ',' + item.lat) +
                    '&name=' + encodeURIComponent(item.name || '抢险物资') +
                    '&src=' + encodeURIComponent('奉贤风险管控');
                window.open(url, '_blank');
            });
        }
    }

    function renderBasicInfo() {
        var quantityVal = item.quantity && String(item.quantity).trim() ? item.quantity : '—';
        var rows = [
            { label: '大类', value: App.escapeHtml(getVal(item.majorCategory).replace(/\n/g, '')) },
            { label: '小类', value: App.escapeHtml(getVal(item.subCategory)) },
            { label: '物资名称', value: App.escapeHtml(getVal(item.name)) },
            { label: '数量', value: '<span style="font-size:18px;font-weight:700">' + App.escapeHtml(quantityVal) + '</span>' + (item.unit ? '<span style="margin-left:4px;color:var(--text2)">' + App.escapeHtml(item.unit) + '</span>' : '') },
            { label: '储备地点', value: App.escapeHtml(getVal(item.location)) }
        ];
        document.getElementById('basicInfo').innerHTML = renderInfoGrid(rows);
    }

    function renderContactInfo() {
        var contacts = splitContacts(item.contact);
        var phones = splitPhones(item.phone);
        var container = document.getElementById('contactInfo');
        if (contacts.length === 0 && phones.length === 0) {
            container.innerHTML = renderInfoGrid([{ label: '联系人', value: '—' }, { label: '电话/手机', value: '—' }]);
            return;
        }
        var contactVal = contacts.length > 0 ? App.escapeHtml(contacts.join('、')) : '—';
        var rows = [{ label: '联系人', value: contactVal }];
        if (phones.length === 1) {
            rows.push({ label: '电话/手机', value: '<span class="phone"><i class="fa-solid fa-phone"></i> ' + App.escapeHtml(phones[0]) + '</span>', cls: 'phone', id: 'singlePhone' });
        } else if (phones.length > 1) {
            rows.push({ label: '电话/手机', value: '<div class="phone-list">' + phones.map(function(p) {
                return '<div class="phone-row"><span class="phone-number">' + App.escapeHtml(p) + '</span><span class="phone-dial" onclick="window.location.href=\'tel:' + App.escapeHtml(p) + '\'"><i class="fa-solid fa-phone"></i> 拨打</span></div>';
            }).join('') + '</div>' });
        } else {
            rows.push({ label: '电话/手机', value: '—' });
        }
        container.innerHTML = renderInfoGrid(rows);

        var singlePhone = document.getElementById('singlePhone');
        if (singlePhone) {
            singlePhone.addEventListener('click', function() {
                window.location.href = 'tel:' + phones[0];
                App.showToast('正在呼叫 ' + App.escapeHtml(phones[0]));
            });
        }
    }

    function renderReportInfo() {
        var rows = [
            { label: '填报单位', value: App.escapeHtml(getVal(item.reportUnit)) },
            { label: '填报人', value: App.escapeHtml(getVal(item.reporter)) },
            { label: '填报日期', value: App.escapeHtml(getVal(item.reportDate)) }
        ];
        document.getElementById('reportInfo').innerHTML = renderInfoGrid(rows);
    }

    function init() {
        renderHero();
        renderActions();
        renderBasicInfo();
        renderContactInfo();
        renderReportInfo();

        var now = new Date();
        document.getElementById('statusTime').textContent =
            String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    init();
})();
</script>
</body>
</html>
