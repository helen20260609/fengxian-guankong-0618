<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>任务历史</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.history-page-body.scrollable-body { flex: 1; overflow-y: auto; scrollbar-width: none; }
.history-page-body.scrollable-body::-webkit-scrollbar { display: none; }

.filter-bar { display: flex; gap: 10px; padding: 14px 14px 0; flex-wrap: wrap; }
.filter-group { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.filter-group::-webkit-scrollbar { display: none; }
.filter-group .chip { flex-shrink: 0; padding: 5px 12px; border-radius: 10px; font-size: 11px; border: 1px solid var(--border); background: var(--card); color: var(--text-primary); cursor: pointer; }
.filter-group .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.history-list { padding: 14px; }
.history-card { background: var(--card); border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); }
.history-card .hc-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.history-card .hc-title { font-size: 14px; font-weight: 700; flex: 1; line-height: 1.4; }
.history-card .hc-meta { font-size: 11px; color: var(--text2); margin-top: 8px; display: flex; flex-wrap: wrap; gap: 10px; }
.history-card .hc-meta span { display: flex; align-items: center; gap: 4px; }
.history-card .hc-footer { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
.history-card .hc-time { font-size: 11px; color: var(--text2); }

.status-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; }
.status-chip.normal { background: rgba(var(--success-rgb),.14); color: var(--success); }
.status-chip.review { background: rgba(var(--warning-rgb),.15); color: var(--warning); }
.status-chip.abnormal { background: rgba(var(--danger-rgb),.12); color: var(--danger); }

.empty-state { padding: 60px 20px; text-align: center; color: var(--text2); }
.empty-state i { font-size: 38px; margin-bottom: 10px; opacity: .3; }

.detail-section { margin-bottom: 14px; }
.detail-section .ds-title { font-size: 12px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.detail-section .ds-content { font-size: 11px; color: var(--text2); line-height: 1.6; }
.detail-point { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.detail-point:last-child { border-bottom: none; }
.detail-point .dp-result { font-size: 10px; padding: 1px 6px; border-radius: 3px; }
.detail-point .dp-result.normal { background: rgba(var(--success-rgb),.14); color: var(--success); }
.detail-point .dp-result.abnormal { background: rgba(var(--danger-rgb),.12); color: var(--danger); }
.detail-point .dp-result.review { background: rgba(var(--warning-rgb),.15); color: var(--warning); }

.track-list { max-height: 160px; overflow-y: auto; }
.track-item { display: flex; gap: 10px; padding: 6px 0; font-size: 11px; color: var(--text2); border-bottom: 1px solid var(--border); }
.track-item:last-child { border-bottom: none; }
.track-item .ti-time { flex-shrink: 0; width: 70px; }
.track-item .ti-addr { flex: 1; }

/* ===== 标准顶部导航（方案①：绝对居中标题） ===== */
.page-hero { display: flex; align-items: center; justify-content: center; padding: calc(34px + 16px) 18px 42px; }
.page-hero .ph-back { position: absolute; left: 14px; top: calc(34px + 16px); margin: 0; display: flex; align-items: center; justify-content: center; height: 32px; }
.page-hero .ph-title { position: absolute; left: 50%; top: calc(34px + 16px); transform: translateX(-50%); text-align: center; line-height: 32px; width: 70%; z-index: 2; }
.page-hero .hero-title { display: contents; }
.page-hero .ph-sub { position: static; text-align: center; font-size: 12.5px; opacity: .85; margin-top: 40px; width: 100%; z-index: 2; }
.page-hero .hero-stats-v2 { position: relative; z-index: 2; width: 100%; margin-top: 40px; }
.page-hero .ph-action { position: absolute; right: 14px; top: calc(34px + 16px); margin: 0; display: flex; align-items: center; height: 32px; z-index: 2; }
</style>
</head>
<body>
<div class="phone-frame">
    <!-- 侧边按钮 -->
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <!-- 状态栏 -->
    <div class="status-bar light">
        <span class="sb-time" id="statusTime">9:41</span>
        <span class="sb-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
            <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
        </span>
    </div>

    <div class="page-hero">
        <div class="ph-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
        <div class="ph-title">任务历史</div>
            <div class="ph-sub">共完成 <span id="historyCount">0</span> 项巡查</div>
    </div>

    <div class="history-page-body scrollable-body">
        <div class="filter-bar">
            <div class="filter-group" id="dateFilter">
                <div class="chip active" data-range="all">全部</div>
                <div class="chip" data-range="7">近7天</div>
                <div class="chip" data-range="30">近30天</div>
            </div>
            <div class="filter-group" id="typeFilter">
                <div class="chip active" data-type="">全部类型</div>
                <div class="chip" data-type="daily">日常</div>
                <div class="chip" data-type="special">专项</div>
                <div class="chip" data-type="temporary">临时</div>
                <div class="chip" data-type="review">复查</div>
            </div>
        </div>

        <div class="history-list" id="historyList">
            <!-- 动态填充 -->
        </div>
    </div>

    </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-mask" id="detailModal">
    <div class="modal-sheet">
        <div class="sheet-header">
            <div class="sheet-title">执行过程回放</div>
            <div class="sheet-close tap" onclick="closeDetailModal()"><i class="fa-solid fa-xmark"></i></div>
        </div>
        <div class="history-page-body scrollable-body" id="detailContent" style="padding:14px">
            <!-- 动态填充 -->
        </div>
    </div>
</div>

<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    var currentDateRange = 'all';
    var currentType = '';
    var typeName = { daily: '日常巡检', special: '专项巡查', temporary: '临时巡查', review: '复查任务' };

    function getHistoryList() {
        var list = DataStore.inspectionHistory || [];
        var now = Date.now();
        return list.filter(function(item) {
            var itemTime = new Date(item.submitTime).getTime();
            var passDate = true;
            if (currentDateRange === '7') passDate = (now - itemTime) < 7 * 24 * 60 * 60 * 1000;
            if (currentDateRange === '30') passDate = (now - itemTime) < 30 * 24 * 60 * 60 * 1000;
            var passType = !currentType || item.taskType === currentType;
            return passDate && passType;
        }).sort(function(a, b) {
            return new Date(b.submitTime) - new Date(a.submitTime);
        });
    }

    function renderHistory() {
        var container = document.getElementById('historyList');
        var list = getHistoryList();
        document.getElementById('historyCount').textContent = list.length;

        if (!list.length) {
            container.innerHTML = '<div class="empty-state"><i class="fa-regular fa-clipboard"></i><div>暂无历史记录</div></div>';
            return;
        }

        container.innerHTML = list.map(function(item, idx) {
            var conclusionClass = item.conclusion || 'normal';
            var conclusionText = { normal: '正常完成', abnormal: '发现异常', review: '需复查' }[conclusionClass] || '正常完成';
            var abnormalCount = (item.pointResults || []).filter(function(p) { return p.result === 'abnormal'; }).length;
            var reviewCount = (item.pointResults || []).filter(function(p) { return p.result === 'review'; }).length;

            return '<div class="history-card tap anim d' + (idx % 5 + 1) + '" onclick="showDetail(' + idx + ')">' +
                '<div class="hc-header">' +
                '<div class="hc-title">' + App.escapeHtml(item.taskTitle) + '</div>' +
                '<span class="status-chip ' + conclusionClass + '">' + conclusionText + '</span>' +
                '</div>' +
                '<div class="hc-meta">' +
                '<span><i class="fa-solid fa-user"></i> ' + App.escapeHtml(item.inspector || '未知') + '</span>' +
                '<span><i class="fa-solid fa-flag"></i> ' + (typeName[item.taskType] || item.taskType || '其他') + '</span>' +
                '<span><i class="fa-solid fa-location-dot"></i> ' + App.escapeHtml(item.area || '') + '</span>' +
                '</div>' +
                '<div class="hc-footer">' +
                '<div class="hc-time"><i class="fa-regular fa-clock"></i> ' + App.formatDate(item.submitTime, 'yyyy-MM-dd hh:mm') + '</div>' +
                '<div style="font-size: 11px;color:var(--text2)">' + (abnormalCount ? abnormalCount + ' 项异常' : '') + (abnormalCount && reviewCount ? ' · ' : '') + (reviewCount ? reviewCount + ' 项复查' : '') + (!abnormalCount && !reviewCount ? '检查正常' : '') + '</div>' +
                '</div>' +
                '</div>';
        }).join('');

        window._historyList = list;
    }

    window.showDetail = function(idx) {
        var item = window._historyList[idx];
        if (!item) return;
        var content = document.getElementById('detailContent');

        var html = '';

        // 基本信息
        html += '<div class="detail-section">' +
            '<div class="ds-title"><i class="fa-solid fa-circle-info" style="color:var(--primary)"></i> 基本信息</div>' +
            '<div class="ds-content">' +
            '<div>任务名称：' + App.escapeHtml(item.taskTitle) + '</div>' +
            '<div>巡查人员：' + App.escapeHtml(item.inspector || '未知') + '</div>' +
            '<div>提交时间：' + App.formatDate(item.submitTime, 'yyyy-MM-dd hh:mm') + '</div>' +
            '</div>' +
            '</div>';

        // 点位结果
        if (item.pointResults && item.pointResults.length) {
            html += '<div class="detail-section">' +
                '<div class="ds-title"><i class="fa-solid fa-location-dot" style="color:var(--primary)"></i> 点位检查结果</div>' +
                '<div class="ds-content">';
            item.pointResults.forEach(function(p) {
                var resultClass = p.result || 'normal';
                var resultText = { normal: '正常', abnormal: '异常', review: '需复查' }[resultClass] || '未检查';
                html += '<div class="detail-point">' +
                    '<div>' + App.escapeHtml(p.pointName) + (p.riskType ? ' <span style="color:var(--text2);font-size: 10px">(' + App.escapeHtml(p.riskType) + ')</span>' : '') + '</div>' +
                    '<span class="dp-result ' + resultClass + '">' + resultText + '</span>' +
                    '</div>';
            });
            html += '</div></div>';
        }

        // 现场照片
        if (item.photos && item.photos.length) {
            html += '<div class="detail-section">' +
                '<div class="ds-title"><i class="fa-solid fa-camera" style="color:var(--primary)"></i> 现场照片</div>' +
                '<div class="photo-grid">';
            item.photos.forEach(function(url) {
                html += '<div class="photo-thumb" style="background-image:url(' + url + ')"></div>';
            });
            html += '</div></div>';
        }

        // 多媒体
        if (item.medias && item.medias.length) {
            html += '<div class="detail-section">' +
                '<div class="ds-title"><i class="fa-solid fa-film" style="color:var(--primary)"></i> 多媒体记录</div>' +
                '<div class="ds-content">';
            item.medias.forEach(function(m, i) {
                var icon = m.type === 'video' ? 'fa-video' : 'fa-microphone';
                var label = m.type === 'video' ? '录像' : '录音';
                html += '<div style="display:flex;align-items:center;gap:10px;padding:8px;background:var(--bg-hover);border-radius: 5px;margin-bottom:6px">' +
                    '<i class="fa-solid ' + icon + '" style="color:var(--primary)"></i>' +
                    '<div style="flex:1;font-size: 12px">' + label + ' ' + (i + 1) + '</div>' +
                    '<div style="font-size: 11px;color:var(--text2)">' + (m.duration || 0) + 's</div>' +
                    '</div>';
            });
            html += '</div></div>';
        }

        // 巡查记录
        if (item.recordDesc) {
            html += '<div class="detail-section">' +
                '<div class="ds-title"><i class="fa-solid fa-file-lines" style="color:var(--primary)"></i> 巡查记录</div>' +
                '<div class="ds-content" style="white-space:pre-wrap">' + App.escapeHtml(item.recordDesc) + '</div>' +
                '</div>';
        }

        // 复查信息
        if (item.conclusion === 'review' && item.reviewDate) {
            html += '<div class="detail-section">' +
                '<div class="ds-title"><i class="fa-solid fa-calendar-check" style="color:var(--warning)"></i> 复查信息</div>' +
                '<div class="ds-content">' +
                '<div>复查时间：' + App.formatDate(item.reviewDate, 'yyyy-MM-dd hh:mm') + '</div>' +
                '<div>复查要求：' + App.escapeHtml(item.reviewRequirements || '无') + '</div>' +
                '</div>' +
                '</div>';
        }

        content.innerHTML = html;
        document.getElementById('detailModal').classList.add('show');
    };

    window.closeDetailModal = function() {
        document.getElementById('detailModal').classList.remove('show');
    };

    document.getElementById('dateFilter').addEventListener('click', function(e) {
        var chip = e.target.closest('.chip');
        if (!chip) return;
        document.querySelectorAll('#dateFilter .chip').forEach(function(c) { c.classList.remove('active'); });
        chip.classList.add('active');
        currentDateRange = chip.dataset.range;
        renderHistory();
    });

    document.getElementById('typeFilter').addEventListener('click', function(e) {
        var chip = e.target.closest('.chip');
        if (!chip) return;
        document.querySelectorAll('#typeFilter .chip').forEach(function(c) { c.classList.remove('active'); });
        chip.classList.add('active');
        currentType = chip.dataset.type;
        renderHistory();
    });

    renderHistory();
})();
</script>
</body>
</html>
