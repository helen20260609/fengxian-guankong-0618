<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>巡查任务</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
.task-page-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--card); min-height: auto; height: calc(100vh - 130px - var(--tab-bar-height) - var(--safe-bottom)); }

.task-scroll { flex: 1; overflow-y: auto; padding: 0 14px 14px; position: relative; }
.task-scroll::-webkit-scrollbar { display: none; }

.task-list { padding: 0 0 14px; }
.task-card { background: var(--card); border-radius: 10px; box-shadow: 0 2px 10px var(--shadow); border: 1px solid var(--border); padding: 14px; margin-bottom: 12px; }
.task-card .tc-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.task-card .tc-title { font-size: 14px; font-weight: 700; flex: 1; }
.task-card .tc-meta { font-size: 11px; color: var(--text2); margin-top: 8px; display: flex; flex-wrap: wrap; gap: 10px; }
.task-card .tc-meta span { display: flex; align-items: center; gap: 4px; }
.task-card .tc-desc { font-size: 12.5px; color: var(--text2); margin-top: 8px; line-height: 1.5; }
.task-card .tc-footer { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
.task-card .tc-deadline { font-size: 11px; color: var(--text2); }
.task-card .tc-actions { display: flex; gap: 8px; }
.task-card .tc-actions .btn-sm { padding: 5px 12px; font-size: 11px; }

.map-view { display: none; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 2px 10px var(--shadow); animation: fadeIn .3s; flex-shrink: 0; }
.map-view.show { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.empty-state { padding: 40px 0; text-align: center; color: var(--text2); }
.empty-state i { font-size: 38px; margin-bottom: 10px; }
.empty-title { font-size: 13px; }

.hero-stats-v2 .hs-value { color: #fff; }


/* ===== 标准顶部导航（方案①：绝对居中标题） ===== */
.page-hero { display: flex; align-items: center; justify-content: center; padding: calc(34px + 16px) 18px 42px; }
.page-hero .ph-back { position: absolute; left: 14px; top: calc(34px + 16px); margin: 0; display: flex; align-items: center; justify-content: center; height: 32px; }
.page-hero .ph-title { position: absolute; left: 50%; top: calc(34px + 16px); transform: translateX(-50%); text-align: center; line-height: 32px; width: 70%; z-index: 2; }
.page-hero .hero-title { display: contents; }
.page-hero .ph-sub { position: static; text-align: center; font-size: 12.5px; opacity: .85; margin-top: 40px; width: 100%; z-index: 2; }
.page-hero .hero-stats-v2 { position: relative; z-index: 2; width: 100%; margin-top: 40px; }
.page-hero .ph-action { position: absolute; right: 14px; top: calc(34px + 16px); margin: 0; display: flex; align-items: center; height: 32px; z-index: 2; }
</style>
</head>
<body>
<div class="phone-frame">
    <!-- 侧边按钮 -->
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <!-- 状态栏 -->
    <div class="status-bar light">
        <span class="sb-time" id="statusTime">9:41</span>
        <span class="sb-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
            <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
        </span>
    </div>

    <div class="page-hero">
        <div class="ph-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
        <div class="ph-title">巡查任务</div>
            <div class="ph-sub" id="heroSub">--</div>
        <div class="hero-stats-v2" style="margin-top:16px">
            <div class="hs-item"><div class="hs-value" id="statPending">--</div><div class="hs-label">待执行</div></div>
            <div class="hs-item"><div class="hs-value" id="statOngoing">--</div><div class="hs-label">执行中</div></div>
            <div class="hs-item"><div class="hs-value" id="statOverdue">--</div><div class="hs-label">已逾期</div></div>
            <div class="hs-item"><div class="hs-value" id="statCompleted">--</div><div class="hs-label">已完成</div></div>
        </div>
    </div>

    <div class="task-page-body">
        <div class="search-bar">
            <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="搜索任务名称、区域、要求">
            </div>
            <div class="nav-action tap" id="modeBtn" onclick="toggleMode()" style="font-size: 17px;color:var(--text-primary)"><i class="fa-solid fa-map"></i></div>
        </div>

        <div class="filter-tabs" id="typeTabs">
            <div class="filter-tab active" data-type="all">全部</div>
            <div class="filter-tab" data-type="daily">日常巡检</div>
            <div class="filter-tab" data-type="special">专项巡查</div>
            <div class="filter-tab" data-type="temporary">临时巡查</div>
            <div class="filter-tab" data-type="review">复查任务</div>
        </div>

        <div class="task-scroll" id="taskScroll">
            <div class="task-list" id="taskList">
                <!-- 动态填充 -->
            </div>

            <div class="map-view" id="mapView" style="display:none">
                <div id="taskMapChart" style="width:100%;height:420px;background:linear-gradient(180deg,#e0f2fe 0%,#f0fdf4 100%)"></div>
            </div>

            <!-- 任务信息卡片 -->
            <div class="map-info-card" id="taskInfoCard" style="display:none;position:fixed;left:14px;right:14px;bottom:20px;background:var(--card);border-radius: 10px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.12);border:1px solid var(--border);z-index:100">
                <div class="mic-close tap" onclick="closeTaskInfo()" style="position:absolute;top:10px;right:10px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary)"><i class="fa-solid fa-xmark"></i></div>
                <div class="mic-title" id="taskInfoTitle" style="font-size: 14px;font-weight:700">--</div>
                <div class="mic-meta" id="taskInfoMeta" style="font-size: 11px;color:var(--text2);margin-top:6px">--</div>
                <button class="btn btn-primary btn-sm" style="margin-top:10px" id="taskInfoBtn">执行任务</button>
            </div>
        </div>
    </div>

    </div>
</div>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    var currentType = 'all';
    var currentDomain = App.getQuery('domain') || '';
    var isMapMode = false;
    var keyword = '';
    var typeName = { daily: '日常巡检', special: '专项巡查', temporary: '临时巡查', review: '复查任务' };
    var chart = null;

    var taskPool = (currentDomain && DataStore.domainInspectionTasks && DataStore.domainInspectionTasks[currentDomain])
        ? DataStore.domainInspectionTasks[currentDomain]
        : DataStore.inspectionTasks;

    var domainLabel = '';
    if (currentDomain && RiskData.domains[currentDomain]) {
        domainLabel = RiskData.domains[currentDomain].name;
        document.getElementById('heroSub').innerHTML = '<i class="fa-solid ' + RiskData.domains[currentDomain].icon + '"></i> ' + App.escapeHtml(domainLabel) + ' · 风险巡查任务';
    } else {
        document.getElementById('heroSub').textContent = '全部风险巡查任务';
    }

    function getTasks(type) {
        var tasks = taskPool.filter(function(t) {
            if (type !== 'all' && t.type !== type) return false;
            if (keyword) {
                var text = (t.title + ' ' + t.area + ' ' + t.requirements).toLowerCase();
                return text.indexOf(keyword.toLowerCase()) !== -1;
            }
            return true;
        });
        tasks.sort(function(a, b) {
            var levelOrder = { red: 0, orange: 1, yellow: 2, blue: 3 };
            var statusOrder = { pending: 0, ongoing: 1, overdue: 2, completed: 3 };
            var levelDiff = levelOrder[a.priority] - levelOrder[b.priority];
            if (levelDiff !== 0) return levelDiff;
            var statusDiff = (statusOrder[a.status] || 9) - (statusOrder[b.status] || 9);
            if (statusDiff !== 0) return statusDiff;
            return new Date(a.deadline) - new Date(b.deadline);
        });
        return tasks;
    }

    function renderStats() {
        var counts = { pending: 0, ongoing: 0, overdue: 0, completed: 0 };
        taskPool.forEach(function(t) {
            if (counts[t.status] !== undefined) counts[t.status]++;
        });
        document.getElementById('statPending').textContent = counts.pending;
        document.getElementById('statOngoing').textContent = counts.ongoing;
        document.getElementById('statOverdue').textContent = counts.overdue;
        document.getElementById('statCompleted').textContent = counts.completed;
    }

    function renderTasks() {
        var container = document.getElementById('taskList');
        container.innerHTML = '';
        var tasks = getTasks(currentType);

        if (tasks.length === 0) {
            container.innerHTML = '<div class="empty-state"><i class="fa-regular fa-clipboard"></i><div class="empty-title">暂无任务</div></div>';
            return;
        }

        tasks.forEach(function(t, idx) {
            var statusText = { pending: '待执行', ongoing: '执行中', completed: '已完成', overdue: '已逾期' }[t.status] || t.status;
            var html = '<div class="task-card tap anim d' + (idx % 5 + 1) + '" onclick="App.go(\'inspection-execute.html?id=' + t.id + '\')">' +
                '<div class="tc-header">' +
                '<div class="tc-title">' + App.escapeHtml(t.title) + '</div>' +
                '<span class="risk-badge ' + t.priority + '"><span class="risk-dot ' + t.priority + '" style="margin-right:4px"></span> ' + levelName(t.priority) + '</span>' +
                '</div>' +
                '<div class="tc-meta">' +
                '<span><i class="fa-solid fa-location-dot"></i> ' + App.escapeHtml(t.area) + '</span>' +
                '<span><i class="fa-solid fa-route"></i> ' + App.formatDistance(t.distance) + '</span>' +
                '<span><i class="fa-solid fa-flag"></i> ' + typeName[t.type] + '</span>' +
                '</div>' +
                '<div class="tc-desc">' + App.escapeHtml(t.requirements) + '</div>' +
                '<div class="tc-footer">' +
                '<div class="tc-deadline"><i class="fa-regular fa-clock"></i> 截止：' + App.formatDate(t.deadline, 'MM-dd hh:mm') + '</div>' +
                '<div class="tc-actions">' +
                '<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();App.go(\'inspection-execute.html?id=' + t.id + '\')">' + (t.status === 'ongoing' ? '继续' : '执行') + '</button>' +
                '</div>' +
                '</div>' +
                '</div>';
            container.insertAdjacentHTML('beforeend', html);
        });
    }

    function normalizeCoord(lat, lng) {
        return [(lng - 121.4726) / 0.06 * 100, (30.9123 - lat) / 0.04 * 100];
    }

    function renderMap() {
        if (!chart) chart = echarts.init(document.getElementById('taskMapChart'));
        var tasks = getTasks(currentType);
        var data = tasks.map(function(t) {
            var c = normalizeCoord(t.points && t.points[0] ? 30.92 - Math.random() * 0.04 : 30.92, 121.47 + Math.random() * 0.06);
            return {
                value: [c[0], c[1]],
                task: t,
                itemStyle: { color: { red: '#ef4444', orange: '#f97316', yellow: '#eab308', blue: '#3b82f6' }[t.priority] || '#3b82f6' }
            };
        });
        chart.setOption({
            grid: { left: 0, right: 0, top: 0, bottom: 0 },
            xAxis: { show: false, min: 0, max: 100 },
            yAxis: { show: false, min: 0, max: 100 },
            tooltip: { show: false },
            series: [{
                type: 'scatter',
                symbolSize: 18,
                data: data
            }]
        }, true);
        chart.off('click');
        chart.on('click', function(params) {
            var t = params.data.task;
            document.getElementById('taskInfoTitle').textContent = t.title;
            document.getElementById('taskInfoMeta').innerHTML = App.escapeHtml(t.area) + ' · ' + typeName[t.type] + ' · 截止 ' + App.formatDate(t.deadline, 'MM-dd hh:mm');
            document.getElementById('taskInfoBtn').onclick = function() { App.go('inspection-execute.html?id=' + t.id); };
            document.getElementById('taskInfoCard').style.display = 'block';
        });
    }

    window.toggleMode = function() {
        isMapMode = !isMapMode;
        document.getElementById('modeBtn').innerHTML = isMapMode ? '<i class="fa-solid fa-list"></i>' : '<i class="fa-solid fa-map"></i>';
        document.getElementById('taskList').style.display = isMapMode ? 'none' : 'block';
        document.getElementById('mapView').classList.toggle('show', isMapMode);
        document.getElementById('typeTabs').style.display = isMapMode ? 'none' : 'flex';
        if (isMapMode) {
            setTimeout(function() { renderMap(); }, 0);
        } else {
            document.getElementById('taskInfoCard').style.display = 'none';
        }
    };

    window.closeTaskInfo = function() {
        document.getElementById('taskInfoCard').style.display = 'none';
    };

    document.getElementById('typeTabs').addEventListener('click', function(e) {
        var tab = e.target.closest('.filter-tab');
        if (!tab) return;
        document.querySelectorAll('#typeTabs .filter-tab').forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        currentType = tab.dataset.type;
        renderTasks();
        if (isMapMode) renderMap();
    });

    document.getElementById('searchInput').addEventListener('input', App.debounce(function() {
        keyword = this.value.trim();
        renderTasks();
        if (isMapMode) renderMap();
    }, 400));

    function levelName(level) {
        var map = { red: '红色', orange: '橙色', yellow: '黄色', blue: '蓝色' };
        return map[level] || level;
    }

    renderStats();
    renderTasks();
})();
</script>
</body>
</html>
