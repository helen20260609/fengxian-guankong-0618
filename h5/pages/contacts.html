<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>通讯录</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/h5-frame.css">
<style>
.search-bar { margin: 12px 14px; }

.contact-group { margin: 0 14px 14px; }
.contact-group .cg-title { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 8px; }
.contact-card { background: var(--card); border-radius: 8px; box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
.contact-card .cc-avatar { width: 44px; height: 44px; border-radius: 5px; background: linear-gradient(135deg, var(--primary-light), var(--primary)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; flex-shrink: 0; }
.contact-card .cc-body { flex: 1; min-width: 0; }
.contact-card .cc-name { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.contact-card .cc-name .cc-tag { font-size: 9px; padding: 1px 6px; border-radius: 5px; background: rgba(var(--danger-rgb),.12); color: var(--danger); }
.contact-card .cc-info { font-size: 11px; color: var(--text2); margin-top: 3px; }
.contact-card .cc-actions { display: flex; gap: 10px; }
.contact-card .cc-actions a { width: 34px; height: 34px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--primary); background: var(--primary-light); }
.contact-card .cc-actions a.sms { color: var(--success); background: rgba(var(--success-rgb),.14); }

.duty-card { background: var(--card); border-radius: 8px; padding: 14px; margin: 0 14px 14px; box-shadow: 0 2px 8px var(--shadow); border: 1px solid var(--border); }
.duty-card .dc-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
.duty-card .dc-row { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.duty-card .dc-row:last-child { border-bottom: none; }

    .org-filter { display: flex; gap: 8px; padding: 0 14px 12px; overflow-x: auto; scrollbar-width: none; }
    .org-filter::-webkit-scrollbar { display: none; }
    .org-filter .of { flex-shrink: 0; padding: 5px 12px; border-radius: 10px; font-size: 11px; border: 1px solid var(--border); background: var(--card); }
    .org-filter .of.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .fav-btn { position: absolute; top: 8px; right: 8px; color: var(--text2); font-size: 13px; }
    .fav-btn.active { color: var(--warning); }
    .contact-card { position: relative; }

    .contact-detail { padding: 10px 0; }
    .contact-detail .cd-avatar { width: 60px; height: 60px; border-radius: 5px; background: linear-gradient(135deg, var(--primary-light), var(--primary)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; margin: 0 auto 14px; }
    .contact-detail .cd-name { text-align: center; font-size: 17px; font-weight: 700; }
    .contact-detail .cd-info { text-align: center; font-size: 12px; color: var(--text2); margin-top: 4px; }
    .contact-detail .cd-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .contact-detail .cd-row:last-child { border-bottom: none; }
    .contact-detail .cd-label { color: var(--text2); }
    .contact-detail .cd-value { color: var(--text-primary); font-weight: 500; }
    .contact-detail .cd-actions { display: flex; gap: 10px; margin-top: 16px; }
    .contact-detail .cd-actions .btn { flex: 1; }

    .schedule-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; text-align: center; }
    .schedule-grid .sg-day { font-size: 10px; color: var(--text2); }
    .schedule-grid .sg-status { font-size: 11px; padding: 4px 0; border-radius: 5px; background: var(--bg-hover); color: var(--text2); }
    .schedule-grid .sg-status.on { background: rgba(var(--success-rgb),.14); color: var(--success); }


/* ===== 标准顶部导航（方案①：绝对居中标题） ===== */
.page-hero { display: flex; align-items: center; justify-content: center; padding: calc(34px + 16px) 18px 42px; }
.page-hero .ph-back { position: absolute; left: 14px; top: calc(34px + 16px); margin: 0; display: flex; align-items: center; justify-content: center; height: 32px; }
.page-hero .ph-title { position: absolute; left: 50%; top: calc(34px + 16px); transform: translateX(-50%); text-align: center; line-height: 32px; width: 70%; z-index: 2; }
.page-hero .hero-title { display: contents; }
.page-hero .ph-sub { position: static; text-align: center; font-size: 12.5px; opacity: .85; margin-top: 40px; width: 100%; z-index: 2; }
.page-hero .hero-stats-v2 { position: relative; z-index: 2; width: 100%; margin-top: 40px; }
.page-hero .ph-action { position: absolute; right: 14px; top: calc(34px + 16px); margin: 0; display: flex; align-items: center; height: 32px; z-index: 2; }
</style>
</head>
<body>
<div class="phone-frame">
    <!-- 侧边按钮 -->
    <div class="side-button side-button-left mute"></div>
    <div class="side-button side-button-left volume-up"></div>
    <div class="side-button side-button-left volume-down"></div>
    <div class="side-button side-button-right power"></div>
    <div class="phone-shell">

    <!-- 状态栏 -->
    <div class="status-bar light">
        <span class="sb-time" id="statusTime">9:41</span>
        <span class="sb-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi" style="margin-left:4px"></i>
            <i class="fa-solid fa-battery-full" style="margin-left:4px"></i>
        </span>
    </div>

    <div class="page-hero">
        <div class="ph-back tap" onclick="App.back()"><i class="fa-solid fa-chevron-left"></i></div>
        <div class="ph-title">通讯录</div>
            <div class="ph-sub">快速查找值班与管理人员</div>
    </div>

    <div class="search-bar anim d1">
        <div class="search-input-wrapper">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" placeholder="搜索姓名、职务、部门">
        </div>
    </div>

    <div class="org-filter anim d2" id="orgFilter">
        <div class="of active" data-org="all" onclick="filterOrg(this,'all')">全部</div>
        <div class="of" data-org="district" onclick="filterOrg(this,'district')">区级管理</div>
        <div class="of" data-org="industry" onclick="filterOrg(this,'industry')">行业管理</div>
        <div class="of" data-org="duty" onclick="filterOrg(this,'duty')">值班人员</div>
    </div>

    <div class="contact-group anim d2" id="favGroup" style="display:none">
        <div class="cg-title"><i class="fa-solid fa-star" style="color:var(--warning);margin-right:4px"></i>我的收藏</div>
        <div id="favList"></div>
    </div>

    <div class="contact-group anim d3">
        <div class="cg-title">紧急联系人</div>
        <div id="emergencyList"></div>
    </div>

    <div class="duty-card anim d4">
        <div class="dc-title"><i class="fa-solid fa-calendar-day" style="color:var(--primary);margin-right:6px"></i>今日值班</div>
        <div id="dutyList"></div>
    </div>

    <div class="contact-group anim d5">
        <div class="cg-title">全部联系人</div>
        <div id="contactList">
            <!-- 动态填充 -->
        </div>
    </div>

    <!-- 联系人详情弹窗 -->
    <div class="modal-mask" id="contactModal">
        <div class="modal-sheet">
            <div class="sheet-header">
                <div class="sheet-title">联系人详情</div>
                <div class="sheet-close tap" onclick="closeContactDetail()"><i class="fa-solid fa-xmark"></i></div>
            </div>
            <div class="contact-detail" id="contactDetail"></div>
        </div>
    </div>

    </div>
</div>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/risk-data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function() {
    var currentOrg = 'all';
    var weekDays = ['周一','周二','周三','周四','周五','周六','周日'];

    function getFavorites() {
        var saved = localStorage.getItem('risk-contact-favorites');
        if (saved) {
            try { return JSON.parse(saved); } catch (e) {}
        }
        return [];
    }
    function setFavorites(ids) {
        localStorage.setItem('risk-contact-favorites', JSON.stringify(ids));
    }

    function renderContacts() {
        var kw = document.getElementById('searchInput').value.trim().toLowerCase();
        var emergencyList = document.getElementById('emergencyList');
        var contactList = document.getElementById('contactList');
        var favList = document.getElementById('favList');
        var favGroup = document.getElementById('favGroup');
        emergencyList.innerHTML = '';
        contactList.innerHTML = '';
        favList.innerHTML = '';

        var favIds = getFavorites();

        var filtered = DataStore.contacts.filter(function(c) {
            if (kw && (c.name + c.position + c.dept).toLowerCase().indexOf(kw) === -1) return false;
            if (currentOrg !== 'all' && c.orgLevel !== currentOrg) return false;
            return true;
        });

        var emergency = filtered.filter(function(c) { return c.isEmergency; });
        var normal = filtered.filter(function(c) { return !c.isEmergency; });
        var favorites = DataStore.contacts.filter(function(c) { return favIds.indexOf(c.id) !== -1; });

        if (favorites.length && !kw) {
            favGroup.style.display = 'block';
            favorites.forEach(function(c) { favList.appendChild(buildCard(c, true)); });
        } else {
            favGroup.style.display = 'none';
        }

        emergency.forEach(function(c) { emergencyList.appendChild(buildCard(c, true)); });
        normal.forEach(function(c) { contactList.appendChild(buildCard(c, true)); });

        if (emergency.length === 0) emergencyList.innerHTML = '<div class="empty-state" style="padding:20px"><div class="empty-desc">无紧急联系人</div></div>';
        if (normal.length === 0) contactList.innerHTML = '<div class="empty-state" style="padding:20px"><div class="empty-desc">无联系人</div></div>';

        renderDuty();
    }

    function buildCard(c, showFav) {
        var div = document.createElement('div');
        div.className = 'contact-card tap';
        var emergencyTag = c.isEmergency ? '<span class="cc-tag">紧急</span>' : '';
        var favIds = getFavorites();
        var isFav = favIds.indexOf(c.id) !== -1;
        var favCls = isFav ? 'fav-btn active' : 'fav-btn';
        var favHtml = showFav ? '<div class="' + favCls + '" onclick="event.stopPropagation();toggleFavorite(\'' + c.id + '\')"><i class="fa-solid fa-star"></i></div>' : '';
        div.innerHTML =
            favHtml +
            '<div class="cc-avatar">' + c.name.charAt(0) + '</div>' +
            '<div class="cc-body">' +
            '<div class="cc-name">' + App.escapeHtml(c.name) + emergencyTag + '</div>' +
            '<div class="cc-info">' + App.escapeHtml(c.position) + ' · ' + App.escapeHtml(c.dept) + '</div>' +
            '</div>' +
            '<div class="cc-actions">' +
            '<a href="tel:' + c.phone + '" onclick="event.stopPropagation()"><i class="fa-solid fa-phone"></i></a>' +
            '<a href="sms:' + c.phone + '" class="sms" onclick="event.stopPropagation()"><i class="fa-solid fa-comment-sms"></i></a>' +
            '</div>';
        div.onclick = function() { openContactDetail(c.id); };
        return div;
    }

    function renderDuty() {
        var today = new Date().getDay();
        var dayIndex = today === 0 ? 6 : today - 1;
        var dutyList = document.getElementById('dutyList');
        var onDuty = DataStore.contacts.filter(function(c) { return c.isOnDuty && c.dutySchedule[dayIndex] === '值班'; });
        if (onDuty.length === 0) {
            dutyList.innerHTML = '<div class="dc-row"><span>今日无值班安排</span></div>';
            return;
        }
        dutyList.innerHTML = onDuty.map(function(c) {
            return '<div class="dc-row tap" onclick="openContactDetail(\'' + c.id + '\')">' +
                '<span>' + App.escapeHtml(c.position) + '</span>' +
                '<span>' + App.escapeHtml(c.name) + ' ' + App.escapeHtml(c.phone) + '</span>' +
            '</div>';
        }).join('');
    }

    window.filterOrg = function(el, org) {
        currentOrg = org;
        document.querySelectorAll('#orgFilter .of').forEach(function(o) { o.classList.remove('active'); });
        el.classList.add('active');
        renderContacts();
    };

    window.toggleFavorite = function(id) {
        var favIds = getFavorites();
        var idx = favIds.indexOf(id);
        if (idx === -1) {
            favIds.push(id);
            App.showToast('已收藏');
        } else {
            favIds.splice(idx, 1);
            App.showToast('已取消收藏');
        }
        setFavorites(favIds);
        renderContacts();
    };

    window.openContactDetail = function(id) {
        var c = DataStore.getContact(id);
        if (!c) return;
        var favIds = getFavorites();
        var isFav = favIds.indexOf(id) !== -1;
        var scheduleHtml = c.dutySchedule ? ('<div class="schedule-grid">' + c.dutySchedule.map(function(s, i) {
            return '<div><div class="sg-day">' + weekDays[i] + '</div><div class="sg-status ' + (s === '值班' ? 'on' : '') + '" style="margin-top:4px">' + s + '</div></div>';
        }).join('') + '</div>') : '';
        document.getElementById('contactDetail').innerHTML =
            '<div class="cd-avatar">' + c.name.charAt(0) + '</div>' +
            '<div class="cd-name">' + App.escapeHtml(c.name) + '</div>' +
            '<div class="cd-info">' + App.escapeHtml(c.position) + ' · ' + App.escapeHtml(c.dept) + '</div>' +
            '<div class="cd-row"><span class="cd-label">电话</span><span class="cd-value">' + App.escapeHtml(c.phone) + '</span></div>' +
            '<div class="cd-row"><span class="cd-label">组织层级</span><span class="cd-value">' + orgLabel(c.orgLevel) + '</span></div>' +
            '<div class="cd-row"><span class="cd-label">业务领域</span><span class="cd-value">' + (c.domain ? App.escapeHtml(c.domain) : '综合') + '</span></div>' +
            '<div class="cd-row"><span class="cd-label">今日值班</span><span class="cd-value">' + (c.isOnDuty ? '是' : '否') + '</span></div>' +
            '<div style="margin-top:14px"><div class="cd-label" style="margin-bottom:6px">本周排班</div>' + scheduleHtml + '</div>' +
            '<div class="cd-actions">' +
                '<a href="tel:' + c.phone + '" class="btn btn-primary"><i class="fa-solid fa-phone"></i> 拨打</a>' +
                '<button class="btn btn-outline" onclick="toggleFavorite(\'' + c.id + '\');closeContactDetail();"><i class="fa-solid ' + (isFav ? 'fa-star' : 'fa-regular fa-star') + '" style="margin-right:4px"></i>' + (isFav ? '取消收藏' : '收藏') + '</button>' +
            '</div>';
        document.getElementById('contactModal').classList.add('show');
    };

    window.closeContactDetail = function() {
        document.getElementById('contactModal').classList.remove('show');
    };

    function orgLabel(level) {
        var map = { district: '区级管理', industry: '行业管理', duty: '值班人员' };
        return map[level] || level;
    }

    document.getElementById('searchInput').addEventListener('input', App.debounce(renderContacts, 400));

    renderContacts();
})();
</script>
</body>
</html>
