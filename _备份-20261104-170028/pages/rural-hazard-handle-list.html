<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>农村自建房 - 专项隐患整治处置</title>
<link rel="stylesheet" href="./all.min.css">
<link rel="stylesheet" href="./ui-modal.css">
<style>
:root {
    --primary: #1a73e8; --primary-dark: #1557b0; --success: #188038; --warning: #e37400; --danger: #d93025;
    --bg-page: #f1f3f4; --bg-card: #ffffff; --text-main: #202124; --text-sub: #5f6368; --border: #e0e0e0;
}
[data-theme="dark"] {
    --bg-page: #121416; --bg-card: #1e2126; --text-main: #e8eaed; --text-sub: #9aa0a6; --border: #3c4043;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-page); color: var(--text-main); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; font-size: 14px; }
.page-head { background: var(--bg-card); padding: 18px 28px; border-bottom: 1px solid var(--border); }
.page-head h2 { font-size: 19px; display: flex; align-items: center; gap: 10px; }
.page-head h2 .fa-solid { color: var(--primary); }
.page-head .desc { margin-top: 6px; color: var(--text-sub); font-size: 13px; }
.container { padding: 20px 28px; }
.kpi-wrapper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 18px; }
.kpi-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
.kpi-title { color: var(--text-sub); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.kpi-num { font-size: 28px; font-weight: 700; margin-top: 8px; }
.kpi-sub { color: var(--text-sub); font-size: 12px; margin-top: 4px; }
.kpi-card.c-blue .kpi-title .fa-solid, .kpi-card.c-blue .kpi-num { color: var(--primary); }
.kpi-card.c-orange .kpi-title .fa-solid, .kpi-card.c-orange .kpi-num { color: var(--warning); }
.kpi-card.c-green .kpi-title .fa-solid, .kpi-card.c-green .kpi-num { color: var(--success); }
.kpi-card.c-gray .kpi-title .fa-solid, .kpi-card.c-gray .kpi-num { color: var(--text-sub); }
.panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.status-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 16px; flex-wrap: wrap; }
.tab-item { border: none; background: none; padding: 14px 18px; font-size: 14px; color: var(--text-sub); cursor: pointer; border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 6px; }
.tab-item.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.tab-count { background: rgba(26,115,232,0.1); color: var(--primary); border-radius: 10px; padding: 1px 8px; font-size: 12px; }
.tab-item.active .tab-count { background: var(--primary); color: #fff; }
.filter-bar { display: flex; flex-wrap: wrap; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--border); align-items: flex-end; }
.filter-item { display: flex; flex-direction: column; gap: 5px; }
.filter-item label { font-size: 12px; color: var(--text-sub); }
.filter-item select, .filter-item input { height: 34px; border: 1px solid var(--border); border-radius: 6px; padding: 0 10px; font-size: 13px; background: var(--bg-card); color: var(--text-main); min-width: 150px; }
.btn { height: 34px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { background: rgba(26,115,232,0.05); color: var(--text-sub); font-weight: 600; font-size: 13px; padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
.data-table td { padding: 13px 14px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
.data-table tbody tr:hover { background: rgba(26,115,232,0.03); }
.task-name { font-weight: 600; }
.task-no { color: var(--text-sub); font-size: 12px; margin-top: 2px; }
.status-tag { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 12px; white-space: nowrap; }
.status-tag.wait-accept { background: rgba(95,99,104,0.12); color: var(--text-sub); }
.status-tag.doing { background: rgba(26,115,232,0.1); color: var(--primary); }
.status-tag.wait-check { background: rgba(227,116,0,0.1); color: var(--warning); }
.status-tag.done { background: rgba(24,128,56,0.1); color: var(--success); }
.action-link { border: none; background: none; color: var(--primary); cursor: pointer; font-size: 13px; padding: 2px 6px; }
.action-link:hover { text-decoration: underline; }
.action-link.warn { color: var(--warning); font-weight: 600; }
.house-chip { display: inline-block; background: rgba(26,115,232,0.07); border-radius: 4px; padding: 1px 7px; margin: 1px 3px 1px 0; font-size: 12px; }
.method-tag { display: inline-block; padding: 2px 9px; border-radius: 4px; font-size: 12px; background: rgba(24,128,56,0.08); color: var(--success); }
.deadline-over { color: var(--danger); font-weight: 600; }
.pager { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 16px; color: var(--text-sub); font-size: 13px; }
.pager button { min-width: 30px; height: 30px; border: 1px solid var(--border); background: var(--bg-card); border-radius: 6px; cursor: pointer; color: var(--text-main); }
.pager button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.pager button:disabled { opacity: 0.45; cursor: not-allowed; }
.empty-tip { padding: 60px 0; text-align: center; color: var(--text-sub); }
.empty-tip .fa-solid { font-size: 40px; opacity: 0.3; display: block; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="page-head">
    <h2><i class="fa-solid fa-hammer"></i>自建房专项风险隐患处置</h2>
    <div class="desc">责任人（村支书 / 网格员 / 户主）在线接收整治任务并填报处置结果，责任人不便操作时支持村委/镇/街道代报：查看房屋信息与风险部位，选择处置方式，上传施工过程照片，完成后提交验收，进度自动汇总</div>
</div>
<div class="container">
    <div class="kpi-wrapper">
        <div class="kpi-card c-gray">
            <div class="kpi-title"><i class="fa-solid fa-inbox"></i>待接收</div>
            <div class="kpi-num" id="kpi-wait">0</div>
            <div class="kpi-sub">待责任人确认接收</div>
        </div>
        <div class="kpi-card c-blue">
            <div class="kpi-title"><i class="fa-solid fa-hammer"></i>处置中</div>
            <div class="kpi-num" id="kpi-doing">0</div>
            <div class="kpi-sub">整治施工进行中</div>
        </div>
        <div class="kpi-card c-orange">
            <div class="kpi-title"><i class="fa-solid fa-clipboard-check"></i>待验收</div>
            <div class="kpi-num" id="kpi-check">0</div>
            <div class="kpi-sub">已提交待村委/镇/街道验收</div>
        </div>
        <div class="kpi-card c-green">
            <div class="kpi-title"><i class="fa-solid fa-circle-check"></i>已完成</div>
            <div class="kpi-num" id="kpi-done">0</div>
            <div class="kpi-sub">验收通过已归档</div>
        </div>
    </div>
    <div class="panel">
        <div class="status-tabs">
            <button class="tab-item active" data-tab="all">全部 <span class="tab-count" id="tab-all">0</span></button>
            <button class="tab-item" data-tab="待接收">待接收 <span class="tab-count" id="tab-wait">0</span></button>
            <button class="tab-item" data-tab="处置中">处置中 <span class="tab-count" id="tab-doing">0</span></button>
            <button class="tab-item" data-tab="待验收">待验收 <span class="tab-count" id="tab-check">0</span></button>
            <button class="tab-item" data-tab="已完成">已完成 <span class="tab-count" id="tab-done">0</span></button>
        </div>
        <div class="filter-bar">
            <div class="filter-item">
                <label>当前身份（责任人）</label>
                <select id="f-person"><option value="">全部责任人</option></select>
            </div>
            <div class="filter-item">
                <label>镇/街道</label>
                <select id="f-town"><option value="">全部</option></select>
            </div>
            <div class="filter-item">
                <label>关键字</label>
                <input id="f-kw" placeholder="子任务名称/房屋地址">
            </div>
            <button class="btn btn-primary" onclick="applyFilter()"><i class="fa-solid fa-search"></i>查询</button>
            <button class="btn" onclick="resetFilter()"><i class="fa-solid fa-rotate-left"></i>重置</button>
        </div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>子任务名称</th>
                    <th>来源任务</th>
                    <th>覆盖房屋</th>
                    <th>责任人</th>
                    <th>处置方式</th>
                    <th>完成时限</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
        <div id="empty" class="empty-tip" style="display:none;">
            <i class="fa-solid fa-hammer"></i>
            暂无整治子任务（任务包下发后，子任务将推送至责任人）
        </div>
        <div class="pager" id="pager"></div>
    </div>
</div>
<script src="./ui-modal.js"></script>
<script src="../js/house-arch-data.js"></script>
<script src="./rural-audit-seed.js"></script>
<script>
const PAGE_SIZE = 10;
const ST_META = {
    '待接收': { cls: 'wait-accept' },
    '处置中': { cls: 'doing' },
    '待验收': { cls: 'wait-check' },
    '已完成': { cls: 'done' }
};
let rows = [];       // 扁平化子任务行 {task, pkg, sub}
let filtered = [];
let curTab = 'all';
let curPage = 1;

function loadRows() {
    const tasks = JSON.parse(localStorage.getItem('patrolTasks') || '[]');
    const pkgs = JSON.parse(localStorage.getItem('hazardDispatchPackages') || '{}');
    rows = [];
    Object.keys(pkgs).forEach(tid => {
        const t = tasks.find(x => String(x.id) === String(tid));
        if (!t) return;
        (pkgs[tid].subTasks || []).forEach(s => rows.push({ task: t, pkg: pkgs[tid], sub: s }));
    });
}
function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function renderKPI() {
    const c = { '待接收': 0, '处置中': 0, '待验收': 0, '已完成': 0 };
    rows.forEach(r => { if (c[r.sub.status] !== undefined) c[r.sub.status]++; });
    document.getElementById('kpi-wait').textContent = c['待接收'];
    document.getElementById('kpi-doing').textContent = c['处置中'];
    document.getElementById('kpi-check').textContent = c['待验收'];
    document.getElementById('kpi-done').textContent = c['已完成'];
    document.getElementById('tab-all').textContent = rows.length;
    document.getElementById('tab-wait').textContent = c['待接收'];
    document.getElementById('tab-doing').textContent = c['处置中'];
    document.getElementById('tab-check').textContent = c['待验收'];
    document.getElementById('tab-done').textContent = c['已完成'];
}

function applyFilter() {
    const person = document.getElementById('f-person').value;
    const town = document.getElementById('f-town').value;
    const kw = document.getElementById('f-kw').value.trim();
    filtered = rows.filter(r => {
        if (curTab !== 'all' && r.sub.status !== curTab) return false;
        if (person && r.sub.person !== person) return false;
        if (town && r.task.town !== town) return false;
        if (kw && !(r.sub.name || '').includes(kw) && !(r.sub.houseNames || []).some(n => n.includes(kw))) return false;
        return true;
    });
    curPage = 1;
    renderTable();
}
function resetFilter() {
    document.getElementById('f-person').value = '';
    document.getElementById('f-town').value = '';
    document.getElementById('f-kw').value = '';
    applyFilter();
}

function renderTable() {
    const tb = document.getElementById('tbody');
    const start = (curPage - 1) * PAGE_SIZE;
    const list = filtered.slice(start, start + PAGE_SIZE);
    document.getElementById('empty').style.display = filtered.length ? 'none' : 'block';
    const today = todayStr();
    tb.innerHTML = list.map(r => {
        const s = r.sub;
        const over = s.deadline && s.deadline < today && s.status !== '已完成';
        const act = s.status === '待接收'
            ? `<button class="action-link warn" onclick="goDetail(${r.task.id},'${s.id}')">接收任务</button>`
            : s.status === '处置中'
                ? `<button class="action-link warn" onclick="goDetail(${r.task.id},'${s.id}')">处置填报</button>`
                : `<button class="action-link" onclick="goDetail(${r.task.id},'${s.id}')">查看</button>`;
        return `<tr>
            <td><div class="task-name">${esc(s.name)}</div><div class="task-no">${esc(s.id)}</div></td>
            <td><div class="task-name" style="font-weight:400;">${esc(r.task.name)}</div><div class="task-no">${esc(r.pkg.receiverName)}</div></td>
            <td>${(s.houseNames || []).map(n => `<span class="house-chip">${esc(n)}</span>`).join('')}</td>
            <td>${esc(s.person)}<div class="task-no">${esc(s.role)}${s.handleReport && s.handleReport.reporter && s.handleReport.reporter.type === 'proxy' ? ' · <span style="color:var(--warning,#e37400);">村委/镇/街道代报</span>' : ''}</div></td>
            <td><span class="method-tag">${esc(s.handleReport && s.handleReport.method ? s.handleReport.method : s.method)}</span></td>
            <td class="${over ? 'deadline-over' : ''}">${esc(s.deadline || '-')}${over ? '（已超期）' : ''}</td>
            <td><span class="status-tag ${ST_META[s.status] ? ST_META[s.status].cls : ''}">${esc(s.status)}</span></td>
            <td>${act}</td>
        </tr>`;
    }).join('');
    renderPager();
}
function renderPager() {
    const total = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    let html = `共 ${filtered.length} 条，每页 ${PAGE_SIZE} 条`;
    html += `<button ${curPage <= 1 ? 'disabled' : ''} onclick="goPage(${curPage - 1})"><i class="fa-solid fa-chevron-left"></i></button>`;
    for (let i = 1; i <= total; i++) html += `<button class="${i === curPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
    html += `<button ${curPage >= total ? 'disabled' : ''} onclick="goPage(${curPage + 1})"><i class="fa-solid fa-chevron-right"></i></button>`;
    document.getElementById('pager').innerHTML = html;
}
function goPage(p) { curPage = p; renderTable(); }
function goDetail(tid, sid) { window.location.href = `rural-hazard-handle-detail.html?id=${tid}&sub=${encodeURIComponent(sid)}`; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

document.querySelectorAll('.tab-item').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.tab-item').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    curTab = b.dataset.tab;
    applyFilter();
}));

function init() {
    initHouseArchSeed();
    ensureAuditSeedTasks();
    loadRows();
    const persons = [...new Set(rows.map(r => r.sub.person).filter(Boolean))];
    document.getElementById('f-person').innerHTML = '<option value="">全部责任人</option>' + persons.map(p => `<option>${esc(p)}</option>`).join('');
    const towns = [...new Set(rows.map(r => r.task.town).filter(Boolean))];
    document.getElementById('f-town').innerHTML = '<option value="">全部</option>' + towns.map(t => `<option>${esc(t)}</option>`).join('');
    renderKPI();
    applyFilter();
}
init();
</script>
</body>
</html>
