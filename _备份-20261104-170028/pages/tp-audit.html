<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>申报审核中心 - 第三方服务机构</title>
<link rel="stylesheet" href="./all.min.css">
<link rel="stylesheet" href="./tp-common.css">
<script src="../js/third-party-data.js"></script>
<script src="../js/tp-friendly-tip.js"></script>
<style>
:root {
    --primary: #1a73e8;
    --primary-dark: #1557b0;
    --primary-light: #e8f0fe;
    --secondary: #0097a7;
    --danger: #d93025;
    --warning: #e37400;
    --success: #1e8e3e;
    --bg-dark: #f0f2f5;
    --bg-card: #ffffff;
    --bg-hover: #e8eaed;
    --text-primary: #202124;
    --text-secondary: #5f6368;
    --border: #dadce0;
    --shadow: rgba(0,0,0,0.08);
    --input-bg: #ffffff;
    --input-border: #dadce0;
    --header-bg: rgba(0,0,0,0.02);
}
:root[data-theme="dark"] {
    --primary: #1e6fdb;
    --primary-dark: #1557b0;
    --primary-light: #e8f1fd;
    --secondary: #00b4d8;
    --danger: #ef4444;
    --warning: #f59e0b;
    --success: #10b981;
    --bg-dark: #0a1628;
    --bg-card: #112240;
    --bg-hover: #1a2f4a;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --border: #1e3a5f;
    --shadow: rgba(0,0,0,0.3);
    --input-bg: rgba(255,255,255,0.05);
    --input-border: #1e3a5f;
    --header-bg: rgba(0,0,0,0.2);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: var(--bg-dark); color: var(--text-primary); margin: 0; padding: 20px; }

/* 统计卡片 */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all 0.3s;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--shadow); }
.stat-icon {
    width: 48px; height: 48px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #fff;
    flex-shrink: 0;
}
.stat-icon.blue { background: var(--primary); }
.stat-icon.green { background: var(--success); }
.stat-icon.purple { background: #7c4dff; }
.stat-icon.orange { background: var(--warning); }
.stat-info { display: flex; flex-direction: column; }
.stat-value { font-size: 22px; font-weight: 700; color: var(--text-primary); }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* 表单卡片 */
.form-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;
}
.form-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--header-bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.form-title { font-size: 15px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }

/* Tab 标签 */
.tab-bar { display: flex; gap: 24px; padding: 0 20px; border-bottom: 1px solid var(--border); }
.tab-item {
    padding: 12px 4px;
    font-size: 14px;
    color: var(--text-secondary);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
}
.tab-item:hover { color: var(--primary); }
.tab-item.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.tab-badge {
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
}
.tab-badge.red { background: rgba(217,48,37,0.12); color: var(--danger); }
.tab-badge.orange { background: rgba(227,116,0,0.12); color: var(--warning); }

/* 表格 */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th, .data-table td { padding: 12px 20px; text-align: left; font-size: 13px; }
.data-table th { color: var(--text-secondary); font-weight: 500; border-bottom: 1px solid var(--border); }
.data-table td { color: var(--text-primary); border-bottom: 1px solid var(--border); }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--bg-hover); }

/* 标签 */
.tag {
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    display: inline-block;
}
.tag-blue { background: var(--primary-light); color: var(--primary); }
.tag-green { background: rgba(30,142,62,0.12); color: var(--success); }
.tag-grey { background: var(--bg-hover); color: var(--text-secondary); }

/* 按钮 */
.btn {
    padding: 5px 14px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    font-family: inherit;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
}
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }

/* 筛选栏 */
.filter-bar { display: flex; align-items: center; gap: 10px; padding: 16px 20px; }
.filter-bar select, .filter-bar input {
    padding: 7px 12px;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--text-primary);
    font-size: 13px;
    outline: none;
    font-family: inherit;
}
.filter-bar input { width: 160px; }
.filter-bar input::placeholder { color: var(--text-secondary); }

/* 链接 */
.link { color: var(--primary); text-decoration: none; font-size: 13px; }
.link:hover { text-decoration: underline; }

/* Tab 面板 */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* 进度条 */
.progress-track { display: flex; align-items: center; justify-content: space-between; position: relative; margin: 30px 0 20px; }
.progress-line { position: absolute; top: 14px; left: 10%; right: 10%; height: 2px; background: var(--border); z-index: 1; }
.progress-line-fill { height: 100%; background: var(--primary); transition: width 0.4s; }
.progress-step { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
.progress-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-hover); display: flex; align-items: center; justify-content: center; font-size: 12px; }
.progress-step.done { color: var(--primary); font-weight: 600; }
.progress-step.done .progress-dot { background: var(--primary); color: #fff; }
.progress-step.current { color: var(--primary); font-weight: 600; }
.progress-step.current .progress-dot { background: var(--primary-light); color: var(--primary); border: 2px solid var(--primary); }

/* 时间轴 */
.timeline { position: relative; padding-left: 24px; margin-top: 16px; }
.timeline::before { content: ''; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.timeline-item { position: relative; margin-bottom: 16px; }
.timeline-item:last-child { margin-bottom: 0; }
.timeline-dot { position: absolute; left: -20px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); border: 2px solid var(--bg-card); box-shadow: 0 0 0 2px var(--border); }
.timeline-time { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.timeline-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
.timeline-opinion { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
.timeline-empty { text-align: center; color: var(--text-secondary); padding: 40px 0; font-size: 13px; }

/* 查询结果信息格 */
.info-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 16px; }
.info-item { background: var(--bg-dark); border-radius: 8px; padding: 12px 16px; }
.info-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.info-value { font-size: 14px; font-weight: 600; color: var(--text-primary); }

/* 弹窗 */
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; z-index: 100; }
.modal-mask.open { display: flex; }
.modal-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; width: 640px; max-width: 94vw; max-height: 86vh; display: flex; flex-direction: column; overflow: hidden; }
.modal-head { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.modal-close { border: none; background: transparent; color: var(--text-secondary); font-size: 16px; cursor: pointer; }
.modal-close:hover { color: var(--danger); }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
.detail-section-title { font-size: 13px; font-weight: 600; color: var(--primary); margin: 14px 0 10px; display: flex; align-items: center; gap: 6px; }
.detail-section-title:first-child { margin-top: 0; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
.detail-item { font-size: 13px; line-height: 1.6; }
.detail-item .d-label { color: var(--text-secondary); margin-right: 6px; }
.detail-item.full { grid-column: 1 / -1; }
.attach-item { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 8px 12px; background: var(--bg-dark); border-radius: 8px; margin-bottom: 8px; }
.attach-item i { color: var(--primary); }
.opinion-input { width: 100%; min-height: 90px; padding: 10px 12px; border: 1px solid var(--input-border); border-radius: 8px; background: var(--input-bg); color: var(--text-primary); font-size: 13px; outline: none; resize: vertical; font-family: inherit; }
.preset-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
.preset-chip { padding: 4px 12px; border: 1px solid var(--border); border-radius: 14px; font-size: 12px; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; }
.preset-chip:hover { border-color: var(--primary); color: var(--primary); }
.audit-target { background: var(--bg-dark); border-radius: 8px; padding: 12px 16px; font-size: 13px; line-height: 1.8; margin-bottom: 14px; }

/* 响应式 */
@media (max-width: 768px) {
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    .tab-bar { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- 统计卡片 -->
<div class="stat-row">
    <div class="stat-card">
        <div class="stat-icon blue"><i class="fas fa-building"></i></div>
        <div class="stat-info">
            <div class="stat-value" id="statOrgPending">0</div>
            <div class="stat-label">机构待审</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon purple"><i class="fas fa-user-tie"></i></div>
        <div class="stat-info">
            <div class="stat-value" id="statExpertPending">0</div>
            <div class="stat-label">专家待审</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
        <div class="stat-info">
            <div class="stat-value" id="statApproved">0</div>
            <div class="stat-label">累计已通过</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon orange"><i class="fas fa-clock"></i></div>
        <div class="stat-info">
            <div class="stat-value" id="statMonthAudited">0</div>
            <div class="stat-label">本月已审核</div>
        </div>
    </div>
</div>

<!-- 审核列表 -->
<div class="list-card" id="auditWorkspace">
    <div class="list-header">
        <div class="list-title"><i class="fas fa-list-check"></i> 申报审核</div>
    </div>
    <div class="list-body">
        <div class="tab-bar">
            <div class="tab-item active" data-tab="org" onclick="switchTab('org')">机构资质审核 <span class="tab-badge red" id="badgeOrg">0</span></div>
            <div class="tab-item" data-tab="expert" onclick="switchTab('expert')">专家资质审核 <span class="tab-badge orange" id="badgeExpert">0</span></div>
            <div class="tab-item" data-tab="progress" onclick="switchTab('progress')">审核进度查询 <i class="fas fa-search" style="font-size:12px;"></i></div>
        </div>

        <!-- 机构资质审核 -->
        <div class="tab-panel active" id="panelOrg">
            <div class="filter-card" style="margin-top: 20px;">
                <div class="filter-row">
                    <div class="filter-item">
                        <label>状态：</label>
                        <select id="orgStatusFilter" onchange="orgPage=1;renderOrgList()">
                            <option value="">全部状态</option>
                            <option>待审核</option>
                            <option>审核中</option>
                            <option>核验中</option>
                            <option>已通过</option>
                            <option>已驳回</option>
                        </select>
                    </div>
                    <div class="filter-item" style="flex:1; min-width:200px; max-width:300px;">
                        <input type="text" id="orgKeyword" placeholder="请输入机构名称 / 统一代码" onkeydown="if(event.key==='Enter'){orgPage=1;renderOrgList();}">
                    </div>
                    <div class="filter-actions">
                        <button class="list-btn list-btn-primary" onclick="orgPage=1;renderOrgList()"><i class="fas fa-search"></i> 查询</button>
                        <button class="list-btn list-btn-outline" onclick="resetOrgFilter()"><i class="fas fa-undo"></i> 重置</button>
                    </div>
                </div>
            </div>

            <table class="list-table">
                <thead>
                    <tr>
                        <th>申请编号</th>
                        <th>机构名称</th>
                        <th>统一代码</th>
                        <th>提交时间</th>
                        <th>状态</th>
                        <th style="text-align:center; width:140px;">操作</th>
                    </tr>
                </thead>
                <tbody id="orgAuditBody">
                    <tr><td colspan="6" style="text-align:center;color:var(--text-secondary);padding:24px;">加载中...</td></tr>
                </tbody>
            </table>
            <div class="list-pagination" id="orgPager"></div>
        </div>

        <!-- 专家资质审核 -->
        <div class="tab-panel" id="panelExpert">
            <div class="filter-card" style="margin-top: 20px;">
                <div class="filter-row">
                    <div class="filter-item">
                        <label>状态：</label>
                        <select id="expertStatusFilter" onchange="expPage=1;renderExpertList()">
                            <option value="">全部状态</option>
                            <option>待审核</option>
                            <option>审核中</option>
                            <option>已通过</option>
                            <option>已驳回</option>
                        </select>
                    </div>
                    <div class="filter-item" style="flex:1; min-width:200px; max-width:300px;">
                        <input type="text" id="expertKeyword" placeholder="请输入专家姓名 / 身份证号" onkeydown="if(event.key==='Enter'){expPage=1;renderExpertList();}">
                    </div>
                    <div class="filter-actions">
                        <button class="list-btn list-btn-primary" onclick="expPage=1;renderExpertList()"><i class="fas fa-search"></i> 查询</button>
                        <button class="list-btn list-btn-outline" onclick="resetExpertFilter()"><i class="fas fa-undo"></i> 重置</button>
                    </div>
                </div>
            </div>

            <table class="list-table">
                <thead>
                    <tr>
                        <th>申请编号</th>
                        <th>姓名</th>
                        <th>职称</th>
                        <th>专业领域</th>
                        <th>身份证号</th>
                        <th>提交时间</th>
                        <th>状态</th>
                        <th style="text-align:center; width:140px;">操作</th>
                    </tr>
                </thead>
                <tbody id="expertAuditBody">
                    <tr><td colspan="8" style="text-align:center;color:var(--text-secondary);padding:24px;">加载中...</td></tr>
                </tbody>
            </table>
            <div class="list-pagination" id="expertPager"></div>
        </div>

        <!-- 审核进度查询 -->
        <div class="tab-panel" id="panelProgress">
            <div class="filter-card" style="margin-top: 20px;">
                <div class="filter-row">
                    <div class="filter-item">
                        <label>申报类型：</label>
                        <select id="queryType" onchange="onQueryTypeChange()">
                            <option value="org">机构申报</option>
                            <option value="expert">专家申报</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label id="queryLabel1">机构名称：</label>
                        <input type="text" id="queryValue1" placeholder="请输入机构名称">
                    </div>
                    <div class="filter-item">
                        <label id="queryLabel2">统一社会信用代码：</label>
                        <input type="text" id="queryValue2" placeholder="请输入统一社会信用代码">
                    </div>
                    <div class="filter-actions">
                        <button class="list-btn list-btn-primary" onclick="queryProgress()"><i class="fas fa-search"></i> 查询</button>
                        <button class="list-btn list-btn-outline" onclick="resetQuery()"><i class="fas fa-undo"></i> 重置</button>
                    </div>
                </div>
            </div>

            <div id="progressResultCard" style="display:none; padding: 0 20px 20px;">
                <div style="display:flex; align-items:center; justify-content:space-between; margin-top:16px;">
                    <div class="form-title" style="font-size:14px;"><i class="fas fa-clipboard-check" style="color: var(--primary);"></i> 查询结果</div>
                    <span id="progressStatus"></span>
                </div>
                <div class="info-grid" id="progressInfoGrid"></div>
                <div id="progressTrackWrapper"></div>
                <div style="margin-top:8px;">
                    <div class="form-title" style="font-size:14px; margin-bottom:4px;"><i class="fas fa-history" style="color: var(--primary);"></i> 审核记录</div>
                    <div id="timelineContainer"></div>
                </div>
                <div id="progressActions" style="margin-top:14px;"></div>
                <div id="changeRequestSection" style="margin-top:14px;"></div>
            </div>

            <div id="progressEmptyCard" style="display:none; padding: 0 20px 20px;">
                <div class="timeline-empty"><i class="fas fa-inbox" style="font-size:24px; display:block; margin-bottom:8px;"></i>未查询到相关申请记录</div>
            </div>
        </div>
    </div>
</div>

<!-- 审核记录与附件归档（仅监管端） -->
<div class="list-card" id="auditArchive">
    <div class="list-header">
        <div class="list-title"><i class="fas fa-folder-open"></i> 审核记录与附件归档</div>
    </div>
    <div class="list-body">
        <div class="filter-card">
            <div class="filter-row">
                <div class="filter-item">
                    <label>类型：</label>
                    <select id="recordTypeFilter" onchange="renderAuditRecords()">
                        <option value="">全部类型</option>
                        <option>机构</option>
                        <option>专家</option>
                    </select>
                </div>
                <div class="filter-item">
                    <label>结果：</label>
                    <select id="recordResultFilter" onchange="renderAuditRecords()">
                        <option value="">全部</option>
                        <option>通过</option>
                        <option>驳回</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="list-btn list-btn-outline" onclick="renderAuditRecords()"><i class="fas fa-sync-alt"></i> 刷新</button>
                </div>
            </div>
        </div>

        <table class="list-table">
            <thead>
                <tr>
                    <th>时间</th>
                    <th>类型</th>
                    <th>名称</th>
                    <th>审核结果</th>
                    <th>审核意见</th>
                    <th>操作人</th>
                    <th style="text-align:center;">材料</th>
                </tr>
            </thead>
            <tbody id="auditRecordBody">
                <tr><td colspan="7" style="text-align:center;color:var(--text-secondary);padding:24px;">加载中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 申报详情弹窗 -->
<div class="modal-mask" id="detailModal">
    <div class="modal-box">
        <div class="modal-head">
            <div class="modal-title"><i class="fas fa-file-alt" style="color:var(--primary);"></i> 申报详情</div>
            <button class="modal-close" onclick="closeDetailModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body" id="detailBody"></div>
        <div class="modal-foot">
            <button class="list-btn list-btn-outline" onclick="closeDetailModal()">关 闭</button>
        </div>
    </div>
</div>

<!-- 审核操作弹窗 -->
<div class="modal-mask" id="auditModal">
    <div class="modal-box" style="width:520px;">
        <div class="modal-head">
            <div class="modal-title"><i class="fas fa-user-check" style="color:var(--primary);"></i> 资质审核</div>
            <button class="modal-close" onclick="closeAuditModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="audit-target" id="auditTargetInfo"></div>
            <div style="font-size:13px; color:var(--text-secondary); margin-bottom:6px;">常用意见：</div>
            <div class="preset-row" id="presetRow"></div>
            <textarea class="opinion-input" id="auditOpinion" placeholder="请输入审核意见（驳回时必填）"></textarea>
        </div>
        <div class="modal-foot">
            <button class="list-btn list-btn-outline" onclick="closeAuditModal()">取 消</button>
            <button class="list-btn" style="background:var(--danger);color:#fff;" onclick="doAudit('reject')"><i class="fas fa-ban"></i> 驳 回</button>
            <button class="list-btn list-btn-success" onclick="doAudit('pass')"><i class="fas fa-check"></i> 通 过</button>
        </div>
    </div>
</div>

<script>
(function(){
    var s = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', s);
})();
window.addEventListener('message', function(e) {
    if (e.data && e.data.action === 'setTheme') {
        document.documentElement.setAttribute('data-theme', e.data.theme);
        localStorage.setItem('theme', e.data.theme);
    }
});

var PAGE_SIZE = 10;
var orgPage = 1, expPage = 1;
var pendingAudit = null; // { type: 'org'|'expert', applicationId }
var isPortalView = new URLSearchParams(location.search).get('portal') === '1';

function isPendingStatus(s) { return s === '待审核' || s === '审核中' || s === '核验中'; }

function getOrgApps() { return typeof getAllOrgApplications === 'function' ? getAllOrgApplications() : []; }
function getExpertApps() { return typeof getAllExpertApplications === 'function' ? getAllExpertApplications() : []; }

function statusTag(status) {
    if (status === '已通过') return '<span class="status-tag success">已通过</span>';
    if (status === '已驳回') return '<span class="status-tag danger">已驳回</span>';
    if (status === '核验中') return '<span class="status-tag warning">核验中</span>';
    if (status === '审核中') return '<span class="status-tag warning">审核中</span>';
    return '<span class="status-tag primary">待审核</span>';
}

function esc(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ---------- 统计与角标 ---------- */
function getOrgChangeReqs() { return typeof getAllOrgChangeRequests === 'function' ? getAllOrgChangeRequests() : []; }

function renderStats() {
    var orgApps = getOrgApps();
    var expApps = getExpertApps();
    var changeReqs = getOrgChangeReqs();
    var orgPending = orgApps.filter(function(a) { return isPendingStatus(a.status); }).length +
                     changeReqs.filter(function(a) { return isPendingStatus(a.status); }).length;
    var expPending = expApps.filter(function(a) { return isPendingStatus(a.status); }).length;
    var approved = orgApps.concat(expApps).concat(changeReqs).filter(function(a) { return a.status === '已通过'; }).length;
    var now = new Date();
    var ym = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    var monthAudited = 0;
    orgApps.concat(expApps).concat(changeReqs).forEach(function(a) {
        (a.auditHistory || []).forEach(function(h) {
            if ((h.time || '').indexOf(ym) === 0) monthAudited++;
        });
    });
    document.getElementById('statOrgPending').textContent = orgPending;
    document.getElementById('statExpertPending').textContent = expPending;
    document.getElementById('statApproved').textContent = approved;
    document.getElementById('statMonthAudited').textContent = monthAudited;
    document.getElementById('badgeOrg').textContent = orgPending;
    document.getElementById('badgeExpert').textContent = expPending;
    document.getElementById('badgeOrg').style.display = orgPending ? '' : 'none';
    document.getElementById('badgeExpert').style.display = expPending ? '' : 'none';
}

/* ---------- Tab 切换 ---------- */
function switchTab(tab) {
    if (isPortalView) tab = 'progress';
    document.querySelectorAll('.tab-bar .tab-item').forEach(function(el) {
        el.classList.toggle('active', el.getAttribute('data-tab') === tab);
    });
    document.getElementById('panelOrg').classList.toggle('active', tab === 'org');
    document.getElementById('panelExpert').classList.toggle('active', tab === 'expert');
    document.getElementById('panelProgress').classList.toggle('active', tab === 'progress');
}

/* ---------- 分页 ---------- */
function renderPager(elId, total, current, onGo) {
    var el = document.getElementById(elId);
    if (!el) return;
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (total <= PAGE_SIZE) { el.innerHTML = ''; return; }
    var html = '<button class="page-btn" ' + (current <= 1 ? 'disabled' : '') + ' onclick="' + onGo + '(' + (current - 1) + ')">上一页</button>';
    for (var i = 1; i <= pages; i++) {
        html += '<button class="page-btn' + (i === current ? ' active' : '') + '" onclick="' + onGo + '(' + i + ')">' + i + '</button>';
    }
    html += '<button class="page-btn" ' + (current >= pages ? 'disabled' : '') + ' onclick="' + onGo + '(' + (current + 1) + ')">下一页</button>';
    el.innerHTML = html;
}
function goOrgPage(p) { orgPage = p; renderOrgList(); }
function goExpPage(p) { expPage = p; renderExpertList(); }

/* ---------- 机构资质审核列表 ---------- */
function renderOrgList() {
    var tbody = document.getElementById('orgAuditBody');
    var status = document.getElementById('orgStatusFilter').value;
    var keyword = document.getElementById('orgKeyword').value.trim().toLowerCase();
    var apps = getOrgApps().slice().map(function(a) { a._reqType = 'apply'; return a; });
    getOrgChangeReqs().forEach(function(c) { c._reqType = 'change'; apps.push(c); });
    apps.sort(function(a, b) { return (b.submitTime || '').localeCompare(a.submitTime || ''); });
    if (status) apps = apps.filter(function(a) { return a.status === status; });
    if (keyword) {
        apps = apps.filter(function(a) {
            if (a._reqType === 'change') {
                return (a.orgName || '').toLowerCase().indexOf(keyword) !== -1 ||
                       (a.creditCode || '').toLowerCase().indexOf(keyword) !== -1;
            }
            var b = a.basic || {};
            return (b.enterpriseName || '').toLowerCase().indexOf(keyword) !== -1 ||
                   (b.creditCode || '').toLowerCase().indexOf(keyword) !== -1;
        });
    }
    if (!apps.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-secondary);padding:24px;">暂无申报记录</td></tr>';
        renderPager('orgPager', 0, 1, 'goOrgPage');
        return;
    }
    var start = (orgPage - 1) * PAGE_SIZE;
    var pageRows = apps.slice(start, start + PAGE_SIZE);
    tbody.innerHTML = pageRows.map(function(a) {
        if (a._reqType === 'change') {
            var cops = '<a href="#" class="table-link" onclick="openDetail(\'change\',\'' + a.changeId + '\');return false;">查看</a>';
            if (isPendingStatus(a.status)) {
                cops += '<a href="#" class="table-link" onclick="openAudit(\'change\',\'' + a.changeId + '\');return false;">审核</a>';
            }
            return '<tr>' +
                '<td>' + esc(a.changeId) + '</td>' +
                '<td>' + esc(a.orgName || '-') + ' <span class="status-tag warning" style="font-size:11px;">变更</span></td>' +
                '<td>' + esc(a.creditCode || '-') + '</td>' +
                '<td>' + esc(a.submitTime || '-') + '</td>' +
                '<td>' + statusTag(a.status) + '</td>' +
                '<td style="text-align:center;">' + cops + '</td>' +
            '</tr>';
        }
        var b = a.basic || {};
        var ops = '<a href="#" class="table-link" onclick="openDetail(\'org\',\'' + a.applicationId + '\');return false;">查看</a>';
        if (isPendingStatus(a.status)) {
            ops += '<a href="#" class="table-link" onclick="openAudit(\'org\',\'' + a.applicationId + '\');return false;">审核</a>';
        }
        return '<tr>' +
            '<td>' + esc(a.applicationId) + '</td>' +
            '<td>' + esc(b.enterpriseName || '-') + '</td>' +
            '<td>' + esc(b.creditCode || '-') + '</td>' +
            '<td>' + esc(a.submitTime || '-') + '</td>' +
            '<td>' + statusTag(a.status) + '</td>' +
            '<td style="text-align:center;">' + ops + '</td>' +
        '</tr>';
    }).join('');
    renderPager('orgPager', apps.length, orgPage, 'goOrgPage');
}
function resetOrgFilter() {
    document.getElementById('orgStatusFilter').value = '';
    document.getElementById('orgKeyword').value = '';
    orgPage = 1;
    renderOrgList();
}

/* ---------- 专家资质审核列表 ---------- */
function renderExpertList() {
    var tbody = document.getElementById('expertAuditBody');
    var status = document.getElementById('expertStatusFilter').value;
    var keyword = document.getElementById('expertKeyword').value.trim().toLowerCase();
    var apps = getExpertApps().slice().sort(function(a, b) { return (b.submitTime || '').localeCompare(a.submitTime || ''); });
    if (status) apps = apps.filter(function(a) { return a.status === status; });
    if (keyword) {
        apps = apps.filter(function(a) {
            var b = a.basic || {};
            return (b.name || '').toLowerCase().indexOf(keyword) !== -1 ||
                   (b.idCard || '').toLowerCase().indexOf(keyword) !== -1;
        });
    }
    if (!apps.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-secondary);padding:24px;">暂无申报记录</td></tr>';
        renderPager('expertPager', 0, 1, 'goExpPage');
        return;
    }
    var start = (expPage - 1) * PAGE_SIZE;
    var pageRows = apps.slice(start, start + PAGE_SIZE);
    tbody.innerHTML = pageRows.map(function(a) {
        var b = a.basic || {};
        var ops = '<a href="#" class="table-link" onclick="openDetail(\'expert\',\'' + a.applicationId + '\');return false;">查看</a>';
        if (isPendingStatus(a.status)) {
            ops += '<a href="#" class="table-link" onclick="openAudit(\'expert\',\'' + a.applicationId + '\');return false;">审核</a>';
        }
        return '<tr>' +
            '<td>' + esc(a.applicationId) + '</td>' +
            '<td>' + esc(b.name || '-') + '</td>' +
            '<td>' + esc(b.title || '-') + '</td>' +
            '<td>' + esc(b.domain || '-') + '</td>' +
            '<td>' + esc(b.idCard || '-') + '</td>' +
            '<td>' + esc(a.submitTime || '-') + '</td>' +
            '<td>' + statusTag(a.status) + '</td>' +
            '<td style="text-align:center;">' + ops + '</td>' +
        '</tr>';
    }).join('');
    renderPager('expertPager', apps.length, expPage, 'goExpPage');
}
function resetExpertFilter() {
    document.getElementById('expertStatusFilter').value = '';
    document.getElementById('expertKeyword').value = '';
    expPage = 1;
    renderExpertList();
}

/* ---------- 申报详情弹窗 ---------- */
function detailItem(label, value, full) {
    return '<div class="detail-item' + (full ? ' full' : '') + '"><span class="d-label">' + label + '</span>' + esc(value || '-') + '</div>';
}
function openDetail(type, applicationId) {
    if (type === 'change') { openChangeDetail(applicationId); return; }
    var app = type === 'org'
        ? (typeof getOrgApplicationById === 'function' ? getOrgApplicationById(applicationId) : null)
        : (typeof getExpertApplicationById === 'function' ? getExpertApplicationById(applicationId) : null);
    if (!app) { alert('未找到申报记录'); return; }
    var b = app.basic || {};
    var html = '';
    if (type === 'org') {
        html += '<div class="detail-section-title"><i class="fas fa-building"></i> 企业信息</div><div class="detail-grid">' +
            detailItem('申请编号', app.applicationId) +
            detailItem('当前状态', app.status) +
            detailItem('企业名称', b.enterpriseName) +
            detailItem('统一社会信用代码', b.creditCode) +
            detailItem('注册地址', b.address, true) +
            detailItem('成立时间', b.establishDate) +
            detailItem('注册资本', b.capital ? b.capital + ' 万元' : '') +
            detailItem('专业领域', b.field) +
            detailItem('服务区域', b.serviceArea) +
            detailItem('资质等级', b.qual) +
            detailItem('机构类型', b.orgType) +
            detailItem('经营范围', b.businessScope, true) +
        '</div>';
        html += '<div class="detail-section-title"><i class="fas fa-user-tie"></i> 法人信息</div><div class="detail-grid">' +
            detailItem('法人姓名', b.legalName) +
            detailItem('联系电话', b.legalPhone) +
            detailItem('身份证号', b.legalIdCard) +
            detailItem('电子邮箱', b.legalEmail) +
        '</div>';
        if ((app.qualifications || []).length) {
            html += '<div class="detail-section-title"><i class="fas fa-certificate"></i> 资质证书</div>';
            app.qualifications.forEach(function(q) {
                html += '<div class="attach-item"><i class="fas fa-certificate"></i> ' + esc(q.name || '-') + '（' + esc(q.code || '-') + '，' + esc(q.issuer || '-') + '，有效期 ' + esc(q.start || '?') + ' ~ ' + esc(q.end || '?') + '）</div>';
            });
        }
        if ((app.personnel || []).length) {
            html += '<div class="detail-section-title"><i class="fas fa-users"></i> 技术人员</div>';
            app.personnel.forEach(function(p) {
                html += '<div class="attach-item"><i class="fas fa-user"></i> ' + esc(p.name || '-') + '（' + esc(p.title || '-') + '，证书编号 ' + esc(p.certNo || '-') + '）</div>';
            });
        }
        if ((app.equipment || []).length) {
            html += '<div class="detail-section-title"><i class="fas fa-tools"></i> 设备信息</div>';
            app.equipment.forEach(function(eq) {
                html += '<div class="attach-item"><i class="fas fa-toolbox"></i> ' + esc(eq.name || '-') + '（' + esc(eq.model || '-') + ' × ' + esc(eq.quantity || '1') + '）</div>';
            });
        }
        if ((app.relatedExperts || []).length) {
            html += '<div class="detail-section-title"><i class="fas fa-user-graduate"></i> 关联专家</div>';
            app.relatedExperts.forEach(function(ex) {
                html += '<div class="attach-item"><i class="fas fa-user-tie"></i> ' + esc(ex.name || '-') + '（' + esc(ex.title || '-') + '，' + esc(ex.domain || '-') + '，' + esc(ex.phone || '-') + '）</div>';
            });
        }
    } else {
        html += '<div class="detail-section-title"><i class="fas fa-user"></i> 基本信息</div><div class="detail-grid">' +
            detailItem('申请编号', app.applicationId) +
            detailItem('当前状态', app.status) +
            detailItem('姓名', b.name) +
            detailItem('性别', b.gender) +
            detailItem('出生日期', b.birth) +
            detailItem('身份证号', b.idCard) +
            detailItem('联系电话', b.phone) +
            detailItem('电子邮箱', b.email) +
            detailItem('所在地区', b.address) +
            detailItem('工作单位', b.workplace) +
            detailItem('可服务时间', b.serviceTime, true) +
        '</div>';
        html += '<div class="detail-section-title"><i class="fas fa-certificate"></i> 职称信息</div><div class="detail-grid">' +
            detailItem('职称', b.title) +
            detailItem('职称证书编号', b.titleCertNo) +
            detailItem('发证机构', b.titleOrg) +
            detailItem('取得时间', b.titleTime) +
            detailItem('从业年限', b.years ? b.years + ' 年' : '') +
        '</div>';
        html += '<div class="detail-section-title"><i class="fas fa-layer-group"></i> 专业信息</div><div class="detail-grid">' +
            detailItem('专业领域', b.domain) +
            detailItem('研究方向', b.direction) +
            detailItem('行业专家组', b.industryExpertGroup) +
            detailItem('个人简介/主要业绩', b.intro, true) +
        '</div>';
        var at = app.attachments || {};
        var attachRows = [];
        if (at.titleCert && at.titleCert.name) attachRows.push(['职称证书', at.titleCert.name]);
        if (at.achievement && at.achievement.name) attachRows.push(['业绩证明', at.achievement.name]);
        if (at.other && at.other.name) attachRows.push(['其他材料', at.other.name]);
        if (attachRows.length) {
            html += '<div class="detail-section-title"><i class="fas fa-paperclip"></i> 附件材料</div>';
            attachRows.forEach(function(r) {
                html += '<div class="attach-item"><i class="fas fa-paperclip"></i> <strong style="margin-right:6px;">' + esc(r[0]) + '</strong>' + esc(r[1]) + '</div>';
            });
        }
    }
    html += '<div class="detail-section-title"><i class="fas fa-history"></i> 审核记录</div>';
    var history = app.auditHistory || [];
    if (!history.length) {
        html += '<div style="font-size:13px;color:var(--text-secondary);">暂无审核记录</div>';
    } else {
        history.forEach(function(h) {
            var txt = h.decision === 'pass' ? '通过' : '驳回';
            var color = h.decision === 'pass' ? 'var(--success)' : 'var(--danger)';
            html += '<div class="attach-item"><i class="fas fa-circle" style="color:' + color + ';font-size:8px;"></i> ' +
                esc(h.time || '-') + '　<span style="color:' + color + ';font-weight:600;">' + txt + '</span>（第' + esc(h.level || 1) + '级）　' +
                esc(h.opinion || '无意见') + ' — ' + esc(h.operator || '-') + '</div>';
        });
    }
    document.getElementById('detailBody').innerHTML = html;
    document.getElementById('detailModal').classList.add('open');
}
function closeDetailModal() { document.getElementById('detailModal').classList.remove('open'); }

/* ---------- 变更申请详情 ---------- */
function openChangeDetail(changeId) {
    var req = typeof getOrgChangeRequestById === 'function' ? getOrgChangeRequestById(changeId) : null;
    if (!req) { alert('未找到变更申请记录'); return; }
    var html = '<div class="detail-section-title"><i class="fas fa-exchange-alt"></i> 变更申请信息</div><div class="detail-grid">' +
        detailItem('变更单号', req.changeId) +
        detailItem('当前状态', req.status) +
        detailItem('机构名称', req.orgName) +
        detailItem('统一社会信用代码', req.creditCode) +
        detailItem('提交时间', req.submitTime) +
        detailItem('审核时间', req.auditTime) +
        detailItem('变更原因', req.reason, true) +
    '</div>';
    html += '<div class="detail-section-title"><i class="fas fa-list"></i> 变更内容（共 ' + (req.changes || []).length + ' 项）</div>';
    html += '<table class="list-table" style="margin-bottom:12px;"><thead><tr><th>变更字段</th><th>变更前</th><th>变更后</th></tr></thead><tbody>' +
        (req.changes || []).map(function(c) {
            return '<tr><td>' + esc(c.label) + '</td><td>' + esc(c.oldValue || '（空）') + '</td><td style="color:var(--primary);font-weight:600;">' + esc(c.newValue) + '</td></tr>';
        }).join('') + '</tbody></table>';
    html += '<div class="detail-section-title"><i class="fas fa-history"></i> 审核记录</div>';
    var history = (req.auditHistory || []).filter(function(h) { return h.decision !== 'submit'; });
    if (!history.length) {
        html += '<div style="font-size:13px;color:var(--text-secondary);">暂无审核记录</div>';
    } else {
        history.forEach(function(h) {
            var txt = h.decision === 'pass' ? '通过' : '驳回';
            var color = h.decision === 'pass' ? 'var(--success)' : 'var(--danger)';
            html += '<div class="attach-item"><i class="fas fa-circle" style="color:' + color + ';font-size:8px;"></i> ' +
                esc(h.time || '-') + '　<span style="color:' + color + ';font-weight:600;">' + txt + '</span>　' +
                esc(h.opinion || '无意见') + ' — ' + esc(h.operator || '-') + '</div>';
        });
    }
    document.getElementById('detailBody').innerHTML = html;
    document.getElementById('detailModal').classList.add('open');
}

/* ---------- 审核操作 ---------- */
function openAudit(type, applicationId) {
    if (type === 'change') { openChangeAudit(applicationId); return; }
    var app = type === 'org'
        ? (typeof getOrgApplicationById === 'function' ? getOrgApplicationById(applicationId) : null)
        : (typeof getExpertApplicationById === 'function' ? getExpertApplicationById(applicationId) : null);
    if (!app) { alert('未找到申报记录'); return; }
    pendingAudit = { type: type, applicationId: applicationId };
    var b = app.basic || {};
    var name = type === 'org' ? b.enterpriseName : b.name;
    var flow = app.flowState || { currentLevel: 0, levels: 1 };
    var lv = (parseInt(flow.currentLevel || 0, 10)) + 1;
    var maxLevel = parseInt(flow.levels || 1, 10);
    document.getElementById('auditTargetInfo').innerHTML =
        '<strong>' + esc(name || '-') + '</strong>（' + esc(app.applicationId) + '）<br>' +
        '当前状态：' + esc(app.status || '待审核') + '　|　本次审核：第 ' + lv + ' 级 / 共 ' + maxLevel + ' 级';
    var cfg = typeof getTPAuditConfig === 'function' ? getTPAuditConfig() : {};
    var presets = (cfg.presetPass || []).concat(cfg.presetReject || []);
    document.getElementById('presetRow').innerHTML = presets.map(function(p) {
        return '<span class="preset-chip" onclick="fillOpinion(this)">' + esc(p) + '</span>';
    }).join('');
    document.getElementById('auditOpinion').value = '';
    document.getElementById('auditModal').classList.add('open');
}
function fillOpinion(el) {
    document.getElementById('auditOpinion').value = el.textContent;
}

/* 变更申请审核 */
function openChangeAudit(changeId) {
    var req = typeof getOrgChangeRequestById === 'function' ? getOrgChangeRequestById(changeId) : null;
    if (!req) { alert('未找到变更申请记录'); return; }
    pendingAudit = { type: 'change', applicationId: changeId };
    var diffRows = (req.changes || []).map(function(c) {
        return '<div style="font-size:12px;margin-top:4px;">· ' + esc(c.label) + '：<span style="color:var(--text-secondary);text-decoration:line-through;">' + esc(c.oldValue || '（空）') + '</span> → <span style="color:var(--primary);font-weight:600;">' + esc(c.newValue) + '</span></div>';
    }).join('');
    document.getElementById('auditTargetInfo').innerHTML =
        '<strong>' + esc(req.orgName || '-') + '</strong>（变更单号：' + esc(req.changeId) + '）<br>' +
        '当前状态：' + esc(req.status || '待审核') + '　|　变更原因：' + esc(req.reason || '-') +
        '<div style="margin-top:6px;border-top:1px dashed rgba(100,116,139,.35);padding-top:6px;">变更内容：' + diffRows + '</div>';
    var cfg = typeof getTPAuditConfig === 'function' ? getTPAuditConfig() : {};
    var presets = (cfg.presetPass || []).concat(cfg.presetReject || []);
    document.getElementById('presetRow').innerHTML = presets.map(function(p) {
        return '<span class="preset-chip" onclick="fillOpinion(this)">' + esc(p) + '</span>';
    }).join('');
    document.getElementById('auditOpinion').value = '';
    document.getElementById('auditModal').classList.add('open');
}
function closeAuditModal() {
    document.getElementById('auditModal').classList.remove('open');
    pendingAudit = null;
}
function doAudit(decision) {
    if (!pendingAudit) return;
    var opinion = document.getElementById('auditOpinion').value.trim();
    if (decision === 'reject' && !opinion) { alert('驳回时请填写审核意见'); return; }
    if (!opinion) opinion = decision === 'pass' ? '材料齐全，予以通过' : '不符合入库条件';
    var appType = pendingAudit.type;
    if (appType === 'change') {
        var req = typeof auditOrgChangeRequest === 'function'
            ? auditOrgChangeRequest(pendingAudit.applicationId, '管理员', opinion, decision) : null;
        closeAuditModal();
        if (!req) { alert('审核操作失败'); return; }
        if (decision === 'pass') alert('变更审核已通过，机构信息已实时更新并记录变更历史。');
        refreshAll();
        return;
    }
    var curApp = appType === 'org'
        ? (typeof getOrgApplicationById === 'function' ? getOrgApplicationById(pendingAudit.applicationId) : null)
        : (typeof getExpertApplicationById === 'function' ? getExpertApplicationById(pendingAudit.applicationId) : null);
    var nextLevel = ((curApp && curApp.flowState && parseInt(curApp.flowState.currentLevel || 0, 10)) || 0) + 1;
    var app = appType === 'org'
        ? auditOrgApplication(pendingAudit.applicationId, nextLevel, '管理员', opinion, decision)
        : auditExpertApplication(pendingAudit.applicationId, nextLevel, '管理员', opinion, decision);
    closeAuditModal();
    if (!app) { alert('审核操作失败'); return; }
    if (decision === 'pass' && app.status === '已通过') {
        alert('审核已通过，' + (appType === 'org' ? '机构' : '专家') + '信息已入库。');
    }
    refreshAll();
}

/* ---------- 审核记录归档 ---------- */
function renderAuditRecords() {
    var tbody = document.getElementById('auditRecordBody');
    var typeFilter = document.getElementById('recordTypeFilter').value;
    var resultFilter = document.getElementById('recordResultFilter').value;
    var rows = [];
    getOrgApps().forEach(function(a) {
        (a.auditHistory || []).forEach(function(h) {
            rows.push({ time: h.time, type: '机构', name: (a.basic || {}).enterpriseName || '-', decision: h.decision, opinion: h.opinion, operator: h.operator, applicationId: a.applicationId, appType: 'org' });
        });
    });
    getExpertApps().forEach(function(a) {
        (a.auditHistory || []).forEach(function(h) {
            rows.push({ time: h.time, type: '专家', name: (a.basic || {}).name || '-', decision: h.decision, opinion: h.opinion, operator: h.operator, applicationId: a.applicationId, appType: 'expert' });
        });
    });
    getOrgChangeReqs().forEach(function(c) {
        (c.auditHistory || []).forEach(function(h) {
            if (h.decision === 'submit') return;
            rows.push({ time: h.time, type: '机构', name: (c.orgName || '-') + '（变更）', decision: h.decision, opinion: h.opinion, operator: h.operator, applicationId: c.changeId, appType: 'change' });
        });
    });
    rows.sort(function(a, b) { return (b.time || '').localeCompare(a.time || ''); });
    if (typeFilter) rows = rows.filter(function(r) { return r.type === typeFilter; });
    if (resultFilter) rows = rows.filter(function(r) { return (r.decision === 'pass' ? '通过' : (r.decision === 'verify' ? '核验' : '驳回')) === resultFilter; });
    if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-secondary);padding:24px;">暂无审核记录</td></tr>';
        return;
    }
    tbody.innerHTML = rows.map(function(r) {
        var result = r.decision === 'pass'
            ? '<span class="status-tag success">通过</span>'
            : (r.decision === 'verify'
                ? '<span class="status-tag warning">核验</span>'
                : '<span class="status-tag danger">驳回</span>');
        return '<tr>' +
            '<td>' + esc(r.time || '-') + '</td>' +
            '<td>' + esc(r.type) + '</td>' +
            '<td>' + esc(r.name) + '</td>' +
            '<td>' + result + '</td>' +
            '<td>' + esc(r.opinion || '无意见') + '</td>' +
            '<td>' + esc(r.operator || '-') + '</td>' +
            '<td style="text-align:center;"><a href="#" class="table-link" onclick="openDetail(\'' + r.appType + '\',\'' + r.applicationId + '\');return false;"><i class="fas fa-paperclip"></i> 查看</a></td>' +
        '</tr>';
    }).join('');
}

/* ---------- 审核进度查询 ---------- */
function onQueryTypeChange() {
    var type = document.getElementById('queryType').value;
    var isOrg = type === 'org';
    document.getElementById('queryLabel1').textContent = isOrg ? '机构名称：' : '专家姓名：';
    document.getElementById('queryLabel2').textContent = isOrg ? '统一社会信用代码：' : '身份证号：';
    document.getElementById('queryValue1').placeholder = isOrg ? '请输入机构名称' : '请输入专家姓名';
    document.getElementById('queryValue2').placeholder = isOrg ? '请输入统一社会信用代码' : '请输入身份证号';
    resetQuery();
}
function queryProgress() {
    var type = document.getElementById('queryType').value;
    var v1 = document.getElementById('queryValue1').value.trim();
    var v2 = document.getElementById('queryValue2').value.trim();
    if (!v1 && !v2) { alert('请输入查询条件'); return; }
    var found;
    if (type === 'org') {
        var orgName = v1.toLowerCase(), orgCode = v2.toLowerCase();
        found = getOrgApps().find(function(a) {
            var b = a.basic || {};
            var m1 = orgName && (b.enterpriseName || '').toLowerCase().indexOf(orgName) !== -1;
            var m2 = orgCode && (b.creditCode || '').toLowerCase() === orgCode;
            return orgName && orgCode ? (m1 && m2) : (m1 || m2);
        });
    } else {
        var expName = v1.toLowerCase(), idCard = v2.toLowerCase();
        found = getExpertApps().find(function(a) {
            var b = a.basic || {};
            var m1 = expName && (b.name || '').toLowerCase().indexOf(expName) !== -1;
            var m2 = idCard && (b.idCard || '').toLowerCase() === idCard;
            return expName && idCard ? (m1 && m2) : (m1 || m2);
        });
    }
    var changeMatches = [];
    if (type === 'org' && typeof queryOrgChangeRequests === 'function') {
        changeMatches = queryOrgChangeRequests({ orgName: v1, orgCode: v2 });
    }
    if (!found && !changeMatches.length) {
        document.getElementById('progressResultCard').style.display = 'none';
        document.getElementById('progressEmptyCard').style.display = 'block';
        return;
    }
    document.getElementById('progressResultCard').style.display = 'block';
    document.getElementById('progressEmptyCard').style.display = 'none';
    if (found) {
        renderProgressResult(found, type);
    } else {
        renderChangeProgress(changeMatches[0]);
    }
    if (type === 'org') renderChangeRequestSection(changeMatches);
}
function renderProgressResult(app, type) {
    var b = app.basic || {};
    var statusEl = document.getElementById('progressStatus');
    if (app.status === '已通过') { statusEl.className = 'status-tag success'; statusEl.textContent = '已通过'; }
    else if (app.status === '已驳回') { statusEl.className = 'status-tag danger'; statusEl.textContent = '已驳回'; }
    else if (app.status === '审核中') { statusEl.className = 'status-tag warning'; statusEl.textContent = '审核中'; }
    else { statusEl.className = 'status-tag primary'; statusEl.textContent = app.status || '待审核'; }

    var items;
    if (type === 'org') {
        items = [
            ['申请编号', app.applicationId], ['提交时间', app.submitTime],
            ['机构名称', b.enterpriseName], ['统一社会信用代码', b.creditCode],
            ['服务区域', b.serviceArea], ['专业领域', b.field]
        ];
    } else {
        items = [
            ['申请编号', app.applicationId], ['提交时间', app.submitTime],
            ['姓名', b.name], ['身份证号', b.idCard],
            ['职称', b.title], ['专业领域', b.domain]
        ];
    }
    document.getElementById('progressInfoGrid').innerHTML = items.map(function(it) {
        return '<div class="info-item"><div class="info-label">' + it[0] + '</div><div class="info-value">' + esc(it[1] || '-') + '</div></div>';
    }).join('');
    renderProgressTrack(app);
    renderTimeline(app, type);

    var actionsEl = document.getElementById('progressActions');
    if (actionsEl) {
        var html = '';
        if (type === 'org' && app.status === '已驳回') {
            html += '<a href="tp-org-apply.html?resubmit=' + encodeURIComponent(app.applicationId) + '" class="list-btn" style="background:var(--primary);color:#fff;text-decoration:none;padding:10px 22px;display:inline-flex;align-items:center;gap:6px;">' +
                '<i class="fas fa-paper-plane"></i> 补充资料重新提交</a>';
        }
        if (type === 'org' && typeof getAllOrgs === 'function') {
            var inOrg = getAllOrgs().find(function(o) { return o.orgCode && o.orgCode === (b.creditCode || ''); });
            if (inOrg) {
                if (typeof hasPendingOrgChangeRequest === 'function' && hasPendingOrgChangeRequest(inOrg.orgId)) {
                    html += '<span style="margin-left:10px;font-size:13px;color:var(--warning);"><i class="fas fa-hourglass-half"></i> 已有待审核的变更申请</span>';
                } else {
                    html += '<a href="tp-org-apply.html?change=' + encodeURIComponent(inOrg.orgId) + '" class="list-btn" style="margin-left:10px;background:var(--warning);color:#fff;text-decoration:none;padding:10px 22px;display:inline-flex;align-items:center;gap:6px;">' +
                        '<i class="fas fa-exchange-alt"></i> 发起变更申请</a>';
                }
            }
        }
        actionsEl.innerHTML = html;
    }
}
/* 变更申请进度视图（机构无申报记录、仅有变更记录时） */
function renderChangeProgress(req) {
    var statusEl = document.getElementById('progressStatus');
    if (req.status === '已通过') { statusEl.className = 'status-tag success'; statusEl.textContent = '已通过'; }
    else if (req.status === '已驳回') { statusEl.className = 'status-tag danger'; statusEl.textContent = '已驳回'; }
    else { statusEl.className = 'status-tag primary'; statusEl.textContent = req.status || '待审核'; }

    var items = [
        ['变更单号', req.changeId], ['提交时间', req.submitTime],
        ['机构名称', req.orgName], ['统一社会信用代码', req.creditCode],
        ['变更字段数', (req.changes || []).length + ' 项'], ['变更原因', req.reason]
    ];
    document.getElementById('progressInfoGrid').innerHTML = items.map(function(it) {
        return '<div class="info-item"><div class="info-label">' + it[0] + '</div><div class="info-value">' + esc(it[1] || '-') + '</div></div>';
    }).join('');

    renderProgressTrack({ flowState: {
        mode: 'single', levels: 1,
        currentLevel: req.status === '待审核' ? 0 : 1,
        status: req.status === '已通过' ? 'approved' : (req.status === '已驳回' ? 'rejected' : 'pending')
    } });

    var rows = [{ time: req.submitTime, title: '提交变更申请', opinion: '机构信息变更申请已提交，等待审核。', cls: '' }];
    (req.auditHistory || []).forEach(function(h) {
        if (h.decision === 'submit') return;
        rows.push({
            time: h.time,
            title: h.decision === 'pass' ? '审核通过' : '审核驳回',
            opinion: (h.opinion || '无意见') + ' — 操作人：' + (h.operator || '-'),
            cls: h.decision === 'pass' ? 'approved' : 'rejected'
        });
    });
    if (req.status === '已通过') {
        rows.push({ time: req.auditTime || '', title: '变更生效', opinion: '变更内容已实时更新到机构信息，并记录到变更历史。', cls: 'approved' });
    } else if (req.status === '已驳回') {
        rows.push({ time: '', title: '变更被驳回', opinion: '机构信息保持不变，可重新发起变更申请。', cls: 'rejected' });
    }
    document.getElementById('timelineContainer').innerHTML = '<div class="timeline">' + rows.map(function(r) {
        var dotStyle = r.cls === 'rejected' ? 'background:var(--danger);' : (r.cls === 'approved' ? 'background:var(--success);' : '');
        return '<div class="timeline-item">' +
            '<div class="timeline-dot" style="' + dotStyle + '"></div>' +
            '<div class="timeline-time">' + (r.time || '当前') + '</div>' +
            '<div class="timeline-title">' + r.title + '</div>' +
            '<div class="timeline-opinion">' + r.opinion + '</div>' +
            '</div>';
    }).join('') + '</div>';

    var actionsEl = document.getElementById('progressActions');
    if (actionsEl) {
        actionsEl.innerHTML = req.status === '已驳回'
            ? '<a href="tp-org-apply.html?change=' + encodeURIComponent(req.orgId) + '" class="list-btn" style="background:var(--warning);color:#fff;text-decoration:none;padding:10px 22px;display:inline-flex;align-items:center;gap:6px;"><i class="fas fa-exchange-alt"></i> 重新发起变更申请</a>'
            : '';
    }
}

/* 进度查询结果中的变更申请记录列表 */
function renderChangeRequestSection(list) {
    var el = document.getElementById('changeRequestSection');
    if (!el) return;
    if (!list || !list.length) { el.innerHTML = ''; return; }
    el.innerHTML = '<div style="border-top:1px solid rgba(100,116,139,.2);padding-top:12px;">' +
        '<div style="font-size:14px;font-weight:600;margin-bottom:8px;"><i class="fas fa-exchange-alt" style="color:var(--warning);"></i> 变更申请记录</div>' +
        list.map(function(c) {
            return '<div class="attach-item" style="display:flex;justify-content:space-between;align-items:center;">' +
                '<span>' + esc(c.changeId) + '　' + esc(c.submitTime || '-') + '　' + statusTag(c.status) + '　变更 ' + (c.changes || []).length + ' 项</span>' +
                '<a href="#" class="table-link" onclick="openDetail(\'change\',\'' + c.changeId + '\');return false;">查看</a>' +
            '</div>';
        }).join('') + '</div>';
}

function renderProgressTrack(app) {
    var wrapper = document.getElementById('progressTrackWrapper');
    var flow = app.flowState || { mode: 'single', levels: 1, currentLevel: 0, status: 'pending' };
    var levels = parseInt(flow.levels || 1, 10);
    var currentLevel = parseInt(flow.currentLevel || 0, 10);
    var status = flow.status || 'pending';
    var totalSteps = levels + 2;

    var steps = [{ icon: 'fa-edit', label: '提交申请' }];
    for (var i = 1; i <= levels; i++) steps.push({ icon: 'fa-user-check', label: '第' + i + '级审核' });
    steps.push({ icon: 'fa-check', label: '审核完成' });

    var doneIndex = 0;
    if (status === 'approved') doneIndex = totalSteps - 1;
    else if (status === 'rejected') doneIndex = currentLevel;
    else if (currentLevel > 0) doneIndex = currentLevel;
    var currentIndex = doneIndex;
    if (status !== 'approved' && status !== 'rejected') currentIndex = Math.min(doneIndex + 1, totalSteps - 1);

    var html = '<div class="progress-track">' +
        '<div class="progress-line"><div class="progress-line-fill" style="width:' + (doneIndex / (totalSteps - 1) * 100) + '%"></div></div>';
    steps.forEach(function(s, idx) {
        var cls = 'progress-step';
        if (idx <= doneIndex) cls += ' done';
        else if (idx === currentIndex) cls += ' current';
        html += '<div class="' + cls + '"><div class="progress-dot"><i class="fas ' + s.icon + '"></i></div><span>' + s.label + '</span></div>';
    });
    html += '</div>';
    wrapper.innerHTML = html;
}
function renderTimeline(app, type) {
    var container = document.getElementById('timelineContainer');
    var history = app.auditHistory || [];
    var rows = [];
    rows.push({ time: app.submitTime, title: '提交申请', opinion: type === 'org' ? '机构资料已提交，等待审核。' : '专家注册申请已提交，等待审核。', cls: '' });
    history.forEach(function(h) {
        var title = h.decision === 'pass' ? '审核通过' : (h.decision === 'reject' ? '审核驳回' : (h.decision === 'verify' ? '发起核验' : '审核处理'));
        if (h.level && h.decision !== 'verify') title += '（第 ' + h.level + ' 级）';
        var cls = h.decision === 'reject' ? 'rejected' : (h.decision === 'pass' ? 'approved' : (h.decision === 'verify' ? 'verifying' : ''));
        rows.push({ time: h.time, title: title, opinion: (h.opinion || '无意见') + ' — 操作人：' + (h.operator || '-'), cls: cls });
    });
    if (app.status === '核验中') {
        rows.push({ time: '', title: '核验进行中', opinion: '资料核验期间审核流程暂停，核验完成后将继续审核。', cls: 'verifying' });
    }
    if (app.status === '已通过') {
        rows.push({ time: app.approveTime || '', title: '完成入库', opinion: type === 'org' ? '审核已通过，机构信息已入库。' : '审核已通过，专家信息已入库。', cls: 'approved' });
    } else if (app.status === '已驳回') {
        rows.push({ time: '', title: '申请被驳回', opinion: '请根据审核意见补充资料后重新提交。', cls: 'rejected' });
    }
    container.innerHTML = '<div class="timeline">' + rows.map(function(r) {
        var dotStyle = r.cls === 'rejected' ? 'background:var(--danger);' : (r.cls === 'approved' ? 'background:var(--success);' : (r.cls === 'verifying' ? 'background:var(--warning);' : ''));
        return '<div class="timeline-item">' +
            '<div class="timeline-dot" style="' + dotStyle + '"></div>' +
            '<div class="timeline-time">' + (r.time || '当前') + '</div>' +
            '<div class="timeline-title">' + r.title + '</div>' +
            '<div class="timeline-opinion">' + r.opinion + '</div>' +
            '</div>';
    }).join('') + '</div>';
}
function resetQuery() {
    document.getElementById('queryValue1').value = '';
    document.getElementById('queryValue2').value = '';
    document.getElementById('progressResultCard').style.display = 'none';
    document.getElementById('progressEmptyCard').style.display = 'none';
}

/* ---------- 初始化 ---------- */
function refreshAll() {
    if (isPortalView) return;
    renderStats();
    renderOrgList();
    renderExpertList();
    renderAuditRecords();
}

window.onload = function() {
    if (isPortalView) {
        document.querySelector('.stat-row').style.display = 'none';
        document.getElementById('auditArchive').style.display = 'none';
        document.querySelector('#auditWorkspace .tab-bar').style.display = 'none';
        document.querySelector('#auditWorkspace .list-header .list-title').innerHTML = '<i class="fas fa-search"></i> 审核进度查询';
        switchTab('progress');
    }
    refreshAll();
    var params = new URLSearchParams(location.search);
    var tab = params.get('tab') || '';
    if (tab === 'expert' || tab === 'progress' || tab === 'org') switchTab(tab);
    var linkedApplicationId = params.get('applicationId');
    if (linkedApplicationId && !isPortalView) {
        var linkedApp = typeof getOrgApplicationById === 'function' ? getOrgApplicationById(linkedApplicationId) : null;
        if (linkedApp) {
            switchTab('org');
            if (isPendingStatus(linkedApp.status)) openAudit('org', linkedApplicationId);
            else openDetail('org', linkedApplicationId);
        }
    }
    if (params.get('orgName') || params.get('orgCode')) {
        document.getElementById('queryType').value = 'org';
        onQueryTypeChange();
        document.getElementById('queryValue1').value = params.get('orgName') || '';
        document.getElementById('queryValue2').value = params.get('orgCode') || '';
        switchTab('progress');
        queryProgress();
    } else if (params.get('expertName') || params.get('idCard')) {
        document.getElementById('queryType').value = 'expert';
        onQueryTypeChange();
        document.getElementById('queryValue1').value = params.get('expertName') || '';
        document.getElementById('queryValue2').value = params.get('idCard') || '';
        switchTab('progress');
        queryProgress();
    }
};
