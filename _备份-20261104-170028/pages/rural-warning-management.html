<style>
/* ===== Theme Variables ===== */
:root {
    --primary: #1a73e8; --primary-dark: #1557b0; --primary-light: #e8f0fe;
    --secondary: #0097a7; --danger: #d93025; --warning: #e65100; --success: #1e8e3e;
    --bg-dark: #f0f2f5; --bg-card: #ffffff; --bg-hover: #e8eaed;
    --text-primary: #202124; --text-secondary: #5f6368; --border: #dadce0;
    --shadow: rgba(0,0,0,0.08); --input-bg: #ffffff; --input-border: #dadce0;
}
:root[data-theme="dark"] {
    --primary: #1e6fdb; --primary-dark: #1557b0; --primary-light: #e8f1fd;
    --secondary: #00b4d8; --danger: #ef4444; --warning: #f59e0b; --success: #10b981;
    --bg-dark: #0a1628; --bg-card: #112240; --bg-hover: #1a2f4a;
    --text-primary: #e2e8f0; --text-secondary: #94a3b8; --border: #1e3a5f;
    --shadow: rgba(0,0,0,0.3); --input-bg: rgba(255,255,255,0.05); --input-border: #1e3a5f;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif;
    background: var(--bg-dark);
    color: var(--text-primary);
    padding: 20px;
    min-height: 100vh;
}

/* ===== View Mode Toggle ===== */
.view-mode-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 12px;
    flex-wrap: wrap;
}
.view-mode-banner {
    flex: 1;
    min-width: 280px;
    padding: 10px 14px;
    border-radius: 8px;
    border-left: 4px solid var(--primary);
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 13px;
    display: none;
}
.view-mode-banner.show { display: block; }
.view-mode-toggle {
    display: inline-flex;
    align-items: center;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    gap: 4px;
}
.view-mode-toggle .mode-btn {
    height: 32px;
    padding: 0 16px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
}
.view-mode-toggle .mode-btn:hover { color: var(--text-primary); }
.view-mode-toggle .mode-btn.active {
    background: var(--primary);
    color: #fff;
}

/* ===== 2-Color Risk KPI Cards ===== */
.kpi-wrapper {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-bottom: 20px;
}
.kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    transition: all 0.3s;
    box-shadow: 0 1px 3px var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
}
.kpi-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--shadow); }

.kpi-card.red-top    { border-top: 4px solid var(--danger); }
.kpi-card.orange-top { border-top: 4px solid var(--warning); }
.kpi-card.yellow-top { border-top: 4px solid #c78000; }
.kpi-card.blue-top   { border-top: 4px solid var(--primary); }

.kpi-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.kpi-card-label {
    font-size: 15px;
    font-weight: 700;
}
.kpi-card-label.red    { color: var(--danger); }
.kpi-card-label.orange { color: var(--warning); }
.kpi-card-label.yellow { color: #c78000; }
.kpi-card-label.blue   { color: var(--primary); }

.kpi-card-icon {
    width: 36px; height: 36px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
}
.kpi-card-icon.red    { background: rgba(217,48,37,0.15); color: var(--danger); }
.kpi-card-icon.orange { background: rgba(227,116,0,0.15); color: var(--warning); }
.kpi-card-icon.yellow { background: rgba(249,200,70,0.15); color: #c78000; }
.kpi-card-icon.blue   { background: rgba(26,115,232,0.15); color: var(--primary); }

.kpi-card-main {
    display: flex;
    align-items: baseline;
    gap: 8px;
}
.kpi-card-total {
    font-size: 32px;
    font-weight: 700;
    line-height: 1;
}
.kpi-card-total.red    { color: var(--danger); }
.kpi-card-total.orange { color: var(--warning); }
.kpi-card-total.yellow { color: #c78000; }
.kpi-card-total.blue   { color: var(--primary); }

.kpi-card-trend {
    font-size: 12px;
    color: var(--text-secondary);
}

.kpi-card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
    padding-top: 4px;
}

.kpi-card-note {
    font-size: 12px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 1.4;
    white-space: nowrap;
}
.kpi-card-note.red    { color: var(--danger);  background: rgba(217,48,37,0.08); }
.kpi-card-note.orange { color: var(--warning); background: rgba(230,81,0,0.08); }
.kpi-card-note.yellow { color: #c78000;        background: rgba(199,128,0,0.08); }
.kpi-card-note.blue   { color: var(--primary); background: rgba(26,115,232,0.08); }

:root[data-theme="dark"] .kpi-card-note.red    { background: rgba(217,48,37,0.18); }
:root[data-theme="dark"] .kpi-card-note.orange { background: rgba(230,81,0,0.18); }
:root[data-theme="dark"] .kpi-card-note.yellow { background: rgba(199,128,0,0.18); }
:root[data-theme="dark"] .kpi-card-note.blue   { background: rgba(26,115,232,0.18); }

/* ===== Filter Bar ===== */
.filter-bar {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
}
.filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
}
.filter-label {
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
}
.filter-input,
.filter-select {
    height: 34px;
    padding: 0 12px;
    border: 1px solid var(--input-border);
    border-radius: 6px;
    background: var(--input-bg);
    color: var(--text-primary);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
}
.filter-input:focus,
.filter-select:focus { border-color: var(--primary); }
.filter-input { width: 220px; }
.filter-select { min-width: 120px; cursor: pointer; }

.btn {
    height: 34px;
    padding: 0 18px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
}
.btn-primary {
    background: var(--primary);
    color: #fff;
}
.btn-primary:hover { background: var(--primary-dark); }
.btn-default {
    background: var(--bg-hover);
    color: var(--text-primary);
    border: 1px solid var(--border);
}
.btn-default:hover { background: var(--border); }

/* ===== Table ===== */
.table-wrapper {
    overflow-x: auto;
    max-width: 100%;
}
.data-table {
    width: 100%;
    min-width: 1500px;
    border-collapse: separate;
    border-spacing: 0;
}
.data-table tbody {
    display: block;
    min-height: 420px;
}
.data-table thead, .data-table tbody tr {
    display: table;
    width: 100%;
    table-layout: fixed;
}
.table-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: auto;
    box-shadow: 0 1px 3px var(--shadow);
}
.data-table thead {
    background: var(--bg-hover);
}
.data-table th {
    padding: 12px 10px;
    text-align: left;
    font-weight: 600;
    font-size: 13px;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
}
.data-table td {
    padding: 12px 10px;
    border-bottom: 1px solid var(--border);
    color: var(--text-primary);
    vertical-align: middle;
    font-size: 13px;
}
.data-table td:nth-child(1),
.data-table td:nth-child(3),
.data-table td:nth-child(4),
.data-table td:nth-child(6),
.data-table td:nth-child(7),
.data-table td:nth-child(8) {
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.data-table td:nth-child(10) {
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.data-table tbody tr:hover {
    background: #f1f7fe;
}
.data-table tbody tr:hover td {
    background: #f1f7fe;
}
.data-table tbody tr:last-child td {
    border-bottom: none;
}

/* 固定列样式：仅在中等以上屏幕启用 */
@media (min-width: 1440px) {
    .data-table th:first-child,
    .data-table td:first-child,
    .data-table th:nth-last-child(2),
    .data-table td:nth-last-child(2),
    .data-table th:last-child,
    .data-table td:last-child {
        position: sticky;
        background: var(--bg-card);
        z-index: 2;
        box-shadow: -2px 0 4px -2px rgba(0,0,0,0.08);
    }
    .data-table th:first-child,
    .data-table td:first-child { left: 0; border-right: 1px solid var(--border); }
    .data-table th:nth-last-child(2),
    .data-table td:nth-last-child(2) { right: var(--last-col-w, 100px); border-left: none; }
    .data-table th:last-child,
    .data-table td:last-child { right: 0; border-left: 1px solid var(--border); }
    .data-table th:first-child,
    .data-table th:nth-last-child(2),
    .data-table th:last-child { background: var(--bg-hover); }
    .data-table tbody tr:hover td:first-child,
    .data-table tbody tr:hover td:nth-last-child(2),
    .data-table tbody tr:hover td:last-child { background: #f1f7fe; }
}

@media (max-width: 1439px) {
    .data-table th,
    .data-table td {
        white-space: nowrap;
    }
    .data-table td:nth-child(1),
    .data-table td:nth-child(4),
    .data-table td:nth-child(8),
    .data-table td:nth-child(10) {
        max-width: 140px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
}

/* Action links */
.actions {
    display: flex;
    gap: 10px;
    align-items: center;
    white-space: nowrap;
}
.action-link {
    font-size: 13px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    color: var(--primary);
    transition: none;
    opacity: 1 !important;
}
.action-link:hover { text-decoration: underline; opacity: 1 !important; }
.action-link.delete { color: var(--danger); }
.risk-badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
}
.risk-badge.red {
    background: rgba(217,48,37,0.1);
    color: var(--danger);
}
.risk-badge.orange {
    background: rgba(227,116,0,0.1);
    color: var(--warning);
}
.risk-badge.yellow {
    background: rgba(199,128,0,0.1);
    color: #c78000;
}
.risk-badge.blue {
    background: rgba(26,115,232,0.1);
    color: var(--primary);
}

/* Source tag */
.source-tag {
    font-size: 13px;
    color: var(--text-primary);
}

/* Status tag */
.status-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
}
.status-tag.pending      { background: rgba(217,48,37,0.1);  color: var(--danger); }
.status-tag.dispatch     { background: rgba(227,116,0,0.1);  color: var(--warning); }
.status-tag.handling     { background: rgba(26,115,232,0.1); color: var(--primary); }
.status-tag.accept       { background: rgba(142,36,170,0.1); color: #8e24aa; }
.status-tag.closed       { background: rgba(30,142,62,0.1);  color: var(--success); }
.status-tag.reject-audit { background: rgba(100,100,100,0.1); color: var(--text-secondary); }
.status-tag.reject-check { background: rgba(100,100,100,0.1); color: var(--text-secondary); }
.status-tag.overdue      { background: rgba(217,48,37,0.15); color: var(--danger); }

/* 处置中心状态 */
.status-tag.receive      { background: rgba(26,115,232,0.1); color: var(--primary); }
.status-tag.survey       { background: rgba(0,151,167,0.1);  color: var(--secondary); }
.status-tag.plan         { background: rgba(142,36,170,0.1);  color: #8e24aa; }
.status-tag.repair       { background: rgba(227,116,0,0.1);   color: var(--warning); }
.status-tag.check        { background: rgba(30,142,62,0.1);  color: var(--success); }
.status-tag.received     { background: rgba(26,115,232,0.1); color: var(--primary); }

/* Action links */
.actions {
    display: flex;
    gap: 10px;
    align-items: center;
}
.action-link {
    font-size: 13px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    transition: opacity 0.2s;
    color: var(--primary);
}
.action-link:hover { text-decoration: underline; }
.action-link.delete { color: var(--danger); }

/* Pagination */
.pagination-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg-card);
    position: relative;
    z-index: 10;
}
.page-btn {
    min-width: 32px;
    height: 32px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-primary);
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
    margin: 0 4px;
}
.page-btn:hover { border-color: var(--primary); color: var(--primary); }
#page-numbers { margin: 0 -4px; }
.page-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}
.page-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}
.page-info {
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
    flex-shrink: 0;
}

/* ===== Sub Tabs ===== */
.sub-tabs {
    display: flex;
    gap: 4px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 16px;
    overflow-x: auto;
}
.sub-tab-group {
    display: none;
    gap: 4px;
    flex-wrap: wrap;
}
.sub-tab-group.active {
    display: flex;
}
.sub-tab-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    border: none;
    background: transparent;
}
.sub-tab-item:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
}
.sub-tab-item.active {
    background: var(--primary);
    color: #fff;
}

/* ===== Status Tabs ===== */
.status-tabs {
    display: flex;
    gap: 4px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 16px;
    overflow-x: auto;
}
.tab-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    border: none;
    background: transparent;
}
.tab-item:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
}
.tab-item.active {
    background: var(--primary);
    color: #fff;
}
.tab-item .tab-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(0,0,0,0.06);
}
.tab-item.active .tab-count {
    background: rgba(255,255,255,0.2);
}
/* 调度结果未读徽标 */
.dispatch-unread-badge {
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: 6px; padding: 2px 8px;
    background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
    color: #dc2626; border: 1px solid #fecaca;
    border-radius: 999px; font-size: 11px; font-weight: 600;
    line-height: 1.4; vertical-align: middle; white-space: nowrap;
    cursor: default;
    box-shadow: 0 1px 2px rgba(220, 38, 38, 0.12);
}
.dispatch-unread-badge .fa-solid {
    font-size: 6px;
    animation: unreadBlink 1.4s ease-in-out infinite;
}
.dispatch-unread-badge.badge-assigned {
    background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
    color: #1d4ed8; border-color: #bfdbfe;
    box-shadow: 0 1px 2px rgba(29, 78, 216, 0.12);
}
@keyframes unreadBlink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.8); }
}

/* ===== 隐患登记弹窗 ===== */
.btn-warn { background: #f59e0b; color: #fff; }
.btn-warn:hover { background: #d97706; }
.sp-modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 1200; }
.sp-modal-mask.show { display: flex; }
.sp-modal { width: 640px; max-width: 94vw; max-height: 88vh; overflow: auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.sp-modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 600; color: var(--text-primary); }
.sp-close { background: none; border: none; color: var(--text-secondary); font-size: 16px; cursor: pointer; }
.sp-modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.sp-row { display: flex; gap: 12px; }
.sp-row .sp-field { flex: 1; }
.sp-field { display: flex; flex-direction: column; gap: 6px; }

.sp-field input, .sp-field select, .sp-field textarea { height: 34px; padding: 0 10px; border: 1px solid var(--input-border); border-radius: 6px; background: var(--input-bg); color: var(--text-primary); font-size: 13px; outline: none; box-sizing: border-box; width: 100%; }
.sp-field textarea { height: auto; padding: 8px 10px; resize: vertical; font-family: inherit; }
.sp-field input:focus, .sp-field select:focus, .sp-field textarea:focus { border-color: var(--primary); }
.sp-results { max-height: 160px; overflow: auto; }
.sp-result-item { padding: 8px 10px; font-size: 12px; color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; margin-top: 6px; cursor: pointer; }
.sp-result-item:hover { border-color: var(--primary); background: rgba(26,115,232,.06); }
.sp-result-empty { padding: 8px 10px; font-size: 12px; color: var(--text-secondary); }
.sp-selected { padding: 8px 10px; font-size: 12px; color: var(--text-primary); border: 1px dashed var(--primary); border-radius: 6px; margin-top: 6px; background: rgba(26,115,232,.06); }
.sp-modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--border); }
</style>

<script>
(function() {
    const PAGE_SIZE = 10;
    let allHazards = [];
    let filteredHazards = [];
    let currentPage = 1;
    let currentTab = 'all';
    let viewMode = 'business'; // 'business' | 'admin'
    let taskNameMap = {}; // 任务ID -> 任务名称（关联任务列）

    function loadTaskNameMap() {
        try {
            const list = JSON.parse(localStorage.getItem('patrolTasks') || '[]');
            taskNameMap = {};
            list.forEach(t => { if (t && t.id != null) taskNameMap[String(t.id)] = t.name || ('任务 ' + t.id); });
        } catch (e) { taskNameMap = {}; }
    }

    // 镇/村下拉：从当前台账数据动态汇总
    function populateRegionFilters() {
        const streetSel = document.getElementById('filter-street');
        const commSel = document.getElementById('filter-community');
        if (!streetSel || !commSel) return;
        const streets = [...new Set(allHazards.map(r => r.street).filter(Boolean))].sort();
        const comms = [...new Set(allHazards.map(r => r.community).filter(Boolean))].sort();
        streets.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; streetSel.appendChild(o); });
        comms.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; commSel.appendChild(o); });
    }

    // 管理员视图下各阶段显示文案（保持原始状态 key 不变，仅 UI 去动作化）
    const ADMIN_STAGE_LABELS = {
        '待核实': '核实阶段',
        '待分发': '分发阶段',
        '处置中': '处置阶段',
        '待验收': '验收阶段',
        '已销号': '已销号',
        '已驳回': '已驳回'
    };

    const HAZARD_TYPE_MAP = {
        '承重墙': '结构隐患',
        '屋面': '屋面隐患',
        '地基基础': '地基隐患',
        '木构架': '结构隐患',
        '楼梯间': '结构隐患',
        '阳台': '结构隐患',
        '外墙': '外围隐患',
        '梁柱': '结构隐患',
        '楼板': '结构隐患',
        '排水系统': '设施隐患'
    };

    const SOURCE_OPTIONS = ['物联自动上报', '巡查人员上报', '排查发现', '群众举报', '专家研判'];

    function pad2(n) { return n < 10 ? '0' + n : n; }

    function formatDateTime(d) {
        if (!d) return '-';
        if (typeof d === 'string' && d.includes(' ')) return d;
        const dt = new Date(d);
        if (isNaN(dt)) return d;
        return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate()) + ' ' + pad2(dt.getHours()) + ':' + pad2(dt.getMinutes());
    }

    const RISK_TO_HAZARD_LEVEL_MAP = {
        // 存在严重安全隐患（第三类，红）：包含历史“严重/一定”两档
        '存在严重安全隐患': '存在严重安全隐患',
        '严重安全隐患': '存在严重安全隐患',
        '重大隐患': '存在严重安全隐患',
        '较大隐患': '存在严重安全隐患',
        '疑似危房': '存在严重安全隐患',
        '严重损坏房': '存在严重安全隐患',
        '第三类': '存在严重安全隐患',
        // 存在一定安全隐患（第二类，黄）：包含历史“带轻微瑕疵/一般隐患”
        '存在一定安全隐患': '存在一定安全隐患',
        '一定安全隐患': '存在一定安全隐患',
        '带轻微瑕疵': '存在一定安全隐患',
        '一般隐患': '存在一定安全隐患',
        '一般损坏房': '存在一定安全隐患',
        '第二类': '存在一定安全隐患',
        // 未发现安全隐患（蓝）：保持不变
        '未发现安全隐患': '未发现安全隐患',
        '第一类': '未发现安全隐患',
        '完好房(基本完好房)': '未发现安全隐患',
        '安全': '未发现安全隐患',
        '无风险': '未发现安全隐患'
    };

    function mapRiskClass(level) {
        const display = RISK_TO_HAZARD_LEVEL_MAP[level] || level;
        if (display === '存在严重安全隐患') return 'red';
        if (display === '存在一定安全隐患') return 'yellow';
        return 'blue';
    }

    function getHazardLevelDisplay(level) {
        return RISK_TO_HAZARD_LEVEL_MAP[level] || level || '—';
    }

    function mapStatus(governance, closeStatus, auditStatus) {
        if (closeStatus === '已通过') return { key: 'closed', label: '已销号', cls: 'closed' };
        if (closeStatus === '已驳回') return { key: 'reject-check', label: '已驳回', cls: 'reject-check' };
        if (closeStatus === '审核中') return { key: 'pending-accept', label: '待验收', cls: 'accept' };
        if (governance === 'done') return { key: 'pending-accept', label: '待验收', cls: 'accept' };
        if (governance === 'doing') return { key: 'handling', label: '处置中', cls: 'handling' };
        if (governance === 'overdue') return { key: 'handling', label: '处置中', cls: 'handling' };
        if (governance === 'pending') {
            // 核实已通过、尚未分发的进入“待分发”
            if (auditStatus === '已通过') return { key: 'pending-dispatch', label: '待分发', cls: 'dispatch' };
            return { key: 'pending-audit', label: '待核实', cls: 'pending' };
        }
        return { key: 'pending-audit', label: '待核实', cls: 'pending' };
    }

    // 隐患级状态：优先按隐患自身的审核状态/流转状态（专项任务链路），无则回落到房屋级状态
    function mapHazardStatus(rec, h) {
        if (h && h.auditState === '已驳回') return { key: 'reject-check', label: '已驳回', cls: 'reject-check' };
        const fs = h && h.flowStatus;
        if (fs === '已整治') return { key: 'closed', label: '已销号', cls: 'closed' };
        if (fs === '待验收') return { key: 'pending-accept', label: '待验收', cls: 'accept' };
        if (fs === '处置中') return { key: 'handling', label: '处置中', cls: 'handling' };
        if (fs === '待处置') return { key: 'pending-dispatch', label: '待分发', cls: 'dispatch' };
        return mapStatus(rec.governance, rec.closeStatus, rec.auditStatus);
    }

    // 等级高低排序：用于房屋风险等级取“原始评定等级”与“隐患最高等级”的高者
    const LEVEL_RANK = {
        '第三类': 3, '存在严重安全隐患': 3, '严重安全隐患': 3, '重大隐患': 3, '较大隐患': 3, '疑似危房': 3, '严重损坏房': 3, '红': 3,
        '第二类': 2, '存在一定安全隐患': 2, '一定安全隐患': 2, '一般隐患': 2, '带轻微瑕疵': 2, '一般损坏房': 2, '黄': 2,
        '第一类': 1, '未发现安全隐患': 1, '完好房(基本完好房)': 1, '安全': 1, '无风险': 1, '蓝': 1
    };

    function normalizeStructureType(v) {
        const s = String(v || '');
        if (!s) return '其他';
        if (s.includes('砖木')) return '砖木';
        if (s.includes('砖混') || s.includes('砌体')) return '砖混';
        if (s.includes('钢') || s.includes('框架')) return '钢结构';
        if (s.includes('混杂') || s.includes('土木')) return '混杂结构';
        if (s.includes('木')) return '木结构';
        if (s.includes('其他')) return '其他';
        return '其他';
    }

    function generateHazardRowsFromRecords() {
        if (typeof initHouseArchSeed !== 'function' || typeof getAllHouseRecords !== 'function') return [];
        initHouseArchSeed();
        const records = getAllHouseRecords().filter(r => (r.houseType || r.category) === '农村自建房');
        const rows = [];
        records.forEach((rec, idx) => {
            // 隐患清单来源于巡查发现的隐患：无发现隐患记录的房屋不进列表；
            // 隐患等级为“未发现安全隐患”（第一类）的条目也不属于隐患，剔除
            if (!rec.hazards || !rec.hazards.length) return;
            const hazards = rec.hazards.filter(h => (LEVEL_RANK[h.level] || 0) >= 2);
            if (!hazards.length) return;
            const source = SOURCE_OPTIONS[idx % SOURCE_OPTIONS.length];
            const reportTime = rec.inspectionRecords && rec.inspectionRecords.length
                ? rec.inspectionRecords[0].reportTime || rec.inspectionRecords[0].checkDate + ' 09:00'
                : (rec.archiveRecords && rec.archiveRecords.length ? rec.archiveRecords[0].archiveTime + ' 09:00' : '2025-06-01 09:00');
            const dutyUnit = rec.responsibleDept || (rec.street + '城建中心');
            const dutyPerson = rec.responsiblePerson || rec.owner;

            // 房屋风险等级：原始评定等级（销号房屋保留原级）与全部隐患最高等级取高者
            let topRiskLevel = rec.riskDisplayLevel || rec.riskLevel || '第一类';
            hazards.forEach(h => {
                if ((LEVEL_RANK[h.level] || 0) > (LEVEL_RANK[topRiskLevel] || 0)) topRiskLevel = h.level;
            });
            hazards.forEach((h, hIdx) => {
                const hazardNo = rec.no + '-H' + (hIdx + 1);
                const hazardType = HAZARD_TYPE_MAP[h.part] || '结构隐患';
                const level = h.level || rec.riskLevel || '第二类';
                const status = mapHazardStatus(rec, h);
                const name = rec.name + ' ' + h.part + h.type;
                rows.push({
                    id: rec.no + '-' + hIdx,
                    hzIdx: hIdx,
                    hazardNo: hazardNo,
                    hazardName: name,
                    hazardType: hazardType,
                    hazardLevel: level,
                    address: rec.address,
                    community: rec.community,
                    source: h.source || source,
                    reporter: rec.owner,
                    dutyUnit: dutyUnit,
                    dutyPerson: dutyPerson,
                    reportTime: h.reportTime || reportTime,
                    ownerName: rec.owner,
                    status: status,
                    houseNo: rec.no,
                    riskLevel: topRiskLevel,
                    structureType: normalizeStructureType((rec.structure && rec.structure.structureType) || rec.category),
                    street: rec.street || '',
                    taskId: h._taskId || '',
                    taskSourced: !!h._taskId
                });
            });
        });
        return rows;
    }

    function renderBadge(level) {
        const cls = mapRiskClass(level);
        return `<span class="risk-badge ${cls}">${getHazardLevelDisplay(level)}</span>`;
    }

    // 风险等级列：显示为 第一类/第二类/第三类（与隐患等级措辞对应，颜色同口径）
    function getRiskLevelDisplay(level) {
        const rank = LEVEL_RANK[level] || 0;
        if (rank === 3) return '第三类';
        if (rank === 2) return '第二类';
        if (rank === 1) return '第一类';
        return level || '—';
    }

    function renderRiskBadge(level) {
        const cls = mapRiskClass(level);
        return `<span class="risk-badge ${cls}">${getRiskLevelDisplay(level)}</span>`;
    }

    function getActionButtons(status, houseNo, taskSourced, hzIdx) {
        // 多隐患房屋：把隐患在档案中的索引带给流转页，保证各页展示、操作的是台账行对应的那条隐患
        const hz = (typeof hzIdx === 'number') ? '&hz=' + hzIdx : '';
        // 管理员视图：所有行只提供查看详情入口
        if (viewMode === 'admin') {
            return `<button class="action-link" onclick="window.location.href='rural-warning-detail.html?no=${houseNo}${hz}'">查看详情</button>`;
        }
        // 任务来源隐患：核实/分发/处置/验收在专项模块按任务打包办理，台账只提供查看
        if (taskSourced) {
            return `<button class="action-link" onclick="window.location.href='rural-warning-detail.html?no=${houseNo}${hz}'">查看</button>`;
        }
        const s = status.key;
        const detail = `<button class="action-link" onclick="window.location.href='rural-warning-detail.html?no=${houseNo}${hz}'">查看</button>`;
        if (s === 'pending-audit') {
            return `<button class="action-link" onclick="window.location.href='rural-warning-audit.html?no=${houseNo}${hz}'">核实</button>`;
        }
        if (s === 'pending-dispatch') {
            return `<button class="action-link" onclick="window.location.href='rural-warning-dispatch.html?no=${houseNo}${hz}'">分发</button>`;
        }
        if (s === 'handling') {
            return `<button class="action-link" onclick="window.location.href='rural-warning-handle.html?no=${houseNo}${hz}'">处置</button>`;
        }
        if (s === 'pending-accept') {
            return `<button class="action-link" onclick="window.location.href='rural-warning-acceptance.html?no=${houseNo}${hz}'">验收</button>`;
        }
        // 已销号等终态：仅提供"查看"（进入 detail 纯查看页）
        return detail;
    }

    // ===== 调度任务未读徽标（专家/机构已分派或已反馈） =====
    let dispatchUnreadByHouse = {};
    function getDispatchReadSet() {
        try { return JSON.parse(localStorage.getItem('dispatchReadCodes') || '[]'); } catch (e) { return []; }
    }
    function loadDispatchUnreadBadges() {
        fetch('/api/dispatch-tasks')
            .then(function(r) { return r.json(); })
            .then(function(list) {
                if (!Array.isArray(list)) return;
                const read = getDispatchReadSet();
                const map = {};
                list.forEach(function(t) {
                    if (!t.sourceHouseNo || !t.code) return;
                    if (['assigned', 'feedback', 'rejected'].indexOf(t.status) === -1) return;
                    if (read.indexOf(t.code) !== -1) return;
                    const hint = t.status === 'assigned' ? '专家/机构已分派' : (t.status === 'feedback' ? '专家/机构已反馈结果' : '申请已被驳回');
                    const shortText = t.status === 'assigned' ? '已分派' : (t.status === 'feedback' ? '已反馈' : '已驳回');
                    // 同一房屋多条取最新（feedback/rejected 优先）
                    const cur = map[t.sourceHouseNo];
                    if (!cur || cur.status === 'assigned' || (t.createTime || '') >= (cur.createTime || '')) {
                        map[t.sourceHouseNo] = { code: t.code, status: t.status, hint: hint, shortText: shortText, createTime: t.createTime || '' };
                    }
                });
                dispatchUnreadByHouse = map;
                renderTable();
            })
            .catch(function() {});
    }

    // 关联任务列：任务来源隐患可点击跳任务详情，隐患标注来源
    function renderTaskCell(row) {
        if (!row.taskId) return '<span style="color:var(--text-secondary);font-size:12px;">隐患上报</span>';
        const name = taskNameMap[String(row.taskId)] || ('任务 ' + row.taskId);
        return `<a href="rural-risk-task-detail.html?id=${encodeURIComponent(row.taskId)}" style="color:var(--primary);text-decoration:none;" title="查看关联任务">${name}</a>`;
    }

    function renderTable() {
        const tbody = document.getElementById('hazard-table-body');
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageRows = filteredHazards.slice(start, start + PAGE_SIZE);
        tbody.innerHTML = '';
        pageRows.forEach(row => {
            const tr = document.createElement('tr');
            tr.dataset.status = row.status.key;
            // 管理员视图下状态标签显示为阶段文案，但 data-status 仍保留原始 key
            const statusLabel = viewMode === 'admin' ? (ADMIN_STAGE_LABELS[row.status.label] || row.status.label) : row.status.label;
            const unread = (row.status.key === 'pending-audit' || row.status.key === 'pending-dispatch') ? dispatchUnreadByHouse[row.houseNo] : null;
            const unreadBadge = unread ? ` <span class="dispatch-unread-badge${unread.status === 'assigned' ? ' badge-assigned' : ''}" title="${unread.hint}，点击进入核实页查看"><i class="fa-solid fa-circle"></i>${unread.shortText}</span>` : '';
            tr.innerHTML = `
                <td>${row.hazardName}</td>
                <td>${row.hazardType}</td>
                <td>${renderBadge(row.hazardLevel)}</td>
                <td>${renderRiskBadge(row.riskLevel)}</td>
                <td>${row.structureType}</td>
                <td>${row.address}</td>
                <td>${row.source}</td>
                <td>${renderTaskCell(row)}</td>
                <td>${formatDateTime(row.reportTime)}</td>
                <td>${row.ownerName}</td>
                <td><span class="status-tag ${row.status.cls}">${statusLabel}</span>${unreadBadge}</td>
                <td><div class="actions">${getActionButtons(row.status, row.houseNo, row.taskSourced, row.hzIdx)}</div></td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById('page-info').textContent = `共 ${filteredHazards.length} 条，每页 ${PAGE_SIZE} 条`;
        renderPagination();
    }

    function renderPagination() {
        const totalPages = Math.max(1, Math.ceil(filteredHazards.length / PAGE_SIZE));
        const container = document.getElementById('page-numbers');
        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
            } else if (i === currentPage - 2 || i === currentPage + 2) {
                html += `<span style="color:var(--text-secondary);padding:0 4px">...</span>`;
            }
        }
        container.innerHTML = html;
        document.getElementById('page-prev').disabled = currentPage <= 1;
        document.getElementById('page-next').disabled = currentPage >= totalPages;

        container.querySelectorAll('button[data-page]').forEach(btn => {
            btn.addEventListener('click', function() {
                currentPage = parseInt(this.dataset.page, 10);
                renderTable();
            });
        });
    }

    function filterRows() {
        const addressVal = document.getElementById('filter-address').value.trim();
        const levelVal = document.getElementById('filter-level').value;
        const riskVal = document.getElementById('filter-risk').value;
        const statusVal = document.getElementById('filter-status').value;
        const structureVal = document.getElementById('filter-structure').value;
        const sourceVal = document.getElementById('filter-source').value;
        const streetVal = document.getElementById('filter-street').value;
        const communityVal = document.getElementById('filter-community').value;
        const dateStart = document.getElementById('filter-date-start').value;
        const dateEnd = document.getElementById('filter-date-end').value;

        filteredHazards = allHazards.filter(row => {
            if (currentTab !== 'all' && row.status.key !== currentTab) return false;
            if (addressVal && !row.hazardName.includes(addressVal) && !row.address.includes(addressVal)) return false;
            if (levelVal && row.hazardLevel !== levelVal) return false;
            if (riskVal && getRiskLevelDisplay(row.riskLevel) !== riskVal) return false;
            if (statusVal && row.status.label !== statusVal) return false;
            if (structureVal && row.structureType !== structureVal) return false;
            if (sourceVal === '__task__') { if (!row.taskSourced) return false; }
            else if (sourceVal && row.source !== sourceVal) return false;
            if (streetVal && row.street !== streetVal) return false;
            if (communityVal && row.community !== communityVal) return false;
            const d = String(row.reportTime || '').slice(0, 10);
            if (dateStart && d < dateStart) return false;
            if (dateEnd && d > dateEnd) return false;
            return true;
        });
        currentPage = 1;
        updateTabCounts();
        renderTable();
    }

    function updateTabCounts() {
        const counts = {
            all: allHazards.length,
            'pending-audit': 0,
            'pending-dispatch': 0,
            handling: 0,
            'pending-accept': 0,
            closed: 0
        };
        allHazards.forEach(row => { if (counts[row.status.key] !== undefined) counts[row.status.key]++; });
        Object.keys(counts).forEach(k => {
            const el = document.getElementById('tab-count-' + k);
            if (el) el.textContent = counts[k];
        });

        const levelCounts = { '重大隐患': 0, '较大隐患': 0, '一般隐患': 0, '第三类': 0, '第二类': 0, '第一类': 0, '安全': 0, '无风险': 0 };
        allHazards.forEach(row => {
            if (levelCounts[row.hazardLevel] !== undefined) levelCounts[row.hazardLevel]++;
        });
        document.getElementById('kpi-major').textContent = levelCounts['重大隐患'] + levelCounts['较大隐患'] + levelCounts['第三类'];
        document.getElementById('kpi-general').textContent = levelCounts['一般隐患'] + levelCounts['第二类'];
    }

    function switchStatusTab(tabBtn) {
        document.querySelectorAll('.status-tabs .tab-item').forEach(btn => btn.classList.remove('active'));
        tabBtn.classList.add('active');
        currentTab = tabBtn.dataset.tab;
        filterRows();
    }

    // 视图切换
    function applyViewMode(mode, pushState) {
        viewMode = mode;
        const isAdmin = mode === 'admin';

        // 切换按钮样式
        document.querySelectorAll('#view-mode-toggle .mode-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === mode);
        });

        // Banner 显示/隐藏
        const banner = document.getElementById('admin-banner');
        if (banner) banner.classList.toggle('show', isAdmin);

        // Tab 文案
        document.querySelectorAll('#status-tabs .tab-label').forEach(el => {
            if (el.dataset.business === '全部') {
                el.textContent = '全部';
            } else {
                el.textContent = isAdmin ? el.dataset.admin : el.dataset.business;
            }
        });

        // 表头“操作”/“详情”
        const thAction = document.getElementById('th-action');
        if (thAction) thAction.textContent = isAdmin ? '详情' : '操作';

        // 筛选区标签与选项文案
        const statusLabel = document.getElementById('filter-status-label');
        if (statusLabel) statusLabel.textContent = isAdmin ? '流转阶段' : '处理状态';
        const statusSelect = document.getElementById('filter-status');
        if (statusSelect) {
            Array.from(statusSelect.options).forEach(opt => {
                if (opt.value && ADMIN_STAGE_LABELS[opt.value]) {
                    opt.textContent = isAdmin ? ADMIN_STAGE_LABELS[opt.value] : opt.value;
                }
            });
        }

        // 更新 URL，方便菜单直接定位管理员视图
        if (pushState !== false) {
            const url = new URL(window.location.href);
            if (isAdmin) url.searchParams.set('view', 'admin');
            else url.searchParams.delete('view');
            window.history.replaceState({}, '', url.toString());
        }

        renderTable();
    }

    document.querySelectorAll('#view-mode-toggle .mode-btn').forEach(btn => {
        btn.addEventListener('click', function() { applyViewMode(this.dataset.mode); });
    });

    // 初始化视图：优先 URL ?view=admin
    function initViewMode() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('view') === 'admin') {
            applyViewMode('admin', false);
        } else {
            applyViewMode('business', false);
        }
    }

    document.querySelectorAll('.status-tabs .tab-item').forEach(btn => {
        btn.addEventListener('click', function() { switchStatusTab(this); });
    });

    document.getElementById('btn-search').addEventListener('click', filterRows);
    document.getElementById('btn-reset').addEventListener('click', function() {
        document.getElementById('filter-address').value = '';
        document.getElementById('filter-level').value = '';
        document.getElementById('filter-risk').value = '';
        document.getElementById('filter-structure').value = '';
        document.getElementById('filter-status').value = '';
        document.getElementById('filter-source').value = '';
        document.getElementById('filter-street').value = '';
        document.getElementById('filter-community').value = '';
        document.getElementById('filter-date-start').value = '';
        document.getElementById('filter-date-end').value = '';
        filterRows();
    });

    document.getElementById('page-prev').addEventListener('click', function() {
        if (currentPage > 1) { currentPage--; renderTable(); }
    });
    document.getElementById('page-next').addEventListener('click', function() {
        const totalPages = Math.ceil(filteredHazards.length / PAGE_SIZE);
        if (currentPage < totalPages) { currentPage++; renderTable(); }
    });

    // init
    initViewMode();
    allHazards = generateHazardRowsFromRecords().filter(row => row.source !== '物联自动上报' && row.source !== '专家研判');
    // 补充 2 条“待验收”模拟数据（源数据中的待验收记录因来源被过滤，这里手动补入）
    allHazards.push(
        {
            id: 'NF-2025-00022-0',
            hazardNo: 'NF-2025-00022-H1',
            hazardName: '明星村66号 房屋结构安全隐患',
            hazardType: '结构隐患',
            hazardLevel: '第二类',
            address: '上海市奉贤区西渡街道明星村66号',
            community: '明星村',
            source: '巡查人员上报',
            reporter: '王五',
            dutyUnit: '西渡街道城建中心',
            dutyPerson: '张工',
            reportTime: '2025-06-10 09:00',
            ownerName: '王五',
            status: { key: 'pending-accept', label: '待验收', cls: 'accept' },
            houseNo: 'NF-2025-00022',
            riskLevel: '第二类',
            structureType: '砖混',
            street: '西渡街道'
        },
        {
            id: 'NF-2025-00080-0',
            hazardNo: 'NF-2025-00080-H1',
            hazardName: '环城社区240号 外墙瓷砖脱落',
            hazardType: '外围隐患',
            hazardLevel: '第二类',
            address: '上海市奉贤区奉城镇环城社区240号',
            community: '环城社区',
            source: '排查发现',
            reporter: '李四',
            dutyUnit: '奉城镇城建中心',
            dutyPerson: '陈工',
            reportTime: '2025-06-15 14:30',
            ownerName: '李四',
            status: { key: 'pending-accept', label: '待验收', cls: 'accept' },
            houseNo: 'NF-2025-00080',
            riskLevel: '第二类',
            structureType: '砖木',
            street: '奉城镇'
        }
    );
    // 默认按状态分流：待核实(pending) -> 待核实；处置中(doing/overdue) -> 处置中；完成(done) -> 待验收；销号 -> 已销号；驳回 -> 已驳回
    // 将部分“待核实”状态再分流为“待分发”，使5个tab都有数据：按序号奇偶
    let dispatchIdx = 0;
    allHazards.forEach((row, idx) => {
        if (row.status.key === 'pending-audit' && idx % 7 === 0) {
            row.status = { key: 'pending-dispatch', label: '待分发', cls: 'dispatch' };
            dispatchIdx++;
        }
    });
    // 模拟部分已销号数据：将部分“待验收”状态改为“已销号”（每 3 条取 1 条，但保留前 2 条作为待验收演示数据）
    let acceptIdx = 0;
    allHazards.forEach((row, idx) => {
        if (row.status.key === 'pending-accept') {
            acceptIdx++;
            if (acceptIdx > 2 && acceptIdx % 3 === 1) {
                row.status = { key: 'closed', label: '已销号', cls: 'closed' };
                // 同步把 closeStatus='已通过' 写回数据层，供 detail 页流转图识别
                if (typeof getHouseRecord === 'function' && typeof setHouseRecord === 'function') {
                    const rec = getHouseRecord(row.houseNo);
                    if (rec && rec.closeStatus !== '已通过') {
                        rec.closeStatus = '已通过';
                        setHouseRecord(row.houseNo, rec);
                    }
                }
            }
        }
    });
    loadTaskNameMap();
    populateRegionFilters();
    filteredHazards = allHazards.slice();
    updateTabCounts();
    renderTable();
    loadDispatchUnreadBadges();
})();

// 动态测量"操作"列实际宽度，写入 CSS 变量，让"状态"列与之无缝拼接
function syncStickyColWidth() {
    var table = document.querySelector('.data-table');
    if (!table) return;
    var lastTh = table.querySelector('thead th:last-child');
    if (!lastTh) return;
    var w = lastTh.getBoundingClientRect().width;
    table.style.setProperty('--last-col-w', w + 'px');
}
window.addEventListener('load', syncStickyColWidth);
window.addEventListener('resize', syncStickyColWidth);
// 表格渲染后再校一次（数据异步/字体加载可能引起宽度变化）
if (document.readyState === 'complete' || document.readyState === 'interactive') {
    setTimeout(syncStickyColWidth, 0);
} else {
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(syncStickyColWidth, 0); });
}
</script>



<script>
// ===== 隐患登记（群众举报等渠道入口） =====
(function() {
    const SP_TYPES = ['场地周边安全风险','房屋整体沉降倾斜','房屋塌陷变形','使用不当隐患','墙体开裂变形','楼面开裂变形','梁柱开裂变形','楼梯损伤变形','阳台开裂变形','其他安全问题'];
    let spSelectedHouse = null;

    function fillSelect(id, items, placeholder) {
        const sel = document.getElementById(id);
        sel.innerHTML = (placeholder ? `<option value="">${placeholder}</option>` : '') + items.map(v => `<option>${v}</option>`).join('');
    }
    function nextAcceptNo() {
        const d = new Date();
        const ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
        const seq = parseInt(localStorage.getItem('sporadicAcceptSeq') || '0', 10) + 1;
        localStorage.setItem('sporadicAcceptSeq', String(seq));
        return 'SL' + ymd + '-' + String(seq).padStart(3, '0');
    }
    function spOpen() {
        fillSelect('sp-type', SP_TYPES, null);
        document.getElementById('sp-accept-no').value = nextAcceptNo();
        document.getElementById('sp-modal').classList.add('show');
    }
    function spReset() {
        spSelectedHouse = null;
        ['sp-reporter','sp-phone','sp-search','sp-part','sp-desc'].forEach(id => { document.getElementById(id).value = ''; });
        document.getElementById('sp-channel').value = '群众举报';
        document.getElementById('sp-level').value = '第二类';
        document.getElementById('sp-results').innerHTML = '';
        const s = document.getElementById('sp-selected');
        s.style.display = 'none'; s.innerHTML = '';
        document.getElementById('sp-photos').value = '';
    }
    function spClose() { document.getElementById('sp-modal').classList.remove('show'); spReset(); }
    function spSearch(kw) {
        const box = document.getElementById('sp-results');
        if (!kw || typeof getAllHouseRecords !== 'function') { box.innerHTML = ''; return; }
        const list = getAllHouseRecords()
            .filter(r => (r.houseType || r.category) === '农村自建房')
            .filter(r => [r.no, r.name, r.address, r.owner].some(v => String(v || '').includes(kw)))
            .slice(0, 8);
        box.innerHTML = list.map(r =>
            `<div class="sp-result-item" data-no="${r.no}"><b>${r.no}</b> ${r.name}｜${r.address}｜产权人：${r.owner || '-'}</div>`
        ).join('') || '<div class="sp-result-empty">无匹配房屋</div>';
        box.querySelectorAll('.sp-result-item').forEach(el => {
            el.addEventListener('click', function() {
                spSelectedHouse = getHouseRecord(this.dataset.no);
                const s = document.getElementById('sp-selected');
                s.style.display = 'block';
                s.innerHTML = `<b>${spSelectedHouse.no}</b> ${spSelectedHouse.name}｜${spSelectedHouse.address}｜${(spSelectedHouse.structure && spSelectedHouse.structure.structureType) || spSelectedHouse.category || ''}`;
                box.innerHTML = '';
                document.getElementById('sp-search').value = '';
            });
        });
    }
    function spSave() {
        if (!spSelectedHouse) { alert('请先搜索并选择房屋'); return; }
        const part = document.getElementById('sp-part').value.trim();
        if (!part) { alert('请填写隐患部位'); return; }
        const channel = document.getElementById('sp-channel').value || '群众举报';
        const acceptNo = document.getElementById('sp-accept-no').value;
        const files = document.getElementById('sp-photos').files;
        const photoNames = files && files.length ? Array.from(files).map(f => f.name) : [];
        const now = new Date();
        const ts = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0')
            + ' ' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        patchHouseRecord(spSelectedHouse.no, function(rec) {
            if (!Array.isArray(rec.hazards)) rec.hazards = [];
            rec.hazards.push({
                part: part,
                type: document.getElementById('sp-type').value || '其他安全问题',
                level: document.getElementById('sp-level').value || '第二类',
                desc: document.getElementById('sp-desc').value.trim(),
                photos: photoNames,
                reportTime: ts,
                source: channel,
                _sporadic: true,
                acceptNo: acceptNo,
                reporter: document.getElementById('sp-reporter').value.trim(),
                reporterPhone: document.getElementById('sp-phone').value.trim()
            });
            // 重置房屋级流转起点，使隐患进入 核实→分发→处置→验收 流程
            // governance 与 governStatus 必须同步改：normalize 会优先用 governStatus 反推 governance
            rec.governance = 'pending';
            rec.governStatus = '待整治';
            rec.auditStatus = '待审核';
            rec.closeStatus = '';
        });
        alert('登记成功，受理编号：' + acceptNo + '\n该隐患已进入待核实队列。');
        // 等待服务端写盘完成再刷新：POST 是异步的，立即 reload 会取消请求，
        // 刷新后服务端旧数据会整条覆盖本地刚登记的隐患（服务端优先合并）
        const done = function() { location.reload(); };
        if (typeof flushHouseArchToServer === 'function') {
            flushHouseArchToServer().then(done, done);
        } else {
            done();
        }
    }

    document.getElementById('btn-register').addEventListener('click', spOpen);
    document.getElementById('sp-close-x').addEventListener('click', spClose);
    document.getElementById('sp-cancel').addEventListener('click', spClose);
    document.getElementById('sp-save').addEventListener('click', spSave);
    document.getElementById('sp-search').addEventListener('input', function() { spSearch(this.value.trim()); });
    document.getElementById('sp-modal').addEventListener('click', function(e) { if (e.target === this) spClose(); });
})();
</script>
